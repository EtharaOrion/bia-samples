schema_version = "1.4"

artifacts = [
  "/workspace/refine.py",
]

[task]
name = "bia/track3-sustained-refinement"
version = "1.0.0"
description = "Refine an optimizer recipe that reaches 4.55 val loss on the frozen track-3 substrate in fewest steps."
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "sustained-refinement"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
family = "F1"
family_title = "nanogpt optimizer speedrun"
slot = "OER-02"
provisional_identifier = "OER-02"
archetype = "sustained-refinement"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

metric = "optimizer steps to reach target validation loss"
metric_direction = "lower"

score_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
score_range = [0.0, 1.0]
score_full = 1.0
score_full_rule = "reaching the target scores exactly 1.0 and beating it also scores 1.0; the target is a bar, not a point on a gradient"
score_formula = "crossed: score = 0.4 + 0.6 * clip((baseline_metric - agent_metric) / (baseline_metric - target_metric), 0, 1); not crossed: score = 0.4 * clip((no_progress_loss - final_val_loss) / (no_progress_loss - target_loss), 0, 1)"
score_path = "/logs/verifier/score.md"
score_numeric_document_path = "/logs/verifier/score_numeric.json"
score_document_path = "/logs/verifier/score.json"
score_higher_is_better = true
score_binary = false

network_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
network_deny_reason = "The published record lineage is the primary contamination carrier for this task family. A deny-list is not a containment proof."

[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.12
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
budget_seconds_per_attempt = 432.0
budget_total_seconds = 21600.0
max_attempts = 50
max_attempts_ceiling = 100
final_selection = "best"
final_selection_k = 50
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "none in the training envelope: 50 x budget_seconds_per_attempt = 21600 s = max_timeout_hours exactly. That arithmetic covers the graded training only. It is not a promise of fifty completed attempts, because a trial also pays environment setup, agent setup, the agent phase and the verifier phase on top of the training bound."
attempt_bound_semantics = "max_attempts is a ceiling, not a target and not a guaranteed count. The delivered campaign is whatever attempt count completes inside max_timeout_hours."
binding_bound = "metadata.optimization.max_timeout_hours. At measured whole-trial cost the six-hour terminator trips before the fifty-attempt ceiling in both delivered cohorts."
attempts_observed = "claude-opus-5 20 attempts in 11959 s (3.32 h); gpt-5.6-sol 30 attempts in 20336 s (5.65 h). Both inside the 21600 s terminator."
attempts_reachable_at_observed_cost = "36 for claude-opus-5, 31 for gpt-5.6-sol, against a ceiling of 50. The shortfall is per-trial overhead outside the training bound, not a budget breach."
compute_envelope_accelerators = 1

[metadata.refinement]
loop = "the harness lets the agent solve and submit, grades the submission, summarizes the trajectory, and starts the next iteration with that summary"
running_context = "every prior approach and its score"
terminator = "metadata.optimization.max_timeout_hours or metadata.optimization.max_attempts, whichever trips first"
per_attempt_bound = "metadata.optimization.budget_hours"
summary_owner = "verifier"
summary_freshness = "recomputed from the recorded attempt ledger at every iteration boundary"

[metadata.resources]
gpu = "1x H100, single accelerator, no multi-GPU scaling. The batch is fixed at environment/shape.json batch_tokens_per_step and is served by the verifier's own loader, so device count moves wall clock and never step count."

[environment]
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 40960
network_mode = "public"

env = { PYTHONDONTWRITEBYTECODE = "1", BIA_ROLE = "agent", BIA_SPLIT = "dev" }

[verifier]
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/bia@sha256:0d4f3ad753e79be374a82fd0814adb73724e72650fc2afc83b13fd55796a094e"
image_definition_path = "tests/"
timeout_sec = 18000.0
environment_mode = "shared"
egress = "record-only; the enforced value is network_mode below"
network_mode = "no-network"
val_shard_mount = "not-a-mount, split by corpus region, see environment/bia_data.py SPLIT_REGIONS"
eval_schedule_owner = "verifier"

[agent]
solver_egress = "record-only; enforced value is network_mode = public below"
solver_egress_deny_advisory = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
timeout_sec = 300.0
network_mode = "public"
