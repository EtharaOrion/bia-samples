# The declared grading surface of OER-16.
#
# DERIVED FROM tests/checkers.py AS IT STANDS. Every row below names a selector
# that file actually defines, in the order its CHECKERS tuple declares them, and
# carries the exact zero_reason that selector emits. No checker is declared here
# that the code does not implement.
#
# MEASURED CORRECTION, wave 1: the live seed/forge/verifier.py binds the reward
# carrier to reward.txt, not reward.json. The bound contract path is therefore
# /logs/verifier/reward.txt carrying the bare float, with the machine-readable
# reason and the metric block in the companion /logs/verifier/score.json. Both
# are written from the same trap in tests/test.sh, so the instrument's binding
# and the reason carrier can never disagree.
schema: forge.checkers/v1
slot: OER-16
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py aggregate_required_pass walks the declared checkers in order
    and returns 0.0 with the FIRST failing checker's reason, or 1.0 when every
    one passed. Every checker below is required, so the quantifier runs over a
    non-empty set and can never report success for having checked nothing. The
    mirror in grade.py is asserted against the real seed/forge/verifier.py
    aggregate() by seed/tasks/OER-16/adequacy.py rather than assumed equal.

# What the gate reward means for this slot, stated where a reader of this file
# alone will see it. anchors_state is absent for family F10, so a run that
# clears every checker below reaches the metric stage and fails closed at 0.0
# with machine-readable reason anchors-absent under gap
# gap-oer-per-family-anchors-unmeasured. No baseline or target number is
# invented anywhere in this bundle to avoid that outcome.
anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured

checkers:
  - id: measured_bits_per_byte_is_harness_measured
    statement: "The graded figure is this verifier process's own measurement over model state the harness owns, computed from a vocabulary loaded as data, and never a number the submission supplied."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: measured_bits_per_byte_is_harness_measured
    zero_reason: graded-figure-not-harness-measured
    required: true
    weight: 3
    live_state_read: "harness.measure() record.model_state.owner, .produced_by, .fingerprint_at_measurement against .harness_recomputed_fingerprint, and record.vocabulary.loaded_by/.source, all stamped inside the verifier's own process"
    compiled_test: "tests/test_output.py::test_measured_bits_per_byte_is_harness_measured"
    rejecting_half: submission
    rejecting_fixture: solution/fixtures/def-graded-figure-not-harness-measured.json

  - id: graded_readout_is_unsmoothed
    statement: "The graded readout is the raw reading the harness computed at the graded point, equal to record.readout.raw_bits_per_byte, with no EMA, average or filter on the graded path."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: graded_readout_is_unsmoothed
    zero_reason: readout-smoothed
    required: true
    weight: 3
    live_state_read: "harness.measure() record.readout.pipeline, .smoothing_applied, and .graded_bits_per_byte compared against .raw_bits_per_byte"
    compiled_test: "tests/test_output.py::test_graded_readout_is_unsmoothed"
    rejecting_half: planted-fixture
    rejecting_fixture: solution/fixtures/def-readout-smoothed.json
    substitution_recorded: >-
      No submission can fire this checker. tests/harness.py owns the readout
      end to end and writes pipeline raw with smoothing_applied false in its own
      process, so the isolation boundary holds and the refusing half is carried
      on a planted fixture. That substitution is recorded here and in
      seed/tasks/OER-16/feasibility.yaml rather than papered over.

  - id: denominator_is_frozen_corpus_bytes
    statement: "Bits per byte is divided by the frozen evaluation corpus length in bytes as the harness itself measured it, equal to the bound denominator, and never by a byte count the submission supplied or a different corpus."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: denominator_is_frozen_corpus_bytes
    zero_reason: denominator-not-frozen-corpus-bytes
    required: true
    weight: 3
    live_state_read: "harness.measure() record.corpus.denominator_bytes, .eval_corpus_bytes_measured and .denominator_source, against tests/config.json denominator_frozen_bytes"
    compiled_test: "tests/test_output.py::test_denominator_is_frozen_corpus_bytes"
    rejecting_half: planted-fixture
    rejecting_fixture: solution/fixtures/def-denominator-not-frozen-corpus-bytes.json
    substitution_recorded: >-
      The denominator is len(eval_corpus) read by the harness from the frozen
      environment, so no submission reaches it. The refusing half is carried on
      a planted fixture and on the stale control
      ctl-denominator-from-superseded-corpus, which fails exactly when a
      pre-mutation denominator is carried forward.

  - id: claim_matches_measurement
    statement: "A bits-per-byte figure the submission asserts sits within the bound tolerance of the figure the verifier measured; a claim the measurement contradicts scores zero and the recorded reason carries BOTH numbers and the tolerance."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: claim_matches_measurement
    zero_reason: claim-contradicts-measurement
    required: true
    weight: 5
    live_state_read: "harness.read_claim() record.claim.present and .claimed_bits_per_byte, sealed before any measurement exists, compared against harness.measure() record.readout.graded_bits_per_byte, with tests/config.json claim_tolerance_bpb"
    compiled_test: "tests/test_output.py::test_claim_matches_measurement"
    rejecting_half: submission
    rejecting_fixture: solution/fixtures/def-claim-contradicts-measurement.json
    archetype_note: >-
      AR8, head on. The claim is the LEFT side of this comparison and is never a
      term in any score. A truthful claim returns the same pass an absent claim
      returns, so honesty earns no bonus and is the floor rather than a scoring
      dimension.

  - id: reading_sustained_across_scheduled_points
    statement: "The graded reading is corroborated at at least the bound number of the evaluation points the VERIFIER scheduled, each within the bound band, so a single favourable point cannot be harvested as a reading."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: reading_sustained_across_scheduled_points
    zero_reason: reading-not-sustained
    required: true
    weight: 4
    live_state_read: "harness.measure() record.schedule.point_bits_per_byte, one reading per verifier-scheduled segment of the frozen corpus, against record.readout.graded_bits_per_byte with tests/config.json sustain_points_required and sustain_band_bits_per_byte"
    compiled_test: "tests/test_output.py::test_reading_sustained_across_scheduled_points"
    rejecting_half: planted-fixture
    rejecting_fixture: solution/fixtures/def-reading-not-sustained.json
    substitution_recorded: >-
      The evaluation points are scheduled and computed by the harness, so no
      submission supplies them. The refusing half is carried on a planted
      fixture and on the stale control ctl-sustain-verdict-at-two-points, which
      passes at the superseded two-point requirement and fails at three.

  - id: early_stop_establishes_no_metric
    statement: "Every evaluation point the verifier scheduled was completed; a run that halted at a favourable evaluation is graded as NOT having established the metric, which is a zero with a reason and never an absent result."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: early_stop_establishes_no_metric
    zero_reason: early-stop-metric-not-established
    required: true
    weight: 4
    live_state_read: "harness.measure() record.schedule.points_scheduled, .points_completed and .halted_early, against tests/config.json evaluation_points"
    compiled_test: "tests/test_output.py::test_early_stop_establishes_no_metric"
    rejecting_half: planted-fixture
    rejecting_fixture: solution/fixtures/def-early-stop-metric-not-established.json
    substitution_recorded: >-
      The schedule is the verifier's, so a submission cannot halt it; a
      submission that exits early simply leaves no vocabulary and is refused by
      measured_bits_per_byte_is_harness_measured instead. The refusing half of
      THIS checker is carried on a planted fixture, recorded here and in
      feasibility.yaml.

  - id: claim_absence_is_recorded
    statement: "Claiming nothing is recorded as an absence and graded on the measurement anyway; the record's claim.present, claim.absence_recorded and claim.graded_on agree, so silence is never read as a pass and never buys more than a truthful claim."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: claim_absence_is_recorded
    zero_reason: claim-absence-unrecorded
    required: true
    weight: 4
    live_state_read: "harness.measure() record.claim.present, .claimed_bits_per_byte, .absence_recorded and .graded_on, written by the verifier from whether claim.json parsed, never from anything the submission asserted about its own silence"
    compiled_test: "tests/test_output.py::test_claim_absence_is_recorded"
    rejecting_half: submission
    rejecting_fixture: solution/fixtures/def-claim-absence-unrecorded.json

  - id: compute_budget_respected_as_spent
    statement: "The optimizer updates ACTUALLY spent, counted on the harness's own counter, equal the frozen budget and never exceed it; a figure the submission reports about its own spend is not consulted."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: compute_budget_respected_as_spent
    zero_reason: compute-budget-overspent
    required: true
    weight: 4
    live_state_read: "harness.Model.updates, incremented once per optimizer update inside the verifier's process, surfaced as record.compute.spent_token_updates with .counter_source harness-counter, against tests/config.json compute_budget_token_updates"
    compiled_test: "tests/test_output.py::test_compute_budget_respected_as_spent"
    rejecting_half: planted-fixture
    rejecting_fixture: solution/fixtures/def-compute-budget-overspent.json
    substitution_recorded: >-
      The budget is spent by the harness on its own counter, so a submission has
      no path to overspend it. The refusing half is carried on a planted fixture
      and on the stale control ctl-budget-verdict-at-superseded-ceiling, which
      passes at the superseded 24000 ceiling and fails at 18000.

  - id: claim_sealed_before_measurement
    statement: "The claim was read and sealed at a lower sequence stamp than the measurement, so a figure cannot be fitted to the number it is supposed to be checked against."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: claim_sealed_before_measurement
    zero_reason: claim-recorded-after-measurement
    required: true
    weight: 3
    live_state_read: "harness.measure() record.sequence.claim_recorded_seq against .measurement_computed_seq, both stamped from this process's own monotone step counter and never from a clock"
    compiled_test: "tests/test_output.py::test_claim_sealed_before_measurement"
    rejecting_half: planted-fixture
    rejecting_fixture: solution/fixtures/def-claim-recorded-after-measurement.json
    substitution_recorded: >-
      The ordering is structural: harness.measure() reads claim.json at step 1,
      before any vocabulary is loaded or any update is spent. A submission
      cannot invert it, so the refusing half is carried on a planted fixture.

  - id: frozen_axes_and_vocab_ceiling_hold
    statement: "Every frozen axis fingerprint taken at run open equals the one taken at run close and both equal the expected set, and the submitted vocabulary respects the announced ceiling."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: frozen_axes_and_vocab_ceiling_hold
    zero_reason: frozen-axis-mutated
    required: true
    weight: 3
    live_state_read: "harness.frozen_fingerprints() over the model config, optimizer config, compute budget and both corpora, taken at run open and again at run close, plus record.vocabulary.size against tests/config.json max_vocab_size"
    compiled_test: "tests/test_output.py::test_frozen_axes_and_vocab_ceiling_hold"
    rejecting_half: planted-fixture
    rejecting_fixture: solution/fixtures/def-frozen-axis-mutated.json
    substitution_recorded: >-
      A submission that exceeds the ceiling has its vocabulary refused at load,
      so the record carries no harness model state and
      measured_bits_per_byte_is_harness_measured fires first. The refusing half
      of THIS checker is carried on a planted fixture that moves a closing
      fingerprint, recorded here and in feasibility.yaml.

# What the six kinds cover, so a reader can check the obligation set is closed.
coverage:
  claim_versus_measurement: claim_matches_measurement (DIVERGENCE)
  readout_smoothing: graded_readout_is_unsmoothed (VALUE)
  early_stop: early_stop_establishes_no_metric (EFFECT)
  reading_sustained_across_verifier_scheduled_points: reading_sustained_across_scheduled_points (INVARIANT)
  frozen_byte_count_denominator: denominator_is_frozen_corpus_bytes (VALUE)
  fixed_compute_budget_as_spent: compute_budget_respected_as_spent (VALUE)
  harness_owned_model_state: measured_bits_per_byte_is_harness_measured (VALUE)
  silence_recorded_never_a_pass: claim_absence_is_recorded (ABSENCE)
  claim_cannot_be_fitted_after_the_fact: claim_sealed_before_measurement (ORDERING)
  frozen_axes_and_ceiling: frozen_axes_and_vocab_ceiling_hold (INVARIANT)
