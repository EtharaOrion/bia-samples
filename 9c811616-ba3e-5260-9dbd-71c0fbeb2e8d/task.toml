schema_version = "1.4"

# schema_version is a top-level scalar and must stay above the first table header.
# TOML scopes every key to the most recent header, so an assignment written below
# [task] silently becomes task.schema_version while still reading correct to a human.

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-22-calibration-set-drift"
version = "2.0.0"
description = "Reduce perplexity degradation of a quantized nanoGPT checkpoint at a fixed bit budget, where the calibration set the allocation is derived from drifts between allocation time and evaluation time and nothing announces the drift."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "quantization", "temporal-reasoning"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-22"
provisional_identifier = "OER-22"
title = "Calibration set drift between allocation and evaluation"
family = "F9"
family_title = "post-training quantization"
primary_archetype = "AR9"
primary_archetype_title = "Temporal Reasoning Gap"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."
maturity = "draft"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard by the standing batch-level Perception-axis exemption"
anchorable_tier_statement = "This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

# The re-base of batch OER-2026-08-20 replaced this slot's model and evaluation path
# rather than repinning a declaration. The prior revision graded closed-form arithmetic
# over a shipped per-tensor sensitivity vector and a stated reference perplexity, with
# no model and no forward pass anywhere on the graded path. What is quantized now IS
# the nanoGPT checkpoint of the canonical decoder, and the graded scalar is the
# verifier's own forward pass over a held-out FineWeb slice.
rebase = "OER-2026-08-20"
rebase_kind = "model-and-evaluation-path-replaced"
substrate_declaration = "environment/nanogpt_substrate.json"

[metadata.metric]
name = "perplexity degradation at a fixed bit budget"
direction = "lower"
definition = "ppl(quantized) minus ppl(unquantized reference), over the held-out FineWeb10B validation slice, averaged over every evaluation point the verifier schedules. Both perplexities are real forward passes of real parameters, computed by the verifier from its own pristine nanoGPT checkpoint under the submitted allocation. Never a number the submission reported or wrote."
frozen = ["the model, being the nanoGPT checkpoint of the architecture declared at environment/nanogpt_substrate.json", "the bit budget", "the evaluation corpus, being the held-out FineWeb validation folds the verifier owns", "the unquantized reference, being that same checkpoint evaluated unquantized"]
free = ["the per-tensor bit allocation", "the quantization scheme"]
producer = "tests/evaluate.py, verifier-owned"
undefined_without_forward_pass = true

[metadata.anchors]
state = "absent"
baseline_metric_bound = false
target_metric_bound = false
reward_schema_bound = true
reward_carrier = "/logs/verifier/reward.txt"
reward_score_document = "/logs/verifier/score.json"
reward_type = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
reward_full = 1.0
reward_formula_lower_is_better = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
reward_target_is_a_bar = "reaching the target scores exactly 1.0 and beating it also scores 1.0"
scale_points_state = "measured-in-run by the verifier through the same code path that measures the submission"
scale_points_are_not_family_anchors = true

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are explicitly distinct and never aliases.
# max_timeout_hours bounds the SESSION across attempts; it is the refinement-loop
# terminator. budget_hours bounds ONE attempt to completion, being six hours over
# fifty attempts, 0.12 hours or 7.2 minutes.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts, in hours"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound, in hours"
budget_hours_state = "provisional, and now provisional against a real forward pass rather than against a closed-form surrogate; declared under gap-oer-22-attempt-budget-unmeasured-against-real-forward-passes"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest, never a floating tag"
declaration = "environment/nanogpt_substrate.json"
substrate = "environment/substrate.json"
model = "environment/model.py"
bootstrap = "environment/bootstrap.py"
calibration_handle = "environment/calibration_probe.py"
checkpoint = "/workspace/checkpoint/nanogpt.pt"
checkpoint_state = "built at image build from the declaration and the pinned FineWeb10B train shards under a pinned seed; its content digest is established only in built environment state"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"
staged_corpus_split = "train"
held_out_split_absent_from_agent_image = true

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
deny_list_is_not_a_containment_proof = "Mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any deny-list. The deterministic checker chain is the load-bearing control."
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
never_imports_the_submission = true
admin_plane = "tests/bound.json"
held_out_split = "resolved from tests/bound.json holdout_root, pinned to the verifier's own copy, never from a solver-reachable call"
