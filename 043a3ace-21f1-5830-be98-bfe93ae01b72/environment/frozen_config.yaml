# FROZEN. Every value in this file is an axis the submission may not move.
# The curation filter chain applied to the source pool is the only free axis.
#
# The architecture, the batch size, the corpus and the one-forward-backward-per-step rule
# are the canonical nanoGPT operating point, replicated into this slot at
# environment/nanogpt_substrate.json. The verifier re-reads its OWN copy of that file at
# grading time, so editing the copy in this container produces a refused run carrying
# reason frozen-axis-moved rather than a different grade.

schema: oer.frozen_config/v1
slot: OER-09

substrate:
  declaration: environment/nanogpt_substrate.json
  declaration_version: nanogpt-substrate-v1
  upstream: modded-nanogpt records/track_3_optimization/
  # train.py refuses to start when any value under model: or budget.tokens_per_step
  # disagrees with the substrate declaration. The check is on shapes, not on names.
  enforced_by: environment/train.py

budget:
  # 800 optimizer steps at the canonical 524288 tokens per step. The evaluation schedule
  # below runs through point 800, so the budget covers exactly the scheduled run and not
  # one token more. The previous declaration of 3145728 tokens was six canonical steps and
  # never covered its own 800-point schedule; it was carried over from the surrogate.
  token_budget_tokens: 419430400
  tokens_per_step: 524288
  steps: 800
  fed_once: true
  overspend_is: token-budget-overspent

model:
  # The canonical nanoGPT decoder, read from environment/nanogpt_substrate.json
  # architecture. num_heads is model_dim // head_dim, so 768 // 128 is 6.
  arch: nanogpt-decoder
  layers: 12
  d_model: 768
  head_dim: 128
  heads: 6
  vocab: 50304
  context: 1024
  init_seed: 20260820

optimizer:
  name: adamw
  lr: 0.0006
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 60
  schedule: cosine
  grad_clip: 1.0
  one_forward_backward_per_step: true

corpus:
  collection: fineweb10B
  train_glob: data/fineweb10B/fineweb_train_*.bin
  container_train_path: /workspace/data/fineweb10B
  loader: data/cached_fineweb10B.py
  tokenizer: gpt-2 bpe over 50304 slots, uint16 little-endian token ids
  document_separator: 50256
  # How curation reaches the corpus. The trainer walks the train shards in document order
  # and admits corpus document i when register row (i mod 4096) survived the chain. A pool
  # that sheds rows therefore sheds corpus documents in the same proportion, and curation
  # changes which tokens are fed and nothing else. The rule is positional and total, so it
  # is recomputable by the harness from the curated pool alone.
  admission: stratified-by-register-row
  register_rows: 4096

evaluation:
  # The verifier-owned held-out FineWeb split. It is deliberately ABSENT from this
  # container: no shard matching split_shards is copied by environment/Dockerfile, and the
  # graded loss is the verifier's own recomputation over its own copy. The digest below is
  # an identity, not the split, and it is measured off the vendored shard rather than
  # asserted.
  split_id: fineweb10b-val-holdout
  split_owner: verifier
  split_shards: data/fineweb10B/fineweb_val_*.bin
  split_shard: fineweb_val_000000.bin
  split_digest: sha256:5b95c8e0966f0861685b307b23dc5ae42b228ef74b28cb499784ae021f201640
  split_present_in_environment: false
  # The canonical validation extent, 20 * 524288, read from train_gpt_simple.py line 248.
  val_tokens: 10485760
  # The verifier schedules these points itself. The bound point is the graded one; the
  # sustain points are re-tests the submission does not choose and cannot skip.
  bound_point: 600
  sustain_points: [700, 800]
  last_scheduled_point: 800
  readout_mode: raw
  smoothing_on_graded_path: false
  weights_owner: harness

register:
  # The register schema the harness observes at run time. environment/pool/REGISTER.md is
  # documentation and documentation drifts; this and the register bytes are the authority.
  schema: curation/v4
  quality_field: quality.bucket
  # A row carrying holdout true is reserved by the verifier. Its stratum must not reach the
  # fed stream, and a fed stream carrying one is graded eval-split-leaked.
  holdout_field: holdout
