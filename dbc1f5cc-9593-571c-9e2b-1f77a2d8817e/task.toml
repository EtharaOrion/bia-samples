# Harbor delivery manifest, slot OER-17, family F14.
#
# schema_version is a TOP-LEVEL scalar and is written above the first table header
# on purpose. TOML scopes every key to the most recent header, so an assignment
# written after `[task]` would silently become `task.schema_version` and leave the
# top-level scalar absent while the file still read correct to a human.
schema_version = "1.4"

multi_step_reward_strategy = "last"

# Graded deliverables, TOP-LEVEL list, above the first table header for the same
# scoping reason.
artifacts = [
  "/workspace/submission/packing.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-17-nanogpt-batch-geometry"
version = "2.0.0"
description = """
Shape a frozen token budget. The architecture, the initialisation, the token stream,
the optimizer, the learning-rate envelope and the number of training tokens are all
frozen; how those tokens are grouped into micro-batches and optimizer steps is free.
The graded figure is the verifier's own validation cross entropy, measured in the
verifier's process on a held-out FineWeb slice that is absent from the agent image,
at a fixed evaluation geometry. Reward is the fraction of the gap closed between two
anchors that are BOTH retrained from scratch on every grading run.
"""
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "batch-geometry"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-17"
provisional_identifier = "OER-17"
family = "F14"
family_title = "training-data delivery and batch composition"
title = "Sequence packing and batch composition at a frozen token budget"
archetype = "grader-integrity"
archetype_note = """
The archetype is unchanged from this slot's scope: every number that reaches the
reward is produced by the verifier's own process from bytes the verifier owns, and
nothing the submission reports about itself is read. What was replaced is the task
mechanics, not the grading discipline.
"""
frozen = "the architecture, the initialisation seed, the token stream, the token budget, the optimizer, the learning-rate envelope and its batch rule, and the evaluation geometry"
free = "the phase partition of the token budget, and per phase the micro-batch rows, the sequence length and the gradient accumulation"
metric = "validation cross entropy in nats on the verifier's held-out FineWeb slice at the frozen evaluation geometry"
metric_direction = "lower"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

[metadata.substrate]
declaration = "environment/frozen/task_spec.json"
verifier_copy = "tests/frozen/task_spec.json"
identity_enforced_at = "tests/Dockerfile, by cmp at image build over five files"
architecture = "vocab_size 50304, num_layers 6, model_dim 384, head_dim 64, num_heads 6, rotary positions, max_seq_len 1024"
budget = "16777216 training tokens, consumed in order from position 0 by every plan"
note = """
The decoder uses rotary position encoding, so it is defined at every sequence length
on the declared grid and the same frozen parameters serve every geometry a plan may
name. That is what makes the sequence length a free variable here rather than an
architectural constant.
"""

[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.5
budget_hours_role = "per-attempt completion bound"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = 10.0
compute_envelope_accelerators = 1

# The graded path is THREE from-scratch training runs plus three evaluations. The
# number below is MEASURED and not declared: it is grading_seconds from the verifier's
# own score.json on a container-gate run of this bundle. The three runs measured 47.0 s,
# 44.5 s and 44.4 s.
graded_path_seconds_measured = 137
graded_path_seconds_budget = 900

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 32768
gpus = 1
gpu_types = ["H100"]
workdir = "/app"
build_timeout_sec = 3600
network_mode = "public"

[agent]
submission_path = "/workspace/submission/packing.json"
network_mode = "none"
note = """
The corpus and every dependency are staged at image build, so the solving agent needs
no run-time egress. /workspace is the only path shared with the verifier.
"""

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
reward_kind = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
never_imports_submission = true
note = """
The submission is a JSON declaration of batch geometry. The verifier parses it,
bounds-checks it and trains with it. No code from the agent surface is imported or
executed here, and no number the submission reports about itself is read.
"""

[verifier.reward]
schema = "single float, closed interval [0.0, 1.0], higher is better, never binary"
full_reward = 1.0
floor = 0.0
formula = "raw = (default_loss - agent_loss) / (default_loss - reference_loss)"
clip = "reward = min(max(raw, 0.0), 1.0)"
target_is_a_bar = "reaching the reference scores exactly 1.0 and beating it also scores 1.0"
zero_carries_reason = true

[verifier.anchors]
baseline_metric_declared = "absent-by-design"
target_metric_declared = "absent-by-design"
note = """
No literal for either endpoint appears anywhere in this bundle, and that is the point
rather than an omission. Both are MEASURED on every grading run by real from-scratch
training runs inside the verifier: the low anchor by retraining the shipped
environment/default_packing.json, the high anchor by training
tests/private/reference_packing.json, which is staged only into the verifier image.
If either anchor fails to produce a finite loss the run refuses at 0.0 with reason
anchor-diverged, and if the two coincide it refuses with calibration-span-nonpositive.
Neither path substitutes a stored value.
"""

[verifier.hygiene]
note = """
Schema and bounds validation is a GATE, not a grade. packing_schema.py answers one
question -- is this a well-formed plan inside the declared bounds -- and a failure
REFUSES the run at 0.0 with a machine-readable reason. It never scales the float and
never contributes a partial credit.
"""
refusal_reasons = [
  "submission-absent",
  "plan-unreadable",
  "plan-not-an-object",
  "plan-block-not-an-object",
  "plan-schema-unrecognised",
  "plan-key-unknown",
  "plan-key-missing",
  "plan-phases-not-a-list",
  "plan-phases-empty",
  "plan-too-many-phases",
  "plan-value-not-a-number",
  "plan-value-not-an-integer",
  "plan-rows-not-allowed",
  "plan-seq-len-not-allowed",
  "plan-grad-accum-not-allowed",
  "plan-microbatch-tokens-out-of-bounds",
  "plan-budget-frac-out-of-bounds",
  "plan-budget-frac-does-not-sum-to-one",
  "plan-phase-buys-too-few-steps",
  "verifier-anchor-plan-invalid",
  "accelerator-absent",
  "verifier-substrate-unavailable",
  "anchor-run-failed",
  "anchor-diverged",
  "calibration-span-nonpositive",
  "agent-run-failed",
  "agent-plan-diverged",
  "grading-chain-failed",
  "grading-timed-out",
  "grading-killed",
]

[solution]
oracle = "solution/reference.py"
entry = "solution/solve.sh"
grounding = "solution/grounding.md"
note = """
The oracle installs a plan that was derived by a search over this exact harness and
corpus during authoring. It is NOT the verifier's private reference plan: the two were
arrived at separately and differ in their phase partition, so the reference arm of the
gate is never the high anchor being graded against itself.
"""
