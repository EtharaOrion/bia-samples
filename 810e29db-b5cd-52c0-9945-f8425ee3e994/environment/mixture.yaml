# The default mixture parameterisation.
#
# This file is a TEMPLATE, not a boundary. It expresses one family of
# allocations: a constant weight per band, with each band's share drawn
# uniformly across the whole band. It is the parameterisation most mixture
# search papers hand you, and `harness.py --from-mixture mixture.yaml` will
# turn it into a plan for you.
#
# The graded objective constrains ONE thing: the total number of FineWeb10B
# tokens the trainer feeds. Nothing in the objective says an allocation has to
# be constant per band, has to treat a band as indivisible, or has to see each
# slice at most once. Those are properties of THIS file, not of the task. Read
# plan_schema.md for the full grammar the harness accepts.
schema: oer08.mixture/v2
mode: constant
weights:
  band-0: 0.20
  band-1: 0.20
  band-2: 0.20
  band-3: 0.20
  band-4: 0.20
