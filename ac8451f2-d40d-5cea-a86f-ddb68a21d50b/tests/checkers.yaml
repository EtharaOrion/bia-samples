schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

clock_ownership: >-
  NO CLOCK IS READ ANYWHERE ON THE GRADED PATH. This slot's metric is a weight ratio and not a
  timing metric, so no checker needs a clock and none has one. The sealed provenance store is
  established by arithmetic over frozen inputs: environment/mint_store.py advances a fixed
  integer linear congruential recurrence seeded from the frozen ledger source, and every value
  it produces is a pure function of those bytes. tests/runner.py launches that minter over the
  BUNDLE's frozen ledger source and instance family in an isolated subprocess, and every
  checker below reads the resulting store through the tests/checkers.py Harness handle. No
  checker calls time, datetime, perf_counter, monotonic or any other clock, directly or
  transitively. That is what keeps every checker pure, deterministic and replayable, and it is
  also what makes the grading reproducible.

purity: >-
  Every checker is a pure function of the harness handle and the bound constants. Imports in
  tests/checkers.py are confined to hashlib, json, pathlib, dataclasses and typing. No planted
  answer file is read, no environment secret is read, no random source is consulted, no socket
  is opened, and the grading process never imports the submission: tests/runner.py launches the
  bundle's own minter as a new session leader under a five-key environment allowlist, reads the
  store back off disk, and kills the whole process group in a finally block.

discovery:
  count: 2
  block: >-
    one atom digest and one attestation ordering, established in built environment state,
    absent from the statement.
  values:
    - name: terminal_atom_digest
      kind: atom digest
      established_in: >-
        built environment state, by environment/mint_store.py in the first stage of
        environment/Dockerfile. The shipped image carries the store and not the minter, so the
        value exists as built state and not as a script that would recite it.
      read_back_through: environment/store_handle.py over /task/state/store
      required_checkers_it_gates: [digest_recursion_holds, terminal_atom_digest_matches]
    - name: realised_attestation_order
      kind: attestation ordering
      established_in: >-
        built environment state, as the shape of the seal chain. Attestation files are named by
        their own content-addressed seal and atom files are written in lexicographic identifier
        order, so neither directory listing leaks it.
      read_back_through: environment/store_handle.py over /task/state/store
      required_checkers_it_gates:
        [attestation_order_realised, seal_chain_derived_from_state, graded_cover_feasible]
      not_the_natural_order: >-
        The realised order is a topological order of the derivation graph and it is neither the
        lexicographic identifier order nor the ready-set-sorted topological order.
        solution/recompute.py asserts both inequalities and refuses to emit if either fails, and
        it additionally asserts that the LAST atom of the realised order is not the last atom of
        either natural order, so the graded instance itself is unreachable without the walk.

readout_manipulation: >-
  Every graded quantity is computed by the verifier and none is ever read from a value the
  submission reported. The realised attestation order is recovered by walking the chain the
  harness minter sealed, never from the submission's own claim and never from the convenience
  field the minter's in-memory return happens to carry. Every atom digest is folded by the
  verifier under the fixed preimage. The exact optimum is recomputed by an exact bitmask
  dynamic program on every run. reported_cover_weight is read only so that a disagreement with
  the verifier's own recomputation is detectable rather than ignorable.

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py walks the eight checkers below in the declared order and returns 0.0 with the
    first failing checker's machine-readable reason. Only when every required checker passes
    does it compute the continuous term, the clamped normalised closure of the gap to the exact
    optimum. That is exactly required_pass over the required set, composed with a
    bounded-continuous score inside the passing region, so the reward is never binary and every
    zero is attributed. Observed intermediate rewards on the graded instance, all in the pinned
    verifier image: cover weight 25 scores 0.875, weight 27 scores 0.625, weight 30 scores 0.25
    and the exact optimum at weight 24 scores 1.0.
  reward_formula: raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  direction: higher is better
  never_binary: true

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  family_baseline_metric: null
  family_target_metric: null
  note: >-
    F7 anchors are unmeasured, so the reward SCHEMA is bound in full and no family baseline or
    target number is invented. The two numbers tests/bound.json carries are instance-local,
    measured by solution/recompute.py on this slot's own frozen substrate, and are declared under
    gap-oer-30-instance-local-anchors-not-family-anchors as NOT family anchors.

fixture_substitutions:
  note: >-
    None. Every rejecting half below is carried on a frozen SUBMISSION over the real
    harness-minted store, never on a planted store and never on planted telemetry. The store the
    rejecting fixtures are graded against is the same store the reference is graded against,
    minted by the verifier's own subprocess from the same frozen inputs, so each rejection turns
    on the submission and on nothing else.

rejecting_fixtures:
  - name: natural_sort_order
    path: solution/fixtures/rejecting/natural_sort_order
    moves: the whole submission recomputed under the lexicographic identifier order
    observed_reward: 0.0
    observed_reason: attestation-order-unrealised
    observed_failed_checker: attestation_order_realised
  - name: order_adjacent_transposed
    path: solution/fixtures/rejecting/order_adjacent_transposed
    moves: >-
      NEAR MISS. Two adjacent entries of attestation_order transposed and no other byte moved.
      Diffed against the reference submission, the whole delta is one line moved by one place.
    observed_reward: 0.0
    observed_reason: attestation-order-unrealised
    observed_failed_checker: attestation_order_realised
  - name: seal_chain_fabricated
    path: solution/fixtures/rejecting/seal_chain_fabricated
    moves: one seal replaced by a digest-shaped value not derived from built state
    observed_reward: 0.0
    observed_reason: seal-chain-fabricated
    observed_failed_checker: seal_chain_derived_from_state
  - name: wrong_preimage_input_ids
    path: solution/fixtures/rejecting/wrong_preimage_input_ids
    moves: every atom digest refolded over input atom identifiers instead of input digests
    observed_reward: 0.0
    observed_reason: digest-preimage-wrong
    observed_failed_checker: digest_recursion_holds
  - name: terminal_digest_one_hex
    path: solution/fixtures/rejecting/terminal_digest_one_hex
    moves: >-
      NEAR MISS. One hexadecimal character of terminal_atom_digest and no other byte moved.
      Diffed against the reference submission, the whole delta is one character on one line.
    observed_reward: 0.0
    observed_reason: terminal-digest-mismatch
    observed_failed_checker: terminal_atom_digest_matches

checkers:
  - id: frozen_inputs_unmodified
    statement: "The frozen ledger source, the frozen instance family and the minter are byte-identical to the bound digests as they stand on disk."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_frozen_inputs_unmodified
    zero_reason: frozen-inputs-modified
    required: true
    weight: 1
    basis: computed
    live_state_read: "sha256 over the bundle's environment/ledger_source.json, environment/instances.json and environment/mint_store.py."
    compiled_test: "tests/test_output.py::test_frozen_inputs_unmodified"

  - id: store_materialised
    statement: "The verifier's own mint produced a complete store: the bound number of atoms, the bound number of attestations, exactly one genesis attestation, and a chain that visits every atom exactly once."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_store_materialised
    zero_reason: store-not-materialised
    required: true
    weight: 1
    basis: computed
    live_state_read: "the atom and attestation records the harness minter subprocess materialised, and the chain walk over them."
    compiled_test: "tests/test_output.py::test_store_materialised"

  - id: attestation_order_realised
    statement: "The submitted attestation order is the order the seal chain realises, walked from the single all-zero-prev_seal genesis, and the submitted terminal atom is the atom that chain ends at."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_attestation_order_realised
    zero_reason: attestation-order-unrealised
    required: true
    weight: 1
    basis: computed
    live_state_read: "the prev_seal and seal fields of every attestation the harness minted, and submission.json's attestation_order and terminal_atom_id."
    compiled_test: "tests/test_output.py::test_attestation_order_realised"
    grades_discovery_value: realised_attestation_order

  - id: seal_chain_derived_from_state
    statement: "Every submitted seal is the seal built state derives for its atom under the fixed attestation preimage, link by link from genesis, and the chain terminates at the seal the store carries."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_seal_chain_derived_from_state
    zero_reason: seal-chain-fabricated
    required: true
    weight: 1
    basis: computed
    live_state_read: "the selected_sets of every harness-minted atom, recomputed into seals by the verifier, against submission.json's seal_chain."
    compiled_test: "tests/test_output.py::test_seal_chain_derived_from_state"
    grades_discovery_value: realised_attestation_order

  - id: attested_closure_complete
    statement: "The submitted digest table carries an entry for every atom the store holds and introduces no atom the store does not hold."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_attested_closure_complete
    zero_reason: closure-incomplete
    required: true
    weight: 1
    basis: computed
    live_state_read: "the atom identifiers the harness minted, against the keys of submission.json's atom_digests."
    compiled_test: "tests/test_output.py::test_attested_closure_complete"

  - id: digest_recursion_holds
    statement: "Every submitted atom digest equals the verifier's own fold of the fixed six-line preimage, with input digests folded in realised attestation order and the three excluded record fields excluded."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_digest_recursion_holds
    zero_reason: digest-preimage-wrong
    required: true
    weight: 1
    basis: computed
    live_state_read: "every harness-minted atom record, folded by the verifier under the realised order, against submission.json's atom_digests."
    compiled_test: "tests/test_output.py::test_digest_recursion_holds"
    grades_discovery_value: terminal_atom_digest

  - id: terminal_atom_digest_matches
    statement: "The declared terminal atom digest is the verifier's own fold over the whole provenance closure of the last atom in the realised attestation order."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_terminal_atom_digest_matches
    zero_reason: terminal-digest-mismatch
    required: true
    weight: 1
    basis: computed
    live_state_read: "the verifier's own recursive fold over the harness-minted store, against submission.json's terminal_atom_digest."
    compiled_test: "tests/test_output.py::test_terminal_atom_digest_matches"
    grades_discovery_value: terminal_atom_digest

  - id: graded_cover_feasible
    statement: "The submitted cover is for the instance the last atom of the realised attestation order attests, draws only sets that instance carries, repeats none, covers its whole universe, and its reported weight equals the verifier's recomputation."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_graded_cover_feasible
    zero_reason: cover-infeasible
    required: true
    weight: 1
    basis: computed
    live_state_read: "the terminal atom of the harness-minted chain, the frozen instance it attests, and submission.json's graded_instance_id, submitted_cover and reported_cover_weight."
    compiled_test: "tests/test_output.py::test_graded_cover_feasible"
    grades_discovery_value: realised_attestation_order
