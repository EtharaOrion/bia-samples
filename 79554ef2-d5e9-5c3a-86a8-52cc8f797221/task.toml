# OER-15, family F10, archetype AR5 Adversarial Option Expansion.
# schema_version is a TOP-LEVEL scalar and is written above the first table
# header on purpose: TOML scopes every key to the most recent header, so an
# assignment written below [task] would silently become task.schema_version.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-15-tokenizer-option-expansion"
version = "1.0.0"
description = "Construct a tokenizer vocabulary that reaches lower bits per byte than the handed word-list construction can reach at any point of its option grid, measured by a real nanoGPT training run of the canonical decoder at a frozen step budget."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "option-expansion"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-15"
provisional_identifier = "OER-15"
title = "Tokenizer option expansion beyond the default construction"
family = "F10"
family_title = "tokenizer and vocabulary construction"
archetype = "AR5"
archetype_name = "Adversarial Option Expansion"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.substrate]
declaration = "environment/nanogpt_substrate.json"
declaration_version = "nanogpt-substrate-v1"
upstream = "modded-nanogpt, records/track_3_optimization/"
note = "The architecture, the batch size, the one-forward-one-backward-pass-per-step rule and the corpus are the canonical nanoGPT operating point, replicated into this slot's environment/ so no slot reads a sibling's bytes."

[metadata.metric]
name = "bits_per_byte"
statement = "the trained decoder's raw bits over a held-out FineWeb slice, divided by the byte count of that slice"
direction = "lower"
denominator = "the byte count of the verifier-held FineWeb evaluation slice"
denominator_note = "The denominator is bytes, never tokens. A vocabulary that shrinks the token count lowers nothing on its own. The slice is absent from every agent-visible container, so its byte count is not published on the agent surface."
computed_by = "the verifier, from harness-owned parameters of the canonical decoder at the bound step"

[metadata.frozen]
axes = ["architecture", "compute budget", "batch size", "corpus", "optimizer", "evaluation slice", "encoder"]
architecture = "the canonical decoder of environment/nanogpt_substrate.json: vocab_size 50304, num_layers 12, model_dim 768, head_dim 128, num_heads 6, seq_len 1024"
compute_budget_steps = 2200
compute_budget_note = "Optimizer steps, not token positions. One step is one forward pass and one backward pass over the frozen batch. The integer is the one this slot carried before the re-base; only its unit moved onto the substrate."
batch_tokens_per_step = 524288
forward_passes_per_step = 1
backward_passes_per_step = 1
corpus = "FineWeb10B, data/fineweb10B/fineweb_train_*.bin, staged by environment/build_corpus.py"
optimizer = "adamw at the settings environment/manifest.json binds under run, with a fixed warmup and decay schedule"
evaluation_slice = "a held-out FineWeb validation slice the verifier owns, absent from environment/"
encoder = "greedy longest match, maximum token length 16 bytes"

[metadata.free]
axes = ["the construction of the vocabulary"]
statement = "Any construction that produces a list of byte strings within the vocabulary budget is admissible. The handed construction is one option, not the option set."
vocab_budget = 50304
vocab_budget_note = "The budget is the decoder's own vocab_size, because the embedding table has exactly that many rows. The 256 single bytes are prepended by the harness and occupy budget, so at most 50048 further entries are chosen."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# The two grants are DISTINCT and are never aliases of one another.
#   max_timeout_hours bounds the refinement loop ACROSS attempts.
#   budget_hours      bounds ONE attempt to completion.
# REPINNED BY THE RE-BASE. One attempt to completion now contains two real
# 2200-step training runs of the canonical decoder, the graded one and the
# verifier's paired baseline, so the per-attempt bound is the session bound and
# the attempt count falls to one. The agent-side half of an attempt, which is
# constructing a vocabulary, is minutes; the graded half is the expensive one.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound, one vocabulary construction plus the two 2200-step runs that grade it"
budget_hours_state = "unmeasured-on-nanogpt-substrate"
budget_hours_gap = "gap-oer-15-per-attempt-wall-time-unmeasured"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.reward]
carrier = "/logs/verifier/reward.txt"
carrier_form = "one bare float"
score_document = "/logs/verifier/score.json"
interval = [0.0, 1.0]
direction = "higher_is_better"
binary = false
full_reward = 1.0
formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric); score = min(max(raw, 0.0), 1.0)"
formula_note = "The metric is lower-is-better, so the lower-is-better form of the bound formula is used."
anchors_note = "This family is unscoped and carries no published anchor. The schema is bound in full and the two numeric anchors are declared absent rather than invented. The scoring carriers actually used are computed at grading time and appear as literals nowhere in this bundle: the floor is the bits per byte of the handed construction measured by the verifier in the same grading pass on the same seed, shards, step budget and held-out slice, and the ceiling is that floor less a declared separation the verifier holds. Neither is presented as a family anchor."

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install its
# pinned packages or stage the FineWeb10B training shards.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
submission_path = "submission/tokenizer.py"
submission_contract = "build_vocab(train_bytes: bytes, budget: int) -> list[bytes]"
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
entry_point = "tests/test.sh"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
imports_submission = false
