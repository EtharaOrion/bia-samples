coverage_gaps:
  - id: full-reward-attainability-unmeasured
    reason: >-
      target_steps is bound to the last step before the frozen schedule's tail branch, and no rule
      in the calibration sweep was measured to reach the target that early. That the anchor keeps
      headroom above the reference is measured; that any rule attains full reward is not, and is
      not claimed.
    cap: HOLD:PILOT_REQUIRED
  - id: idle-card-wallclock-unmeasured
    reason: >-
      Every wall clock in this bundle was taken on an H100 shared with four concurrent sibling
      workloads, so each is an upper bound rather than the per-attempt figure the budget is written
      against. Four repeats of the graded attempt returned two-seed totals of 481, 343, 265 and
      433 seconds, every invocation finished inside the 420 second guard, and the two most
      contended of the four exceeded the 432 second per-attempt budget. The same run on an idle
      card is owed and is not estimated here.
    cap: HOLD:PILOT_REQUIRED
  - id: difficulty-unmeasured
    reason: >-
      No pass probability, self-solve claim or difficulty tier is asserted. The defeat mechanism is
      recorded as design intent and is unmeasured until an external signed pilot over frozen bytes
      against the pinned cohort exists.
    cap: HOLD:PILOT_REQUIRED
  - id: image-digest-unpinned
    reason: >-
      task.toml pins the public base image by digest, and the digest of the image
      environment/Dockerfile builds on top of it does not exist until a campaign builds it. The
      field names the base and the gap is declared rather than filled with an invented digest.
    cap: HOLD:PILOT_REQUIRED
  - id: screening-unverified
    reason: >-
      The ENGRAM-owned contamination screening roots carry no pinned identity or digest in this
      project, so the exclusion list, the freeze-date table and the near-duplicate index cannot be
      resolved. The bundle ships its own fingerprint corpus, which is a family control and not a
      substitute for those roots.
    cap: HOLD:PILOT_REQUIRED

disposition: HOLD:PILOT_REQUIRED
