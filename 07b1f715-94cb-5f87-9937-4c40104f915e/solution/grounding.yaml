    - id: NC04
      plants: a verbatim copy of a pinned corpus record, and a renamed retuned copy of it
      exercises: C11
      observed: record_replay_of_rec_soap_lite_similarity_1.000 and similarity_0.999
    - id: NC05
      plants: one edited telemetry record left unsigned
      exercises: C07
