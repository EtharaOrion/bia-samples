    - id: NC06
      plants: proof-profile telemetry presented to the full-profile verifier
      exercises: C12
      observed: profile_mismatch_smoke_expected_full
    - id: NC07
      plants: an update rule that mutates parameters from zero_grad, outside step()
      exercises: C10
