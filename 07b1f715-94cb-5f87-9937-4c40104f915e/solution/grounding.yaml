cohort:
  pinned:
    - gpt5.6-sol
    - anthropic/claude-opus-5
    - muse-spark-1.2
  valid_to: 2026-11-17

frozen_surface:
  - the learning-rate schedule, published at environment/frozen_schedule.py and unmodifiable
  - the per-group learning-rate multiplier table and the base learning rate
  - the dataset, its token order, the batch shape and the sequence length
  - the architecture, its parameter-group partition and its initialization
  - one forward-backward pass per optimizer step
  - the validation path and the weights validation reads

free_surface:
  - the update rule only, meaning the map from gradient and optimizer state to a parameter delta
  - the optimizer's own internal state, its initialization and its hyperparameters

defeat_mechanism:
  design_intent: >-
    Every published record co-designs its update rule with its schedule, so the reported gain is
    a property of the pair and not of either half. This slot freezes a schedule that no published
    record was tuned against: a four-tenths-of-one-percent warmup, a discontinuous restart drop at
    forty percent of the run, and a tail that floors at a quarter of peak with no terminal anneal.
    A ported record therefore arrives with its own missing half. The rule is additionally never
    told the step horizon, so the cooldown a record relies on cannot be reimplemented inside the
    update, and the verifier enforces that the applied delta is exactly linear in the harness
    learning rate. What is left is the question the slot asks, which is which part of the record
    actually carried the gain.
  status: UNMEASURED
  measured_by: external signed pilot over frozen bytes against the pinned cohort

operating_point:
  binding: 6 hours per session divided by 50 attempts equals 7.2 minutes per graded attempt
  budget_hours: 0.12
  max_timeout_hours: 6.0
  max_attempts: 50
  envelope: one H100, single accelerator, no multi-GPU scaling
  enforcement: >-
    The runner carries a wall-clock guard of 420 seconds per graded attempt, so the per-attempt
    budget is an enforced byte rather than a claim. A run that trips the guard stops, records
    stop_reason wallclock_guard, and is graded on the telemetry it produced.
  wallclock_status: MEASURED
  wallclock_note: >-
    Recorded under measured_reference below. The measurement was taken on an H100 shared with
    concurrent sibling lanes, so it is an upper bound on the same run on an idle card and it is not
    a difficulty measurement.

