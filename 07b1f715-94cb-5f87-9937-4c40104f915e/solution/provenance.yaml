generated_artifacts:
  source_of_truth: solution/grounding.yaml
  generator: solution/recompute.py
  determinism: >-
    The generator reads grounding.yaml and nothing else. It invokes no model, no network, no
    clock, no locale and no random source, so two runs on two hosts produce byte-identical output.
    Verify with python3 solution/recompute.py --check.
  files:
    - tests/anchors.py
    - tests/checkers.yaml
    - tests/rubrics.jsonl
    - tests/test_output.py
    - solution/rubrics.json
    - solution/TRUTH.md

measurements:
  reference_score_at_operating_point:
    value: 0.6547619047619048
    graded_step: 1125
    measured_on: 2026-08-21
    command: bash solution/solve.sh
    device: one H100 80GB shared with concurrent sibling lanes
    checkers_true: 13 of 13
    repeats: 4
    status: measured
    note: >-
      Two seeds of 1400 steps each, both completed with stop_reason completed, and the same score
      returned by all four repeats of the graded attempt. The score follows
      from the anchors recorded in solution/grounding.yaml under calibration_measurement, and the
      reference lands strictly inside the reward interval rather than at either end of it. This is
      a reference measurement and it is not a difficulty measurement.
  smoke_path:
    command: BIA_SMOKE=1 bash solution/solve.sh
    device: CPU, CUDA_VISIBLE_DEVICES empty, no CUDA allocation
    status: executed during authoring
    note: >-
      The smoke result is a proof that the oracle path runs end to end. It is never a difficulty
      measurement, never the reference score at the graded operating point, and never comparable
      across profiles.
  wallclock_at_operating_point:
    status: measured on a shared card, unmeasured on an idle one
    bound_by: the runner wall-clock guard of 420 seconds per graded invocation
    observed_slowest_invocation_per_repeat_s: [239, 190, 165, 230]
    observed_two_seed_total_s: [481, 343, 265, 433]
    best_invocation_s: 89
    note: >-
      Measured while sibling workloads shared the same H100, so every figure here is an upper
      bound and none of them describes an idle card. Every invocation finished inside the 420
      second guard with stop_reason completed, and two of the four two-seed totals sit inside the
      432 second per-attempt budget. The same reference in its earlier
      synchronization-bound form was measured at 157 optimizer steps in 60 seconds against 576 in
      the same window for the form that ships, so the shipped form carries roughly a factor of
      three point seven in throughput against the contention this figure was taken under. What is
      not measured is the two-seed total on an idle H100, and it is not estimated here.

