# BIA S02 per-unit provenance carrier. Private, ships inside solution/.
# Excluded from the canonical content hash by the recipe recorded below, which is
# what makes the binding acyclic: this file records the hash and therefore cannot
# be inside the domain the hash is computed over.
schema: bia.s02.provenance/v1

unit:
  slot: S02
  slot_name: optimizer-search-frozen-schedule
  task_name: bia/s02-optimizer-search-frozen-schedule
  version: 1.0.0
  authored_at: 2026-08-21
  disposition: HOLD:PILOT_REQUIRED

identity:
  namespace: c53e8f3b-526f-52c0-a04e-89e2269b237d
  canonical_content_hash: 3ca2a9017f0dd29590ee62cde2b0616d811219ed65a16c9b1d03735bb0e566d5
  uuid: 82fbb69e-63d8-5e31-9e93-e5bc15c5a890
  recompute_command: python3 solution/recompute.py --hash
  manifest_command: python3 solution/recompute.py --manifest

# The exact recipe. An auditor recomputes it independently from these words, and
# solution/recompute.py implements the same steps in code.
hash_recipe:
  algorithm: sha256
  domain: every regular file under the bundle root
  exclusions:
    - trajectories/
    - solution/provenance.yaml
    - any __pycache__ directory and any .pyc file
  steps:
    - walk the bundle root and collect every regular file that survives the exclusions
    - express each path relative to the bundle root using forward slashes
    - sort the relative paths as UTF-8 byte strings
    - for each path emit one line: the file sha256 in lowercase hex, two spaces, the relative path, a newline
    - concatenate every line into one UTF-8 manifest
    - canonical_content_hash is the sha256 of that manifest, lowercase hex
    - the directory name is uuid5 of the namespace above over that lowercase hex string
  rationale: >-
    trajectories/ is excluded because rollout evidence must never change frozen bundle identity,
    and this file is excluded because it carries the hash and cannot be inside its own preimage.
    Nothing else is excluded, so every runtime-relevant byte sits inside the domain.

upstream_provenance:
  origin: derived
  provenance_date: 2026-08-21
  upstream_identity: >-
    github.com/KellerJordan/modded-nanogpt, records/track_3_optimization, the F1 family benchmark
    the bia environment spec registers
  license: MIT for the upstream training code, ODC-By for the FineWeb corpus the shards tokenize
  source_kind: public_repository
  modifications:
    - The operating point is scaled down from the upstream 124M parameter, 524288 token per step
      configuration to a 6 layer, 384 width, 24576 token per step configuration so one graded
      attempt fits the per-attempt budget of 7.2 minutes of single-H100 time.
    - The free axis is narrowed from the upstream optimizer, its schedules and initialization to
      the update rule alone. The learning-rate schedule is frozen, published and harness-applied,
      and the initialization is harness-owned.
    - A schedule foreign to every published record is substituted for the co-designed schedules
      those records use, which is the whole point of this slot.
    - The update rule is denied the step horizon, so a record cooldown cannot be reimplemented
      inside the free axis.
    - The metric keeps the upstream steps-to-target shape and takes the spec's clipped linear
      scoring form rather than the upstream soft-saturating tail.
  attestation_status: attestation-unavailable
  attestation_note: >-
    No signed platform attestation of fork ancestry or task-generating event time is bound here,
    because this project pins no source-attestation trust root. Recorded as a named gap rather
    than accepted on the author's word.

