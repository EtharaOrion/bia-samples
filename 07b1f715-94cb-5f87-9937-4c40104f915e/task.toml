schema_version = "1.4"

# Deliverables snapshotted out of the environment before teardown. Every graded
# artifact appears here, because a graded deliverable that is not snapshotted is
# reconstructed after the fact rather than read.
artifacts = [
  "/telemetry/run_record.jsonl",
  "/workspace/submission/update_rule.py",
  "/workspace/submission/logs",
  "/logs/verifier/score.json",
  "/logs/verifier/outcomes.json",
]

[task]
name = "bia/s02-optimizer-search-frozen-schedule"
version = "1.0.0"
description = "Derive an update rule that reaches the target validation loss in the fewest steps under a published, frozen, foreign learning-rate schedule."
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "language-model", "frozen-schedule"]

[metadata]
category = "optimization"
slot = "S02"
family = "F1"
tags = ["optimization", "bounded-continuous"]

# ---------------------------------------------------------------------------
# The seven optimization bindings. max_timeout and budget_hours are distinct and
# are never aliases: max_timeout terminates the refinement loop across attempts,
# budget_hours bounds one attempt. The spec's six hours bounds one fifty-attempt
# session, which is max_timeout's role; six hours divided by fifty attempts is
# the 0.12 hours below. Writing 6 into budget_hours would encode a 300 hour
# session, which is the transcription error the authoring packet names.
# ---------------------------------------------------------------------------
max_timeout = 6.0                # 1. hours, terminates the refinement loop
budget_hours = 0.12              # 2. hours per attempt, 7.2 minutes
max_attempts = 50                # 3. ceiling is 100, spec elects 50
final_selection = "best"         # 4. best attempt of the session is the score
solver_egress = "setup-only"     # 5. no network during scored work
compute_envelope = "one-H100"    # 6. single accelerator, no multi-GPU scaling
reward_schema = "float"          # 7. one float on the closed interval [0, 1]

budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
max_timeout_hours = 6.0
budget_enforcement = "runner wall-clock guard of 420 seconds per graded invocation"
budget_measurement_status = "four repeats on a shared H100 returned two-seed totals of 481, 343, 265 and 433 seconds with every invocation inside the 420 second guard; these are upper bounds and the idle-card figure is carried as the gap idle-card-wallclock-unmeasured"

[metadata.reward]
kind = "continuous"
dtype = "float"
minimum = 0.0
maximum = 1.0
full_reward = 1.0
form = "score = min(max(raw, 0.0), 1.0)"
raw = "(baseline_steps - graded_step) / (baseline_steps - target_steps)"
baseline_steps = 1400
target_steps = 980
target_loss = 5.30
min_seeds = 2
sig_margin = 0.023
anchor_status = "CALIBRATED_FROM_MEASURED_RUN"
anchor_note = "Bound from the calibration sweep recorded in solution/grounding.yaml under calibration_measurement. Not declared design parameters."
written_to = "/logs/verifier/score.json"
zero_attribution = "every zero carries a machine-readable reason field in the verifier record"

[metadata.refinement_loop]
enabled = true
iteration_contract = "the harness lets the agent solve and submit, grades the submission, summarizes the trajectory, and starts the next iteration carrying every prior approach and its reward"
final_selection = "best"
attempt_cap = 50
trajectory_rubrics = "tests/rubrics.jsonl"

[metadata.cohort]
pinned = ["gpt5.6-sol", "anthropic/claude-opus-5", "muse-spark-1.2"]
valid_to = "2026-11-17"

[metadata.difficulty]
tier_claimed = "none"
pass_probability = "unmeasured"
defeat_mechanism_status = "UNMEASURED, design intent only, measured only by an external signed pilot over frozen bytes"
disposition = "HOLD:PILOT_REQUIRED"

[metadata.operating_point]
profile = "full"
scaled = true
n_layer = 6
n_head = 6
d_model = 384
seq_len = 512
batch_sequences = 48
batch_tokens = 24576
total_steps = 1400
seeds_required = 2
rationale = "F1 at the upstream operating point costs 84 minutes per graded run, 11.7 times the per-attempt budget, so a scaled operating point is mandatory rather than optional."

[agent]
# Must equal what instruction.md promises. The per-attempt bound is budget_hours;
# this is the session-level agent timeout that max_timeout expresses in hours.
timeout_sec = 21600.0
network_mode = "none"
network_note = "Egress is setup-only. The scored run has no network, per the stricter reading the spec directs while the client ruling is open."

[verifier]
timeout_sec = 1800.0
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/score.json"
# grade.py verifies the telemetry chain with BIA_CHAIN_KEY. No key ships inside
# this bundle: a key that ships is a key every holder can forge telemetry with.
# Mint one per campaign and inject it here. Unset is the safe default, and
# tests/test.sh raises a preflight fault rather than reporting a silent zero.
env = { }

[environment]
# The pinned public base, by digest and never by a floating tag. The campaign
# build layers environment/Dockerfile on top of it and must repin docker_image
# to the digest of that built image before a graded campaign runs. Until then
# this field names the base and the gap is declared, not hidden.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_digest_status = "base-pinned, built-image digest unresolved pending campaign build"
build = "environment/Dockerfile"
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 40960
network_mode = "setup-only"
env = { BIA_TELEMETRY_DIR = "/telemetry", BIA_DATA_DIR = "/data/fineweb" }

[environment.frozen]
schedule = "environment/frozen_schedule.py"
architecture = "environment/runner/model.py"
data = "environment/runner/data.py"
runner = "environment/runner/run_bia_s02.py"
train_shard_sha256 = "771fa4a99b9fe0946ffb6e848b4ba5c6a9b0fe87860ebf03bc2c1c7e45f8178e"
val_shard_sha256 = "5b95c8e0966f0861685b307b23dc5ae42b228ef74b28cb499784ae021f201640"

[metadata.verification]
checkers = "tests/checkers.yaml"
compiled_rubric = "tests/test_output.py"
reference_rubric = "solution/rubrics.json"
trajectory_rubrics = "tests/rubrics.jsonl"
oracle = "solution/solve.sh"
smoke_path = "BIA_SMOKE=1 bash solution/solve.sh runs the identical oracle path on CPU with CUDA disabled"
reference_score_at_operating_point = "0.6547619047619048 at graded_step 1125 with all thirteen checkers true, measured 2026-08-21, recorded in solution/grounding.yaml under measured_reference"
