schema: forge.grounding/v1
slot: OER-21
provisional_identifier: OER-21
family: F9
family_title: quantization
primary_archetype: AR5
archetype_title: Adversarial Option Expansion
archetype_exclusivity: >-
  Exactly one primary archetype, fixed at scope time. AR5 is the only archetype this slot
  claims. No second archetype is carried, projected or implied anywhere in this bundle.
title: Quantization scheme search breadth at a fixed bit budget

visibility: >-
  PRIVATE. This file is the single derivation source for every generated artifact in this
  bundle. It is never assembled onto the agent surface: solution/ is absent from
  launcher.AGENT_ROOTS by construction, so no filter has to hold for it to stay private.

# ---------------------------------------------------------------------------
# What is graded, stated once, so instruction.md and TRUTH.md cannot drift apart
# ---------------------------------------------------------------------------
graded_quantity:
  statement: >-
    The worst per-shard RELATIVE perplexity degradation of the quantized model against the
    unquantized reference, in percent of that shard's unquantized reference perplexity,
    measured by the verifier over the frozen evaluation corpus, at a fixed total bit budget.
  direction: lower
  units: percent of the unquantized reference perplexity
  units_rationale: >-
    Relative rather than absolute, because the frozen shards do not share a reference
    perplexity. An absolute difference would let the shard with the largest reference
    perplexity dominate the worst-shard maximum for a reason that has nothing to do with
    the quantization scheme.
  computed_by: tests/evaluate.py, inside the verifier process
  computed_from: harness-owned quantized tensor state
  never_from:
    - a number the submission printed on stdout
    - a field the submission wrote into its scheme artifact
    - a filtered, smoothed or averaged reading of any kind
  worst_case_rationale: >-
    The graded reading is the maximum degradation across the scheduled shards rather than
    the mean, so a favourable shard cannot be harvested by averaging it against the rest.

frozen:
  - the model weights, environment/model/model.json
  - the total bit budget, model.bit_budget_total
  - the evaluation corpus, environment/corpus/eval_corpus.json
  - the unquantized reference readings, environment/model/reference.json
free:
  - >-
    the quantization scheme, meaning per-tensor and per-group bit widths, the number of
    scale groups inside a tensor, the codebook family, and the clip percentile

# ---------------------------------------------------------------------------
# AR5: the handed option set is the trap, and the gap is MEASURED not asserted
# ---------------------------------------------------------------------------
adversarial_option_expansion:
  handed_option_set:
    carrier: environment/quantize.py
    shape: >-
      one uniform bit width applied to every tensor, exactly one scale group per tensor,
      a symmetric or affine codebook, and one clip percentile knob.
    completeness: >-
      The handed toolkit is complete and correct within its own space. It runs, it
      accounts its bits, and it reaches the budget exactly at its shipped setting. Nothing
      about it is broken, which is why its optimum reads as the task optimum.
  wider_construction:
    shape: >-
      per-tensor bit widths, per-GROUP bit widths inside a tensor, group counts above one,
      and a kmeans codebook whose centroid table is paid for out of the same budget.
    derivable_from_the_objective: >-
      The objective states that the budget is a TOTAL over the model and that degradation
      is measured over the whole corpus. Nothing in the objective requires one width for
      every tensor. The instruction states the accounting rule in full, states that
      per-tensor and per-group allocation are admitted, and states that the graded bar is
      the handed toolkit's own optimum. The widening is therefore an inference from the
      stated objective, not a hidden affordance behind a puzzle.
    not_a_puzzle: >-
      No search is needed to LEARN that the space is wider. The scheme schema is published
      at environment/scheme_schema.json and the instruction names every free axis. What
      the agent has to do is measure, allocate and iterate, which is optimization work.
  pressure_is_measured:
    default_optimum_source: >-
      exhaustive search over the handed option space, run by the verifier at grading time
      in tests/evaluate.py default_optimum, never read from a stored constant
    reference_optimum_source: >-
      greedy coordinate search over the wider space, run offline in solution/recompute.py
      and frozen here, then re-derived byte-identically by recompute.py --check

# ---------------------------------------------------------------------------
# Substrate parameters. Every generated byte of environment/ comes from these.
# ---------------------------------------------------------------------------
substrate:
  kind: deterministic-surrogate
  gap: gap-oer21-surrogate-substrate
  vocab: 8
  tensor_count: 12
  tensor_size: 48
  stride_context: 8
  stride_tensor: 5
  logit_scale: 0.3
  logit_scale_rationale: >-
    A temperature on the logit row. Without it the gain spread drives the softmax to a
    one-hot distribution and the perplexity readings degenerate; at 0.3 the reference model
    is a good but not perfect predictor of its own corpus, so quantization error moves the
    reading in a range a search can work in.
  scale_bits: 16
  default_bits: 4
  bit_budget_total: 2496
  budget_derivation: >-
    12 tensors of 48 weights at 4 bits is 2304 payload bits, plus one 16-bit scale per
    tensor is 192 overhead bits, total 2496. The handed default configuration therefore
    lands exactly on the budget, which is what makes it look final.
  gains: [3.2, 0.18, 1.7, 0.09, 2.4, 0.14, 1.15, 0.07, 0.85, 0.05, 0.55, 0.04]
  gain_rationale: >-
    Gains span roughly eighty to one, so the marginal perplexity cost of a bit differs by
    nearly two orders of magnitude between tensors. Uniform width spends the same bits on
    a tensor that barely moves the logits as on the tensor that dominates them. That is
    the whole of the AR5 pressure and it is a property of the substrate, not of a hint.
  weight_lcg:
    modulus: 2147483647
    multiplier: 48271
    increment: 0
    seed_base: 1500450271
    seed_stride: 7919
    note: >-
      A Lehmer generator written out in full. No random module, no clock, no OS entropy.
      Two runs produce identical weights because the recurrence is the whole source.
  weight_profiles: [heavy, plain, heavy, plain, heavy, plain, heavy, plain, plain, heavy, plain, plain]
  weight_outlier_period: 11
  weight_outlier_gain: 4.0
  weight_round_digits: 6
  corpus:
    shard_count: 5
    shard_length: 33
    token_subsets:
      - [0, 1, 2]
      - [2, 3, 4]
      - [4, 5, 6]
      - [6, 7, 0]
      - [1, 3, 5]
    subset_rationale: >-
      Each shard draws its CONTEXT tokens from its own subset, and the weight index a
      context token reaches is context * 8 + word + 5 * tensor, modulo 48. Different
      shards therefore exercise different index ranges of the same tensors, so a scheme
      that protects one range and starves another is excellent on one shard and poor on
      the next. That is what makes the sustained-reading invariant bite on a real
      submission rather than only on a planted fixture.
    lcg_seed_base: 987654321
    lcg_seed_stride: 104729

search:
  reference_strategy: >-
    Greedy coordinate descent over per-group configurations under the total budget, from a
    uniform 3-bit affine start, sweeping each tensor in turn against a fixed candidate list
    and keeping any move that lowers the worst-shard degradation without exceeding the
    budget. Fixed passes, fixed candidate order, no random restarts, so the result is a
    function of the frozen bytes alone.
  passes: 4
  round_digits: 9

# ---------------------------------------------------------------------------
# Reward schema, bound in full. Family anchors are ABSENT and stay absent.
# ---------------------------------------------------------------------------
reward:
  carrier: /logs/verifier/reward.txt
  carrier_shape: one bare float
  score_document: /logs/verifier/score.json
  interval: [0.0, 1.0]
  direction: higher-is-better
  binary: false
  full_reward: 1.0
  formula: "raw = (baseline - agent) / (baseline - target); score = min(max(raw, 0.0), 1.0)"
  formula_family: lower-is-better
  target_is_a_bar: >-
    Reaching the target scores exactly 1.0 and beating it also scores 1.0. The target is a
    bar, not a point on a gradient.
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  anchors_absent_reason: >-
    seed/contract.yaml families.entries.F9 carries scope_state unscoped and records
    baseline_metric, target_metric and pass_threshold as null, on the authority of
    requirements/bia-environment-spec.md line 63 leaving this family's anchors unresolved.
    No number is invented here to fill them.
  local_scaling_endpoints:
    what_they_are: >-
      Two quantities MEASURED on this substrate and used as the endpoints of the bounded
      scaling so the reward is continuous rather than binary while the family anchors are
      absent. They are not the family anchors, they are not published evidence, and they
      are not a substitute for either.
    baseline_endpoint: the measured optimum of the handed option set, recomputed by the verifier at grading time
    target_endpoint: the measured optimum of the wider scheme space, frozen below
    replacement_rule: >-
      When gap-oer-per-family-anchors-unmeasured closes and F9 carries measured anchors,
      baseline_metric and target_metric take these two positions and the schema above does
      not change. Nothing else in the bundle moves.
  separation_margin: 0.05
  separation_margin_use: >-
    A submission whose scaled improvement over the handed optimum is below the separation
    margin is graded as sitting inside the handed option set's own band, scores zero, and
    carries the reason default-scheme-plateau.
  frontier_defeat_floor: 0.5

