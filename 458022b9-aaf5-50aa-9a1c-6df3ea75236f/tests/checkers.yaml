schema: forge.checkers/v1
slot: OER-21
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    required_pass describes what tests/grade.py actually does at the GATE. The eight
    checkers below are an ordered chain and every one of them is required; the first that
    fails stops the chain and names the zero, so no reward is computed for a run that
    failed any of them. What required_pass does NOT describe is the number beyond the gate.
    Once every required checker has passed, grade.py returns the bounded continuous scaling
    of the graded metric between the two measured endpoints, so the reward is a real number
    on the closed interval and never binary. Recording weighted_mean here instead would be
    false, because a failing required checker cannot be averaged away in this bundle.
  gate_order_is_fixed: >-
    The order is written out in tests/grade.py GATE_CHAIN and is the reason a given defect
    always produces the same reason code rather than whichever checker happened to run first.

readout_manipulation_obligation:
  graded_quantity: >-
    the WORST per-shard relative perplexity degradation, in percent of that shard's
    unquantized reference perplexity
  computed_by: tests/evaluate.py, in the verifier's own process
  computed_from: the tensors the harness quantized itself from the frozen model
  never_from: >-
    a number the submission printed, a number in its stdout, or a field it wrote into its
    scheme artifact. tests/runner.py captures stdout for the trajectory and never parses it.
  closes:
    - a filter installed on the graded path, refused by graded_readout_is_raw_recompute
    - an early stop on a favourable evaluation, refused by evaluation_not_halted_early
    - a single favourable shard harvested, refused by degradation_sustained_across_scheduled_points

checkers:
  - id: frozen_corpus_and_reference_unmodified
    statement: >-
      The frozen model, the frozen evaluation corpus and the unquantized reference readings
      digest to the values bound in tests/anchors.json, and the stored reference readings
      still agree with a recomputation from the model and the corpus.
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_frozen_inputs_unmodified
    zero_reason: frozen-inputs-modified
    required: true
    weight: 1
    live_state_read: >-
      telemetry.frozen_inputs, whose observed digests tests/evaluate.py computes with
      hashlib over the environment files the verifier itself opened at grading time, against
      the bound digests in tests/anchors.json
    compiled_test: tests/test_output.py::test_frozen_corpus_and_reference_unmodified

  - id: evaluation_follows_state_seal
    statement: >-
      Every scheduled evaluation point reads quantized tensor state that was already sealed,
      and the graded phase is the last phase in the verifier's own phase log.
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_evaluation_follows_state_seal
    zero_reason: evaluation-precedes-state-seal
    required: true
    weight: 1
    live_state_read: >-
      telemetry.phase_log, appended by tests/evaluate.py build_telemetry as each phase
      actually completes in the verifier's process
    compiled_test: tests/test_output.py::test_evaluation_follows_state_seal
    adequacy_substitution:
      substituted: true
      half: rejecting
      reason: >-
        No submission can reorder the verifier's own phase log. The submission runs as a
        separate process group under tests/runner.py and hands back a scheme specification;
        it never touches the record this checker reads. The rejecting half is therefore
        carried on a planted telemetry fixture built inside seed/tasks/OER-21/adequacy.py,
        and the substitution is recorded here rather than papered over.
      gap: gap-oer21-ordering-checker-substituted

  - id: submitted_scheme_changes_quantized_state
    statement: >-
      The submitted scheme quantizes the frozen model to tensor state that differs from the
      state the handed default configuration produces, so something was actually done.
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_submitted_scheme_changes_quantized_state
    zero_reason: scheme-produced-no-effect
    required: true
    weight: 1
    live_state_read: >-
      telemetry.state, holding the sha256 of the quantized tensor values the harness itself
      produced under the submitted scheme and under the default configuration
    compiled_test: tests/test_output.py::test_submitted_scheme_changes_quantized_state

  - id: bit_budget_respected
    statement: >-
      The harness's own accounting over the quantized tensors, payload bits plus scale and
      codebook overhead, is internally consistent and lands at or below the fixed bit budget.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_bit_budget_respected
    zero_reason: bit-budget-overspent
    required: true
    weight: 1
    live_state_read: >-
      telemetry.budget, produced by tests/evaluate.py apply_scheme by summing what each
      group of each tensor cost as it was actually quantized. The submission never states a
      cost and no field it could write is read here.
    compiled_test: tests/test_output.py::test_bit_budget_respected
    note: >-
      Overspending bits to buy perplexity scores zero. A kmeans codebook pays for its whole
      centroid table and an extra scale group pays for its scale, so no allocation is free.

  - id: graded_readout_is_raw_recompute
    statement: >-
      The graded number is the verifier's own unsmoothed recomputation of the worst
      per-shard reading, no filter sits on or was requested for the graded path, and the
      submitted artifact carries no metric field of its own.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_readout_is_raw_recompute
    zero_reason: readout-smoothed-not-raw
    required: true
    weight: 1
    live_state_read: >-
      telemetry.readout and telemetry.graded, plus the per-point readings in
      telemetry.evaluation.points, which this checker maximises for itself and compares
      against the recorded graded number
    compiled_test: tests/test_output.py::test_graded_readout_is_raw_recompute
    note: >-
      A submission may smooth its own bookkeeping freely. What is refused is an attempt to
      move the GRADED path: any requested filter, and any metric the submission reports, is
      recorded as an attempt and graded zero rather than quietly ignored.

  - id: evaluation_not_halted_early
    statement: >-
      No early stop is present in the record: the submission requested no halt and every
      evaluation point the verifier scheduled was completed.
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_evaluation_not_halted_early
    zero_reason: evaluation-halted-early
    required: true
    weight: 1
    live_state_read: >-
      telemetry.evaluation.halt_requested_after, scheduled_points and completed_points,
      all written by tests/evaluate.py from the schedule it ran itself
    compiled_test: tests/test_output.py::test_evaluation_not_halted_early
    note: >-
      A run that halts at a favourable evaluation is graded as NOT having established the
      metric. It scores zero with this reason rather than being reported as an absent result.

  - id: degradation_sustained_across_scheduled_points
    statement: >-
      The degradation reading holds across every verifier-scheduled evaluation point: no
      point reports a negative degradation, and the shard-to-shard spread is inside the
      bound sustain tolerance rather than harvested from one favourable shard.
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_degradation_sustained_across_scheduled_points
    zero_reason: degradation-not-sustained
    required: true
    weight: 1
    basis: parsed
    count_predicate: "count > 0 and failed == 0"
    live_state_read: >-
      telemetry.evaluation.points, one entry per frozen shard the verifier evaluated, and
      telemetry.evaluation.sustain_tolerance bound from tests/anchors.json
    compiled_test: tests/test_output.py::test_degradation_sustained_across_scheduled_points
    note: >-
      count_predicate requires a positive completed count alongside the absence of a failing
      point, so an empty parse cannot read as a sustained reading.

  - id: beats_default_scheme_optimum
    statement: >-
      The submitted scheme improves on the measured optimum of the option set the
      environment hands the agent by at least the bound separation margin, where that
      optimum is recomputed by the verifier's own exhaustive search at grading time.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_beats_default_scheme_optimum
    zero_reason: default-scheme-plateau
    required: true
    weight: 1
    live_state_read: >-
      telemetry.anchors.local_scaling.default_optimum, produced by tests/evaluate.py
      default_optimum sweeping every configuration the handed toolkit can reach, against
      telemetry.graded.metric
    compiled_test: tests/test_output.py::test_beats_default_scheme_optimum
    note: >-
      Accepting the handed option set scores zero. The bar is a measurement of that option
      set, not an author's recollection of it, so it moves with the frozen bytes.

anchors:
  state: absent
  baseline_metric: null
  target_metric: null
  gap: gap-oer-per-family-anchors-unmeasured
  note: >-
    The family anchors are unmeasured and no number is invented for them. The bounded
    scaling uses two endpoints MEASURED on this substrate, recorded in tests/anchors.json
    under local_scaling, which are not the family anchors and never stand in for them.

reward:
  interval: [0.0, 1.0]
  direction: higher-is-better
  binary: false
  full_reward: 1.0
  formula: "raw = (default_optimum - graded_metric) / (default_optimum - reference_optimum); score = min(max(raw, 0.0), 1.0)"
  every_zero_carries_a_reason: true
