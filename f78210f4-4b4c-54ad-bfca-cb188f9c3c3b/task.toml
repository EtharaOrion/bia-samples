schema_version = "1.4"

# Top-level scalar, written above the first table header on purpose. TOML scopes
# every key to the most recent header, so a schema_version placed after [task]
# silently becomes task.schema_version while the file still reads correct.

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-20-quantization-deltas-inside-measurement-noise"
version = "1.0.0"
description = "Reduce perplexity degradation at a fixed bit budget, measured against the unquantized nanoGPT checkpoint by real forward passes over a held-out FineWeb validation split the solver cannot see, where a bit allocation whose delta sits inside measurement noise resolves to a recorded unproven state rather than to a pass or a failure."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "quantization"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-20"
provisional_identifier = "OER-20"
identifier_note = "This slot is staged under its slot id. No canonical content hash, no uuid5 and no uuid-named directory is derived here; identity is a wave-2 operation over every slot at once, because adding solution/policy.yaml to an already-committed bundle moves its hash."
family = "F9"
family_title = "post-training quantization"
title = "Bit allocations whose perplexity delta sits inside measurement noise"
primary_archetype = "AR7"
primary_archetype_title = "Ambiguous Intermediate States"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time; no buffet within the slot"
batch = "OER-2026-08-20"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.objective]
statement = "Reduce perplexity degradation at a fixed bit budget, measured against the unquantized nanoGPT checkpoint over a held-out FineWeb validation split."
metric = "perplexity degradation at a fixed bit budget"
direction = "lower"
frozen = ["the nanoGPT checkpoint", "the frozen architecture", "the bit budget", "the held-out evaluation split"]
free = ["the per-tensor bit allocation", "the quantization scheme"]
graded_quantity = "The verifier's own perplexity, obtained by running the frozen checkpoint forward with the submitted allocation quantized into its real tensors, at every verifier-scheduled point of a held-out FineWeb split absent from every agent-visible container. The unquantized reference is recomputed in the same process over the same batch rather than read from a table. Never a number the submission reported, never a number in its stdout, never a field it wrote."

[metadata.objective.outcomes]
note = "Three outcomes, never two. They are distinct machine-readable strings and none is a synonym for another."
established = "separation-margin-cleared: the lower edge of the measured separation band cleared the bound margin."
failed = "degradation-past-bar: the whole measured band lies below zero, so the allocation measurably degraded perplexity against the control allocation at the same budget."
unproven = "significance-unestablished-at-ceiling: the band still contains the margin at the bound evaluation ceiling. The run COMPLETED and the evaluation budget was the limit. Nothing was established and nothing failed."

[metadata.anchors]
state = "absent"
reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary, full reward exactly 1.0"
reward_formula_lower_is_better = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
reward_target_is_a_bar = "reaching the target scores exactly 1.0 and beating it also scores 1.0"
live_reward_note = "Because both anchors are absent, the live instrument grades an ANCHOR-FREE quantity: the separation between the submitted allocation and the harness's own control allocation, measured on the same held-out points, in the same verifier-derived order, against the same recomputed unquantized reading. A difference of two measurements taken under identical frozen conditions needs no external anchor to be meaningful, which is why this slot can be graded now and still refuses to invent a baseline number."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator ACROSS attempts; bounds the session"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound; bounds ONE attempt"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
pin_note = "Pinned by digest, never by a floating tag. Harbor accepts any string and does not itself require a digest; the digest requirement is this contract's and this lane enforces it."
substrate = [
  "environment/nanogpt_substrate.json",
  "environment/model_stats.json",
  "environment/eval_corpus.json",
  "environment/reference_unquantized.json",
  "environment/nanogpt_model.py",
  "environment/train_nanogpt.py",
  "environment/quantize_lab.py",
]
substrate_note = "environment/nanogpt_substrate.json is replicated byte for byte from the canonical operating point and is the only place the frozen architecture and the frozen run declaration are read from. environment/model_stats.json is the per-tensor manifest of the checkpoint the budget is spent over and carries no perplexity and no error-model coefficient. environment/eval_corpus.json and environment/reference_unquantized.json are declarations of two surfaces this bundle does not carry: the held-out split and the unquantized reading are both the verifier's."
graded_artifact = "/checkpoint/nanogpt_fp32.pt, a float32 parameter snapshot of the frozen 12-layer 768-dim decoder, produced once by environment/train_nanogpt.py under the pinned harness and mounted read-only on both surfaces"
held_out_split = "/verifier/heldout, mounted on the verifier surface only, absent from environment/ and from every agent-visible container"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_note = "The solving agent has open internet egress inside the sandbox so it can fetch its own packages, datasets and models. The deny-list is not a containment proof. The divergence from the stricter batch reading is recorded in solution/grounding.yaml under solver_egress_divergence."
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
egress_note = "The verifier keeps the bound network policy. The asymmetry between the two surfaces is deliberate and is a bound byte here rather than an accident of configuration."
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
reward_carrier_note = "The live verifier binds the carrier to reward.txt holding the bare float. The reason and metric block travel in the companion score document, written from the same trap call."

[solution]
entry_point = "solution/solve.sh"
reference = "solution/reference.py"
policy = "solution/policy.yaml"
grounding = "solution/grounding.yaml"
recompute = "solution/recompute.py"
