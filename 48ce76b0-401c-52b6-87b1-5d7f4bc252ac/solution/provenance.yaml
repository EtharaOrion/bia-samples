generated_by: authored beside solution/grounding.yaml, excluded from the canonical content hash by construction

# This file is the only carrier of the canonical content hash and of the derived uuid, and it
# is excluded from the hash domain. That exclusion is what makes the binding acyclic: no byte
# inside the hash preimage depends on the hash value.

binding_block:
  canonical_content_hash: 2db393779731e29533bdfab1e6b4e1c3df27d2c6c812cef95b353ecc46bad9e9
  uuid: ca8d36b3-cd9a-5fd5-ae26-955705c14af1
  namespace: c53e8f3b-526f-52c0-a04e-89e2269b237d
  files_hashed: 23
  binding_envelope: absent
  pinned_image_digest: sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407

hash_recipe:
  algorithm: sha256
  ordering: relative POSIX paths sorted ascending as byte strings
  per_file_preimage: utf-8 path bytes, then one 0x00 byte, then the file length as 8 bytes big-endian, then the file bytes
  excluded_path_prefixes:
    - trajectories/
  excluded_paths_exact:
    - solution/provenance.yaml
  excluded_directory_names:
    - __pycache__
  uuid_derivation: uuid5(namespace, canonical_content_hash_hex_lowercase)
  independent_recompute: |
    python3 - <<'PY'
    import hashlib, os, uuid
    ROOT = "."
    NS = uuid.UUID("c53e8f3b-526f-52c0-a04e-89e2269b237d")
    rels = []
    for dp, dns, fns in os.walk(ROOT):
        dns[:] = [d for d in dns if d != "__pycache__"]
        for fn in fns:
            rel = os.path.relpath(os.path.join(dp, fn), ROOT).replace(os.sep, "/")
            if rel.startswith("trajectories/") or rel == "solution/provenance.yaml":
                continue
            rels.append(rel)
    h = hashlib.sha256()
    for rel in sorted(rels):
        data = open(os.path.join(ROOT, rel), "rb").read()
        h.update(rel.encode()); h.update(b"\x00")
        h.update(len(data).to_bytes(8, "big")); h.update(data)
    print(h.hexdigest()); print(uuid.uuid5(NS, h.hexdigest()))
    PY

