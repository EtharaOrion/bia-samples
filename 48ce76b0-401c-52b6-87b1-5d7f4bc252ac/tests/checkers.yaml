schema: forge.checkers/v1
task_slot: S03-data-order-optimization

# Every checker below reduces to exactly one of VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING,
# DIVERGENCE, and every checker names the live-state read it traces to. A checker that reduces
# to none of the six, or to two of them, is invalid and this registry is the binding record.
# The implementations are in tests/checkers/kinds.py and the grader in tests/grade.py calls
# them by these identifiers.
#
# reached_by is the carrier tests/test.sh reaches: test.sh runs tests/grade.py, which imports
# tests/checkers/kinds.py, where every selector below is defined. zero_reason is the stable
# code the carrier emits alongside the zero, registered in kinds.py ZERO_REASON and written to
# the reason_code field of the score document by tests/grade.py emit.

reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py returns the floor on the first checker that fails and never blends a partial
    pass into a partial reward, so required_pass is the mode that describes it and weighted_mean
    is not. All seven checkers are marked required because all seven gate. The magnitude above
    the floor is the reward formula recorded below, which required_pass does not itself compute.

checkers:
  - id: frozen_substrate_unchanged
    statement: "the produced substrate digest equals the frozen target digest derived from environment/runner/profiles.py frozen_substrate_fields, covering architecture, initialization, optimizer, schedule, corpus seed and total token budget"
    reduction: VALUE
    reached_by: tests/checkers/kinds.py
    selector: frozen_substrate_unchanged
    zero_reason: frozen-substrate-unchanged-unproven
    required: true
    live_state_read: "field substrate_digest on every record of the harness run record at $BIA_TELEMETRY, written by environment/runner/telemetry.py during the scored run"
    on_failure: "score 0.0, reason_code frozen-substrate-unchanged-unproven, free-text reason names the absent or mismatched digest"

  - id: order_permutation_invariant
    statement: "the property that the multiset of training sequences consumed equals the frozen index set exactly once held across the whole run, so the free axis moved order alone and never the mixture or the token budget"
    reduction: INVARIANT
    reached_by: tests/checkers/kinds.py
    selector: order_permutation_invariant
    zero_reason: order-permutation-invariant-unproven
    required: true
    live_state_read: "fields consumed_total, consumed_unique_count and consumed_sorted_digest on the run_complete record of every arm, accumulated by environment/runner/run_s03.py across every training step of the run"
    on_failure: "score 0.0, reason_code order-permutation-invariant-unproven, free-text reason names the diverging run"

  - id: order_frozen_before_training
    statement: "the required event sequence held: exactly one order_frozen event per run preceded every train_step of that run and no reordering event followed, which forecloses an online feedback curriculum reading its own loss"
    reduction: ORDERING
    reached_by: tests/checkers/kinds.py
    selector: order_frozen_before_training
    zero_reason: order-frozen-before-training-unproven
    required: true
    live_state_read: "the seq field sequence of order_frozen and train_step events per run_id in the record the verifier assembled from the training processes it spawned"
    on_failure: "score 0.0, reason_code order-frozen-before-training-unproven, free-text reason names the out-of-sequence run"

  - id: no_scored_egress
    statement: "a thing that must not exist does not: zero outbound network connect attempts were observed during scored work, which is the setup-only egress binding"
    reduction: ABSENCE
    reached_by: tests/checkers/kinds.py
    selector: no_scored_egress
    zero_reason: no-scored-egress-unproven
    required: true
    live_state_read: "the egress events the verifier received on its own channel from every training process it spawned, reported by the socket connect hook that process installs before the scored interval opens, together with the set of arms that stream actually covered"
    on_failure: "score 0.0, reason_code no-scored-egress-unproven, free-text reason distinguishes an incomplete arm stream from observed connect attempts"
    bounded_claim: "the absence claim covers connect attempts issued through the Python socket interface in the processes the verifier spawned, and it is refused outright when the stream did not cover every expected arm, so an unobserved arm never reads as a clean one"

  - id: order_determinism_divergence
    statement: "two independently derived results agree: the submitted ordering policy is a pure deterministic function of the frozen metadata and does not vary with host identity, clock or random source"
    reduction: DIVERGENCE
    reached_by: tests/checkers/kinds.py
    selector: order_determinism_divergence
    zero_reason: order-determinism-divergence-unproven
    required: true
    live_state_read: "the order digest printed by two independent subprocess invocations of environment/runner/run_s03.py order-digest, launched by tests/grade.py under different working directories and different environment identities"
    on_failure: "score 0.0, reason_code order-determinism-divergence-unproven, free-text reason distinguishes a failed derivation from two disagreeing digests"

  - id: training_consumed_the_submitted_order
    statement: "the action of loading the submission changed live training state in a named way: the submitted arm consumed the exact order the independent derivation produced, and that order differs from every comparator draw, so a submission the trainer ignored cannot score"
    reduction: EFFECT
    reached_by: tests/checkers/kinds.py
    selector: training_consumed_the_submitted_order
    zero_reason: training-consumed-the-submitted-order-unproven
    required: true
    live_state_read: "fields order_digest and first_index_sequence_digest on the order_frozen record of the submitted arm and of every comparator draw in the harness run record at $BIA_TELEMETRY"
    on_failure: "score 0.0, reason_code training-consumed-the-submitted-order-unproven, free-text reason names the missing arm or the mismatched digest"

  - id: improvement_clears_noise_floor
    statement: "the produced statistic bounds a target: over every (graded seed, comparator draw) pair, the mean improvement in final validation loss is positive and its t statistic against the spread of those same observations is at or above the declared threshold. The noise scale is estimated in band from the comparator ensemble rather than authored, and the ordering policy never sees the seeds or draws it is measured against."
    reduction: VALUE
    reached_by: tests/checkers/kinds.py
    selector: improvement_clears_noise_floor
    zero_reason: improvement-clears-noise-floor-unproven
    required: true
    live_state_read: "the final validation loss the verifier measurement process computed itself from the parameters each arm produced, keyed by the seed and draw the verifier assigned when it launched that arm"
    on_failure: "score 0.0, reason_code improvement-clears-noise-floor-unproven, free-text reason distinguishes an incomplete grid from a non-positive mean delta from an undefined statistic under zero comparator spread from a t statistic below threshold"

reward:
  shape: single float on the closed interval from zero to one
  formula: "delta over every (seed, comparator draw) pair is baseline_loss(seed, draw) minus submitted_loss(seed); raw = mean(delta) / target_delta_nats; score = min(max(raw, 0.0), 1.0)"
  zero_attribution: "every zero score is written with a machine-readable reason_code field naming the failing checker identifier, alongside a free-text reason naming the record that failed"
