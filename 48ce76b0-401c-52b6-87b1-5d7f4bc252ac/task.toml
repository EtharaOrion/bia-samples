schema_version = "1.4"

artifacts = [
  "/telemetry/run_record.jsonl",
  "/telemetry/egress_audit.jsonl",
  "/workspace/submission/order.py",
  "/logs/verifier/score.json",
  "/logs/verifier/outcomes.json",
]

[task]
name = "bia/s03-data-order"
version = "1.0.0"
description = "Lower final validation loss by choosing the sampling and curriculum order alone, at a frozen model, a frozen optimizer and a frozen total token budget."
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "data-order", "curriculum", "language-model"]

[metadata]
category = "optimization"
slot = "S03-data-order-optimization"
# max_timeout_hours bounds one refinement session of max_attempts attempts. It is the role the
# 6 in requirements/bia-environment-spec.md plays. It is NOT the per-attempt bound; that is
# [optimization].budget_hours below, and conflating the two encodes a 300 hour session.
max_timeout_hours = 6.0
terminal_disposition = "HOLD:PILOT_REQUIRED"
difficulty_tier = "unmeasured"
reference_score = "0.36194 MEASURED at the graded operating point on one H100, 124 and 152 seconds wall clock over two timed attempts, exit code 0, t statistic 10.339167 against a threshold of 2.0"

[optimization]
# The seven optimization bindings. Every one of them is bound here or the bundle is invalid.
max_timeout_hours = 6.0
budget_hours = 0.12
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
max_attempts = 50
attempt_cap_ceiling = 100
final_selection = "best"
solver_egress = "setup-only"
compute_envelope = "one H100"
reward_kind = "single_float"
reward_range = [0.0, 1.0]
reward_clip = "min(max(raw,0),1)"
reward_path = "/logs/verifier/score.json"
reward_formula = "delta over every (graded seed, comparator draw) pair is baseline_loss minus submitted_loss; raw = mean(delta) / 0.05; score = min(max(raw, 0.0), 1.0)"
budget_hours_role = "per-attempt completion bound, 7.2 minutes, which is 6 hours divided by 50 attempts per requirements/bia-environment-spec.md lines 122 to 135"
rubrics_path = "tests/rubrics.jsonl"

[agent]
timeout_sec = 21600.0
network_mode = "allowlist"
allowed_hosts = ["172.17.0.1"]

[verifier]
timeout_sec = 3600.0
entry_point = "tests/test.sh"
env = { BIA_TELEMETRY = "/telemetry/run_record.jsonl", BIA_EGRESS_AUDIT = "/telemetry/egress_audit.jsonl", BIA_ORDER_MODULE = "/workspace/submission/order.py", BIA_RUNNER = "/opt/bia/runner/run_s03.py" }

[environment]
# Pinned by digest rather than by tag. The digest is carried from the base recorded by the
# verified track3 reference bundle and is UNVERIFIED locally, because this authoring host has
# no egress to resolve it. See solution/provenance.yaml, gap image-digest-unresolved.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 40960
# Public during setup only. The [agent] block narrows to an allowlist for the scored run, and
# the ABSENCE checker no_scored_egress reads the socket hook audit rather than trusting either
# declaration.
network_mode = "public"
env = { BIA_TELEMETRY = "/telemetry/run_record.jsonl", BIA_EGRESS_AUDIT = "/telemetry/egress_audit.jsonl", BIA_CACHE_DIR = "/workspace/.bia_cache" }

[grading]
metric = "final_validation_loss"
direction = "lower_is_better"
comparator = "an ensemble of independent uniform random shuffles on the same graded seed, run inside the same attempt"
graded_seeds = 3
comparator_draws_per_seed = 2
runs_per_graded_attempt = 9
significance_rule = "mean(delta) > 0 and mean(delta) / (sample_sd(delta) / sqrt(n_observations)) >= 2.0, over every (graded seed, comparator draw) pair"
significance_t = 2.0
noise_floor_provenance = "estimated in band from the comparator ensemble during the same attempt, not authored"
target_delta_nats = 0.05
anchors_status = "UNCALIBRATED, authored bars rather than measured anchors, carried as coverage gap anchors-uncalibrated"
lottery_discrimination = "MEASURED at the graded operating point over eight independent shuffle draws, seven of eight rejected, recorded under measured_experiments in solution/grounding.yaml; the residual one in eight is carried as coverage gap comparator-false-positive-rate-one-in-eight"

[frozen]
model = "6 layer decoder, d_model 384, 6 heads, seq_len 512, vocab 2048, tied embeddings, fixed normal init at std 0.02"
optimizer = "AdamW, lr 3e-3, betas 0.9 and 0.95, eps 1e-8, weight decay 0.1, grad clip 1.0, cosine schedule with 56 warmup steps to a floor of 0.1 of peak"
total_tokens = 4096000
corpus = "frozen generated mixture of 8 domains, pinned by corpus_seed and digested in environment/corpus_manifest.json"

[free]
axis = "the sampling and curriculum order"
surface = "submission/order.py exposing build_order(meta) returning n_steps batches of batch_sequences unique sequence indices covering the frozen index set exactly once"
