schema_version = "1.4"

artifacts = [
  "/workspace/artifacts/telemetry.json",
  "/workspace/artifacts/score.json",
  "/workspace/submission/precision_policy.py",
  "/logs/verifier/score.json",
  "/logs/verifier/outcomes.json",
]

[task]
name = "bia/mixed-precision-stability"
version = "1.0.0"
description = "Reach the full precision target loss with zero overflow events under a frozen 8 bit float whose dynamic range defeats the standard mixed precision recipe."
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "mixed-precision", "numerics", "language-model"]
tags = ["optimization", "bounded-continuous"]

[metadata]
slot = "S07"
slot_name = "mixed-precision-stability"
category = "optimization"
archetype = "optimization-under-a-frozen-numeric-surface"
disposition = "HOLD:PILOT_REQUIRED"
disposition_reason = "Local design is valid and locally verified. Difficulty is unmeasured and only an external signed pilot over these frozen bytes can establish it."

frozen_surface = "the numeric format and its dynamic range, pinned as an explicit fixture at environment/format.json and implemented by environment/bia_numerics.py"
free_surface = "loss scaling, accumulation order, and where master weights are kept"

# ---------------------------------------------------------------------------
# The seven optimization bindings. max_timeout and budget_hours are DISTINCT
# fields with distinct roles and neither is an alias of the other. The 6 that
# requirements/bia-environment-spec.md names bounds one fifty-attempt session,
# which is max_timeout's role. Transcribing that 6 into budget_hours would
# encode a 300 hour session, so budget_hours is bound by role instead: it is
# 6.0 divided by 50 attempts, which is 0.12 hours or 7.2 minutes per attempt.
# ---------------------------------------------------------------------------

# BINDING 1 of 7: refinement-loop terminator, in hours, across attempts.
max_timeout = 6.0
max_timeout_hours = 6.0
max_timeout_role = "terminates the refinement loop across all attempts of one session"

# BINDING 2 of 7: per-attempt completion bound, in hours. 7.2 minutes.
budget_hours = 0.12
budget_minutes = 7.2
budget_role = "bounds ONE graded attempt, and is 6.0 hours divided by 50 attempts"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
budget_source = "requirements/bia-environment-spec.md lines 122 to 135 and 137 to 147"
budget_conformance = "UNMEASURED"
budget_conformance_note = "No timing claim is made on the one H100 envelope because none was measured. The operating point was sized against 7.2 minutes by construction and the measurement is owed."

# BINDING 3 of 7: attempt cap. The client ceiling is 100; the project owner elected 50.
max_attempts = 50

# BINDING 4 of 7: which submission of the session becomes the final score.
final_selection = "best"

# BINDING 5 of 7: solver egress. Setup only, no network during scored work.
solver_egress = "setup-only"

# BINDING 6 of 7: compute envelope.
compute_envelope = "one H100"

# BINDING 7 of 7: reward shape.
reward_type = "float"
reward_range = [0.0, 1.0]
reward_full = 1.0
reward_higher_is_better = true
reward_binary = false
reward_formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric); score = min(max(raw, 0), 1)"
reward_gate = "any overflow event in the graded phase emits exactly 0.0 with reason overflow_in_agent_phase"
reward_path = "/logs/verifier/score.json"
reward_metric = "final_validation_loss_relative_to_self_calibrating_anchors"
reward_direction = "lower agent loss is better"

[metadata.operating_point]
fixture = "environment/operating_point.json"
id = "BIA-S07-SCALED-v1"
scaled = true
scaled_reason = "F1 at the upstream nanogpt operating point costs 84 minutes per graded run against a 7.2 minute per-attempt budget, 11.7 times over, so a scaled operating point is mandatory rather than optional."
n_layer = 4
d_model = 256
n_head = 4
sequence_length = 256
vocab_size = 256
approx_parameters = 3210000
steps = 100
micro_batches_per_step = 16
micro_batch_sequences = 16
tokens_per_step = 65536
runs_per_attempt = 3
runs_per_attempt_note = "fp32 control, standard control, then the graded phase. The two controls are cached per session, so the first attempt pays three runs and later attempts pay one."

[metadata.refinement_loop]
enabled = true
iteration_contract = "each iteration the harness lets the agent edit the policy and submit, grades the submission, summarizes the trajectory, and starts the next iteration carrying every prior approach and its reward"
final_selection = "best"
trajectory_rubrics = "tests/rubrics.jsonl"
trajectory_evidence = "trajectories/"

[metadata.difficulty]
tier_claimed = "none"
pass_probability_authored = false
self_solve_claimed = false
measured_reference_score = "UNMEASURED"
measured_reference_score_note = "Pending an orchestrator GPU run on an idle accelerator. The authoring host's single H100 was fully committed to a live evaluation campaign and co-scheduling was forbidden, so no GPU measurement exists. No value is estimated or extrapolated."
defeat_mechanism_status = "UNMEASURED"
defeat_mechanism_design_intent = "The frozen format is chosen so the standard recipe overflows, and the fix requires reasoning about accumulation order rather than recalling a known configuration."
cohort_designed_against = ["gpt5.6-sol", "anthropic/claude-opus-5", "muse-spark-1.2"]
cohort_validity_end = "2026-11-17"

[metadata.smoke]
env_var = "BIA_SMOKE=1"
entry = "solution/solve.sh"
device = "cpu, no CUDA"
identical_code_path = true
reduction_fan_in_matches_full_point = true
observed_inner_seconds = [3.685, 3.558, 3.657]
observed_outer_seconds = [5.871, 5.727, 5.825]
target_seconds = 90
gate_exercised = true
gate_evidence = "the shipped standard recipe raises the overflow flag in smoke mode, measured at 3 events, so the smoke run proves the gate rather than asserting it"

[agent]
timeout_sec = 21600.0
network_mode = "none"
network_mode_note = "setup-only egress: everything the task needs is baked into the image at build time, so the graded run needs no network and is given none"

[verifier]
timeout_sec = 1800.0
entry = "tests/test.sh"
env = { }

[environment]
build = "environment/Dockerfile"
docker_base = "pytorch/pytorch:2.13.0-cuda13.2-cudnn9-runtime"
# The delivered image, pinned by digest rather than by tag. docker_base names the layer this was built FROM and is not
# itself the delivered environment, so a bundle carrying only docker_base pins nothing that Harbor actually runs.
# This is the manifest digest of the image built from environment/Dockerfile on the x86_64 host that executes the task.
docker_image = "bia/s07-mixed-precision-stability@sha256:c1c2e96ac0acedf041a034b5670afc66243dc715f72e4619d22176fa971726dc"
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 20480
network_mode = "public"
network_mode_note = "build and setup only; [agent] narrows to none for the graded run. A precedence pair, not a contradiction."
env = { BIA_ARTIFACTS = "/workspace/artifacts" }

[grading]
verifier_entry = "tests/test.sh"
grader = "tests/grade.py"
checkers = "tests/checkers.yaml"
outcome_carrier = "/logs/verifier/outcomes.json"
gate_rule = "every checker in tests/checkers.yaml must pass; any failure emits 0.0 with reason checker_failed:<names>"
checker_count = 7
checker_kinds = ["VALUE", "ABSENCE", "INVARIANT", "VALUE", "ORDERING", "DIVERGENCE", "EFFECT"]
checker_kinds_note = "each checker reduces to exactly one of VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE and names the live-state read it traces to"

[provenance]
origin = "original"
provenance_date = "2026-08-21"
source_kind = "synthetic"
generator = "bia FORGE authoring lane S07"
upstream_lift = "none"
upstream_note = "The numeric format BIA-E4M3N-v1, the harness, the reduction plan interface and the reference policy are authored for this slot. The corpus is a public domain text and is the only external artifact."
corpus_source = "Project Gutenberg ebook 2701, Moby Dick by Herman Melville, public domain in the United States"
corpus_sha256 = "1cbd5325e9a4adda891a19a44d5ba289941832ad993e3817ace08c93cf15263e"
