  canonical_content_hash: bc9be47f128828bf408556d02b2bb6346c748cadfcbb4f41c370b7546aee5988
  uuid: 75c0cf74-c204-5594-bc30-b1ef830dbcac
  derivation: uuid5(FORGE_TASK_NAMESPACE, canonical_content_hash)
  uuid_name_argument: the 64 character lowercase hexadecimal digest string, not its raw bytes

canonical_content_hash_recipe:
  implementation: solution/recompute.py, functions hash_members, canonical_content_hash, bundle_uuid
  recompute_command: python3 solution/recompute.py --hash
  algorithm: SHA-256
  steps:
    - 1: Walk the bundle root recursively and keep regular files only.
    - 2: Express each path relative to the bundle root using forward slashes.
    - 3: >-
        Exclude any path beginning with trajectories/ because rollout evidence must never change
        frozen bundle identity. Exclude solution/provenance.yaml because it records the digest.
        Exclude any path containing __pycache__, .DS_Store or .pyc because those are build
        residue rather than bundle bytes.
    - 4: Sort the surviving relative paths by the byte-wise ordering of their UTF-8 encoding.
    - 5: >-
        For each path in that order feed the hash: the UTF-8 path bytes, then one 0x00 byte,
        then the content length as an 8 byte big-endian unsigned integer, then the content bytes
        verbatim. The length prefix and the NUL separator make the framing injective, so no
        rename or content shift can collide with a different file set.
    - 6: canonical_content_hash is the lowercase hexadecimal digest.
    - 7: uuid is uuid5 over the namespace with that hexadecimal string as the name.
  excluded_prefixes: ["trajectories/"]
  excluded_paths: ["solution/provenance.yaml"]
  excluded_name_fragments: ["__pycache__", ".DS_Store", ".pyc"]
  member_count: 25
  members_are_listed_by: python3 -c "import sys; sys.path.insert(0,'solution'); import recompute; print('\n'.join(recompute.hash_members()))"

