# PRIVATE. Records the exact recipe by which this bundle's directory name was derived, so the
# orchestrator can recompute it independently rather than taking the author's word for it.
#
# This file is itself EXCLUDED from the canonical content hash. It has to be, because it
# records the hash: including it would make the digest a fixed point of its own output. The
# exclusion is declared here rather than left implicit, and it is one of exactly two.

