        The ASCII fold is recorded because it is real and not a no-op. It removes 1728 em dash
        characters so the bundle carries no em dash byte anywhere. No word of the text changed.
  attestation_status: attestation-unavailable
  attestation_note: >-
    No signed platform attestation binds the corpus fetch instant or its ancestry. The source is
