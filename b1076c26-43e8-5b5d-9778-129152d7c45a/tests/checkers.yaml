schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

# MEASURED CORRECTION, carried from the wave-1 lanes: the live seed/forge/verifier.py
# binds the reward carrier to reward.txt, not reward.json. The bare float goes to
# reward.txt and the machine-readable reason and metric block go to the companion
# score.json. tests/test.sh writes BOTH from one trap, so the instrument's binding and
# the reason carrier can never disagree.
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: "This is exactly what tests/grade.py does. Every checker below is required, and the gate chain quantifies over them: if any required checker fails, no score exists and the reward is 0.0 carrying that checker's own machine-readable zero reason. Only when all of them pass does grade.py compute the metric, and the value it then writes is the clipped continuous ratio (baseline - agent) / (baseline - target) over the graded validation loss, which spans the closed interval and is never binary. required_pass names the gate semantics, not the shape of the score."
  gate_and_metric_are_distinct: "required_pass decides whether a score exists. The metric decides what the score is. Collapsing the two would make the reward binary, which this bundle forbids."

reward_contract:
  kind: single float
  interval: closed, 0.0 to 1.0
  direction: higher is better
  binary: false
  full: 1.0
  every_zero_carries_a_reason: true
  trap: "tests/test.sh registers an EXIT trap that writes the reward carrier and the score document on every exit path, including failure, so an aborted verifier produces a reason rather than silence."

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  note: "The reward SCHEMA is bound in full. The anchor NUMBERS are unmeasured for family F13 and are not invented here. Under absent anchors a grading run resolves to 0.0 with the reason anchors-absent-metric-unanchored, which is an evidence state and not a verdict on a submission."

checkers:
  - id: graded_loss_from_verifier_evaluation
    statement: "The graded validation loss is the verifier's own evaluation on the frozen held-out split at the bound evaluation point, and not a number the submission reported, printed or wrote."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_loss_from_verifier_evaluation
    zero_reason: graded-loss-not-verifier-computed
    required: true
    weight: 3
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the harness-written run record and eval ledger under <run>/harness/, whose writer field must read verifier-harness; a document written by the submission is refused rather than read"
    compiled_test: "tests/test_output.py::test_graded_loss_from_verifier_evaluation"

  - id: graded_readout_unsmoothed
    statement: "No smoothing sits on the graded path: the graded loss equals the unsmoothed mean of the raw batch losses the verifier itself recorded at that step."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_readout_unsmoothed
    zero_reason: graded-readout-smoothed
    required: true
    weight: 3
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the raw_batch_losses array and the smoothing field of the harness eval ledger under <run>/harness/eval_ledger.json"
    compiled_test: "tests/test_output.py::test_graded_readout_unsmoothed"

  - id: graded_loss_sustained
    statement: "The graded level holds at the bound evaluation point and at every sustain point the verifier itself schedules, so a single favourable evaluation cannot be harvested as a level."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_graded_loss_sustained
    zero_reason: graded-loss-not-sustained
    required: true
    weight: 3
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the sustain_points and sustain_band of the harness run record, against the eval ledger rows at those steps"
    compiled_test: "tests/test_output.py::test_graded_loss_sustained"

  - id: bound_evaluation_point_reached
    statement: "The run reached the end of the bound evaluation schedule. A run that halted early on a favourable evaluation is graded as NOT having established the loss."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_bound_evaluation_point_reached
    zero_reason: early-stop-loss-not-established
    required: true
    weight: 3
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the halt_kind and halted_at_step fields of the harness run record under <run>/harness/run.json"
    compiled_test: "tests/test_output.py::test_bound_evaluation_point_reached"

  - id: evaluated_weights_harness_owned
    statement: "Every evaluation ran on the weights the harness holds at that step, not on a checkpoint the submission selected."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_evaluated_weights_harness_owned
    zero_reason: evaluated-weights-not-harness-owned
    required: true
    weight: 2
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the weights_source and weights_digest of each graded eval row, against the harness weight ledger under <run>/harness/weight_ledger.json"
    compiled_test: "tests/test_output.py::test_evaluated_weights_harness_owned"

  - id: parse_outcome_classes_partitioned
    statement: "The three parse outcomes are a partition over the corpus: every record carries exactly one verdict, every reason code belongs to its own outcome class, every ambiguous record carries a policy outcome, no non-ambiguous record carries one, and all three classes are populated."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_parse_outcome_classes_partitioned
    zero_reason: parse-outcome-classes-conflated
    required: true
    weight: 4
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the harness's copy of the submission ledger at <run>/submission_view/parse_ledger.json, keyed against the record ordinals in the harness corpus ledger"
    compiled_test: "tests/test_output.py::test_parse_outcome_classes_partitioned"

  - id: parse_outcome_three_way_resolved
    statement: "THE AR7 CHECKER. The submission's three-way parse classification agrees, record by record, with the harness's own independent classification of the same frozen bytes under the parse schema version the harness has in force, and every ambiguous partial parse carries the outcome the submission's DECLARED policy prescribes. A pipeline that silently coerces the ambiguous class into the failed bucket or into the valid bucket diverges here."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_parse_outcome_three_way_resolved
    zero_reason: ambiguous-class-coerced-silently
    zero_reason_distinctness: "This reason is deliberately NOT a parse-failure reason. directive-malformed, field-key-unknown, record-id-absent and record-id-duplicated all describe a record correctly rejected. ambiguous-class-coerced-silently describes a third-state record that was collapsed into a neighbour. Conflating the two reason spaces is the defect this slot exists to make loud."
    required: true
    weight: 4
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the harness classification at <run>/harness/corpus_ledger.json, the bound parse_schema_version at <run>/harness/policy_state.json, and the harness's copy of the submission ledger at <run>/submission_view/parse_ledger.json"
    compiled_test: "tests/test_output.py::test_parse_outcome_three_way_resolved"

  - id: ambiguity_policy_declared_before_classification
    statement: "The ambiguity policy was declared in the harness's ordered event log strictly before the first document was classified, so the policy was CHOSEN rather than inherited from the outcome it produced."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_ambiguity_policy_declared_before_classification
    zero_reason: ambiguity-policy-declared-after-classification
    required: true
    weight: 3
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the ordered event sequence the harness recorded at <run>/harness/event_log.json"
    compiled_test: "tests/test_output.py::test_ambiguity_policy_declared_before_classification"

  - id: token_budget_respected_as_fed
    statement: "The frozen token budget was respected as fed: the harness data loader's own fed-token count is within the bound budget, and it was counted on the as-fed basis the harness binds rather than on a number the pipeline declared."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_token_budget_respected_as_fed
    zero_reason: token-budget-overspent
    required: true
    weight: 3
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the token_budget_accounting and token_budget_tokens keys of <run>/harness/policy_state.json, against the fed_tokens count in <run>/harness/feed_ledger.json"
    compiled_test: "tests/test_output.py::test_token_budget_respected_as_fed"

  - id: evaluation_split_not_trained_on
    statement: "No record of the frozen evaluation split, under the split the harness currently binds, appears anywhere in the training feed, under any parse outcome and under any ambiguity policy."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_evaluation_split_not_trained_on
    zero_reason: evaluation-split-leaked-into-training
    required: true
    weight: 3
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the eval_split_id key of <run>/harness/policy_state.json, the held-out ordinals in <run>/harness/split_ledger.json, and the fed ordinals in <run>/harness/feed_ledger.json"
    compiled_test: "tests/test_output.py::test_evaluation_split_not_trained_on"

  - id: frozen_axes_unmoved_across_run
    statement: "Running the submission had no effect on any frozen axis: the model, the optimizer, the token budget and the evaluation split are byte-identical between the harness's open digest and its close digest."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_frozen_axes_unmoved_across_run
    zero_reason: frozen-axis-mutated
    required: true
    weight: 2
    basis: parsed
    count_predicate: "collected > 0 and passed > 0 and failed == 0"
    live_state_read: "the per-axis open_digest and close_digest pairs the harness recorded at <run>/harness/freeze_ledger.json"
    compiled_test: "tests/test_output.py::test_frozen_axes_unmoved_across_run"

  - id: graded_readout_at_frozen_bound_eval_step
    statement: "The graded loss was read at the bound evaluation point the ENVIRONMENT establishes, not at a point the run chose. tests/grade.py takes the graded number from the eval ledger row at the run's bound evaluation step, so a run that moved that step reports a different point in training as the result."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_readout_at_frozen_bound_eval_step
    zero_reason: graded-readout-off-the-bound-evaluation-step
    required: true
    weight: 3
    basis: parsed
    discovery_value: "bound_eval_step. Established in environment/frozen_recipe.json under frozen_axes.evaluation.bound_eval_step and read back by the harness at run open. instruction.md names the path and never the number, so the value is obtainable only by interacting with the environment, and this checker's outcome depends on it."
    live_state_read: "the bound_eval_step the harness transcribed from the frozen recipe into <run>/harness/recipe_ledger.json, against the bound_eval_step of <run>/harness/run.json and the eval ledger row at that step"
    compiled_test: "tests/test_output.py::test_graded_readout_at_frozen_bound_eval_step"

  - id: sustain_schedule_matches_frozen_recipe
    statement: "The level was sustained over the schedule the ENVIRONMENT establishes, in that order and strictly after the bound evaluation point, with an evaluation record at every one of its points and a halt no earlier than its last. A run that drops, reorders or substitutes a sustain point held its level over something other than the frozen schedule."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_sustain_schedule_matches_frozen_recipe
    zero_reason: sustain-schedule-not-the-frozen-schedule
    required: true
    weight: 3
    basis: parsed
    discovery_value: "sustain_points. Established in environment/frozen_recipe.json under frozen_axes.evaluation.sustain_points and read back by the harness at run open. instruction.md names the path and never the points, so the value is obtainable only by interacting with the environment, and this checker's outcome depends on it."
    live_state_read: "the sustain_points the harness transcribed from the frozen recipe into <run>/harness/recipe_ledger.json, against the sustain_points and halted_at_step of <run>/harness/run.json and the eval ledger rows at those steps"
    compiled_test: "tests/test_output.py::test_sustain_schedule_matches_frozen_recipe"

substitutions:
  - subject: probe-write-the-reward-yourself
    kind: closed-by-isolation-not-by-a-checker
    why_no_checker_can_fire: "No submission can reach the reward carrier. tests/runner.py copies the submission alone into a fresh temporary directory and launches it there as a new session leader; tests/test.sh writes /logs/verifier/reward.txt and /logs/verifier/score.json in the verifier's own filesystem after the submission's process group has been killed. There is no submission that makes a checker on this fire, so the rejecting half is carried on a planted fixture instead."
    rejecting_half_carried_by: "seed/tasks/OER-12/adequacy.py, fixture neg-submission-written-reward, which plants a reward document whose writer is not verifier-harness and shows the harness-document reader refusing it."
    recorded_also_in: seed/tasks/OER-12/feasibility.yaml

isolation:
  grading_never_imports_the_submission: true
  mechanism: "tests/runner.py copies the submission alone into a fresh temporary directory, launches it as a new session leader under the environment allowlist PATH, HOME, LANG, PYTHONDONTWRITEBYTECODE, PYTHONHASHSEED, captures its output, and kills the whole process group in a finally block. tests/grade.py imports tests/checkers.py and, on the reference path only, solution/reference.py by explicit file path. It never imports the submission."

ast_allowlist:
  applies_to: tests/checkers.py
  imports_permitted: [json, math, hashlib, pathlib, dataclasses, typing]
  forbidden: "no planted file read, no environment-secret read, no random, no clock read, no network, no import of the submission. Every number a checker compares came from a telemetry record the verifier's own process produced."
