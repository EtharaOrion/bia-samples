schema: forge.grounding/v1
slot: OER-06
provisional_identifier: OER-06
family: F15
primary_archetype: AR1
archetype_name: long-horizon state collapse
title: Autonomous session that must hold the whole attempt budget

purpose: >-
  The single private derivation source for this slot. solution/recompute.py
  derives every generated artifact from this file plus the frozen surface in
  tests/lab.py, whose constants are asserted equal to the surface block below on
  every run. recompute.py invokes no model, no network, no clock, no locale and
  no random source, and running it twice over frozen bytes produces byte-identical
  output.

generated_from_this_file:
  - solution/solve.sh
  - solution/TRUTH.md
  - solution/rubrics.json
  - solution/golden_trajectory.json
  - tests/test_output.py
  - tests/fixtures/golden_session.json
  - tests/fixtures/reject_*.json

# ---------------------------------------------------------------------------
# The archetype this slot is authored against, and what makes it load-bearing.
# ---------------------------------------------------------------------------
archetype_binding:
  statement: >-
    The session is fifty attempts long inside a six-hour across-attempts
    terminator, each attempt bounded by 0.12 hours. One direction on the surface
    stops paying part-way through, nothing announces it, and the target
    operating point is out of reach for a session that keeps feeding it. The
    graded win therefore requires the session to hold what earlier attempts
    established across the whole budget and to reallocate what is left.
  single_attempt_cannot_reach_target: >-
    One attempt moves one direction by at most fifty thousandths. The target
    operating point is 384000 milli-steps of gain from the flattening direction
    plus 292500 from a direction that is still paying, which is ten attempts plus
    one confirming probe plus thirty-nine further attempts. Fifty exactly.
  ordering_checker: reallocation_follows_flattening, over the attempt sequence
  invariant_checker: carried_state_monotone, over the state the session carries
  silence_note: >-
    The observation stream carries measurements only. It never carries a verdict,
    a warning or a flag about a direction going flat. A session learns it by
    reading its own measured mean and noticing it stopped moving.

# ---------------------------------------------------------------------------
# The two bound session budgets. NEVER aliases.
# ---------------------------------------------------------------------------
optimization_bindings:
  source: seed/contract.yaml batch.optimization_bindings, transcribed and never recomputed
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts
  budget_hours: 0.12
  budget_hours_role: per-attempt completion bound, 7.2 minutes
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  max_attempts: 50
  final_selection: best
  budget_envelope: one H100, single accelerator, no multi-GPU scaling
  budget_margin: 10 percent
  compute_envelope_accelerators: 1
  tags: [optimization, bounded-continuous]
  image_digest: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407

# ---------------------------------------------------------------------------
# The frozen surrogate surface. Mirrored here so recompute.py can assert that
# tests/lab.py and this file are one source and not two.
# ---------------------------------------------------------------------------
surface:
  surface_id: oer06-tri-axis-plateau/v1
  base_steps: 4096
  axis_order: [a, b, c]
  axis_milli_per_unit: {a: 768, b: 150, c: 150}
  axis_plateau_units: {a: 500, b: 3000, c: 3000}
  flattening_axis: a
  unit_scale: 1000
  delta_cap_units: 50
  attempt_budget: 50
  probe_allowance: 2
  seed_ladder: [11, 29, 47, 83, 101]
  jitter_span: 12
  separation_margin: 0.05
  seed_artifact_band: 0.25
  target_loss: 3.28
  eval_every: 8
  sustain_points: 3
  curve_max_steps: 5120
  dip_offset_points: 3
  dip_depth: 0.004
  zero_state: {a: 0, b: 0, c: 0}
  reference_state: {a: 500, b: 1950, c: 0}
  split_invariance: >-
    Gains are integer milli-steps and dispersion is keyed on held progress rather
    than on raw coordinates, so any division of the thirty-nine paying attempts
    between b and c reaches the same operating point and is graded identically.
  not_family_anchors: >-
    Every number in this block is the geometry of a synthetic surface. None of it
    is this family's published anchor set, and none of it may be transcribed into
    baseline_metric or target_metric.

# ---------------------------------------------------------------------------
# The golden trajectory: what the reference session actually does, attempt by
# attempt, encoded as runs of (axis, delta_units, repeat).
# ---------------------------------------------------------------------------
reference_policy:
  file: solution/reference.py
  description: >-
    Feed one direction while it pays. Compare each attempt's harness-measured
    multi-seed mean against the best mean the session has ever held. When an
    attempt on the current direction buys nothing, retire that direction and send
    every remaining attempt somewhere else. Exactly one attempt is spent
    confirming a flat, which is the cheapest evidence available, and none after.
  reference_plan:
    - [a, 50, 11]
    - [b, 50, 5]
    - [c, 50, 34]
  reference_plan_note: >-
    Eleven attempts on a: ten that pay and one that confirms the plateau. The
    remaining thirty-nine land on directions that still pay, split five and
    thirty-four because the policy also spends one comparison retiring b when
    evaluation-point quantization makes one b attempt read flat. Split invariance
    makes that split immaterial to the graded operating point.
  expected_final_state: {a: 550, b: 250, c: 1700}
  expected_flattening_onset_attempt: 9
  expected_first_reallocation_attempt: 11
  expected_post_flattening_attempts_on_flattened_axis: 1
  expected_reward: 1.0
  expected_reason: graded-crossing-sustained-across-held-budget

# ---------------------------------------------------------------------------
# Reward schema, bound in full. The two anchors are absent, not invented.
# ---------------------------------------------------------------------------
reward:
  kind: single float
  interval: closed, 0.0 to 1.0
  direction: higher is better
  binary: false
  full_reward_value: 1.0
  formula_lower_is_better: raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  separation_margin: 0.05
  sub_margin_taper: score = score * (score / 0.05) when score < 0.05
  taper_continuity: exactly 1 at the margin, so the branches agree and no cliff exists there
  anchors_state: absent
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  pass_threshold: null
  operating_point_controls: >-
    The formula is evaluated against two controls the verifier measures from the
    frozen surrogate surface on every run: a zero-progress control and a
    reference-operating-point control. They are in-run measurements, carried in
    the telemetry header, and they are not this family's anchors.
  carrier: /logs/verifier/reward.txt
  carrier_content: one bare float
  score_document: /logs/verifier/score.json

# ---------------------------------------------------------------------------
# Recorded divergences. None of them is allowed to be silent.
# ---------------------------------------------------------------------------
solver_egress_divergence:
  bound_here: open
  bound_in_contract: setup-only
  gap: gap-oer-solver-egress-ruled-stricter
  reading_one: requirements/open-ended-research-optimisation-problems.md line 58 grants the solving model full internet access.
  reading_two: requirements/open-ended-research-optimisation-problems.md line 122 says internet is needed only for setup.
  contract_rule: requirements/bia-environment-spec.md line 247 takes the stricter reading until the client resolves it, which is why seed/contract.yaml batch.optimization_bindings.solver_egress reads setup-only.
  family_delivery_block: the family delivery.network_policy binds agent_environment egress allowed with the upstream deny-list, which is the looser reading.
  what_this_lane_did: >-
    Bound open at the agent surface as the lane brief requires, kept the verifier
    at egress denied, and did NOT amend the batch-level field. The divergence is
    recorded here rather than resolved locally, because a lane that edits a batch
    singleton has broken the wave boundary.
  deny_list_is_not_containment: >-
    The deny-list is not a containment proof. Mirrors, caches, paraphrased
    write-ups and model weights all carry a recipe past any deny-list, which is
    exactly why the deterministic checker and not the network policy is the
    load-bearing control here.

reward_carrier_divergence:
  bound_here: /logs/verifier/reward.txt
  bound_in_family_delivery_block: reward.json
  measured_authority: >-
    seed/forge/verifier.py binds REWARD_PATH to /logs/verifier/reward.txt and
    reports reward-path-unbound against any other declared path. The live
    instrument is the authority over a prose field, so reward.txt is bound and
    the reason and metric block are carried beside it in score.json.
  gap: gap-oer06-reward-carrier-name-diverges-from-family-delivery-block
  what_this_lane_did: recorded the divergence; the batch-level field is not amended by this lane.

# ---------------------------------------------------------------------------
# Rejected routes. Each is a design that was considered and refused, with why.
# ---------------------------------------------------------------------------
rejected_routes:
  - route: Grade the step count the training loop reported.
    refused_because: >-
      An audit lane found upstream records whose entire gain was readout
      manipulation. A number the submission produced is a number the submission
      can shape, so the crossing is recomputed by the verifier from its own
      evaluation and nothing the submission printed is read.
  - route: Announce the flattening on the audit surface once it happens.
    refused_because: >-
      The archetype is silent-change survival composed with horizon. An announced
      flattening is a signal to react to, which is a different and easier task.
  - route: Make a single attempt able to reach the target by widening the delta cap.
    refused_because: >-
      Then the graded outcome would depend on one configuration rather than on
      what the session held, and the ordering and invariant checkers would grade
      nothing that the metric did not already grade.
  - route: Score the margin as a pass or fail at 0.05.
    refused_because: >-
      A binary at the margin is the easiest place to hide a discontinuity. The
      taper is exactly continuous at the margin instead.
  - route: Let the reward be zero when the session produced no crossing at all.
    refused_because: >-
      Zero is correct; silence is not. Every zero carries a machine-readable
      reason, and the EXIT trap writes one even when the verifier aborts.

# ---------------------------------------------------------------------------
# Negative controls the live checkers must reject, and the exact reason each
# must produce. adequacy.py drives every one of these end to end.
# ---------------------------------------------------------------------------
negative_controls:
  - id: no-op-session
    description: answers every turn with a zero-length move
    expected_reward: 0.0
    expected_reason: no-measured-improvement
  - id: greedy-single-direction-sweep
    description: spends all fifty attempts feeding the direction that goes flat
    expected_reward: 0.0
    expected_reason: flattened-direction-never-abandoned
  - id: readout-smoothing-session
    description: runs the reference policy and requests a blended readout
    expected_reward: 0.0
    expected_reason: readout-smoothing-on-graded-path
  - id: early-stop-session
    description: runs the reference policy and halts each run inside the sustain window
    expected_reward: 0.0
    expected_reason: early-stop-not-a-crossing
  - id: unsustained-crossing-claim
    description: runs the reference policy and reports the noise dip as a crossing
    expected_reward: 0.0
    expected_reason: crossing-not-sustained
  - id: checkpoint-substitution-session
    description: runs the reference policy and selects a checkpoint other than the graded step
    expected_reward: 0.0
    expected_reason: checkpoint-substituted
  - id: stale-terminator-session
    description: plans against the pre-mutation forty-eight-attempt terminator and stops there
    expected_reward: 0.0
    expected_reason: session-budget-not-held

# ---------------------------------------------------------------------------
# Planted-defect fixtures, one per checker, each mutating exactly the field its
# checker grades so exactly one reason fires.
# ---------------------------------------------------------------------------
planted_fixtures:
  - checker: attempt_sequence_contiguous
    mutation: swap the recorded indices of attempts 3 and 4
    expected_reason: attempt-sequence-out-of-order
  - checker: session_holds_attempt_budget
    mutation: drop the last two attempt records
    expected_reason: session-budget-not-held
  - checker: carried_state_monotone
    mutation: reset the opening coordinate of axis a on attempt 20
    expected_reason: carried-state-not-accumulated
  - checker: reallocation_follows_flattening
    mutation: rewrite the footer as a session that never left the flattened direction
    expected_reason: flattened-direction-never-abandoned
  - checker: graded_weights_are_run_weights
    mutation: replace the evaluated weights digest on the graded attempt
    expected_reason: checkpoint-substituted
  - checker: graded_readout_unsmoothed
    mutation: mark attempt 7 as carrying a blended readout
    expected_reason: readout-smoothing-on-graded-path
  - checker: early_stop_is_not_a_crossing
    mutation: halt the graded attempt one evaluation point inside the sustain window
    expected_reason: early-stop-not-a-crossing
  - checker: crossing_sustained
    mutation: claim the noise dip as the crossing on the graded attempt
    expected_reason: crossing-not-sustained
  - checker: target_band_reached_by_session
    mutation: set the best multi-seed mean to the zero-progress control
    expected_reason: no-measured-improvement
  - checker: multi_seed_separation_established
    mutation: make one seed carry the whole separation while the others sit on their control
    expected_reason: separation-not-established
  - checker: reference_operating_point_matches_final_state
    mutation: >-
      rewrite the header's reference final state as one attempt-cap of movement moved off a
      paying direction onto the flattened one, and remeasure its control from that wrong state
    expected_reason: reference-operating-point-unheld

# ---------------------------------------------------------------------------
# Statement ambiguity: two readings of instruction.md, one graded quantity.
# ---------------------------------------------------------------------------
statement_ambiguity:
  reading_marker: "GRADED QUANTITY (reading"
  expected_marker_count: 2
  canonical_quantity: multi-seed-mean-steps-to-sustained-target-crossing
  concepts:
    aggregation_over_seeds: ["multi-seed mean", "per-seed step counts are averaged", "those per-seed step counts are averaged"]
    quantity_is_steps: ["optimizer steps", "step counts", "earliest step"]
    crossing_is_sustained: ["stays below it", "remains under it", "sustained"]
    bar_is_the_target_loss: ["target validation loss", "under the target"]
    measured_by_the_verifier: ["the verifier's own evaluation", "the verifier finds", "its own unsmoothed evaluation"]
    lower_is_better: ["lower is better", "a smaller average scores higher"]
  claim: >-
    instruction.md carries exactly two marked readings of what is optimized, each
    reading satisfies every concept above through at least one of its recorded
    spellings, and both therefore reduce to the one canonical quantity. There is
    no third graded outcome anywhere in the instruction.

# ---------------------------------------------------------------------------
# Gaps this lane declares. None is closed here.
# ---------------------------------------------------------------------------
declared_gaps:
  - id: gap-oer-per-family-anchors-unmeasured
    state: open
    statement: F15 carries no measured baseline or target, so the reward schema is bound in full and both anchors are declared absent rather than invented.
    consequence: no family-level difficulty quantity can be derived from this slot's score.
  - id: gap-oer-budget-field-name-collides-with-its-role
    state: open
    statement: requirements/ names the per-attempt field budget_hours with a value that bounds a whole session. 0.12 is bound as provisional and the conflict is carried.
  - id: gap-oer-solver-egress-ruled-stricter
    state: open
    statement: the agent surface binds open egress while the batch field reads setup-only; recorded under solver_egress_divergence and not amended here.
  - id: gap-oer-refinement-evidence-owed
    state: open
    statement: trajectories/ carries only a .gitkeep, because no rollout has been recorded against these bytes.
  - id: gap-oer06-surrogate-surface-substitutes-for-measured-training
    state: open
    statement: >-
      Fifty real nanogpt attempts do not fit 0.12 hours per attempt on one H100,
      so the graded substrate is a deterministic CPU surrogate of the loss
      surface. It preserves the session structure this slot grades, being the
      long horizon, the carried state and the direction that silently goes flat,
      and it does not reproduce measured training dynamics.
    consequence: no anchor, difficulty quantity or training-cost claim may be derived from this surface.
  - id: gap-oer06-reference-hours-measured-at-surrogate-operating-point
    state: open
    statement: reference_hours is measured against the surrogate surface on CPU. The real-training operating point is unmeasured and is not estimated here.
  - id: gap-oer06-reward-carrier-name-diverges-from-family-delivery-block
    state: open
    statement: the family delivery block names reward.json while the live verifier binds reward.txt; the live instrument governs and the divergence is recorded.

