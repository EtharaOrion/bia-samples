# ---------------------------------------------------------------------------
# Content the generated artifacts are written from.
# ---------------------------------------------------------------------------
truth:
  headline: The session is the unit of work, and the budget is the resource.
  paragraphs:
    - The surface pays along three directions. One of them, a, is worth 384000 milli-steps and stops paying at 500 units, which ten attempts of the bound cap reach exactly. The other two pay 150 milli-steps per unit and do not saturate inside fifty attempts.
    - A session that opens on a and keeps feeding it reaches 384000 milli-steps of gain and then nothing, no matter how many of its fifty attempts it spends there. Nothing tells it. Its measured mean simply stops moving.
    - The reference spends ten attempts taking a to its plateau, one attempt confirming that the eleventh bought nothing, and the remaining thirty-nine on a direction that still pays. That is fifty attempts exactly, which is why the whole budget is load-bearing rather than nominal.
    - Every attempt not spent on a paying direction costs 7500 milli-steps of the 676500 the target is worth, so the reward degrades continuously with waste rather than falling off a cliff. Wasting more than the probe allowance on the flattened direction is a different failure and is gated to zero with its own reason.
    - The graded crossing is recomputed by the verifier from its own unsmoothed evaluation and must hold across the further evaluation points the verifier schedules. The surface carries a noise dip that sits under the target for exactly one evaluation, so a blended readout, an early halt and a claimed crossing all produce no crossing rather than an early one.

rubric_criteria:
  - id: reference-reaches-the-target-operating-point
    criterion: The reference session's best multi-seed mean equals the verifier's in-run reference-operating-point control, so the clipped formula returns exactly 1.0.
  - id: reference-holds-the-whole-attempt-budget
    criterion: The reference answers all fifty turns and the telemetry records fifty attempts against a terminator of fifty.
  - id: reference-reallocates-after-the-flat
    criterion: The reference leaves the flattened direction at attempt 11, one attempt after the plateau is reached at attempt 9, spending exactly one confirming probe.
  - id: reference-requests-no-readout-directive
    criterion: The reference requests no blended readout, no halt, no checkpoint and no claimed crossing, so every readout-integrity checker passes on its accepting half.
  - id: reference-separates-on-every-seed
    criterion: Every seed on the bound ladder separates from its own control with a spread of zero, well inside the bound artifact band.
  - id: reference-final-state-is-the-graded-operating-point
    criterion: The reference session ends carrying expected_final_state, and the reference-operating-point control the reward divides by is the operating point tests/lab.py measures at exactly that state, so the graded scale is read back from live state rather than authored beside it.
  - id: reference-is-the-bytes-the-checkers-accepted
    criterion: The sha256 of solution/reference.py recorded in the golden trajectory equals the digest the telemetry header carries, so the accepting half proves the checkers accept this reference and not merely some file.

