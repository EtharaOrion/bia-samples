    budget_hours: '0.12 (per-attempt bound, 7.2 minutes; never an alias of max_timeout_hours)'
    max_attempts: '50'
    final_selection: 'best'
    budget_envelope: 'one H100, single accelerator, no multi-GPU scaling'
    budget_margin: '10 percent'
    tags: '["optimization", "bounded-continuous"], under the key `tags` at metadata.tags'
