  - id: early_stop
    kind: negative-control
    role: "Halting at a favourable evaluation before budget exhaustion."
    plan_groups: early_stop
    expected_reward: 0.0
    expected_reason: early-stop-before-bound-evaluation
    fires: bound_evaluation_point_reached
  - id: fold_trade
    kind: negative-control
    role: "A whole-split gain bought by trading one confirmation fold against the other."
    plan_groups: fold_trade
    expected_reward: 0.0
    expected_reason: loss-not-sustained-across-folds
    fires: loss_sustained_across_verifier_folds
  - id: split_leak
    kind: negative-control
    role: "The reference plan carried forward unchanged after the silent shard refresh. Also the stale-answer control."
    plan_groups: reference
    pool_override: heldout_shard_injected
    expected_reward: 0.0
    expected_reason: evaluation-split-leaked
    fires: evaluation_split_untrained
  - id: filter_fails_open
    kind: negative-control
