pool_overrides:
  heldout_shard_injected:
    note: "A shard refresh silently pulled evaluation-partition bytes into technical. The reference plan feeds technical:0..3 and therefore leaks."
    source: technical
    seeds: {"0": "heldout:20", "1": "heldout:21", "2": "heldout:22", "3": "heldout:23"}
  filter_declared_but_ineffective:
    note: "The pool declares heldout-shard-drop while forum-dump still carries a held-out-seeded document. The reference plan never feeds forum-dump, so the leak checker stays silent and only the divergence checker fires."
    source: forum-dump
    seeds: {"0": "heldout:0"}
    filter_declared: heldout-shard-drop
  budget_unit_documents:
    note: "The budget ledger silently redenominated. Nothing announces it."
    budget_unit: documents

statement_ambiguity:
  reading_one: >-
    Reading instruction.md's What is free section alone: the free variable is the
    allocation of the fixed token budget across sources, and the graded quantity is
    the verifier's recomputed validation loss at budget exhaustion.
  reading_two: >-
    Reading environment/plan_schema.md's What is frozen and What is free sections
    alone: total_tokens is frozen, the estimator is frozen, the evaluation split is
    frozen, and the allocation of the budget is free.
  reduces_to: >-
    Both readings reduce to the same graded quantity: minimise the verifier's
    unsmoothed recomputation of validation loss on the frozen split, computed from
    the harness-owned count table at the point where exactly budget_tokens tokens
    have been fed. There is exactly one graded outcome. No second quantity is
    graded, no tie-break is left open, and neither reading admits a different
    optimum.

lower_layer:
  agent_roots: [task.toml, instruction.md, environment]
  excluded_by_construction: [tests, solution, trajectories]
  proof: >-
    seed/tasks/OER-08/adequacy.py assembles the agent surface the way Harbor
    assembles it for a NON-ORACLE agent, using the live seed/forge/launcher.py
    assembly path, then attempts a write to every lower-layer path an agent can name
    and asserts every attempt is refused. Mounting behaviour is never the proof: no
    mount is performed, and a read-only claim resting on a mount that never happened
    would be a claim about nothing.

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: capped below Hard
  perception_axis_exemption: >-
    This task family is text and code only, so the Perception axis carries no
    category. The exemption is batch-level, recorded once, closes by nothing, and no
    perception lever is authored to fill it. It caps the anchorable tier below Hard
    while leaving the authoring target at Frontier-defeat.
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  no_difficulty_claim: >-
    Nothing in this bundle claims a difficulty. The design obligations above are
    design obligations and are never stated as a difficulty argument.

gaps:
  - id: gap-oer-per-family-anchors-unmeasured
    state: carried
    effect: baseline_metric and target_metric are absent; the reward schema is bound in full and no anchor number is invented.
  - id: gap-oer-budget-field-name-collides-with-its-role
    state: carried
    effect: budget_hours is bound to 0.12 and marked provisional in task.toml.
  - id: gap-oer-solver-egress-ruled-stricter
    state: carried
    effect: the bundle binds open at the agent surface and records the divergence above rather than amending the batch field.
  - id: gap-oer08-magnitude-normaliser-is-substrate-local
    state: declared by this lane
    effect: >-
      the magnitude term is normalised between two substrate-local calibration
      points recomputed by the verifier, which stand in for absent anchors. They are
      not comparable across slots and are not published evidence. Closes when F12
      anchors are measured.
  - id: gap-oer08-split-leak-detected-by-exact-content-digest-only
    state: declared by this lane
    effect: >-
      evaluation_split_untrained compares exact document content digests, so it
      catches a copied or re-labelled held-out document and does not catch a
      paraphrase or a near-duplicate. No near-duplicate floor is calibrated for this
      substrate, so none is authored. The load-bearing structural control is that no
      pool document id resolves to the split and the split lives verifier-side.
      Closes when a near-duplicate floor is calibrated.

rubric_rows:
  - id: sol-mixture-composition
    rubric: "The submitted plan's consumed-token composition equals the evaluation distribution, the equal mean of A, B and C, to within rounding at document granularity."
  - id: sol-budget-exact
    rubric: "The plan feeds exactly 12000 tokens, measured from the harness feed ledger."
  - id: sol-selection-used
    rubric: "The plan selects inside at least one source rather than consuming a whole source in its published proportions."
  - id: sol-repetition-used
    rubric: "The plan consumes at least one document more than once, because the on-distribution documents total 3500 unique tokens against a 12000 token budget."
  - id: sol-no-split-contact
    rubric: "No document the plan names carries evaluation-split bytes."
  - id: sol-readout-untouched
    rubric: "The graded readout contract is left declaring no smoothing."
  - id: sol-reward
    rubric: "The plan scores exactly 1.0 through the live gate chain."

