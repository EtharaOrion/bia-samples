    expected_reason: pool-state-diverged-from-graded-verdict
    fires: pool_state_matches_graded_pool
  - id: readout_smoothed
    kind: negative-control
    role: "EMA declared on the graded readout path."
    plan_groups: reference
    readout_override: ema
    expected_reward: 0.0
