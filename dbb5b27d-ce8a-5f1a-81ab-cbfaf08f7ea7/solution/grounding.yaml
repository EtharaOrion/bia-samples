schema: forge.grounding/v1

# PRIVATE derivation source for OER-11. This file is the SINGLE source from which
# solution/recompute.py derives every generated artifact: the golden trajectory, the
# checker fixtures, solve.sh, TRUTH.md, rubrics.json and tests/test_output.py.
#
# recompute.py invokes NO model, NO network, NO clock, NO locale and NO random source.
# Running it twice over frozen bytes produces byte-identical output.

slot: OER-11
provisional_identifier: OER-11
identity_note: >-
  No canonical_content_hash, no uuid5, no final uuid directory name, no canary token, no
  provenance carrier and no signature file is authored by this lane. Wave 2 does
  identity for every slot at once.
family: F13
family_title: parse and tokenize pipeline
archetype: AR9
archetype_title: Temporal Reasoning Gap
archetype_count: 1
title: Parser built against a corpus snapshot that moves during the session
tags: [optimization, bounded-continuous]

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  anchorable_tier: capped below Hard
  anchorable_tier_exemption: >-
    This task family is text and code only, so the Perception axis carries no category;
    the exemption is batch-level, recorded once, closes by nothing, and no perception
    lever is authored to fill it. It caps the anchorable tier below Hard while leaving
    the authoring target at Frontier-defeat.
  difficulty_claim: >-
    none. No difficulty claim is made anywhere in this bundle, and the design
    obligations below are design obligations rather than difficulty arguments.

metric:
  name: validation loss of the trained model on the frozen held-out evaluation split
  direction: lower
  frozen: [token budget as fed, model, optimizer, evaluation split]
  free: [the parse and tokenize pipeline the agent builds over the raw corpus]

anchors:
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  gap: gap-oer-per-family-anchors-unmeasured
  authority: >-
    seed/contract.yaml families.entries.F13 carries scope_state unscoped and scope null,
    and records that the spec forbids authoring a family against an unmeasured baseline.
  schema_bound: >-
    The reward schema is fully bound: carrier /logs/verifier/reward.txt as a bare float,
    companion document /logs/verifier/score.json, closed interval [0.0, 1.0], higher
    better, never binary, full reward exactly 1.0, formula
    raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric),
    clip score = min(max(raw, 0.0), 1.0). Only the two numbers are absent.
  resolution: >-
    Both numbers are read at grade time from the harness-owned anchor record at
    /logs/harness/anchor_record.json, which this lane does not author. An absent, null or
    degenerate record resolves to reward 0.0 with reason anchors-unresolved.
  fixture_anchor_note: >-
    The anchor values under fixtures.anchor_probe below are FIXTURE INPUTS that exercise
    the reward schema inside seed/tasks/OER-11/adequacy.py. They are marked
    fixture_only: true, they are not bound anywhere in the bundle, and they are not a
    baseline or a target for family F13.

solver_egress_divergence:
  bound_in_task_toml:
    agent_solver_egress: open
    agent_solver_egress_deny: [github.com, raw.githubusercontent.com, objects.githubusercontent.com]
    verifier_egress: denied
  reading_one:
    source: requirements/open-ended-research-optimisation-problems.md line 58
    says: the solving model is granted full internet access
  reading_two:
    source: requirements/open-ended-research-optimisation-problems.md line 122
    says: internet is needed only for setup
  batch_field:
    carrier: seed/contract.yaml batch.optimization_bindings.solver_egress
    value: setup-only
    ruled: >-
      The batch field takes the stricter reading under gap-oer-solver-egress-ruled-stricter,
      from requirements/bia-environment-spec.md line 247.
  what_this_lane_binds: >-
    open, at the agent surface, per the lane spec and per the family delivery
    network_policy block that binds agent_environment egress allowed with the upstream
    deny-list.
  divergence_is_recorded_not_resolved: >-
    This lane does NOT amend the batch-level field. The divergence between the
    batch-level setup-only and the agent-surface open is recorded here, by name, with
    the gap id, and it is never silent.
  gap: gap-oer-solver-egress-ruled-stricter
  deny_list_is_not_a_containment_proof: >-
    Mirrors, caches, paraphrased write-ups and released model weights all carry a recipe
    past any deny-list. That is exactly why the deterministic checker, and not the
    network policy, is the load-bearing control in this bundle.

readout_manipulation_obligation:
  adapted_to: a loss metric rather than a step-count metric
  one: >-
    The verifier computes the graded validation loss itself, on the frozen held-out
    split, from harness-owned weights, at the bound evaluation point. It is never a
    number the submission reported, printed or wrote. Checker
    graded_loss_verifier_computed, reduction VALUE.
  two: >-
    No smoothing on the graded path. Every graded evaluation point must declare filter
    none and must equal the raw unsmoothed mean of its own per-batch records. Checker
    readout_unsmoothed, reduction VALUE, zero_reason readout-smoothing-on-graded-path.
  three: >-
    The level must be sustained. It must hold at the bound evaluation step and at every
    verifier-scheduled subsequent point, within the bound slack, so a noise dip cannot
    be harvested. Checker loss_sustained_across_bound_points, reduction INVARIANT.
  four: >-
    An early stop on a favourable eval is graded as NOT having established the loss, and
    scores zero with reason early-stop-loss-not-established rather than reading as an
    absent result. Checker early_stop_is_not_an_established_loss, reduction ABSENCE.
  five: >-
    The weights evaluated are the weights the run produced at that step, proved against
    the harness weight ledger. Checker graded_weights_are_harness_owned, reduction VALUE.

temporal_design:
  statement: >-
    The corpus snapshot the agent built its parser against MOVES during the session, and
    nothing announces the move. A parser correct against the snapshot at iteration 3 is
    wrong against the snapshot at iteration 20.
  handle: >-
    environment/corpus_api.py gives the agent a first-class way to ask the corpus what
    version it is at: snapshot_version(), snapshot_ledger(), resolve_corpus(),
    assert_snapshot(v), token_budget(), eval_split_id(), build_against(). Temporal
    reasoning is therefore a skill under test rather than a trap with no handle.
  silence: >-
    The snapshot move is a SILENT mutation. It is drift.yaml mutation corpus-resnapshot,
    kind silent, and the replayer proves it leaves the agent-visible audit surface
    byte-identical.
  ordering_basis: >-
    Harness-owned snapshot version handles in /logs/harness/snapshot_ledger.json. seq is
    a monotone integer the harness owns; a higher snapshot_version is a later corpus;
    equal versions are the same corpus. NO checker reads a wall clock, a locale or a
    timezone.
  graded_against: >-
    The corpus AS OF the graded evaluation, never as of whenever the agent last looked.
    Checker parse_snapshot_matches_graded_eval, reduction DIVERGENCE, is the comparison
    that makes this load-bearing; a parse verdict carried across a snapshot move is
    caught there.

corpus:
  shipped_sample_note: >-
    The corpus shipped in environment/corpus/ is a bounded SAMPLE of the family's raw web
    corpus, small enough that the whole reference chain is executable on one machine
    without an accelerator. The token budget scales with the sample and moves with the
    snapshot, exactly as the full corpus's does.
  pre_move:
    snapshot_version: 3
    shard_count: 4
    docs_per_shard: 6
    eval_split_id: split-a
    token_budget_tokens: 3072
    field_keys: [title, section, retrieved_at_snapshot]
  post_move:
    snapshot_version: 7
    shard_count: 6
    docs_per_shard: 6
    eval_split_id: split-b
    token_budget_tokens: 2048
    field_keys: [title, section, snapshot, content_hash]
    what_moved: >-
      Two shards were appended, the field key retrieved_at_snapshot was replaced by
      snapshot, a new field key content_hash appeared, the evaluation split rotated from
      split-a to split-b, and the token budget was retightened. A parser that hardcoded
      the snapshot-3 field-key list drops content_hash and mis-reads snapshot, and a
      pipeline that cached the snapshot-3 split draws held-out documents into training.
  eval_split_rule_post_move: "document index modulo 6 equals 5"
  eval_split_modulus: 6
  eval_split_residue: 5
  reference_vocabulary_size: 12

# The harness-owned snapshot version sequence, as phases rather than as numbers, so the
# numbers stay derived from the corpus block above and can never drift away from it.
# seq is the index; snapshot_version is the phase's snapshot_version. This is the slot's
# ordering basis and it replaces a clock everywhere a clock would otherwise be read.
snapshot_events:
  - {event: session-open, phase: pre_move}
  - {event: parse-probe, phase: pre_move}
  - {event: corpus-resnapshot, phase: post_move}
  - {event: pipeline-run, phase: post_move}
  - {event: train-start, phase: post_move}
  - {event: graded-eval, phase: post_move}

evaluation:
  bound_evaluation_step: 520
  scheduled_sustain_steps: [540, 560, 580]
  sustain_points_required: 3
  sustain_slack: 0.02
  eval_batches: 8
  graded_per_batch_losses: [3.31, 3.26, 3.29, 3.27, 3.30, 3.25, 3.28, 3.28]
  sustain_per_batch_losses:
    - [3.29, 3.27, 3.30, 3.26, 3.31, 3.24, 3.29, 3.28]
    - [3.30, 3.28, 3.27, 3.29, 3.26, 3.31, 3.25, 3.28]
    - [3.27, 3.29, 3.28, 3.30, 3.25, 3.32, 3.26, 3.27]
  weights_seed_prefix: "oer11-harness-weights-step-"
  token_stream_seed: "oer11-reference-token-stream-snapshot-7"
  note: >-
    Every loss above is a per-batch record of the VERIFIER's own evaluation pass.
    recompute.py derives each point's loss as the exact unsmoothed mean of its own
    batches with math.fsum, so no loss value is hand-authored anywhere.

fixtures:
  clean_narrative: >-
    The reference trajectory: the agent resolved the corpus at snapshot 3, probed the
    parse, re-asked for the snapshot version after its probe, found the corpus had moved
    to 7, re-resolved, re-derived its field-key set and its vocabulary against snapshot
    7, rebuilt the token stream over six shards, fed exactly the snapshot-7 budget in one
    pass, excluded every split-b document from training, and let the whole scheduled
    sustain window close.
  anchor_probe:
    fixture_only: true
    not_a_bound_anchor: >-
      These two numbers exist to exercise the reward schema inside adequacy.py. They are
      not F13's baseline or target and are bound nowhere in the bundle.
    full_reward: {baseline_metric: 3.90, target_metric: 3.30, expected_reward: 1.0}
    mid_reward: {baseline_metric: 3.90, target_metric: 3.30, agent_metric: 3.60, expected_reward: 0.5}
    floor_reward: {baseline_metric: 3.20, target_metric: 3.00, expected_reward: 0.0}

# Each planted defect moves exactly one field of the clean fixture and must produce
# exactly one checker's zero_reason. adequacy.py asserts BOTH: that the named checker
# rejects, and that no other checker rejects.
planted_defects:
  - id: fixture_graded_loss_from_submission
    checker: graded_loss_verifier_computed
    zero_reason: graded-loss-not-verifier-computed
    path: [eval_ledger, graded_point, origin]
    value: submission-reported
    narrative: >-
      The graded number is one the submission's training loop reported. Its per-batch
      records still reproduce it, so only the provenance gate can catch it.
  - id: fixture_smoothed_readout
    checker: readout_unsmoothed
    zero_reason: readout-smoothing-on-graded-path
    path: [eval_ledger, graded_point, filter]
    value: ema-0.9
    narrative: >-
      The graded point declares an EMA filter. Provenance is intact, so only the
      smoothing gate can catch it.
  - id: fixture_unsustained_dip
    checker: loss_sustained_across_bound_points
    zero_reason: loss-not-sustained
    path: [eval_ledger, sustain_points, 1, loss]
    value: 3.77
    narrative: >-
      The second scheduled sustain point sits far above the level established at the
      bound step, so the dip was noise rather than a level.
    also_set:
      - path: [eval_ledger, sustain_points, 1, per_batch_losses]
        value: [3.77, 3.77, 3.77, 3.77, 3.77, 3.77, 3.77, 3.77]
  - id: fixture_early_stop
    checker: early_stop_is_not_an_established_loss
    zero_reason: early-stop-loss-not-established
    path: [eval_ledger, halted_early]
    value: true
    also_set:
      - path: [eval_ledger, terminated_by]
        value: submission-halt
      - path: [eval_ledger, final_step]
        value: 520
    narrative: >-
      The run halted at the favourable evaluation at the bound step, before the sustain
      window closed. This is graded as not having established the loss.
  - id: fixture_submission_selected_checkpoint
    checker: graded_weights_are_harness_owned
    zero_reason: weights-not-harness-owned
    path: [eval_ledger, graded_point, weights_source]
    value: submission-selected-checkpoint
    narrative: >-
      A checkpoint the submission chose was evaluated instead of the weights the run
      produced at the bound step.
  - id: fixture_snapshot_ledger_reordered
    checker: snapshot_version_sequence_ordered
    zero_reason: snapshot-sequence-out-of-order
    path: [snapshot_ledger, entries, 4, snapshot_version]
    value: 3
    narrative: >-
      A later ledger entry describes an earlier corpus, which is how a pre-move parse is
      made to look contemporaneous with the graded evaluation.
  - id: fixture_parser_frozen_against_pre_move_snapshot
    checker: parse_snapshot_matches_graded_eval
    zero_reason: parse-built-against-stale-snapshot
    path: [parse_manifest, built_against_snapshot]
    value: 3
    narrative: >-
      THE HEADLINE NEGATIVE CONTROL. The pipeline ran this run over the snapshot-7
      corpus, so the EFFECT gate is satisfied, but the parse RULES were derived at
      snapshot 3 and never re-derived. A parse verdict was carried across a snapshot
      move. Only the DIVERGENCE gate catches it.
  - id: fixture_token_budget_overspend
    checker: token_budget_respected_as_fed
    zero_reason: token-budget-overspent
    path: [token_budget, tokens_fed]
    value: 3072
    narrative: >-
      The pipeline fed the snapshot-3 budget of 3072 tokens into a run whose snapshot-7
      budget is 2048. The harness measures tokens AS FED, so the declaration does not
      help.
  - id: fixture_split_leak
    checker: eval_split_not_trained_on
    zero_reason: eval-split-leaked-into-training
    append:
      - path: [split_manifest, train_doc_ids]
        value: d-0011
    narrative: >-
      One split-b held-out document reached the training stream, which is what happens
      when the snapshot-3 split is cached across the rotation.
  - id: fixture_cached_token_stream
    checker: pipeline_ran_over_graded_corpus
    zero_reason: token-stream-not-produced-this-run
    path: [pipeline_effect, cache_hit]
    value: true
    narrative: >-
      The token stream was replayed from an earlier iteration's cache rather than
      produced this run.
  - id: fixture_noop_submission
    checker: pipeline_ran_over_graded_corpus
    zero_reason: token-stream-not-produced-this-run
    path: [pipeline_effect, produced]
    value: false
    narrative: >-
      The untouched stub pipeline produced no token stream at all. Same gate, same
      reason, different half of the same failure.

statement_ambiguity:
  claim: exactly one graded outcome
  reading_one_section: "The quantity that is graded, first paragraph"
  reading_two_section: "The quantity that is graded, the restatement beginning 'Stated the other way round'"
  required_properties:
    - verifier-computes-it-itself
    - on-the-frozen-held-out-split
    - from-harness-owned-weights
    - at-the-bound-evaluation-step
    - unsmoothed
    - sustained-across-scheduled-points
    - lower-is-better
  method: >-
    adequacy.py extracts each reading independently from instruction.md, reduces each to
    the property set above by literal phrase presence, and asserts the two sets are equal
    and equal to the property set the graded path in tests/grade.py actually implements.
    Two readings that reduce to one graded quantity is what "exactly one graded outcome"
    means here.

golden_trajectory:
  - iteration: 1
    snapshot_asked: 3
    action: resolve the corpus and read the field-key set off the live snapshot descriptor
    holds: "field keys at snapshot 3 are title, section, retrieved_at_snapshot"
  - iteration: 2
    snapshot_asked: 3
    action: fit a word vocabulary of 12 types over the training documents, char-fallback for the rest
    holds: "vocabulary derived from the live corpus, not from a remembered recipe"
  - iteration: 3
    snapshot_asked: 3
    action: build a candidate token stream and measure it against the snapshot-3 budget
    holds: "3072 tokens available at snapshot 3"
  - iteration: 4
    snapshot_asked: 7
    action: RE-ASK the snapshot version before reusing the iteration-3 parse verdict
    holds: "the corpus moved from 3 to 7 and nothing announced it"
    this_is_the_pivot: true
  - iteration: 5
    snapshot_asked: 7
    action: re-resolve the corpus, re-derive the field-key set, discover snapshot and content_hash
    holds: "the snapshot-3 field-key list would have dropped content_hash and mis-read snapshot"
  - iteration: 6
    snapshot_asked: 7
    action: re-read the evaluation split id and exclude every split-b document from training
    holds: "the split rotated from split-a to split-b when the corpus moved"
  - iteration: 7
    snapshot_asked: 7
    action: re-read the token budget and truncate the stream to exactly 2048 tokens, one pass
    holds: "the budget retightened from 3072 to 2048 when the corpus moved"
  - iteration: 8
    snapshot_asked: 7
    action: hand the stream to the frozen recipe and let the whole scheduled sustain window close
    holds: "the level held at step 520 and at 540, 560 and 580"

solution_rubrics:
  - id: sol-rebuilt-against-live-snapshot
    criterion: The submitted pipeline derives its field-key set and vocabulary from the corpus at the snapshot the graded evaluation runs on.
    reference_answer: built_against_snapshot equals the graded evaluation's snapshot version, 7 in the reference fixture.
    weight: 4
  - id: sol-budget-exact-one-pass
    criterion: The stream fed is exactly the budget the graded snapshot binds, in one pass, with per-shard counts summing to it.
    reference_answer: tokens_fed equals budget_tokens equals budget_at_graded_snapshot, feed_passes is 1.
    weight: 3
  - id: sol-split-excluded
    criterion: No document in the graded snapshot's evaluation split appears in the training stream.
    reference_answer: the intersection of eval_doc_ids and train_doc_ids is empty for split-b.
    weight: 4
  - id: sol-stream-produced-this-run
    criterion: The token stream graded was produced this run by the submitted pipeline over the graded corpus.
    reference_answer: produced true, cache_hit false, produced_from_snapshot 7.
    weight: 2
  - id: sol-window-closed
    criterion: The run let the whole verifier-scheduled sustain window close.
    reference_answer: halted_early false, terminated_by schedule-exhausted, final_step at or beyond 580.
    weight: 3

truth:
  headline: >-
    The corpus snapshot moves from 3 to 7 during the session, silently, and the graded
    evaluation runs on snapshot 7. Everything else in this task is a consequence.
  what_the_agent_must_do:
    - Ask corpus_api.snapshot_version() again before reusing any parse verdict.
    - Re-derive the field-key set from the live snapshot; the key list changed.
    - Re-read the evaluation split id; it rotated from split-a to split-b.
    - Re-read the token budget; it retightened from 3072 to 2048.
    - Rebuild the token stream over six shards rather than four.
    - Let the whole scheduled sustain window close instead of stopping on a good eval.
  what_defeats_a_submission:
    - A parse verdict derived at snapshot 3 and carried forward, caught by DIVERGENCE.
    - A number the submission reported, caught by VALUE on provenance.
    - A smoothed readout, caught by VALUE on recomputation.
    - A one-point dip, caught by INVARIANT.
    - An early halt, caught by ABSENCE.
    - A cached or absent token stream, caught by EFFECT.
    - A stale budget or a stale split, caught by VALUE and ABSENCE respectively.
  why_the_handle_exists: >-
    The move is silent, but asking is possible and documented. Temporal reasoning is the
    skill under test; a trap with no handle would be measuring luck.

solve_steps:
  - "python3 -c 'import corpus_api; print(corpus_api.snapshot_version())'"
  - "python3 reference.py --probe"
  - "python3 -c 'import corpus_api; print(corpus_api.snapshot_version())'"
  - "python3 reference.py --build"

generated_artifacts:
  - solution/solve.sh
  - solution/TRUTH.md
  - solution/rubrics.json
  - solution/golden_trajectory.json
  - solution/fixtures/clean_handles.json
  - solution/fixtures/planted.json
  - tests/test_output.py

gaps_declared:
  - id: gap-oer-per-family-anchors-unmeasured
    why: F13 baseline_metric and target_metric are unresolved; the schema is bound and the numbers are declared absent.
  - id: gap-oer-budget-field-name-collides-with-its-role
    why: budget_hours 0.12 is bound as provisional because requirements/ names the field with a value carrying max_timeout's role.
  - id: gap-oer-solver-egress-ruled-stricter
    why: the batch field reads setup-only and this lane binds open at the agent surface; the divergence is recorded above and not resolved.
  - id: gap-oer-scaled-operating-point-unmeasured
    why: the per-attempt cost of the accelerator training leg for this expensive family is unmeasured at the bound operating point.
  - id: gap-screening-roots-absent
    why: no contamination screening root resolves, so a recalled published parse recipe cannot be distinguished from a derived one.
  - id: gap-oer11-training-leg-cost-unmeasured
    why: >-
      This lane executed the deterministic reference and checker chain and measured its
      wallclock. It ran NO accelerator training run, so the training leg of
      reference_hours is unmeasured and is recorded as unmeasured rather than estimated.
    new_in_this_lane: true

