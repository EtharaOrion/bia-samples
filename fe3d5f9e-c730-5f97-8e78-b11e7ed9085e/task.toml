# Harbor delivery manifest for slot OER-01, staged under its provisional
# identifier. No canonical_content_hash, no uuid5 and no signature appears in this
# bundle; wave 2 does identity for every slot at once.
#
# schema_version MUST sit above the first table header. TOML scopes every key to
# the most recent header, so an assignment written after [task] silently becomes
# task.schema_version and leaves the top-level scalar absent while the file still
# reads correct to a human.
schema_version = "1.4"

# Snapshotted out of the environment before teardown. A graded deliverable absent
# from this list would have to be reconstructed after the fact. The first two
# entries are the batch's required graded deliverables and appear in every slot;
# the rest are this slot's own snapshots.
artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/workspace/submission/recipe.py",
  "/logs/verifier/telemetry.json",
  "/logs/verifier/score.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
]

[task]
name = "bia/optimizer-recipe-displacement"
version = "1.0.0"
description = "Reach the target validation loss in fewer optimizer steps than the bound baseline without replaying a recipe already in the published record corpus."
authors = ["Bia"]
keywords = ["optimization", "language-model", "optimizer", "record-displacement"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
family = "F1"
slot = "OER-01"
provisional_identifier = "OER-01"
primary_archetype = "record-displacement"

# Difficulty is measured by an external signed pilot over frozen task bytes
# against a frozen solver registry. It is never asserted by an authoring lane, so
# this field is empty by construction rather than left to be filled in later.
difficulty = ""
target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_reason = "This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

metric = "optimizer steps to reach the target validation loss"
metric_direction = "lower is better"

reward_kind = "float"
reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
reward_range = [0.0, 1.0]
reward_full = 1.0
reward_formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
reward_path = "/logs/verifier/reward.txt"
reward_document_path = "/logs/verifier/reward.json"

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are DISTINCT fields with DISTINCT roles and
# neither is ever an alias of the other:
#   max_timeout_hours -> refinement-loop terminator ACROSS attempts, six hours.
#   budget_hours      -> per-attempt completion bound, six hours over fifty
#                        attempts, which is 0.12 hours or 7.2 minutes.
# Writing the 6 into budget_hours would encode a 300-hour session that every
# well-formedness check passes as valid, because both are positive floats and no
# check compares them.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1
budgeted = true
role_note = "budget_hours bounds one graded attempt; max_timeout_hours bounds one fifty-attempt session."

[agent]
# The solving agent gets OPEN egress inside the sandbox so it can fetch its own
# packages, datasets and models. The verifier does not. That asymmetry is bound
# here as bytes rather than left to an accident.
#
# The deny-list below is a cost and hygiene measure. It is NOT the
# record-displacement control and is never presented as one: mirrors, caches,
# paraphrases and model weights all carry a recipe past any deny-list. The
# load-bearing control is the deterministic fingerprint screen in
# tests/fingerprint.py, which runs before any seed executes.
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
network_mode = "none"
timeout_sec = 21600.0

[verifier]
egress = "denied"
network_mode = "none"
timeout_sec = 10800.0

[environment]
build_timeout_sec = 1800.0
# Pinned by digest, never by a floating tag. Harbor accepts any string and does
# not itself require a digest, so the digest requirement is this contract's and
# this bundle enforces it.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"
