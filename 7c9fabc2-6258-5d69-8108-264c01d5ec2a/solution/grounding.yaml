  - baseline_metric = "null"
  - target_metric = "null"
  - pass_threshold = "null"
  - gap = "gap-oer-per-family-anchors-unmeasured"
  - reason = "seed/contract.yaml families.entries.F9 carries scope_state unscoped with baseline, target
