schema: forge.grounding/v1
slot: OER-21
provisional_identifier: OER-21
family: F9
family_title: quantization
primary_archetype: AR5
archetype_title: Adversarial Option Expansion
archetype_exclusivity: >-
  Exactly one primary archetype, fixed at scope time. AR5 is the only archetype this slot
  claims. No second archetype is carried, projected or implied anywhere in this bundle.
title: Quantization scheme search breadth at a fixed bit budget

visibility: >-
  PRIVATE. This file is the single derivation source for every generated artifact in this
  bundle. It is never assembled onto the agent surface: solution/ is absent from
  launcher.AGENT_ROOTS by construction, so no filter has to hold for it to stay private.

rebase:
  pass: OER-2026-08-20
  what_moved: >-
    The model and the evaluation path were REPLACED, not repinned. The predecessor bundle
    graded a formula-generated weight table of twelve tensors of forty-eight weights over a
    vocabulary of eight, whose value at a position was
    (context * stride_context + word + tensor * stride_tensor) modulo tensor_size, read by
    an arithmetic row builder that no language model produced. There is no declaration edit
    that turns that into a nanoGPT run, so the substrate, the forward pass, the evaluation
    corpus, the reference readings, the toolkit, the schema, the checkers that read them and
    every generated artifact downstream of them were rewritten.
  what_survived: >-
    The statement, the archetype and the reward schema. A solver still designs a per-shard
    bit allocation and quantization scheme under a fixed total bit budget, and is still
    graded on the worst per-shard relative perplexity degradation against the unquantized
    reference, lower better, on a bounded continuous reward with every zero carrying a
    machine-readable reason.
  substrate_replication: >-
    environment/nanogpt_substrate.json is a byte-for-byte replication of the canonical
    operating point. Replication rather than reference, because a bundle's name is a hash
    over its own tree and no slot may depend on a sibling's bytes.

# ---------------------------------------------------------------------------
# What is graded, stated once, so instruction.md and TRUTH.md cannot drift apart
# ---------------------------------------------------------------------------
graded_quantity:
  statement: >-
    The worst per-slice RELATIVE perplexity degradation of the quantized nanoGPT checkpoint
    against the unquantized reference, in percent of that slice's unquantized reference
    perplexity, measured by the verifier running real forward passes of the frozen
    twelve-layer decoder over held-out FineWeb slices the solver cannot see, at a fixed
    total bit budget.
  direction: lower
  units: percent of the unquantized reference perplexity
  units_rationale: >-
    Relative rather than absolute, because the held-out slices do not share a reference
    perplexity. An absolute difference would let the slice with the largest reference
    perplexity dominate the worst-slice maximum for a reason that has nothing to do with
    the quantization scheme.
  definition: >-
    For one held-out slice the verifier runs two real forward passes of the canonical
    decoder, one at full precision and one over the parameters as the harness quantized
    them. The reference reading is the exponentiated mean entropy of the full-precision
    next-token distribution on that slice and the quantized reading is the exponentiated
    mean cross entropy of that distribution under the quantized one. Gibbs' inequality
    makes the second at least the first, with equality only when the two distributions
    coincide, so no scheme can buy a better-than-reference reading out of quantization
    noise. The true-token perplexity of both parameter states is carried alongside as
    telemetry so a reader can see the checkpoint is a language model on real text.
  computed_by: tests/evaluate.py, inside the verifier process
  computed_from: >-
    the verifier's own copy of the frozen checkpoint, quantized by the harness, evaluated on
    the verifier's own held-out FineWeb slices
  never_from:
    - a number the submission printed on stdout
    - a field the submission wrote into its scheme artifact
    - a filtered, smoothed or averaged reading of any kind
    - anything reachable from the agent container
  worst_case_rationale: >-
    The graded reading is the maximum degradation across the scheduled slices rather than
    the mean, so a favourable slice cannot be harvested by averaging it against the rest.

frozen:
  - the checkpoint parameters, the verifier's own copy of the frozen nanoGPT snapshot
  - the architecture, environment/nanogpt_substrate.json
  - the total bit budget, checkpoint.bit_budget_total
  - the held-out evaluation split, verifier-owned and absent from the agent container
  - the unquantized reference readings, recomputed by the verifier on that split
free:
  - >-
    the quantization scheme, meaning per-shard and per-group bit widths, the number of
    scale groups inside a shard, the codebook family, and the clip percentile

# ---------------------------------------------------------------------------
# AR5: the handed option set is the trap, and the gap is MEASURED not asserted
# ---------------------------------------------------------------------------
adversarial_option_expansion:
  handed_option_set:
    carrier: environment/quantize.py
    shape: >-
      one uniform bit width applied to every parameter shard, exactly one scale group per
      shard, a symmetric or affine codebook, and one clip percentile knob.
    completeness: >-
      The handed toolkit is complete and correct within its own space. It runs, it loads
      the real checkpoint, it accounts its bits, it measures on the calibration split, and
      it reaches the budget exactly at its shipped setting. Nothing about it is broken,
      which is why its optimum reads as the task optimum.
  wider_construction:
    shape: >-
      per-shard bit widths, per-GROUP bit widths inside a shard, group counts above one,
      and a kmeans codebook whose centroid table is paid for out of the same budget.
    derivable_from_the_objective: >-
      The objective states that the budget is a TOTAL over the checkpoint and that
      degradation is measured over the whole held-out split. Nothing in the objective
      requires one width for every shard. The instruction states the accounting rule in
      full, states that per-shard and per-group allocation are admitted, and states that
      the graded bar is the handed toolkit's own optimum. The widening is therefore an
      inference from the stated objective, not a hidden affordance behind a puzzle.
    not_a_puzzle: >-
      No search is needed to LEARN that the space is wider. The scheme schema is published
      at environment/scheme_schema.json and the instruction names every free axis. What
      the agent has to do is measure, allocate and iterate, which is optimization work.
    why_it_pays_on_this_substrate: >-
      The embedding matrix and the untied output projection are 77266944 of the 162201600
      quantizable parameters, and they carry a different sensitivity to width than the
      attention and MLP matrices do. A uniform width spends the same bits per parameter on
      both. That asymmetry is a property of the frozen architecture rather than of a hint,
      and it is the whole of the AR5 pressure.
  pressure_is_measured:
    default_optimum_source: >-
      exhaustive search over the handed option space, run by the verifier at grading time
      in tests/evaluate.py default_optimum, never read from a stored constant
    wider_probe_source: >-
      a fixed, ordered, budget-checked list of role-keyed allocations declared in
      tests/anchors.json and evaluated by the verifier at grading time in
      tests/evaluate.py wider_probe_optimum. It is a BAR and not a claim about the true
      optimum of the wider space, and it is named a probe everywhere it appears so no
      reader can take it for a measured optimum.

# ---------------------------------------------------------------------------
# Substrate parameters. Every generated byte of environment/ comes from these.
# ---------------------------------------------------------------------------
substrate:
  kind: nanogpt-checkpoint
  declaration: environment/nanogpt_substrate.json
  declaration_version: nanogpt-substrate-v1
  upstream: modded-nanogpt, records/track_3_optimization/
  architecture_source: >-
    Read from environment/nanogpt_substrate.json at build time and at grading time. No
    architecture constant is written into any other file in this bundle.
  module: environment/model/nanogpt.py
  module_source: >-
    Transcribed from the vendored record set at
    harness/records/track_3_optimization/train_gpt_simple.py: RMSNorm on the gains
    parameter, half-truncated RoPE at base 1024, causal attention at scale 0.12 with
    per-head RMS normalisation of the query and key, a squared-relu MLP at four times the
    model dimension, pre-norm residual blocks, an untied output projection and the logit
    softcap at 15.
  shard_definition: >-
    A shard is one two-dimensional weight matrix of the frozen decoder. Biases and RMSNorm
    gains are not shards: they are the residue, they are carried at the checkpoint's own
    width, and they sit outside the bit budget.
  scale_bits: 16
  default_bits: 4
  budget_derivation: >-
    162201600 quantizable parameters at 4 bits is 648806400 payload bits, plus one 16-bit
    scale per shard over 74 shards is 1184 overhead bits, total 648807584. The handed
    default configuration therefore lands exactly on the budget, which is what makes it
    look final. Every value in this derivation is a function of the architecture and none
    of them is written down anywhere a reader would have to trust.
  checkpoint:
    role: the graded artifact, a real parameter snapshot of the frozen decoder
    provisioning: >-
      Staged into the agent container at build time and mounted into the verifier
      separately from the verifier's own copy. The agent container carries the parameters
      it is allocating bits over; it does not carry the split those parameters are graded
      on.
    sha256_state: absent
    sha256: null
    gap: gap-oer21-checkpoint-digest-unmeasured
  holdout:
    corpus: FineWeb10B, GPT-2 BPE token ids, uint16 little-endian
    external_source: https://huggingface.co/datasets/HuggingFaceFW/fineweb
    pipeline: https://github.com/KellerJordan/modded-nanogpt data/cached_fineweb10B.py
    shard: fineweb_val_000000.bin
    sequence_length: 1024
    slice_count: 5
    slice_tokens: 32768
    slice_offsets: [0, 1048576, 2097152, 3145728, 4194304]
    absent_from_environment: >-
      The held-out split is mounted only into the verifier and is named only in tests/. It
      is not copied by environment/Dockerfile, it is not reachable from the agent
      container, and tests/runner.py launches the submission under a four-name environment
      allowlist that cannot name the verifier mount.
    disjointness: >-
      Five disjoint 32768-token windows of the same held-out shard at offsets a megatoken
      apart. Different windows are different documents, so a scheme that protects the
      parameter ranges one window exercises and starves another is excellent on one slice
      and poor on the next. That is what makes the sustained-reading invariant bite on a
      real submission rather than only on a planted fixture.
  calibration:
    role: >-
      the agent-visible split, so a solver can measure locally. It is NOT the graded split
      and no reading taken on it reaches the grade.
    shard: fineweb_train_000001.bin
    token_offset: 0
    token_count: 32768
    sequence_length: 1024
    staged_by: environment/Dockerfile, from the pinned upstream loader at provisioning time

search:
  reference_strategy: >-
    Per-shard sensitivity measured on the calibration split by widening one shard role at a
    time from the uniform default, then a fixed greedy coordinate pass that spends the
    freed budget on the roles whose readings moved most. Fixed candidate order, fixed pass
    count, no random restarts, so the result is a function of the frozen bytes and the
    calibration split alone. It is computed at solve time by solution/reference.py rather
    than frozen as a table, because a frozen table would be a number this lane did not
    measure.
  passes: 2
  round_digits: 9

# ---------------------------------------------------------------------------
# Reward schema, bound in full. Family anchors are ABSENT and stay absent.
# ---------------------------------------------------------------------------
reward:
  carrier: /logs/verifier/reward.txt
  carrier_shape: one bare float
  score_document: /logs/verifier/score.json
  interval: [0.0, 1.0]
  direction: higher-is-better
  binary: false
  full_reward: 1.0
  formula: "raw = (baseline - agent) / (baseline - target); score = min(max(raw, 0.0), 1.0)"
  formula_family: lower-is-better
  target_is_a_bar: >-
    Reaching the target scores exactly 1.0 and beating it also scores 1.0. The target is a
    bar, not a point on a gradient.
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  anchors_absent_reason: >-
    seed/contract.yaml families.entries.F9 carries scope_state unscoped and records
    baseline_metric, target_metric and pass_threshold as null, on the authority of
    requirements/bia-environment-spec.md line 63 leaving this family's anchors unresolved.
    No number is invented here to fill them.
  local_scaling_endpoints:
    what_they_are: >-
      Two quantities MEASURED by the verifier at grading time and used as the endpoints of
      the bounded scaling so the reward is continuous rather than binary while the family
      anchors are absent. They are not the family anchors, they are not published evidence,
      and they are not a substitute for either.
    baseline_endpoint: >-
      the measured optimum of the handed option set, recomputed by the verifier's own
      exhaustive sweep at grading time
    target_endpoint: >-
      the measured optimum of the verifier's fixed widening probe, recomputed at grading
      time. No stored endpoint survives the re-base, because every number the predecessor
      stored was measured on the formula-generated table and none of them means anything
      on this substrate.
    replacement_rule: >-
      When gap-oer-per-family-anchors-unmeasured closes and F9 carries measured anchors,
      baseline_metric and target_metric take these two positions and the schema above does
      not change. Nothing else in the bundle moves.
  separation_margin: 0.05
  separation_margin_use: >-
    A submission whose scaled improvement over the handed optimum is below the separation
    margin is graded as sitting inside the handed option set's own band, scores zero, and
    carries the reason default-scheme-plateau.
  frontier_defeat_floor: 0.5
  sustain_tolerance_rule: >-
    one and a half times the widest slice-to-slice spread the verifier itself observed
    across the handed option-set sweep, plus one hundredth of a point. Measured at grading
    time from the sweep the verifier ran, never a stored constant.

# ---------------------------------------------------------------------------
# MEASURED block. Nothing is measured on this substrate yet and nothing is invented.
# ---------------------------------------------------------------------------
measured:
  state: unmeasured
  gap: gap-oer21-endpoints-unmeasured-on-the-nanogpt-substrate
  reason: >-
    Every constant the predecessor carried under this key was measured on the
    formula-generated table this pass deleted, so none of them describes this substrate.
    Re-measuring them needs the frozen checkpoint and one accelerator, which is a
    measurement pass and not an authoring pass. They are published as unmeasured rather
    than carried across, and the two scaling endpoints the reward needs are recomputed by
    the verifier at grading time so the slot grades without them.
  default_shipped_metric: null
  default_optimum: null
  wider_probe_optimum: null
  gap_default_minus_probe: null
  reference_scheme_allocated_bits: null
  sustain_tolerance: null

