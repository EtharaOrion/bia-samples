# Bound grants, transcribed from seed/contract.yaml batch.optimization_bindings
# ---------------------------------------------------------------------------
bindings:
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts
  budget_hours: 0.12
  budget_hours_role: per-attempt completion bound, 7.2 minutes
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  max_attempts: 50
  final_selection: best
  budget_envelope: one H100, single accelerator, no multi-GPU scaling
  budget_margin: 10 percent
  compute_envelope_accelerators: 1
  tags: [optimization, bounded-continuous]
  image: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: capped below Hard
  perception_exemption: >-
    This task family is text and code only, so the Perception axis carries no category.
    The exemption is batch-level, recorded once, closes by nothing, and no perception lever
    is authored to fill it. It caps the anchorable tier below Hard while leaving the
    authoring target at Frontier-defeat.

solver_egress_divergence:
  bound_here: open
  contract_field: setup-only
  contract_path: seed/contract.yaml batch.optimization_bindings.solver_egress
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving
    agent full internet access.
  reading_b: >-
    the same document at line 122 says internet access is needed only for setup, and
    requirements/bia-environment-spec.md line 247 takes the stricter reading, which is what
    the contract field records as setup-only.
  resolution_here: >-
    task.toml binds solver_egress open at the agent surface and egress denied at the
    verifier surface, because the solving agent must be able to fetch its own packages.
    The batch-level contract field is NOT amended by this lane. The divergence is recorded
    rather than silently reconciled.
  deny_list_is_not_containment: >-
    The deny list names three hosts. Mirrors, caches, paraphrased write-ups and released
    model weights all carry a recipe past any deny list, so the deny list is not a
    containment proof and is not treated as one. The deterministic checker chain is the
    load-bearing control: the graded quantity is recomputed by the verifier from its own
    parameters on a split the solver never sees, so a submission that arrives with a
    perfect remembered recipe still has to pay for its bits and still has to sustain its
    reading on slices it could not have measured.

gaps_declared:
  - id: gap-oer-per-family-anchors-unmeasured
    scope: batch
    statement: F9 carries no measured baseline or target, so this slot binds the reward schema and declares the anchors absent.
  - id: gap-oer-budget-field-name-collides-with-its-role
    scope: batch
    statement: budget_hours 0.12 is bound provisionally because the upstream field name carries a value that belongs to the session-level role.
  - id: gap-oer-solver-egress-ruled-stricter
    scope: batch
    statement: the contract field reads setup-only and this slot binds open at the agent surface; the divergence is recorded and the field is not amended.
  - id: gap-oer21-checkpoint-digest-unmeasured
    scope: slot
    statement: >-
      The frozen checkpoint is pinned by architecture and by provisioning path but not yet
      by digest, because this lane did not build the snapshot and will not write a sha256
      it has not taken. tests/anchors.json records the pin as absent, and
      frozen_checkpoint_and_holdout_unmodified still requires the verifier to digest the
      parameters it actually graded, so an absent pin never becomes an absent observation.
      The gap closes when the provisioning pass hands back the built snapshot and its
      digest is written into the pin.
  - id: gap-oer21-endpoints-unmeasured-on-the-nanogpt-substrate
    scope: slot
    statement: >-
      No endpoint in this slot has been measured on the replaced substrate. The reward does
      not depend on one, because both scaling endpoints are recomputed by the verifier at
      grading time, but the private measured block carries nulls rather than the numbers
      the predecessor measured on the formula-generated table. What this leaves unproven is
      named rather than glossed: that the verifier's widening probe reads strictly below the
      handed option set's optimum on the frozen checkpoint, which is the AR5 separation this
      slot exists to create. The machinery was exercised end to end on an untrained smoke
      snapshot, where the separation is zero because an untrained decoder has no per-role
      structure for an allocation to exploit, and the run correctly reported
      scaling-span-nonpositive rather than inventing a gap. The gap closes when the frozen
      checkpoint is provisioned and solution/recompute.py --measure records a positive span.
  - id: gap-oer21-ordering-checker-substituted
    scope: slot
    statement: >-
      evaluation_follows_state_seal cannot be fired by any submission, because the phase log
      is written by the verifier's own process and the submission runs as a separate process
      group that never touches it. Its rejecting half is carried on a planted telemetry
      fixture. The substitution is recorded in tests/checkers.yaml, in feasibility.yaml and
      in seed/tasks/OER-21/shortcut_probes.yaml.

retired_gaps:
  - id: gap-oer21-surrogate-substrate
    retired_by: this re-base
    statement: >-
      The gap recorded that the graded forward pass was a deterministic surrogate over
      twelve tensors of forty-eight weights and a vocabulary of eight rather than a live
      transformer forward pass. It is retired because the surrogate was deleted rather than
      annotated: the graded forward pass is now the canonical twelve-layer decoder run over
      held-out FineWeb tokens on the pinned image.

