schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    required_pass describes the gate, which is what tests/grade.py actually does with the checker
    set: every checker below is required, and the first required checker that fails resolves the
    run to 0.0 carrying that checker's zero_reason. required_pass never manufactures the reward.
    The reward a passing gate carries is the continuous metric term the gate did not compute,
    raw = (baseline - agent) / (baseline - floor) clipped into [0, 1], so the score is bounded
    continuous rather than binary. A gate that passes with no measured end-to-end improvement is
    impossible by construction, because end_to_end_gain_not_stage_local is itself required and
    demands a strict improvement, so a passing gate always carries a strictly positive reward.

anchors:
  anchors_state: absent
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  reason: >-
    F13 carries no published baseline or target. seed/contract.yaml records the family as unscoped
    and requirements/bia-environment-spec.md line 63 leaves its anchors unresolved. The reward
    schema is bound in full and no number is invented. The two slots of the bound lower-is-better
    formula are filled in-run by verifier measurement of two harness-owned compositions: the
    pristine delivered composition supplies the baseline slot and the reference composition
    supplies the target slot. When the family anchors are measured, the published pair replaces the
    in-run pair and this block closes.
  formula: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
  clip: "score = min(max(raw, 0.0), 1.0)"
  direction: lower

graded_quantity:
  what: validation loss of the trained model on the frozen held-out split
  unit: negative log likelihood in nats divided by the byte length of the split
  computed_by: tests/checkers.py::recomputed_loss, inside the verifier process
  weights: the model the harness-owned frozen train stage wrote at the bound evaluation point
  never: >-
    never a number the submission reported, printed or wrote; no smoothing, averaging or EMA is
    applied anywhere on the graded path

checkers:
  - id: frozen_axes_unmodified
    statement: "Every frozen artifact in the submission tree is byte-identical to the delivered one, so the token budget stage, the model, the optimizer and the evaluation split were not moved."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_frozen_axes_unmodified
    zero_reason: frozen-axis-modified
    required: true
    weight: 1
    live_state_read: "telemetry.frozen_digests_delivered and telemetry.frozen_digests_observed, both produced by tests/harness.py digesting the pristine bundle environment tree and the staged submission tree in the verifier's own process"
    compiled_test: "tests/test_output.py::test_frozen_axes_unmodified"

  - id: stage_chain_order_observed
    statement: "The harness observed the phases open, parse, tokenize and train in that order, and every artifact a phase consumed was produced by an earlier phase with the same digest."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_stage_chain_order_observed
    zero_reason: stage-chain-order-violated
    required: true
    weight: 1
    live_state_read: "telemetry.phase_log, the ordered event log tests/harness.py writes as it executes the composition plan stage by stage, digesting each stage's declared inputs before the launch and its declared outputs after it"
    compiled_test: "tests/test_output.py::test_stage_chain_order_observed"

  - id: stage_claim_matches_next_stage_consumption
    statement: "What each stage claims in its own report matches what the next stage actually consumed, under the field set the bound stage output contract compares."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_stage_claim_matches_next_stage_consumption
    zero_reason: stage-claim-contradicted-by-chain
    required: true
    weight: 1
    live_state_read: "telemetry.stage_claims, read back from the submission's own stage reports, against telemetry.stage_observed and telemetry.stage_inputs_digested, both measured independently by tests/harness.py at the moment before the next stage launched, and bound.stage_output_contract"
    compiled_test: "tests/test_output.py::test_stage_claim_matches_next_stage_consumption"

  - id: token_budget_respected_as_fed
    statement: "Exactly the bound token budget was fed to the optimizer and exactly that many tokens were consumed, with no override from the composition plan and no short stream."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_token_budget_respected_as_fed
    zero_reason: token-budget-not-respected-as-fed
    required: true
    weight: 1
    live_state_read: "bound.token_budget_tokens resolved from the admin plane at run start, telemetry.train written by the harness-owned frozen train stage, and the verifier-owned consumed_tokens.json the harness wrote from the prefix it actually fed"
    compiled_test: "tests/test_output.py::test_token_budget_respected_as_fed"

  - id: eval_split_not_trained_on
    statement: "No shingle of the frozen held-out split appears in the training stream the optimizer consumed, decoded back through the submitted vocabulary."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_eval_split_not_trained_on
    zero_reason: evaluation-split-leaked-into-training
    required: true
    weight: 1
    live_state_read: "the verifier-owned consumed_tokens.json, the vocabulary the harness recorded the train stage consuming, and the frozen split at environment/eval/held_out.txt read through the harness handle"
    compiled_test: "tests/test_output.py::test_eval_split_not_trained_on"

  - id: full_chain_completed_no_early_stop
    statement: "The chain ran every stage and reached the bound evaluation point; a run that halted at an intermediate checkpoint established no loss."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_full_chain_completed_no_early_stop
    zero_reason: early-stop-loss-not-established
    required: true
    weight: 1
    live_state_read: "telemetry.train.halted_at_tokens and telemetry.train.bound_point_reached, both written by the harness-owned frozen train stage, and telemetry.composition.order as the harness executed it"
    compiled_test: "tests/test_output.py::test_full_chain_completed_no_early_stop"

  - id: evaluation_point_is_bound_not_selected
    statement: "The weights evaluated are the ones at the bound evaluation point, not a checkpoint the submission selected."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_evaluation_point_is_bound_not_selected
    zero_reason: evaluation-point-submission-selected
    required: true
    weight: 1
    live_state_read: "bound.graded_evaluation_point, telemetry.train.bound_checkpoint_id, telemetry.graded_model.checkpoint and telemetry.composition.select_checkpoint"
    compiled_test: "tests/test_output.py::test_evaluation_point_is_bound_not_selected"

  - id: graded_loss_from_harness_weights
    statement: "The graded validation loss is recomputed inside the verifier from the weight file the harness itself wrote at the bound evaluation point, and that file still digests to what the harness recorded."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_loss_from_harness_weights
    zero_reason: graded-loss-not-from-harness-weights
    required: true
    weight: 1
    live_state_read: "telemetry.graded_model with its writer, path and sha256, digested again by the checker through the harness handle, and the frozen split the checker segments and scores itself"
    compiled_test: "tests/test_output.py::test_graded_loss_from_harness_weights"
    adequacy_substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        No submission can move this checker, because the weights are written by the harness-owned
        frozen train stage into a verifier-owned directory the submission never sees. The isolation
        boundary holds, so the rejecting half is carried on a planted fixture that substitutes a
        weight file whose digest no longer matches the harness record, and the substitution is
        recorded here and in seed/tasks/OER-13/feasibility.yaml rather than papered over.

  - id: no_smoothing_on_graded_path
    statement: "Every validation loss the submission reported agrees with the verifier's raw recomputation within the bound tolerance, and the bound readout policy is raw-only."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_no_smoothing_on_graded_path
    zero_reason: readout-smoothing-on-graded-path
    required: true
    weight: 1
    live_state_read: "telemetry.submission_reported.loss_claims collected by the harness from the composition plan and the stage reports, against the raw recomputation the checker performs, and bound.readout_smoothing_policy and bound.reported_loss_tolerance"
    compiled_test: "tests/test_output.py::test_no_smoothing_on_graded_path"

  - id: floor_anchor_matches_bound_reference
    statement: "The reference composition the harness measures in-run reproduces the bound reference loss, so the span the reward is divided by rests on an anchor the live environment established rather than on a number nobody checked."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_floor_anchor_matches_bound_reference
    zero_reason: floor-anchor-not-the-bound-reference
    required: true
    weight: 1
    live_state_read: "telemetry.floor.loss_per_byte, which tests/harness.py measures in-run by executing the reference composition stage by stage through the identical frozen protocol and scoring the harness-written weights with checkers.fold_loss, against bound.reference_loss_per_byte, bound.reference_loss_tolerance and bound.reference_anchor_budget_tokens resolved from the admin plane"
    compiled_test: "tests/test_output.py::test_floor_anchor_matches_bound_reference"
    discovery_value: >-
      reference_loss_per_byte. It is carried on no agent-visible byte and is not
      derivable from one: instruction.md, task.toml and everything under
      environment/ name the quantity and never its value. It exists only once the
      chain has been run in the live environment. This checker is where it carries
      graded weight.
    adequacy_substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        The floor anchor is measured over a reference composition materialized from
        solution/reference.py into a verifier-owned workspace, so no submission has
        a handle on it and no submission can move it. The rejecting half is carried
        on the planted fixture in tests/test_output.py, which drives this selector
        over a reference loss the environment does not establish and requires the
        bound zero reason; the accepting half is carried on the same fixture pair
        at the established value and on the live reference run.

  - id: loss_sustained_across_bound_evals
    statement: "The improvement over the in-run measured baseline holds at the bound evaluation point and at every one of the folds the verifier's own schedule selects, so a single favourable evaluation cannot be harvested."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_loss_sustained_across_bound_evals
    zero_reason: improvement-not-sustained
    required: true
    weight: 1
    live_state_read: "bound.eval_fold_schedule and bound.sustain_points resolved from the admin plane, the frozen fold partition at environment/eval/folds.json, the per-fold losses the checker recomputes, and telemetry.baseline.fold_losses measured in-run by the harness"
    compiled_test: "tests/test_output.py::test_loss_sustained_across_bound_evals"
    adequacy_substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        A submission that beats the baseline overall while losing a specific scheduled fold is not
        reachable by editing the two stages within the bound budget, so the rejecting half is
        carried on a planted fixture whose per-fold pair fails at one scheduled point, and the
        substitution is recorded here and in seed/tasks/OER-13/feasibility.yaml.

  - id: session_state_carried_forward
    statement: "The attempt ledger is written by the harness, indexes attempts monotonically from one, and carries every field the bound ledger contract requires at the attempt in force."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_session_state_carried_forward
    zero_reason: session-state-broken
    required: true
    weight: 1
    live_state_read: "the session ledger tests/harness.py writes onto the checker handle, and bound.session_ledger_contract resolved from the admin plane"
    compiled_test: "tests/test_output.py::test_session_state_carried_forward"
    adequacy_substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        The ledger is harness-written and the submission has no handle on it, so no submission can
        fire this checker. The rejecting half is carried on a planted fixture whose newest attempt
        was recorded under the pre-mutation ledger contract, which is exactly the stale control for
        the session-ledger-v2 silent mutation, and the substitution is recorded here and in
        seed/tasks/OER-13/feasibility.yaml.

  - id: end_to_end_gain_not_stage_local
    statement: "The composition improves on the in-run measured baseline composition at the end of the chain; a stage-local optimum that raises one stage's own readout while degrading the composition scores zero."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_end_to_end_gain_not_stage_local
    zero_reason: stage-local-optimum-degrades-composition
    required: true
    weight: 1
    live_state_read: "the loss the checker recomputes from the harness-written weights, against telemetry.baseline.loss_per_byte and telemetry.floor.loss_per_byte, both measured in-run by tests/harness.py through the identical frozen protocol"
    compiled_test: "tests/test_output.py::test_end_to_end_gain_not_stage_local"

purity:
  import_allowlist: [json, math, hashlib, pathlib, dataclasses, typing]
  forbidden: >-
    no planted file read, no environment-secret read, no random source, no clock read, no network,
    no import of the submission, no importlib, no eval, no exec
  enforced_by: seed/tasks/OER-13/adequacy.py, which walks the AST of tests/checkers.py
  submission_isolation: >-
    tests/runner.py copies the submission alone into a fresh directory, launches each stage as a
    new session leader under a small environment allowlist, captures its output and kills the whole
    process group in a finally block. tests/grade.py imports the checkers and the reference and
    never imports the submission.
