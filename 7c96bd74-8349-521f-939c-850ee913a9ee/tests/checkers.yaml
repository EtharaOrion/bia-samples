schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

# MEASURED CORRECTION, wave-1: the live seed/forge/verifier.py binds the reward carrier
# to reward.txt carrying a bare float. The machine-readable reason and the metric block
# ride in the companion score document. Both are written from one trap in tests/test.sh,
# so the instrument's binding and the reason carrier can never disagree.
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

substrate:
  declaration: tests/nanogpt_substrate.json
  agent_visible_replica: environment/nanogpt_substrate.json
  authority: >-
    requirements/bia-environment-spec.md, under "The nanoGPT framework is mandatory", binds
    this family's metric to a nanoGPT run. The values below are read from
    tests/nanogpt_substrate.json, which is a byte-for-byte replica of the canonical
    operating point, itself read from harness/records/track_3_optimization/train_gpt_simple.py
    and its README. The verifier reads its own copy and never the agent-visible one, so
    editing the replica moves the declaration the solver sees and nothing about the grade.
  metric_shape: >-
    The graded scalar is exp(-val_loss), where val_loss is the mean per-token cross entropy
    the harness-owned parameter snapshot assigns to the held-out FineWeb validation
    documents in tests/heldout/benchmark.jsonl. It is the geometric-mean per-token
    probability of held-out text, it lies on (0.0, 1.0], and higher is better, which is the
    direction task.toml binds. It is a strictly decreasing function of the validation loss
    the record set targets at 3.28, so no scale is invented to obtain the direction.

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py runs every checker below in declared order and treats them as a gate
    chain: a single failing required checker ends the run at reward 0.0 carrying that
    checker's zero_reason, and no partial credit is assembled from the ones that passed.
    That is exactly what required_pass reduces to, and it is why the mode is named here
    rather than weighted_mean, which would let a contaminated corpus buy back credit from
    a respected budget. The gates are pass or fail; the reward the gates hand on is the
    continuous anchored score, so the reward itself is never binary.

# The reward the passed gate chain hands on. HIGHER is better.
reward:
  formula: raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  interval: [0.0, 1.0]
  direction: higher
  binary: false
  full_reward_at: reaching target_metric scores exactly 1.0; beating it also scores 1.0
  agent_metric: the held-out FineWeb benchmark score the verifier measured at the graded evaluation point

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  authority: seed/contract.yaml families.entries.F14 carries scope null and scope_state unscoped, and its unscoped_reason forbids authoring against an unmeasured baseline.
  consequence: >-
    With both anchors absent the anchored score has no denominator, so a live graded run
    that clears every gate resolves to 0.0 carrying the machine-readable reason
    anchors-unmeasured rather than to an invented number. The schema above is fully bound,
    so measuring the pair is the only step between this bundle and a live gradient.
  substrate_anchors_are_not_family_anchors: >-
    tests/nanogpt_substrate.json carries the upstream record anchors, record 36 at 3250
    steps and 3.2787 val loss and record 46 at 2690 steps and 3.2783. Those are the
    optimizer track's step-count anchors over the unmixed corpus and they are not this
    family's baseline_metric and target_metric, which are a held-out benchmark score under
    a mixed corpus and remain unmeasured. Reading one as the other is the error this note
    exists to prevent.
  fixture_anchor_substitution: >-
    seed/tasks/OER-17/adequacy.py drives the reward function with fixture anchors declared
    inside the fixture itself, never with anchors read from this file, so the end-to-end
    acceptance of the reference at reward 1.0 is a statement about the reward function and
    the gate chain and not a claim that this family has measured anchors. Recorded here and
    in feasibility.yaml rather than papered over.

# Every value a checker compares against. Nothing here is authored inside a checker, and
# seed/tasks/OER-17/drift.yaml moves four of these keys, three of them silently.
bound_values:
  near_duplicate_threshold: 0.45
  normalization_profile: content-token-set-v2-stopword-drop
  sustain_points_required: 3
  sustain_tolerance: 0.01
  frozen_train_steps: 3250
  benchmark_revision: fineweb-val-r1
  optimizer_id: adamw-muon
  learning_rate: 0.025
  adamw_embed_lr: 0.7
  adamw_head_lr: 0.004
  adamw_scalar_lr: 0.015
  adamw_weight_decay: 0.001
  muon_weight_decay: 0.05
  batch_tokens_per_step: 524288
  synthetic_tokens_per_step: 131072
  fineweb_tokens_per_step: 393216
  max_tokens_fed: 1703936000
  max_corpus_samples: 2000
  evaluation_relative_tolerance: 1.0e-04
  eval_point_fractions: [0.5, 0.75, 1.0]
  graded_eval_point_index: 2
  generation_timeout_sec: 120.0
  generation_workspace_forbidden: [benchmark, heldout, checkers, grade.py, tests/, fineweb, snapshot, .bin]
  architecture:
    vocab_size: 50304
    num_layers: 12
    model_dim: 768
    head_dim: 128
    num_heads: 6
    seq_len: 1024

bound_value_provenance:
  frozen_train_steps: read from nanogpt_substrate.json anchors.baseline_steps_to_target, the tuned-baseline step count of upstream record 36.
  batch_tokens_per_step: read from nanogpt_substrate.json run.batch_tokens_per_step, which is 8 * 64 * 1024 at train_gpt_simple.py line 249, counted in tokens.
  max_tokens_fed: frozen_train_steps multiplied by batch_tokens_per_step, so the ceiling is the budget rather than a second free number.
  optimizer_id: the record-set pair, AdamW on the embedding, the output projection and the one-dimensional parameters at train_gpt_simple.py lines 287 to 290, and Muon on the hidden block matrices at line 291.
  learning_rate: the Muon hidden-matrix learning rate 0.025 at train_gpt_simple.py line 292. The three AdamW group rates are bound separately above and are read from lines 287 to 289.
  architecture: read verbatim from nanogpt_substrate.json architecture.
  synthetic_tokens_per_step: a DESIGN bound authored here, not a measurement. The generator owns one quarter of every frozen batch and FineWeb10B supplies the rest, so the mix is frozen while the generator is free. It sums with fineweb_tokens_per_step to batch_tokens_per_step and a checker asserts that sum.
  sustain_tolerance: a DESIGN bound authored here. It is proportionate to the exp(-val_loss) scale, on which a run near the record-set target reads about 0.0376, and it is not carried over from the pre-rebase conversion-accuracy scale where the same key held 0.05.
  evaluation_relative_tolerance: a DESIGN bound authored here. It is the agreement tolerance between the in-loop reading at the graded step and the verifier's recomputation from the stored snapshot, so a snapshot that does not reproduce its own reading is a refused run rather than a grade.

normalization:
  declared_profiles:
    content-token-set-v1: >-
      ASCII casefold; each character of the declared punctuation class replaced by a space;
      whitespace split; every token that parses as a float canonicalised to format(value,
      ".6g"); the result taken as a set. No token class is dropped.
    content-token-set-v2-stopword-drop: >-
      content-token-set-v1 followed by dropping the declared English carrier-word list, so
      the surviving set is the rarer terms, names and numerals that identify a document and
      not the function words a paraphrase moves.
  in_force: content-token-set-v2-stopword-drop
  similarity: Jaccard over the two content-token sets; an empty union scores 0.0
  screened: every generated document against every held-out document, with no sampling
  threshold_semantics: a similarity greater than or equal to near_duplicate_threshold is a hit
  determinism: pure string and set operations over the run record; no clock, no random source, no file read

checker_code_import_allowlist: [json, math, hashlib, dataclasses, typing]
checker_code_note: >-
  tests/checkers.py imports hashlib, json, math, dataclasses and typing and nothing else.
  seed/tasks/OER-17/adequacy.py parses the file's AST and fails if the import set grows, if a
  name outside the allowlist is called, or if the submission is imported anywhere on the
  grading path.

isolation:
  generation: >-
    tests/runner.py copies the submission alone into a fresh temporary directory, launches it
    there as a new session leader under the ENV_ALLOWLIST, captures its output, and kills the
    whole process group in a finally on every path. It reads back at most max_corpus_samples
    documents, dropping any document longer than its declared 65536-character ceiling whole
    rather than truncating it.
  grading: tests/grade.py imports tests/checkers.py, tests/harness.py and tests/runner.py, and never imports the submission.
  benchmark: >-
    tests/heldout/benchmark.jsonl carries the held-out FineWeb validation documents and is
    reachable only from the grading tree. Harbor assembles the non-oracle agent surface from
    task.toml, instruction.md and environment/ alone, so it is absent from the agent surface
    by construction. The FineWeb10B TRAIN shards are staged into the verifier image and the
    validation shards are not, so no path inside the container reaches the graded split.
  snapshots: >-
    tests/harness.py writes each scheduled parameter snapshot into a verifier-private
    temporary directory, never into the grading tree and never into any path the generation
    process saw. The digest that binds a snapshot to a run excludes the host path, so two
    runs of the same bytes on different hosts agree.

checkers:
  - id: heldout_contamination_absent
    statement: "No generated document is a near-duplicate of any held-out benchmark document under the normalization profile and similarity threshold bound in this manifest."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_heldout_contamination_absent
    zero_reason: heldout-item-reproduced
    required: true
    weight: 1
    live_state_read: "record['samples'], the corpus tests/runner.py read back out of the isolated generation workspace, screened against record['benchmark']['items'], the held-out FineWeb documents tests/grade.py loaded in the verifier's own process after generation finished."
    compiled_test: "tests/test_output.py::test_heldout_contamination_absent"
    grades_bound_keys: [near_duplicate_threshold, normalization_profile]
  - id: benchmark_unread_on_generation_path
    statement: "The held-out split was first opened strictly after generation finished, no generation-path event names it, and the generation workspace carried no forbidden path."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_benchmark_unread_on_generation_path
    zero_reason: benchmark-read-before-generation
    required: true
    weight: 1
    live_state_read: "record['events'], the ordered event log tests/grade.py appended in the verifier's own process, and record['generation']['workspace_after'], the listing tests/runner.py took of the isolated workspace after the process group was killed."
    compiled_test: "tests/test_output.py::test_benchmark_unread_on_generation_path"
    rejecting_half_substitution: >-
      No submission can fire this checker's rejecting half while the isolation in
      tests/runner.py holds. The event log is appended by the verifier's own process and
      the generation workspace contains the submission alone, so a submission cannot
      reorder the log or plant a forbidden path in the listing. The rejecting half is
      carried on the planted fixture neg-benchmark-read-during-generation, which swaps
      generation-finished and benchmark-loaded in the recorded order. The accepting half
      runs on every real reference run, and the isolation itself is exercised separately
      by the neg-benchmark-read-attempt control in seed/tasks/OER-17/adequacy.py, whose
      generator attempts four held-out paths and is refused every one. The substitution
      is recorded here and in feasibility.yaml rather than papered over.
  - id: grading_tree_immutable
    statement: "The grading tree is byte-identical before generation and after training, so nothing the submission ran rewrote the held-out split, the checkers, the substrate declaration or the fixtures."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_grading_tree_immutable
    zero_reason: grading-tree-mutated
    required: true
    weight: 1
    live_state_read: "record['grading_tree']['digest_before'] and ['digest_after'], both computed by tests/harness.py::digest_tree over the tests/ tree inside the verifier's own process."
    compiled_test: "tests/test_output.py::test_grading_tree_immutable"
    rejecting_half_substitution: >-
      No submission can fire this checker's rejecting half while the isolation in
      tests/runner.py holds: the submission is copied alone into a fresh temporary
      directory and never receives a path into the grading tree. The rejecting half is
      therefore carried on the planted fixture neg-grading-tree-mutated, which presents a
      record whose two digests differ. The substitution is recorded here and in
      seed/tasks/OER-17/feasibility.yaml rather than papered over, and the accepting half
      is exercised by the real reference run.
  - id: training_budget_respected
    statement: "The frozen nanoGPT budget was respected as actually fed: steps, tokens per step, the synthetic and FineWeb mix quotas, corpus size, optimizer identity and the Muon learning rate all match the bound values."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_training_budget_respected
    zero_reason: training-budget-overspent
    required: true
    weight: 1
    live_state_read: "record['training']['steps_fed'], ['tokens_fed'], ['corpus_samples'], ['optimizer'] and ['learning_rate'], all incremented inside tests/harness.py::train as the run consumed them, never parsed from submission output."
    compiled_test: "tests/test_output.py::test_training_budget_respected"
    grades_bound_keys: [frozen_train_steps, batch_tokens_per_step]
  - id: graded_score_unsmoothed
    statement: "The graded score is the raw evaluation the verifier computed at the bound scheduled point, carrying no smoothing and tracking no filtered readout."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_score_unsmoothed
    zero_reason: graded-readout-smoothed
    required: true
    weight: 1
    live_state_read: "record['eval_points'][i]['raw_score'], produced by tests/harness.py::held_out_loss against the held-out documents and mapped through benchmark_score, compared against record['graded']['score'] and record['graded']['smoothing']."
    compiled_test: "tests/test_output.py::test_graded_score_unsmoothed"
  - id: score_sustained_across_eval_points
    statement: "The graded reading held within the bound tolerance across the last N verifier-scheduled evaluation points, so a single favourable evaluation cannot be harvested."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_score_sustained_across_eval_points
    zero_reason: score-not-sustained
    required: true
    weight: 1
    live_state_read: "record['eval_points'], the full schedule tests/harness.py::eval_schedule fixed before training and evaluated in the verifier's own process."
    compiled_test: "tests/test_output.py::test_score_sustained_across_eval_points"
    grades_bound_keys: [sustain_points_required, sustain_tolerance]
  - id: early_stop_not_a_score
    statement: "A run that halted before the budget step, or whose last scheduled evaluation point is not at the budget step, established no score and is graded as such with a reason."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_early_stop_not_a_score
    zero_reason: early-stop-without-sustained-score
    required: true
    weight: 1
    live_state_read: "record['training']['halted_at_step'] and ['completed'], set by tests/harness.py::train as the loop advanced, together with the last entry of record['eval_points']."
    compiled_test: "tests/test_output.py::test_early_stop_not_a_score"
  - id: graded_score_from_harness_state
    statement: "Two readings exist and the graded one is the verifier's measurement; a number the submission reported is recorded for divergence and never displaces it."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_graded_score_from_harness_state
    zero_reason: graded-score-taken-from-submission-report
    required: true
    weight: 1
    live_state_read: "record['measurement']['score'], recomputed by tests/harness.py::evaluate by reloading the harness-owned snapshot and running the held-out forward pass again, against record['reported']['score'], parsed by tests/runner.py from the submission's captured stdout."
    compiled_test: "tests/test_output.py::test_graded_score_from_harness_state"
  - id: evaluated_weights_harness_owned
    statement: "The evaluated parameter snapshot is the one the harness held at the graded step, digest-bound, selected by the harness, and shape-bound to the frozen 12-layer 768-dim decoder declared in nanogpt_substrate.json."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_evaluated_weights_harness_owned
    zero_reason: evaluated-weights-not-harness-owned
    required: true
    weight: 1
    live_state_read: "record['measurement']['weights'], the snapshot descriptor tests/harness.py::snapshot_descriptor produced from the real parameter tensors, redigested inside the checker and compared against record['training']['weights_by_step'] at the graded step and against the bound architecture."
    compiled_test: "tests/test_output.py::test_evaluated_weights_harness_owned"
    grades_bound_keys: [architecture]

reasons_outside_the_checker_set:
  - anchors-unmeasured
  - generation-failed
  - no-usable-samples
  - checker-execution-failed
  - verifier-aborted
  - checker-self-check-failed
