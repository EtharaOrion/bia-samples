schema_version = "1.4"

artifacts = [
  "/workspace/submission/estimator.py",
  "/logs/verifier/run_record.jsonl",
  "/logs/verifier/score.json",
  "/logs/verifier/outcomes.json",
]

[task]
name = "bia/s06-gradient-estimator-under-noise"
version = "1.0.0"
description = "Recover a usable descent direction from a frozen, structured, lossy gradient corruption and reach the baseline's target validation loss in fewer optimizer steps."
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "gradient-estimation", "variance-reduction", "language-model"]
tags = ["optimization", "bounded-continuous"]

# The seven optimization bindings live here as one block so an auditor reads them
# together. budget_hours is bound BY ROLE: requirements/bia-environment-spec.md names a
# 6 that bounds one fifty attempt session, and that is max_timeout's role. The per
# attempt budget is that 6 divided by 50, which is 0.12 hours, or 7.2 minutes of single
# H100 time. Writing 6 into budget_hours would encode a 300 hour session.
[optimization]
max_timeout = 6.0
budget_hours = 0.12
max_attempts = 50
final_selection = "best"
solver_egress = "setup-only"
compute_envelope = "one-h100"
loop = "each iteration the harness lets the agent submit, grades the submission, summarizes the trajectory, and starts the next iteration carrying every prior approach and its reward"

[optimization.reward]
type = "float"
range = [0.0, 1.0]
clamp = "min(max(raw, 0), 1)"
raw = "mean over seeds of (baseline_steps - agent_steps) / (baseline_steps - target_steps)"
direction = "higher is better"
binary = false
zero_attribution = "every zero score carries a machine readable reason in /logs/verifier/score.json"

[metadata]
category = "optimization"
slot = "S06"
archetype = "AR6"
maturity = "draft"
disposition = "HOLD:PILOT_REQUIRED"
max_timeout_hours = 6.0
budget_hours = 0.12
max_attempts = 50
final_selection = "best"
operating_point = "scaled-h100-7m2"
operating_point_reason = "the upstream nanogpt operating point costs 84 minutes per graded run, which is 11.7 times the 7.2 minute per attempt budget, so a scaled operating point is mandatory"
reference_score = "0.397321, measured on one H100 at this operating point from the per seed block the graded run itself recorded"
difficulty_tier = "unclaimed, difficulty is measured and this bundle carries no signed pilot"

[metadata.cohort]
pinned = ["gpt5.6-sol", "anthropic/claude-opus-5", "muse-spark-1.2"]
valid_to = "2026-11-17"
registry_digest = "unpinned, carried as the open decision cohorts-unpinned in requirements/bia-environment-spec.md"

[budget]
budget_hours = 0.12
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent, carried by name from requirements/bia-environment-spec.md"
role_note = "budget_hours bounds one graded attempt; max_timeout bounds one fifty attempt session"

[agent]
timeout_sec = 21600.0
network_mode = "allowlist"
allowed_hosts = []
egress = "setup-only"

[verifier]
timeout_sec = 1800.0
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/score.json"
reward_schema = "single float on the closed interval from zero to one under the key score, with a machine readable reason"
env = { BIA_BUNDLE = "/workspace", BIA_LOG_DIR = "/logs/verifier", BIA_SUBMISSION = "/workspace/submission/estimator.py", BIA_TESTS = "/tests" }

[environment]
# Pinned by digest, never by floating tag. The value below is the linux/amd64 digest of
# pytorch/pytorch:2.13.0-cuda13.0-cudnn9-runtime as recorded in the verified reference
# bundle this task's shape was drawn from. The bundle image is built from
# environment/Dockerfile on top of that base, and its own resolved digest is bound by the
# operator at build time. That resolved digest is UNBOUND in these bytes and is carried
# as the named coverage gap image-digest-unbound-until-build.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_build = "environment/Dockerfile"
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 20480
network_mode = "public"
network_note = "public during setup only; [agent] narrows to an empty allowlist for scored work"
env = { BIA_BUNDLE = "/workspace", BIA_FIXTURES = "/workspace/environment/fixtures" }

[frozen]
# The paths below are the AGENT VISIBLE copies, present so the solver can read what it
# is measured against. The graded run executes the verifier's private copies under
# tests/private_bundle/, so editing an agent visible copy changes nothing about the
# measurement; frozen_fixture_bytes_match_bound digests both trees at grade time and an
# edit costs the whole score.
graded_copies = "tests/private_bundle/environment/"
model = "environment/harness/model.py"
data = "environment/fixtures/corpus.bin"
data_pipeline = "environment/harness/data.py"
noise_process = "environment/fixtures/noise_process.py"
noise_seed = 20260821
optimizer = "AdamW with frozen hyperparameters and cosine schedule, in environment/harness/train.py"
forward_backward_per_step = 1

[free]
surface = "submission/estimator.py, meaning the map from corrupted observations to the applied update direction, and any state it carries"
execution = "a separate interpreter spawned by the harness, holding no model, data, optimizer, evaluation, run record or target loss; the channel carries gradient shaped tensors and one control word"

[isolation]
graded_run_owner = "verifier"
submission_process = "separate interpreter, spawned by tests/private_bundle/environment/harness/train.py"
submission_channel = "shared float32 buffers allocated by the harness, plus a one word control message"
telemetry_write_policy = "buffered in memory, written once after every arm of every seed has finished"
shared_secret = "none"
scraped_stdout = "none; the verifier reads no number out of the submission's own output"

[fixtures]
noise_process_sha256 = "78477bbfa8b6a818dee25338484fb4a078735c1a11faa74f9175b5f8707e5c88"
corpus_sha256 = "23abc203c5716cea52623e903f24b41a94081e863fa3be44c10151568d199a73"
corpus_kind = "real text corpus, byte level, Python 3.13 standard library source under PSF License 2.0"

[coverage_gaps]
items = [
  "image-digest-unbound-until-build: the built bundle image digest is resolved by the operator at build time and is not present in these bytes",
  "reference-score-single-run: the reference score at the scaled operating point is measured, but from one graded run on a shared accelerator, so its run to run spread is not characterized",
  "cohorts-unpinned: the three named cohorts carry no frozen solver registry digest",
  "trajectories-absent: no per model rollouts, inspection page or reward plots are recorded yet, so the optimization lane refinement evidence obligation is open",
]
disposition_cap = "HOLD:PILOT_REQUIRED"
