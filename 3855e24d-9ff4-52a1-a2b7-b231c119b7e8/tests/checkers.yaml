# Declarative checker roster for bia slot S06, gradient estimator under injected noise.
# Every checker reduces to exactly one of VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING,
# DIVERGENCE, and every checker names the live state read it traces to. The roster and
# tests/grade.py must agree on identifiers and kinds; tests/test_output.py asserts that.
# Grading is hard gated: any failing checker sets the reward to exactly 0.0 and the score
# record carries the machine readable reason naming the checker that closed it.

schema: forge.checkers/v1
slot: S06
# Bound by the Harbor delivery contract, not chosen here. tests/grade.py writes
# the graded float here and tests/test.sh floors it on every exit route.
reward_path: /logs/verifier/reward.txt
# Every checker below is a hard gate: grade.py stops at the first that fails and
# emits exactly 0.0, so the reward is the conjunction over the whole roster.
aggregation:
  mode: all_pass
bound:
  noise_fixture_sha256: "78477bbfa8b6a818dee25338484fb4a078735c1a11faa74f9175b5f8707e5c88"
  corpus_sha256: "23abc203c5716cea52623e903f24b41a94081e863fa3be44c10151568d199a73"
  identity_estimator_digest: "fb16cfc18fedfd0456d7745ece4f89cce90991d18564e997cc302ea47dc95301"

checkers:
  - id: substrate_digest_constant
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_substrate_digest_constant
    live_state_read: "the substrate_digest field carried on every line of the run record the verifier own graded run produced"
    statement: "the resolved architecture, schedule, corpus and noise fixture digest held identical across every record from run_start through summary"
    zero_reason: substrate-digest-constant

  - id: frozen_fixture_bytes_match_bound
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_frozen_fixture_bytes_match_bound
    live_state_read: "the noise_fixture_sha256, corpus_sha256 and harness_tree_sha256 fields the graded run read off disk and wrote onto the run_start record, plus the digests the verifier recomputes at grade time over the agent visible environment/harness and environment/fixtures trees"
    statement: "the loaded noise fixture bytes and corpus bytes equal the digests bound above, the graded run executed the verifier private harness tree, and the agent visible harness and fixture trees are unedited"
    zero_reason: frozen-fixture-bytes-match-bound

  - id: one_backward_per_step
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_one_backward_per_step
    live_state_read: "the backward_calls counter the harness increments at each loss.backward call, and steps_expected, both on the summary record"
    statement: "the number of backward passes equals the number of optimizer steps across every arm and seed, so no submission bought extra gradient information"
    zero_reason: one-backward-per-step

  - id: no_true_gradient_access
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_no_true_gradient_access
    live_state_read: "the true_grad_sentinel_hits counter and true_grad_sentinel_names list on the summary record, incremented by the tripwire object the harness exposes where uncorrupted gradients would sit"
    statement: "no read of the uncorrupted gradient surface occurred at any point in the run"
    zero_reason: no-true-gradient-access

  - id: noise_realization_reproduces
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_noise_realization_reproduces
    live_state_read: "the noise_probe_digest the run computed and wrote on the run_start record, against the digest the verifier derives by importing its own private copy of the fixture at tests/private_bundle and replaying the same frozen probe steps"
    statement: "the injected noise realization the run experienced and the realization the verifier derives independently agree"
    zero_reason: noise-realization-reproduces

  - id: arm_order_and_sustained_crossing
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_arm_order_and_sustained_crossing
    live_state_read: "the ordered seq indexed event stream of the run record, and the agent arm eval records at or after the recorded crossing step"
    statement: "for every seed the baseline arm ran to completion and fixed the target loss before the agent arm started, and no agent evaluation after the crossing step rose back above the target"
    zero_reason: arm-order-and-sustained-crossing

  - id: submission_bound_to_run
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_submission_bound_to_run
    live_state_read: "the estimator_digest field the harness stamped on every agent arm record, compared against the sha256 of the submitted estimator file on disk"
    statement: "installing the submission changed the harness recorded estimator identity away from the frozen identity estimator, so the graded arm actually ran the submitted code"
    zero_reason: submission-bound-to-run

  - id: score_matches_telemetry
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_score_matches_telemetry
    live_state_read: "the per_seed block of the summary record, holding baseline_steps, agent_steps and target_steps as the harness measured them"
    statement: "the emitted reward equals the clamp of the mean per seed steps to target ratio recomputed from that block"
    zero_reason: score-matches-telemetry

reward:
  shape: "single float on the closed interval from zero to one, higher is better"
  clamp: "min(max(raw, 0), 1)"
  raw: "mean over seeds of (baseline_steps - agent_steps) / (baseline_steps - target_steps)"
  zero_attribution: "every zero score carries a machine readable reason in the score record"
