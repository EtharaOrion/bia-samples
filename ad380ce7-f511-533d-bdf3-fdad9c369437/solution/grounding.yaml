    rule_id: R4-measured-reward-ceiling-literal
    carrier_before: environment/manifest.json
    former_owner_note: >-
      The waiver named the verifier lane (tests/) as the owner and said the value could
      not be deleted because checkers.score_from_reading returns 0.0 when the ceiling is
