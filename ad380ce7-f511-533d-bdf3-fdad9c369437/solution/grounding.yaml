withheld_from_the_agent_instruction:
  note: >-
    APPEND-ONLY preservation record. OER-15 carries the same leak class as OER-02 and OER-03 in a
    different currency: family F10 has no measured anchors, so the reward is scaled between two
    substrate-measured operating points, and the CEILING operating point is the reading that scores
    exactly 1.0. instruction.md published it verbatim. Moved out on 2026-08-25. FORGE.md item 11.
  removed_on: 2026-08-25
  leak_class: graded-endpoint-published-on-agent-surface
  carriers:
    - carrier: instruction.md
      at: "line 89, section on the handed grid and the plateau"
      verbatim_removed:
        - 'Full reward is reached at **0.2818765313056418 bits per byte**, and beating it also scores exactly 1.0, because the target is a bar and not a point on a gradient.'
      values:
        reference_construction_optimum_bpb: 0.2818765313056418
        role: "reward ceiling; the reading at which raw reaches 1.0"
      replaced_by: >-
        A statement that the full-reward reading is a measured operating point the verifier holds
        and is not published, followed by the reward SHAPE: below the acceptance bar the reward
        rises continuously as bits per byte fall, at a constant rate, saturating at exactly 1.0
        once the reference reading is matched.
  retained_deliberately:
    - value: 0.33735183879296543
      where: "instruction.md, environment/manifest.json default_construction_optimum_bpb"
      why: >-
        The FLOOR, not the ceiling. It is the measured optimum of the handed construction over its
        own 60-row grid and the instruction explicitly tells the agent to reproduce it with 60
        calls to harness.bits_per_byte. An agent-reproducible fact is not a secret, and the floor
        alone does not locate the point that scores 1.0.
    - value: 0.3173518387929654
      where: "instruction.md, environment/manifest.json acceptance_bar_bpb"
      why: >-
        The zero-threshold, and it is arithmetically derivable from the reproducible floor and the
        published 0.02 separation. Withholding a number the agent can compute from two published
        numbers buys nothing, and the agent needs the bar to know the task is non-trivial.
  residual_leak_not_closed_by_this_lane:
    - carrier: environment/manifest.json
      at: "measured_operating_points.reference_construction_optimum_bpb, line 39"
      value: 0.2818765313056418
      status: OPEN
      why_not_closed: >-
        This key is LOAD-BEARING for grading, not merely informational. environment/harness.py
        manifest() reads it, tests/runner.py echoes the manifest into the run record, and
        tests/checkers.py score_from_reading uses it as the ceiling of the reward scale, returning
        0.0 if it is absent. Removing it from the agent surface silently zeroes every score.
      correct_fix: >-
        The verifier must carry its own copy of the ceiling under tests/ and stop resolving it from
        the agent-visible manifest, exactly as OER-01, OER-07, OER-18 and OER-21 already do with
        tests/anchors.json. That is a tests/ change and tests/ is not this lane's to write.
      owner: verifier lane (tests/)
    - carrier: task.toml
      at: "anchors_note, line 64"
      value: 0.2818765313056418
      status: OPEN
      why_not_closed: "task.toml is owned by a concurrent lane and is explicitly out of scope for this lane."
      owner: manifest lane (task.toml)

