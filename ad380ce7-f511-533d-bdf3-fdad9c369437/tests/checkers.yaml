schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    Every declared checker is required and tests/grade.py runs them in the order
    declared below, stopping at the first failure and emitting that checker's own
    zero_reason. That is exactly what required_pass describes: a universal
    quantifier over a non-empty required set, with no averaging that could dilute a
    zero. The mode decides admission only. The number written on admission is the
    bound reward formula over the graded bits-per-byte reading, so the reward is a
    continuous float on [0.0, 1.0] and never a binary pass flag.

graded_quantity:
  statement: >-
    bits per byte, computed by the verifier over the FROZEN evaluation corpus in
    BYTES, from harness-owned model state at the bound evaluation point.
  numerator: "raw bits the frozen model assigns to environment/corpus/eval.txt at 2200 updates"
  denominator: "5739, the frozen byte count of environment/corpus/eval.txt"
  never: >-
    never a number the submission reported, printed or wrote; never a smoothed,
    averaged or EMA-blended series; never a checkpoint the submission selected.

isolation_substitutions:
  note: >-
    Invariant 17 requires both halves of every checker. NINE of the eleven cannot be
    fired by any submission, because tests/runner.py never lets a submission near the
    compute counter, the model state, the denominator or the schedule. Their rejecting
    halves are carried on planted telemetry fixtures generated from
    solution/grounding.yaml, and the substitution is recorded here and in
    seed/tasks/OER-15/feasibility.yaml rather than papering over it.
  corrected_in_resume_run: >-
    The count read "Eight" against eleven rows and did not add up. Recounted against the
    rows as they stand: nine rejecting halves are planted in tests/test_output.py and two
    are live. Separately, seed/tasks/OER-15/adequacy.py fires
    submission_vocabulary_took_effect LIVE as well, with a no-op submission whose
    build_vocab returns an empty list, so that checker's rejecting half is observed on a
    real submission and does not in fact rest on the substitution its row declares.
  live_rejecting_halves_in_the_compiled_suite:
    - early_stop_not_an_established_metric
    - beats_default_construction_optimum
  additionally_fired_live_by_adequacy:
    - submission_vocabulary_took_effect

checkers:
  - id: early_stop_not_an_established_metric
    statement: "The run reached the bound evaluation point, so a reading exists that a halt did not harvest; a run that stopped earlier is graded as not having established the metric."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_early_stop_not_an_established_metric
    zero_reason: early-stop-no-established-metric
    required: true
    weight: 1
    live_state_read: "telemetry.compute.halted_before_bound_point and telemetry.compute.consumed_updates, both incremented by the update loop inside environment/harness.py during the verifier's own run"
    compiled_test: "tests/test_output.py::test_early_stop_not_an_established_metric"
    rejecting_half: live-submission

  - id: frozen_axes_unmoved
    statement: "The compute budget, the vocabulary budget, the model specification digest and both corpus digests recorded by the run equal the frozen values in environment/manifest.json."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_frozen_axes_unmoved
    zero_reason: frozen-axis-moved
    required: true
    weight: 1
    live_state_read: "telemetry.frozen, recomputed by environment/harness.py from the corpora on disk and from its own model constants, against environment/manifest.json in the delivery unit"
    compiled_test: "tests/test_output.py::test_frozen_axes_unmoved"
    rejecting_half: planted-telemetry-fixture

  - id: eval_points_ordered_by_updates
    statement: "The evaluation schedule ascends strictly in update count, carries exactly one bound point, and places every sustain point after it."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_eval_points_ordered_by_updates
    zero_reason: eval-schedule-out-of-order
    required: true
    weight: 1
    live_state_read: "telemetry.eval_points, appended by environment/harness.py in the order it actually evaluated"
    compiled_test: "tests/test_output.py::test_eval_points_ordered_by_updates"
    rejecting_half: planted-telemetry-fixture

  - id: compute_budget_respected_as_spent
    statement: "The updates the harness counter actually charged never exceed the frozen compute budget, and the bound evaluation point sits exactly at that budget."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_compute_budget_respected_as_spent
    zero_reason: compute-budget-overspent
    required: true
    weight: 1
    live_state_read: "telemetry.compute.charged_updates, the counter environment/harness.py increments once per token position the optimizer visits"
    compiled_test: "tests/test_output.py::test_compute_budget_respected_as_spent"
    rejecting_half: planted-telemetry-fixture

  - id: denominator_is_frozen_eval_bytes
    statement: "Every reading divides by the frozen byte count of the evaluation corpus, 5739, whose digest matches the manifest; no reading divides by a token count."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_denominator_is_frozen_eval_bytes
    zero_reason: denominator-not-frozen-eval-bytes
    required: true
    weight: 1
    live_state_read: "telemetry.denominator and the denominator_bytes of every telemetry.eval_points row, against the sha256 tests/runner.py took of environment/corpus/eval.txt on disk"
    compiled_test: "tests/test_output.py::test_denominator_is_frozen_eval_bytes"
    rejecting_half: planted-telemetry-fixture
    headline: >-
      This is the readout attack a tokenizer slot exists to close, and the resume run
      MEASURED which direction of it is profitable rather than assuming one. The free
      axis moves the token count directly: the reference vocabulary turns 5739
      evaluation bytes into 970 tokens. Swapping the denominator to that token count is
      the obvious move and it is NOT profitable here, because 1617.6 raw bits over 970
      tokens reads 1.6677, worse than the same bits over 5739 bytes reading 0.28188 on
      a lower-is-better metric. The profitable move is the opposite one, inflating the
      denominator above the frozen byte count, and this checker refuses both with the
      same reason: it pins the denominator to 5739 bytes and to the manifest digest, so
      no reading may divide by anything else in either direction.

  - id: graded_state_is_harness_owned
    statement: "The weights evaluated at the graded point are the state the harness held at that update count, not a checkpoint the submission selected, and the state advanced past every progress point."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_state_is_harness_owned
    zero_reason: graded-state-not-harness-owned
    required: true
    weight: 1
    live_state_read: "telemetry.readout.weights_origin and the state_digest environment/harness.py takes of its own Model object at each scheduled point"
    compiled_test: "tests/test_output.py::test_graded_state_is_harness_owned"
    rejecting_half: planted-telemetry-fixture

  - id: graded_readout_unsmoothed
    statement: "The graded bits are the raw bits recorded at the bound point, with no filter, average or exponential blend on the graded path."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_readout_unsmoothed
    zero_reason: graded-readout-smoothed
    required: true
    weight: 1
    live_state_read: "telemetry.readout.filter and the raw bits field of the bound row of telemetry.eval_points, both written by environment/harness.py"
    compiled_test: "tests/test_output.py::test_graded_readout_unsmoothed"
    rejecting_half: planted-telemetry-fixture

  - id: submission_vocabulary_took_effect
    statement: "The graded run encoded with the vocabulary the submission returned, that vocabulary contributed entries beyond the 256 single bytes, and it changed the encoding of the evaluation corpus."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_submission_vocabulary_took_effect
    zero_reason: submission-vocabulary-inert
    required: true
    weight: 1
    live_state_read: "telemetry.vocabulary.submitted_digest from environment/harness.submission_digest, against the digest tests/runner.py took of the list the isolated submission process handed back"
    compiled_test: "tests/test_output.py::test_submission_vocabulary_took_effect"
    rejecting_half: planted-telemetry-fixture

  - id: metric_not_taken_from_submission_report
    statement: "The graded value is the verifier's own raw bits over the frozen byte count, and it diverges in provenance from anything the submission reported about itself."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_metric_not_taken_from_submission_report
    zero_reason: metric-sourced-from-submission
    required: true
    weight: 1
    live_state_read: "telemetry.graded.bits and telemetry.graded.denominator_bytes recomputed by the checker, against telemetry.reported_by_submission carried untouched from the isolated submission process"
    compiled_test: "tests/test_output.py::test_metric_not_taken_from_submission_report"
    rejecting_half: planted-telemetry-fixture

  - id: beats_default_construction_optimum
    statement: "The graded bits-per-byte reading is at or below the measured optimum of the handed default construction less the bound separation, so accepting the handed option set scores zero."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_beats_default_construction_optimum
    zero_reason: default-construction-plateau-not-beaten
    required: true
    weight: 1
    live_state_read: "telemetry.graded.bits_per_byte from the verifier's own harness run, against manifest.measured_operating_points.default_construction_optimum_bpb frozen in the delivery unit"
    compiled_test: "tests/test_output.py::test_beats_default_construction_optimum"
    rejecting_half: live-submission
    archetype_note: >-
      AR5. The handed option grid has 60 rows and all 60 were measured on this
      substrate. Its optimum is 0.33735183879296543 bits per byte and the bar is that
      optimum less 0.02. A submission that sweeps the handed knobs to their best value
      lands on the plateau and scores exactly zero with this reason.

  - id: reading_sustained_across_scheduled_points
    statement: "The graded reading holds at every verifier-scheduled evaluation point after the bound point, within the bound tolerance and under the acceptance bar, and none of those points was charged to the agent's budget."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_reading_sustained_across_scheduled_points
    zero_reason: reading-not-sustained
    required: true
    weight: 1
    live_state_read: "the sustain rows of telemetry.eval_points, scheduled by environment/harness._schedule from manifest evaluation_schedule.sustain_offsets and evaluated after the bound point"
    compiled_test: "tests/test_output.py::test_reading_sustained_across_scheduled_points"
    rejecting_half: planted-telemetry-fixture
    ordering_note: >-
      REORDERED, resume run, on a MEASURED failure. This checker re-tests the
      acceptance bar as part of what "sustained" means, so while it stood ahead of
      submission_vocabulary_took_effect and beats_default_construction_optimum it
      emitted reading-not-sustained for the two submissions those checkers exist to
      name. seed/tasks/OER-15/adequacy.py observed a no-op submission and a
      default-construction plateau submission both graded reading-not-sustained,
      which left submission-vocabulary-inert and
      default-construction-plateau-not-beaten declared but unemittable end to end.
      Moving this row last leaves the sustain question where it belongs, after the
      bound-point reading has been established as real and as good enough, and each
      of the three reasons is now emitted by the submission it names.
