schema_version = "1.4"

[task]
name = "bia/tokens-to-target"
version = "1.0.0"
description = "Reach a target validation loss on fewer training tokens, with batch size free."
authors = ["Bia"]
keywords = ["optimization", "language-model", "training-efficiency"]

[metadata]
tags = ["optimization", "bounded-continuous"]
difficulty = ""
category = "optimization"

# The seven optimization bindings, transcribed from seed/forge/oer.py BINDINGS.
# max_timeout and budget_hours are distinct fields with distinct roles and neither is an alias of the other.
# The 6 that requirements/bia-environment-spec.md names bounds one session of fifty attempts, which is max_timeout's role.
# budget_hours is the per-attempt completion bound, being 6 hours divided by 50 attempts, which is 0.12 hours or 7.2 minutes.
# Writing that 6 into budget_hours would encode a 300 hour session, which every well-formedness check would pass as valid.
max_timeout = 6.0
max_timeout_hours = 6.0
budget_hours = 0.12
max_attempts = 50
max_attempts_ceiling = 100
final_selection = "best"
solver_egress = "setup-only"
compute_envelope = "one H100, single accelerator, no multi-GPU scaling"
reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
reward_kind = "float"
reward_range = [0.0, 1.0]
reward_full = 1.0
reward_clip = "min(max(raw, 0.0), 1.0)"
reward_path = "/logs/verifier/reward.txt"

[metadata.budget]
budget_hours = 0.12
budget_envelope = "One H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
role_note = "budget_hours bounds one graded attempt; max_timeout bounds one fifty attempt session."

[agent]
# Was 0.0, which is not a positive bound: a zero timeout makes the attempt cap unenforceable and the task ungradable.
# 21600 seconds is the six hour session that max_timeout_hours binds above, so the two agree by construction.
timeout_sec = 21600.0
# Setup-only egress: [environment] below is the provisioning baseline and this narrows the scored run to no network.
network_mode = "none"
allowed_hosts = []

[verifier]
# Was 0.0. Carried from the sibling bundles of this family, which grade the same token grid.
timeout_sec = 10800.0

[environment]
build_timeout_sec = 1800.0
# Pinned by digest, never by a floating tag. This is the manifest digest of the image built from this bundle's own
# environment/Dockerfile on the x86_64 host that executes the task, so the scanned and executed images cannot differ.
docker_image = "bia/tokens-to-target-64f9bfe0@sha256:83dbcbf5038f635f0ce92f98177c678ee6516db39e372ff8b5e3e71a50210e09"
gpus = 1
gpu_types = ["H100"]
network_mode = "public"
