schema_version = "1.4"

# schema_version is a TOP-LEVEL scalar and is written above the first table header on
# purpose: TOML scopes every key to the most recent header, so an assignment placed below
# [task] would silently become task.schema_version while still reading correct to a human.

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "oer-21-quantization-scheme-search-breadth"
version = "1.1.0"
description = "Reduce the perplexity degradation of a post-training-quantized nanoGPT checkpoint at a fixed total bit budget, measured by the verifier running real forward passes of the frozen twelve-layer decoder on held-out FineWeb slices the solver cannot see, where the handed option set is one region of the scheme space rather than the space."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "quantization", "option-expansion", "nanogpt"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-21"
provisional_identifier = "OER-21"
title = "Quantization scheme search breadth at a fixed bit budget"
family = "F9"
family_title = "quantization"
primary_archetype = "AR5"
archetype_title = "Adversarial Option Expansion"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time; no buffet within the slot"
metric = "worst per-slice relative perplexity degradation, in percent of that slice's unquantized reference perplexity"
metric_direction = "lower"
frozen = ["the checkpoint parameters", "the architecture", "the total bit budget", "the held-out evaluation split", "the unquantized reference readings"]
free = ["per-shard bit width", "per-group bit width inside a shard", "the number and boundaries of scale groups", "the codebook family", "the clip percentile"]
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
perception_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.substrate]
framework = "nanoGPT, modded-nanogpt records/track_3_optimization"
declaration = "environment/nanogpt_substrate.json"
declaration_version = "nanogpt-substrate-v1"
architecture_module = "environment/model/nanogpt.py"
graded_artifact = "a real parameter snapshot of the frozen twelve-layer 768-dimension decoder, quantized by the harness and evaluated by real forward passes"
graded_split = "held-out FineWeb slices, verifier-owned, absent from the agent container"
metric_resolves_against = "a nanoGPT run"

[metadata.identity]
state = "provisional"
note = "The provisional identifier is the slot id. No canonical_content_hash, no uuid5, no uuid-named directory, no canary token, no provenance carrier and no signature is authored by this lane. Identity is done for every slot at once in wave 2, and this slot's re-base moves bytes inside the canonical hash domain, so its predecessor uuid does not survive the pass."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours bounds the SESSION across attempts; budget_hours bounds ONE
# attempt, being six hours over fifty attempts, 0.12 hours or 7.2 minutes. They
# are explicitly distinct and are never aliases for each other.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.reward]
path = "/logs/verifier/reward.txt"
carrier = "one bare float"
score_document = "/logs/verifier/score.json"
interval = [0.0, 1.0]
direction = "higher-is-better"
binary = false
full_reward = 1.0
formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric); score = min(max(raw, 0.0), 1.0)"
formula_family = "lower-is-better metric"
target_is_a_bar = "reaching the target scores exactly 1.0 and beating it also scores 1.0"
every_zero_carries_a_machine_readable_reason = true

[metadata.anchors]
state = "absent"
local_scaling_note = "Two endpoints the verifier MEASURES at grading time carry the bounded scaling while the family anchors are absent: the measured optimum of the handed option set, swept by the verifier, and a fixed widening probe the verifier evaluates in the same run. Neither is stored in this bundle, so no endpoint measured on the substrate this slot replaced survives into it. They are not the family anchors and do not stand in for them. When the anchors are measured they take these two positions and the schema does not change."

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest"
image_pin_rule = "pinned by @sha256 and never by a floating tag; Harbor accepts any string, so the digest requirement is this contract's and this lane enforces it"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install, and unable
# to stage the frozen checkpoint and the calibration slice named in its own manifests.
network_mode = "public"

[verifier]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
egress = "denied"
network_mode = "none"
egress_rationale = "The verifier recomputes the graded quantity from its own mounted checkpoint and its own held-out slices and needs no network. Denying it means no grading path can reach a mirror, a cache or a released artifact."

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_rationale = "The solving agent gets open internet egress inside the sandbox so it can fetch its own packages, datasets and models. The asymmetry against the verifier is deliberate and is a bound byte here rather than an accident."
deny_list_is_not_containment = "The deny list names three hosts and is not a containment proof. Mirrors, caches, paraphrased write-ups and released weights all carry a recipe past any deny list. The deterministic checker chain is the load-bearing control, and the graded split being verifier-owned is the reason a remembered allocation still has to hold on slices the solver never measured."
network_mode = "none"
