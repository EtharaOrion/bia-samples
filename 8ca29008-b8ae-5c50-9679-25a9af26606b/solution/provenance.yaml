# PRIVATE provenance record for the S08 bundle.
#
# This file carries the hash recipe rather than the hash. A digest recorded inside the
# bytes it covers is a self reference, and resolving one by excluding this file from
# the hash domain would leave the provenance record itself uncovered. The recipe below
# is complete, so the orchestrator recomputes the digest independently and compares it
# against the directory name, which is the uuid5 the digest produced.

schema: bia.provenance/v1
slot: S08

# ---------------------------------------------------------------------------
# Canonical content hash recipe. solution/recompute.py --content-hash is the
# executable copy of exactly this procedure.
# ---------------------------------------------------------------------------
content_hash:
  algorithm: sha256
  root: the bundle directory, the directory that contains task.toml
  excluded_paths:
    - trajectories/
  excluded_names:
    - __pycache__
  excluded_reason: >-
    trajectories/ is rollout evidence recorded after the freeze and must never change
    frozen bundle identity. __pycache__ is interpreter output and is never authored.
  file_order: >-
    Every remaining regular file, addressed by its path relative to the root with
    forward slashes, sorted ascending by that relative path as a byte string.
  per_file_update:
    - the relative path encoded as utf-8
    - a single 0x00 byte
    - the file length in bytes, rendered as a decimal ascii integer
    - a single 0x00 byte
    - the file contents verbatim
    - a single 0x00 byte
  output: the lowercase hexadecimal sha256 digest of that stream
  recompute_command: "python3 solution/recompute.py --content-hash"

directory_name:
  namespace: c53e8f3b-526f-52c0-a04e-89e2269b237d
  namespace_name: FORGE_TASK_NAMESPACE
  rule: "uuid5(FORGE_TASK_NAMESPACE, canonical_content_hash)"
  hash_input_form: the lowercase hexadecimal digest string, not the raw digest bytes
  binding: >-
    The bundle was authored into a temporary directory, its bytes were frozen, the
    canonical content hash was computed over those frozen bytes, the uuid5 was derived
    from that digest, and only then was the directory renamed into dataset/. No uuid
    was invented and none was chosen.

# ---------------------------------------------------------------------------
# Upstream provenance
# ---------------------------------------------------------------------------
upstream_provenance:
  origin: original
  provenance_date: "2026-08-21"
  source_kind: synthetic
  generator_identity: solution/make_fixture.py at generator_version s08-fixture-1, over environment/runner/s08_core.py at core_version s08-core-1
  generation_inputs:
    corpus_seed: 20260821
    init_seed: 20260822
    profile: scaled
    generator_threads: 8
  upstream_lift: >-
    None. The model, the synthetic source, the checkpoint, the poison transform, the
    runner and the verifier are authored for this slot. The bundle layout follows the
    Harbor delivery shape demonstrated by the verified track3 reference bundle, and no
    byte of that bundle's task content, corpus, records or optimizer recipes is carried
    into this one.
  training_corpus_relationship: >-
    The task data is a synthetic Markov source generated from a pinned seed at container
    build time and published nowhere, so there is no public corpus for it to have leaked
    into. The leakage surface that remains is generic optimizer knowledge, which is prior
    art a solver is entitled to use, and the checkpoint's specific poison is not a
    published artifact.
  attestation: >-
    attestation-unavailable. The record is synthetic and carries no repository ancestry
    or task generating event to attest, and no external source attestation trust root was
    resolvable from the authoring host.

# ---------------------------------------------------------------------------
# Fixture reproduction
# ---------------------------------------------------------------------------
fixture_reproduction:
  artifact: environment/fixtures/ckpt_s08_scaled.pt
  manifest: environment/fixtures/manifest_scaled.json
  command: "python3 solution/recompute.py --verify-fixture --profile scaled"
  procedure: >-
    Regenerate the checkpoint from the pinned seeds and the pinned torch thread count
    recorded in the manifest, compare the sha256 against the shipped blob, and
    independently compare the poison transform structurally by reading the per tensor
    ratio the transform imposes rather than the absolute tensor values.
  byte_identity_conditions:
    - the torch version recorded in the manifest
    - the thread count recorded in the manifest
    - a CPU whose reduction ordering matches the authoring host
  byte_identity_caveat: >-
    Byte identity is claimed only under those conditions. The structural comparison is
    exact under all of them and under none of them, which is why the verifier reports
    both and passes when either holds. A grader who obtains a structural match and a
    byte mismatch has established that the poison is the declared poison and that the
    float build differs, which is the honest reading of that outcome.
  generated_without_gpu: true
  cuda_allocated: false

verification_performed_locally:
  - id: 1
    step: task.toml parses under tomllib
  - id: 2
    step: all seven optimization bindings present with budget_hours bound by role
  - id: 3
    step: every checker reduces to exactly one of the six kinds and names its live-state read
  - id: 4
    step: rubrics.jsonl parses line by line with exactly two keys
  - id: 5
    step: no em-dash and no intra-paragraph newline in any emitted Markdown
  - id: 7
    step: the directory name equals uuid5 over the frozen content hash
  - id: 8
    step: >-
      rubric compilation. Identifier set equality holds in both directions between the
      mode compiled items of solution/rubrics.json, the registered checker set, the keys
      of /logs/verifier/outcomes.json and the test names of tests/test_output.py. The
      compiled weight share is 0.809524 over seventeen compiled and four judged items at
      the uniform item weight, against a floor of 0.75. Every judged item names its
      residue. Asserted executably by tests/test_bundle_invariants.py rather than only in
      prose.
  - id: 9
    step: >-
      rubric liveness. solution/negative_controls.py --all runs the reference and
      eighteen known-wrong controls end to end at the smoke operating point. The
      reference is accepted by all seventeen compiled checkers and scores 0.85. Every
      control is rejected by the checker its table row names, and every one of the
      seventeen checkers carries at least one measured rejection, so no compiled test
      accepts both the reference and a control.

verification_deferred:
  - id: 6
    step: execute solution/solve.sh and record the harness score it earns
    owner: the orchestrator, on an idle H100 after the live evaluation campaign closes
    reason: >-
      The host accelerator was at full utilization running a live evaluation campaign
      during authoring, and co-scheduling would time slice against it. This lane ran no
      GPU work of any kind and allocated no CUDA memory.
    substitute_evidence: >-
      solution/solve.sh with BIA_SMOKE=1 executes the identical code path CPU only at
      the smoke profile, including generating a smoke sized poisoned checkpoint with the
      same generator, and it was run to completion by the authoring lane.
    reference_score: "unmeasured, pending orchestrator GPU run"
