schema: forge.checkers/v1

# MEASURED CORRECTION carried into this lane. The live seed/forge/verifier.py
# binds the reward carrier to reward.txt, not reward.json. The bare float goes
# to the carrier below and the machine-readable reason plus the metric block go
# to the score document beside it. tests/test.sh writes both from one trap, so
# the instrument's binding and the reason carrier never disagree.
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

aggregation:
  mode: required_pass
  rationale: >-
    required_pass describes what tests/grade.py actually does with the twelve
    rows below: it walks checkers.CHAIN in a fixed order and the first required
    checker that fails ends the grading at 0.0 carrying that checker's own
    zero_reason. No checker is optional and no checker's failure is averaged
    away by another checker's success, which is precisely the universal
    quantifier required_pass names. The reward is not itself binary: once every
    required criterion has passed, grade.py multiplies the continuous magnitude
    term, mean over seeds of the clipped lower-is-better raw, by the continuous
    confidence ramp clip(separation / 0.05, 0, 1). The gate is required_pass;
    the number the gate admits is continuous.
  gate_then_magnitude: >-
    reward = clip(mean_over_seeds(clip(raw)) * clip(separation / 0.05, 0, 1))
    with raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric).
  anchors_state: absent
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  anchors_consequence: >-
    baseline_metric and target_metric are UNMEASURED for F15, so no number is
    bound for them anywhere in this bundle. grade.py refuses a telemetry record
    whose anchor pair is absent and writes 0.0 with the machine-readable reason
    anchor-pair-absent rather than substituting a value. The reward SCHEMA above
    is fully bound; only the two anchor numbers are absent.

# Two of the twelve cannot be fired by ANY submission while the isolation
# boundary holds, because the boundary is what makes them true. Their rejecting
# half is carried on a planted fixture instead, and the substitution is recorded
# here and in seed/tasks/OER-05/feasibility.yaml rather than papered over. A
# control that fired them from a submission would be evidence the boundary had
# failed, not evidence the checker works.
rejecting_half_substitutions:
  - checker: grading_tree_not_writable_from_submission
    reason: >-
      tests/runner.py copies the submission alone into a fresh temporary
      directory and the grading tree is never on its path, so no submission can
      move a byte under tests/. The rejecting half runs on the planted fixture
      defect_grading_tree_mutated, which moves the grading tree digest between
      open and close and plants an upper-layer entry under tests/.
    planted_fixture: tests/fixtures/defect_grading_tree_mutated.json
  - checker: truth_computed_after_submission_exit
    reason: >-
      the ordering is a property of tests/grade.py itself, which computes truth
      only after runner.py has reaped the process group. No submission can
      invert it. The rejecting half runs on the planted fixture
      defect_truth_before_exit, whose order log records truth computed before
      the submission exited.
    planted_fixture: tests/fixtures/defect_truth_before_exit.json

checkers:
  - id: truth_computed_after_submission_exit
    statement: "Ground truth is computed only after the submission subprocess exited and its whole process group was reaped, so no byte the submission could still emit can move the graded answer."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_truth_computed_after_submission_exit
    zero_reason: truth-computed-before-submission-exit
    required: true
    weight: 3
    live_state_read: "the verifier's own order log, appended by tests/runner.py at subprocess exit and at process-group reap and by tests/grade.py at truth computation; read as ctx['order_log']"
    compiled_test: "tests/test_output.py::test_truth_computed_after_submission_exit"
    rejecting_half: planted-fixture

  - id: grading_tree_not_writable_from_submission
    statement: "No entry under the grading tree was created, modified or removed across the run: its digest is unmoved between overlay open and close and no upper-layer entry lands under tests/."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_grading_tree_not_writable_from_submission
    zero_reason: grading-tree-mutated
    required: true
    weight: 3
    live_state_read: "the launcher-owned overlay handles: the digest of the grading tree at open and at close, and launcher.upper_entries over the writable upper layer; read as ctx['grading_tree']"
    compiled_test: "tests/test_output.py::test_grading_tree_not_writable_from_submission"
    rejecting_half: planted-fixture

  - id: no_submission_number_on_graded_metric
    statement: "Every field on the graded path was produced by the verifier's own process, and the graded field set is exactly the bound set, so no number the submission printed reaches the reward."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_no_submission_number_on_graded_metric
    zero_reason: submission-supplied-number-on-graded-path
    required: true
    weight: 3
    live_state_read: "the verifier's provenance ledger, one row per graded field naming the producing process; read as ctx['graded_metric_provenance']"
    compiled_test: "tests/test_output.py::test_no_submission_number_on_graded_metric"

  - id: graded_crossing_recomputed_unsmoothed
    statement: "The graded readout at every evaluation point is the verifier's own raw held-out evaluation with no filter on it, and the verifier's recomputed crossing agrees with the step claimed for it."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_crossing_recomputed_unsmoothed
    zero_reason: readout-smoothing-on-graded-path
    required: true
    weight: 5
    live_state_read: "the verifier's held-out evaluation series, one row per verifier-scheduled point carrying loss_raw, graded_loss, loss_source and smoothing; read as ctx['seed_runs'][i]['eval_points']"
    compiled_test: "tests/test_output.py::test_graded_crossing_recomputed_unsmoothed"

  - id: early_stop_yields_no_crossing
    statement: "A run that halted at a favourable evaluation, or that ended before its sustain window closed, is graded as not having crossed rather than as having produced an absent result."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_early_stop_yields_no_crossing
    zero_reason: early-stop-without-sustained-window
    required: true
    weight: 4
    live_state_read: "the verifier's own run record: halt_reason and the last evaluation point the verifier scheduled and obtained; read as ctx['seed_runs'][i]['halt_reason'] and ['last_eval_step']"
    compiled_test: "tests/test_output.py::test_early_stop_yields_no_crossing"

  - id: crossing_sustained_across_scheduled_evals
    statement: "The target holds at the graded step and at every one of the bound number of subsequent verifier-scheduled evaluation points, so a single favourable evaluation is never a crossing."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_crossing_sustained_across_scheduled_evals
    zero_reason: crossing-not-sustained
    required: true
    weight: 5
    live_state_read: "the admin plane's sustain_window from the drift state, against the verifier's held-out evaluation series; read as ctx['drift_state']['sustain_window'] and ctx['seed_runs']"
    compiled_test: "tests/test_output.py::test_crossing_sustained_across_scheduled_evals"

  - id: evaluated_weights_are_harness_owned
    statement: "The weights evaluated at the graded step and across the sustain window are the weights the harness weight ledger names for those steps, under the custody the admin plane binds."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_evaluated_weights_are_harness_owned
    zero_reason: weights-not-harness-owned
    required: true
    weight: 4
    live_state_read: "the harness-owned weight ledger written by environment/train_track3.py HarnessLedger, keyed by step; read as ctx['seed_runs'][i]['harness_weight_ledger'] against ctx['drift_state']['weight_custody']"
    compiled_test: "tests/test_output.py::test_evaluated_weights_are_harness_owned"

  - id: behavioural_probe_deterministic
    statement: "Two probe passes over the same rule produce identical transcripts, and each recorded digest recomputes from the transcript it claims to cover."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_behavioural_probe_deterministic
    zero_reason: probe-digest-nondeterministic
    required: true
    weight: 3
    live_state_read: "the verifier's two probe passes over the submitted rule, each a transcript plus a digest, produced by tests/probe.py over the fixed probe inputs; read as ctx['probe']['pass_a'] and ['pass_b']"
    compiled_test: "tests/test_output.py::test_behavioural_probe_deterministic"

  - id: probe_transcript_bound_to_training_deltas
    statement: "The behaviour the probe recorded and the update deltas the harness watched during the graded run carry one digest, so a reported behaviour that was not exhibited diverges here."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_probe_transcript_bound_to_training_deltas
    zero_reason: probe-transcript-diverges-from-harness-deltas
    required: true
    weight: 4
    live_state_read: "the verifier's probe transcript digest against the harness's own digest over the per-step delta signatures it recorded; read as ctx['probe']['transcript_digest'] and ['harness_deltas_digest']"
    compiled_test: "tests/test_output.py::test_probe_transcript_bound_to_training_deltas"

  - id: corpus_pinned_before_novelty_verdict
    statement: "The behavioural corpus was pinned before the novelty verdict was taken, and the verdict is stamped against the pinned corpus digest rather than against a corpus that has since moved."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_corpus_pinned_before_novelty_verdict
    zero_reason: novelty-verdict-predates-corpus-pin
    required: true
    weight: 4
    live_state_read: "the admin plane's corpus_pin from the drift state, the verifier's verdict ordering record, and tests/corpus/loader.py pinned_digest over tests/corpus/entries.json; read as ctx['drift_state']['corpus_pin'], ctx['verdict_order'] and ctx['probe']['corpus_pinned_digest']"
    compiled_test: "tests/test_output.py::test_corpus_pinned_before_novelty_verdict"

  - id: behavioural_novelty_clears_corpus
    statement: "The submitted rule's behaviour, measured by the verifier's own probe over the probe set the admin plane names, diverges from every corpus entry by more than the bound behavioural margin."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_behavioural_novelty_clears_corpus
    zero_reason: behaviour-matches-corpus-entry
    required: true
    weight: 5
    live_state_read: "the verifier's probe outcome over the corpus signatures recomputed by tests/corpus/loader.py, against ctx['drift_state']['probe_input_set']; read as ctx['probe']['min_behavioural_distance'], ['nearest_corpus_id'] and ['behavioural_margin']"
    compiled_test: "tests/test_output.py::test_behavioural_novelty_clears_corpus"

  - id: multi_seed_separation_clears_margin
    statement: "The mean over at least three seeds of the clipped per-seed result, less the half-spread across seeds, leaves a separation above zero, so a result indistinguishable from its own seed noise earns nothing."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_multi_seed_separation_clears_margin
    zero_reason: separation-below-noise-floor
    required: true
    weight: 5
    live_state_read: "the verifier's per-seed crossings, every one recomputed by checkers.derive_graded_step from the verifier's own evaluation series; read as ctx['seed_runs'] against ctx['anchors']"
    compiled_test: "tests/test_output.py::test_multi_seed_separation_clears_margin"

purity:
  every_checker_pure: true
  every_checker_deterministic: true
  ast_allowlist: [json, math, hashlib, pathlib, dataclasses, typing]
  ast_allowlist_note: >-
    tests/checkers.py imports nothing outside the allowlist. There is no planted
    file read, no environment-secret read, no random source, no clock read, no
    network and no import of the submission. Where a checker needs a number it
    comes from a telemetry record the verifier's own process produced.
  grader_never_imports_the_submission: >-
    tests/grade.py imports checkers, probe, corpus_rules, corpus.loader and
    runner, and never the submission. The submission runs only inside the
    subprocess tests/runner.py opens, in a fresh temporary directory holding the
    submission alone, launched as a new session leader under a five-name
    environment allowlist, with the whole process group killed in a finally
    block.
  digest_duplication_is_deliberate: >-
    checkers._probe_digest recomputes the probe transcript digest independently
    of tests/probe.py, so a producer whose own digest function moved is caught
    rather than trusted.
