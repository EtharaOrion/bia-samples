# FORGE-CANARY-END
# PRIVATE DERIVATION SOURCE for slot OER-05. Held out from the agent surface.
#
# This file is the SINGLE source from which solution/recompute.py derives every
# generated artifact in this bundle: the golden trajectory, the checker
# fixtures, solve.sh, TRUTH.md, rubrics.json and tests/test_output.py. Nothing
# generated is hand-edited, and running recompute.py twice over frozen bytes
# produces byte-identical output. recompute.py invokes no model, no network, no
# clock, no locale and no random source.

schema: forge.grounding/v1
slot: OER-05
family: F15
primary_archetype: grader-integrity

# ---------------------------------------------------------------------------
# What the archetype means here, so the derivation is checkable against intent.
# ---------------------------------------------------------------------------
archetype_reading: >-
  grader-integrity means the GRADER ITSELF is the thing under attack and the
  job is to make it unattackable rather than to assume it. The novelty gate
  compares the submitted update rule against a behavioural corpus: not a
  text-similarity check on source, but a comparison of what the rule DOES,
  measured by the verifier's own probe of the rule's behaviour on fixed inputs.
  Source-level paraphrase must not defeat it, and the comparison must be
  recomputable by anyone holding the frozen bytes.

# ---------------------------------------------------------------------------
# Solver egress divergence. Recorded here explicitly, never silent.
# ---------------------------------------------------------------------------
solver_egress_divergence:
  bound_in_this_slot: open
  contract_field: seed/contract.yaml batch.optimization_bindings.solver_egress
  contract_value: setup-only
  gap_id: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the
    solving agent full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says the
    internet is needed only for setup, and requirements/bia-environment-spec.md
    line 247 takes the stricter reading of the contradiction, which is what the
    contract field currently records.
  reading_c: >-
    the family delivery.network_policy block in the same contract binds
    agent_environment egress allowed with the upstream deny-list, which is the
    permissive reading applied at the family level.
  what_this_lane_binds: >-
    task.toml [agent] solver_egress = "open", with the upstream deny-list
    carried by name. The batch-level field is NOT amended by this lane. The
    divergence stands recorded rather than resolved, because resolving a
    batch-level singleton is the orchestrator's act and not a lane's.
  deny_list_is_not_a_containment_proof: >-
    Mirrors, caches, paraphrased write-ups and model weights all carry a recipe
    past any deny-list. That is exactly why the deterministic checker, and not
    the network policy, is the load-bearing control in this slot. The novelty
    gate is behavioural for the same reason: a recipe that arrives by any route
    still has to produce update deltas, and the deltas are what is compared.

# ---------------------------------------------------------------------------
# Anchors. ABSENT, and the schema is bound around the absence.
# ---------------------------------------------------------------------------
anchors:
  anchors_state: absent
  baseline_metric: absent
  target_metric: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  authority: >-
    requirements/bia-environment-spec.md line 63 leaves this family's baseline,
    target and instance count unresolved, and seed/contract.yaml
    batch.family_anchor_state records F15 as unmeasured.
  rule_applied: >-
    A family whose anchors are unmeasured binds the reward SCHEMA fully and
    declares the anchors absent rather than inventing them. No baseline_metric
    or target_metric number appears anywhere in this bundle as an anchor.
  graded_path_consequence: >-
    tests/grade.py refuses a telemetry record whose anchor pair is absent and
    writes 0.0 with the machine-readable reason anchor-pair-absent.

# The two numbers below are FIXTURE ARITHMETIC EXERCISERS and are NOT anchors.
# They exist so the reward arithmetic and the reward growth can be demonstrated
# against the live checkers. They are never read on the graded path, they carry
# no authority, and they are labelled at every use.
fixture_anchor_pair:
  fixture_only: true
  not_an_anchor: true
  baseline_metric: 4000
  target_metric: 2600
  why_these_two_numbers: >-
    Round, obviously synthetic, and chosen only so the seed step lists below
    land at recognisable points on the ladder. Substituting any other pair moves
    every generated fixture and moves nothing about the bundle's claims.

# ---------------------------------------------------------------------------
# The graded quantity, and the run geometry the fixtures are built on.
# ---------------------------------------------------------------------------
graded_quantity:
  metric: optimizer steps to reach the target validation loss
  direction: lower
  reduction: multi-seed mean of the clipped per-seed raw, less the half-spread
  target_loss: 3.28
  eval_interval: 100
  min_seeds: 3
  separation_margin: 0.05
  separation_behaviour: >-
    confidence = clip(separation / 0.05, 0, 1), multiplied into the magnitude.
    A continuous ramp, so nothing flips binary at the margin.
  behavioural_margin: 0.02

# The admin plane's state after the last drift mutation. Every fixture is built
# against this, so a fixture carrying a pre-mutation value is a stale control.
drift_state_final:
  corpus_pin: pinned-corpus-r1
  probe_input_set: probe-set-b
  eval_schedule: eval-every-100-steps
  sustain_window: 4
  weight_custody: harness-owned-digest-bound
  anchor_pair: absent
  grading_tree_mode: sealed-read-only

drift_state_pre_mutation:
  corpus_pin: unpinned
  probe_input_set: probe-set-a
  eval_schedule: eval-every-125-steps
  sustain_window: 2
  weight_custody: harness-owned
  anchor_pair: absent
  grading_tree_mode: read-write-staging

# ---------------------------------------------------------------------------
# Seed step lists. Every fixture's evaluation series is derived from one of
# these plus the geometry above. All values are multiples of eval_interval.
# ---------------------------------------------------------------------------
seed_step_lists:
  clean_accepting: [2600, 2500, 2600, 2500]
  partial_continuous: [2900, 3000, 2900, 3000]
  margin_ramp_continuous: [2800, 3900, 3600, 3300]
  separation_below_floor: [2800, 3900, 3700, 3400]

# ---------------------------------------------------------------------------
# The reference solution, and what its acceptance does and does not establish.
# ---------------------------------------------------------------------------
reference:
  path: solution/reference.py
  entry_point: build_update_rule
  rule_class: SignGatedMedianAnchorRule
  novelty_levers:
    - sign-agreement gating between momentum and the current gradient
    - median absolute magnitude normalization across the block, a rank statistic
    - a schedule-free trailing average toward an internal anchor
  what_acceptance_establishes: >-
    That the live checkers, driven through the real gate chain, accept THIS
    reference and reach full reward 1.0 on the clean fixture, and that its
    behavioural signature clears the pinned corpus by a real measured distance
    computed by the verifier's own probe.
  what_acceptance_does_not_establish: >-
    That the reference reaches the target loss by training. The evaluation
    series in every fixture is derived from this file, which is what makes the
    fixtures a test of the CHECKERS rather than a claim about the optimizer. No
    training run has been executed for this slot and none is claimed.

# ---------------------------------------------------------------------------
# Rubric source for solution/rubrics.json, which grades the SOLUTION against
# its reference answer. Distinct from tests/rubrics.jsonl, which judges the
# trajectory. Neither substitutes for the other.
# ---------------------------------------------------------------------------
solution_rubric_criteria:
  - id: entry-point-shape
    criterion: "solution/reference.py exposes build_update_rule(shape, hyper) returning an object with step(params, grads, state)."
    weight: 1
  - id: purity
    criterion: "The reference step is a pure function of its arguments: no clock, no random source, no environment read, no network."
    weight: 2
  - id: behavioural-novelty
    criterion: "The reference's probe signature clears every pinned corpus entry by more than the bound behavioural margin, on the probe set the admin plane names."
    weight: 3
  - id: probe-reproducibility
    criterion: "Two probe passes over the reference produce identical transcripts and identical digests."
    weight: 2
  - id: frozen-axes-untouched
    criterion: "The reference changes only the update rule, its schedule, its state initialization and its hyperparameters, and touches no frozen axis."
    weight: 2
  - id: full-reward-on-the-clean-fixture
    criterion: "Driven through the real gate chain on the clean fixture, the reference reaches exactly 1.0."
    weight: 3

# ---------------------------------------------------------------------------
# Budget accounting for seed/tasks/OER-05/feasibility.yaml.
# ---------------------------------------------------------------------------
budget:
  budget_hours: 0.12
  budget_hours_role: per-attempt completion bound
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts
  reference_hours: 0.0005
  reference_hours_basis: >-
    Wall time for the graded path on the reference solution, being one isolated
    subprocess probe run through tests/runner.py plus the twelve-checker gate
    chain over the verifier's telemetry. Measured on this host by
    seed/tasks/OER-05/adequacy.py at 0.0226 seconds and rounded UP to 0.0005
    hours, which is 1.8 seconds, so the recorded figure carries margin over the
    measurement rather than sitting on it.
  reference_hours_excludes: >-
    The training run itself. This lane executed no training run and claims none,
    so the wall clock of a full reference attempt is UNMEASURED here. Recorded
    as gap-oer-05-training-wall-clock-unmeasured rather than folded into the
    number above, because folding an unmeasured quantity into a measured one
    would make the total look measured.
  over_budget_rule: >-
    reference_hours exceeding budget_hours 0.12 is BLOCK:INFEASIBLE_OR_UNVERIFIED
    and must be said rather than rounded away.

withheld_from_the_agent_manifest:
  note: Moved out of task.toml on 2026-08-25 because Harbor mounts that manifest on the agent surface,
    so anchors and internal record ids were readable by the solving agent. This file is private and is
    never assembled onto that surface.
  lines:
  - solver_egress_divergence_gap = "gap-oer-solver-egress-ruled-stricter"
  - '# transcribed from requirements/bia-environment-spec.md lines 139 to 147.'
  - budget_hours_gap = "gap-oer-budget-field-name-collides-with-its-role"
  - budget_hours_provisional_reason = "requirements/bia-environment-spec.md line 143 names the field budget_hours
    with value 6 while line 133 gives the per-attempt bound as 7.2 minutes and line 135 says 7.2 minutes
    is the number a conforming task is designed against. 0.12 is bound here and marked provisional rather
    than 6 being silently bound into a per-attempt field."
  - separation_margin = 0.05
  - anchors_state = "absent"
  - baseline_metric = "absent"
  - target_metric = "absent"
  - pass_threshold = "absent"
  - gap = "gap-oer-per-family-anchors-unmeasured"
  - absent_reason = "requirements/bia-environment-spec.md line 63 leaves this family's baseline, target
    and instance count unresolved, and seed/contract.yaml batch.family_anchor_state records F15 as unmeasured.
    No value may be invented for them here. A family whose anchors are unmeasured binds the schema and
    declares the anchors absent."
  - frontier_defeat_floor = 0.50
  - disposition_held_by = "gap-oer-per-family-anchors-unmeasured"

manifest_conformance_normalization_2026_08_25:
  note: >-
    task.toml was rewritten on 2026-08-25 to conform to seed/harbor_lint.py, the repository's
    own authoritative manifest linter. Nothing here was deleted outright: every line the
    agent-visible manifest no longer carries is transcribed below, in this private file.
  canonical_optimization_path: metadata.optimization
  canonical_path_rationale: >-
    seed/harbor_lint.py rejects every unknown TOP-LEVEL key as one Harbor would silently drop,
    so a top-level [optimization] table cannot be used. [metadata] is the one table Harbor
    hands through as dict[str, Any], so [metadata.optimization] is the only path that is both
    a single deterministic lookup and survives the linter. All 24 slots now use it.
  previous_optimization_path_in_this_slot: 'bindings.*'
  bound_values_preserved_verbatim:
    max_timeout_hours: '6.0 (session bound across attempts)'
    budget_hours: '0.12 (per-attempt bound, 7.2 minutes; never an alias of max_timeout_hours)'
    max_attempts: '50'
    final_selection: 'best'
    budget_envelope: 'one H100, single accelerator, no multi-GPU scaling'
    budget_margin: '10 percent'
    tags: '["optimization", "bounded-continuous"], under the key `tags` at metadata.tags'
    agent: 'solver_egress = "setup-only", network_mode = "none"'
    environment: 'network_mode = "public" (provisioning; never blanket-denied)'
    verifier: 'egress = "denied"'
    docker_image: 'pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407'
  withheld_from_the_agent_manifest_on_this_pass:
    reason: >-
      task.toml is mounted on the agent surface. Harness-internal paths, internal record ids
      and reward-scale literals are readable there by the solving agent, so they are held here.
    lines:
    - '# Transcribed from seed/contract.yaml batch.optimization_bindings, itself Copied here, never recomputed.'
    - '[agent] solver_egress_divergence = "seed/contract.yaml batch.optimization_bindings.solver_egress reads setup-only. This manifest binds open. The divergence is recorded in solution/grounding.yaml under solver_egress_divergence and is not silent."'

