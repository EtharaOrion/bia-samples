schema: forge.grounding/v1
# The single private derivation source for this slot. solution/recompute.py derives the
# golden trajectory, the checker fixtures, solve.sh, TRUTH.md, rubrics.json and
# tests/test_output.py from this file and from nothing else. No model, no network, no
# clock, no locale and no random source is reachable from that derivation, and running
# it twice over frozen bytes produces byte-identical output. `recompute.py --check`
# regenerates in memory and exits non-zero on any drift.

slot: OER-17
provisional_identifier: OER-17
family: F14
family_title: synthetic data generation
archetype: grader-integrity
title: Generator graded on a real held-out benchmark it must not touch
metric: held-out benchmark score of a model trained on the agent's generated data
direction: higher
frozen: the training budget, the model, the optimizer, the held-out benchmark
free: the synthetic data generator the agent writes

identity_note: >-
  No canonical_content_hash, no uuid5, no final uuid directory name, no canary token, no
  provenance carrier and no signature file is produced by this lane. The provisional
  identifier is the slot id. Wave 2 does identity for every slot at once, because adding
  solution/policy.yaml to an already-committed bundle moves its hash too.

solver_egress_divergence:
  bound_here: open
  bound_in_contract: setup-only
  contract_path: seed/contract.yaml batch.optimization_bindings.solver_egress
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving
    agent full internet access.
  reading_b: >-
    the same document line 122 says internet is needed only for setup, and
    requirements/bia-environment-spec.md line 247 takes the stricter reading, which is
    what the contract field records.
  resolution_here: >-
    task.toml binds [agent] solver_egress = "open" with the upstream deny-list, and
    [verifier] egress = "denied". The family delivery.network_policy block in the same
    contract binds agent_environment egress allowed with that deny-list, so the open
    reading is the one this bundle is built against. This lane does NOT amend the
    batch-level field; the divergence is recorded here and stays visible.
  deny_list_is_not_containment: >-
    ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"] is a
    deny-list, not a containment proof. Mirrors, caches, paraphrased write-ups and model
    weights all carry a recipe past any deny-list, which is exactly why the deterministic
    near-duplicate screen in tests/checkers.py is the load-bearing control and the network
    policy is not.

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  authority: seed/contract.yaml families.entries.F14 carries scope null and scope_state unscoped
  never_invented: >-
    No baseline_metric or target_metric number is authored anywhere in this bundle. The
    reward schema is fully bound and the pair is declared absent.
  fixture_anchors:
    used_by: seed/tasks/OER-17/adequacy.py only
    baseline_metric: 0.20
    target_metric: 0.90
    role: >-
      These two numbers exist so the reward FUNCTION and the gate chain can be exercised
      end to end to a full 1.0 on the reference. They are declared inside the fixture, are
      never read from tests/checkers.yaml, and are not this family's anchors. The
      substitution is recorded in tests/checkers.yaml and in feasibility.yaml.

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: capped below Hard
  perception_axis_exemption: >-
    This task family is text and code only, so the Perception axis carries no category. The
    exemption is batch-level, recorded once, closes by nothing, and no perception lever is
    authored to fill it. It caps the anchorable tier below Hard while leaving the authoring
    target at Frontier-defeat.
  frontier_defeat_floor: 0.50
  separation_margin: 0.05

bindings:
  tags: [optimization, bounded-continuous]
  image: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts
