  submission_path: /workspace/submission/generator.py
  strategy: >-
    Enumerate every ordered conversion pair inside each dimension and emit one sample per
    pair per value on a grid of the generator's own choosing. Coverage plus internal
    consistency is what the frozen model can learn; no benchmark item is needed, seen or
    approximated.
  value_grid: [2, 3, 5, 6, 8, 9]
  emitted_samples: 144
  covered_pairs: 24

