schema_version = "1.4"

# OER-04, provisional identifier. Slot id is the identifier for wave 1; no uuid,
# no canonical content hash and no provenance carrier is derived here.
#
# Harbor's TaskConfig sets no model_config, so pydantic's extra="ignore" default
# silently discards an unknown or misspelled top-level key. Every field below is
# either a Harbor field or lives inside a table Harbor hands through untouched.

multi_step_reward_strategy = "last"

artifacts = [
  "/workspace/submission/shape.json",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-04-significance-unproven-at-the-seed-ceiling"
version = "1.0.0"
description = """
Choose the architecture shape -- depth, residual width, head width and MLP ratio --
that reaches the lowest validation loss at a fixed token budget and inside a hard
parameter band. The computation, the optimizer, the schedule, the token stream and
the initialisation seed are all frozen; only the shape those frozen operations are
instantiated at is free. The verifier trains the control shape TWICE and reports the
spread between the two runs as that run's repeatability floor. A submission whose
advantage over the control is smaller than that floor resolves to a recorded
unproven state, which is neither a pass nor a failure.
"""
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "architecture-search"]

[metadata]
category = "optimization"
tags = ["optimization", "bounded-continuous"]
family = "F1"
family_title = "nanogpt optimizer speedrun"
slot = "OER-04"
provisional_identifier = "OER-04"
batch = "OER-2026-08-20"
title = "Architecture shape at a fixed parameter budget"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

# --- graded quantity
metric = "validation cross-entropy in nats on the verifier's held-out FineWeb slice"
metric_direction = "lower"
reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary, full reward exactly 1.0"
reward_formula = "raw = (control_loss - agent_loss) / (control_loss - reference_loss); score = min(max(raw, 0.0), 1.0)"

# --- frozen and free axes
frozen_axes = "the computation itself, the token stream, the token budget, the number of optimizer steps, the optimizer, the learning-rate schedule, the initialisation seed, the evaluation window and the parameter band"
free_axes = "num_layers, model_dim, head_dim, mlp_ratio"

# --- tier
target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_note = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."
primary_archetype = "AR7"
primary_archetype_title = "Ambiguous Intermediate States"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."

# The graded path is FOUR from-scratch training runs plus four evaluations. The
# number below is MEASURED, not declared: see solution/grounding.md.
graded_path_seconds_measured = 560
graded_path_seconds_budget = 1200

[metadata.ambiguous_intermediate_state]
name = "separation-unproven-at-the-repeatability-floor"
established_by = "training the control shape twice on the grading run and taking the spread between the two validation losses"
provenance = "measured on every grading run; never a stored constant"
resolution = "recorded, not resolved. The reward is exactly what the measurement says -- nothing is rounded, scaled or suppressed -- and the reason field carries the fact that the result is neither a demonstrated improvement nor a demonstrated failure."
note = "Two runs of the SAME shape start from identical tensors under the frozen seed and consume the identical token stream. What separates them is only the order the accelerator happened to reduce in, which is a real and non-zero effect on this hardware because the embedding and cross-entropy backward passes accumulate with atomics."

[metadata.anchors]
state = "absent-by-design"
authority = "No literal for either endpoint appears anywhere in this bundle. Both are MEASURED on every grading run by real from-scratch training runs inside the verifier: the control by retraining the shipped environment/default_shape.json, the reference by training tests/private/reference_shape.json, which is staged only into the verifier image. If either anchor fails to produce a finite loss the run refuses at 0.0 with reason anchor-diverged, and if the two coincide it refuses with calibration-span-nonpositive. Neither path substitutes a stored value."
computed_on = "the frozen held-out split, from harness-owned weights, at the bound evaluation point"
never_from = [
  "a number the training loop reported",
  "a number in the submission's stdout",
  "a field the submission wrote",
]

[metadata.parameter_band]
min = 48000000
max = 50600000
decided_by = "counting the parameters of the INSTANTIATED model"
note = "No formula in the bundle and no number in a submission is trusted for band membership. The verifier builds the shape on CPU, counts its tensors and refuses outside the band before any training is paid for."

[metadata.reward]
kind = "single float"
interval = "[0.0, 1.0]"
direction = "higher is better"
binary = false
full_reward = 1.0
carrier = "/logs/verifier/reward.txt"
reason_carrier = "/logs/verifier/score.json"
zero_carries_reason = true

[metadata.hygiene]
note = """
Schema and band validation is a GATE, not a grade. shape_schema.py answers one
question -- is this a well-formed shape inside the declared bounds -- and a failure
REFUSES the run at 0.0 with a machine-readable reason. It never scales the float and
never contributes a partial credit.
"""
refusal_reasons = [
  "submission-absent",
  "shape-unreadable",
  "shape-not-an-object",
  "shape-key-unknown",
  "shape-key-missing",
  "shape-schema-unrecognised",
  "shape-value-not-an-integer",
  "shape-value-out-of-bounds",
  "shape-model-dim-not-a-multiple",
  "shape-head-dim-not-allowed",
  "shape-mlp-ratio-not-allowed",
  "shape-heads-not-integral",
  "shape-too-few-heads",
  "shape-under-parameter-band",
  "shape-over-parameter-band",
  "shape-not-instantiable",
  "accelerator-absent",
  "verifier-substrate-unavailable",
  "verifier-anchor-invalid",
  "anchor-run-failed",
  "anchor-diverged",
  "calibration-span-nonpositive",
  "agent-run-failed",
  "agent-diverged",
  "grading-chain-failed",
  "grading-timed-out",
  "grading-killed",
]

[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.5
budget_hours_role = "per-attempt completion bound"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = 10.0
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 32768
gpus = 1
gpu_types = ["H100"]
workdir = "/app"
build_timeout_sec = 3600
network_mode = "public"

[agent]
submission_path = "/workspace/submission/shape.json"
entry_point = "solution/solve.sh"
network_mode = "none"
note = """
The corpus and every dependency are staged at image build, so the solving agent
needs no run-time egress. /workspace is the only path shared with the verifier.
"""

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
reward_kind = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
never_imports_submission = true
note = """
The submission is a JSON declaration of four integers. The verifier parses it,
bounds-checks it, instantiates it and trains it. No code from the agent surface is
imported or executed here, and no number the submission reports about itself is read.
"""

[solution]
oracle = "solution/reference.py"
entry = "solution/solve.sh"
grounding = "solution/grounding.md"
note = """
The oracle installs a shape that was derived by a search over this exact substrate
during authoring. It is NOT the verifier's private reference shape: the two were
arrived at separately and differ, so the reference arm of the gate is never the
reference shape being graded against itself.
"""
