# OER-18, family F14 synthetic data generation, primary archetype AR8.
# schema_version is a top-level scalar and must stay above the first table header: TOML
# scopes every key to the most recent header, so an assignment written after [task] becomes
# task.schema_version and the top-level scalar goes absent while the file still reads right.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "oer-18-generator-that-asserts-coverage-its-samples-do-not-carry"
version = "1.0.0"
description = "Raise the held-out benchmark score where the coverage of the generated set is measured from the samples themselves, so a generator that describes a skill distribution it did not produce is graded on the distribution it produced."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "hallucination-override"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-18"
provisional_identifier = "OER-18"
identity_note = "This slot is staged under its slot id. No canonical content hash, no uuid5 and no uuid directory name is derived here; wave 2 does identity for every slot at once."
family = "F14"
family_title = "synthetic data generation"
primary_archetype = "AR8"
primary_archetype_title = "Language Hallucination Override"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."
title = "Generator that asserts coverage its samples do not carry"
frozen = "the training budget, the model, the optimizer, and the held-out benchmark"
free = "the synthetic data generator the agent writes"
schema_version_pin_note = "1.4 is the tested pin, established on recorded verifier-written reward files rather than on repetition across manifests."

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.metric]
name = "held-out benchmark score of a model trained on the agent's generated data"
direction = "higher"
units = "accuracy on the frozen held-out benchmark, in [0, 1]"
computed_by = "the verifier, inside its own process, from harness-owned model state at the bound evaluation point"
never_read_from = "the submission's stdout, the submission's run record, or any field the submission wrote"

[metadata.reward]
schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
carrier = "/logs/verifier/reward.txt"
carrier_shape = "one bare float"
reason_carrier = "/logs/verifier/score.json"
formula = "raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
# MEASURED CORRECTION, wave-11, under trinity/FORGE.md Phase 1 item 2b: "bind the
# reward schema and the exact `full reward` value ... Harbor defines no reward
# default, so an unbound schema makes full reward and Phase 2 oracle measurement
# undefined." This key held the prose string
#   "exactly 1.0. Reaching the target scores 1.0 and beating it also scores 1.0; the
#    target is a bar, not a point on a gradient."
# A sentence is not a bound value. A Phase 2 oracle drive over these bytes read
# bound_full_reward = null at binding tier `unbound`, because no numeric full-reward
# key exists anywhere in this manifest and the prose carries the numeral inside a
# sentence no parser is required to read. The sentence is retained verbatim below as
# full_reward_rule; the number it always meant is now bound as a float.
#
# 1.0 is DERIVED from this bundle's own bytes, never authored here:
#   solution/grounding.yaml anchors.schema_bound_in_full - "full reward exactly 1.0"
#   tests/grade.py REWARD_CEILING = 1.0, applied by normalize_reward
# The interval is the clip in tests/grade.py::normalize_reward.
#
# baseline_metric and target_metric stay absent under
# gap-oer-per-family-anchors-unmeasured and neither is invented here. This binds the
# ceiling of the reward scale, not the anchors that place a run on it.
full_reward = 1.0
full_reward_rule = "exactly 1.0. Reaching the target scores 1.0 and beating it also scores 1.0; the target is a bar, not a point on a gradient."
full_reward_derivation = "solution/grounding.yaml anchors.schema_bound_in_full and tests/grade.py REWARD_CEILING; not authored in this manifest"
reward_interval = [0.0, 1.0]
reward_is_binary = false
aggregation_rule = "best over attempts, exactly as metadata.optimization.final_selection binds it. One attempt produces one float and the session score is the maximum over the attempts metadata.optimization.max_attempts bounds; there is no per-turn averaging."
zero_attribution = "every zero carries a machine-readable kebab-case reason in the score document"

[metadata.anchors]
state = "absent"
reason = "This family is unscoped and records baseline, target, pass threshold and instance count as unresolved. The reward schema above is bound in full; the two numbers it consumes are not, and no value is invented here."
runtime_carrier = "/logs/verifier/anchors.json"
unbound_behaviour = "reward 0.0 with reason anchors-unbound, with the measured benchmark score still recorded in the metric block"

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are explicitly distinct and never aliases:
# the first bounds the session across attempts, the second bounds one attempt,
# being six hours over fifty attempts, 0.12 hours or 7.2 minutes.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.12
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 50
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest"
image_pin_rule = "pinned by @sha256, never a floating tag"
substrate = ["environment/train_stack.py", "environment/dev_benchmark.json"]

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_deny_is_not_containment = "The deny-list is not a containment proof. Mirrors, caches, paraphrased write-ups and released model weights all carry a recipe past any deny-list, which is why the load-bearing control is the deterministic verifier-owned classifier and the harness-owned measurement."
submission_entry = "generator.py"
submission_artifacts = ["corpus.jsonl", "coverage_manifest.json", "run.json"]
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
checker_manifest = "tests/checkers.yaml"
imports_submission = false
isolation = "tests/runner.py copies the submission alone into a fresh temporary directory, launches it as a new session leader under a small environment allowlist, and kills the whole process group in a finally block"
