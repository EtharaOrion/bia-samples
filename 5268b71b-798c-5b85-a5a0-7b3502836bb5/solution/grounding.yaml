schema: forge.grounding/v1
slot: OER-01
provisional_identifier: OER-01
provisional_identifier_note: >-
  Wave 1 stages every slot under its slot id. No canonical_content_hash is
  computed here, no uuid5 is derived here, no dataset/<uuid>/ directory is created
  here, no canary is planted, no provenance carrier is written and no signature is
  emitted. Wave 2 does identity for every slot at once, because adding
  solution/policy.yaml to an already-committed bundle moves its hash.

family: F1
family_axis: modded-nanogpt track 3, optimizer-only
primary_archetype: record-displacement
primary_archetype_exclusivity: >-
  Exactly one archetype governs this slot. No second archetype is mixed in. The
  record-displacement control is the deterministic algorithm fingerprint screen and
  nothing else in this bundle is presented as that control.

title: Optimizer recipe displacement against the pinned track-3 record corpus

objective_verbatim_from_the_approved_contract: >-
  Reach the target validation loss in fewer optimizer steps than the bound baseline
  without replaying a recipe already present in the published record corpus, where
  the algorithm fingerprint check runs before any seed executes so a replay is
  rejected at zero accelerator cost.

# ---------------------------------------------------------------------------
# Metric and anchors. Transcribed, never recomputed, never ambitious.
# ---------------------------------------------------------------------------

metric:
  name: optimizer steps to reach the target validation loss
  unit: optimizer steps, integer
  direction: lower is better
  target_validation_loss: 3.28

anchors_state: measured
anchor_authority: requirements/bia-environment-spec.md lines 297 to 321
baseline_metric: 3250
baseline_identity: >-
  upstream record 36, tuned Muon with aux AdamW, validation loss 3.2787 at n=10,
  stat-verified, 2026-06-11. Recorded as 3250 nominal by the anchor authority.
target_metric: 2690
target_identity: >-
  upstream record 46, the current world record, validation loss 3.2783 at n=8,
  stat-verified, 2026-06-19.
pass_threshold: 0.65
pass_threshold_note: >-
  0.65 corresponds to 2886 steps at the nominal baseline, per the anchor authority.
  It is a session-level bar carried by name and is not authored here.

frozen_axes:
  dataset: frozen by upstream rule
  batch_size: frozen by upstream rule
  architecture: frozen by upstream rule
  passes_per_step: exactly one forward-backward pass per optimizer step
free_axes:
  - optimization algorithm
  - hyperparameters and their schedules
  - model initialization

reward:
  kind: single float
  interval: closed, 0.0 to 1.0
  direction: higher is better
  binary: false
  formula: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
  clip: "score = min(max(raw, 0.0), 1.0)"
  full_reward_value: 1.0
  full_reward_rule: >-
    Reaching the target scores exactly 1.0 and beating it also scores 1.0. The
    target is a bar, not a point on a gradient.
  every_zero_carries_a_machine_readable_reason: true

