# ---------------------------------------------------------------------------
# The reference solution. A derivation, not a recital.
# ---------------------------------------------------------------------------

reference:
  path: solution/reference.py
  entry_point: solution/solve.sh
  derivation: >-
    The reference keeps the orthogonalised-momentum family that record 36 and
    record 46 both sit in, and changes what is coupled rather than which primitives
    appear. Two changes carry it. First, the per-layer RMS rescale is replaced by a
    spectral trust region whose radius follows a two-phase schedule, so the early
    steps are allowed a larger effective step while the late steps are bounded by a
    running spectral-norm estimate rather than by a fixed constant. Second, the
    auxiliary AdamW group shares one second-moment estimator with the hidden-matrix
    group instead of maintaining its own, which removes the aux group's independent
    scale drift and lets a single learning-rate schedule govern both. The
    initialisation is depth-scaled orthogonal rather than the framework default, so
    the trust region starts from a known spectral radius instead of an empirical
    one.
  why_it_is_not_a_replay: >-
    Its structural digest differs from every entry in the pinned corpus, because
    the update chain contains spectral_trust_region where every corpus entry
    contains rms_rescale or soap_preconditioner, and because the coupling
    shared_second_moment appears in no corpus entry. The screen therefore clears it
    on the structural comparison alone, before proximity is consulted.
  collision_with_record_47_is_deliberate_and_recorded: >-
    record-47 above, accepted after the pin, carries the same structural digest as
    the reference. That is the point of the silent corpus-revision mutation: an
    agent that cleared the screen under revision r46 and carries that clearance
    forward is graded against revision r47 and is refused. The reference in this
    bundle is graded against the r46 pin, which is the revision the golden
    trajectory was produced under, and the drift schedule records the move.
  recipe:
    update_chain:
      - {primitive: heavy_ball_momentum, role: hidden_matrices}
      - {primitive: newton_schulz_orthogonalisation, role: hidden_matrices}
      - {primitive: spectral_trust_region, role: hidden_matrices}
      - {primitive: adamw, role: aux_group}
    couplings:
      - [hidden_matrices, aux_group, shared_second_moment]
    schedule_families:
      - [lr, cosine_then_linear]
      - [momentum, linear_ramp]
      - [trust_region_rho, two_phase]
    init_family: depth_scaled_orthogonal
    hyper:
      lr_peak: 0.038
      momentum: 0.945
      second_moment_beta: 0.96
      weight_decay: 0.0
      warmup_frac: 0.02
      orthogonalisation_steps: 5
      trust_region_rho: 1.35
      aux_lr_ratio: 0.0045

