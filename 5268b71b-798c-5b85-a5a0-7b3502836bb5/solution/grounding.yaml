withheld_from_the_agent_instruction:
  note: >-
    APPEND-ONLY preservation record. Moved out of the agent-visible carriers named below on
    2026-08-25 because they published both endpoints of the reward function. The reward is
    raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric), so naming both
    endpoints names the exact agent_metric that scores 1.0. FORGE.md item 11: answers,
    derivations, drift schedules, checker secrets and pilot keys must never be agent-visible.
    Nothing is deleted; the values live here, and this file is never assembled onto the agent
    surface.
  removed_on: 2026-08-25
  leak_class: graded-endpoint-published-on-agent-surface
  carriers:
    - carrier: instruction.md
      at: "line 109 to 112, section Scoring"
      verbatim_removed:
        - '`reward = min(max((3250 - agent_metric) / (3250 - 2690), 0.0), 1.0)`'
        - 'The baseline is 3250 steps and the target is 2690 steps. Reaching 2690 scores exactly 1.0;'
      values:
        baseline_metric: 3250
        target_metric: 2690
        anchor_gap: 560
      replaced_by: >-
        The same formula written over the symbols baseline_metric and target_metric, with an
        explicit statement that both are verifier-held and unpublished, plus the reward SHAPE
        the agent may legitimately plan against: continuous, monotone in the graded step at a
        constant rate, saturating at 1.0 once the target is reached.
    - carrier: environment/train_baseline.py
      at: "module docstring, line 10"
      verbatim_removed:
        - 'the bound baseline anchor at 3250 steps'
      values:
        baseline_metric: 3250
      replaced_by: >-
        Prose that keeps the recipe's provenance and its measurable-by-running role but no longer
        binds the name "baseline anchor" to a number. The executable default remains 3250 because
        it is the handed script's own schedule length, which the agent can read and reproduce
        directly and which alone does not locate the reward ceiling.
  retained_deliberately:
    - value: 3250
      where: "environment/train_baseline.py executable default"
      why: >-
        Operational constant of code the agent is handed and invited to run. It is the baseline
        the agent measures against, not a graded endpoint, and knowing it without target_metric
        does not reveal the metric that scores 1.0.

