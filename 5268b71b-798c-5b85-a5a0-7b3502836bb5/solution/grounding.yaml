# ---------------------------------------------------------------------------
# Solver egress asymmetry and the divergence it carries.
# ---------------------------------------------------------------------------

solver_egress_divergence:
  bound_in_task_toml: open
  contract_field_reads: setup-only
  gap_id: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the
    solving model full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says
    internet is needed only for setup.
  ruling: >-
    requirements/bia-environment-spec.md line 247 takes the stricter reading, which
    is why seed/contract.yaml batch.optimization_bindings.solver_egress reads
    setup-only. The same contract's family delivery.network_policy block binds
    agent_environment egress allowed with the upstream deny-list.
  bound_here: >-
    This slot binds solver_egress = "open" at the agent surface and egress =
    "denied" at the verifier surface, both as bytes in task.toml. The batch-level
    field is NOT amended by this lane; the divergence is recorded here instead, and
    the orchestrator owns any reconciliation.
  deny_list_is_not_a_containment_proof: >-
    The deny-list names github.com, raw.githubusercontent.com and
    objects.githubusercontent.com. It is not the control. Mirrors, package caches,
    paraphrased write-ups, forum posts and model weights all carry a record recipe
    past any deny-list, and the model doing the solving may simply remember one. A
    network denial therefore proves nothing about whether a submitted recipe is a
    replay. The load-bearing control is the deterministic algorithm fingerprint
    screen in tests/fingerprint.py, checked against the pinned exclusion set in
    tests/corpus.json before any seed executes, so a replay is rejected at zero
    accelerator cost. Network policy is a cost and hygiene measure and is never
    presented in this bundle as the record-displacement control.

# ---------------------------------------------------------------------------
# The design obligation: grade the quantity, never the readout.
# ---------------------------------------------------------------------------

readout_manipulation_obligation:
  finding: >-
    An audit lane found that upstream track-3 has accepted records whose entire
    gain is readout manipulation: EMA-blending the reported validation loss so a
    noisy dip reads as a crossing, and early-stopping on a favourable evaluation.
  closure:
    - id: verifier-computes-the-crossing
      rule: >-
        The graded step is the first step at which the VERIFIER'S OWN evaluation of
        the model on the frozen held-out split falls below 3.28. It is never a
        number the training loop reported, never a number in the submission's
        stdout, and never a field the submission wrote.
      checker: graded_loss_recomputed_unsmoothed_by_verifier
    - id: no-smoothing-on-the-graded-path
      rule: >-
        The graded readout is the raw evaluation at that step. A submission may
        smooth its own reported loss for its own use; the graded quantity is
        recomputed unsmoothed by the verifier.
      checker: graded_loss_recomputed_unsmoothed_by_verifier
      reduction: VALUE
    - id: crossing-must-be-sustained
      rule: >-
        A single favourable evaluation is not a crossing. The target must hold at
        the graded step and at every one of the next sustain_window_points
        evaluation points the VERIFIER schedules.
      checker: crossing_sustained_across_verifier_scheduled_points
      reduction: INVARIANT
    - id: early-stop-is-not-a-crossing
      rule: >-
        A run that halts at a favourable evaluation without the sustained condition
        is graded as not having crossed and scores zero with a machine-readable
        reason, never as an absent result.
      checker: no_early_stop_before_the_sustain_window_closed
      reduction: ABSENCE
    - id: weights-come-from-the-model-the-harness-owns
      rule: >-
        The weights evaluated at every graded point are the harness-written
        checkpoint for that step, not a checkpoint the submission selected.
      checker: graded_weights_are_harness_owned_at_the_graded_step
      reduction: VALUE
  stated_to_the_agent: >-
    instruction.md states in plain words what quantity is graded, so the agent
    optimizes the graded quantity rather than discovering it. This is a design
    obligation and never appears anywhere in this bundle as a difficulty argument.

# ---------------------------------------------------------------------------
# The record-displacement control.
# ---------------------------------------------------------------------------

fingerprint_control:
  what_it_is: >-
    A deterministic canonicalisation of the submitted declarative update rule into
    a structural fingerprint plus a log-quantised hyperparameter vector, compared
    against a pinned exclusion set of published track-3 record recipes.
  when_it_runs: >-
    Before any seed executes. The screen is telemetry sequence 0 and the harness
    records accelerator_seconds_spent_before = 0.0 at that point, so a replay costs
    zero accelerator time. The ORDERING checker grades exactly that.
  why_it_is_not_a_deny_list: see solver_egress_divergence.deny_list_is_not_a_containment_proof
  canonical_form:
    update_chain: ordered list of (primitive, role) pairs, order taken from the recipe
    couplings: sorted list of (source, target, kind) triples
    schedule_families: sorted list of (parameter, family) pairs
    init_family: one string
    excluded_from_the_structural_digest: every numeric hyperparameter value
  structural_digest: sha256 over the canonical JSON of the four fields above, first 32 hex characters
  proximity:
    keys: [lr_peak, momentum, second_moment_beta, weight_decay, warmup_frac, orthogonalisation_steps, trust_region_rho, aux_lr_ratio]
    quantisation: "bucket(v) = floor(4 * log10(max(v, 1e-9)) + 40) for v > 0, and -1 for v <= 0"
    distance: "mean over the key list of min(1.0, abs(bucket_a - bucket_b) / 8.0); a key absent on either side contributes 1.0"
  proximity_floor: 0.15
  proximity_floor_rationale: >-
    The floor exists so cosmetic hyperparameter jitter cannot dodge the screen. A
    submission whose structural digest equals a corpus entry's AND whose quantised
    hyperparameter vector sits within 0.15 of that entry is a replay. Above the
    floor the structural match alone is not treated as a replay, because two
    genuinely different operating points on the same algebra are a legitimate
    derivation rather than a recital. The floor is a bound value of this slot and
    is stated here rather than tuned against outcomes.
  exclusion_rule: >-
    replay iff (structural_digest == entry.structural_digest) AND (proximity <= 0.15)
  what_it_does_not_establish: >-
    It does not establish that the submitted recipe is novel in the literature, and
    it does not establish that the agent did not read a record. It establishes that
    the submitted update rule is not, up to the bound proximity floor, one of the
    recipes in the pinned corpus. That is the whole of the claim.

