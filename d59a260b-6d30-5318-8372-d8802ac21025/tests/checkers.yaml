# Declared graded surface for slot OER-03.
#
# Every checker below reduces to EXACTLY ONE of the six closed kinds, names the
# reachable carrier that reaches it, names the selector inside tests/checkers.py
# that implements it, and names the machine-readable reason that carrier emits
# when it scores zero. A checker reducing to none, or to two, is invalid.
#
# Every checker is pure and deterministic and reads live state through real
# harness handles only: the verifier-owned run directory tests/runner.py created,
# the harness-owned weight ledger the pinned harness wrote inside it, the
# verifier's own unsmoothed evaluation of those states on the frozen held-out
# split, and the process-group exit record the runner captured. No checker reads
# a planted file, an environment secret, a random source, a clock or the network,
# and none imports the submission. tests/checkers.py imports json, math, hashlib,
# pathlib, dataclasses and typing and nothing else.
#
# The centre of this manifest is the readout obligation. The graded step is the
# crossing the VERIFIER recomputes, unsmoothed, sustained across evaluation
# points the verifier itself schedules. A schedule extended past the crossing
# buys nothing. A run that never sustains a crossing is graded a failure with a
# reason, never reported as an absent result.

schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

# seed/forge/verifier.py binds the runtime reward carrier at
# /logs/verifier/reward.txt and audits this bundle against exactly that string.
# The lane brief binds the attributed document at /logs/verifier/reward.json.
# tests/test.sh writes BOTH on every exit path, so neither contract is dropped.
# Declared in solution/grounding.yaml under gap-oer-03-reward-path-name-collides.
reward_path: /logs/verifier/reward.txt
reward_document_path: /logs/verifier/reward.json
score_document_path: /logs/verifier/score.json

anchors:
  state: measured
  baseline_metric: 3250
  target_metric: 2690
  direction: lower
  pass_threshold: 0.65
  authority: requirements/bia-environment-spec.md lines 297 to 321

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py runs the ten checkers below in the declared order and stops at
    the first failure, emitting exactly that checker's zero_reason with a reward
    of 0.0. Every checker is required, so the gate is a universal quantifier over
    a non-empty required set, which is what required_pass names. When the gate
    opens, the reward is NOT the constant 1.0 that a bare required_pass would
    imply: it is the bounded-continuous normalization
    (baseline_metric - graded_step) / (baseline_metric - target_metric), clipped
    to [0.0, 1.0]. required_pass therefore describes the gate this file declares,
    and the continuous score is the quantity the gate opens onto. Both halves are
    stated because naming only one of them would misdescribe what grade.py does.

gate_order_rationale: >-
  The grading-path obligation is checked FIRST, before anything about the run, so
  a defective outcome document can never hide behind a failing run. That ordering
  is what makes this slot's archetype apply to its own grader.

checkers:
  - id: non_convergence_graded_as_failure_with_a_reason
    statement: "The set of grading routes that emit an outcome for a non-converging run without an explicit graded_step key, without a verifier-recomputed basis, or without a machine-readable reason is empty."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: absence_of_ungraded_non_convergence
    zero_reason: non-convergence-ungraded
    required: true
    weight: 3
    live_state_read: "the outcome document tests/grade.py derived in its own process from the verifier's evaluation series, read back before any reward is written"
    compiled_test: "tests/test_output.py::test_non_convergence_graded_as_failure_with_a_reason"
    adequacy_substitution: >-
      No submission can fire this checker, because the outcome document is
      produced inside the verifier's own process and an isolation boundary keeps
      submission bytes out of it. Its rejecting half is therefore carried on a
      planted fixture, fx-non-convergence-ungraded, which supplies a defective
      outcome document directly. Recorded here and in seed/tasks/OER-03/feasibility.yaml
      rather than papered over.

  - id: run_produced_verifier_owned_state
    statement: "Launching the submission out-of-process changed live state the verifier owns: a terminal run status, a positive observed optimizer-step count, and at least one evaluation carrying a harness weight digest."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: run_produced_verifier_owned_state
    zero_reason: run-produced-no-verifier-state
    required: true
    weight: 2
    live_state_read: "the process-group exit record tests/runner.py captured, and the harness_weight_ledger.json the pinned harness wrote into the verifier-owned run directory"
    compiled_test: "tests/test_output.py::test_run_produced_verifier_owned_state"

  - id: frozen_axes_held
    statement: "Dataset, batch size, architecture and the one-forward-backward-pass-per-step rule are the bound values, so a gain bought by moving a frozen axis is refused before it is scored."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: frozen_axes_held
    zero_reason: frozen-axis-moved
    required: true
    weight: 2
    live_state_read: "the frozen_axes block the pinned harness recorded into harness_weight_ledger.json during the run, compared against the bound values in tests/golden.json"
    compiled_test: "tests/test_output.py::test_frozen_axes_held"

  - id: evaluated_weights_owned_by_the_harness
    statement: "Every state the verifier evaluated is the state the run produced at that step, sourced from the harness and reproducing under the bound weights digest domain, so no checkpoint the submission selected is ever graded."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: evaluated_weights_owned_by_the_harness
    zero_reason: weights-not-harness-owned
    required: true
    weight: 3
    live_state_read: "the per-step parameter digest the harness wrote into harness_weight_ledger.json, rebound by the verifier under the bound weights_digest_domain and compared with the digest attached to each evaluation the verifier performed"
    compiled_test: "tests/test_output.py::test_evaluated_weights_owned_by_the_harness"

  - id: evaluation_points_ascend_on_the_verifier_schedule
    statement: "Every graded evaluation point was scheduled by the verifier, sits on the verifier's bound stride, and follows the previous one, so the evaluation cadence is never a submission choice."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: evaluation_points_ascend_on_the_verifier_schedule
    zero_reason: evaluation-order-violated
    required: true
    weight: 2
    live_state_read: "the ordered step keys of the evaluation series the verifier produced for itself, bounded against the eval_stride in tests/golden.json"
    compiled_test: "tests/test_output.py::test_evaluation_points_ascend_on_the_verifier_schedule"

  - id: graded_readout_unsmoothed
    statement: "Every readout on the graded path is the raw verifier evaluation, so an EMA-blended, averaged or otherwise filtered loss cannot become the graded quantity."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: graded_readout_unsmoothed
    zero_reason: readout-smoothed
    required: true
    weight: 3
    live_state_read: "the filter label the verifier stamped on each loss it computed itself, bounded against readout_filter_admitted in tests/golden.json"
    compiled_test: "tests/test_output.py::test_graded_readout_unsmoothed"

  - id: early_stop_is_not_a_crossing
    statement: "A run that dipped below the bar executed enough further optimizer steps for the verifier's sustain window to exist, so halting at a favourable evaluation produces a graded failure with a reason rather than a crossing."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: early_stop_is_not_a_crossing
    zero_reason: early-stop-without-sustained-crossing
    required: true
    weight: 3
    live_state_read: "the steps_executed count the pinned harness recorded and the stopped_by classification tests/runner.py derived from the process-group exit, against the first below-bar step in the verifier's own evaluation series"
    compiled_test: "tests/test_output.py::test_early_stop_is_not_a_crossing"

  - id: crossing_sustained_across_verifier_evaluations
    statement: "The target holds at the graded step and at each of the bound number of subsequent verifier-scheduled evaluation points, so a single noise dip is never harvested as a crossing."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: crossing_sustained_across_verifier_evaluations
    zero_reason: crossing-not-sustained
    required: true
    weight: 4
    live_state_read: "the verifier's own unsmoothed loss at the candidate step and at the following sustain_points grid points, bounded against target_loss in tests/golden.json"
    compiled_test: "tests/test_output.py::test_crossing_sustained_across_verifier_evaluations"
    count_predicate: "count(evaluation_points_measured) > 0"
    basis: measured

  - id: graded_step_is_the_crossing_not_the_schedule
    statement: "The graded step equals the crossing the verifier recomputes from its own evaluation series and the bound bar, is never past the steps the runner observed, and is never the schedule length standing in for a crossing."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: graded_step_is_the_crossing_not_the_schedule
    zero_reason: graded-step-not-the-crossing
    required: true
    weight: 4
    live_state_read: "the graded_step in the outcome document beside the crossing the verifier recomputes in-process from the evaluation series, and the schedule_length and steps_executed the runner observed"
    compiled_test: "tests/test_output.py::test_graded_step_is_the_crossing_not_the_schedule"

  - id: reported_crossing_matches_recomputed_crossing
    statement: "Where the submission reported a crossing at all, it equals the crossing the verifier recomputed, so a shaped readout diverges loudly instead of being absorbed into the score."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: reported_crossing_matches_recomputed_crossing
    zero_reason: reported-crossing-diverges
    required: true
    weight: 2
    live_state_read: "the submission_report block the pinned harness copied verbatim into harness_weight_ledger.json, beside the crossing the verifier recomputed from its own evaluation series"
    compiled_test: "tests/test_output.py::test_reported_crossing_matches_recomputed_crossing"

grader_reasons:
  - id: no-improvement-over-baseline
    statement: "The gate opened and the normalized score clipped to zero, because the graded crossing was at or past the baseline step count."
  - id: bound-state-unreadable
    statement: "The verifier could not read its own bound state, so nothing was graded and the zero says so."
  - id: grader-internal-error
    statement: "The grading process raised. The module-level handler still wrote an attributed reward, because a grader that dies quietly is this slot's own failure mode applied to itself."
  - id: verifier-aborted-before-grading
    statement: "The entry point exited before grade.py wrote a reward. The EXIT trap in tests/test.sh wrote an attributed zero, so an aborted verifier leaves a reason rather than silence."
