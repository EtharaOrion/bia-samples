schema_version = "1.4"

name = "bia-track3-record-displacement"
tags = ["optimization", "bounded-continuous", "record-displacement"]
description = "Reach a measured target validation loss in fewer optimizer steps than the shipped baseline on a frozen GPT-2 training substrate, deriving the improvement rather than replaying a published record."

# The seven optimization bindings, transcribed from seed/forge/oer.py BINDINGS.
# max_timeout and budget_hours are distinct fields with distinct roles and neither is an alias of the other.
# The 6 that requirements/bia-environment-spec.md names bounds one session of fifty attempts, which is max_timeout's role.
# budget_hours is the per-attempt completion bound, being 6 hours divided by 50 attempts, which is 0.12 hours or 7.2 minutes.
# Writing that 6 into budget_hours would encode a 300 hour session, which every well-formedness check would pass as valid.
# max_timeout_hours was 24 and max_attempts was 100; both predate the batch binding and neither is the granted envelope.
[optimization]
max_timeout = 6.0
max_timeout_hours = 6.0
budget_hours = 0.12
max_attempts = 50
max_attempts_ceiling = 100
final_selection = "best"
solver_egress = "setup-only"
compute_envelope = "one H100, single accelerator, no multi-GPU scaling"
reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"

# Harbor reads [metadata] as dict[str, Any], so it is the carrier that survives validation.
# The top-level tables above are this bundle's legacy shape and Harbor silently drops them, which is why the
# bindings are mirrored here rather than stated once. seed/harbor_lint.py reads [metadata].tags for the client tags.
[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
archetype = "record-displacement"
max_timeout = 6.0
max_timeout_hours = 6.0
budget_hours = 0.12
budget_envelope = "One H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
max_attempts = 50
final_selection = "best"
solver_egress = "setup-only"
compute_envelope = "one H100, single accelerator, no multi-GPU scaling"
reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
reward_range = [0.0, 1.0]
network_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
network_deny_reason = "The published record corpus is the primary contamination carrier for this task family."

[reward]
path = "/logs/verifier/reward.txt"
record = "/logs/verifier/record.json"
range = [0.0, 1.0]
full = 1.0
higher_is_better = true

[environment]
# RESOLVED: gap-delivery-unbound. The base layer was pinned by digest inside environment/Dockerfile but the built
# image was not, so nothing bound the bytes Harbor actually runs. This is the manifest digest of the image built
# from environment/Dockerfile on the x86_64 host that executes the task, so scanned and executed images cannot differ.
# The key is docker_image and not 'image': seed/harbor_lint.py line 62 rejects 'image', which Harbor silently drops.
docker_image = "bia/track3-record-displacement@sha256:89e2452bd551e457325d680fe7ec1a79cc962a26e943e2531b4e6de4093a2545"
gpus = 1
gpu_types = ["H100"]
# Provisioning baseline only. Egress is setup-only, so [agent] carries no network for the scored run.
network_mode = "public"

[verifier]
# Isolated because grading re-executes the submitted recipe and then evaluates
# the checkpoints it produced with verifier-owned code on a withheld split, which
# needs a GPU-capable environment of its own. The withheld split is mounted into
# THIS environment only. It is never mounted into the agent environment, and for
# the lifetime of every submission process the verifier holds it in memory and
# removes it from the filesystem, so it is unreachable by search as well as by
# name.
image = "tests/Dockerfile"
network = "denied"
val_shard_mount = "verifier_only"

[agent]
# Setup-only egress, the stricter of the two readings requirements/bia-environment-spec.md line 247 directs.
network_mode = "none"
allowed_hosts = []

[artifacts]
paths = ["recipe.py", "claim.json", "/logs/verifier/reward.txt", "/logs/verifier/record.json"]

[resources]
gpu = "1x H100, single accelerator, no multi-GPU scaling. The batch is fixed at environment/shape.json batch_tokens_per_step and is served by the provided loader, so device count changes wall clock and not step count."
