# Harbor delivery manifest, slot OER-13, family F13.
#
# schema_version is a TOP-LEVEL scalar pinned to the tested version and stays
# above the first table header: TOML scopes every key to the most recent header,
# so an assignment written after a header becomes that table's key while the file
# still reads correct to a human.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "oer-13-chained-precision-across-parse-tokenize-and-train"
version = "1.0.0"
description = "Reduce the validation loss of the trained model across a chain where each stage consumes the previous stage's output, so a precision loss early in the chain is not recoverable later and the graded quantity is the end of the chain rather than any stage in it."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "chained-precision"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-13"
provisional_identifier = "OER-13"
family = "F13"
family_title = "parser construction"
title = "Chained precision across parse, tokenize and train"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

[metadata.objective]
statement = "Reduce the validation loss of the trained model across a chain where each stage consumes the previous stage's output, so a precision loss early in the chain is not recoverable later and the graded quantity is the end of the chain rather than any stage in it."
metric = "nanoGPT validation loss on the verifier-owned held-out FineWeb split"
unit = "mean cross entropy in nats per token"
direction = "lower"
frozen = "the architecture, the step budget, the optimizer, the one forward-backward pass per step, the token space, the evaluation split"
free = "the parse stage, the tokenize stage, and how they compose"
primary_archetype = "sustained-refinement"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."
composition = "chained precision across three stages"

# The frozen substrate this slot's metric resolves against. Replicated byte for
# byte into the bundle rather than referenced out of it, because a bundle's name
# is a hash over its own tree and a shared file outside that tree would leave the
# name underdetermined.
[metadata.substrate]
declaration = "environment/nanogpt_substrate.json"
framework = "nanoGPT, modded-nanogpt records/track_3_optimization/"
architecture = "vocab_size 50304, num_layers 12, model_dim 768, head_dim 128, num_heads 6, seq_len 1024"
run = "524288 tokens per step, one forward and one backward pass per step, one optimizer step per step"
graded_artifact = "a real parameter snapshot of that decoder, written by the harness-owned frozen train stage"
graded_split = "the verifier's own held-out FineWeb validation shards, absent from environment/ by construction"
corpus_scale_gap = "gap-oer-13-corpus-below-substrate-scale. This slot's delivered corpus is far smaller than the substrate's operating scale, so the step budget is set by the corpus and the 3.28 target is not reachable here. The shortfall is recorded, not papered over."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts; it bounds the whole session"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound; it bounds one attempt and is never an alias of max_timeout_hours"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.reward]
schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
floor = 0.0
ceiling = 1.0
full_reward = 1.0
formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
target_is_a_bar = "reaching the target scores exactly 1.0 and beating it also scores 1.0"
zero_carries_reason = true

[metadata.anchors]
state = "absent"
note = "This family's anchors are unmeasured. The reward schema above is bound in full and no number is invented for either anchor. The measurements of the retired surrogate path did not survive the re-base onto the nanoGPT substrate and were not carried across."

[metadata.difficulty]
target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard by the standing batch-level Perception-axis exemption"
perception_exemption = "This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.identity]
canonical_content_hash = "not derived in wave 1"
uuid = "not derived in wave 1"
note = "The slot is staged under its provisional identifier, which is its slot id. Identity is derived for every slot at once in wave 2, because adding solution/policy.yaml to an already-committed bundle moves its hash."

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_note = "The solving agent gets open internet egress inside the sandbox so it can fetch its own packages, datasets and models. The deny-list is not a containment proof; the deterministic checker is the load-bearing control."
writable = ["environment/pipeline/parse.py", "environment/pipeline/tokenize.py", "environment/pipeline/compose.json"]
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
imports_submission = false
holdout_mount = "/verifier/holdout/fineweb10B"
holdout_note = "The graded split is mounted into the verifier only. It is not a bundle byte and it is absent from the agent image by construction."
