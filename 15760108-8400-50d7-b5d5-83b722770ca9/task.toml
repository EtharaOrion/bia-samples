schema_version = "1.4"

artifacts = [
  "/telemetry/frontier_record.json",
  "/workspace/submission/frontier.py",
  "/logs/verifier/score.json",
  "/logs/verifier/outcomes.json",
]

[task]
name = "bia/s09-multi-objective-frontier"
version = "1.0.0"
description = "Achieve the largest hypervolume over two frozen objectives with a declared tradeoff surface, by proposing six optimizer configurations that spread along the surface rather than one that minimizes a single objective."
authors = [{ name = "Bia" }]
keywords = ["optimization", "multi-objective", "pareto-frontier", "hypervolume", "bounded-continuous"]

# ---------------------------------------------------------------------------
# THE SEVEN OPTIMIZATION BINDINGS.
#
# All seven appear here. budget_hours is bound BY ROLE and is NOT the literal 6
# from requirements/bia-environment-spec.md. That 6 bounds one fifty-attempt
# session, which is max_timeout_hours' role. Transcribing it into budget_hours
# would encode a 300-hour session, which nothing downstream compares and which
# would therefore pass as well-formed while being wrong by a factor of fifty.
# ---------------------------------------------------------------------------
[optimization]
max_timeout_hours = 6.0        # binding 1: terminates the refinement loop, one session
budget_hours = 0.12            # binding 2: per attempt, 7.2 minutes, 6.0 / 50
max_attempts = 50              # binding 3: the elected session size, ceiling is 100
final_selection = "best"       # binding 4: best attempt of the session is submitted
solver_egress = "setup-only"   # binding 5: no network during scored work
compute_envelope = "1xH100"    # binding 6: one H100, single accelerator, no multi-GPU scaling
reward_range = [0.0, 1.0]      # binding 7: a single float on the closed unit interval
reward_form = "min(max(raw, 0.0), 1.0)"
reward_raw = "hypervolume of the achieved frontier against reference point (0.0, 0.0) in the declared normalized space"
budget_envelope = "One H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
budget_role_note = "budget_hours is the per-attempt completion bound; max_timeout_hours is the session bound. They are distinct fields with distinct roles and are never equal here."
budget_derivation = "6 hours of single-H100 session time divided by 50 attempts, per requirements/bia-environment-spec.md lines 122 to 135"

[metadata]
category = "optimization"
slot = "S09"
max_timeout_hours = 6.0
budget_hours = 0.12
max_attempts = 50
final_selection = "best"
maturity = "full"
disposition = "HOLD:PILOT_REQUIRED"
disposition_reasons = ["reference-score-unmeasured", "pilot-absent", "cohort-registry-digest-unpinned"]

[metadata.reward]
name = "hypervolume"
kind = "float"
range = [0.0, 1.0]
full_reward = 1.0
higher_is_better = true
written_by = "tests/grade.py"
written_to = "/logs/verifier/score.json"
key = "score"
recomputable_by = "solution/recompute.py --reward /telemetry/frontier_record.json --score /logs/verifier/score.json"
reference_point_normalized = [0.0, 0.0]
ideal_point_normalized = [1.0, 1.0]
normalization = "per objective, the clipped fraction of the reference-to-ideal distance covered, matching requirements/bia-environment-spec.md lines 82 to 85"
loss_axis_reference = "ln(vocab_size), the cross entropy of the uniform next-token predictor"
loss_axis_ideal = "entropy_rate of the frozen Markov source plus loss_offset_ideal"
density_axis_reference = "erfc(density_tau / sqrt(2)), the retained fraction of a dense unstructured Gaussian matrix"
density_axis_ideal = "density_ideal from the frozen spec"
degenerate_case = "a single achieved point collapses the union to one box of area u1 times u2, and because the declared tradeoff surface forbids both coordinates being near one at once, a single-objective attempt scores near zero"

# The frontier budget, stated as arithmetic rather than as an assurance.
[metadata.frontier_budget]
frontier_points_per_graded_attempt = 6
per_point_seconds = 66.0
shared_overhead_seconds = 36.0
total_seconds = 432.0
total_minutes = 7.2
enforcement = "the frozen runner arms a per-run wall-clock deadline at per_run_seconds; a point that would overrun is truncated at the deadline with stop_reason recorded, so the whole frontier fits the budget whatever update rule is submitted"
shared_overhead_measured_on_cpu_seconds = 7.05
graded_wall_clock_measured = false
graded_wall_clock_note = "UNMEASURED. No GPU execution was performed during authoring, so per-point graded wall clock is an enforced allocation and not a measurement."

[metadata.cohort]
designed_against = ["gpt5.6-sol", "anthropic/claude-opus-5", "muse-spark-1.2"]
validity_end = "2026-11-17"
registry_digest = "unpinned"
registry_digest_note = "The projected cohort registry snapshot digest is not available to this authoring run, which is a named coverage gap with reason cohort-refresh-overdue and is one of the reasons this bundle caps at HOLD:PILOT_REQUIRED."

[metadata.difficulty]
tier = "unassigned"
measured = false
pass_probability = "unauthored"
note = "Difficulty is measured, never claimed. No pilot has run over these frozen bytes. The defeat mechanism is recorded as design intent in solution/TRUTH.md and is marked UNMEASURED."

[metadata.reference_solution]
path = "solution/solve.sh"
graded_score = "unmeasured, pending orchestrator GPU run"
graded_score_reason = "The host's single H100 was fully committed to a live evaluation campaign throughout the authoring window, so no GPU work was performed. The graded reference score is absent rather than estimated."
smoke_verified = true
smoke_invocation = "BIA_SMOKE=1 bash solution/solve.sh"
smoke_note = "The smoke path runs the identical code path at a tiny frozen scale, CPU only with CUDA hidden, and produces a real multi-point Pareto front and a real hypervolume. It proves executability and proves nothing about the graded operating point."

[agent]
timeout_sec = 21600.0
network_mode = "none"
allowed_hosts = []
network_note = "setup-only egress: the image is pre-provisioned and no network is available during scored work"

[verifier]
timeout_sec = 1800.0
# Raised from 900. The verifier now executes the graded frontier run itself rather than
# grading a record the agent wrote, so the verifier window has to hold one full graded run of
# six points at the frozen per-run cap plus its own two objective measurements per point.
entry_point = "tests/test.sh"
env = { BIA_S09_SPEC = "/workspace/harness/frontier_spec.json", BIA_S09_TELEMETRY_DIR = "/telemetry", BIA_S09_LOGS = "/logs/verifier", BIA_S09_TESTS = "/tests" }

[environment]
# Pinned by digest, not tag. The digest binds this task to the runtime that
# tests/grade.py and environment/harness/engine.py were authored against.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 40960
# Baseline for environment setup only; [agent] overrides to none for the graded run.
network_mode = "public"
env = { BIA_S09_TELEMETRY_DIR = "/telemetry", BIA_S09_SPEC = "/workspace/harness/frontier_spec.json", PYTHONDONTWRITEBYTECODE = "1" }

[metadata.rollout_population]
population_predicate = "no rollout has been recorded against these frozen bytes"
attempts_made = 0
attempts_shipped = 0
attempts_excluded = 0
attempts_scored = 0
attempts_faulted = 0
attempts_unrun = 0
scored_attempts_all_shipped = true
shipped = []
excluded = []
note = "trajectories/ is empty and is excluded from the canonical content hash, so recording a rollout later never changes the bundle identity."
