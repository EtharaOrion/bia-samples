# Graded assertions for bia S09 multi-objective-frontier.
#
# Every checker reduces to exactly one of VALUE, EFFECT, ABSENCE, INVARIANT,
# ORDERING, DIVERGENCE, and names the live-state read it traces to. A checker
# reducing to none of the six, or to two, is invalid. Every checker is
# hard-pass: one failure scores exactly 0.0.
#
# Three fields per row are readable from frozen bytes rather than taken on an
# author's word, and seed/forge/verifier.py reads them that way:
#   reached_by  the carrier file, inside the reachability closure of tests/test.sh
#   selector    the function that carrier actually defines
#   zero_reason the kebab code that carrier actually prints beside the zero
# The zero_reason values are the ZERO_REASON map in tests/grade.py, which stamps
# one onto every failing result and prints it. They are not authored here.

schema: forge.checkers/v1
task: bia/s09-multi-objective-frontier
hard_pass: true
implemented_by: tests/grade.py
asserted_by: tests/test_output.py
reward_path: /logs/verifier/reward.txt

aggregation:
  mode: all_pass
  note: >-
    Every checker is a gate rather than a weighted contributor: tests/grade.py returns 0.0 the moment any one of them is false, and only a run in which all of them hold reaches the recomputed hypervolume at all. No threshold is declared, because this bundle binds no contract threshold and authoring one here would invent the bar instead of carrying it.

checkers:

  - id: frontier_cardinality
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_frontier_cardinality
    zero_reason: frontier-cardinality-mismatched
    implemented_by: tests/grade.py::check_frontier_cardinality
    statement: >-
      The produced value, the number of evaluated frontier points, equals the frozen target frontier_points and the point indices are exactly 0 through frontier_points minus 1.
    live_state_read: >-
      The length of runs[] and the value of proposed_points in the runner-sealed telemetry record at $BIA_S09_TELEMETRY_DIR/frontier_record.json, which the frozen runner appends one entry to per completed training run and no other writer touches.
    fails_when: >-
      propose_frontier returns a count other than the frozen frontier_points, or a run did not complete, or a point index is duplicated or missing.
    single_kind_rationale: >-
      This is VALUE and not INVARIANT because it bounds one produced quantity read once after the run, not a property that must hold at every instant of the run.

  - id: frozen_substrate_invariant
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_frozen_substrate
    zero_reason: frozen-substrate-violated
    implemented_by: tests/grade.py::check_frozen_substrate
    statement: >-
      Across the whole run, every frontier point trained the identical frozen architecture, declared the identical frozen max_steps, performed exactly one forward pass and exactly one backward pass per optimizer step, and stayed inside the frozen per-run wall-clock cap.
    live_state_read: >-
      Per run, architecture_signature computed by the engine from the live named_parameters shapes of the instantiated model, forward_calls counted by the live model's forward counter, backward_calls counted by a hook registered on the live loss tensor each step, steps_taken, max_steps and elapsed_seconds, all in frontier_record.json, compared against the untrained_reference architecture_signature and the frozen spec.
    fails_when: >-
      The architecture signature moves between points or away from the frozen reference, a run declares a different max_steps, forward or backward call count diverges from step count, or a run overruns the frozen per-run cap by more than ten seconds, which is the slack for the single in-flight step the deadline cannot interrupt.
    single_kind_rationale: >-
      This is INVARIANT and not VALUE because it is a conjunction of properties required to hold at every step of every run, and a violation at any single step falsifies it.

  - id: no_unmanifested_telemetry
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_no_unmanifested_telemetry
    zero_reason: unmanifested-telemetry-present
    implemented_by: tests/grade.py::check_no_unmanifested_telemetry
    statement: >-
      No file that the frozen runner did not write exists in the telemetry directory. A hand-authored or agent-authored record must not exist.
    live_state_read: >-
      A live directory scan of $BIA_S09_TELEMETRY_DIR at grade time, compared set-wise against the manifest[] the runner sealed into frontier_record.json.
    fails_when: >-
      Any file is present in the telemetry directory that the manifest does not name, or any manifested file is absent.
    single_kind_rationale: >-
      This is ABSENCE and not INVARIANT because it asserts that a class of thing does not exist at grade time, not that a property held throughout the run.

  - id: runs_precede_seal
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_runs_precede_seal
    zero_reason: runs-not-ordered-before-seal
    implemented_by: tests/grade.py::check_runs_precede_seal
    statement: >-
      The frontier points were evaluated in a required sequence: append order is strictly 0 upward with no gaps, each run started only after its predecessor ended, and every run ended before the record was sealed.
    live_state_read: >-
      order_index, t_start and t_end stamped by the frozen runner at the boundaries of each live training run, and sealed_at stamped when the runner wrote the record, all in frontier_record.json.
    fails_when: >-
      Append order is out of sequence, two runs overlap in time, a run ends before it starts, or a run ends after the seal instant.
    single_kind_rationale: >-
      This is ORDERING and not INVARIANT because the assertion is entirely about the sequence relation between recorded events, not about a property of any one of them.

  - id: training_moved_live_weights
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_training_moved_weights
    zero_reason: live-weights-unmoved
    implemented_by: tests/grade.py::check_training_moved_weights
    statement: >-
      The optimizer steps changed live model state in a named way: for every frontier point, the model's measured validation loss or measured density after training differs from the value measured on the same live tensors before the first step.
    live_state_read: >-
      Per run, pre.val_loss and pre.density measured by the engine by reading the live parameter tensors and running the live model over the frozen validation shard before step 0, and post.val_loss and post.density measured the same way after the final step, together with steps_taken, all in frontier_record.json.
    fails_when: >-
      A run took zero optimizer steps, or both measured quantities are unchanged within the declared epsilon, which is what a submission whose optimizer never writes to the parameters produces.
    single_kind_rationale: >-
      This is EFFECT and not VALUE because it asserts that an action changed live state, and it accepts any change above the epsilon rather than bounding the result against a target.

  - id: hypervolume_independently_agrees
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_hypervolume_divergence
    zero_reason: hypervolume-recomputation-diverged
    implemented_by: tests/grade.py::check_hypervolume_divergence
    statement: >-
      Two independently derived results agree: the reward recomputed by the verifier from the raw achieved objective values through coordinate-compressed box union equals the reward the engine derived through a descending sweep, and the recorded Pareto front carries the identical hypervolume.
    live_state_read: >-
      Per run, objectives.val_loss and objectives.density measured by the engine from the live trained model, plus anchors, normalized_points, pareto_front and hypervolume_raw as sealed in frontier_record.json. The verifier re-normalizes and re-integrates from the raw objectives and never reuses the engine's normalized values as input.
    fails_when: >-
      The two implementations differ on any normalized coordinate or on the hypervolume by more than 1e-9, or the recorded Pareto front does not carry the full hypervolume of the achieved set.
    single_kind_rationale: >-
      This is DIVERGENCE and not VALUE because it compares two independently derived results against each other, with no external target on either side.

  - id: graded_record_authored_by_the_verifier
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_record_origin
    zero_reason: graded-record-not-authored-by-the-verifier
    implemented_by: tests/grade.py::check_record_origin
    statement: >-
      The produced value, the origin stamp on the graded record, equals the nonce this verifier process minted after it started, and the deliverable digest the record names equals the digest of the deliverable on the verifier filesystem at grade time.
    live_state_read: >-
      run_nonce and graded_submission_sha256 in the frontier_record.json the verifier's own run of the frozen runner wrote into a directory it named from system entropy, compared against the nonce held only in this process and hashlib.sha256 over the submission file.
    fails_when: >-
      The record was not produced by this verifier invocation: a hand-authored record, a replayed genuine record with mutated objectives, or a record an atexit hook overwrote after the seal all carry no nonce this process issued.
    single_kind_rationale: >-
      This is VALUE and not DIVERGENCE because it compares one produced quantity against a required target held outside the artifact, rather than comparing two independent derivations.

  - id: submission_ran_outside_the_measuring_process
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_submission_isolation
    zero_reason: submission-ran-inside-the-measuring-process
    implemented_by: tests/grade.py::check_submission_isolation
    statement: >-
      A property held across the whole run: no measurement shared an interpreter with submitted bytes. The isolation block declares subprocess hosting by frontier_worker.py with a worker pid distinct from the runner pid, and every run attributes both its objectives and its elapsed time to the runner.
    live_state_read: >-
      submission_isolation.mode, submission_isolation.worker, submission_isolation.runner_pid and submission_isolation.worker_pid in frontier_record.json, together with objectives_measured_by and elapsed_measured_by on every run entry.
    fails_when: >-
      The record declares in-process hosting, names no distinct worker process, or attributes any objective or elapsed time to anything other than the runner, which is what a runner that exec_module the submission into itself produces.
    single_kind_rationale: >-
      This is INVARIANT and not EFFECT because it asserts a property that must hold at every point of the run, not that one action changed live state.

  - id: frozen_harness_bytes_unmodified
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_frozen_harness_bytes
    zero_reason: frozen-harness-bytes-modified
    implemented_by: tests/grade.py::check_frozen_harness_bytes
    statement: >-
      The produced value, the sha256 of each executable harness file, equals the pin this bundle froze, both on the verifier filesystem at grade time and in the digests the run recorded when it loaded them.
    live_state_read: >-
      hashlib.sha256 over environment/harness/engine.py, run_frontier.py and frontier_worker.py as they exist on the verifier filesystem, against tests/checkers/frozen_bytes.json, and against harness_digests in frontier_record.json.
    fails_when: >-
      Any executable harness file differs from the frozen pin, is absent, or changed between the moment the run recorded it and the moment the verifier rehashed it. Rewriting the density measurement is the route this closes.
    single_kind_rationale: >-
      This is VALUE and not INVARIANT because it bounds produced digests against a pinned target read once at grade time, not a property asserted at every instant of the run.

