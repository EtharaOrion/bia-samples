# Private derivation source for bia S09 multi-objective-frontier.
#
# Every generated canonical artifact in this bundle descends from this file:
#   solution/TRUTH.md        the private ground truth
#   solution/rubrics.json    the reference-based rubric verifier
#   tests/rubrics.jsonl      the agent-facing rubric roster
#   tests/test_output.py     the compiled deterministic rubric tests
# Regenerate and verify all four with: python3 solution/recompute.py --regen
#
# GENERATING SOURCE. Edit here, never in the generated files.

schema: bia.grounding/v1

task:
  slot: S09
  name: bia/s09-multi-objective-frontier
  family_shape: two frozen objectives with a declared tradeoff surface, a free optimizer, reward as the hypervolume of the achieved frontier clamped to the closed unit interval
  frozen: the two objectives, their measurement, the declared tradeoff surface, the data source, the architecture, the token budget, the step ceiling, the per-run wall-clock cap, the number of frontier points, and the hypervolume reference point and normalization
  free: the optimizer update rule, its internal state, its schedule, its hyperparameters, and the choice of where along the tradeoff surface to place each of the six points

objectives:
  - id: J1
    name: validation loss
    direction: lower is better
    definition: mean next-token cross entropy in nats over the frozen validation shard of the frozen Markov source
    measured_by: environment/harness/engine.py::measure_val_loss
  - id: J2
    name: weight-matrix density
    direction: lower is better
    definition: fraction of entries with absolute value at or above density_tau times the root mean square of their own tensor, taken over every two-dimensional parameter tensor, that is both embeddings and the four block matrices of every layer
    measured_by: environment/harness/engine.py::measure_density
    scale_invariance_note: the threshold is relative to each tensor's own root mean square, so uniformly rescaling the weights leaves the objective unchanged, which is what closes the rescaling route that an RMS-normalized residual trunk would otherwise leave open

tradeoff_surface:
  declared: true
  statement: capacity removed from the weight matrices cannot be spent on predicting the source, so driving density down raises validation loss and driving validation loss down keeps density high
  endpoints_are_forced: at density zero every matrix is null and the model emits a constant, so validation loss equals the uniform predictor exactly, and at density one no entry has been thresholded so the density objective sits at its reference coordinate
  curvature_is_the_open_question: the shape between those two forced endpoints is not declared and is what an attempt discovers

normalization:
  form: fraction of the reference-to-ideal distance covered, clipped to the closed unit interval, matching requirements/bia-environment-spec.md lines 82 to 85
  loss_axis:
    reference_coordinate: natural log of vocab_size, the cross entropy of the uniform next-token predictor
    ideal_coordinate: entropy rate of the frozen Markov source plus loss_offset_ideal
    entropy_rate_derivation: exact, by power iteration to the stationary distribution of the frozen sparse chain followed by the stationary average of the per-state row entropy, in environment/harness/engine.py::source_entropy_rate
  density_axis:
    reference_coordinate: erfc(density_tau / sqrt(2)), the retained fraction of a dense unstructured Gaussian weight matrix
    ideal_coordinate: density_ideal, the declared sparse ideal
  measurement_free: true
  measurement_free_note: both coordinates of both points are closed-form functions of the frozen bytes, so the normalization needs no measured reference run and cannot drift with the machine it is graded on

hypervolume:
  space: normalized maximization space with coordinates u1 and u2 on the closed unit interval
  reference_point_normalized: [0.0, 0.0]
  ideal_point_normalized: [1.0, 1.0]
  reference_point_raw: [ln(vocab_size), erfc(density_tau / sqrt(2))]
  ideal_point_raw: [entropy_rate + loss_offset_ideal, density_ideal]
  definition: the area of the union of the origin-anchored boxes of the achieved points, which is at most one by construction
  engine_implementation: environment/harness/engine.py::hypervolume_sweep, descending u1 strip accumulation
  verifier_implementation: tests/checkers/hypervolume.py::hypervolume_grid, coordinate-compressed cell union
  reward: min(max(hypervolume, 0.0), 1.0)
  degenerate_case: >-
    A single achieved point collapses the union to one box of area u1 times u2. Because the tradeoff surface forbids both coordinates being near one at once, any single point scores far below a spread set, and a point at either extreme scores near zero: an attempt that only minimizes loss lands near the density reference coordinate, so u2 is near zero and the product is near zero, and an attempt that only minimizes density lands near the uniform predictor, so u1 is near zero and the product is near zero.

budget:
  per_attempt_budget_hours: 0.12
  per_attempt_budget_minutes: 7.2
  derivation: 6 hours of single-H100 session time divided by 50 attempts, per requirements/bia-environment-spec.md lines 122 to 135
  frontier_points_per_graded_attempt: 6
  per_point_seconds: 66.0
  shared_overhead_seconds: 36.0
  arithmetic: 6 points times 66.0 seconds plus 36.0 seconds of shared overhead equals 432.0 seconds, which is 7.2 minutes
  enforcement: the frozen runner arms a per-run wall-clock deadline at per_run_seconds, so a point that would overrun is truncated at the deadline with stop_reason recorded, and the whole frontier therefore fits the budget whatever update rule is submitted
  shared_overhead_measured_on_cpu_seconds: 7.05
  shared_overhead_measurement_note: source construction, exact entropy rate, two million training tokens, the validation shard and the data digest were timed on the authoring host's CPU at 7.05 seconds total, which is the only timing in this bundle taken from an execution rather than declared
  graded_wall_clock_unmeasured: true
  graded_wall_clock_unmeasured_reason: no GPU execution was performed during authoring, so per-point graded wall clock is an enforced allocation and not a measurement

checkers:
  - id: frontier_cardinality
    kind: VALUE
  - id: frozen_substrate_invariant
    kind: INVARIANT
  - id: no_unmanifested_telemetry
    kind: ABSENCE
  - id: runs_precede_seal
    kind: ORDERING
  - id: training_moved_live_weights
    kind: EFFECT
  - id: hypervolume_independently_agrees
    kind: DIVERGENCE
  - id: graded_record_authored_by_the_verifier
    kind: VALUE
  - id: submission_ran_outside_the_measuring_process
    kind: INVARIANT
