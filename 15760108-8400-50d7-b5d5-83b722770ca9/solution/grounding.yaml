      mode: compiled
      outcome_key: training_moved_live_weights
    - id: hypervolume_independently_agrees
      dimension: reward_integrity
      weight: 0.14
      evaluation_target: verifier_outcomes
      criterion: Two independent hypervolume implementations agree on the reward recomputed from the raw achieved objective values.
