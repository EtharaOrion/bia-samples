reference_solution:
  path: solution/reference.py
  recipe: >-
    A tuned Muon step on the 2D parameters with an auxiliary AdamW on the embedding,
    the head and every norm parameter, a short linear warmup, a cosine floor that does
    not decay to zero, and an orthogonal initialization on the attention projections.
    Derived, not recalled: the contamination screen treats the published record
    lineage as an evaluation set, so a replayed record recipe scores nothing.
  claimed_step: 2690
  crossing_steps: [2665, 2690, 2640, 2665, 2690, 2615, 2665, 2640, 2690, 2665, 2640, 2690, 2665, 2615, 2690, 2640, 2665, 2690, 2640, 2665]
  crossing_steps_note: >-
    Twenty seeds, one per ceiling slot. Every value is congruent to 15 modulo 25 so it
    lands on the verifier grid, and every value is at or below the 2690 target, so
    each per-seed score clips to 1.0, the spread is zero, sep is 1.0 and the reward is
    exactly 1.0. Reaching the target is a bar, not a point on a gradient.

fixtures:
  - id: reference
    kind: accepting
    claimed_step: 2690
    seed_count: 20
    expected_reward: 1.0
    expected_reason: ""
    expected_state: significance-established
    expected_classification: established
  - id: defect_readout_smoothed
    kind: rejecting
    fires: graded_readout_is_unsmoothed
    claimed_step: 2690
    seed_count: 20
    mutate: readout_smoothed
    expected_reward: 0.0
    expected_reason: graded-readout-smoothed
    stale_control: ctl-ema-blended-readout
  - id: defect_crossing_unsustained
    kind: rejecting
    fires: crossing_is_sustained
    claimed_step: 2690
    seed_count: 20
    mutate: single_point_dip
    expected_reward: 0.0
    expected_reason: crossing-not-sustained
    stale_control: ctl-crossing-under-single-eval
    note: >-
      One isolated grid point below target in the middle of the run, with the window
      fully populated on both sides. The run did not stop; the loss came back. That is
      a regression, not a halt, and it carries the regression reason.
  - id: defect_early_stop
    kind: rejecting
    fires: early_stop_is_not_a_crossing
    claimed_step: 2690
    seed_count: 20
    mutate: halt_inside_window
    expected_reward: 0.0
    expected_reason: early-stop-not-a-crossing
    note: >-
      The grid is truncated one point past the first dip, so the sustain window has no
      data at all. That is a halt, not a regression, and the two are never given one
      reason code between them.
  - id: defect_grid_reordered
    kind: rejecting
    fires: evaluation_grid_is_verifier_scheduled
    claimed_step: 2690
    seed_count: 20
    mutate: grid_thinned
    expected_reward: 0.0
    expected_reason: evaluation-grid-not-verifier-scheduled
    note: >-
      The second grid point is dropped, far ahead of any crossing, so the gap sequence
      becomes 50 then 25 and only the ordering checker fires.
  - id: defect_graded_weights
    kind: rejecting
    fires: graded_weights_are_harness_owned
    claimed_step: 2690
    seed_count: 20
    mutate: submission_checkpoint
    expected_reward: 0.0
    expected_reason: graded-weights-not-harness-owned
    stale_control: ctl-weights-from-submission-checkpoint
  - id: defect_frozen_axis
    kind: rejecting
    fires: frozen_axes_survive_reexecution
    claimed_step: 2690
    seed_count: 20
    mutate: widen_model
    expected_reward: 0.0
    expected_reason: frozen-axis-moved
  - id: defect_claim_overstated
    kind: rejecting
    fires: claim_reconciles_with_reexecution
    claimed_step: 2600
    seed_count: 20
    crossing_steps: [2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700]
    expected_reward: 0.0
    expected_reason: claim-exceeds-reexecution
    note: >-
      The claim says 2600 and re-execution delivered 2700 on every seed. The claim
      overstated, so it is refused; the reward would have used the verifier's number
      regardless, because a claim can lower an outcome and can never raise one.
  - id: defect_no_target_reached
    kind: rejecting
    fires: target_reached_on_reexecuted_seeds
    claimed_step: 2690
    seed_count: 20
    mutate: never_below_target
    expected_reward: 0.0
    expected_reason: screen-target-not-reached
  - id: unproven_noise_band
    kind: rejecting
    fires: significance_separation_cleared
    claimed_step: 3240
    seed_count: 20
    crossing_steps: [3040, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240, 3240]
    expected_reward: 0.0
    expected_reason: significance-unestablished-at-ceiling
    expected_state: significance-unestablished-at-ceiling
    expected_classification: unproven
    note: >-
      Nineteen seeds sit ten steps under the baseline and one seed is lucky. The mean
      improvement is real and tiny, the spread is large, and sep lands at or below
      zero. The run COMPLETED and reached the target on every seed, so this is not a
      failure. It is the third outcome, and it is recorded as unproven. This is the
      negative control the lane spec requires: an improvement inside the noise band
      that must land on the unproven reason rather than on a pass or on a failure.
  - id: negative_noop
    kind: rejecting
    claimed_step: 2690
    seed_count: 20
    mutate: never_below_target
    expected_reward: 0.0
    expected_reason: screen-target-not-reached
    note: A no-op submission that never reaches the target. Failed, not unproven.
  - id: negative_stale_seed_floor
    kind: rejecting
    claimed_step: 2690
    seed_count: 8
    expected_reward: 0.0
    expected_reason: significance-unestablished-at-ceiling
    expected_state: significance-unestablished-at-ceiling
    expected_classification: unproven
    stale_control: ctl-verdict-under-old-seed-floor
    note: >-
      A verdict computed under the pre-mutation graded seed floor of 8. The floor was
      silently raised to 20, so eight seeds no longer establish anything and the
      carried-over answer resolves to unproven rather than to the pass it used to be.
continuity_ramp:
  id_prefix: near_margin_k
  claimed_step: 3225
  seed_count: 20
  fast_step: 3175
  slow_step: 3225
  fast_counts: [1, 2, 3, 4]
  note: >-
    A family of fixtures differing only in how many of the twenty seeds landed on the
    fast level. Every seed reaches the target, so the graded step is 3225 on all four
    and the base is identical at 25/560. Only sep moves, and it moves across the 0.05
    margin between three fast seeds and four. adequacy.py proves three things on this
    family: the reward equals base times clip(sep / 0.05, 0, 1) exactly, the reward is
    strictly increasing in the fast count, and the largest step between adjacent
    members is small, so the reward degrades continuously through the margin instead
    of flipping at it. The margin is bracketed by construction: k=3 sits below it and
    k=4 sits above it, so the no-jump claim is tested exactly where a jump would be.

golden_trajectory:
  attempts:
    - attempt: 1
      change: baseline AdamW with the shipped cosine schedule, unchanged, to establish the starting point
      claimed_step: 3250
      graded_step: 3250
      reward: 0.0
      state: significance-not-applicable
      note: reaching the target exactly at the baseline scores zero. The denominator is the anchor gap, not the run.
    - attempt: 2
      change: Muon on the 2D parameters, auxiliary AdamW on embedding, head and norms
      claimed_step: 3040
      graded_step: 3040
      reward: 0.375
      state: significance-established
      note: the first real separation. Spread across seeds is still wide.
    - attempt: 3
      change: linear warmup shortened to 128 steps, cosine floor raised off zero
      claimed_step: 2915
      graded_step: 2915
      reward: 0.598214
      state: significance-established
      note: above the 0.65 pass threshold is still ahead; the spread narrowed, which is what moved sep.
    - attempt: 4
      change: orthogonal initialization on the attention projections, Muon momentum retuned
      claimed_step: 2790
      graded_step: 2790
      reward: 0.821429
      state: significance-established
    - attempt: 5
      change: Muon Newton-Schulz iteration count raised, auxiliary AdamW betas retuned
      claimed_step: 2690
      graded_step: 2690
      reward: 1.0
      state: significance-established
      note: at the target. Reaching it and beating it both score exactly 1.0; the target is a bar.

