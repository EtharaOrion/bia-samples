feasibility:
  reference_hours: 1.4
  reference_hours_minutes: 84
  reference_hours_basis: >-
    Transcribed from requirements/bia-environment-spec.md line 133, which records F1
    at the upstream operating point costing 84 minutes per graded run, being 11.7
    times the per-attempt budget. It is NOT measured on this run: no accelerator and
    no FineWeb shard is present on this host, so no graded run was performed and none
    is claimed.
  budget_hours: 0.12
  over_budget: true
  over_budget_ratio: 11.666666666666666
  disposition: BLOCK:INFEASIBLE_OR_UNVERIFIED
  disposition_held_by: gap-oer-scaled-operating-point-unmeasured
  disposition_statement: >-
    reference_hours of 1.4 exceeds budget_hours of 0.12, so this slot is
    BLOCK:INFEASIBLE_OR_UNVERIFIED. It is recorded rather than rounded away. The
    contract already records this standing at batch.authorable_slots_note, which
    states that the four F1 slots are held by an unmeasured scaled operating point
    that Phase 2 item 7a would resolve to BLOCK:INFEASIBLE_OR_UNVERIFIED rather than
    to a hold. Nothing in this bundle asserts otherwise.

declared_gaps:
  - id: gap-oer-04-reward-path-carrier-split
    statement: >-
      seed/forge/verifier.py binds the runtime reward path as /logs/verifier/reward.txt
      carrying one float, while the wave-1 lane spec describes a shaped JSON document
      at /logs/verifier/reward.json. Both are written by tests/test.sh, the float last,
      and tests/checkers.yaml declares the .txt path as reward_path because that is the
      path the instrument binds. The divergence is recorded rather than resolved by
      preference.
    closes_by: a single bound reward carrier named identically by the instrument and the lane spec
  - id: gap-oer-04-separation-margin-units-differ
    statement: >-
      The batch binds separation_margin 0.05 as a pilot-level pass-rate quantity and
      the F1 ladder binds significance_margin 0.004 as a per-submission validation-loss
      quantity. This slot's graded checker compares against 0.05 in anchor-normalised
      score units, which is a third unit system, chosen so the graded separation is
      commensurable with the reward it multiplies. Both bound values are carried by
      name and neither is recomputed, but no source states their relation.
    closes_by: a recorded relation between the two margins, or a per-family binding of the score-unit margin
  - id: gap-oer-04-verifier-reexecution-unmeasured
    statement: >-
      tests/runner.py and tests/held_out_eval.py are complete and were not executed on
      this host, because no accelerator and no FineWeb validation shard is present.
      Every checker adequacy result recorded for this slot was produced against planted
      telemetry fixtures driving the live checkers, never against a re-executed
      training run. No such run is claimed.
    closes_by: one execution of tests/test.sh on the bound envelope with the shard mounted
  - id: gap-oer-04-overlay-scratch-precreated
    statement: >-
      seed/forge/launcher.py::plan requires the upper, work and merged overlay layers
      to be existing directories and assembles only the lower layer itself, while
      seed/staging/oer1/verify_slots.py does not create them. Those three scratch
      directories under seed/results/overlay/OER-04/ were created by this lane as run
      scaffolding so the real instrument could execute. They are ephemeral run output,
      not bundle bytes, and no byte was written into dataset/.
    closes_by: verify_slots.py creating the three writable layers, as seed/tests/test_launcher.py's fixture does

withheld_from_the_agent_manifest:
  note: Moved out of task.toml on 2026-08-25 because Harbor mounts that manifest on the agent surface,
    so anchors and internal record ids were readable by the solving agent. This file is private and is
    never assembled onto that surface.
  lines:
