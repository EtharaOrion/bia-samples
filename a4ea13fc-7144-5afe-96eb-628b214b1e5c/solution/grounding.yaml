schema: forge.grounding/v1

# The single private derivation source for OER-04. solution/recompute.py derives every
# generated artifact from this file and from nothing else: the golden trajectory, the
# checker fixtures, solve.sh, TRUTH.md, rubrics.json and tests/test_output.py.
#
# recompute.py invokes no model, no network, no clock, no locale and no random source.
# Running it twice over frozen bytes produces byte-identical output.

slot: OER-04
provisional_identifier: OER-04
identity_note: >-
  The slot id is the identifier for wave 1. No canonical content hash, no uuid5, no
  uuid-named directory, no canary token, no provenance carrier and no signature file
  is derived by this lane. Wave 2 does identity for the whole batch at once, because
  adding solution/policy.yaml to an already-committed bundle moves its hash.

family: F1
family_title: nanogpt optimizer speedrun
batch: OER-2026-08-20
primary_archetype: AR7
primary_archetype_title: Ambiguous Intermediate States
archetype_exclusivity: exactly one primary archetype, fixed at scope time. No buffet.
title: Significance-unproven submissions at the bound seed ceiling
objective: Significance-unproven submissions at the bound seed ceiling.

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  frontier_defeat_floor: 0.50
  anchorable_tier: capped below Hard
  perception_exemption: >-
    This task family is text and code only, so the Perception axis carries no
    category. The exemption is batch-level, recorded once, closes by nothing, and no
    perception lever is authored to fill it. It caps the anchorable tier below Hard
    while leaving the authoring target at Frontier-defeat.
  difficulty_claim: none. No difficulty claim appears anywhere in this bundle.

metric:
  name: optimizer steps to reach target validation loss
  direction: lower
  target_validation_loss: 3.28

anchors:
  anchors_state: measured
  baseline_metric: 3250
  baseline_identity: upstream record 36, tuned Muon with aux AdamW, loss 3.2787 at n=10, stat-verified, 2026-06-11
  target_metric: 2690
  target_identity: upstream record 46, current world record, loss 3.2783 at n=8, stat-verified, 2026-06-19
  authority: requirements/bia-environment-spec.md lines 297 to 321
  span: 560
  pass_threshold: 0.65
  separation_margin: 0.05
  separation_margin_authority: seed/contract.yaml families.entries.F1.scope.pilot_policy.predeclared_in_spec.separation_margin
  separation_margin_units_note: >-
    The batch binds separation_margin 0.05 and, separately, a per-submission seed-level
    significance margin of 0.004 in validation-loss units under the ladder's
    significance predicate (3.28 - avg_loss) * sqrt(n) >= 0.004. These are two
    different quantities in two different unit systems and this lane binds both by
    name without conflating them. The 0.05 margin is the one the graded checker
    compares against, expressed in anchor-normalised score units, and the 0.004
    predicate is carried in tests/runner.py::significance_predicate and in task.toml
    under [verifier.ladder]. Recorded as gap-oer-04-separation-margin-units-differ.

frozen_axes:
  dataset: fineweb10B
  sequence_length: 1024
  batch_size: 512
  n_layer: 12
  n_head: 12
  n_embd: 768
  vocab_size: 50257
  passes_per_step: 1
free_axes: optimization algorithm, hyperparameters and their schedules, model initialization

optimization_bindings:
  source: seed/contract.yaml batch.optimization_bindings, transcribed from requirements/bia-environment-spec.md lines 139 to 147
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts
  budget_hours: 0.12
  budget_hours_minutes: 7.2
  budget_hours_role: per-attempt completion bound
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  max_attempts: 50
  final_selection: best
  budget_envelope: one H100, single accelerator, no multi-GPU scaling
  budget_margin: 10 percent
  compute_envelope_accelerators: 1
  tags: [optimization, bounded-continuous]

image_pin:
  reference: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407
  rule: >-
    Pinned by @sha256:, never a floating tag. Harbor accepts any string in
    docker_image and does not itself require a digest, so a floating tag would
    validate cleanly and silently. The digest requirement is this contract's and both
    environment/Dockerfile and tests/Dockerfile carry it.

solver_egress_divergence:
  bound_here: open
  batch_field: setup-only
  batch_field_location: seed/contract.yaml batch.optimization_bindings.solver_egress
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a:
    source: requirements/open-ended-research-optimisation-problems.md line 58
    says: the solving model is granted full internet access
  reading_b:
    source: requirements/open-ended-research-optimisation-problems.md line 122
    says: internet is needed only for setup
  why_open_here: >-
    The family delivery.network_policy block in seed/contract.yaml binds
    agent_environment egress allowed with the upstream deny-list, and the lane spec
    binds open for every wave-1 slot. This slot therefore binds open in
    task.toml [agent].solver_egress.
  batch_field_not_amended: >-
    This lane does not amend seed/contract.yaml. The divergence between the
    batch-level field and the value bound here is recorded, never silent.
  deny_list: [github.com, raw.githubusercontent.com, objects.githubusercontent.com]
  deny_list_is_not_containment: >-
    A deny-list is not a containment proof. Mirrors, caches, paraphrased write-ups and
    model weights all carry a recipe past any deny-list. That is exactly why the
    deterministic re-execution checker, and not the network policy, is the
    load-bearing control on this slot.
  verifier_surface: >-
    The verifier keeps egress denied. The two surfaces differ by design and the
    asymmetry is a bound byte in task.toml, never an accident.

reward:
  shape: single float on the closed interval [0.0, 1.0], higher is better, never binary
  full_reward: 1.0
  formula_base: raw = (3250 - graded_step) / (3250 - 2690); base = min(max(raw, 0.0), 1.0)
  formula_separation: sep = mean(s_i) - (max(s_i) - min(s_i)) / (2 * sqrt(n))
  formula_factor: f = min(max(sep / 0.05, 0.0), 1.0)
  formula_reward: reward = min(max(base * f, 0.0), 1.0)
  continuity: >-
    f is continuous in sep across the whole domain and reaches exactly 0.0 only at
    sep <= 0. The reward therefore degrades continuously through the unproven band
    instead of flipping at the margin. A submission at sep = 0.049 keeps 98 percent of
    what a submission at sep = 0.050 keeps, because those two submissions are not in
    the same condition and a binary verdict would record them as if they were.

graded_quantity: >-
  the largest across re-executed seeds of the first verifier-scheduled evaluation step
  whose verifier-computed unsmoothed held-out loss is below 3.28 and remains below
  3.28 at the next two verifier-scheduled evaluation points.

readout_obligation:
  crossing_recomputed_by_verifier: true
  smoothing_on_graded_path: forbidden, checker graded_readout_is_unsmoothed, reduction VALUE
  sustained_across_scheduled_points: true, checker crossing_is_sustained, reduction INVARIANT
  early_stop_scores_zero: true, checker early_stop_is_not_a_crossing, reduction ABSENCE
  weights_are_harness_owned: true, checker graded_weights_are_harness_owned, reduction VALUE
  why_it_matters_doubly_here: >-
    A shaped readout is exactly how an agent manufactures apparent significance. On a
    slot whose whole subject is the difference between an established result and an
    unproven one, a readout that can be shaped would let the agent choose which of
    the three outcomes it lands in, which would make the unproven state unobservable.

ladder:
  source: seed/contract.yaml families.entries.F1.scope.checker_obligations.verification_parameters.ladder
  n_screen: 1
  n_confirm: 8
  n_escalate: 20
  n_ceiling: 20
  permitted_escalations: 1
  significance_margin: 0.004
  significance_predicate: (3.28 - avg_loss) * n ** 0.5 >= 0.004
  seed_selection: after submission, by the bound derivation from the submission digest

outcome_states:
  established:
    reason_code: significance-established
    condition: the target was reached on the re-executed seeds and sep >= 0.05
    classification: pass
  unproven:
    reason_code: significance-unestablished-at-ceiling
    condition: >-
      the run COMPLETED, the target was reached on the re-executed seeds, the seed
      budget was the binding limit, and the measured separation did not clear the
      bound margin of 0.05
    classification: unproven, distinct from failed
    binomial_trial_treatment: pass
    binomial_trial_treatment_authority: >-
      seed/contract.yaml families.entries.F1.scope.checker_obligations.verification_parameters.ladder.unproven_outcome.binomial_trial_treatment.
      Bound before any rollout and frozen for the pilot window. This lane transcribes
      it and does not re-decide it.
  failed:
    reason_codes: [screen-target-not-reached, crossing-not-sustained, early-stop-not-a-crossing, verifier-timeout-exceeded, frozen-axis-moved, graded-weights-not-harness-owned, graded-readout-smoothed, evaluation-grid-not-verifier-scheduled, claim-exceeds-reexecution]
    classification: failed, not unproven
    never_conflated_with_unproven: >-
      The contract draws this distinction for verifier timeouts, calling a timed-out
      run failed and not unproven. This slot mirrors that discipline in the opposite
      direction: a completed run whose seed budget was the binding limit is unproven
      and not failed.

checkers:
  - id: target_reached_on_reexecuted_seeds
    reduction: EFFECT
    zero_reason: screen-target-not-reached
    required: true
  - id: graded_readout_is_unsmoothed
    reduction: VALUE
    zero_reason: graded-readout-smoothed
    required: true
  - id: crossing_is_sustained
    reduction: INVARIANT
    zero_reason: crossing-not-sustained
    required: true
  - id: early_stop_is_not_a_crossing
    reduction: ABSENCE
    zero_reason: early-stop-not-a-crossing
    required: true
  - id: evaluation_grid_is_verifier_scheduled
    reduction: ORDERING
    zero_reason: evaluation-grid-not-verifier-scheduled
    required: true
  - id: graded_weights_are_harness_owned
    reduction: VALUE
    zero_reason: graded-weights-not-harness-owned
    required: true
  - id: frozen_axes_survive_reexecution
    reduction: EFFECT
    zero_reason: frozen-axis-moved
    required: true
  - id: claim_reconciles_with_reexecution
    reduction: DIVERGENCE
    zero_reason: claim-exceeds-reexecution
    required: true
  - id: significance_separation_cleared
    reduction: DIVERGENCE
    zero_reason: significance-unestablished-at-ceiling
    required: false

