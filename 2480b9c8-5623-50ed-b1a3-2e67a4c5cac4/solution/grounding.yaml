# FORGE-CANARY-END
# Private derivation source for slot OER-03.
#
# This file is the ONE source from which solution/recompute.py derives every
# generated artifact in this bundle: the golden trajectory, the checker
# fixtures, solution/solve.sh, solution/TRUTH.md, solution/rubrics.json,
# tests/golden.json and tests/test_output.py.
#
# recompute.py invokes no model, no network, no clock, no locale and no random
# source. Every number below is written here explicitly rather than sampled, so
# running recompute.py twice over frozen bytes produces byte-identical output.
#
# Never shipped to the agent surface: Harbor assembles a non-oracle agent
# surface out of task.toml, instruction.md and environment/ only, so solution/
# and tests/ are absent from it by construction rather than by a filter.

schema: forge.grounding/v1
slot: OER-03
provisional_identifier: OER-03
family: F1
family_title: nanogpt optimizer speedrun
primary_archetype: AR6
primary_archetype_title: Silent Execution Failures
archetype_exclusivity: >-
  Exactly one primary archetype, fixed at scope time in seed/contract.yaml
  families.entries.F1.scope.slots.records for slot OER-03. No second archetype is
  authored here and no buffet is assembled.

title: Silent non-convergence under a schedule that outruns the target crossing

objective: >-
  Reach the target validation loss in fewer steps where the graded step count is
  the crossing point rather than the schedule length, so a schedule extended past
  the crossing buys nothing and a run that silently fails to converge is graded as
  such rather than as an absent result.

# ---------------------------------------------------------------------------
# Anchors. Transcribed, never invented.
# ---------------------------------------------------------------------------
anchors:
  state: measured
  metric: optimizer steps to reach target validation loss
  direction: lower
  baseline_metric: 3250
  baseline_identity: >-
    upstream record 36, tuned Muon with aux AdamW, validation loss 3.2787 at n
    equal to ten, stat-verified, dated 2026-06-11
  target_metric: 2690
  target_identity: >-
    upstream record 46, the current world record, validation loss 3.2783 at n
    equal to eight, stat-verified, dated 2026-06-19
  pass_threshold: 0.65
  authority: requirements/bia-environment-spec.md lines 297 to 321
  reward_formula: raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)
  reward_clip: score = min(max(raw, 0.0), 1.0)
  reward_full: 1.0
  bar_semantics: >-
    Reaching the target scores exactly 1.0 and beating it also scores 1.0. The
    target is a bar, not a point on a gradient.

# ---------------------------------------------------------------------------
# Tiering. Recorded, never argued.
# ---------------------------------------------------------------------------
tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: capped below Hard
  perception_axis_exemption: >-
    This task family is text and code only, so the Perception axis carries no
    category. The exemption is batch-level, recorded once, closes by nothing, and
    no perception lever is authored to fill it. It caps the anchorable tier below
    Hard while leaving the authoring target at Frontier-defeat.
  no_difficulty_claim: >-
    No difficulty claim appears anywhere in this bundle. The design obligation to
    grade the quantity rather than the readout is a correctness obligation and is
    never restated as a difficulty argument.

# ---------------------------------------------------------------------------
# Bound grants. Transcribed from seed/contract.yaml batch.optimization_bindings.
# ---------------------------------------------------------------------------
bindings:
  tags: [optimization, bounded-continuous]
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts
  budget_hours: 0.12
  budget_hours_minutes: 7.2
  budget_hours_role: per-attempt completion bound
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  max_attempts: 50
  final_selection: best
  budget_envelope: one H100, single accelerator, no multi-GPU scaling
  budget_margin: 10 percent
  compute_envelope_accelerators: 1
  image: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407

solver_egress_divergence:
  bound_here: open
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the
    solving model full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 answers
    that internet is needed only for setup.
  batch_field: >-
    seed/contract.yaml batch.optimization_bindings.solver_egress currently reads
    setup-only, bound under the stricter reading.
  gap_id: gap-oer-solver-egress-ruled-stricter
  this_lane_does_not_amend_the_batch_field: true
  divergence_is_recorded_never_silent: >-
    This slot binds solver_egress open at the agent surface, per the lane brief
    and per the family delivery.network_policy block that binds egress allowed
    with the upstream deny-list, while seed/contract.yaml keeps setup-only. The
    two readings are named here so the divergence is a recorded byte rather than
    an accident.
  verifier_surface: >-
    The verifier keeps egress denied. The two surfaces differ by design and both
    are bound in task.toml.
  deny_list_is_not_a_containment_proof: >-
    Mirrors, caches, paraphrased write-ups and model weights all carry a recipe
    past any deny-list. The deterministic checker, and not the network policy, is
    the load-bearing control. The deny-list narrows a convenience path and proves
    nothing about containment.
  deny_list: [github.com, raw.githubusercontent.com, objects.githubusercontent.com]

# ---------------------------------------------------------------------------
# The graded quantity. This is the centre of the slot.
# ---------------------------------------------------------------------------
graded_quantity:
  token: crossing_step
  definition: >-
    The graded step is the FIRST verifier-scheduled evaluation point at which the
    verifier's own unsmoothed evaluation of the harness-owned weights on the
    frozen held-out split falls below the bound target loss, AND at which that
    condition still holds at the bound number of subsequent verifier-scheduled
    evaluation points.
  never: >-
    It is never a number the training loop reported, never a number in the
    submission's stdout, never a field the submission wrote, never the schedule
    length, and never a smoothed or blended readout.
  schedule_extension_buys_nothing: >-
    Two runs whose evaluations agree up to and past the sustained crossing score
    identically, whatever their schedule lengths. Proved by a negative control.
  non_convergence_is_graded: >-
    A run that does not reach a sustained crossing is graded as a failure with a
    machine-readable reason. It is never reported as an absent result, never
    allowed to fall through to a default, and never allowed to fall through to
    silence. This is the slot's archetype, AR6, applied to the metric.
  verifier_aborting_is_also_graded: >-
    The same obligation applies to the grading path itself. An aborted verifier
    still writes a reward with a reason, because a verifier that dies quietly is
    the same defect one layer up.

# ---------------------------------------------------------------------------
# Verifier-owned bound state. The post-drift values are the delivered ones.
# ---------------------------------------------------------------------------
bound_state:
  target_loss: 3.2790
  eval_stride: 100
  sustain_points: 3
  readout_filter_admitted: raw
  weights_digest_domain: bia/oer-03/weights/v2
  graded_quantity: crossing_step
  max_schedule_steps: 4000
  frozen_batch_size: 480
  frozen_fwd_bwd_per_step: 1
  frozen_dataset_digest: d1a7e2b6f0c94d3a8e5b1c07f42d9a63b8e0c5147d2a9f3b6e8c04a17d5b29e3
  frozen_architecture_digest: a4c8f1d09b2e7635c0a91d84fe3b2705d6c9a83f1e40b7d259c6a3f08e12b4d7

pre_drift_state:
  target_loss: 3.2800
  eval_stride: 125
  sustain_points: 2
  weights_digest_domain: bia/oer-03/weights/v1
  frozen_batch_size: 512

# ---------------------------------------------------------------------------
# The golden trajectory. Written out point by point, never sampled.
# ---------------------------------------------------------------------------
golden:
  reference_carrier: solution/reference.py
  schedule_length: 3000
  steps_executed: 3000
  run_status: completed
  stopped_by: schedule-end
  params_digest_seed: bia-oer-03-reference-params
  # step -> the verifier's own unsmoothed validation loss on the frozen split.
  # Monotone decreasing by construction. The two rows at 2500 and 2600 are the
  # rows the target-loss drift separates: 3.27945 sits below the pre-drift bar
  # 3.2800 and above the bound bar 3.2790, so a stale answer computed against the
  # pre-drift bar names 2500 where the bound bar names 2600.
  series:
    100: 4.92100
    200: 4.21300
    300: 3.86400
    400: 3.67200
    500: 3.55100
    600: 3.47000
    700: 3.41300
    800: 3.37100
    900: 3.34000
    1000: 3.31700
    1100: 3.30000
    1200: 3.29400
    1300: 3.29000
    1400: 3.28700
    1500: 3.28500
    1600: 3.28350
    1700: 3.28230
    1800: 3.28140
    1900: 3.28075
    2000: 3.28050
    2100: 3.28035
    2200: 3.28030
    2300: 3.28025
    2400: 3.28020
    2500: 3.27945
    2600: 3.27880
    2700: 3.27840
    2800: 3.27815
    2900: 3.27800
    3000: 3.27790
  expected_graded_step: 2600
  expected_crossing_under_pre_drift_bar: 2500
  expected_reward: 1.0
  expected_reward_derivation: >-
    raw = (3250 - 2600) / (3250 - 2690) = 650 / 560 = 1.160714..., clipped to 1.0.
    The reference beats the target bar, and beating the bar scores exactly 1.0.
  extension_control:
    schedule_length: 6000
    extra_points: 30
    decrement_per_point: 0.00002
    expected_graded_step: 2600
    expected_reward: 1.0
    statement: >-
      Identical evaluations through the sustained crossing, a schedule twice as
      long, and thirty further evaluation points that stay below the bar. The
      graded step and the reward must be byte-identical to the unextended run.

golden_provenance:
  kind: derived-fixture
  measured: false
  statement: >-
    The series above is an authored deterministic fixture, not a recorded GPU
    rollout. No training run was performed by this lane and none is claimed. The
    fixture exists so the live checkers can be exercised on both halves without a
    accelerator, and it is labelled as derived everywhere it is carried.
  gap_id: gap-oer-03-golden-trajectory-derived-not-measured

# ---------------------------------------------------------------------------
# Checker fixtures. One accepting fixture and one planted defect per checker,
# plus the four stale controls the drift schedule binds and the negative
# controls the feasibility bundle requires.
# ---------------------------------------------------------------------------
fixtures:
  accepting:
    id: fx-reference-accepted
    kind: accept
    statement: The reference trajectory clears every checker and scores exactly 1.0.
  planted:
    - id: fx-no-op-submission
      kind: reject
      checker: run_produced_verifier_owned_state
      zero_reason: run-produced-no-verifier-state
      mutate: no_evaluations
      statement: >-
        A submission that produces nothing. The run status is crashed and the
        verifier owns no evaluated state, so the run is graded a failure with a
        reason rather than reported absent.
    - id: fx-weights-domain-stale
      kind: reject
      checker: evaluated_weights_owned_by_the_harness
      zero_reason: weights-not-harness-owned
      mutate: stale_weights_domain
      stale_control: ctl-weights-domain-stale
      statement: >-
        Evaluation digests bound under the pre-drift weights domain, which is a
        pre-mutation answer carried forward.
    - id: fx-submission-selected-checkpoint
      kind: reject
      checker: evaluated_weights_owned_by_the_harness
      zero_reason: weights-not-harness-owned
      mutate: submission_selected_weights
      statement: >-
        Weights the submission selected rather than the weights the harness owns
        at that step.
    - id: fx-evaluation-order-broken
      kind: reject
      checker: evaluation_points_ascend_on_the_verifier_schedule
      zero_reason: evaluation-order-violated
      mutate: descending_evaluations
      statement: An evaluation series that does not ascend on the verifier's own grid.
    - id: fx-readout-smoothed
      kind: reject
      checker: graded_readout_unsmoothed
      zero_reason: readout-smoothed
      mutate: ema_filter
      statement: >-
        An EMA-blended readout on the graded path. The submission may smooth for
        its own use; the graded quantity is recomputed unsmoothed.
    - id: fx-crossing-not-sustained
      kind: reject
      checker: crossing_sustained_across_verifier_evaluations
      zero_reason: crossing-not-sustained
      mutate: unsustained_dip
      stale_control: ctl-sustain-window-stale
      statement: >-
        A single favourable evaluation followed by a rebound above the bar. Under
        the pre-drift sustain window of two points this would have been harvested.
    - id: fx-early-stop
      kind: reject
      checker: early_stop_is_not_a_crossing
      zero_reason: early-stop-without-sustained-crossing
      mutate: early_stop
      statement: >-
        A run halted at a favourable evaluation without executing the steps the
        sustain window needs.
    - id: fx-non-convergence-ungraded
      kind: reject
      checker: non_convergence_graded_as_failure_with_a_reason
      zero_reason: non-convergence-ungraded
      mutate: outcome_without_reason
      statement: >-
        A non-converging run whose outcome document carries no reason and no
        explicit graded_step key, so the failure would leave the grader as an
        absent result rather than as a graded zero.
    - id: fx-graded-step-is-schedule-length
      kind: reject
      checker: graded_step_is_the_crossing_not_the_schedule
      zero_reason: graded-step-not-the-crossing
      mutate: graded_step_from_schedule
      statement: The schedule length substituted for the crossing point.
    - id: fx-crossing-bar-stale
      kind: reject
      checker: graded_step_is_the_crossing_not_the_schedule
      zero_reason: graded-step-not-the-crossing
      mutate: stale_target_bar
      stale_control: ctl-crossing-bar-stale
      statement: >-
        A graded step computed against the pre-drift target bar, which names 2500
        where the bound bar names 2600.
    - id: fx-reported-crossing-diverges
      kind: reject
      checker: reported_crossing_matches_recomputed_crossing
      zero_reason: reported-crossing-diverges
      mutate: reported_crossing_early
      statement: >-
        A submission reporting a crossing at 2000 that the verifier's own
        recomputation does not find.
    - id: fx-frozen-batch-stale
      kind: reject
      checker: frozen_axes_held
      zero_reason: frozen-axis-moved
      mutate: stale_batch_size
      stale_control: ctl-frozen-batch-stale
      statement: >-
        A run at the pre-drift batch size, which is both a frozen-axis breach and
        a pre-mutation answer carried forward.

# ---------------------------------------------------------------------------
# Statement ambiguity. Two independent readings, one graded quantity.
# ---------------------------------------------------------------------------
statement_ambiguity:
  reading_a_source: the fenced declaration block in instruction.md
  reading_a_marker: "GRADED-QUANTITY:"
  reading_b_source: the prose sentence under the heading "What is graded"
  reading_b_marker: "The graded quantity is"
  both_reduce_to: crossing_step
  forbidden_alternatives: [schedule_length, reported_loss, wall_clock, smoothed_loss]
  rule: >-
    Every occurrence of a graded-quantity declaration in instruction.md must
    resolve to the single token crossing_step, and every forbidden alternative
    must appear only inside an explicitly negated sentence. Exactly one graded
    outcome, checked mechanically in seed/tasks/OER-03/adequacy.py.

# ---------------------------------------------------------------------------
# Rubric source. tests/rubrics.jsonl judges the trajectory and is hand-authored.
# solution/rubrics.json grades the solution against its reference answer and is
# generated from the rows below.
# ---------------------------------------------------------------------------
solution_rubric_rows:
  - id: sol-graded-step-matches-reference
    criterion: >-
      The submitted run's graded step, recomputed by the verifier, is at or below
      the reference graded step of 2600.
    reference_value: 2600
  - id: sol-crossing-sustained
    criterion: >-
      The crossing holds at the graded step and at each of the three subsequent
      verifier-scheduled evaluation points.
    reference_value: 3
  - id: sol-readout-unsmoothed
    criterion: The graded readout is the raw verifier evaluation, with no filter applied.
    reference_value: raw
  - id: sol-frozen-axes-held
    criterion: >-
      Dataset, batch size, architecture and the one-forward-backward-pass-per-step
      rule are unmoved.
    reference_value: 480
  - id: sol-schedule-extension-inert
    criterion: >-
      Extending the schedule past the sustained crossing changes neither the
      graded step nor the reward.
    reference_value: 1.0
  - id: sol-non-convergence-attributed
    criterion: >-
      A run that fails to reach a sustained crossing leaves a reward of 0.0
      carrying a machine-readable reason, never an absent result.
    reference_value: non-convergence-ungraded

# ---------------------------------------------------------------------------
# Generated artifacts. recompute.py owns every path below.
