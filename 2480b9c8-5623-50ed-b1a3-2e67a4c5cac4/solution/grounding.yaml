    reason: two-bound-reward-paths-for-one-contract
    statement: >-
      The lane brief binds tests/checkers.yaml reward_path to
      /logs/verifier/reward.json while seed/forge/verifier.py REWARD_PATH, the
      live instrument that audits this bundle, binds /logs/verifier/reward.txt and
      reports reward-path-unbound for anything else.
    resolution_in_this_slot: >-
      tests/checkers.yaml declares reward_path /logs/verifier/reward.txt, the path
      the live instrument enforces, and declares reward_document_path
      /logs/verifier/reward.json alongside it. tests/test.sh writes BOTH on every
      exit path: the bare float to reward.txt and the full attributed document to
      reward.json. Neither contract is silently dropped.
    owner: the batch, through seed/contract.yaml delivery bindings
    related_gap: gap-oer-delivery-bindings-unpinned
  - id: gap-oer-03-golden-trajectory-derived-not-measured
    reason: fixture-derived-not-measured
    statement: >-
      The golden loss series is an authored deterministic fixture. No training run
      was performed by this lane and no measured rollout is claimed for it.
    consequence: >-
      The checker adequacy proof is a proof about the checkers, not a measurement
      of the reference recipe on the reference machine.
    remedy: >-
      Re-derive the series from a measured single-H100 run of solution/reference.py
      on the reference machine and replace it here, then re-run recompute.py.
  - id: gap-oer-scaled-operating-point-unmeasured
    reason: budget-unverified
    statement: >-
      reference_hours is projected from the only per-step cost seed/contract.yaml
      records for F1, 155 ms per step for the baseline recipe, and the projection
      exceeds budget_hours.
    consequence: BLOCK:INFEASIBLE_OR_UNVERIFIED
    carried_from: seed/contract.yaml declared_gaps

