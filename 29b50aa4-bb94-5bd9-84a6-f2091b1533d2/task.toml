# OER-09, family F12 data curation, archetype AR6 silent execution failures.
# schema_version is a top-level scalar and must stay above the first table header:
# TOML scopes every key to the most recent header, so an assignment written below
# [task] silently becomes task.schema_version while still reading correct.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-09-silent-filter-failure"
version = "1.0.0"
description = """
Curate a source document pool so that a model trained under a frozen budget, a frozen
architecture and a frozen optimizer reaches a lower validation loss on a frozen held-out
split. The curation filter chain is the only free axis. The filter runner in this
environment fails open: a predicate that resolves no field matches nothing, and the runner
still exits zero and reports success while emitting the source pool unchanged.
"""
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "data-curation", "silent-failure"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-09"
provisional_identifier = "OER-09"
title = "Silent filter failure that leaves the pool unchanged"
family = "F12"
family_title = "data curation"
primary_archetype = "AR6"
primary_archetype_title = "Silent Execution Failures"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_basis = "Standing batch-level Perception-axis exemption. This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.metric]
quantity = "validation loss of the trained model"
direction = "lower"
graded_by = "verifier"
computed_on = "the frozen held-out split, from harness-owned weights, at the bound evaluation point"
never_from = [
  "a number the training loop reported",
  "a number in the submission's stdout",
  "a field the submission wrote",
]
smoothing_on_graded_path = false

[metadata.metric.anchors]
state = "absent"
authority = "This family is unscoped and carries no published anchor, so the schema is bound and the numbers are declared absent rather than invented."
reward_formula_lower_is_better = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
normalisation_operated = "raw = (control_loss - graded_loss) / (control_loss - reference_loss)"
normalisation_note = "control_loss and reference_loss are measured by the harness inside this same run and are live state, not published evidence. They are explicitly NOT the family baseline and target anchors, which remain absent."

[metadata.frozen]
axes = ["token_budget", "model", "optimizer", "corpus", "evaluation_split"]
# 800 optimizer steps at the canonical 524288 tokens per step, covering the evaluation
# schedule through its last point. The substrate declaration is the authority on the batch.
token_budget_tokens = 419430400
tokens_per_step = 524288
steps = 800
substrate = "environment/nanogpt_substrate.json"
model = "environment/frozen_config.yaml [model]"
optimizer = "environment/frozen_config.yaml [optimizer]"
corpus = "environment/frozen_config.yaml [corpus]"
evaluation_split = "environment/frozen_config.yaml [evaluation]"

[metadata.free]
axes = ["curation_filter_chain"]
surface = "the curation filter chain applied to the source pool under environment/pool/"

[metadata.reward]
kind = "single float"
interval = "[0.0, 1.0]"
direction = "higher is better"
binary = false
full_reward = 1.0
carrier = "/logs/verifier/reward.txt"
reason_carrier = "/logs/verifier/score.json"
zero_carries_reason = true

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours bounds the session across attempts; budget_hours bounds one
# attempt, being six hours over fifty attempts, 0.12 hours or 7.2 minutes. They
# are explicitly distinct and never aliases.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_note = "The solving agent has open egress at the solver surface inside the sandbox so it can fetch its own packages, datasets and models. The divergence from the stricter batch reading is recorded in solution/grounding.yaml under solver_egress_divergence."
entry_point = "solution/solve.sh"
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
