schema: forge.grounding/v1

# PRIVATE derivation source for OER-09. This file is hand-authored and is the ONLY thing
# solution/recompute.py reads. Every generated artifact in this bundle is derived from these
# bytes: the golden trajectory, the checker fixtures, solve.sh, TRUTH.md, rubrics.json and
# tests/test_output.py. recompute.py invokes no model, no network, no clock, no locale and no
# random source, so running it twice over frozen bytes produces byte-identical output.

slot: OER-09
family: F12
family_title: data curation
primary_archetype: AR6
primary_archetype_title: Silent Execution Failures
title: Silent filter failure that leaves the pool unchanged

generated_artifacts:
  - solution/solve.sh
  - solution/TRUTH.md
  - solution/rubrics.json
  - solution/golden_trajectory.json
  - solution/fixtures.json
  - tests/expected_pool.py
  - tests/test_output.py

banner: "GENERATED SECTION. DO NOT HAND-EDIT."
banner_source: solution/grounding.yaml

reference_binding:
  path: solution/reference.py
  identity: oer-09-reference-curation-verified-against-harness-observation
  sha256: "093c37b8571115d3e2210e96c5d90237b5cdea5807f1f4b894deb4534b4acc1e"
  binding_note: >-
    adequacy.py recomputes this digest from the bytes on disk and asserts equality before it
    drives the accepting half. That is what makes the accepting half prove the checkers accept
    THIS reference rather than merely some file.

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  authority: "seed/contract.yaml families.entries.F12 carries scope_state unscoped and scope null."
  formula_bound: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
  formula_operated: "raw = (control_loss - graded_loss) / (control_loss - reference_loss)"
  clip: "score = min(max(raw, 0.0), 1.0)"
  substitute_note: >-
    control_loss and reference_loss are measured by the harness inside the same run and are
    live state. They are NOT the family baseline and target anchors, which remain absent, and
    nothing in this bundle presents them as published evidence.

solver_egress_divergence:
  bound_here: open
  contract_field: "seed/contract.yaml batch.optimization_bindings.solver_egress"
  contract_value: setup-only
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: "requirements/open-ended-research-optimisation-problems.md line 58 grants full internet access to the solving agent."
  reading_b: "requirements/open-ended-research-optimisation-problems.md line 122 says internet is needed only for setup, and requirements/bia-environment-spec.md line 247 takes the stricter reading."
  resolution: >-
    This lane binds solver_egress open in task.toml because the family delivery.network_policy
    block binds agent_environment egress allowed with the upstream deny-list, and because an
    agent that cannot fetch its own packages cannot attempt the task at all. The batch-level
    field is NOT amended by this lane. The divergence is recorded here so it is never silent.
  deny_list_is_not_containment: >-
    The upstream deny-list covers github.com, raw.githubusercontent.com and
    objects.githubusercontent.com. It is not a containment proof. Mirrors, caches, paraphrased
    write-ups and released model weights all carry a recipe past any deny-list, which is
    exactly why the deterministic checker and not the network policy is the load-bearing
    control in this bundle.

envelope:
  max_timeout_hours: 6.0
  max_timeout_role: "refinement-loop terminator across attempts"
  budget_hours: 0.12
  budget_hours_role: "per-attempt completion bound, 7.2 minutes"
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  max_attempts: 50
  final_selection: best
  compute_envelope_accelerators: 1
  budget_margin: "10 percent"
  reference_hours: 0.0975

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  anchorable_tier: "capped below Hard"
  perception_axis_exemption: >-
    This task family is text and code only, so the Perception axis carries no category; the
    exemption is batch-level, recorded once, closes by nothing, and no perception lever is
    authored to fill it. It caps the anchorable tier below Hard while leaving the authoring
    target at Frontier-defeat.

pool:
  register_path: environment/pool/source_register.jsonl
  documented_schema: "curation/v3"
  documented_quality_field: "quality_bucket"
  observed_schema: "curation/v4"
  observed_quality_field: "quality.bucket"
  drift_note: >-
    environment/pool/REGISTER.md documents the v3 flat field. The register itself and
    environment/frozen_config.yaml carry v4, where the bucket is nested under quality.bucket.
    A predicate naming the documented field resolves nothing and matches nothing, and the
    runner's inapplicable-stage guard restores the pool while leaving the claim in place.
  source_documents: 4096
  source_tokens: 1700736
  source_digest: "sha256:e6906c89673963d9bc1dfa408364782e482e9e8ab5cb3d8a9c5e765c0f1bdf4e"
  curated_documents: 1959
  curated_digest: "sha256:fe709861d7cfc56ffec223e6f4ea81e1bba9265762adc4e5a311816324ee1ea9"
  curated_tokens: 815884
  holdout_documents: 455
  stage_counts: [4096, 3072, 2939, 2613, 1959]
  match_count: 2137

# The discovery values. Each one is obtainable ONLY by interacting with the live environment:
# running environment/curate.py over environment/pool/source_register.jsonl with a chain that
# names the field the register actually carries, then reading the harness's own observation.
# Neither number appears anywhere on the agent-visible surface. Each row below names the
# GRADED checker whose outcome depends on the value, so a decorative discovery value is
# visible here as an empty `graded_by`.
discovery_values:
  - name: curated_documents
    value_from: pool.curated_documents
    established_by: >-
      environment/curate.py applied to environment/pool/source_register.jsonl under
      reference_chain reduces 4096 documents through 3072, 2939, 2613 to 1959. The harness
      records its own count of the reference arm at /logs/harness/reference_arm.json.
    read_back_from: "/logs/harness/reference_arm.json curated_documents, stage_counts, curated_digest"
    graded_by: reference_arm_curation_is_bound
    rejecting_controls: [nc-reference-arm-document-count-wrong, nc-reference-arm-digest-drift, nc-reference-arm-loss-not-the-arm]
  - name: curated_tokens
    value_from: pool.curated_tokens
    established_by: >-
      environment/curate.py sums the register's own `tokens` field over the surviving rows.
      The reference chain's 1959 surviving documents carry 815884 tokens against the source
      pool's 1700736. curate.py writes the submission's own count into
      work/curation_report.json, which the harness captures verbatim as the claim.
    read_back_from: "/logs/harness/reference_arm.json curated_tokens, against /logs/harness/pool_observed.json and /logs/harness/curation_claim.json"
    graded_by: curated_token_accounting_matches_observation
    rejecting_controls: [nc-reference-token-total-wrong, nc-claimed-token-accounting-diverges, nc-token-total-not-reduced]

reference_chain:
  - {name: drop-junk-and-low, field: "quality.bucket", op: drop_in, values: [junk, low]}
  - {name: english-only, field: "lang", op: keep_in, values: [en]}
  - {name: drop-holdout, field: "holdout", op: drop_true}
  - {name: dedup-by-group, field: "dup_group", op: first_per_group}

