statement_ambiguity:
  marker: "GRADED-QUANTITY:"
  minimum_occurrences: 2
  expected_distinct_readings: 1
  reading_note: >-
    instruction.md states the graded quantity twice, once under "What is graded" and once
    under "Scoring". Both readings must collapse to the identical string, so the instruction
    admits exactly one graded outcome.

golden_trajectory:
  - step: 1
    action: "read instruction.md and environment/frozen_config.yaml"
    establishes: "the frozen axes and the fact that the verifier recomputes the graded loss itself"
  - step: 2
    action: "read environment/pool/REGISTER.md, then read the first line of environment/pool/source_register.jsonl"
    establishes: "REGISTER.md documents quality_bucket; the register carries quality nested under quality.bucket. The documentation is stale."
  - step: 3
    action: "write a filter chain naming quality.bucket, lang, holdout and dup_group"
    establishes: "a chain expressed against the field the register actually carries"
  - step: 4
    action: "run environment/curate.py --filters work/filters.json --out work/curated_pool.jsonl --explain"
    establishes: "exit status 0 and status: ok, which on its own establish nothing"
  - step: 5
    action: "run environment/pool_probe.py and compare the harness-observed digest against the claimed digest"
    establishes: "the pool actually moved from 4096 documents to 1959, before any training token is spent"
  - step: 6
    action: "run environment/train.py --pool work/curated_pool.jsonl"
    establishes: "the frozen budget is fed once over the curated pool"
  - step: 7
    action: "let the verifier's evaluation schedule complete through the last scheduled point"
    establishes: "the improvement is re-tested at the bound point and at both sustain points"

truth:
  graded_quantity: "the validation loss the verifier computes on the frozen held-out split, from harness-owned weights, at the bound evaluation point, unsmoothed"
  the_trap: >-
    curate.py restores the pool when a stage matches nothing and does not restore the claim.
    Exit status 0 and status "ok" mean the chain did not raise. They do not mean the pool moved.
  the_tell: >-
    /logs/harness/pool_observed.json carries the harness's own observation. When curated_digest
    equals source_digest the filter failed open, whatever the report says.
  the_skill: "compare the claim against the observation BEFORE spending the token budget"

solution_rubrics:
  - id: used-the-register-not-the-documentation
    criterion: "The reference filter chain names quality.bucket, the field the register carries, and not quality_bucket, the field REGISTER.md documents."
    weight: 3
  - id: verified-the-pool-moved-before-training
    criterion: "The reference reads /logs/harness/pool_observed.json and refuses to train when curated_digest equals source_digest."
    weight: 4
  - id: reached-the-reference-pool-exactly
    criterion: "The reference chain reduces 4096 documents to 1959 through the recorded stage counts 4096, 3072, 2939, 2613, 1959."
    weight: 3
  - id: left-every-frozen-axis-alone
    criterion: "The reference moves only the curation filter chain: the token budget, the model, the optimizer and the evaluation split are untouched."
    weight: 3
  - id: reported-no-loss-of-its-own
    criterion: "The reference prints no validation loss and writes no loss field; the graded number comes from the verifier's own recomputation."
    weight: 2
  - id: dropped-the-holdout-documents
    criterion: "The reference drops every document carrying holdout true, so no held-out document reaches the fed training stream."
    weight: 3

