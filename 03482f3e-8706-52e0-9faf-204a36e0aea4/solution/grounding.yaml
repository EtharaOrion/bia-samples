archetype: AR5

# THE SINGLE DERIVATION SOURCE for this slot. solution/recompute.py derives the
# golden trajectory, the checker fixtures, solve.sh, TRUTH.md, rubrics.json and
# tests/test_output.py from this file and from nothing else. recompute.py invokes no
# model, no network, no clock, no locale and no random source, so running it twice
# over frozen bytes produces byte-identical output.

# ---------------------------------------------------------------------------
# RE-BASE, batch OER-2026-08-20. What moved and why.
# ---------------------------------------------------------------------------
rebase:
  pass: OER-2026-08-20
  kind: replacement-of-the-training-and-evaluation-path
  kind_note: >-
    NOT a declaration-level repin. The surrogate here was not a model at all: the
    graded quantity came off a bigram count table with a two-level interpolation,
    trained by a streaming counter over a corpus of 21599 bytes that
    environment/build_corpus.py generated by walking a pool of forty authored
    sentences with fixed index arithmetic. Neither half of that could be repinned,
    so both were replaced.
  moved:
    - "environment/nanogpt_substrate.json is replicated byte for byte from .seed/nanogpt_substrate.json, so this slot reads no sibling's bytes."
    - "The corpus moved from the generated sentence pool to FineWeb10B, data/fineweb10B/fineweb_train_*.bin, staged by environment/build_corpus.py, which now stages shards instead of generating text."
    - "The model moved from a bigram count table to the canonical 12-layer 768-dimension decoder of the substrate, at vocab_size 50304, head_dim 128, num_heads 6 and seq_len 1024."
    - "The compute budget kept its integer, 2200, and moved its unit from token positions visited to optimizer steps at 524288 tokens each, one forward and one backward pass per step."
    - "The evaluation surface moved from environment/corpus/eval.txt, which the solver could read, to a held-out FineWeb slice staged into the verifier image alone and resolved from tests/anchors.json."
    - "The reward-scale floor moved from a literal measured on the retired substrate to a paired training run the verifier performs in the same grading pass, so no reading of the graded metric is a literal anywhere in this bundle."
    - "The checker train_corpus_merge_capacity was retired with the corpus it read and replaced by snapshot_shapes_match_substrate, which carries the first limb of the simulator test as a graded criterion."
  retired:
    - "environment/corpus/train.txt and environment/corpus/eval.txt, the generated stand-in corpora, now retirement stubs that environment/Dockerfile no longer copies."
    - "Every measured operating point of the retired substrate, declared unmeasured rather than carried forward onto a substrate they never described."

# ---------------------------------------------------------------------------
# THE SIMULATOR TEST, applied to these bytes before the slot was handed back.
# ---------------------------------------------------------------------------
simulator_test:
  weights_in_the_loop:
    verdict: pass
    evidence: >-
      The graded artifact is a parameter snapshot of environment/harness.py GPT,
      instantiated from the substrate architecture and shape-bound to vocab_size
      50304, num_layers 12, model_dim 768 and head_dim 128. The snapshot digest is
      taken over the parameter bytes rather than over a summary of them, and
      tests/checkers.check_snapshot_shapes_match_substrate derives the expected
      tensor shapes from the verifier's own architecture copy and refuses any
      snapshot that does not carry all 50 tensors summing to 162201600 parameters.
  verifier_recomputes:
    verdict: pass
    evidence: >-
      The graded scalar is computed by tests/runner.py in the verifier's own
      process, from the parameters the harness held at the bound step, over a
      held-out FineWeb slice staged by tests/Dockerfile into the verifier image
      alone. environment/harness.py resolves no evaluation split of its own: the
      bytes are passed in, and called without them the harness returns telemetry
      whose graded reading is absent. The split is pinned to the verifier's copy
      in tests/anchors.json, not resolved dynamically from a solver-reachable
      call, and check_denominator_is_held_out_slice_bytes refuses a run whose
      readout names anything but the caller as the resolver.
  no_forward_pass_no_score:
    verdict: pass
    evidence: >-
      Delete the forward and backward pass from environment/harness.py run and the
      metric becomes undefined rather than different: no parameters move, no
      snapshot digest advances past the progress points, and bits_of has no
      trained model to take log probabilities from. There is no counter that keeps
      emitting an integer and no count table that keeps emitting a loss, because
      neither exists any more.

identity:
  title: "Tokenizer option expansion beyond the default construction"
  metric: "bits per byte at fixed compute"
  direction: lower
  tags: [optimization, bounded-continuous]
  image: "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"

frozen_axes:
  architecture: "the canonical decoder of environment/nanogpt_substrate.json: vocab_size 50304, num_layers 12, model_dim 768, head_dim 128, num_heads 6, seq_len 1024"
  parameter_count: 162201600
  compute_budget_steps: 2200
  batch_tokens_per_step: 524288
  forward_passes_per_step: 1
  backward_passes_per_step: 1
  init_seed: 0
  optimizer: "adamw, betas 0.9 and 0.95, weight decay 0.1, peak learning rate 0.0018, linear warmup over 128 steps then linear decay across the budget"
  corpus: "FineWeb10B, data/fineweb10B/fineweb_train_*.bin, staged by environment/build_corpus.py"
  evaluation_slice: "a held-out FineWeb validation slice the verifier owns, absent from environment/ and from every agent-visible path"
  encoder: "greedy longest match, maximum token length 16 bytes"
  vocab_budget: 50304

free_axis: "the construction of the vocabulary"

# ---------------------------------------------------------------------------
# OPERATING POINTS. Every quantity below is either a property of bytes a reader
# can check without a GPU, or a separation this slot declares. NO value of the
# graded metric appears here, because none has been measured on this substrate
# and none may be invented. The floor of the reward scale is not here either: it
# is trained in the grading pass.
# ---------------------------------------------------------------------------
measured:
  state: unmeasured-on-nanogpt-substrate
  gap: gap-oer-15-operating-points-unmeasured-on-nanogpt-substrate
  note: >-
    The retired substrate carried a swept optimum, a worst row, a reference
    optimum, a plateau gap and a stability table across four compute budgets.
    Every one of those was measured against a bigram count table over a generated
    corpus, so none of them describes anything that still exists. They are
    declared unmeasured rather than carried forward, and the scoring path no
    longer needs them.
  default_construction: "environment/default_tokenizer.py, whole-word top-k frequency list"
  default_option_grid_rows: 60
  default_grid_max_top_k: 1024
  entries_beyond_single_bytes: 50048
  entries_the_handed_grid_cannot_reach: 49024
  structural_limit: >-
    A whole-word list can only contain whole whitespace-delimited words: nothing
    shorter, nothing longer, nothing crossing a word boundary. The arithmetic
    limit sits on top of the structural one and is checkable by reading one file:
    the grid's largest top_k is 1024 against 50048 available entries, so every row
    leaves at least 49024 entries unspent at any option value.
  paired_baseline_row:
    top_k: 1024
    min_frequency: 1
    lowercase: false
    attach_leading_space: true
  reference_construction: "solution/reference.py, greedy corpus-derived pair merges over FineWeb bytes"
  acceptance_separation_bpb: 0.02
  full_credit_separation_bpb: 0.05
  separations_state: "declared, uncalibrated on the nanoGPT substrate"
  separations_gap: gap-oer-15-separations-uncalibrated-on-nanogpt-substrate
  separations_note: >-
    The acceptance separation is the bound separation this slot carried before the
    re-base. The full-credit separation is the separation margin this slot's tier
    declares. Both are declarations of the slot and neither is a measurement, and
    the fact that neither has been calibrated against a real bits-per-byte spread
    on FineWeb is recorded under the gap above rather than hidden behind a figure
    nobody took.
  how_measured: >-
    The floor of the reward scale is measured by tests/runner.py during grading:
    it trains a second decoder on environment/default_tokenizer.build_vocab at the
    paired_baseline_row above, at the same seed, over the same shards, at the same
    2200-step budget, against the same held-out slice, and reads its bits per
    byte. Nothing about that reading is a literal in this bundle.

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  statement: >-
    seed/contract.yaml families.entries.F10 carries scope_state unscoped and scope
    null, so no published F10 anchor exists. The reward SCHEMA is bound in full and
    the two numeric anchors are declared absent rather than invented. The carriers
    the scoring path actually uses are the paired baseline reading the verifier
    trains during grading and the full-credit separation the verifier holds, and
    neither is presented as a family anchor.

reward:
  carrier: "/logs/verifier/reward.txt"
  carrier_form: "one bare float"
  score_document: "/logs/verifier/score.json"
  interval: [0.0, 1.0]
  direction: higher_is_better
  binary: false
  formula: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric); score = min(max(raw, 0.0), 1.0)"
  floor_carrier: "the paired default-construction training run tests/runner.py performs in the same grading pass"
  ceiling_carrier: "tests/anchors.json verifier_operating_points.full_credit_separation_bpb, subtracted from that live floor"
  reference_score: null
  reference_score_state: unmeasured-on-nanogpt-substrate
  reference_score_gap: gap-oer-15-reference-margin-unmeasured
  reference_score_note: >-
    Whether solution/reference.py clears the acceptance bar on the nanoGPT
    substrate, and by how much, is a GPU measurement this lane did not take and
    did not invent. It is declared open. The reference construction is derivable
    from the objective and spends every entry the handed grid cannot reach, which
    is an argument and not a measurement.
  plateau_score: 0.0
  plateau_score_note: >-
    This one is provable rather than measured. A submission that returns the
    handed construction at the paired baseline row IS the floor, so raw is zero by
    construction and the gate emits default-construction-plateau-not-beaten.

solver_egress_divergence:
  bound_here: open
  batch_field: "seed/contract.yaml batch.optimization_bindings.solver_egress reads setup-only"
  gap_id: gap-oer-solver-egress-ruled-stricter
  reading_a: "requirements/open-ended-research-optimisation-problems.md line 58 grants full internet access to the solving agent."
  reading_b: "requirements/open-ended-research-optimisation-problems.md line 122 says internet is needed only for setup, and requirements/bia-environment-spec.md line 247 takes the stricter reading."
  resolution_here: >-
    This bundle binds solver_egress open at the agent surface and verifier egress
    denied, as the lane brief requires, and records the divergence rather than
    amending the batch-level field. This lane does not amend seed/contract.yaml.
  deny_list_is_not_containment: >-
    The deny-list on github.com, raw.githubusercontent.com and objects.githubusercontent.com
    is not a containment proof. Mirrors, caches, paraphrased write-ups and model weights
    all carry a recipe past any deny-list. That is exactly why the deterministic checker,
    and not the network policy, is the load-bearing control here: the graded number is
    recomputed by the verifier from harness-owned parameters over a byte denominator the
    solver never sees, so a recalled recipe still has to actually lower bits per byte to
    score.

# ---------------------------------------------------------------------------
# The golden trajectory. Steps only; no measurement is taken by recompute.py.
# ---------------------------------------------------------------------------
golden_trajectory:
  - step: 1
    action: "Read instruction.md, environment/manifest.json and environment/nanogpt_substrate.json; record that the graded reading comes off a real 2200-step run of the canonical 12-layer 768-dimension decoder and that the denominator is the byte count of a slice you never see."
    establishes: "what is graded and what is frozen"
  - step: 2
    action: "Read environment/default_tokenizer.py and enumerate DEFAULT_OPTION_GRID; note that every row produces whole whitespace-delimited words only, and that the largest top_k it offers is 1024."
    establishes: "the handed option set, and its structural limit"
  - step: 3
    action: "Count the room. The vocabulary budget is the decoder's own vocab_size of 50304, of which 50048 entries are yours past the single bytes, so the handed grid leaves at least 49024 of them unspent at any option value."
    establishes: "the option set is exhausted long before the budget is"
  - step: 4
    action: "Note that the plateau cannot be swept out by brute force here: the verifier measures the handed construction itself, in the same pass, and no reading of it is published for you to aim just under."
    establishes: "there is no literal to recall and no bar to reverse-engineer"
  - step: 5
    action: "Re-read the objective. The step budget buys a fixed number of training tokens and the denominator is a byte count, so a vocabulary that expresses the same bytes in fewer tokens covers more corpus inside the budget and costs fewer predictions on the held-out slice."
    establishes: "the derivation of the wider construction"
  - step: 6
    action: "Measure what you can measure for free: encode a known slice of bytes under a candidate vocabulary and read its bytes-per-token, which needs no training at all."
    establishes: "a cheap proxy for the quantity under your control"
  - step: 7
    action: "Build the wider construction: greedy merges of the most frequent adjacent symbol pair over the decoded FineWeb bytes, ties broken lexicographically, stopping when no pair occurs twice or the budget is spent."
    establishes: "affixes, whole words and multi-word phrases competing for the same budget on equal terms"
  - step: 8
    action: "Declare no HALT_AT_STEPS, so the run reaches the bound step and the reading is asked to hold at the two verifier-scheduled points after it."
    establishes: "the reading is sustained, not a transient dip"
  - step: 9
    action: "Write submission/tokenizer.py exporting build_vocab and let the verifier train the decoder and compute the number."
    establishes: "a graded reading the submission never touched"

# ---------------------------------------------------------------------------
# Checker fixtures. The accepting half is the REAL reference run driven through the
# real gate chain. Each rejecting half is a minimal patch applied to that real run,
# designed so exactly one checker fires.
# ---------------------------------------------------------------------------
fixtures:
  accepting:
    kind: live-reference-run
    expected_reward: null
    expected_reward_state: unmeasured-on-nanogpt-substrate
    expected_reward_gap: gap-oer-15-reference-margin-unmeasured
    expected_reason: graded
    reference_sha256_bound: true
    cost_note: >-
      REPRICED BY THE RE-BASE. The accepting half is now a real 2200-step training
      run of the canonical decoder plus the verifier's paired baseline run, so the
      compiled suite needs an accelerator and the staged FineWeb shards. It is no
      longer a suite that runs in seconds on a laptop, and pretending otherwise
      would be the same category of stand-in this re-base exists to remove.
    note: "solution/reference.py is sha256-bound into the accepting fixture, so the accepting half proves the checkers accept THIS reference and not merely some file."
  rejecting:
    - checker: early_stop_not_an_established_metric
      zero_reason: early-stop-no-established-metric
      kind: live-submission
      submission: "build_vocab delegating to the reference construction, with HALT_AT_STEPS at half the budget"
      minimal: false
      minimal_note: "a halted run carries no bound point, so later checkers have nothing to read; the gate order puts this checker first, so the emitted reason is exactly its own."
    - checker: frozen_axes_unmoved
      zero_reason: frozen-axis-moved
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: set, path: [telemetry, frozen, architecture, num_layers], value: 11}
    - checker: snapshot_shapes_match_substrate
      zero_reason: snapshot-shape-off-substrate
      kind: planted-telemetry-fixture
      minimal: true
      near_miss: true
      near_miss_note: >-
        An OFF-BY-ONE on ONE dimension of ONE tensor. Every other tensor keeps the
        shape the frozen architecture implies, the tensor names are untouched and
        the count of tensors is untouched, so a checker that merely tested for the
        presence of a shape dictionary would accept it. Only a checker that
        derives the expected shapes from the architecture and compares them
        exactly refuses it.
      ops:
        - {op: set, path: [telemetry, model, parameter_shapes, "blocks.0.mlp.up.weight"], value: [3071, 768]}
    - checker: eval_points_ordered_by_steps
      zero_reason: eval-schedule-out-of-order
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: swap_points, a: -2, b: -1}
    - checker: compute_budget_respected_as_spent
      zero_reason: compute-budget-overspent
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: add_int, path: [telemetry, compute, charged_steps], delta: 300}
    - checker: denominator_is_held_out_slice_bytes
      zero_reason: denominator-not-held-out-slice-bytes
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: set, path: [telemetry, denominator, source], value: "eval-token-count"}
        - {op: set_from, path: [telemetry, denominator, bytes], source: [telemetry, vocabulary, eval_tokens]}
    - checker: graded_state_is_harness_owned
      zero_reason: graded-state-not-harness-owned
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: set, path: [telemetry, readout, weights_origin], value: "submission-selected-checkpoint"}
    - checker: graded_readout_unsmoothed
      zero_reason: graded-readout-smoothed
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: set, path: [telemetry, readout, filter], value: "ema-0.9"}
    - checker: reading_sustained_across_scheduled_points
      zero_reason: reading-not-sustained
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: add_float_last_sustain, key: bits_per_byte, delta: 0.5}
    - checker: submission_vocabulary_took_effect
      zero_reason: submission-vocabulary-inert
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: set, path: [telemetry, vocabulary, submitted_digest], value: "1111111111111111111111111111111111111111111111111111111111111111"}
    - checker: metric_not_taken_from_submission_report
      zero_reason: metric-sourced-from-submission
      kind: planted-telemetry-fixture
      minimal: true
      ops:
        - {op: set, path: [telemetry, reported_by_submission, bits_per_byte], value: 0.1}
        - {op: set_from, path: [telemetry, graded, bits_per_byte], source: [telemetry, reported_by_submission, bits_per_byte]}
    - checker: beats_default_construction_optimum
      zero_reason: default-construction-plateau-not-beaten
      kind: live-submission
      submission: "build_vocab delegating to environment/default_tokenizer.build_vocab at the paired baseline row, which IS the floor"
      minimal: true

# ---------------------------------------------------------------------------
# Statement ambiguity: two independent readings of instruction.md must reduce to the
# same graded quantity. Recorded here and checked by adequacy.py.
# ---------------------------------------------------------------------------
statement_readings:
  outcomes_admitted: 1
  readings:
    - id: reading-from-the-fraction
      source: "instruction.md, the displayed fraction under 'What you are optimizing'"
      reduces_to:
        numerator: "raw bits the trained decoder assigns to the held-out FineWeb slice"
        denominator_bytes: "the byte count of the verifier-held slice"
        point: "the bound evaluation point, 2200 optimizer steps"
        direction: lower
    - id: reading-from-the-graded-list
      source: "instruction.md, item 1 of 'What is graded, in one list'"
      reduces_to:
        numerator: "raw bits the trained decoder assigns to the held-out FineWeb slice"
        denominator_bytes: "the byte count of the verifier-held slice"
        point: "the bound evaluation point, 2200 optimizer steps"
        direction: lower

rubrics_generated:
  - id: matches-reference-construction-class
    rubric: "The submitted vocabulary is produced by a construction outside the handed word-list family: at least one graded vocabulary entry is not a whole whitespace-delimited word."
    weight: 1
  - id: spends-the-budget-the-handed-grid-cannot
    rubric: "The submitted vocabulary contributes more than the 1024 entries the handed grid's largest top_k can reach, out of the 50048 available past the single bytes."
    weight: 1
  - id: reaches-the-bar
    rubric: "The graded bits-per-byte reading is at or below the paired default construction's reading less the acceptance separation, both trained in the same grading pass."
    weight: 1
  - id: sustains-the-reading
    rubric: "The reading holds at the two verifier-scheduled points at 110 and 220 optimizer steps past the bound point."
    weight: 1
  - id: spends-the-budget-without-exceeding-it
    rubric: "The harness counter charged exactly 2200 optimizer steps and no more, at one forward and one backward pass each."
    weight: 1

tier:
