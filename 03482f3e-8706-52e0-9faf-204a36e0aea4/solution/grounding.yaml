    category. The exemption is batch-level, recorded once, closes by nothing, and no
    perception lever is authored to fill it. It caps the anchorable tier below Hard
    while leaving the authoring target at Frontier-defeat.

bindings:
  max_timeout_hours: 6.0
  max_timeout_role: "refinement-loop terminator across attempts"
  budget_hours: 6.0
  budget_hours_role: "per-attempt completion bound, one vocabulary construction plus the two 2200-step runs that grade it"
  budget_hours_state: unmeasured-on-nanogpt-substrate
  budget_hours_gap: gap-oer-15-per-attempt-wall-time-unmeasured
  budget_hours_rebase_note: >-
    REPINNED. The retired substrate bound 0.12 hours to one attempt, which was
    coherent while an attempt was a bigram count over 21599 bytes. An attempt now
    contains two real 2200-step training runs of a 162201600-parameter decoder on
    one H100, so the per-attempt bound is the session bound and the attempt count
    falls from fifty to one. The wall time of that attempt is unmeasured and is
    declared so rather than estimated. The two grants keep their distinct roles:
    the first bounds the session across attempts, the second bounds one attempt.
  max_attempts: 1
  final_selection: best
  budget_envelope: "one H100, single accelerator, no multi-GPU scaling"
  budget_margin: "10 percent"
  compute_envelope_accelerators: 1

generated_artifacts:
