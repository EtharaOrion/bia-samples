# ---------------------------------------------------------------------------
# APPENDED by the verifier lane (tests/). Closes the residual leak that
# check_agent_surface.py carried as the single WAIVED finding at
# OER-15/environment/manifest.json:39 [R4-measured-reward-ceiling-literal].
# ---------------------------------------------------------------------------
withheld_from_the_agent_environment_manifest:
  closed_waiver:
    guard: seed/staging/oer1/check_agent_surface.py
    rule_id: R4-measured-reward-ceiling-literal
    carrier_before: environment/manifest.json
    former_owner_note: >-
      The waiver named the verifier lane (tests/) as the owner and said the value could
      not be deleted because checkers.score_from_reading returns 0.0 when the ceiling is
      absent, so removing it would silently zero every score rather than fail. That is
      correct, and it is why the value was MOVED rather than deleted.
    carrier_after: seed/staging/oer1/OER-15/tests/anchors.json
    grading_path_after: >-
      tests/grade.py load_anchors() reads tests/anchors.json and merge_verifier_anchors()
      overlays it onto the run record's manifest.measured_operating_points before
      evidence_from_record assembles the Evidence. The verifier's copy WINS over any value
      the delivery unit carries under the same key, so a tampered environment/manifest.json
      cannot move the reward scale. checkers.py is unchanged and stays pure.
    absent_anchors_are_loud_not_silent: >-
      A missing or malformed tests/anchors.json raises and grade.py emits reward 0.0 with
      reason verifier-aborted and the detail naming the absent file. The failure mode the
      waiver warned about -- a silent zero -- is now an attributed verifier fault.
  removed_from_the_agent_visible_manifest:
    - key: measured_operating_points.reference_construction_optimum_bpb
      value: 0.2818765313056418
      role: >-
        the ceiling of the reward scale; the exact bits-per-byte reading at which the
        score reaches 1.0. This was the answer key published to the solver.
    - key: measured_operating_points.measured_plateau_gap_bpb
      value: 0.055475307487323655
      role: >-
        the endpoint gap. Removed alongside the ceiling because the floor stays published:
        0.33735183879296543 - 0.055475307487323655 = 0.2818765313056418 recovers the ceiling
        by subtraction, which is the R3 disclosure shape in a different currency.
  deliberately_left_on_the_agent_surface:
    - key: measured_operating_points.default_construction_optimum_bpb
      value: 0.33735183879296543
      why: >-
        the floor is the measured optimum of environment/default_tokenizer.py, a script the
        agent is handed, told to read and invited to sweep. It is an observable property of
        executable bytes in the agent's own container. Without the ceiling it does not locate
        the point that scores 1.0.
    - key: measured_operating_points.acceptance_bar_bpb
      value: 0.3173518387929654
      why: >-
        a threshold on a statistic the agent computes for itself, and it is the task's own
        admission bar rather than a value of the graded metric at full reward.
    - key: measured_operating_points.default_separation_bpb
      value: 0.02
      why: a separation margin, not an endpoint of the reward scale.
  proven_by_execution:
    agent_surface_clean: >-
      python3 seed/staging/oer1/check_agent_surface.py exits 0 with 0 live findings AND 0
      waived residuals. Re-run with --strict it also exits 0, which the waived state could
      never do.
    reference_score_unchanged: >-
      solution/solve.sh installed into a lane-private submission dir, then tests/test.sh
      against a lane-private OER15_REWARD_ROOT. Reward 1.0, reason graded,
      bits_per_byte 0.2818765313056418, both BEFORE the move and AFTER it. Byte-identical
      score.json apart from nothing.


# ---------------------------------------------------------------------------
# APPENDED by the re-base lane. The three blocks above are the APPEND-ONLY
# preservation record of a leak class that no longer has a carrier. They are kept
# verbatim because nothing recoverable is deleted in this pass, and because the
# history of where a reward-scale endpoint used to sit is worth keeping. What
# changed is that the leak is now closed structurally rather than by relocation:
# after the re-base there is NO literal reading of the graded metric anywhere in
# this bundle, on either surface. The floor of the reward scale is trained during
# grading and the ceiling is that floor less a declared separation, so the value
# those blocks describe as moved to tests/anchors.json no longer exists to move.
# ---------------------------------------------------------------------------
rebase_closes_the_leak_class:
  former_carrier: environment/manifest.json measured_operating_points.reference_construction_optimum_bpb
  former_value_role: "the exact bits-per-byte reading at which the score reached 1.0"
  status_after_rebase: no-carrier-exists
  why: >-
    The reward scale has no literal endpoint any more. tests/runner.py trains the
    handed construction in the same pass that grades the submission, and
    tests/anchors.json carries a SEPARATION rather than a reading. A separation
    discloses the shape of the scale and not a point on the metric, so publishing
    it verifier-side leaks nothing a solver could aim at.

