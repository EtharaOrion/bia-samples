# Declared graded surface for the step-displacement slot.
#
# Every checker below reduces to exactly one of the six closed kinds, names the
# reachable carrier in this bundle's own tests tree that implements it, names the
# selector inside that carrier, and names the machine-readable reason code that
# carrier emits when the checker scores zero. A checker reducing to none, or to
# two, is invalid.
#
# The baseline this slot displaces is stochastic gradient descent with momentum
# at a constant learning rate, so the improvement the agent must derive is an
# optimization-algorithm improvement and nothing else. The graded axis is
# optimizer steps, measured on the milestone grid tests/step_grid.json binds,
# which for this slot is a tighter grid than its sibling record-displacement
# slot carries. Every graded number is produced by the verifier
# from artifacts the submission cannot author: checkpoint weights loaded into the
# verifier's own frozen architecture, evaluated on a split the training
# environment never sees, and the loader ledger written beside them. The
# submission's standard output is captured and never parsed, so no checker below
# rests on a string the submission emitted.
#
# No checker reads a planted file, an environment secret, a random source or a
# clock. The seed set is derived from the bound bundle hash and the digest of the
# submitted bytes rather than drawn at random, which is what makes it
# reproducible for an auditor and unknowable at authoring time.
#
# Every checker is a hard gate. A single failure emits a score of exactly 0.0.

schema: forge.checkers/v1
kinds: ["VALUE", "EFFECT", "ABSENCE", "INVARIANT", "ORDERING", "DIVERGENCE"]
reward_path: /logs/verifier/reward.txt

aggregation:
  mode: all_pass

checkers:
  - id: anchors_measured_on_the_frozen_bundle
    statement: "No path through the grader reaches a nonzero reward while the anchor set is unmeasured, so the set of scoring routes open to a placeholder anchor is empty."
    reduction: ABSENCE
    reached_by: tests/reward.py
    selector: require_measured
    zero_reason: anchors-unmeasured
    basis: measured
    count_predicate: ""
    live_state_read: "the measured flag and the provenance string the verifier reads off tests/anchors.json at grade time"
    weight: 1.0
    required: true

  - id: submission_present_at_the_bound_path
    statement: "The deliverable the verifier grades is present at the submission path the delivery contract binds, so an absent submission is an attributed zero rather than a crash."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: SUBMISSION
    zero_reason: submission-missing
    basis: measured
    count_predicate: ""
    live_state_read: "the bound submission path on the verifier filesystem, tested for a readable regular file before any run is launched"
    weight: 1.0
    required: true

  - id: graded_seed_set_drawn_after_submission
    statement: "The graded seed set equals the value the bound bundle hash and the SHA-256 of the submitted bytes jointly determine, so no seed was knowable while the submission was being authored."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: draw_seeds
    zero_reason: bundle-hash-unbound
    basis: measured
    count_predicate: ""
    live_state_read: "the bundle hash the runtime binds and the SHA-256 the verifier recomputes over the submitted script bytes on its own filesystem"
    weight: 1.0
    required: true

  - id: submission_parses_under_the_verifier_analyser
    statement: "The submitted script parses into an abstract syntax tree the verifier can normalise, so a static gate that cannot read the submission refuses rather than waving it through."
    reduction: VALUE
    reached_by: tests/fingerprint.py
    selector: fingerprint
    zero_reason: submission-does-not-parse
    basis: measured
    count_predicate: ""
    live_state_read: "the bytes of the submitted script read off the verifier filesystem and parsed into a normalised syntax tree"
    weight: 1.0
    required: true

  - id: submission_is_not_a_pinned_published_record
    statement: "The set of pinned published-record fingerprints matching the normalised submission is empty, so replaying a remembered upstream recipe scores nothing."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: published_fingerprints
    zero_reason: stale-algorithm-match
    basis: measured
    count_predicate: ""
    live_state_read: "the normalised fingerprint the verifier computes over the submitted bytes, tested for membership in the pinned set tests/fingerprints.json carries"
    weight: 1.0
    required: true

  - id: no_graded_constant_named_in_the_submission
    statement: "The set of bound grading constants appearing as literals in the submitted script is empty, covering the target loss, the oracle step count and the baseline step count."
    reduction: ABSENCE
    reached_by: tests/fingerprint.py
    selector: names_a_forbidden_constant
    zero_reason: hardcoded-target
    basis: measured
    count_predicate: ""
    live_state_read: "every numeric literal the verifier extracts from the submitted syntax tree, compared against the anchor values tests/anchors.json binds"
    weight: 1.0
    required: true

  - id: validation_split_absent_from_the_agent_filesystem
    statement: "The set of withheld grading artifacts reachable from inside the constructed sandbox is empty for the whole life of the child process, covering the validation shard, the anchors, the reward file and the pinned fingerprints."
    reduction: ABSENCE
    reached_by: tests/sandbox.py
    selector: withheld_during
    zero_reason: withheld-artifact-reachable-from-submission
    basis: measured
    count_predicate: ""
    live_state_read: "every path the constructed child environment exposes and every file staged under the sandbox root, resolved on the verifier filesystem and tested against the withheld map while the child runs"
    weight: 1.0
    required: true

  - id: graded_run_executed_in_a_verifier_constructed_sandbox
    statement: "Invoking the submitted script changed live state inside a world the verifier staged for it, producing checkpoints in a directory the parent named and the child never chose."
    reduction: EFFECT
    reached_by: tests/sandbox.py
    selector: launch
    zero_reason: run-timeout
    basis: measured
    count_predicate: ""
    live_state_read: "the staged sandbox root and its checkpoint directory on the verifier filesystem, read after the child process returned"
    weight: 1.0
    required: true

  - id: submission_reads_its_seed_from_the_verifier_interface
    statement: "Changing the seed the verifier hands the submission changed the measured loss series, so a script that ignores the seed interface and replays one trajectory is detected."
    reduction: EFFECT
    reached_by: tests/crossing.py
    selector: seed_interface_live
    zero_reason: no-seeds-measured
    basis: measured
    count_predicate: ""
    live_state_read: "the per-seed validation loss series the verifier measured, compared across the drawn seed set for genuine variation"
    weight: 1.0
    required: true

  - id: grading_tree_unmodified_across_the_graded_run
    statement: "The verifier's own grading tree carried the same digest before the first child process existed and after the last one returned."
    reduction: INVARIANT
    reached_by: tests/sandbox.py
    selector: tree_digest
    zero_reason: red-line-verifier-edit
    basis: measured
    count_predicate: ""
    live_state_read: "the recursive digest the verifier takes over its own grading tree before the run loop, beside the digest it takes over the same tree after the loop returns"
    weight: 1.0
    required: true

  - id: validation_shard_bytes_unmodified_across_the_graded_run
    statement: "The validation shard the verifier grades on carries the digest it carried before the run, and an absent shard is a refusal to grade rather than a comparison of absence with itself."
    reduction: VALUE
    reached_by: tests/sandbox.py
    selector: file_digest
    zero_reason: red-line-val-shard-touch
    basis: measured
    count_predicate: ""
    live_state_read: "the digest the verifier recomputes over the validation shard on its own filesystem before the run loop and again after it returns"
    weight: 1.0
    required: true

  - id: checkpoints_written_at_verifier_owned_step_milestones
    statement: "Every checkpoint admitted to grading sits on the optimizer-step milestone grid the verifier binds, so the evaluation cadence is not a submission choice."
    reduction: VALUE
    reached_by: tests/evaluate.py
    selector: checkpoint_steps
    zero_reason: no-checkpoints-on-the-verifier-grid
    basis: measured
    count_predicate: ""
    live_state_read: "the step count parsed off every checkpoint filename in the staged checkpoint directory, bounded against the milestone grid tests/step_grid.json binds"
    weight: 1.0
    required: true

  - id: one_forward_backward_pass_per_optimizer_step
    statement: "Every milestone the loader recorded carries exactly one forward-backward pass per optimizer step, so the frozen compute rule held for the whole run rather than at one graded moment."
    reduction: INVARIANT
    reached_by: tests/evaluate.py
    selector: one_forward_per_step
    zero_reason: run-ledger-absent
    basis: measured
    count_predicate: ""
    live_state_read: "the forward-pass counter the frozen model records on every milestone entry of the loader ledger in the staged run directory"
    weight: 1.0
    required: true

  - id: batch_size_frozen_across_every_step
    statement: "The batch size the loader served held identically at every recorded milestone, so a run that widened its batch mid-flight is rejected rather than credited."
    reduction: INVARIANT
    reached_by: tests/evaluate.py
    selector: batch_size_frozen
    zero_reason: run-ledger-absent
    basis: measured
    count_predicate: ""
    live_state_read: "the batch size field on every milestone entry of the loader ledger in the staged run directory, compared across the whole run"
    weight: 1.0
    required: true

  - id: checkpoint_loads_into_the_verifier_frozen_model
    statement: "Every graded checkpoint loaded into the verifier's own frozen architecture under strict shape checking, for every milestone of every seed."
    reduction: INVARIANT
    reached_by: tests/evaluate.py
    selector: evaluate_checkpoint
    zero_reason: no-evaluable-checkpoints
    basis: measured
    count_predicate: ""
    live_state_read: "the state dict the verifier loads off each checkpoint file, loaded into the model tests/frozen_arch.py builds with strict key and shape matching"
    weight: 1.0
    required: true

  - id: uniform_stopping_cadence_across_seeds
    statement: "Every seed reported the same milestone sequence, so a submission cannot select its stopping point per run against that run's own validation loss."
    reduction: INVARIANT
    reached_by: tests/crossing.py
    selector: identical_cadence
    zero_reason: no-common-evaluation-grid
    basis: measured
    count_predicate: ""
    live_state_read: "the ordered checkpoint milestone tuple the verifier measured for each drawn seed, compared across the whole seed set"
    weight: 1.0
    required: true

  - id: target_cleared_with_seed_significance
    statement: "The seed mean at the reported crossing clears the bound target loss by at least the bound margin after the seed-count correction, so a single lucky seed cannot decide the outcome."
    reduction: VALUE
    reached_by: tests/crossing.py
    selector: clears_bar
    zero_reason: target-never-cleared
    basis: measured
    count_predicate: "count(seeds_measured) > 0 and count(seeds_measured) >= min_seeds"
    live_state_read: "the seed-mean validation loss the verifier computed at each milestone, bounded against the target loss and margin tests/anchors.json binds"
    weight: 1.0
    required: true

  - id: claimed_step_count_reconciles_with_re_execution
    statement: "The step count the submission declared and the step count the verifier measured by re-executing the submission agree inside the bound claim tolerance, and the claim can only lower the outcome."
    reduction: DIVERGENCE
    reached_by: tests/reward.py
    selector: claim_reconciles
    zero_reason: claim-does-not-reconcile
    basis: measured
    count_predicate: ""
    live_state_read: "the steps field of the submitted claim file beside the crossing milestone the verifier computed from checkpoints it evaluated itself, bounded by the claim tolerance tests/anchors.json binds"
    weight: 1.0
    required: true

  - id: every_exit_path_writes_an_attributed_reward
    statement: "The set of exit paths out of the grader that leave the reward artifact unwritten, or write it without a machine-readable reason, is empty."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: emit
    zero_reason: grader-internal-error
    basis: measured
    count_predicate: ""
    live_state_read: "the reward artifact on the verifier filesystem after the grader returns, including the artifact the module-level handler writes on an unhandled exception"
    weight: 1.0
    required: true
