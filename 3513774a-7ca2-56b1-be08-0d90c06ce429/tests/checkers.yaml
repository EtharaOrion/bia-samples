schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

slot: OER-19
family: F14
archetype: AR6

aggregation:
  mode: required_pass
  rationale: >-
    grade.py walks the gate chain in tests/checkers.py in the bound order and stops
    at the first failing gate, scoring 0.0 with that gate's zero_reason. Every gate
    is required, so the mode is exactly the universal quantifier required_pass
    describes, and it is not vacuous because ten checkers are marked required. Only
    when every required gate passes does the reward become the clipped
    anchor-normalized benchmark score, which is continuous on [0.0, 1.0] and never
    binary. required_pass therefore describes the gate, and the metric formula
    described in task.toml describes the number that survives it.

anchors:
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  gap: gap-oer-per-family-anchors-unmeasured
  note: >-
    F14 anchors are unmeasured, so no baseline_metric or target_metric number is
    invented here. With either anchor unbound grade.py resolves the reward to 0.0
    carrying reason anchors-absent-unnormalizable and records the verifier-computed
    agent_metric in the score document. The normalization arithmetic itself is
    exercised in seed/tasks/OER-19/adequacy.py against a declared fixture-supplied
    anchor pair, which is fixture material and is not a slot binding.
  second_gap: gap-oer19-reward-unnormalizable-until-anchors-bound

# The diversity statistic. Pure, deterministic, no model call, no network, no clock
# and no random source. Shipped in tests/ and mirrored byte-identically onto the
# agent surface, so the agent can compute the graded statistic over its own corpus
# before it asks for a score. Both copies are pinned; adequacy.py recomputes both
# digests and fails the lane if either moved.
diversity_statistic:
  path: tests/diversity.py
  sha256: e880b1296de8c0800981b1e13354bf448bb0c206ab3eef11c3ad1e310fc35e07
  agent_visible_mirror: environment/tools/corpus_diversity.py
  mirror_sha256: e880b1296de8c0800981b1e13354bf448bb0c206ab3eef11c3ad1e310fc35e07
  normalization: oer19-lower-alnum-collapse/v1
  normalization_definition: >-
    Lowercase; keep [a-z0-9]; collapse every run of anything else to a single space.
    Token 3-grams over the result, repeats kept. Overlap between two samples is the
    Jaccard of their 3-gram sets.

frozen_trainer:
  path: tests/trainer.py
  sha256: a387fdfbacac437f230521480d29ab299d5ff3f52c64dcd6187430d7f7f645db
  agent_visible_mirror: environment/frozen/trainer.py
  mirror_sha256: a387fdfbacac437f230521480d29ab299d5ff3f52c64dcd6187430d7f7f645db

# Every bound below is mirrored as a module constant in tests/checkers.py, and
# adequacy.py asserts the two agree, so the manifest a reader audits and the code
# that runs cannot drift apart.
bounds:
  normalization_id: oer19-lower-alnum-collapse/v1
  corpus_samples: 480
  labels: [music, timer, translate, weather]
  segment_count: 8
  prefix_points: 4
  ngram_width: 3
  mode_share_threshold: 0.60
  max_mode_share_ceiling: 0.08
  collapse_relative_fraction: 0.65
  near_duplicate_threshold: 0.55
  sustain_tolerance: 0.08
  self_report_tolerance: 0.02
  bound_updates: 1440
  bound_samples_fed: 1440
  bound_epochs: 3
  bound_evaluation_point: 1440
  scheduled_points: [960, 1200, 1440]
  counter_source: harness-trainer
  weights_source: harness-trainer

advisory_bounds:
  segment_distinct_ngram_floor: 0.34
  note: >-
    An advisory floor only. It is published to the agent through
    environment/tools/corpus_diversity.py and the reference generator self-gates on
    it, but no graded checker enforces it, because a uniformly low-diversity corpus
    is already graded by corpus_mode_share_bounded and a second gate on the same
    shape would fire two reasons for one defect. Recorded here rather than left
    implicit.

ast_allowlist:
  applies_to: [tests/checkers.py, tests/diversity.py]
  imports: [json, math, hashlib, pathlib, dataclasses, typing, __future__]
  imports_note: >-
    __future__ is a compiler directive, not a runtime import: it binds no module
    object and reaches no resource. It is declared rather than silently tolerated.
  banned_names: [random, time, datetime, os, sys, subprocess, socket, urllib, requests, open, eval, exec, __import__, input, getenv, environ]
  enforced_by: seed/tasks/OER-19/adequacy.py
  note: >-
    Enforced by walking the AST on every adequacy run, not asserted. Checker code
    reads no planted file, no environment secret, no clock, no network and no random
    source, and never imports the submission. Every number a checker reads comes
    from the telemetry record tests/runner.py produced inside the verifier's own
    process.

isolation:
  statement: >-
    tests/runner.py copies the submission alone into a fresh temporary directory,
    launches it as a new session leader under the environment allowlist
    PATH, PYTHONPATH, PYTHONHASHSEED, LC_ALL, LANG, HOME, TMPDIR, captures its
    output, and kills the whole process group in a finally block. tests/grade.py
    imports the checkers and the runner and never imports the submission.
  documented_deviation: >-
    The read-only frozen tools directory is placed on the submission's PYTHONPATH,
    exactly as the agent's own sandbox provides it. No bundle solution/ or tests/
    byte travels with the submission. A submission graded without the tool the task
    instructs it to use would be graded on a surface the agent never had.

checkers:
  - id: generator_collapse_absent
    statement: >-
      The generator ran to completion without collapsing to a low-diversity mode
      partway through: it emitted the bound corpus size, the emission timeline
      carries the bound number of segments, and no segment's distinct-trigram ratio
      fell below 0.65 of the strongest segment the run ever produced.
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: generator_collapse_absent
    zero_reason: generator-collapsed-silently
    required: true
    weight: 3
    live_state_read: >-
      telemetry["corpus"]["segment_distinct_ngram_ratio"], ["samples"] and
      ["segment_count"], computed by tests/runner.py:produce_telemetry from the
      corpus bytes the run left on disk, inside the verifier's own process.
    compiled_test: "tests/test_output.py::test_generator_collapse_absent"
    drift_keys: [segment_distinct_ngram_ratio]
    basis: computed
    count_predicate: "collected > 0 and failed == 0"
    note: >-
      This is the archetype gate. A generator that exits zero while emitting a
      degenerate corpus is caught here and graded as a failure with this reason,
      which is deliberately distinct from any low-score reason: a degenerate corpus
      that happens to score above the floor is still a collapse and is named one.
      The comparison is against the strongest segment rather than the first, so a
      generator cannot set a low bar by opening degenerately.

  - id: corpus_mode_share_bounded
    statement: >-
      The share of the corpus sitting in one near-duplicate neighbourhood stays at
      or below 0.08, both over the whole corpus and at each of the four prefix
      points the verifier reads, under the bound normalization and overlap threshold.
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: corpus_mode_share_bounded
    zero_reason: corpus-mode-share-exceeded
    required: true
    weight: 3
    live_state_read: >-
      telemetry["corpus"]["max_mode_share"], ["prefix_mode_share"],
      ["mode_share_threshold"] and ["normalization"], computed by
      tests/diversity.py:mode_share inside tests/runner.py.
    compiled_test: "tests/test_output.py::test_corpus_mode_share_bounded"
    drift_keys: [corpus_diversity_floor]
    basis: computed
    count_predicate: "prefix points collected > 0 and failed == 0"
    note: >-
      Overlap, not equality. A generator emitting one template with a rotating
      integer produces lines that are never byte-identical, so exact-duplicate
      counting reports a clean corpus while this reports the collapse.

  - id: emission_order_monotone
    statement: >-
      The recorded emission sequence is strictly ascending and contiguous from zero,
      so the per-segment reading is a statement about the run's timeline rather than
      about a reordering of the file.
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: emission_order_monotone
    zero_reason: emission-order-not-monotone
    required: true
    weight: 2
    live_state_read: >-
      telemetry["corpus"]["emission_sequence"], read by tests/runner.py:read_corpus
      from the corpus bytes the run left on disk.
    compiled_test: "tests/test_output.py::test_emission_order_monotone"

  - id: no_benchmark_near_duplicate
    statement: >-
      No generated sample overlaps a held-out benchmark item at or above the bound
      Jaccard threshold of 0.55 under the declared normalization
      oer19-lower-alnum-collapse/v1.
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: no_benchmark_near_duplicate
    zero_reason: benchmark-near-duplicate-emitted
    required: true
    weight: 3
    live_state_read: >-
      telemetry["corpus"]["benchmark_near_duplicate_hits"] and
      ["near_duplicate_threshold"], computed by tests/diversity.py:near_duplicates
      against tests/benchmark_held_out.jsonl inside the verifier's own process.
    compiled_test: "tests/test_output.py::test_no_benchmark_near_duplicate"
    drift_keys: [benchmark_near_duplicate_hits]
    limitation: >-
      A bound Jaccard threshold over a declared normalization is not a semantic
      equivalence oracle. A deep paraphrase below the threshold is not caught. This
      is recorded rather than papered over, and is carried in shortcut_probes.yaml
      as a named residual risk.

  - id: early_stop_does_not_establish_score
    statement: >-
      No early stop: the run reports terminated_early false and reached every
      evaluation point the verifier scheduled, including the bound point at update
      1440. A run halted at a favourable evaluation is graded as not having
      established the score, never as an absent result.
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: early_stop_does_not_establish_score
    zero_reason: early-stop-score-not-established
    required: true
    weight: 2
    live_state_read: >-
      telemetry["training"]["terminated_early"] and
      telemetry["evaluation"]["points"], from the frozen trainer's own counters and
      the verifier's own scheduled evaluations.
    compiled_test: "tests/test_output.py::test_early_stop_does_not_establish_score"
    drift_keys: [evaluation_sustain_points]

  - id: training_budget_as_fed
    statement: >-
      The frozen training budget was respected as actually fed: 1440 optimizer
      updates, 1440 samples fed and 3 completed epochs over a 480-sample corpus,
      counted by the harness trainer at the point of feeding.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: training_budget_as_fed
    zero_reason: training-budget-overspent
    required: true
    weight: 2
    live_state_read: >-
      telemetry["training"]["updates"], ["samples_fed"], ["epochs_completed"] and
      ["counter_source"], incremented inside tests/trainer.py:train where the work
      happens, never a figure a caller requested.
    compiled_test: "tests/test_output.py::test_training_budget_as_fed"
    drift_keys: [counter_source]

  - id: unsmoothed_graded_readout
    statement: >-
      The graded readout is raw. It was produced with kind raw, window 1 and no EMA
      alpha, and it equals the exact ratio of the correct and total counts the
      verifier's own evaluator recorded at the bound point.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: unsmoothed_graded_readout
    zero_reason: readout-smoothing-on-graded-path
    required: true
    weight: 3
    live_state_read: >-
      telemetry["evaluation"]["readout"], ["graded_correct"], ["graded_total"] and
      ["graded_accuracy"], from tests/trainer.py:evaluate inside the verifier.
    compiled_test: "tests/test_output.py::test_unsmoothed_graded_readout"
    note: >-
      A submission may smooth, blend or average anything it likes for its own use.
      The graded quantity is recomputed unsmoothed by the verifier, so a smoothed
      readout on the graded path scores zero with this reason.

  - id: score_sustained_across_scheduled_points
    statement: >-
      The graded reading is sustained: at every point the verifier scheduled, 960,
      1200 and 1440, the accuracy sits within 0.08 of the graded reading, so a
      single favourable evaluation cannot be harvested.
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: score_sustained_across_scheduled_points
    zero_reason: score-not-sustained
    required: true
    weight: 3
    live_state_read: >-
      telemetry["evaluation"]["points"] and ["sustain_tolerance"], one entry per
      point the verifier itself scheduled and evaluated.
    compiled_test: "tests/test_output.py::test_score_sustained_across_scheduled_points"
    drift_keys: [points]

  - id: graded_score_from_harness_model_state
    statement: >-
      The evaluated weights are the harness trainer's own state at the bound
      evaluation point: the weights source is the harness trainer, the graded point
      is 1440, and the graded weight digest equals the digest the harness recorded
      for its own state at that update.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: graded_score_from_harness_model_state
    zero_reason: score-not-from-harness-model-state
    required: true
    weight: 3
    live_state_read: >-
      telemetry["evaluation"]["weights_source"], ["graded_point"],
      ["model_state_digest"] and ["graded_model_state_digest"], from the checkpoints
      tests/trainer.py:train recorded at the scheduled updates.
    compiled_test: "tests/test_output.py::test_graded_score_from_harness_model_state"

  - id: self_report_matches_recomputation
    statement: >-
      The run's own measurement of its corpus agrees with the verifier's
      recomputation: a self-report is present and its declared distinct-trigram
      ratio and mode share sit within 0.02 of the recomputed values, with the
      declared sample count exact.
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: self_report_matches_recomputation
    zero_reason: self-report-diverges-from-recomputation
    required: true
    weight: 2
    live_state_read: >-
      telemetry["self_report"] against telemetry["corpus"], the first carried
      verbatim from the submission's run_report.json and the second recomputed by
      tests/diversity.py inside the verifier.
    compiled_test: "tests/test_output.py::test_self_report_matches_recomputation"
    note: >-
      This is the only checker that touches a submission-authored value, and it
      touches it solely as the subject of a divergence test. No submission-authored
      number ever contributes to a score. A run that never measured its own corpus
      fails here, which is what makes detection a skill under test rather than a
      coin flip.

substituted_halves: []
substitution_note: >-
  No checker required a substituted rejecting half. Every one of the ten is fired
  by a fixture derived from solution/grounding.yaml through solution/recompute.py,
  and every one of the ten passes on the accepting fixture bound to the reference
  generator by sha256. Both halves are executed by seed/tasks/OER-19/adequacy.py.

additional_zero_reasons:
  - id: anchors-absent-unnormalizable
    emitted_by: tests/grade.py
    meaning: every gate passed and the reward cannot be normalized because the F14 anchors are absent
  - id: anchors-degenerate-interval
    emitted_by: tests/grade.py
    meaning: a supplied anchor pair has a zero-width interval, so the formula has no denominator
  - id: score-at-or-below-baseline
    emitted_by: tests/grade.py
    meaning: every gate passed and the clipped normalized score landed at the floor
  - id: telemetry-absent
    emitted_by: tests/grade.py
    meaning: no measurement document reached grading
  - id: grading-process-failed
    emitted_by: tests/test.sh
    meaning: the grading process exited non-zero or left no verdict
  - id: verifier-aborted-before-grading
    emitted_by: tests/test.sh
    meaning: the EXIT trap fired before grading completed, so a reason is left rather than silence
