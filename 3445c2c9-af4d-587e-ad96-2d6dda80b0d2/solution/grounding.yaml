# FORGE-CANARY-END
# PRIVATE DERIVATION SOURCE for slot OER-02. Never on the agent surface.
#
# This file is the SINGLE source from which solution/recompute.py derives the
# golden trajectory, the checker fixtures, solve.sh, TRUTH.md, rubrics.json and
# tests/test_output.py. recompute.py invokes no model, no network, no clock, no
# locale and no random source, so running it twice over frozen bytes produces
# byte-identical output.

schema: bia.grounding/v1
slot: OER-02
provisional_identifier: OER-02
family: F1
family_title: nanogpt optimizer speedrun
primary_archetype: sustained-refinement
archetype_exclusivity: "exactly one primary archetype, fixed at scope time. No buffet within the slot."

objective_verbatim: "Drive the step count down across the whole attempt budget, where each iteration receives a summary of every prior approach and its reward, and where the win comes from composing and pruning rather than from one lucky configuration."

# ---------------------------------------------------------------------------
# Bound grants. Transcribed from seed/contract.yaml batch.optimization_bindings.
# Never recomputed here.
# ---------------------------------------------------------------------------
bindings:
  max_timeout_hours: 6.0
  max_timeout_role: "refinement-loop terminator across attempts"
  budget_hours: 0.12
  budget_hours_minutes: 7.2
  budget_hours_role: "per-attempt completion bound"
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  never_aliases: "max_timeout bounds the session across attempts; budget_hours bounds one attempt. Emitting one for the other would encode a three-hundred-hour session that every well-formedness check would pass."
  max_attempts: 50
  final_selection: best
  final_selection_k: 50
  budget_envelope: "one H100, single accelerator, no multi-GPU scaling"
  budget_margin: "10 percent"
  compute_envelope_accelerators: 1
  tags: [optimization, bounded-continuous]

refinement_loop:
  bound_shape: "the harness lets the agent solve and submit, grades the submission, summarizes the trajectory, and starts the next iteration with that summary"
  running_context: "every prior approach and its reward"
  terminator: "max_timeout 6.0 hours or max_attempts 50, whichever trips first"
  per_attempt_bound: "budget_hours 0.12 hours"
  summary_owner: verifier
  summary_freshness: "recomputed from the recorded attempt ledger at every iteration boundary"
  driver: tests/session_driver.py

anchors:
  anchors_state: measured
  metric: "optimizer steps to reach target validation loss"
  direction: lower
  baseline_metric: 3250
  baseline_identity: "upstream record 36, tuned Muon with aux AdamW, loss 3.2787 at n equal to ten, stat-verified, dated 2026-06-11"
  target_metric: 2690
  target_identity: "upstream record 46, the current world record, loss 3.2783 at n equal to eight, stat-verified, dated 2026-06-19"
  authority: "requirements/bia-environment-spec.md lines 297 to 321"
  target_loss: 3.28
  pass_threshold: 0.65
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  reward_formula: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric); score = min(max(raw, 0.0), 1.0)"
  reward_full_rule: "reaching the target scores exactly 1.0 and beating it also scores 1.0; the target is a bar, not a point on a gradient"

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: "capped below Hard"
  perception_axis_exemption: "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

image:
  reference: "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
  pinned_by: digest
  rule: "pinned by @sha256:, never a floating tag. Harbor accepts any string and does not itself require a digest, so the digest requirement is this contract's and the lane enforces it."
  surfaces: [environment/Dockerfile, tests/Dockerfile]

# ---------------------------------------------------------------------------
# Divergences carried explicitly. Never silent.
# ---------------------------------------------------------------------------
solver_egress_divergence:
  bound_in_task_toml: open
  contract_field: "seed/contract.yaml batch.optimization_bindings.solver_egress reads setup-only"
  gap_id: gap-oer-solver-egress-ruled-stricter
  reading_a: "requirements/open-ended-research-optimisation-problems.md line 58 grants the solving model full internet access"
  reading_b: "the same file line 122 answers that internet is needed only for setup"
  ruling: "requirements/bia-environment-spec.md line 247 takes the stricter reading until the client resolves it, which is why the batch field reads setup-only"
  why_this_lane_binds_open: "the family delivery.network_policy block in the same contract binds agent_environment: egress allowed with the upstream deny-list, and the lane brief binds solver_egress = open at the agent surface with the verifier surface denied. This lane binds open and records the divergence; it does NOT amend the batch-level field."
  deny_list: [github.com, raw.githubusercontent.com, objects.githubusercontent.com]
  deny_list_is_not_containment: "A deny-list is not a containment proof. Mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any deny-list, which is exactly why the deterministic checker and not the network policy is the load-bearing control."
  verifier_surface: denied

reward_path_divergence:
  lane_brief_template: "/logs/verifier/reward.json"
  instrument_as_it_is: "/logs/verifier/reward.txt"
  instrument: "seed/forge/verifier.py REWARD_PATH, compared for equality against tests/checkers.yaml reward_path, reporting reward-path-unbound on any other value"
  resolution: "tests/checkers.yaml binds reward_path to the .txt path the parser actually requires. tests/test.sh and tests/reward.py write BOTH: the single float to /logs/verifier/reward.txt and the reward document, with reason and metric, to /logs/verifier/reward.json. task.toml [reward].path carries the .json document. Nothing is dropped and nothing is invented."
  not_resolved_by_this_lane: "which of the two the batch intends as canonical. Recorded, not decided."

free_axis_narrowing:
  stated: "the free axes are the optimization algorithm, its schedules and the initialization"
  as_realized: "a recipe document over the closed key set in environment/recipe_schema.json, executed by verifier-owned code in tests/bia_optim.py"
  why: "the grading process never imports the submission, so an arbitrary optimizer implementation supplied as code could not be executed inside the grader without breaking that rule"
  cost: "an algorithm outside the grammar cannot be expressed. The grammar spans sgd, momentum, nesterov, adam, adamw, lion and Newton-Schulz orthogonalized momentum, with five schedules, warmup, decoupled decay, gradient clipping, per-group learning-rate multipliers and three initialization schemes, but it is a narrowing and is recorded as one rather than presented as equivalent."

# ---------------------------------------------------------------------------
# The graded operating point is UNMEASURED. Everything below marked `fixture` is
# calibrated on a reduced CPU/GPU smoke shape and is NOT a measurement of the
# task. It must never be copied into environment/shape.json.
# ---------------------------------------------------------------------------
operating_point:
  graded_shape: environment/shape.json
  graded_state: unmeasured
  gap: gap-oer-scaled-operating-point-unmeasured
  consequence: "the reference is demonstrated end to end at the fixture shape only. No claim is made that the reference reaches 2690 steps on the bound H100 operating point, and none is made anywhere in this bundle."

fixture_shape:
  vocab_size: 256
  num_layers: 2
  model_dim: 64
  head_dim: 16
  seq_len: 64
  batch_tokens_per_step: 2048
  forward_passes_per_step: 1
  backward_passes_per_step: 1
  max_steps: 600
  eval_stride: 10
  sustain_window: 3
  target_loss: 1.75
  data_seed_dist: 20260101
  data_draw_train: 11
  data_draw_dev: 22
  stream_tokens_train: 200000
  stream_tokens_dev: 40000
  stream_tokens_val: 40000
  fixture_attempts: 14
  fixture_baseline_metric: 500
  fixture_target_metric: 150
  calibration: "measured by running the shipped baseline recipe and the shipped reference through the live tests/ chain at this shape. These are fixture anchors, not task anchors."

# ---------------------------------------------------------------------------
# The golden trajectory. A SYNTHETIC session used to compile the checker
# fixtures and tests/test_output.py. It mirrors the shape of the live reference
# trajectory without carrying any measured number, so recompute.py stays a pure
# data transformation with no model in it.
# ---------------------------------------------------------------------------
golden_trajectory:
  stride: 10
  sustain_window: 3
  target_loss: 1.75
  max_steps: 600
  baseline_metric: 500
  target_metric: 150
  attempt_seconds: 4.5
  # inherited_components is never taken from this file. recompute.py derives it
  # by real component equality against the named earlier attempt's recipe, in
  # exactly the way tests/session_driver.py derives it at run time, so an
  # inheritance claim in a fixture is as backed as one in a live session.
  recipe_bases:
    momentum: {optimizer: momentum, lr: 0.02, beta1: 0.9, beta2: 0.95, eps: 1.0e-08, weight_decay: 0.0,
               schedule: constant, warmup_frac: 0.0, decay_frac: 0.2, final_lr_frac: 0.0,
               grad_clip: 1.0, ns_steps: 5, embed_lr_mult: 1.0, head_lr_mult: 1.0,
               init_scheme: normal, init_scale: 1.0}
    ortho: {optimizer: ortho_momentum, lr: 0.02, beta1: 0.95, beta2: 0.95, eps: 1.0e-08, weight_decay: 0.0,
            schedule: linear_decay, warmup_frac: 0.02, decay_frac: 0.2, final_lr_frac: 0.0,
            grad_clip: 1.0, ns_steps: 5, embed_lr_mult: 1.0, head_lr_mult: 1.0,
            init_scheme: scaled_normal, init_scale: 1.0}
    adamw: {optimizer: adamw, lr: 0.006, beta1: 0.9, beta2: 0.95, eps: 1.0e-08, weight_decay: 0.01,
            schedule: cosine, warmup_frac: 0.05, decay_frac: 0.2, final_lr_frac: 0.0,
            grad_clip: 1.0, ns_steps: 5, embed_lr_mult: 1.0, head_lr_mult: 1.0,
            init_scheme: scaled_normal, init_scale: 1.0}
  attempts:
    - {index: 1,  family: momentum, variant: {},                                     crossing: 500,  inherits_from: []}
    - {index: 2,  family: ortho,    variant: {},                                     crossing: 190,  inherits_from: []}
    - {index: 3,  family: adamw,    variant: {},                                     crossing: 160,  inherits_from: []}
    - {index: 4,  family: adamw,    variant: {embed_lr_mult: 2.0},                   crossing: 150,  inherits_from: [3]}
    - {index: 5,  family: adamw,    variant: {embed_lr_mult: 2.0, lr: 0.0096},       crossing: 150,  inherits_from: [4]}
    - {index: 6,  family: adamw,    variant: {embed_lr_mult: 2.0, head_lr_mult: 0.5}, crossing: 170, inherits_from: [4]}
    - {index: 7,  family: adamw,    variant: {embed_lr_mult: 2.0, warmup_frac: 0.08}, crossing: 180, inherits_from: [4]}
    - {index: 8,  family: adamw,    variant: {embed_lr_mult: 2.0, lr: 0.0075},       crossing: 150,  inherits_from: [4]}
    - {index: 9,  family: adamw,    variant: {embed_lr_mult: 2.0, beta2: 0.98},      crossing: 160,  inherits_from: [4]}
    - {index: 10, family: adamw,    variant: {embed_lr_mult: 2.0, weight_decay: 0.02}, crossing: 170, inherits_from: [4]}
    - {index: 11, family: adamw,    variant: {embed_lr_mult: 2.0, schedule: wsd, decay_frac: 0.3}, crossing: null, inherits_from: [4]}
    - {index: 12, family: adamw,    variant: {embed_lr_mult: 2.0, lr: 0.0051},       crossing: 160,  inherits_from: [4]}
  expected:
    frontier: [500, 190, 160, 150, 150, 150, 150, 150, 150, 150, 150, 150]
    frontier_improvements: [1, 2, 3, 4]
    consolidated_metric: 150
    consolidation_indices: [4, 5, 8]
    determining_index: 8
    reward: 1.0
    reason: consolidated-crossing-graded

consolidation_rules:
  multiplicity: 3
  min_frontier_improvements: 3
  min_inherited_components: 2
  min_determining_index: 3
  why: "the graded step is the m-th smallest sustained crossing over PAIRWISE DISTINCT recipe fingerprints, so one fortunate attempt cannot set it and neither can one recipe resubmitted m times. On top of that the determining attempt must sit at index 3 or later, the running best must strictly improve at least three separate times, and the determining attempt must inherit at least two component values from strictly earlier attempts that were on the running best when they ran. A fixed sweep of unrelated configurations therefore scores zero however good its best cell was."

# ---------------------------------------------------------------------------
# The checker fixtures recompute.py compiles. Each names the checker it fires,
# the reason it must emit, and the patch that produces it.
# ---------------------------------------------------------------------------
fixtures:
  accept_reference_session:
    kind: accept
    patch: {op: none}
    expect_reward: 1.0
    expect_reason: consolidated-crossing-graded
  accept_reported_within_tolerance:
    kind: accept
    patch: {op: set_report, index: 4, crossing_step: 170}
    expect_reward: 1.0
    expect_reason: consolidated-crossing-graded
    note: "the DIVERGENCE checker's accepting half on a NON-EMPTY claim, so it is not proved vacuously by a session that reports nothing"
  reject_readout_smoothed:
    kind: reject
    checker: graded_crossing_recomputed_unsmoothed
    patch: {op: set_eval_smoothing, index: 4, value: "ema-0.9"}
    expect_reason: readout-smoothed-on-the-graded-path
  reject_crossing_not_sustained:
    kind: reject
    checker: crossing_sustained_across_scheduled_evaluations
    patch: {op: break_window, index: 4, offset: 2, delta: 0.30}
    expect_reason: crossing-not-sustained
  reject_early_stop_claimed:
    kind: reject
    checker: early_halt_yields_no_crossing
    patch: {op: early_stop_claim, index: 11, claim: 120, halted_at_step: 150}
    expect_reason: early-stop-claimed-as-crossing
  reject_weights_not_harness_owned:
    kind: reject
    checker: evaluated_weights_owned_by_the_harness
    patch: {op: foreign_weights, index: 5, offset: 3}
    expect_reason: weights-not-harness-owned
  reject_unconsolidated:
    kind: reject
    checker: graded_metric_consolidated_over_distinct_recipes
    patch: {op: keep_one_crossing, index: 4}
    expect_reason: single-attempt-metric-unconsolidated
  reject_not_carried:
    kind: reject
    checker: refinement_frontier_carried_across_iterations
    patch: {op: flat_sweep}
    expect_reason: graded-outcome-not-carried
  reject_report_diverges:
    kind: reject
    checker: reported_crossing_reconciles_with_verifier_measurement
    patch: {op: set_report, index: 4, crossing_step: 60}
    expect_reason: reported-crossing-diverges-from-measurement
  reject_attempt_budget_exceeded:
    kind: reject
    checker: bound_envelope_respected
    patch: {op: set_attempt_seconds, index: 6, seconds: 500.0}
    expect_reason: attempt-budget-exceeded
  reject_frozen_axis_moved:
    kind: reject
    checker: frozen_axes_untouched
    patch: {op: frozen_write, index: 7, key: batch_tokens_per_step}
    expect_reason: frozen-axis-moved
  reject_stale_summary:
    kind: reject
    checker: carried_summary_is_current
    patch: {op: stale_summary, index: 6}
    expect_reason: stale-summary-carried

# ---------------------------------------------------------------------------
# Live end-to-end controls. These are real submissions the adequacy harness runs
# through the whole chain, not planted telemetry.
# ---------------------------------------------------------------------------
live_controls:
  - id: noop
    behaviour: "emits the same default recipe every attempt and never reads the history"
    expect_reason: single-attempt-metric-unconsolidated
  - id: blind_sweep
    behaviour: "walks a fixed list of unrelated configurations written before attempt one, never reads the history, claims no inheritance"
    expect_reason: graded-outcome-not-carried
  - id: readout_smoothing
    behaviour: "runs the reference ladder but reports an EMA-blended crossing far below what the verifier measures"
    expect_reason: reported-crossing-diverges-from-measurement
    note: "the submission-drivable half of readout manipulation. The graded path itself cannot be smoothed by a submission, which is why the VALUE checker carries a planted rejecting half and records the substitution."
  - id: early_stop
    behaviour: "halts training just past a favourable evaluation and reports that evaluation as a crossing"
    expect_reason: early-stop-claimed-as-crossing
  - id: stale_summary
    behaviour: "caches the first state.json and echoes its summary_digest for the rest of the session"
    expect_reason: stale-summary-carried
  - id: frozen_axis
    behaviour: "proposes batch_tokens_per_step in its recipe to buy a bigger batch"
    expect_reason: frozen-axis-moved
  - id: intermediate
    behaviour: "a weaker but honest refinement policy that consolidates above the target"
    expect_reason: consolidated-crossing-graded
    note: "carries the non-binary half of the reward: it must score strictly between 0.0 and 1.0"

statement_ambiguity:
  claim: "instruction.md admits exactly one reading of what is optimized"
  reading_one: "the section headed 'The graded quantity, stated plainly' names the consolidated sustained crossing step of the session, lower is better"
  reading_two: "the reward block gives raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric) and names agent_metric as the consolidated sustained crossing step defined above"
  reduce_to: "both readings resolve agent_metric to checkers.consolidation(session)[0], the m-th smallest sustained crossing over pairwise-distinct recipe fingerprints"
  competing_quantities_ruled_out:
    - "best single attempt: ruled out by the multiplicity rule stated in the same section and by the EFFECT checker"
    - "the agent's reported crossing: ruled out in the same section and by the DIVERGENCE checker"
    - "wall-clock time: never named as graded anywhere; the reward block names only a step count"
    - "final validation loss: named as a bar the crossing must clear, never as the graded scalar"

grading_basis:
  graded_numbers_produced_by: "the verifier's own process"
  never_read: ["the submission's standard output", "any field the submission wrote, other than report which is graded for divergence only", "any file the submission produced beside proposal.json"]
  checker_import_allowlist: [json, math, hashlib, pathlib, dataclasses, typing]
  grader_never_imports_submission: "tests/runner.py copies the submission alone into a fresh temporary directory, launches it as a new session leader under an environment allowlist, captures its output, and kills the whole process group in a finally block. tests/grade.py imports tests/checkers.py and never the submission."
  seed_rule: "the training seed is derived from the recipe fingerprint, so it is reproducible for an auditor and not selectable by the agent. Resubmitting an identical recipe gets an identical seed, so a fortunate seed cannot be shopped for."

lower_layer_read_only:
  surface: "assembled the way Harbor assembles it for a NON-ORACLE agent: task.toml, instruction.md and environment/ only"
  proof: "seed/tasks/OER-02/adequacy.py assembles that surface through seed/forge/launcher.py plan, attempts a write to every lower-layer path an agent can name, asserts every attempt is refused, then asserts the overlay's upper layer is writable"
  mounting_is_not_proof: "no mount is performed anywhere in this harness. A lowerdir option describes an enforcement a kernel would apply if a mount happened, and a read-only claim resting on a mount that never happened would be a claim about nothing."

generated_artifacts:
  banner: "GENERATED SECTION. DO NOT HAND-EDIT."
  source: solution/grounding.yaml
  files:
    - solution/solve.sh
    - solution/TRUTH.md
    - solution/rubrics.json
    - solution/golden_trajectory.json
    - tests/test_output.py
    - tests/fixtures/
  determinism: "recompute.py invokes no model, no network, no clock, no locale and no random source. It reads solution/grounding.yaml and hashes solution/reference.py bytes, both frozen files, and nothing else."

rubric_targets:
  - id: reference-accepted-end-to-end
    criterion: "the live checker chain scores the shipped reference exactly 1.0 at the fixture shape, with the reference bytes sha256-bound into the fixture"
  - id: consolidation-required
    criterion: "the graded metric is the third smallest sustained crossing over pairwise-distinct recipe fingerprints"
  - id: carry-required
    criterion: "the determining attempt sits at index three or later, the running best improves at least three times, and the determining attempt inherits at least two components from earlier frontier attempts"
  - id: readout-recomputed
    criterion: "every graded number is the verifier's own unsmoothed evaluation of weights its own loop held"
  - id: crossing-sustained
    criterion: "a crossing holds at its step and at the next three verifier-scheduled points"
  - id: bounds-distinct
    criterion: "max_timeout and budget_hours are emitted as distinct fields with distinct roles and neither is an alias of the other"

declared_gaps:
  - gap-oer-budget-field-name-collides-with-its-role
  - gap-oer-solver-egress-ruled-stricter
  - gap-oer-scaled-operating-point-unmeasured
  - gap-oer-refinement-evidence-owed

