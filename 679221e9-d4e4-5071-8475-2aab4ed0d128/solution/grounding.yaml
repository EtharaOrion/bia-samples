# This file is the SINGLE derivation source for every generated artifact in this
# bundle. solution/recompute.py reads this file and nothing else that is not
# digest-bound below, and derives: the golden trajectory, the checker fixtures,
# solution/solve.sh, solution/TRUTH.md, solution/rubrics.json and
# tests/test_output.py. It invokes no model, no network, no clock, no locale and
# no random source. Two runs over frozen bytes produce byte-identical output.

derivation:
  generated_artifacts:
    - solution/solve.sh
    - solution/TRUTH.md
    - solution/rubrics.json
    - tests/test_output.py
  generated_banner: "GENERATED SECTION. DO NOT HAND-EDIT."
  check_mode: "python3 solution/recompute.py --check exits non-zero when any generated artifact drifts from what this source derives"
  substrate_binding: >-
    recompute.py does not carry a second copy of the frozen substrate. It loads
    environment/model_stats.json, environment/eval_corpus.json and
    environment/reference_unquantized.json and refuses to derive anything unless
    each file's sha256 equals the value bound below. A duplicated copy would be a
    second source that could disagree with the first; a digest-bound read is one
    source that cannot.

substrate_sha256:
  model_stats.json: a898f6c949cd972f54f1935bea148de96c7fe64ad98ebc5bd9c0941b6ccb3c91
  eval_corpus.json: 64e7d5ff5c29730e6df0f56e18bec2449548f7425552081e6d3b427764791d9f
  reference_unquantized.json: 82f006653e6154af883272db435f298ed13d9558e58cb043ebec698fa863902a

reference:
  file: solution/reference.py
  allocation_sha256: 7b39dd1ca7b87851867580c4bab4fcb52737858613a7cc905b1f516d13d1de92
  allocation_sha256_note: >-
    sha256 over the canonical JSON of REFERENCE_ALLOCATION, not over the file's
    prose. Binding the payload rather than the file means a comment edit does not
    invalidate the fixture while an allocation edit does, which is the direction
    that matters.
  scheme: error-feedback
  bits:
    emb.tok: 3
    blk0.attn.qkv: 5
    blk0.attn.proj: 5
    blk0.mlp.fc: 4
    blk0.mlp.proj: 4
    blk1.attn.qkv: 6
    blk1.attn.proj: 4
    blk1.mlp.fc: 4
    blk1.mlp.proj: 4
    blk2.attn.qkv: 6
    blk2.mlp.fc: 4
    lm_head: 3
  why: >-
    The budget is spent exactly, to the bit: 147849216 allocated against 147849216
    budgeted, a mean of 4.0 bits per parameter. Spend is moved off the token
    embedding and the output head, the two largest and least curvature-sensitive
    tensors, and onto the three attention qkv projections where sensitivity times
    outlier factor is highest. The scheme is error-feedback, the lowest-multiplier
    scheme in the closed set. The allocation is deliberately not maximally
    non-uniform, because departure from uniform widens the calibration jitter on
    its own reading; the reference trades mean for band width so that the LOWER
    EDGE clears the margin rather than the mean.

bindings:
  separation_margin: 0.05
  frontier_defeat_floor: 0.50
  bits_per_param_budget: 4
  control_bits: 4
  control_scheme: rtn
  evaluation_repeat_floor: 5
  max_timeout_hours: 6.0
  budget_hours: 0.12
  max_attempts: 50
  final_selection: best
  image: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407
  reward_path: /logs/verifier/reward.txt
  score_document_path: /logs/verifier/score.json

anchors:
  anchors_state: absent
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  schema_bound_in_full: true
  reward_formula_lower_is_better: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
  clip: "score = min(max(raw, 0.0), 1.0)"
  why_gradable_anyway: >-
    The live instrument grades a within-run separation against the harness's own
    control allocation, measured on the same frozen shards in the same
    verifier-derived order against the same frozen reference. That difference is
    anchor-free by construction, so the slot is gradable today without inventing
    either endpoint of the anchored formula. The anchored formula is carried above
    unevaluated, which is what an absent anchor looks like when it is reported
    honestly.

solver_egress_divergence:
  bound_here: open
  batch_field_reads: setup-only
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: "requirements/open-ended-research-optimisation-problems.md line 58 grants full internet access to the solving agent."
  reading_b: "requirements/open-ended-research-optimisation-problems.md line 122 says internet is needed only for setup, and requirements/bia-environment-spec.md line 247 takes the stricter reading."
  resolution: >-
    This lane binds open egress at the agent surface, matching the family
    delivery.network_policy block that binds agent_environment egress allowed with
    the upstream deny-list. The batch-level optimization_bindings.solver_egress
    field still reads setup-only and this lane does NOT amend it. The divergence is
    recorded here rather than reconciled, because reconciling it silently would
    delete the disagreement instead of reporting it.
  deny_list_is_not_containment: >-
    The deny-list names github.com, raw.githubusercontent.com and
    objects.githubusercontent.com. It is not a containment proof. Mirrors, package
    caches, paraphrased write-ups and released model weights all carry a recipe
    past any deny-list. That is exactly why the deterministic checker and not the
    network policy is the load-bearing control here: the graded quantity is
    recomputed by the verifier from harness-owned state, so a recipe fetched from
    anywhere still has to produce a real allocation that survives a real
    measurement.
  verifier_surface: denied

readout_manipulation_closure:
  obligation: >-
    Adapted from the nanogpt-speedrun readout finding to a perplexity metric. The
    finding was that an entire gain can be readout manipulation: EMA-blending a
    noisy readout until a dip reads as a crossing, and early-stopping on a
    favourable evaluation. Guarding the path from rollout bytes to reward does not
    close it, because the defect is in the SEMANTICS of those bytes.
  closures:
    - "The verifier computes the perplexity itself, at every scheduled point, from the state it quantized. Checker: graded_metric_harness_sourced."
    - "No smoothing on the graded path. A submission may smooth its own readout; the graded reading is raw. Checker: graded_perplexity_unsmoothed, zero_reason readout-smoothed-on-graded-path."
    - "The reading is sustained: one quantized state, read at every scheduled point, at or above the repeat floor. Checker: reading_sustained_across_scheduled_points."
    - "An early stop on a favourable evaluation is graded as not having established the metric, with its own reason, not as an absent result. Checker: no_early_stop_on_favourable_evaluation, zero_reason early-stop-without-sustained-reading."
    - "The evaluated state is the state the harness owns, digested once and read back at every point, not a state the submission selected. Checker: reading_sustained_across_scheduled_points state digest clause plus graded_metric_harness_sourced."
    - "The evaluation ORDER is derived by the verifier from the frozen corpus digest, so tuning to whichever shard is listed first tunes to nothing. Checker: evaluation_points_verifier_ordered."

outcomes:
  established:
    verdict: established
    reason: separation-margin-cleared
    condition: "lower_edge = separation_mean - noise_half_width >= 0.05"
    reward: 1.0
  failed:
    verdict: failed
    reason: degradation-past-bar
    condition: "upper_edge = separation_mean + noise_half_width < 0.0"
    reward: 0.0
    gated_by: allocation_not_degrading_past_bar
  unproven:
    verdict: unproven
    reason: significance-unestablished-at-ceiling
    condition: "upper_edge >= 0.0 and lower_edge < 0.05, at the bound evaluation ceiling of 5 points"
    reward: "clamp(lower_edge / 0.05, 0.0, 1.0), a value in [0.0, 1.0)"
    meaning: >-
      The run COMPLETED. Every gate held. Nothing failed and nothing was
      established. The evaluation budget was the binding limit: five shards were
      not enough to separate this allocation from the control at the bound margin.
      This is a THIRD outcome and it is never reported as either neighbour.

reward_ramp:
  statement: >-
    The reward is continuous in the measured separation and does not flip at the
    margin. The verdict flips at the margin because a verdict is a claim; the
    number does not, because the measurement did not.
  function: "score_separation(separation_mean, noise_half_width, margin) = clamp((separation_mean - noise_half_width) / margin, 0.0, 1.0)"
  measured_in: seed/tasks/OER-20/feasibility.yaml

golden_trajectory:
  - step: 1
    action: "Read instruction.md and environment/model_stats.json. Note that the budget is fixed at 4 bits per parameter and that sensitivity times outlier_factor is the quantity the harness error model concentrates on."
    holds: "the metric is perplexity degradation, lower better; the verifier computes it"
  - step: 2
    action: "Compute the control allocation by hand: every tensor at 4 bits under rtn. Observe that it spends the budget exactly and that its separation against itself is identically zero, so a no-op submission establishes nothing."
    holds: "a no-op is unproven at reward 0.0, not a failure"
  - step: 3
    action: "Move bits off emb.tok and lm_head, the two largest low-sensitivity tensors, onto blk1.attn.qkv and blk2.attn.qkv, the two highest sensitivity-times-outlier tensors. Keep the total at or under budget."
    holds: "reallocating is the task; raising the total is a different task and scores zero"
  - step: 4
    action: "Run environment/quantize_lab.py on the candidate. Read the per-shard separations, not just the mean."
    holds: "the band is the measurement; the mean alone is not"
  - step: 5
    action: "Observe that pushing further from uniform improves the mean and widens the band. Stop where the LOWER EDGE is maximal rather than where the mean is maximal."
    holds: "establishing a result and having one are different; the lower edge is what is graded"
  - step: 6
    action: "Select scheme error-feedback, the lowest-multiplier scheme in the closed set, and write allocation.json. Report no perplexity number."
    holds: "a reported number is recorded beside the graded path and never on it"

