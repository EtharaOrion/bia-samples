bindings:
  tags: [optimization, bounded-continuous]
  image: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts, in hours
  budget_hours: 0.3
  budget_hours_minutes: 18.0
  budget_hours_role: per-attempt completion bound, in hours
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  max_attempts: 50
  final_selection: best
  budget_envelope: one H100, single accelerator, no multi-GPU scaling
  budget_margin: 10 percent
  compute_envelope_accelerators: 1
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier_statement: >-
    This task family is text and code only, so the Perception axis carries no
    category; the exemption is batch-level, recorded once, closes by nothing, and
    no perception lever is authored to fill it. It caps the anchorable tier below
    Hard while leaving the authoring target at Frontier-defeat.

solver_egress_divergence:
  agent_surface_reading: open
  bound_here: open
  batch_field_reading: setup-only
  gap_id: gap-oer-solver-egress-ruled-stricter
  both_readings:
    - requirements/open-ended-research-optimisation-problems.md line 58 grants the
      solving agent full internet access.
    - requirements/open-ended-research-optimisation-problems.md line 122 says
      internet is needed only for setup, and
      requirements/bia-environment-spec.md line 247 takes the stricter reading,
      which is what seed/contract.yaml batch.optimization_bindings.solver_egress
      records as setup-only.
  family_delivery_block: >-
    The family delivery.network_policy block in the same contract binds
    agent_environment egress allowed with the upstream deny-list, which is the
    reading bound in this slot's task.toml as solver_egress = open.
  not_amended_by_this_lane: >-
    This lane binds open at its own agent surface and does NOT amend the
    batch-level field. The divergence is recorded here rather than resolved.
  verifier_surface: denied
  deny_list_is_not_a_containment_proof: >-
    The deny-list names github.com, raw.githubusercontent.com and
    objects.githubusercontent.com. Mirrors, caches, paraphrased write-ups and model
    weights all carry a recipe past any deny-list. The deterministic checker chain,
    and not the network policy, is the load-bearing control.

gaps:
  - id: gap-oer-per-family-anchors-unmeasured
    state: declared, inherited from the batch
    effect_here: >-
      baseline_metric and target_metric are unbound for this slot. The reward schema is
      bound in full and instantiated against two scale points the verifier measures in
      run.
    closes_by: a measured F9 baseline and target from published evidence recorded in seed/contract.yaml
  - id: gap-oer-22-reward-scale-points-are-measured-in-run
    state: declared by this lane
    effect_here: >-
      The two numbers the bound reward formula is instantiated against are in-run
      measurements over this bundle's own frozen checkpoint and the verifier's own
      held-out folds, not published evidence. They make the formula computable and they
      do not stand in for family anchors. This supersedes
      gap-oer-22-reward-scale-points-are-substrate-internal, which described the retired
      surrogate.
    closes_by: binding measured F9 anchors, at which point the scale points are replaced
  - id: gap-oer-22-attempt-budget-unmeasured-against-real-forward-passes
    state: declared by this lane
    effect_here: >-
      budget_hours is bound to 0.3 and was first set against a closed-form surrogate that
      did no forward pass. This lane has measured the verifier side of the real path and
      records that measurement in solution/TRUTH.md, and it has NOT measured a full
      solving attempt on the bound one-H100 envelope, so the per-attempt bound stays
      provisional.
    closes_by: a measured full attempt against real forward passes on the bound envelope
  - id: gap-oer-22-calibration-transfer-unquantified
    state: declared by this lane
    effect_here: >-
      The reference selects its allocation on windows of the calibration slice in force,
      and the graded reading is on held-out validation folds. This lane measured that the
      selected candidate beats the uniform baseline at every scheduled fold at 1500
      checkpoint steps, and measured that it does not at 600 or at 150. It did NOT
      measure how far a calibration-slice ranking generalises in general, nor where
      between 600 and 1500 steps the crossing lies. The reference's margin over the
      baseline is a measured fact about this checkpoint and these folds, not a bound.
    closes_by: a measured transfer study over more than one checkpoint and more than one pin
  - id: gap-oer-22-checkpoint-build-cost-exceeds-declared-attempt-budget
    state: declared by this lane
    effect_here: >-
      The checkpoint step count is 1500, which is the smallest of the three counts this
      lane measured at which the reference reaches its own bar at every scheduled fold.
      It costs 1500 x 3.25s, being 81 minutes, on one H100 on each surface.
      environment/provision.sh materialises it on entry to the agent surface, so a
      solving attempt that pays that build exceeds the declared per-attempt budget_hours
      of 0.3, being 18 minutes. This lane did NOT move budget_hours to fit, because
      lowering a declared bound to admit a measurement is the one move it is not allowed
      to make. Which of the two values is wrong is not resolvable inside this slot: the
      step count is fixed by what makes the metric measurable at all, and the attempt
      budget is a batch-level grant.
    closes_by: >-
      a batch ruling that either rebinds budget_hours against a measured attempt on the
      bound envelope, or moves the checkpoint build off the per-attempt clock so the
      agent surface inherits a built checkpoint rather than materialising one
  - id: gap-oer-22-contamination-screen-absent
    state: declared by this lane
    effect_here: >-
      No contamination screen is authored here. probe-recall-a-published-recipe in
      shortcut_probes.yaml is recorded as NOT closed.
    closes_by: the batch-level screening roots being pinned and a screen being run over the frozen bundle bytes
  - id: gap-oer-budget-field-name-collides-with-its-role
    state: declared, inherited from the batch
    effect_here: budget_hours is bound to 0.3 and marked provisional in task.toml.
    closes_by: an upstream correction to requirements/bia-environment-spec.md line 143
  - id: gap-oer-solver-egress-ruled-stricter
    state: declared, inherited from the batch
    effect_here: see solver_egress_divergence above.
    closes_by: an upstream ruling that reconciles line 58 with line 122

local_exercise:
  reward_root_redirect: >-
    /logs/verifier/ is a single shared host path and concurrent lanes collide on
    it. Every local exercise of tests/test.sh in this lane redirected the reward
    root to a lane-private directory through the OER22_REWARD_ROOT environment
    variable. The bound contract path inside the bundle stays
    /logs/verifier/reward.txt; only the local exercise was redirected.

golden_trajectory:
  schema: oer22.golden_trajectory/v2
  # The reference agent's own recorded reasoning path. Derived, not narrated:
  # recompute.py turns each step into the artifact it names. No graded number appears
  # here, because every graded number in this slot is a forward pass the verifier runs
  # and writing one down would be publishing a fabricated measurement.
  graded_state: measured-in-run-by-the-verifier
  steps:
    - step: 1
      action: read instruction.md and enumerate the frozen and free axes
      calibration_version_observed: 1
    - step: 2
      action: probe the calibration handle and record version and tick
      calibration_version_observed: 1
    - step: 3
      action: >-
        measure the per-tensor cost curve over the observed calibration slice and fit an
        allocation against it
      calibration_version_observed: 1
    - step: 4
      action: >-
        re-probe the calibration handle before submitting rather than assuming the
        iteration-three observation is still true, and observe that the version in
        force has moved
      calibration_version_observed: 2
    - step: 5
      action: >-
        re-measure the cost curve on the slice now in force, refit, select among the
        candidates by joint measurement, and record the pin witness and the slice content
        witness over the bytes actually read
      calibration_version_observed: 2
    - step: 6
      action: >-
        account the bit budget including the per-group scale tensors and confirm the
        allocation fits
      calibration_version_observed: 2
    - step: 7
      action: >-
        complete every evaluation point the verifier schedules, declare no readout
        filter, and write submission.json
      calibration_version_observed: 2

