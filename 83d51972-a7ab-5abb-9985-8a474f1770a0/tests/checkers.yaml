schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

clock_ownership: >-
  THE HARNESS OWNS THE CLOCK. Nothing on this slot's graded path is a timing quantity, and no
  checker is permitted to read a clock even so. tests/runner.py launches
  environment/build_index.py over the BUNDLE's frozen corpus and frozen index specification in
  an isolated subprocess, as a new session leader under a five-key environment allowlist, and
  kills the whole process group in a finally block. That subprocess emits one telemetry record
  per corpus record, one per band collision, and one carrying the calibration, and every
  checker below reads those records through the tests/checkers.py Harness handle. No checker
  calls time, datetime, perf_counter, monotonic or any other clock, directly or transitively.
  That is what keeps every checker pure, deterministic and replayable over a rebuilt index,
  and it is also what makes the grading reproducible.

discovery: >-
  Two values are established in the BUILT index and nowhere else. The ADJUDICATION THRESHOLD is
  calibrated by nd_index.calibrate from the built index's own candidate similarity histogram,
  and the COLLISION WITNESS PAIR is the maximal band collision the adjudication refuses to
  group. Neither appears in instruction.md, in task.toml, in environment/corpus.jsonl, in
  environment/index_spec.json or in any other agent-visible byte; both come into existence on
  the single RUN line of environment/Dockerfile that builds the index, and both are read back
  through environment/index_query.py on the agent surface and through the Harness handle on
  this surface. The graded outcome of adjudication_threshold_established depends on the first,
  the graded outcome of collision_witness_verified depends on the second, and the graded
  outcome of no_unsupported_pair depends on the first as well, since the verifier's own
  adjudication is computed at the threshold the rebuilt index established.

purity: >-
  Every checker is a pure function of the harness handle and the bound constants. Imports in
  tests/checkers.py are confined to json, hashlib, pathlib, dataclasses and typing. No planted
  answer file is read, no environment secret is read, no random source is consulted, no socket
  is opened, and the grading process never imports the submission: the submission is data and
  tests/runner.py launches only the harness-owned index builder.

readout_manipulation: >-
  The graded quantity is near-duplicate recall against an adjudication the VERIFIER computed.
  The verifier rebuilds the index from the frozen corpus, reads the threshold off its own
  calibration, recomputes the exact quantised Jaccard similarity of every unordered pair of
  distinct records, closes the thresholded edges into duplicate groups, and takes every
  within-group pair. It is never a number the submission reported. Precision is a hard
  constraint and not a term traded against recall, so a submission padded toward higher
  coverage is caught by no_unsupported_pair rather than rewarded. Returning every pair or
  returning none is caught by adjudication_not_degenerate, before the precision gate, so each
  degenerate answer carries the reason that names what it actually is.

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py walks the nine checkers below in the declared order and returns 0.0 with the
    first failing checker's machine-readable reason. Only when every required checker passes
    does it compute the continuous term, the clamped normalised recall. That is exactly
    required_pass over the required set, composed with a bounded-continuous score inside the
    passing region, so the reward is never binary and every zero is attributed.
  reward_formula: raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  direction: higher is better
  never_binary: true

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  family_baseline_metric: null
  family_target_metric: null
  note: >-
    F4 anchors are unmeasured, so the reward SCHEMA is bound in full and no family baseline or
    target number is invented. The two numbers tests/bound.json carries are instance-local,
    measured by solution/recompute.py on this slot's own frozen substrate, and are declared
    under gap-oer-27-instance-local-anchors-not-family-anchors as NOT family anchors. The
    baseline is the recall of the honest shallow answer, which keeps the index's own candidate
    pairs at or above the calibrated threshold; the target is recall 1.0.

rejecting_fixtures:
  note: >-
    Every fixture is the reference submission with ONE field changed and no other byte moved.
    Each is frozen under solution/fixtures/rejecting/<id>/submission.json and each is exercised
    by a compiled test in tests/test_output.py. No checker's rejecting half is carried on a
    substitution: every one of them is reached by a submission a solver could actually write.
  entries:
    - id: threshold_minus_one_step
      moves: adjudication_threshold, down by exactly one representable step of the quantum grid
      reason: threshold-not-established
    - id: threshold_plus_one_step
      moves: adjudication_threshold, up by exactly one representable step of the quantum grid
      reason: threshold-not-established
    - id: threshold_guessed_round
      moves: adjudication_threshold, to three quarters of the quantum, the round value a guesser reaches for
      reason: threshold-not-established
    - id: witness_left_member_swapped
      moves: collision_witness, first member only, to another record the index does collide
      reason: witness-not-colliding
    - id: witness_right_member_swapped
      moves: collision_witness, second member only, to another record the index does collide
      reason: witness-not-colliding
    - id: witness_not_a_collision
      moves: collision_witness, to a pair the index never places in a common band
      reason: witness-not-colliding
    - id: witness_runner_up_collision
      moves: collision_witness, to the refused collision that comes second under the bound ordering
      reason: witness-not-colliding
    - id: every_pair_returned
      moves: near_duplicate_pairs, to the complete pair universe
      reason: adjudication-degenerate
    - id: no_pair_returned
      moves: near_duplicate_pairs, to the empty list
      reason: adjudication-degenerate
    - id: collision_census_inflated
      moves: index_collision_count, up by one
      reason: collision-census-diverges
    - id: candidate_pairs_only
      moves: near_duplicate_pairs, to the index candidate pairs the adjudication accepts
      reason: graded, and the reward is exactly 0.0 because that answer sits on the instance baseline

checkers:
  - id: corpus_and_spec_unmodified
    statement: "The frozen corpus and the frozen index specification are byte-identical to the bound digests, and the index the verifier rebuilt over them carries the bound record count, quantum and calibration."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_corpus_and_spec_unmodified
    zero_reason: frozen-inputs-modified
    required: true
    weight: 1
    basis: computed
    live_state_read: "sha256 over the bundle's environment/corpus.jsonl and environment/index_spec.json as they stand on disk, and the header and calibration records of the index the verifier's own subprocess rebuilt."
    compiled_test: "tests/test_output.py::test_corpus_and_spec_unmodified"

  - id: submission_pairs_wellformed
    statement: "Every submitted pair names two distinct records that exist in the corpus, is written smaller-identifier-first, appears once, and the submission declares the corpus it adjudicated, an exact estimator, and the duplicate group count the verifier's own adjudication holds."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_submission_pairs_wellformed
    zero_reason: pair-set-malformed
    required: true
    weight: 1
    basis: computed
    live_state_read: "the submission's near_duplicate_pairs, coverage, readout and duplicate_group_count, against the record identifiers the rebuilt index emitted and the grouping the verifier computed."
    compiled_test: "tests/test_output.py::test_submission_pairs_wellformed"

  - id: pair_listing_ordered
    statement: "The submitted pair listing is strictly ascending in canonical order, so the answer is a set presented once rather than a stream that may repeat or double back."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_pair_listing_ordered
    zero_reason: pair-listing-disordered
    required: true
    weight: 1
    basis: computed
    live_state_read: "the order of the submission's near_duplicate_pairs entries as written."
    compiled_test: "tests/test_output.py::test_pair_listing_ordered"

  - id: adjudication_threshold_established
    statement: "The threshold the submission adjudicates at is the threshold the built index calibrated, on the quantum grid."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_adjudication_threshold_established
    zero_reason: threshold-not-established
    required: true
    weight: 1
    basis: computed
    live_state_read: "the adjudication_threshold field of the calibration record the verifier's own rebuilt index emitted, against the submission's adjudication_threshold."
    compiled_test: "tests/test_output.py::test_adjudication_threshold_established"
    grades_discovery_value: adjudication_threshold
    rejecting_half: "solution/fixtures/rejecting/threshold_minus_one_step, threshold_plus_one_step, threshold_guessed_round"

  - id: index_collision_census_agrees
    statement: "The submission's count of the built index's colliding pairs equals the count the verifier's own rebuilt index holds."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_index_collision_census_agrees
    zero_reason: collision-census-diverges
    required: true
    weight: 1
    basis: computed
    live_state_read: "every collision record the rebuilt index emitted, against the submission's index_collision_count and the bound census."
    compiled_test: "tests/test_output.py::test_index_collision_census_agrees"
    rejecting_half: solution/fixtures/rejecting/collision_census_inflated

  - id: adjudication_not_degenerate
    statement: "The adjudication is neither empty nor a sweep: it carries at least one pair and no more than a quarter of the pair universe."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_adjudication_not_degenerate
    zero_reason: adjudication-degenerate
    required: true
    weight: 1
    basis: computed
    live_state_read: "the submitted pair set against the pair universe the rebuilt index's record list determines."
    compiled_test: "tests/test_output.py::test_adjudication_not_degenerate"
    rejecting_half: "solution/fixtures/rejecting/every_pair_returned, no_pair_returned"

  - id: no_unsupported_pair
    statement: "Not one submitted pair falls outside the verifier's own adjudication, which is every within-group pair of the duplicate grouping the rebuilt index's threshold determines. Precision is a hard constraint: one unsupported pair scores zero however high the recall."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_no_unsupported_pair
    zero_reason: adjudication-unsupported
    required: true
    weight: 1
    basis: computed
    live_state_read: "the exact quantised similarity of every unordered pair of distinct records, recomputed by the verifier from the shingle sets the rebuilt index emitted, closed into duplicate groups at the calibrated threshold."
    compiled_test: "tests/test_output.py::test_no_unsupported_pair"
    grades_discovery_value: adjudication_threshold

  - id: collision_witness_verified
    statement: "The submitted collision witness is a pair the built index actually collided, reported with the band count and similarity the index recorded, that the adjudication does not place in a common duplicate group, and that no other refused collision beats under the bound ordering."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_collision_witness_verified
    zero_reason: witness-not-colliding
    required: true
    weight: 1
    basis: computed
    live_state_read: "the collision records the rebuilt index emitted with their band counts, and the duplicate grouping the verifier computed, against the submission's collision_witness block."
    compiled_test: "tests/test_output.py::test_collision_witness_verified"
    grades_discovery_value: collision_witness_pair
    rejecting_half: "solution/fixtures/rejecting/witness_left_member_swapped, witness_right_member_swapped, witness_not_a_collision, witness_runner_up_collision"

  - id: recall_sustained_across_shards
    statement: "The recall holds inside every verifier-scheduled shard of the corpus: each shard that carries any near-duplicate pair holds at least the bound fraction of its pairs."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_recall_sustained_across_shards
    zero_reason: recall-not-sustained
    required: true
    weight: 1
    basis: computed
    live_state_read: "the verifier's own near-duplicate pair set partitioned into shards the verifier itself schedules over record position, never over a partition the submission declared."
    compiled_test: "tests/test_output.py::test_recall_sustained_across_shards"
