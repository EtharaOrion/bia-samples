# ---------------------------------------------------------------------------
# Statement ambiguity: exactly one graded outcome. FORGE.md Phase 1 item 10a.
# Authored by reading instruction.md in full and the live verifier, never the prose.
# ---------------------------------------------------------------------------

statement_ambiguity:
  graded_scalar: "reward, the float tests/grade.py::grade emits from tests/checkers.py::classify_separation and ::score_separation as clamp((separation_mean - noise_half_width) / 0.05, 0, 1)"
  readings:
    - id: reading_a_noise_band_lower_edge
      source: "instruction.md, section 'The part that decides most submissions: the noise band', lines 58 and 70"
      reduces_to: >-
        Maximise the lower edge of the measured separation band, that is mean minus
        half-range of the per-point amount by which the submitted allocation's perplexity
        degradation is smaller than the verifier's control allocation, scored on the
        continuous ramp clamp((mean - half_range) / 0.05, 0, 1).
    - id: reading_b_second_reading_section
      source: "instruction.md, section 'Second reading, same quantity', line 86"
      reduces_to: >-
        Reading the document backwards from the outcome table, maximise the verifier's own
        perplexity degradation from real forward passes of the frozen checkpoint over a
        held-out FineWeb slice, differenced against the verifier's own control allocation at
        the same fixed budget, with the lower edge of the resulting band compared to 0.05.
  identical: true
  proof_method: >-
    Both readings name the same two telemetry fields and the same comparison against 0.05,
    and exactly one function turns those fields into the reward.
    tests/checkers.py::classify_separation reads measurement['separation_mean'] and
    measurement['noise_half_width'], forms lower = mean - half, and calls
    tests/checkers.py::score_separation, whose docstring states 'the graded quantity is the
    lower edge of the measured separation band' and which ramps linearly in
    edge = separation - half_width, reaching full exactly where the edge reaches the bound
    margin. tests/grade.py::grade then sets reward = 1.0 if the verdict is ESTABLISHED else
    the ramp value, and clamps it into [0, 1] before writing one scalar. There is no second
    numeric output: the bit budget, the frozen declarations, the readout filter, the
    evaluation order and the sustain condition all enter as gates that force 0.0, never as
    terms that scale the band. A reader can check the identity by substituting the same
    (mean, half_range) pair from either section into score_separation and observing one float.

