# This file is the SINGLE derivation source for every generated artifact in this
# bundle. solution/recompute.py reads this file and nothing else that is not
# digest-bound below, and derives: tests/calibration.py, solution/solve.sh,
# solution/TRUTH.md, solution/rubrics.json and tests/test_output.py. It invokes no
# model, no network, no clock, no locale and no random source. Two runs over frozen
# bytes produce byte-identical output.
#
# WHAT THIS PASS RE-BASED, and why the source moved rather than the artifacts. The
# preceding pass replaced this slot's arithmetic surrogate with a real checkpoint and
# a real forward pass, repinned tests/calibration.py, tests/test_output.py,
# solution/TRUTH.md and solution/solve.sh in place, and recorded in TRUTH.md itself
# that it had not rewritten this file. It also left solution/recompute.py calling a
# tests/runner.py API that the same re-base had removed, so the derivation could not
# be run at all and the drift could not be seen. The artifacts were correct and the
# source was stale, so this pass moved the source onto the artifacts rather than
# regenerating correct artifacts from a stale source.

derivation:
  generated_artifacts:
    - tests/calibration.py
    - solution/solve.sh
    - solution/TRUTH.md
    - solution/rubrics.json
    - tests/test_output.py
  generated_banner: "GENERATED SECTION. DO NOT HAND-EDIT."
  check_mode: "python3 solution/recompute.py --check exits non-zero when any generated artifact drifts from what this source derives"
  substrate_binding: >-
    recompute.py does not carry a second copy of the frozen substrate and it does not
    carry a second copy of the reference allocation. It VERIFIES every carrier named
    under `substrate.carriers` against the byte length and the sha256 recorded there,
    reads solution/reference.py only after that file's allocation payload matches
    `reference.allocation_sha256`, and refuses to derive anything if either binding
    moves. A duplicated copy would be a second source that could disagree with the
    first; a digest-bound read is one source that cannot.
  carriers_are_never_written: >-
    The carriers are inputs to the derivation and are absent from its artifact map.
    recompute.py reads and checks them and has no branch that writes one, because two
    of the three are declarations this bundle authored and the third is upstream
    FineWeb10B bytes that nothing here can reproduce. A carrier that fails its
    verification stops the whole run and is never repaired by regeneration.

# ---------------------------------------------------------------------------
# The frozen inputs, VERIFIED and never written.
#
# The digests below were re-based onto the bytes this bundle actually carries. The
# values they replaced described the retired surrogate's carriers, which were 1817,
# 1367 and 719 bytes; those bytes are gone and the ones recorded here are the ones on
# disk. The direction matters: the carriers are what makes this slot
# substrate-compliant and the declaration is what was stale, so the declaration moved.
# ---------------------------------------------------------------------------

substrate:
  kind: mixed, one vendored real collection and two bundle-authored declarations
  verified_by: solution/recompute.py::verify_carriers, byte length and sha256, hard fail on either
  carriers:
    - path: environment/eval_corpus.json
      length_bytes: 2826939
      sha256: cf3078c7c8ee64281a906261124af547c730b7f90d16242b41abd40819f70343
      role: vendored-real-collection
      producer: seed/forge/substrate.py, function corpus_document, the default JSON branch of carrier_payload
      what: >-
        Real FineWeb10B bytes under `fineweb_train_split`, a contiguous 2097152-byte
        slice of 1048576 little-endian uint16 GPT-2 BPE token ids lifted unchanged from
        fineweb_train_000001.bin at token offset 0 past its 1024-byte header, carried as
        base64 and digesting to 38f9592f0d4aa196628711a3143b3792ce5fc24ed302e85e122090aaa2204f3b,
        beside `record_corpus`, the forty-six-record track_3_optimization screening
        surface of which forty are anchorable. Nothing in it was generated, sampled,
        shuffled or synthesized.
      recovery: >-
        Open harness/shared/data/fineweb10B/fineweb_train_000001.bin, skip its 1024-byte
        header, read 1048576 little-endian uint16 token ids from token offset 0, and
        base64 them. The record half is read from harness/records/track_3_optimization.
        This bundle owns no configuration that could reproduce these bytes, which is the
        property the substitution exists to establish.
    - path: environment/model_stats.json
      length_bytes: 10583
      sha256: 25de4fe463cc2f9f572e51e189a10b331b73c678ffca5a5622c3e1f168620022
      role: bundle-authored-declaration
      producer: authored by the re-base that replaced the surrogate with the frozen checkpoint
      what: >-
        The per-tensor manifest of the frozen nanoGPT checkpoint, fifty rows carrying a
        name, a shape and a parameter count and nothing else. It is the ONLY source of
        the tensor list, the tensor ORDER and the parameter counts this derivation walks,
        so the accounting below is a function of these bytes rather than of a restatement
        of them. It carries no perplexity, no curvature scale and no error-model
        coefficient, because nothing here is an input to an arithmetic stand-in for a
        forward pass.
      recovery: >-
        Not recoverable by regeneration from this bundle. It declares the checkpoint
        environment/train_nanogpt.py produces under the pinned harness.
    - path: environment/reference_unquantized.json
      length_bytes: 1572
      sha256: 7459123cb05fa6c85423480042f8be76bfe8098b1d8dc07c934765f767a415d9
      role: bundle-authored-declaration
      producer: authored by the re-base that replaced the surrogate with the frozen checkpoint
      what: >-
        A DECLARATION of the unquantized reference that carries none of its values. The
        reference perplexity is recomputed by tests/runner.py on every run from the same
        checkpoint over the same held-out points in the same process, which is strictly
        stronger than freezing a table, since a frozen table cannot detect a checkpoint
        that moved.
      recovery: >-
        Not recoverable by regeneration from this bundle. It declares what the verifier
        recomputes.

reference:
  file: solution/reference.py
  allocation_sha256: a4b31188e8e32d78b5583d336aad4240307a0c2e37cbacc9f79baec8dd1893cb
  allocation_sha256_note: >-
    sha256 over the canonical JSON of REFERENCE_ALLOCATION, not over the file's prose.
    Binding the payload rather than the file means a comment edit does not invalidate
    the fixture while an allocation edit does, which is the direction that matters. The
    scheme and the per-tensor bit widths are NOT restated here: recompute.py reads them
    out of solution/reference.py once this digest matches, so there is one allocation in
    this bundle and not two that can disagree. The predecessor of this block restated a
    twelve-row allocation over tensor names the checkpoint does not carry, which is
    exactly the disagreement a digest-bound read forecloses.
  tensor_order: environment/model_stats.json `tensors`, in file order
  solve_notice: |-
    The reference submission. It writes exactly one artifact, allocation.json,
    and reports no perplexity number, because the graded quantity is computed by
    the verifier from real forward passes of the frozen checkpoint over a held-out
    split this file has never seen, and a number written here would be ignored on
    the graded path by construction.
  allocation_scope: |-
    over the 50 weight matrices of the
    frozen 12-layer 768-dim decoder
  why: >-
    The budget is spent exactly, to the bit: 648806400 allocated against 648806400
    budgeted, a mean of 4.0 bits per parameter over all 162201600 parameters. Spend is
    moved off the token embedding and the output head, the two largest matrices and the
    two whose rows are closest to uniform in scale, and onto the twelve fused
    query-key-value projections, whose rows carry the widest dynamic range in the
    checkpoint. Eleven of the twelve attention output projections take a fifth bit and
    the twelfth stays at the control width, because that is the residue that makes the
    budget divide exactly. The scheme is error-feedback, per-row affine quantization
    with the rounding residual carried along the row, which is the lowest-error scheme
    in the closed set. The allocation is deliberately not maximally non-uniform, because
    a more aggressively fitted quantizer makes the reading depend on which tokens a
    held-out batch happens to carry; the reference trades mean for band width so that
    the LOWER EDGE clears the margin rather than the mean.

rebase:
  paragraphs:
    - >-
      This slot previously graded arithmetic over JSON statistics. Its model was a
      twelve-row table of per-tensor `sensitivity` and `outlier_factor` coefficients
      describing a three-block stand-in that was never instantiated, its perplexity was a
      closed form of the shape `ppl_reference * exp(error * shard_gain)`, and its
      unquantized reference was a five-row table of numbers no model produced. Nothing was
      ever run, so the first and third parts of the simulator test both failed: there were
      no weights in the loop, and deleting the forward pass changed nothing because there
      was no forward pass to delete.
    - >-
      The statement survived the re-base and the graded path did not. The solver still
      designs a per-tensor bit allocation and a quantization scheme under a fixed bit
      budget, and is still graded on the lower edge of a separation band with three
      outcomes rather than two. What changed is that the quantized model is now the
      nanoGPT checkpoint, the fifty weight matrices of the canonical 12-layer 768-dim
      decoder declared in `environment/nanogpt_substrate.json`, and the graded perplexity
      is now obtained by the verifier running that checkpoint forward over a held-out
      FineWeb10B validation slice that is absent from every agent-visible container. This
      was a replacement of the training and evaluation path and not a declaration-level
      repin, and it is recorded as such rather than described as smaller than it was.

bindings:
  separation_margin: 0.05
  frontier_defeat_floor: 0.50
  bits_per_param_budget: 4
  control_bits: 4
  control_scheme: rtn
  evaluation_repeat_floor: 5
  max_timeout_hours: 6.0
  budget_hours: 0.12
  max_attempts: 50
  final_selection: best
  image: pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407
  reward_path: /logs/verifier/reward.txt
  score_document_path: /logs/verifier/score.json

measurement_surface:
  graded_artifact: "`/checkpoint/nanogpt_fp32.pt`, float32 parameter snapshot of the frozen 12-layer 768-dim decoder"
  graded_evaluation: real forward passes over the verifier-owned held-out FineWeb validation slice
  readings_per_point: "three over one token batch: unquantized, submitted allocation, harness control"

anchors:
  anchors_state: absent
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  schema_bound_in_full: true
  reward_formula_lower_is_better: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
  clip: "score = min(max(raw, 0.0), 1.0)"
  why_gradable_anyway: >-
    The live instrument grades a within-run separation against the harness's own control
    allocation, measured on the same held-out points in the same verifier-derived order,
    from the same checkpoint, against an unquantized reading recomputed in the same
    process. That difference is anchor-free by construction, so the slot is gradable once
    a pilot runs it and still refuses to invent a baseline number. The anchored formula is
    carried unevaluated, which is what an absent anchor looks like when it is reported
    honestly.

solver_egress_divergence:
  bound_here: open
  batch_field_reads: setup-only
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: "requirements/open-ended-research-optimisation-problems.md line 58 grants full internet access to the solving agent."
  reading_b: "requirements/open-ended-research-optimisation-problems.md line 122 says internet is needed only for setup, and requirements/bia-environment-spec.md line 247 takes the stricter reading."
  resolution: >-
    This lane binds open egress at the agent surface, matching the family
    delivery.network_policy block that binds agent_environment egress allowed with
    the upstream deny-list. The batch-level optimization_bindings.solver_egress
    field still reads setup-only and this lane does NOT amend it. The divergence is
    recorded here rather than reconciled, because reconciling it silently would
    delete the disagreement instead of reporting it.
  deny_list_is_not_containment: >-
    The deny-list names github.com, raw.githubusercontent.com and
    objects.githubusercontent.com. It is not a containment proof. Mirrors, package
    caches, paraphrased write-ups and released model weights all carry a recipe
    past any deny-list. That is exactly why the deterministic checker and not the
    network policy is the load-bearing control here: the graded quantity is
    recomputed by the verifier from harness-owned state, so a recipe fetched from
    anywhere still has to produce a real allocation that survives a real
    measurement.
  verifier_surface: denied

readout_manipulation_closure:
  obligation: >-
    Adapted from the nanogpt-speedrun readout finding to a perplexity metric. The
    finding was that an entire gain can be readout manipulation: EMA-blending a
    noisy readout until a dip reads as a crossing, and early-stopping on a
    favourable evaluation. Guarding the path from rollout bytes to reward does not
    close it, because the defect is in the SEMANTICS of those bytes.
  closures:
    - "The verifier computes the perplexity itself, at every scheduled point, from real forward passes of the state it quantized. Checker: graded_metric_harness_sourced."
    - "No smoothing on the graded path. A submission may smooth its own readout; the graded reading is raw. Checker: graded_perplexity_unsmoothed, zero_reason readout-smoothed-on-graded-path."
    - "The reading is sustained: one quantized state, read at every scheduled point, at or above the repeat floor. Checker: reading_sustained_across_scheduled_points."
    - "An early stop on a favourable evaluation is graded as not having established the metric, with its own reason, not as an absent result. Checker: no_early_stop_on_favourable_evaluation, zero_reason early-stop-without-sustained-reading."
    - "The evaluated state is the state the harness owns, digested once and read back at every point, not a state the submission selected. Checker: reading_sustained_across_scheduled_points state digest clause plus graded_metric_harness_sourced."
    - "The evaluation ORDER is derived by the verifier from the digest of its own held-out manifest, which is absent from every agent-visible container, so tuning to whichever point is visited first tunes to a coin flip. Checker: evaluation_points_verifier_ordered."

outcomes:
  established:
    verdict: established
    reason: separation-margin-cleared
    condition: "lower_edge = separation_mean - noise_half_width >= 0.05"
    reward: 1.0
  failed:
    verdict: failed
    reason: degradation-past-bar
    condition: "upper_edge = separation_mean + noise_half_width < 0.0"
    reward: 0.0
    gated_by: allocation_not_degrading_past_bar
  unproven:
    verdict: unproven
    reason: significance-unestablished-at-ceiling
    condition: "upper_edge >= 0.0 and lower_edge < 0.05, at the bound evaluation ceiling of 5 points"
    reward: "clamp(lower_edge / 0.05, 0.0, 1.0), a value in [0.0, 1.0)"
    meaning: >-
      The run COMPLETED. Every gate held. Nothing failed and nothing was
      established. The evaluation budget was the binding limit: five held-out points
      were not enough to separate this allocation from the control at the bound margin.
      This is a THIRD outcome and it is never reported as either neighbour.

reward_ramp:
  statement: >-
    The reward is continuous in the measured separation and does not flip at the
    margin. The verdict flips at the margin because a verdict is a claim; the
    number does not, because the measurement did not.
  function: "score_separation(separation_mean, noise_half_width, margin) = clamp((separation_mean - noise_half_width) / margin, 0.0, 1.0)"

golden_trajectory:
  - step: 1
    action: "Read instruction.md, environment/nanogpt_substrate.json and environment/model_stats.json. Note that the model is the frozen 12-layer 768-dim decoder, that the budget is fixed at four bits per parameter over its fifty weight matrices, and that the held-out split is not in the container."
    holds: "the metric is perplexity degradation, lower better; the verifier computes it by running the model"
  - step: 2
    action: "Compute the control allocation by hand: every tensor at 4 bits under rtn. Observe that it spends the budget exactly and that its separation against itself is identically zero, so a no-op submission establishes nothing."
    holds: "a no-op is unproven at reward 0.0, not a failure"
  - step: 3
    action: "Load the checkpoint and inspect the real weight distributions. Move bits off wte.weight and lm_head.weight, the two largest matrices, onto the fused qkv projections, whose rows carry the widest dynamic range. Keep the total at or under budget."
    holds: "reallocating is the task; raising the total is a different task and scores zero"
  - step: 4
    action: "Run environment/quantize_lab.py on the candidate. It quantizes the real tensors and measures perplexity by running the model on the train split. Read the per-point separations, not just the mean."
    holds: "the band is the measurement; the mean alone is not, and a train-split reading is not the graded reading"
  - step: 5
    action: "Observe that pushing further from uniform improves the mean and widens the band, because a harder-fitted quantizer makes the error depend on the batch. Stop where the LOWER EDGE is maximal rather than where the mean is maximal."
    holds: "establishing a result and having one are different; the lower edge is what is graded"
  - step: 6
    action: "Select scheme error-feedback and write allocation.json. Report no perplexity number."
    holds: "a reported number is recorded beside the graded path and never on it"

# The bit accounting is DERIVED: recompute.py walks environment/model_stats.json with
# the allocation it read out of the digest-bound solution/reference.py, through the
# live tests/runner.py::accounting, and refuses to continue unless the three values
# below are what that walk produces. The measurement rows are null because this lane
# ran no checkpoint and no forward pass, and a null is published through `published_as`
# rather than replaced by a number nobody measured.
expected_result:
  measured: false
  allocated_bits: 648806400
  budget_bits: 648806400
  mean_bits_per_param: 4.0
  scheduled_order: null
  separation_mean: null
  noise_half_width: null
  lower_edge: null
  verdict: null
  reason: null
  reward: null
  published_as:
    scheduled_order: absent, derived at run time from the digest of the verifier's own held-out manifest, which is not a bundle byte
    separation_mean: absent, unmeasured
    noise_half_width: absent, unmeasured
    lower_edge: absent, unmeasured
    verdict: absent, unmeasured
    reward: absent, unmeasured
  why_absent: >-
    Every measured row above is published as absent because this lane ran no checkpoint
    and no forward pass. The previous bytes carried a separation mean of 0.135696 and a
    noise half width of 0.002966; those were readings of the retired arithmetic
    surrogate, they describe nothing that now exists, and no number replaces them. The
    first pilot that runs this slot on a real checkpoint fills them in.

# The calibration probe. tests/runner.py measures CALIBRATION_ALLOCATION on every run
# alongside whatever the submission supplied, and tests/checkers.py reduces the reading
# against the two constants below.
calibration_probe:
  id: control-restated-against-control-determinism-identity
  expected_separation_mean: 0.0
  expected_noise_half_width: 0.0
  half_width_tolerance: 1.0e-06
  band_epsilon: 1.0e-06
  what: >-
    CALIBRATION_ALLOCATION is the harness control allocation restated: every quantizable
    tensor of the frozen checkpoint at the budget's mean bit width under round-to-nearest.
    Measured against the control on the same held-out points it separates by exactly zero
    at every point with a band of exactly zero, by the arithmetic of a paired difference
    of two identical readings. The probe is a pure function of the built environment and
    is independent of the submission, so requiring it to read back that identity
    constrains the measurement pipeline and never the solver's search.
  why_two_reductions: >-
    calibration_separation_within_band is a DIVERGENCE over the centre: the probe's
    measured separation must sit inside centre plus or minus expected_noise_half_width
    plus band_epsilon. calibration_noise_band_width_held is a VALUE over the width alone:
    the probe's measured half width must equal the recorded one inside
    half_width_tolerance plus band_epsilon, which pins the second number without routing
    it through the first.
  why_not_a_digest: >-
    frozen_corpus_and_reference_intact proves the frozen input BYTES did not move. It
    cannot prove that the evaluation still runs, still pairs each reading to its own
    token batch, or still returns the same number twice for the same weights. A
    substituted or drifting measurement path passes every digest and fails this probe.
  tolerance_note: >-
    half_width_tolerance and band_epsilon are 1.0e-06 each and neither is a measurement.
    They admit kernel-level nondeterminism between two identical forward passes of the
    same weights over the same tokens and nothing larger. The identity they guard is
    exact; the tolerance exists only because a floating-point accumulation order is not.
  discovery_value_gap: gap-oer-20-calibration-discovery-value-unmeasured

# The frozen halves, rendered into tests/calibration.py as fully resolved float
# literals. Each row records the reading the fixture presents, absolutely, rather than
# as a multiple of the centre and the width: under the determinism identity both of
# those are 0.0, so a multiplicative offset from them would resolve to zero for every
# row and no fixture could reject anything. The offsets are stated against each
# checker's OWN rejection threshold in `sits_at`, and recompute.py proves the claim by
# running tests/checkers.py's own reduction over every row and refusing to emit unless
# each accepting row is accepted and each rejecting row is rejected with the recorded
# reason.
calibration_band_fixtures:
  - id: accept_calibration_band_at_the_grounded_centre
    checker: calibration_separation_within_band
    half: accepting
    separation_mean: 0.0
    noise_half_width: 0.0
    sits_at: exactly on the grounded centre
    expect_reason: ''
    proves: the exact zero the determinism identity produces is accepted
  - id: accept_calibration_band_on_the_inner_edge
    checker: calibration_separation_within_band
    half: accepting
    separation_mean: 1.0e-06
    noise_half_width: 0.0
    sits_at: exactly on the rejection threshold, expected_noise_half_width plus band_epsilon
    expect_reason: ''
    proves: a reading exactly on the bound epsilon still accepts, so the epsilon is load bearing for the accepting half
  - id: reject_calibration_band_near_miss_outside_the_edge
    checker: calibration_separation_within_band
    half: rejecting
    separation_mean: 1.000001e-06
    noise_half_width: 0.0
    sits_at: one part in a million past that same threshold
    expect_reason: calibration-separation-outside-band
    proves: one near-miss offset past that same edge rejects, so the checker depends on the value and not on the shape
  - id: reject_calibration_band_far_from_the_centre
    checker: calibration_separation_within_band
    half: rejecting
    separation_mean: 4.0e-05
    noise_half_width: 0.0
    sits_at: forty times the threshold
    expect_reason: calibration-separation-outside-band
    proves: a probe that separated from itself by a real amount rejects, because two readings of one state cannot disagree
  - id: accept_calibration_width_at_the_grounded_value
    checker: calibration_noise_band_width_held
    half: accepting
    separation_mean: 0.0
    noise_half_width: 0.0
    sits_at: exactly on the grounded width
    expect_reason: ''
    proves: the exact zero band the identity produces is accepted
  - id: reject_calibration_width_near_miss_outside_tolerance
    checker: calibration_noise_band_width_held
    half: rejecting
    separation_mean: 0.0
    noise_half_width: 2.000001e-06
    sits_at: one part in two million past the rejection threshold, half_width_tolerance plus band_epsilon
    expect_reason: calibration-noise-band-width-moved
    proves: a half width one near-miss offset past the bound tolerance rejects
  - id: reject_calibration_width_doubled
    checker: calibration_noise_band_width_held
    half: rejecting
    separation_mean: 0.0
    noise_half_width: 4.000002e-06
    sits_at: twice the near-miss row, so twice the rejection threshold
    expect_reason: calibration-noise-band-width-moved
    proves: a band twice as wide rejects, so a drifting measurement path cannot be passed off as this one

checker_fixtures:
  - id: accepting
    label: reference-allocation-accepted-end-to-end
    expect_reward: 1.0
