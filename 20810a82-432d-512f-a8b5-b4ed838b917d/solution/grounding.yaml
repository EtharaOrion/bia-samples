schema: forge.grounding/v1
slot: OER-29
provisional_identifier: OER-29
note: >-
  This file is the single private derivation source for the slot. `solution/recompute.py`
  derives every generated artifact from these bytes alone: the frozen warehouse spec, the
  frozen warehouse database, the frozen baseline plan, the reference plan, `tests/bound.json`,
  `tests/test_output.py`, `solution/TRUTH.md`, `solution/rubrics.json`, `solution/solve.sh` and
  every fixture under `solution/fixtures/`. Nothing here is a model output, a network fetch, a
  clock reading, a locale-dependent rendering or a draw from a random source. Neither discovery
  value appears in this file. Both are derived, by running the build and the traversal, and
  both are written only into artifacts that sit on the private or verifier side of the bundle.

identity:
  family: F6
  family_title: query optimization
  primary_archetype: exclusion-closure
  primary_archetype_title: Exclusion Closure
  archetype_count: 1
  archetype_rule: >-
    Exactly one primary archetype. Excluding one row forces a transitive closure, and the whole
    pressure of the slot is that the closure has to be computed rather than approximated by its
    first hop. No second archetype is claimed, borrowed or composed in.
  title: Admitted-set query plan under a quarantine closure
  tags: [optimization, bounded-continuous]
  target_tier: T2
  tier_exemption_granted: none

perception_axis_exemption:
  kind: standing batch-level exemption
  statement: >-
    This task family is text and code only, so the Perception axis carries no category. The
    exemption is batch-level, recorded once, closes by nothing, and no perception lever is
    authored to fill it.

metric:
  name: query plan speedup over the frozen baseline plan, gated on result-set equality
  direction: higher
  gate_semantics: >-
    Result-set equality is a HARD GATE, never a term traded against speed. A plan whose result
    set differs from the required result set by one row, one column or one ordering position
    scores exactly 0.0 with the machine-readable reason `result-set-divergence`, however cheap
    it is. The cheapest plan in the space returns nothing at all and scores zero.
  frozen_axes:
    - the warehouse schema
    - the warehouse contents, environment/warehouse.db
    - the integrity rule that decides which lineage row is quarantined
    - the closure relation, parent edges unioned with derives edges
    - the required result set, and its projection and ordering
  free_axes:
    - the query plan, meaning the single read-only statement that produces the required result set
  cost_model:
    what: the database engine's own virtual-machine step count for the whole result
    read_by: environment/planrun.py, through the engine progress callback
    why_not_a_clock: >-
      A step count is exactly reproducible for a given engine build over frozen bytes, and a
      wall-clock reading is not. It also means no checker in this bundle has to read a clock in
      order to grade a speedup, which is what keeps every checker a pure replayable function.
    engine_pinning: >-
      The step count is only portable while the engine build is fixed, so both Dockerfiles pin
      the same base image by digest and the bound costs are measured inside that pinned image.

clock_ownership:
  owner: harness
  statement: >-
    THE HARNESS OWNS THE CLOCK, and on this slot it does not need to read one at all. The graded
    cost is a step count emitted by the engine's progress callback inside
    environment/planrun.py. Every checker reads that recorded count through the tests/checkers.py
    Harness handle and never calls time, datetime, perf_counter or monotonic.
  absolute_clock_ban: >-
    recompute.py reads no clock either. The bound costs are recorded fixtures produced by running
    the pinned executor over the frozen database, never live measurements of a host.

substrate:
  kind: deterministic embedded relational engine over a frozen database file
  module: environment/planrun.py
  declared_gap: gap-oer-29-cost-is-a-step-count-not-a-wall-clock-time
  why_right_choice: >-
    A step count over a frozen file is byte-reproducible on any host running the pinned image,
    so a checker's verdict is recomputable by an outside reader. It is never allowed to pass as
    a wall-clock speedup measurement, and the declared gap says so.

warehouse_spec:
  schema: oer29.warehouse_spec/v1
  seed: 20260831
  generator: >-
    A fixed integer linear congruential recurrence x <- (1103515245 * x + 12345) mod 2**31,
    seeded from the constant above. This is arithmetic, not a random source: the sequence is
    fully determined by the seed recorded here and no module named `random` is imported.
  lineage_node_count: 1600
  root_count: 6
  parent_window: 40
  payload_modulus: 9973
  check_coefficients: {alpha: 31, beta: 17, gamma: 7}
  check_modulus: 1000003
  derives_edge_count: 800
  derives_forward_span: 12
  reading_row_count: 1600
  reading_value_modulus: 100000
  corruption_delta: 1
  corruption_probe_seed: 77010203
  corruption_probe_limit: 4000
  closure_band: [22, 40]
  closure_min_depth: 3
  band_rationale: >-
    The corruption lands on the first probed node whose closure cardinality falls inside the
    band and whose closure is at least the minimum depth deep. The band exists so the closure is
    large enough that stopping at the first hop is a visible mistake and small enough that the
    whole task stays cheap on a CPU. Which node the rule selects is still whatever the built
    graph hands back, and no node identifier is written anywhere in this file.

discovery:
  values:
    - id: excluded_row_identifier
      what: the node_id of the single lineage row whose declared checksum disagrees with its payload
      established_by: >-
        the first Docker build stage, which composes the warehouse from the spec above and
        perturbs exactly one declared_check. Which row it perturbs is decided by the probe
        recurrence and the closure band over the graph the build itself just produced.
      read_back_through: >-
        environment/probe.py run, against the built environment/warehouse.db, and independently
        by the verifier through the tests/checkers.py Harness handle over the same bytes.
      absent_from: instruction.md, task.toml, and every authored file under environment/
    - id: closure_cardinality
      what: the number of lineage nodes in the transitive closure of the excluded row
      established_by: >-
        the same build. The closure relation is the union of the parent edges and the derives
        edges the build wrote, so the cardinality is a property of the built graph and cannot be
        read off any single row.
      read_back_through: >-
        environment/probe.py run, by traversing the built tables, and independently by the
        verifier through the Harness handle.
      absent_from: instruction.md, task.toml, and every authored file under environment/
  statement_closure: >-
    instruction.md fixes the exclusion rule and the closure operation in full, and names no node
    and no cardinality. The graded outcome therefore cannot fall out of the statement.
  binding: >-
    Three required checkers change their graded outcome when a discovery value moves:
    quarantine_row_identified turns on the excluded row identifier, and
    closure_cardinality_attested and closure_layers_witnessed turn on the closure cardinality.
    Each has a frozen rejecting fixture that moves exactly that value and no other byte.

plans:
  baseline:
    role: the frozen denominator of the graded speedup
    published_to_the_agent: true
    sql: |
      WITH RECURSIVE quarantined(node_id) AS (
          SELECT node_id
            FROM lineage
           WHERE declared_check <> (p_alpha * 31 + p_beta * 17 + p_gamma * 7) % 1000003
          UNION
          SELECT l.node_id FROM lineage l JOIN quarantined q ON l.parent_id = q.node_id
          UNION
          SELECT d.target_node FROM derives d JOIN quarantined q ON d.source_node = q.node_id
      )
      SELECT reading_id, node_id, value
        FROM reading
       WHERE node_id NOT IN (SELECT node_id FROM quarantined)
       ORDER BY reading_id
  reference:
    role: the instance target, and the plan the oracle actually submitted
    published_to_the_agent: false
    shape: >-
      The closure is computed once, off the graded path, and folded into the plan as a literal
      exclusion list. The recursive term, the two joins it drives and the whole scan of the
      derives table then disappear from the plan, and what is left is one scan of reading
      against a small set membership test in reading_id order. The literal list is emitted by
      recompute.py from the traversal it performed, so the reference plan is a function of the
      built state and not of anything authored by hand.
    template: |
      SELECT reading_id, node_id, value
        FROM reading
       WHERE node_id NOT IN ({exclusion_list})
       ORDER BY reading_id

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  family_baseline_metric: null
  family_target_metric: null
  statement: >-
    F6 anchors are unmeasured. seed/contract.yaml records F6 with scope_state `unscoped` and no
    baseline, target, pass threshold or instance count. The reward SCHEMA is bound in full below
    and the family anchors are declared absent. No family baseline_metric or target_metric number
    is invented here.
  instance_local_anchors:
    what_they_are: >-
      Two numbers measured on this slot's own frozen substrate by recompute.py, inside the pinned
      image. They normalise the reward for THIS instance, they are NOT the family anchors, they
      are NOT a substitute for them, and they do NOT close gap-oer-per-family-anchors-unmeasured.
    declared_gap: gap-oer-29-instance-local-anchors-not-family-anchors
    baseline_metric_definition: >-
      The speedup of the frozen baseline plan against itself, which is exactly 1.0 by
      construction and is therefore a definition rather than a measurement.
    target_metric_definition: >-
      The speedup of the reference plan against the frozen baseline plan, both costed by the
      pinned executor over the frozen database.

reward:
  carrier_path: /logs/verifier/reward.txt
  carrier_form: one bare float
  score_document_path: /logs/verifier/score.json
  interval: [0.0, 1.0]
  direction: higher is better
  never_binary: true
  full_reward_exactly: 1.0
  formula: raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  bar_not_point: reaching the target scores exactly 1.0 and beating it also scores 1.0
  gate: >-
    Every required checker must pass before the continuous term is computed. The first failing
    required checker sets the reward to 0.0 and writes its own machine-readable reason.

submission:
  schema: oer29.submission/v1
  path: submission.json
  plan_path: plan.sql
  fields:
    excluded_node_id: the node_id the exclusion rule selects, discovered from the built warehouse
    closure_nodes: the whole closure as a sorted list of node_id, the excluded row included
    closure_layers: >-
      the breadth-first layers of that traversal, layer zero being the excluded row alone and
      layer k being the nodes first reached at distance k
    closure_cardinality: the number of nodes in the closure
    admitted_row_count: the number of rows the submitted plan returns
    reported_plan_cost: the harness-counted cost the submitter observed for its own plan
    reported_baseline_cost: the harness-counted cost the submitter observed for the baseline plan

checkers:
  order:
    - warehouse_unmodified
    - plan_is_single_read_only_select
    - quarantine_row_identified
    - closure_set_complete
    - closure_layers_witnessed
    - closure_cardinality_attested
    - excluded_rows_absent
    - result_set_equality
    - plan_cost_readout_exact
    - plan_faster_than_baseline

fixtures:
  reference_run:
    what: the trajectory the oracle actually produced, frozen
  rejecting:
    - id: guessed_neighbouring_row
      moves: excluded_node_id only, to the adjacent lineage identifier
      expects: quarantine-row-misidentified
      near_miss: true
      single_scalar_change: true
    - id: closure_stopped_at_first_hop
      moves: the closure, the layers, the cardinality, the plan and the row count together
      expects: closure-incomplete
      near_miss: false
    - id: cardinality_minus_one
      moves: closure_cardinality only
      expects: closure-cardinality-unattested
      near_miss: true
      single_scalar_change: true
    - id: cardinality_plus_one
      moves: closure_cardinality only
      expects: closure-cardinality-unattested
      near_miss: true
      single_scalar_change: true
    - id: layers_flattened
      moves: closure_layers only, to a single layer carrying the whole closure
      expects: traversal-order-unwitnessed
      near_miss: false
    - id: plan_admits_every_reading
      moves: plan.sql only, to a plan that excludes nothing
      expects: excluded-row-admitted
      near_miss: false
    - id: plan_drops_one_admitted_row
      moves: plan.sql only, to a plan that also excludes one node outside the closure
      expects: result-set-divergence
      near_miss: false
    - id: cost_readout_mismatch
      moves: reported_plan_cost only
      expects: cost-readout-mismatch
      near_miss: true
      single_scalar_change: true
    - id: baseline_plan_resubmitted
      moves: plan.sql only, to the frozen baseline plan
      expects: plan-not-faster-than-baseline
      near_miss: false
    - id: plan_writes_to_the_warehouse
      moves: plan.sql only, to a statement that is not a single read-only select
      expects: plan-not-read-only-single-statement
      near_miss: false

oracle_run:
  what: >-
    solution/oracle_run.jsonl is the step trace `solution/reference.py` actually emitted when it
    was run inside the built environment image against that image's own warehouse. It is a
    recording of an execution and not a generated artifact, so `recompute.py --check` does not
    cover it; it is kept because a written-down solution that was never run is a claim rather
    than an oracle.
  observed:
    excluded_row_found_by: one read-only query applying the frozen checksum rule, returning one row
    closure_walked_to_fixpoint_at_depth: 10
    result_set_equality_self_check: the folded plan and the frozen baseline plan returned identical rows
    speedup_observed: 2.409267
  byte_equality: >-
    The plan.sql and submission.json the oracle wrote in the image are byte-identical to the
    frozen fixture under solution/fixtures/reference_run/, which is what ties the recorded run to
    the graded fixture.

declared_gaps:
  - id: gap-oer-per-family-anchors-unmeasured
    statement: F6 carries no measured family baseline or target, so none is invented here.
  - id: gap-oer-29-instance-local-anchors-not-family-anchors
    statement: >-
      The two normalisation numbers are measured on this slot's own frozen substrate and are not
      family anchors.
  - id: gap-oer-29-cost-is-a-step-count-not-a-wall-clock-time
    statement: >-
      The graded cost is the engine's virtual-machine step count over a frozen database, not a
      wall-clock time on any host, and it is never presented as one.
  - id: gap-oer-29-no-signed-pilot
    statement: >-
      No signed pilot has been run against this bundle, so its difficulty is unproven and the
      target tier is an authoring target rather than an established one.
  - id: gap-oer-29-no-detached-signature
    statement: >-
      This bundle carries no detached provenance signature. The authoring lane holds no signing
      key, so an unsigned bundle is shipped and the absence is recorded rather than papered over
      with a fabricated signature.
