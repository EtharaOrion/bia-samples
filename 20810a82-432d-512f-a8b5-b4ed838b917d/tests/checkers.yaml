schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

clock_ownership: >-
  THE HARNESS OWNS THE CLOCK, and on this slot it does not need to read one at all. The graded
  quantity is a speedup, and a speedup is normally a timing metric; here it is a ratio of step
  counts. environment/planrun.py opens the frozen warehouse read-only and counts the database
  engine's own virtual-machine steps through the engine progress callback. tests/runner.py
  launches that executor in an isolated subprocess, once for the submitted plan and once for the
  frozen baseline plan, and every checker below reads the resulting counts through the
  tests/checkers.py Harness handle. No checker calls time, datetime, perf_counter, monotonic or
  any other clock, directly or transitively. That is what keeps every checker pure, deterministic
  and replayable, and it is also what makes the grading reproducible.

purity: >-
  Every checker is a pure function of the harness handle and the bound constants. Imports in
  tests/checkers.py are confined to json, hashlib, pathlib, dataclasses and typing; the checker
  module does not even open a database, because tests/runner.py dumps the three frozen tables
  through the isolated executor and hands them over as plain lists. No planted answer file is
  read, no environment secret is read, no random source is consulted, no socket is opened, and
  the grading process never imports the submission: tests/runner.py copies the submitted plan
  text alone into a fresh temporary directory, launches the executor against it as a new session
  leader under a five-key environment allowlist, and kills the whole process group in a finally
  block.

discovery_binding: >-
  Two values are established by the image build and named nowhere in the statement: the identifier
  of the single lineage row the exclusion rule selects, and the cardinality of that row's
  transitive closure. Neither is carried in tests/bound.json as a plain value. The verifier
  RE-DERIVES both, by re-applying the checksum rule to the frozen lineage rows and by walking the
  closure relation over the frozen edges; bound.json carries only a digest over the closure, so
  the two derivations check each other without either being written down as an answer. Three
  required checkers below change their graded outcome when a discovery value moves, and each has
  a frozen rejecting fixture.

readout_manipulation: >-
  The graded readout is computed by the verifier and is never read from a number the submission
  reported. The speedup is the frozen baseline plan's harness-counted cost over the submitted
  plan's harness-counted cost, both measured by the verifier's own executor over the frozen
  warehouse. Four submission-authored fields are read, and each only so that a substitution is
  detectable rather than ignorable: closure_cardinality, admitted_row_count, reported_plan_cost
  and reported_baseline_cost.

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py walks the ten checkers below in the declared order and returns 0.0 with the
    first failing checker's machine-readable reason. Only when every required checker passes does
    it compute the continuous term, the clamped normalised speedup. That is exactly required_pass
    over the required set, composed with a bounded-continuous score inside the passing region, so
    the reward is never binary and every zero is attributed.
  reward_formula: raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  direction: higher is better
  never_binary: true

pre_checks:
  - id: engine_cost_model_drift
    where: tests/grade.py, before the checker chain
    zero_reason: engine-cost-model-drift
    statement: >-
      The frozen baseline plan is costed at grade time and compared against the cost recorded when
      the bound constants were derived. A disagreement means the pinned engine is not the engine
      this verdict was calibrated on, which is reported as such rather than absorbed into a
      speedup.

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  family_baseline_metric: null
  family_target_metric: null
  note: >-
    F6 anchors are unmeasured, so the reward SCHEMA is bound in full and no family baseline or
    target number is invented. The two numbers tests/bound.json carries are instance-local,
    measured by solution/recompute.py on this slot's own frozen substrate inside the pinned image,
    and are declared under gap-oer-29-instance-local-anchors-not-family-anchors as NOT family
    anchors.

fixture_substitutions:
  - checker: warehouse_unmodified
    substitution: none required at fixture level
    why: >-
      Its rejecting half is reachable by mutating the frozen warehouse, which is a mutation of the
      bundle rather than of a submission. It is recorded here that no submission can reach this
      checker's rejecting half by choosing a plan, because the warehouse is not on the free axis.

checkers:
  - id: warehouse_unmodified
    statement: "The frozen warehouse is byte-identical to the bound digest, carries the bound row counts, selects exactly one quarantined row, and re-derives the bound closure digest and the bound required-result-set digest."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_warehouse_unmodified
    zero_reason: frozen-inputs-modified
    required: true
    weight: 1
    basis: computed
    live_state_read: "sha256 over environment/warehouse.db as it stands on disk, the three frozen tables as the verifier's own read-only dump returned them, and the verifier's own re-derivation of the exclusion and the closure over them."
    compiled_test: "tests/test_output.py::test_warehouse_unmodified"

  - id: plan_is_single_read_only_select
    statement: "Exactly one read-only statement reached the executor and it ran: one statement, opening with SELECT, WITH or VALUES, with attach, pragma and every write refused by the authorizer."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_plan_is_single_read_only_select
    zero_reason: plan-not-read-only-single-statement
    required: true
    weight: 1
    basis: computed
    live_state_read: "the executor's own report for the submitted plan, including the refusal reason when it refused."
    compiled_test: "tests/test_output.py::test_plan_is_single_read_only_select"
    rejecting_fixture: solution/fixtures/rejecting/plan_writes_to_the_warehouse

  - id: quarantine_row_identified
    statement: "The excluded row the submission names is the row the frozen exclusion rule actually selects over the frozen lineage table."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_quarantine_row_identified
    zero_reason: quarantine-row-misidentified
    required: true
    weight: 1
    basis: computed
    live_state_read: "every lineage row's declared_check against the checksum the verifier recomputes from that row's own payload, and submission.json's excluded_node_id."
    compiled_test: "tests/test_output.py::test_quarantine_row_identified"
    grades_discovery_value: excluded row identifier
    rejecting_fixture: solution/fixtures/rejecting/guessed_neighbouring_row

  - id: closure_set_complete
    statement: "The closure the submission declares equals the transitive closure of the excluded row over the union of the parent edges and the derives edges, run to fixpoint rather than to the first hop."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_closure_set_complete
    zero_reason: closure-incomplete
    required: true
    weight: 1
    basis: computed
    live_state_read: "the frozen lineage and derives tables, walked by the verifier, against submission.json's closure_nodes."
    compiled_test: "tests/test_output.py::test_closure_set_complete"
    rejecting_fixture: solution/fixtures/rejecting/closure_stopped_at_first_hop
    detail_note: "The failure detail names the first-hop stop explicitly when the declared set is exactly the excluded row and its immediate successors, so the archetype's own failure mode is attributed rather than lumped in."

  - id: closure_layers_witnessed
    statement: "The breadth-first layers the submission declares are the layers the traversal produces, layer for layer, with layer zero holding the excluded row alone."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_closure_layers_witnessed
    zero_reason: traversal-order-unwitnessed
    required: true
    weight: 1
    basis: computed
    live_state_read: "the verifier's own breadth-first walk over the frozen edges, against submission.json's closure_layers."
    compiled_test: "tests/test_output.py::test_closure_layers_witnessed"
    grades_discovery_value: closure cardinality
    rejecting_fixture: solution/fixtures/rejecting/layers_flattened
    detail_note: "This is what makes the cardinality a traversal result. A submission that guessed the size cannot also produce the layer profile that size has to come out of."

  - id: closure_cardinality_attested
    statement: "The closure cardinality the submission declares is the size the traversal produced, checked against the verifier's own closure, against the submission's own node list, and against the submission's own layer witness."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_closure_cardinality_attested
    zero_reason: closure-cardinality-unattested
    required: true
    weight: 1
    basis: computed
    live_state_read: "the size of the verifier's own closure, and submission.json's closure_cardinality, closure_nodes and closure_layers."
    compiled_test: "tests/test_output.py::test_closure_cardinality_attested"
    grades_discovery_value: closure cardinality
    rejecting_fixture: solution/fixtures/rejecting/cardinality_minus_one
    also_rejects: solution/fixtures/rejecting/cardinality_plus_one

  - id: excluded_rows_absent
    statement: "Not one reading attached to a node inside the closure survives into the plan's result."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_excluded_rows_absent
    zero_reason: excluded-row-admitted
    required: true
    weight: 1
    basis: computed
    live_state_read: "the rows the executor returned for the submitted plan, against the closure the verifier derived."
    compiled_test: "tests/test_output.py::test_excluded_rows_absent"
    rejecting_fixture: solution/fixtures/rejecting/plan_admits_every_reading

  - id: result_set_equality
    statement: "The plan's result set is the required result set exactly: the same projection, the same rows, the same values and the same ascending reading_id order."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_result_set_equality
    zero_reason: result-set-divergence
    required: true
    weight: 1
    basis: computed
    live_state_read: "the columns and rows the executor returned for the submitted plan, against the required result set the verifier derived from the frozen reading table and its own closure, and submission.json's admitted_row_count."
    compiled_test: "tests/test_output.py::test_result_set_equality"
    rejecting_fixture: solution/fixtures/rejecting/plan_drops_one_admitted_row

  - id: plan_cost_readout_exact
    statement: "Both costs the submission reports equal the costs the harness itself counted, for the submitted plan and for the frozen baseline plan."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_plan_cost_readout_exact
    zero_reason: cost-readout-mismatch
    required: true
    weight: 1
    basis: computed
    live_state_read: "the executor's step counts for both plans, against submission.json's reported_plan_cost and reported_baseline_cost."
    compiled_test: "tests/test_output.py::test_plan_cost_readout_exact"
    rejecting_fixture: solution/fixtures/rejecting/cost_readout_mismatch

  - id: plan_faster_than_baseline
    statement: "The submitted plan costs strictly fewer harness steps than the frozen baseline plan, so a speedup was established rather than claimed."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_plan_faster_than_baseline
    zero_reason: plan-not-faster-than-baseline
    required: true
    weight: 1
    basis: computed
    live_state_read: "the executor's step counts for both plans."
    compiled_test: "tests/test_output.py::test_plan_faster_than_baseline"
    rejecting_fixture: solution/fixtures/rejecting/baseline_plan_resubmitted
