# ---------------------------------------------------------------------------
# APPENDED by the feasibility lane (seed/tasks/). Correction of record.
# ---------------------------------------------------------------------------
bound_state_correction:
  observed_on: "live seed/tasks/OER-12/drift.yaml and live tests/checkers.py, re-read by seed/tasks/OER-12/adequacy.py"
  what_changed: >-
    The bound_state block above is stale against the live drift schedule. It names
    ambiguous_class_width, partial_field_threshold and eval_split_doc_count. The drift
    schedule renamed the first to ambiguity_policy and no longer carries the other two,
    and the live checkers agree with the schedule rather than with bound_state.
  grounded_in: >-
    seed/staging/oer1/check_drift_causality.py parses the bound selectors in
    tests/checkers.py. ambiguity_policy is in the read surface of the selector its
    mutation binds. ambiguous_class_width, partial_field_threshold and
    eval_split_doc_count appear in NO selector's read surface at all, so no checker can
    read them and the stale names could never have graded anything.
  bound_state_observed:
    corpus_shard_id: shard-b
    parse_schema_version: 2
    ambiguity_policy: wide
    token_budget_accounting: as-fed
    token_budget_tokens: 4096
    eval_split_id: split-v2
  why_this_is_appended_rather_than_edited: >-
    This lane owns seed/tasks/ and may only APPEND to solution/grounding.yaml. The stale
    block above is left verbatim as the historical record; bound_state_observed is the
    corrected one, transcribed from the live drift schedule's final state, and
    seed/tasks/OER-12/adequacy.py asserts against it.

