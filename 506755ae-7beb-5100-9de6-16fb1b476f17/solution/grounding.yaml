schema: forge.grounding/v1

# PRIVATE. The single derivation source for OER-12.
#
# solution/recompute.py derives, from THIS FILE ALONE plus the frozen bundle bytes it
# names below: the golden trajectory, every checker fixture, solution/solve.sh,
# solution/TRUTH.md, solution/rubrics.json and tests/test_output.py. It invokes no
# model, no network, no clock, no locale and no random source, and running it twice over
# frozen bytes produces byte-identical output.

slot: OER-12
provisional_identifier: OER-12
identity_note: >-
  The provisional identifier is the slot id. This lane computes no canonical content
  hash, derives no uuid5, creates no dataset/<uuid>/ directory, plants no canary token,
  writes no provenance carrier and writes no signature. Wave 2 does identity for every
  slot at once, because adding solution/policy.yaml to already-committed bundles moves
  their hashes too.
family: F13
family_title: parse and tokenize pipeline
primary_archetype: AR7
archetype_exclusivity: exactly one primary archetype. No buffet within the slot.
title: Ambiguous partial-parse states that neither fail nor validate

metric: validation loss of the trained model
direction: lower
frozen: the token budget, the model, the optimizer, and the evaluation split
free: the parse and tokenize pipeline the agent builds over the raw corpus

target_tier: Frontier-defeat
tier_exemption_granted: none
frontier_defeat_floor: 0.50
separation_margin: 0.05
anchorable_tier: capped below Hard by the standing batch-level Perception-axis exemption
perception_axis_exemption: >-
  This task family is text and code only, so the Perception axis carries no category.
  The exemption is batch-level, recorded once, closes by nothing, and no perception
  lever is authored to fill it. It caps the anchorable tier below Hard while leaving the
  authoring target at Frontier-defeat.

# ---------------------------------------------------------------------------------
# The archetype, and what it obliges.
# ---------------------------------------------------------------------------------
archetype_binding:
  ar7_statement: >-
    A partial parse NEITHER fails NOR validates. It is a third state, and this design
    makes it explicit and machine-readable rather than collapsing it into either
    neighbour. A document that parses to a structurally incomplete record is not a parse
    failure to be dropped, and it is not a valid record to be trained on; treating it as
    either silently degrades the corpus in a way the loss will not attribute.
  three_outcomes:
    - outcome: parse-failed
      meaning: a genuine parse failure, correctly rejected
      reasons: [directive-malformed, field-key-unknown, record-id-absent, record-id-duplicated]
    - outcome: parse-valid
      meaning: a genuine valid parse, correctly admitted
      reasons: [record-complete]
    - outcome: parse-partial
      meaning: an ambiguous partial parse, resolved by a DECLARED policy the grader can check
      reasons: [required-field-absent, record-unterminated, continuation-dangling]
  never_conflated: >-
    The three reason spaces are disjoint and the checker parse_outcome_classes_partitioned
    grades that disjointness directly. The AR7 checker's own zero reason,
    ambiguous-class-coerced-silently, is deliberately NOT a parse-failure reason, because
    a third-state record collapsed into a neighbour is a different defect from a record
    correctly rejected.
  metric_sensitivity: >-
    The graded quantity is sensitive to how the ambiguous class is handled, because the
    admitted corpus composition under a frozen token budget is a function of the policy
    applied to the partial class, and the validation loss is a function of that
    composition. A pipeline that silently coerces the ambiguous class one way is
    measurably worse than one that resolves it deliberately, and the divergence checker
    makes the silent coercion attributable rather than leaving it as an unexplained loss
    difference.

# ---------------------------------------------------------------------------------
# Anchors. UNMEASURED for F13. The schema is bound; the numbers are absent.
# ---------------------------------------------------------------------------------
anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  pass_threshold: null
  authority_for_absence: >-
    seed/contract.yaml families.entries.F13 carries scope_state unscoped and the slot
    record for OER-12 carries anchors_state unmeasured with baseline_metric,
    target_metric and pass_threshold all null, under
    gap-oer-per-family-anchors-unmeasured. requirements/bia-environment-spec.md line 63
    leaves this family's baseline, target and instance count unresolved.
  what_is_bound: >-
    The reward SCHEMA in full: single float, closed interval 0.0 to 1.0, higher is
    better, never binary, full reward exactly 1.0, formula
    raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric) for a
    lower-is-better metric, clipped by score = min(max(raw, 0.0), 1.0), with the target
    a bar rather than a point on a gradient.
  what_is_not_bound: the two anchor NUMBERS, which are not invented here
  runtime_effect: >-
    Under absent anchors, tests/grade.py resolves the reward to 0.0 carrying the reason
    anchors-absent-metric-unanchored. That is an evidence state of the family, not a
    verdict on a submission, and instruction.md says so to the agent in plain words.

# ---------------------------------------------------------------------------------
# The solver egress divergence, recorded explicitly and never left silent.
# ---------------------------------------------------------------------------------
solver_egress_divergence:
  bound_in_this_bundle: open
  bound_where: task.toml [agent] solver_egress
  batch_field_reads: setup-only
  batch_field_location: seed/contract.yaml batch.optimization_bindings.solver_egress
  gap: gap-oer-solver-egress-ruled-stricter
  reading_one: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving
    model full internet access.
  reading_two: >-
    line 122 of the same file answers that internet is needed only for setup, and
    requirements/bia-environment-spec.md line 247 rules that the stricter reading governs
    until the client resolves it.
  why_open_is_bound_here: >-
    The family delivery block in the same contract binds agent_environment as egress
    allowed with the upstream deny-list, and the solving agent must be able to fetch its
    own packages, datasets and models. The asymmetry is a bound byte rather than an
    accident.
  this_lane_does_not_amend_the_batch_field: true
  verifier_surface: denied, bound in task.toml [verifier] egress
  deny_list_is_not_a_containment_proof: >-
    Mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any
    deny-list, which is exactly why the deterministic checker and not the network policy
    is the load-bearing control in this slot.

# ---------------------------------------------------------------------------------
# Frozen bundle bytes recompute.py is allowed to read. Nothing else.
# ---------------------------------------------------------------------------------
derivation_inputs:
  corpus: environment/corpus/corpus.rec
  schema: environment/schema.json
  split: environment/split.json
  recipe: environment/frozen_recipe.json
  harness_classifier: tests/runner.py
  reference: solution/reference.py
reference_binding_rule: >-
  recompute.py digests solution/reference.py with sha256 and writes that digest into the
  accepting fixture. The accepting half of adequacy recomputes the digest at run time and
  refuses to proceed unless it matches, so the accepting half proves the live checkers
  accept THIS reference and not merely some file.

# ---------------------------------------------------------------------------------
# The harness run shape. Every value below is bound, none is discovered at run time.
# ---------------------------------------------------------------------------------
harness_run:
  bound_eval_step: 400
  sustain_points: [450, 500, 550]
  sustain_band: 0.05
  halt_kind: bound-schedule-complete
  halted_at_step: 550
  smoothing_on_graded_path: none
  eval_origin: verifier-recomputed
  evaluated_by: verifier
  weights_source: harness-owned
  raw_batch_offsets: [-0.02, 0.0, 0.02]
  raw_batch_offsets_note: >-
    Three offsets summing to zero, so the mean of the raw batch losses is the graded loss
    exactly. The unsmoothed-readout checker recomputes that mean rather than trusting the
    recorded scalar.

# The session state the harness has in force at grading time. These keys are exactly the
# keys seed/tasks/OER-12/drift.yaml moves, and each is read by the checker its mutation
# names.
bound_state:
  corpus_shard_id: shard-b
  parse_schema_version: 2
  ambiguous_class_width: wide
  partial_field_threshold: 0.75
  token_budget_accounting: as-fed
  token_budget_tokens: 4096
  eval_split_id: split-v2
  eval_split_doc_count: 2

frozen_axes_digested: [model, optimizer, token_budget, eval_split]

# ---------------------------------------------------------------------------------
# The graded checker set. THIS is the single source: tests/checkers.py REGISTRY,
# tests/checkers.yaml and the generated tests/test_output.py must all agree with it,
# and seed/tasks/OER-12/adequacy.py asserts all three agreements.
#
# Order is SEMANTIC, not cosmetic. tests/grade.py attributes the reward's zero reason
# to the FIRST failing required checker, so this order decides which machine-readable
# reason a defect is attributed to.
# ---------------------------------------------------------------------------------
graded_checkers:
  - {id: graded_loss_from_verifier_evaluation, reduction: VALUE, zero_reason: graded-loss-not-verifier-computed, weight: 3, required: true, selector: check_graded_loss_from_verifier_evaluation}
  - {id: graded_readout_unsmoothed, reduction: VALUE, zero_reason: graded-readout-smoothed, weight: 3, required: true, selector: check_graded_readout_unsmoothed}
  - {id: graded_loss_sustained, reduction: INVARIANT, zero_reason: graded-loss-not-sustained, weight: 3, required: true, selector: check_graded_loss_sustained}
  - {id: bound_evaluation_point_reached, reduction: ABSENCE, zero_reason: early-stop-loss-not-established, weight: 3, required: true, selector: check_bound_evaluation_point_reached}
  - {id: evaluated_weights_harness_owned, reduction: VALUE, zero_reason: evaluated-weights-not-harness-owned, weight: 2, required: true, selector: check_evaluated_weights_harness_owned}
  - {id: parse_outcome_classes_partitioned, reduction: INVARIANT, zero_reason: parse-outcome-classes-conflated, weight: 4, required: true, selector: check_parse_outcome_classes_partitioned}
  - {id: parse_outcome_three_way_resolved, reduction: DIVERGENCE, zero_reason: ambiguous-class-coerced-silently, weight: 4, required: true, selector: check_parse_outcome_three_way_resolved}
  - {id: ambiguity_policy_declared_before_classification, reduction: ORDERING, zero_reason: ambiguity-policy-declared-after-classification, weight: 3, required: true, selector: check_ambiguity_policy_declared_before_classification}
  - {id: token_budget_respected_as_fed, reduction: VALUE, zero_reason: token-budget-overspent, weight: 3, required: true, selector: check_token_budget_respected_as_fed}
  - {id: evaluation_split_not_trained_on, reduction: ABSENCE, zero_reason: evaluation-split-leaked-into-training, weight: 3, required: true, selector: check_evaluation_split_not_trained_on}
  - {id: frozen_axes_unmoved_across_run, reduction: EFFECT, zero_reason: frozen-axis-mutated, weight: 2, required: true, selector: check_frozen_axes_unmoved_across_run}
  # The two discovery-value checkers. Registered LAST so that a run which produced no
  # telemetry at all is still attributed to the checker that names that absence, and the
  # attribution of every pre-existing negative fixture is unchanged.
  - {id: graded_readout_at_frozen_bound_eval_step, reduction: VALUE, zero_reason: graded-readout-off-the-bound-evaluation-step, weight: 3, required: true, selector: check_graded_readout_at_frozen_bound_eval_step}
  - {id: sustain_schedule_matches_frozen_recipe, reduction: ORDERING, zero_reason: sustain-schedule-not-the-frozen-schedule, weight: 3, required: true, selector: check_sustain_schedule_matches_frozen_recipe}

# ---------------------------------------------------------------------------------
# Discovery values. Each one is established in the ENVIRONMENT, is absent from every
# agent-visible byte of the statement, and carries graded weight through the checker
# named below: change the value in environment/frozen_recipe.json and that checker's
# outcome changes with it.
# ---------------------------------------------------------------------------------
discovery_values:
  - name: bound_eval_step
    value: 400
    established_in: environment/frozen_recipe.json at frozen_axes.evaluation.bound_eval_step
    read_back_by: >-
      tests/runner.py recipe_ledger(), which transcribes the frozen evaluation block into
      the harness-written document recipe_ledger.json at run open.
    absent_from_the_statement: >-
      instruction.md names the file and the key path under "How the loss is actually
      measured" and never states the number, so a solver obtains it only by reading the
      environment.
    graded_by: graded_readout_at_frozen_bound_eval_step
    accepting_half: ref-accepted, ref-partial-credit and ref-anchors-absent
    rejecting_half: neg-graded-readout-off-the-bound-eval-step
    also_load_bearing_on_the_metric: >-
      tests/grade.py graded_loss() reads the eval ledger row whose step is the run's
      bound evaluation step, so the graded NUMBER is the number at this step.
  - name: sustain_points
    value: [450, 500, 550]
    established_in: environment/frozen_recipe.json at frozen_axes.evaluation.sustain_points
    read_back_by: >-
      tests/runner.py recipe_ledger(), same document, same run-open read.
    absent_from_the_statement: >-
      instruction.md names frozen_recipe.json:frozen_axes.evaluation.sustain_points and
      never lists the points.
    graded_by: sustain_schedule_matches_frozen_recipe
    accepting_half: ref-accepted, ref-partial-credit and ref-anchors-absent
    rejecting_half: neg-sustain-schedule-truncated

# ---------------------------------------------------------------------------------
# Fixture-local anchors. These are FIXTURE INPUTS, not task anchors.
# ---------------------------------------------------------------------------------
fixture_anchors:
  anchors_state: measured
  baseline_metric: 3.60
  target_metric: 3.40
  authority: >-
    FIXTURE-LOCAL. These two numbers are inputs of the adequacy fixture and nothing else.
    They are NOT this family's anchors, they are not transcribed from published evidence,
    and no part of the bundle presents them as measured quantities. They exist so the
    accepting half can drive the real reward function through the real gate chain to full
    reward, which is impossible against a null anchor pair. The task's own anchors stay
    absent under gap-oer-per-family-anchors-unmeasured.

# The recorded loss curves for each fixture. Declared values, not measurements.
loss_curves_are_fixtures_not_measurements: >-
  No model was trained to produce the numbers below. They are declared fixture inputs
  whose only job is to drive the live checkers and the live reward function through both
  halves. This absence is carried as gap-oer-12-loss-curves-are-declared-fixtures.
loss_curves:
  accepted: [[400, 3.38], [450, 3.39], [500, 3.40], [550, 3.41]]
  partial_credit: [[400, 3.50], [450, 3.51], [500, 3.52], [550, 3.52]]
  unsustained: [[400, 3.38], [450, 3.39], [500, 3.55], [550, 3.41]]

# ---------------------------------------------------------------------------------
# Scenarios. One accepting, one partial-credit, and one rejecting fixture per checker,
# plus the three stale controls the drift schedule names.
# ---------------------------------------------------------------------------------
scenarios:
  - id: ref-accepted
    role: accepting
    expect_reward: 1.0
    expect_reason: scored
    expect_failed_checker: null
    curve: accepted
    note: the reference solution driven end to end through the real gate chain

  - id: ref-partial-credit
    role: accepting-partial
    expect_reward: 0.5
    expect_reason: scored
    expect_failed_checker: null
    curve: partial_credit
    note: >-
      proves the reward is NOT binary. Every gate passes and the graded loss lands
      halfway between the fixture baseline and the fixture target, so the carrier holds
      0.5 rather than 1.0 or 0.0.

  - id: ref-anchors-absent
    role: accepting-unanchored
    expect_reward: 0.0
    expect_reason: anchors-absent-metric-unanchored
    expect_failed_checker: null
    curve: accepted
    anchors: absent
    note: >-
      the live delivery state. Every gate passes and the reward still resolves to 0.0,
      because this family's anchors are unmeasured. The reason names the evidence state
      rather than blaming the submission.

  - id: neg-no-op
    role: rejecting
    targets: graded_loss_from_verifier_evaluation
    expect_reward: 0.0
    expect_reason: graded-loss-not-verifier-computed
    curve: accepted
    defect: {kind: drop_documents, documents: [run, eval_ledger, weight_ledger, corpus_ledger, feed_ledger, split_ledger, event_log, freeze_ledger, policy_state], submission_ledger: false}
    note: a submission that did nothing produces no feed, so the harness trains nothing and establishes no loss

  - id: neg-submission-reported-loss
    role: rejecting
    targets: graded_loss_from_verifier_evaluation
    expect_reward: 0.0
    expect_reason: graded-loss-not-verifier-computed
    curve: accepted
    defect: {kind: eval_origin, origin: submission-reported, reported_by_submission: true}

  - id: neg-smoothed-readout
    role: rejecting
    targets: graded_readout_unsmoothed
    expect_reward: 0.0
    expect_reason: graded-readout-smoothed
    curve: accepted
    defect: {kind: smooth_readout, smoothing: ema-0.9, graded_loss_override: 3.30}

  - id: neg-unsustained-dip
    role: rejecting
    targets: graded_loss_sustained
    expect_reward: 0.0
    expect_reason: graded-loss-not-sustained
    curve: unsustained

  - id: neg-early-stop
    role: rejecting
    targets: bound_evaluation_point_reached
    expect_reward: 0.0
    expect_reason: early-stop-loss-not-established
    curve: accepted
    defect: {kind: early_stop, halt_kind: submission-early-stop, halted_at_step: 400}

  - id: neg-selected-checkpoint
    role: rejecting
    targets: evaluated_weights_harness_owned
    expect_reward: 0.0
    expect_reason: evaluated-weights-not-harness-owned
    curve: accepted
    defect: {kind: selected_checkpoint, step: 400, weights_source: submission-selected}

  - id: neg-conflated-reason-codes
    role: rejecting
    targets: parse_outcome_classes_partitioned
    expect_reward: 0.0
    expect_reason: parse-outcome-classes-conflated
    curve: accepted
    defect: {kind: ledger_rows, rows: [{ordinal: r04, verdict: parse-partial, reason: directive-malformed, policy_applied: partial-quarantined}]}
    note: >-
      the three-way classification kept nominally and made cosmetic by emitting a
      parse-failure reason for an ambiguous record

  - id: neg-coerce-partial-to-failed
    role: rejecting
    targets: parse_outcome_three_way_resolved
    expect_reward: 0.0
    expect_reason: ambiguous-class-coerced-silently
    curve: accepted
    defect: {kind: ledger_rows, rows: [{ordinal: r04, verdict: parse-failed, reason: directive-malformed, policy_applied: null}]}
    note: THE central negative control. A pipeline that silently drops the ambiguous class into the failure bucket.

  - id: neg-coerce-partial-to-valid
    role: rejecting
    targets: parse_outcome_three_way_resolved
    expect_reward: 0.0
    expect_reason: ambiguous-class-coerced-silently
    curve: accepted
    defect: {kind: ledger_rows, rows: [{ordinal: r05, verdict: parse-valid, reason: record-complete, policy_applied: null}]}
    note: the mirror negative control. A pipeline that silently trains on structurally incomplete records.

  - id: neg-undeclared-policy
    role: rejecting
    targets: parse_outcome_three_way_resolved
    expect_reward: 0.0
    expect_reason: ambiguous-class-coerced-silently
    curve: accepted
    defect: {kind: ledger_policy, ambiguity_policy: null}
    note: no policy declared at all, which is not a neutral choice but a silent coercion

  - id: ctl-classification-under-narrow-schema
    role: stale-control
    targets: parse_outcome_three_way_resolved
    expect_reward: 0.0
    expect_reason: ambiguous-class-coerced-silently
    curve: accepted
    defect: {kind: stale_schema, schema_version: 1}
    bound_to_mutation: widen-ambiguous-class-schema
    note: >-
      the pre-mutation answer carried forward. The classification was computed under
      parse schema version 1, where a dangling continuation is not ambiguous, while the
      harness has version 2 in force.

  - id: neg-policy-backfit
    role: rejecting
    targets: ambiguity_policy_declared_before_classification
    expect_reward: 0.0
    expect_reason: ambiguity-policy-declared-after-classification
    curve: accepted
    defect: {kind: reorder_events, declared_seq: 9, classified_seq: 2}

  - id: neg-budget-overspend
    role: rejecting
    targets: token_budget_respected_as_fed
    expect_reward: 0.0
    expect_reason: token-budget-overspent
    curve: accepted
    defect: {kind: overspend, fed_tokens: 5200}

  - id: ctl-budget-counted-as-declared
    role: stale-control
    targets: token_budget_respected_as_fed
    expect_reward: 0.0
    expect_reason: token-budget-overspent
    curve: accepted
    defect: {kind: feed_accounting, accounting: as-declared}
    bound_to_mutation: retighten-token-budget-accounting
    note: the pre-mutation accounting basis carried forward, so the budget was checked against a declared number

  - id: neg-split-leak
    role: rejecting
    targets: evaluation_split_not_trained_on
    expect_reward: 0.0
    expect_reason: evaluation-split-leaked-into-training
    curve: accepted
    defect: {kind: leak_split, ordinals: [r13]}

  - id: ctl-split-membership-pre-rotation
    role: stale-control
    targets: evaluation_split_not_trained_on
    expect_reward: 0.0
    expect_reason: evaluation-split-leaked-into-training
    curve: accepted
    defect: {kind: stale_split, split_id: split-v1, ordinals: [r14]}
    bound_to_mutation: rotate-eval-split-partition
    note: the pre-rotation split membership carried forward, so a record held out under the current split reached the feed

  - id: neg-frozen-axis-mutated
    role: rejecting
    targets: frozen_axes_unmoved_across_run
    expect_reward: 0.0
    expect_reason: frozen-axis-mutated
    curve: accepted
    defect: {kind: move_axis, axis: token_budget}

  - id: neg-graded-readout-off-the-bound-eval-step
    role: rejecting
    targets: graded_readout_at_frozen_bound_eval_step
    expect_reward: 0.0
    expect_reason: graded-readout-off-the-bound-evaluation-step
    curve: accepted
    defect: {kind: retime_eval_point, bound_eval_step: 450}
    note: >-
      The WRONG-VALUE half for the discovery value bound_eval_step. The readout is taken
      at a step that is a real evaluation point of this run, so every earlier checker
      still passes: the loss there is verifier-computed, unsmoothed, sustained, on
      harness-owned weights, and the run still ran to the end of its schedule. Only the
      comparison against the step the harness read out of environment/frozen_recipe.json
      refuses it. A solver that never read the environment cannot tell 450 from the
      bound point, and this is the fixture that says so.

  - id: neg-sustain-schedule-truncated
    role: rejecting
    targets: sustain_schedule_matches_frozen_recipe
    expect_reward: 0.0
    expect_reason: sustain-schedule-not-the-frozen-schedule
    curve: accepted
    defect: {kind: retime_sustain_schedule, sustain_points: [450, 500]}
    note: >-
      The WRONG-VALUE half for the discovery value sustain_points. The level is held at
      every point the run scheduled and the run halts after the last of them, so the
      sustained-loss checker and the early-stop checker both pass; the schedule is simply
      not the frozen one, because its last point was dropped. Only the comparison against
      the schedule the harness read out of environment/frozen_recipe.json refuses it.

  - id: neg-submission-written-reward
    role: rejecting-by-isolation
    targets: harness-document-reader
    expect_reward: 0.0
    expect_reason: graded-loss-not-verifier-computed
    curve: accepted
    defect: {kind: forge_writer, document: eval_ledger, writer: submission}
    note: >-
      the substitution recorded in tests/checkers.yaml. No submission can reach the
      reward carrier, so the rejecting half is carried on a planted document whose writer
      field is not verifier-harness, and the harness-document reader refuses it.

# ---------------------------------------------------------------------------------
# Statement ambiguity. Exactly one graded outcome.
# ---------------------------------------------------------------------------------
statement_ambiguity:
  claim: instruction.md admits exactly ONE reading of what is optimized
  reading_one_section: "## What you are optimizing"
  reading_two_section: "## Scoring"
  candidate_metrics: ["validation loss", "documents admitted", "vocabulary size", "pipeline speed", "token count"]
  required_metric: validation loss
  required_direction: lower
  subject_matter_note: >-
    This check is about the INSTRUCTION being unambiguous. That is entirely compatible
    with the task's SUBJECT MATTER being ambiguous parse states, and the two must not be
    confused. The agent is told without ambiguity that one quantity is graded, that it is
    the validation loss of the trained model, and that lower is better. What is
    deliberately ambiguous is a property of the corpus, namely that some documents parse
    to a state that neither fails nor validates, and the instruction is explicit that the
    agent must resolve that ambiguity by a declared policy. An unambiguous instruction
    about an ambiguous subject is the design, not a contradiction in it.

# ---------------------------------------------------------------------------------
# The agent-visible lower layer, as Harbor assembles it for a NON-ORACLE agent.
# ---------------------------------------------------------------------------------
agent_surface:
  roots: [task.toml, instruction.md, environment]
  excluded_by_construction: [tests, solution, trajectories]
  exclusion_note: >-
    solution/ and tests/ are ABSENT from the assembly list rather than filtered out
    after the fact, so no assembly step exists that could ever place the oracle or the
    held-out checkers where an agent reads.
  read_only_proof: >-
    seed/tasks/OER-12/adequacy.py assembles the surface the way Harbor assembles one for
    a non-oracle agent, strips every write bit, then ATTEMPTS A REAL WRITE to each
    lower-layer path an agent can name and asserts every attempt is refused. Mounting
    behaviour is never the proof: a lowerdir option describes an enforcement a kernel
    would apply if a mount happened, no mount is performed, and a read-only claim resting
    on a mount that was never performed would be a claim about nothing.
  agent_writable_paths: ["/app/submission.py", "/app/pipeline.json", "/app/parse_ledger.json", "/app/feed.txt", "/logs/agent/trajectory.jsonl"]

# ---------------------------------------------------------------------------------
# The golden trajectory. Derived, not narrated.
# ---------------------------------------------------------------------------------
golden_trajectory:
  steps:
    - step: 1
      action: read-the-bundle
      detail: read instruction.md, environment/schema.json, environment/split.json and environment/frozen_recipe.json, and identify the frozen axes before writing any code
    - step: 2
      action: notice-the-third-state
      detail: observe that environment/schema.json declares THREE outcome classes and that parse-partial is neither of the other two
    - step: 3
      action: read-the-bound-schema-version
      detail: read the parse schema version in force from the harness state rather than hardcoding one, because the width of the ambiguous class can move during a session
    - step: 4
      action: declare-the-ambiguity-policy
      detail: choose quarantine-partial, state why that one and not the other two, and emit the declaration BEFORE classifying any document
    - step: 5
      action: classify-three-ways
      detail: classify every record into exactly one of the three outcomes, drawing each reason code from its own outcome's reason space
    - step: 6
      action: resolve-the-ambiguous-class
      detail: apply the declared policy to every partial record and record the outcome code on that row, never on any other row
    - step: 7
      action: build-the-feed
      detail: build the training feed from admitted records only, excluding every evaluation-split record under every outcome, and stay inside the frozen token budget as fed
    - step: 8
      action: hand-off
      detail: write pipeline.json, parse_ledger.json and feed.txt, and let the harness train, evaluate and grade. Report no loss of your own.
  what_the_agent_must_not_do:
    - shape the readout by smoothing, averaging or cherry-picking a favourable evaluation
    - halt on a favourable evaluation and present it as the result
    - re-label an ambiguous record as a parse failure or as a valid record without a declared policy
    - reuse a parse-failure reason code for an ambiguous record
    - carry forward a classification computed under a parse schema version no longer in force
    - feed more tokens than the frozen budget, or feed an evaluation-split record
    - modify the model, the optimizer, the token budget or the evaluation split

# ---------------------------------------------------------------------------------
# solve.sh, generated from here.
# ---------------------------------------------------------------------------------
solve:
  shell: "#!/usr/bin/env bash"
  description: Run the reference pipeline over the frozen corpus and emit the graded deliverables.
  steps:
    - 'ENV_DIR="${1:-$(cd "$(dirname "${BASH_SOURCE[0]}")/../environment" && pwd)}"'
    - 'OUT_DIR="${2:-/app}"'
    - 'SCHEMA_VERSION="${OER12_PARSE_SCHEMA_VERSION:-2}"'
    - 'mkdir -p "$OUT_DIR"'
    - 'python3 "$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/reference.py" "$ENV_DIR" "$OUT_DIR" "$SCHEMA_VERSION"'

# ---------------------------------------------------------------------------------
# rubrics.json, generated from here. This grades the SOLUTION against its reference
# answer, which is a different job from tests/rubrics.jsonl grading the TRAJECTORY.
# ---------------------------------------------------------------------------------
solution_rubrics:
  - id: three-way-ledger-emitted
    criterion: The solution emits a parse ledger whose rows carry exactly one of parse-failed, parse-valid or parse-partial, over every record in the corpus.
    reference_answer: 14 rows, 4 parse-failed, 6 parse-valid and 4 parse-partial under parse schema version 2.
  - id: policy-declared-and-applied
    criterion: The solution declares one ambiguity policy and applies its outcome code to every parse-partial row and to no other row.
    reference_answer: quarantine-partial declared, partial-quarantined applied to all 4 partial rows and to none of the other 10.
  - id: reason-spaces-disjoint
    criterion: Every reason code belongs to the reason space of the outcome on the same row.
    reference_answer: failure reasons on failure rows only, record-complete on valid rows only, partial reasons on partial rows only.
  - id: bound-schema-version-honoured
    criterion: The classification is computed under the parse schema version the harness has in force rather than a hardcoded one.
    reference_answer: version 2 in force, so r09 is parse-partial with reason continuation-dangling rather than parse-valid.
  - id: feed-excludes-held-out-and-quarantined
    criterion: The training feed carries admitted records only and no evaluation-split record under any outcome.
    reference_answer: 4 admitted ordinals, r01 r02 r03 r10, with r13 and r14 held out and all partial records quarantined.
  - id: no-loss-reported-by-the-solution
    criterion: The solution reports no validation loss of its own on any graded path.
    reference_answer: the solution prints record, admitted and token counts only; the harness computes the graded loss.

# ---------------------------------------------------------------------------------
# TRUTH.md, generated from here.
# ---------------------------------------------------------------------------------
truth:
  headline: What is actually true about OER-12, stated once, in the place the bundle derives it from.
  sections:
    - heading: The graded quantity
      body: >-
        One quantity is graded: the validation loss of the trained model, lower is
        better. The verifier computes it itself on the frozen held-out split from the
        weights the harness owns, unsmoothed, at the bound evaluation point, and it must
        hold at every sustain point the verifier schedules. It is never a number the
        submission reported, printed or wrote.
    - heading: The third state
      body: >-
        The corpus carries records that neither fail to parse nor parse to a valid
        record. That third state is machine-readable, it is graded, and it must be
        resolved by a policy the pipeline declares before it classifies anything. There
        is no correct policy among the three declarable ones; there is a correct way to
        hold one.
    - heading: What a silent coercion costs
      body: >-
        A pipeline that drops the ambiguous class into the failure bucket, or admits it
        as valid, diverges from the harness's own independent classification of the same
        bytes and scores zero with the reason ambiguous-class-coerced-silently. That
        reason is not a parse-failure reason, because collapsing a third state into a
        neighbour is a different defect from correctly rejecting a broken record.
    - heading: What the anchors are
      body: >-
        Absent. This family's baseline and target are unmeasured and this bundle declares
        them absent under gap-oer-per-family-anchors-unmeasured rather than inventing
        them. The reward schema is bound in full. A live grading run therefore resolves to
        0.0 with the reason anchors-absent-metric-unanchored, which is an evidence state
        and not a verdict on any submission.
    - heading: What was and was not executed
      body: >-
        seed/tasks/OER-12/adequacy.py drives the LIVE checkers in tests/ over fixtures and
        its observed exit code is recorded in seed/tasks/OER-12/feasibility.yaml. No model
        was trained anywhere in this lane, and the loss curves in this file are declared
        fixture inputs rather than measurements, carried as
        gap-oer-12-loss-curves-are-declared-fixtures.

# ---------------------------------------------------------------------------------
# Declared gaps.
# ---------------------------------------------------------------------------------
gaps:
  - id: gap-oer-per-family-anchors-unmeasured
    statement: F13 has no measured baseline or target, so this slot binds the reward schema and declares the anchor numbers absent.
    closes_by: a measured anchor pair for F13 recorded in seed/contract.yaml from published evidence
  - id: gap-oer-budget-field-name-collides-with-its-role
    statement: budget_hours is bound to 0.12 as provisional because the requirements file names the field with a value whose stated role is the across-attempts terminator.
    closes_by: the contract owner correcting requirements/ and Phase 0.5 re-approving
  - id: gap-oer-solver-egress-ruled-stricter
    statement: the batch field reads setup-only under the stricter reading while this bundle binds open at the agent surface; the divergence is recorded and the batch field is not amended by this lane.
    closes_by: the client resolving the contradiction between the two requirements lines
  - id: gap-oer-12-loss-curves-are-declared-fixtures
    statement: no model was trained in this lane, so every validation loss in the fixtures is a declared input rather than a measurement, and no part of this bundle presents one as measured.
    closes_by: a pilot run on the bound envelope producing measured curves
  - id: gap-oer-12-fixture-anchors-are-fixture-local
    statement: the accepting half needs a non-null anchor pair to drive the real reward function to full reward, so the fixture carries one that is explicitly fixture-local and is never presented as this family's anchors.
    closes_by: the same measured anchor pair that closes gap-oer-per-family-anchors-unmeasured

