# Harbor delivery manifest, slot OER-08, family F12 data curation.
#
# schema_version is a TOP-LEVEL scalar and is written above the first table header on
# purpose. TOML scopes every key to the most recent header, so an assignment written
# after `[task]` would silently become `task.schema_version` and leave the top-level
# scalar absent while the file still read correct to a human.
schema_version = "1.4"

multi_step_reward_strategy = "last"

# Graded deliverables, TOP-LEVEL list, above the first table header for the same
# scoping reason.
artifacts = [
  "/workspace/submission/plan.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-08-mixture-search-breadth"
version = "2.0.0"
description = """
Allocate a fixed FineWeb10B token budget across a pool of eight sources so that the
frozen nanoGPT decoder trained on the resulting stream reaches a lower validation loss
on the verifier's held-out split. The handed plan -- equal shares of everything, in
manifest order -- is ONE option rather than the option set: the plan grammar admits
unequal allocation, repetition, omission and ORDER, and the sources are not equally
worth spending budget on. Reward is the fraction of the gap closed between two anchor
plans that are BOTH retrained from scratch on every grading run.
"""
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "data-curation"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
batch = "OER-2026-08-20"
slot = "OER-08"
provisional_identifier = "OER-08"
identity_note = "This slot is staged under its slot id."
title = "Data mixture search breadth under a fixed token budget"
family = "F12"
family_title = "data curation"
archetype = "AR5"
archetype_title = "Adversarial Option Expansion"
archetype_load_bearing_category = "open-ended-search-breadth"
archetype_note = """
The handed default plan spends the budget in equal shares over all eight sources in
manifest order. That is the obvious option and it is a bad one: five of the eight
sources are damaged, two of them catastrophically, and the order is arbitrary. The
plan grammar in environment/plan_schema.md admits allocations the handed template
cannot express -- unequal shares, omission of a source entirely, repetition of one,
and an ordering chosen rather than inherited. Beating the default requires expanding
the option set beyond the shape that was handed over, which is what AR5 names.
"""
metric = "validation cross-entropy in nats on the verifier's held-out FineWeb slice"
metric_direction = "lower"
frozen = "the architecture, the initialisation seed, the optimizer and its schedule, the token budget, the number of forward and backward passes, and the evaluation window"
free = "which sources the budget is drawn from, in what proportion, from what offset, and in what order"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

reward_kind = "single float"
reward_interval = "closed, 0.0 to 1.0"
reward_direction = "higher is better"
reward_binary = false
reward_full = 1.0
reward_formula = "raw = (default_loss - agent_loss) / (default_loss - reference_loss)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
reward_target_is_a_bar = "reaching the reference scores exactly 1.0 and beating it also scores 1.0"

anchors_state = "measured-on-every-run"
anchors_runtime_effect = "The low anchor is environment/default_plan.json retrained from scratch; the high anchor is tests/private/reference_plan.json, which is staged only into the verifier image. If either fails to produce a finite loss the run refuses at 0.0 with reason anchor-diverged, and if the two coincide it refuses with calibration-span-nonpositive. Neither path substitutes a stored value."

[metadata.optimization]
max_timeout_hours = 6.0
budget_hours = 0.5
budget_hours_role = "per-attempt completion bound"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
compute_envelope_accelerators = 1

# The graded path is THREE from-scratch training runs plus three evaluations, sized
# to fit well inside one grading pass. The number below is measured rather than
# declared: see solution/grounding.md.
graded_path_seconds_measured = 160
graded_path_seconds_budget = 600

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 32768
gpus = 1
gpu_types = ["H100"]
workdir = "/app"
build_timeout_sec = 3600
network_mode = "public"

[agent]
submission_path = "/workspace/submission/plan.json"
network_mode = "none"
note = """
The pool and every dependency are staged at image build, so the solving agent needs no
run-time egress. /workspace is the only path shared with the verifier; /app is not, and
a plan left in /app is a plan that is never graded.
"""

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
reward_kind = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
never_imports_submission = true
note = """
The submission is a JSON declaration of draws. The verifier parses it, bounds-checks
it, assembles the stream it describes and trains on it. No code from the agent surface
is imported or executed here, and no number the submission reports about itself is read.

/logs/verifier is a DIRECTORY in the verifier image and deliberately NOT a VOLUME. An
anonymous volume declared at that path shadows the /logs bind mount the runner supplies,
and every carrier written under it is discarded with the container.
"""

[verifier.hygiene]
note = """
Schema and budget validation is a GATE, not a grade. plan_schema.py answers one question
-- is this a well-formed plan that spends the frozen budget exactly -- and a failure
REFUSES the run at 0.0 with a machine-readable reason. It never scales the float and
never contributes partial credit.
"""
refusal_reasons = [
  "submission-absent",
  "plan-unreadable",
  "plan-not-an-object",
  "plan-schema-unrecognised",
  "plan-key-unknown",
  "plan-key-missing",
  "plan-draws-empty",
  "plan-draw-not-an-object",
  "plan-too-many-draws",
  "plan-source-not-in-pool",
  "plan-value-not-an-integer",
  "plan-tokens-not-a-granularity-multiple",
  "plan-offset-not-a-granularity-multiple",
  "plan-budget-not-spent-exactly",
  "verifier-anchor-plan-invalid",
  "accelerator-absent",
  "verifier-substrate-unavailable",
  "anchor-run-failed",
  "anchor-diverged",
  "calibration-span-nonpositive",
  "agent-run-failed",
  "agent-plan-diverged",
  "grading-chain-failed",
  "grading-timed-out",
  "grading-killed",
]

[solution]
oracle = "solution/reference.py"
entry = "solution/solve.sh"
grounding = "solution/grounding.md"
note = """
The oracle installs a plan derived from a source-by-source survey any solver can run with
environment/probe_local.py --solo. It is NOT the verifier's private reference plan: the
two were arrived at separately and differ in their draws and in their order, so the
reference arm of the gate is never the high anchor being graded against itself.
"""
