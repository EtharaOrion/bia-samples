# This file is excluded from the canonical content hash, which is what lets it carry
# that hash without a cycle. Everything else under the bundle root except trajectories/
# is inside the hash domain.

origin: original
source_kind: synthetic
provenance_date: "2026-08-21"
upstream_benchmark: >-
  none. The BIA-GSN-1 operator is authored for this bundle. It is not lifted from an
  upstream benchmark instance, it reproduces no published kernel, and its constants,
  reduction order, and fixture set were chosen here.
