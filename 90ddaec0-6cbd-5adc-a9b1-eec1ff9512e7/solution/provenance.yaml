  profile: smoke
  device: cpu
  cuda_visible_devices: ""
  wall_clock_s: 1.99
  exit_code: 0
  fixtures: 6
  all_fixtures_bitwise_identical: true
  checkers_passed: 6
  compiled_rubric_tests_passed: 8
  standing: >-
    The smoke path executes the identical code path at tiny scale on CPU and fully
    exercises the correctness gate and the DIVERGENCE comparison. The speedup it prints
