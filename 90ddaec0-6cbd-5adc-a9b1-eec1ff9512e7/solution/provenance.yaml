    generated artifact is byte identical to its regeneration"

hash_recipe:
  namespace: c53e8f3b-526f-52c0-a04e-89e2269b237d
  algorithm: sha256
  exclusions:
    - "trajectories/**"
    - "solution/provenance.yaml"
    - "any path with a __pycache__ or .pytest_cache component"
  procedure: >-
    Walk every regular file under the bundle root. Drop each excluded path, including
    any path carrying a __pycache__ or .pytest_cache component, since interpreter
    bytecode caches are build residue rather than bundle content. Sort the
    surviving relative POSIX paths as UTF-8 byte strings. For each, emit the relative
    path bytes, then a single zero byte, then the lowercase hex sha256 of the file
    contents, then a newline. Concatenate in sorted order. The canonical content hash
    is the lowercase hex sha256 of that concatenation. The directory name is
    uuid5(namespace, canonical_content_hash) where the hash is passed as its lowercase
    hex string.
  recompute_command: "python3 solution/recompute.py hash --root ."
  independent_recomputation: >-
    The command above is the same code path that produced the binding block below, and
    the procedure is stated in full so a reader can implement it independently in ten
    lines and get the same answer without trusting this bundle's own script.

binding:
  canonical_content_hash: "c4036671bfae36c803307d9e65f53bbe22758154c826d245d0b580b48841fc4e"
  files_hashed: 30
