difficulty:
  claim: none
  tier: none
  pass_probability: none
  self_solve_claim: none
  defeat_mechanism: >-
    The model must produce a numerically identical result faster, and the DIVERGENCE
    checker makes approximation worthless. The standard throughput playbook of lower
    precision, tensor cores, fused multiply add, fast math, and a default compiler
    fusion pass each change the bit pattern and therefore score zero, so the reachable
    speedups are only those that are value preserving at the element level.
  status: DESIGN INTENT, UNMEASURED
  statement: >-
    Difficulty is measured and never claimed. This bundle carries no authored pass
    probability, no self solve claim, and no assertion that it is hard offered as
    evidence. It ships at HOLD:PILOT_REQUIRED, which is the correct terminal state for
    a bundle with no external signed pilot.
