    that solve.sh runs end to end and that the instrument decides, not that the
    instrument decides correctly on an H100.

controls_evidence:
  command: "solution/solve.sh --controls"
  profile: smoke
  device: cpu
  controls: 9
  all_as_expected: true
  both_halves:
    DIVERGENCE: accepts solution/fast_impl.py, rejects c_perturbed and c_float64_roundtrip
    EFFECT: accepts solution/fast_impl.py, rejects c_truncated_output
    ABSENCE: accepts solution/fast_impl.py, rejects c_tf32_override
    INVARIANT: accepts an unedited run, rejects c_frozen_edit
    ORDERING: accepts the recorded log, rejects the truncated log
    VALUE: accepts the recorded summary, rejects the inflated summary
  standing: >-
    Every required checker demonstrated both halves of its decision under frozen bytes
    on a throwaway copy of the bundle. None is hardcoded to pass and none is hardcoded
    to fail.

reference_calibration:
  standing: MEASURED
  measured_on: "2026-08-21"
  device: one NVIDIA H100 80GB HBM3
  profile: graded
  operating_point: 15 rounds, 8 warmup calls and 40 timed calls per implementation per
    round, workload 32768 rows by 2048 columns float32
  repeats: 8
  speedup_median: 16.7715
  speedup_min: 16.4527
  speedup_max: 17.3337
  speedup_stdev: 0.2506
  speedup_relative_stdev_percent: 1.49
  target_metric: 32.543
  derivation: "target_metric = 1 + 2 * (16.7715 - 1) = 32.543"
  reference_score: 0.5
  wall_clock_s_median: 38.50
  wall_clock_s_range: [38.03, 39.54]
  contention_control: >-
    Seven sibling lanes shared the same H100 during this calibration. Every repeat was
    gated behind a contention probe that times solution/fast_impl.py on the graded
    workload and admits the run only when that time is at the uncontended floor of 2.75
    milliseconds, and the per round submission medians of every admitted repeat were
    checked against that floor afterwards. Repeats taken while the card was contended
    were not used for calibration and are recorded below rather than dropped silently.
  contended_observation: >-
    On a contended card the same reference measured 3.65 to 13.28 rather than 16.45 to
    17.33, over 4 repeats whose wall clock ran from 16.04 to 26.07 seconds. The ratio is
    not contention neutral even though it is taken back to back on one device, because
    the reference is dominated by per launch overhead across its 128 row chunks while the
    submission is dominated by memory bandwidth in a single pass, so a co-tenant steals
    bandwidth from the submission faster than it steals launch slots from the reference.
    The graded envelope is one H100 per attempt, so the uncontended figure is the one the
    reward is calibrated against.
  rounds_change: >-
    The graded round count was raised from 5 to 15. Over 8 uncontended repeats of each
    setting the run to run standard deviation of the reported speedup fell from 0.4665 to
    0.2506, which is 2.81 percent of the estimate down to 1.49 percent, and the full
    observed range fell from 1.4450 to 0.8810. The median graded wall clock rose from
    14.79 seconds to 38.50 seconds, which is 8.9 percent of the 432 second per attempt
    bound. The 240 second measurement guard is unchanged and still aborts with reason
    measurement_budget_exceeded rather than overrunning.

