schema_version = "1.4"

artifacts = [
  "/workspace/submission/impl.py",
  "/workspace/artifacts/submission_out",
  "/logs/verifier/score.json",
  "/logs/verifier/report.json",
  "/logs/verifier/outcomes.json",
  "/logs/verifier/harness_events.jsonl",
  "/logs/verifier/timing_summary.json",
]

[task]
name = "bia/s05-kernel-throughput"
version = "1.0.0"
description = "Reimplement the frozen BIA-GSN-1 operator so it returns bit identical output faster than the reference on one H100."
authors = [{ name = "Bia" }]
# The optimization lane requires both tags. They are bound bytes, not decoration.
keywords = ["optimization", "bounded-continuous", "kernel", "throughput", "numerics"]
tags = ["optimization", "bounded-continuous"]

# ---------------------------------------------------------------------------
# The seven optimization bindings. All seven appear here or the bundle is invalid.
#
#   1 max_timeout       6.0 hours, terminates the refinement loop across attempts
#   2 budget_hours      0.12 hours, 7.2 minutes, the PER ATTEMPT completion bound
#   3 max_attempts      50, under the client ceiling of 100
#   4 final_selection   best
#   5 solver egress     setup-only, no network during scored work
#   6 compute envelope  one H100
#   7 reward            a single float on the closed interval [0, 1]
#
# budget_hours is bound BY ROLE and is deliberately not the 6 that appears in
# requirements/bia-environment-spec.md. That 6 bounds one fifty attempt session, which
# is max_timeout's role. Writing 6 into budget_hours would encode a 300 hour session
# that no field comparison would catch.
# ---------------------------------------------------------------------------
[metadata]
category = "optimization"
max_timeout_hours = 6.0
budget_hours = 0.12
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = 0.10
max_attempts = 50
final_selection = "best"
solver_egress = "setup-only"
compute_envelope = "one H100"
family = "F5 kernel optimization"
family_source = "requirements/bia-environment-spec.md line 43"
operating_point_source = "requirements/bia-environment-spec.md lines 122 to 135"
per_attempt_budget_minutes = 7.2
maturity = "draft"
disposition_ceiling = "HOLD:PILOT_REQUIRED"

[metadata.scaled_operating_point]
# 6 hours divided by 50 attempts is 7.2 minutes of single H100 time per graded attempt.
# The measurement phase inside one graded attempt is bounded at 240 seconds by a hard
# guard in tests/checkers/timing.py, which aborts the measurement and scores exactly
# 0.0 with reason measurement_budget_exceeded rather than overrunning the bound. The
# remaining 3.2 minutes cover container start, import, workload allocation, the
# correctness gate, and the agent's own edit and self check loop.
session_hours = 6.0
attempts_per_session = 50
per_attempt_budget_hours = 0.12
measurement_budget_s = 240.0
timing_trials_per_implementation_per_round = 40
warmup_trials_per_implementation_per_round = 8
rounds = 15
# Raised from 5 to 15 after measurement. At 5 rounds a graded attempt used 14.79 seconds
# of the 432 an attempt is allowed, and the run to run standard deviation of the reported
# speedup was 0.4665. At 15 rounds it is 0.2506 over 8 uncontended repeats of each
# setting, for a median graded wall clock of 38.50 seconds. The 240 second guard is
# unchanged and still aborts rather than overruns.
realized_attempt_duration_s = 38.50
realized_attempt_duration_range_s = [38.03, 39.54]
realized_attempt_duration_standing = "MEASURED over 8 repeats on one uncontended H100 at the graded profile"

[metadata.cohort]
# Pinned by name from requirements/bia-environment-spec.md. The registry digest is not
# supplied by the brief and is carried as the open decision cohorts-unpinned.
named = ["gpt5.6-sol", "anthropic/claude-opus-5", "muse-spark-1.2"]
valid_to = "2026-11-17"
registry_digest = "UNPINNED"

[reward]
# Binding 7. One float, higher is better, never binary.
kind = "bounded-continuous"
dtype = "float"
range = [0.0, 1.0]
full_reward = 1.0
metric = "median_over_rounds_of_per_round_total_time_ratio_over_frozen_reference"
metric_note = "a round total is the sum of its forty timed trials plus its barrier; the total rather than the median inside a round is deliberate, because a median discards a round whose work was concentrated into one call"
direction = "higher_is_better"
baseline_metric = 1.0
target_metric = 32.543
target_metric_standing = "MEASURED"
target_metric_derivation = "target_metric = 1 + 2 * (reference_speedup - 1) = 1 + 2 * (16.7715 - 1) = 32.543, where 16.7715 is the median speedup solution/fast_impl.py earned over 8 uncontended repeats at the graded operating point on one H100"
reference_speedup_measured = 16.7715
reference_speedup_range = [16.4527, 17.3337]
reference_speedup_stdev = 0.2506
reference_score_measured = 0.5
formula = "score = min(max((speedup - 1.0) / (32.543 - 1.0), 0.0), 1.0)"
path = "/logs/verifier/score.json"
attribution_path = "/logs/verifier/report.json"
zero_score_reason_required = true
gate = "every checker in tests/checkers.yaml must pass, otherwise the score is exactly 0.0 with a machine readable reason"
anchor_standing = "baseline_metric is 1.0 by construction because the baseline is the frozen reference measured against itself inside the same graded run. target_metric is MEASURED on one H100 rather than authored, and it is set so the reference lands at exactly one half, which leaves the same amount of rankable range below the reference as above it. Reaching the clamp requires doubling the reference margin over the frozen baseline."

[agent]
# One attempt is bounded by budget_hours, which is 0.12 hours, which is 432 seconds.
timeout_sec = 432.0
# Binding 5. Egress is available while the environment is being set up and is closed
# for the scored work, which is the stricter of the two readings the client brief
# leaves open and the reading requirements/bia-environment-spec.md instructs us to
# design against until the client rules.
network_mode = "none"
egress_mode = "setup-only"
submission_path = "/workspace/submission/impl.py"

[verifier]
timeout_sec = 900.0
entrypoint = "tests/test.sh"
environment_mode = "shared"
env = { }

[isolation]
graded_run_owner = "verifier"
submission_process = "tests/checkers/worker.py, one process per implementation, started by tests/grade.py"
submission_channel = "JSON lines over stdin and stdout; the only thing a worker says is that it finished"
clock_owner = "verifier, timing each round trip with perf_counter_ns on its own side of the pipe"
input_identity = "every timed trial folds the previous output back into the input at grader chosen positions, so no two timed calls receive the same input"
round_barrier = "each round ends with a timed request for exact values at grader chosen positions, verified against the reference worker, so deferred device time is charged rather than escaped"
correctness_gate_order = "the submission computes every fixture before the reference does, so the reference output tree does not exist while the submission runs"
shared_secret = "none"
scraped_stdout = "none; no number the workers report enters the reward"

[environment]
# Pinned by digest and not by tag. This digest is the public PyTorch base recorded in
# the verified track3 reference bundle. This lane transcribed it rather than
# independently re-resolving it against the registry, and that limitation is recorded
# in solution/provenance.yaml as a named gap rather than presented as a resolution.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
# Binding 6. One H100 is the whole accelerator budget.
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 40960
# Baseline for environment setup only. [agent] overrides to a closed network for the
# scored run, which is a precedence pair and not a contradiction.
network_mode = "public"
env = { BIA_BUNDLE = "/", BIA_TESTS = "/tests", BIA_ENV_DIR = "/environment", BIA_ARTIFACTS = "/workspace/artifacts", BIA_LOGS = "/logs/verifier" }

[refinement]
# The bounded refinement loop the optimization lane binds. Each iteration lets the
# agent edit and submit, grades the submission, summarizes the trajectory, and starts
# the next iteration carrying every prior approach and its reward.
loop = "edit, submit, grade, summarize, repeat"
carry_prior_summaries = true
final_selection = "best"
trajectory_rubrics = "tests/rubrics.jsonl"
trajectory_judge = "advisory, may lower a score and may never raise one"

[grading]
verifier_entrypoint = "tests/test.sh"
checkers = "tests/checkers.yaml"
checker_count = 6
reduction_kinds = ["VALUE", "EFFECT", "ABSENCE", "INVARIANT", "ORDERING", "DIVERGENCE"]
correctness_gate = "divergence_bitwise"
red_lines = ["divergence_bitwise", "absence_relaxed_precision", "invariant_frozen_surface"]
order = "correctness before timing before reward"

[provenance]
origin = "original"
provenance_date = "2026-08-21"
source_kind = "synthetic"
upstream_benchmark = "none. The operator is authored for this bundle and is not lifted from an upstream benchmark instance."
generator = "solution/recompute.py over solution/grounding.yaml"
