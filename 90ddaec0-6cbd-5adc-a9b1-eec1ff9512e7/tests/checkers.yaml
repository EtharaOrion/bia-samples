schema: forge.checkers/v1
task: BIA-GSN-1 kernel level throughput
statement: >-
  Every graded assertion in this bundle reduces to exactly one of the six kinds and
  names the live state read it traces to. A checker that reduces to none of them, or
  to two of them, is invalid and is not shipped. The executable side of this
  declaration is tests/checkers/kinds.py and the identifier sets must match.
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

reward_path: /logs/verifier/reward.txt

aggregation:
  mode: required_pass
  note: >-
    Every checker below is a hard gate. tests/grade.py forces the score to exactly 0.0
    the moment one of them is false, and only a run with all six true is scored on its
    measured speedup, so every checker is declared required. required_pass is the mode
    that states exactly that. The reward path is the one the runtime mounts;
    tests/test.sh projects grade.py's score onto it as a single float from an EXIT
    trap, so no path out of the entry point leaves it absent.

checkers:

  - id: divergence_bitwise
    reduction: DIVERGENCE
    statement: >-
      The submitted implementation and the verifier's private copy of the frozen
      operator produce bit identical outputs for every fixture.
    implementation: tests/checkers/kinds.py::check_divergence_bitwise
    reached_by: tests/checkers/kinds.py
    selector: check_divergence_bitwise
    zero_reason: divergence-from-reference-output
    required: true
    asserts: >-
      The tensors the submitted implementation returned and the tensors the verifier's
      own private copy of the frozen operator returned carry identical 32 bit patterns
      for every fixture, for both the Y output and the R output.
    live_state_read: >-
      The raw bytes of two independently produced artifact trees on the filesystem,
      /workspace/artifacts/submission_out and /workspace/artifacts/reference_out. The
      checker reads both trees itself and compares them word by word. It never reads a
      pass or fail claim recorded by the code that produced either tree.
    independence: >-
      The two results are derived independently. One comes from the submitted module
      loaded from the submission path, the other from tests/checkers/opcore.py, which
      no agent visible path can reach and which the INVARIANT checker pins by digest.
    comparison: raw 32 bit pattern equality, so a signed zero difference and a NaN
      payload difference both count as divergence
    red_line: true
    on_fail: score is exactly 0.0 with reason checker_failed:divergence_bitwise
    both_halves:
      accepts: solution/fast_impl.py, which reproduces the frozen op sequence exactly
      rejects: >-
        every known wrong control in solution/grounding.yaml, including the reduced
        precision control, the fused multiply add control, the library reduction
        control, and the reciprocal square root control

  - id: effect_outputs_materialized
    reduction: EFFECT
    statement: >-
      Invoking the submitted implementation changed the artifact tree in the declared
      way, with every declared artifact present, correctly sized and freshly stamped.
    implementation: tests/checkers/kinds.py::check_effect_outputs_materialized
    reached_by: tests/checkers/kinds.py
    selector: check_effect_outputs_materialized
    zero_reason: submission-did-not-materialize-declared-outputs
    required: true
    asserts: >-
      Invoking the submitted implementation changed the artifact tree in the named
      way: the submission output directory gained exactly the declared artifacts, each
      of exactly the declared byte length for its fixture shape and dtype, each
      stamped after the invocation marker.
    live_state_read: >-
      os.stat over every declared artifact under /workspace/artifacts/submission_out,
      compared against the modification time of the /workspace/artifacts/.invocation_start
      marker file the harness created immediately before the first call into the
      submitted implementation. Both instants come from the same filesystem clock, so
      no cross clock tolerance is needed.
    red_line: false
    on_fail: score is exactly 0.0 with reason checker_failed:effect_outputs_materialized
    both_halves:
      accepts: solution/fast_impl.py, which returns the declared shapes and dtypes
      rejects: >-
        the wrong shape control and the returns None control in
        solution/grounding.yaml, neither of which can materialize an artifact of the
        declared length

  - id: absence_relaxed_precision
    reduction: ABSENCE
    statement: >-
      No relaxed precision switch exists anywhere in the live grading process at
      checker time.
    implementation: tests/checkers/kinds.py::check_absence_relaxed_precision
    reached_by: tests/checkers/kinds.py
    selector: check_absence_relaxed_precision
    zero_reason: relaxed-precision-switch-present
    required: true
    asserts: >-
      No relaxed precision switch exists in the live grading process: no TF32 path is
      enabled on either backend, the float32 matmul precision is highest, no autocast
      context is active, and no relaxed precision override is present in the
      environment table.
    live_state_read: >-
      The torch backend precision flags read out of the running interpreter after the
      submitted implementation has been imported and executed, together with the live
      os.environ table. The grader sets the strict posture before the submission is
      loaded, so anything found enabled at checker time was enabled by the submission
      or by an import side effect of it.
    red_line: true
    on_fail: score is exactly 0.0 with reason checker_failed:absence_relaxed_precision
    both_halves:
      accepts: solution/fast_impl.py, which touches no backend flag
      rejects: the tf32 enabling control in solution/grounding.yaml

  - id: invariant_frozen_surface
    reduction: INVARIANT
    statement: >-
      The frozen operator surface held across the whole run, at the start of the run
      and again at checker time.
    implementation: tests/checkers/kinds.py::check_invariant_frozen_surface
    reached_by: tests/checkers/kinds.py
    selector: check_invariant_frozen_surface
    zero_reason: frozen-surface-moved-during-run
    required: true
    asserts: >-
      The frozen operator surface held across the whole run. Every path named in
      tests/checkers/frozen_manifest.json carried its manifest digest at the start of
      the run and carries it again at checker time.
    live_state_read: >-
      The sha256 of every manifest path recomputed from the filesystem at checker
      time, compared against both the manifest value and the start of run snapshot the
      grader took before the submission module was loaded.
    scope: >-
      environment/reference_impl.py, environment/spec.json, tests/checkers/opcore.py,
      tests/checkers/spec.json, tests/checkers/kinds.py, tests/checkers/timing.py
    red_line: true
    on_fail: score is exactly 0.0 with reason checker_failed:invariant_frozen_surface
    both_halves:
      accepts: a run in which no frozen path is edited
      rejects: the frozen surface edit control in solution/grounding.yaml

  - id: ordering_measurement_protocol
    reduction: ORDERING
    statement: >-
      The measurement events occurred in the required sequence, gate before warmup
      before timed trials, with contiguous indices and an identical order per round.
    implementation: tests/checkers/kinds.py::check_ordering_measurement_protocol
    reached_by: tests/checkers/kinds.py
    selector: check_ordering_measurement_protocol
    zero_reason: measurement-protocol-out-of-order
    required: true
    asserts: >-
      The measurement events occurred in the required sequence: the correctness gate
      closed before any warmup, every warmup completed before the first timed trial of
      its implementation and round, timed trial indices ascend contiguously from zero
      within each implementation and round, and the declared within round order of
      implementations repeats identically in every round.
    live_state_read: >-
      The append only event log at /logs/verifier/harness_events.jsonl, written one
      line at a time by tests/checkers/timing.py as the run progressed, with a
      monotonically increasing sequence index per line.
    red_line: false
    on_fail: score is exactly 0.0 with reason checker_failed:ordering_measurement_protocol
    both_halves:
      accepts: a complete measurement run under the declared protocol
      rejects: >-
        the truncated measurement control and the shuffled event log control in
        solution/grounding.yaml

  - id: value_reward_recomputed
    reduction: VALUE
    statement: >-
      The recorded reward equals the value recomputed independently from the raw per
      trial durations in the append only event log.
    implementation: tests/checkers/kinds.py::check_value_reward_recomputed
    reached_by: tests/checkers/kinds.py
    selector: check_value_reward_recomputed
    zero_reason: recorded-reward-not-reproducible-from-durations
    required: true
    asserts: >-
      The recorded reward equals the value recomputed from the raw per trial
      durations: the timed trial count per implementation and round equals the
      declared count, every duration is positive, the speedup equals the median over
      rounds of the per round median ratio, and the reward equals
      min(max((speedup - 1.0) / (32.543 - 1.0), 0.0), 1.0).
    live_state_read: >-
      The per trial duration entries in /logs/verifier/harness_events.jsonl and the
      summary at /logs/verifier/timing_summary.json. The checker recomputes every
      number from the logged durations and requires the recorded summary to equal what
      it recomputed.
    red_line: false
    on_fail: score is exactly 0.0 with reason checker_failed:value_reward_recomputed
    both_halves:
      accepts: a summary the grader computed from the durations it logged
      rejects: the tampered summary control in solution/grounding.yaml

gate:
  order: correctness before timing before reward
  rule: >-
    Any failing checker forces the score to exactly 0.0 with a machine readable
    reason. A submission that diverges from the reference never reaches a timing
    number, so a fast wrong implementation cannot bank a partial reward.
  reward_when_all_pass: min(max((speedup - 1.0) / (32.543 - 1.0), 0.0), 1.0)
