# ---------------------------------------------------------------------------
# Statement ambiguity: exactly one graded outcome. FORGE.md Phase 1 item 10a.
# Authored by reading instruction.md in full and the live verifier, never the prose.
# ---------------------------------------------------------------------------

statement_ambiguity:
  graded_scalar: "reward, the float tests/grade.py::grade returns as normalize_reward(handle.graded_score, anchors) = clip((graded_score - baseline_metric) / (target_metric - baseline_metric), 0, 1)"
  readings:
    - id: reading_a_plain_words_accuracy
      source: "instruction.md, line 3 'That benchmark score is your reward' together with section 'What is graded, in plain words', line 7"
      reduces_to: >-
        Maximise the held-out next-token top-1 accuracy of the model the verifier trains
        itself, read at the evaluation mark the verifier binds, unsmoothed, from the
        verifier's own forward pass over the 64 held-out windows.
    - id: reading_b_difference_over_null_control
      source: "instruction.md, section 'Where the score comes from', lines 63 to 65: 'The untrained decoder is the null control ... what is graded is the difference your corpus makes, not whether it reaches a headline figure.'"
      reduces_to: >-
        Maximise the amount by which the corpus lifts the trained decoder's held-out
        accuracy above the untrained decoder's accuracy on the same benchmark, that is,
        maximise graded_score minus the null-control reading.
  identical: true
  proof_method: >-
    The two reductions differ by a constant that no submission can move, so they induce the
    same ordering and the same float. In tests/grade.py the null control is built at line 339
    as null_snapshot = frozen_stack.train([]) and read at line 340 as
    frozen_stack.evaluate(null_snapshot, benchmark): its argument list contains nothing
    derived from the submission, so null_control_score is a fixed function of the frozen
    stack and the frozen benchmark. Reading B's quantity is therefore
    graded_score - c for a submission-independent c, and maximising it is maximising
    graded_score. tests/grade.py::grade reads only handle.graded_score (line 471) and passes
    it to normalize_reward (line 421), which is
    (score - baseline_metric) / (target_metric - baseline_metric) clipped, an increasing
    affine map. The null control enters the decision only as a gate, at
    tests/checkers.py line 351, `if float(handle.graded_score) <= float(handle.null_control_score)`,
    which can zero a run but never scales it, so it cannot make the two readings rank two
    scoring submissions differently. graded_score itself is one field, set once in
    tests/grade.py at line 334 from the eval point whose index equals params['graded_eval_point'].

