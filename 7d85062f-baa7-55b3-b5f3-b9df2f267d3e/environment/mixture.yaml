# The default mixture parameterisation.
#
# This file is a TEMPLATE, not a boundary. It expresses one family of
# allocations: a constant weight per source, with each source's share drawn
# uniformly from the whole source. It is the parameterisation most mixture
# search papers hand you, and `harness.py --from-mixture mixture.yaml` will
# turn it into a plan for you.
#
# The graded objective constrains ONE thing: the total number of tokens the
# harness feeds. Nothing in the objective says an allocation has to be constant
# per source, has to treat a source as indivisible, or has to see each document
# at most once. Those are properties of THIS file, not of the task. Read
# plan_schema.md for the full grammar the harness accepts.
schema: oer08.mixture/v1
mode: constant
weights:
  curated-core: 0.20
  web-crawl: 0.20
  technical: 0.20
  forum-dump: 0.20
  reference-a: 0.20
