schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py walks the required checkers in gate order and returns the floor
    on the first failure, carrying that checker's zero reason, which is exactly the
    required_pass reduction: a universal quantifier over the required set, resolving
    to the floor unless every member passes. Nine checkers are marked required, so
    the quantifier is never taken over an empty set. The gate value that reduction
    yields is in {0.0, 1.0}; grade.py multiplies it by the continuous magnitude term
    carried by the one non-required criterion, so the emitted reward is a float on
    the closed interval and is never binary. Nothing else enters the number.

carrier_note: >-
  The live verifier binds the reward carrier to reward.txt holding a bare float. The
  machine-readable reason and the metric block travel in the companion score document.
  tests/test.sh writes both from a single EXIT trap so the bound carrier and the
  reason carrier can never disagree.

live_state_note: >-
  Every handle below is a telemetry file tests/runner.py wrote inside the verifier's
  own process while it executed the plan. No checker reads a value the submission
  printed, no checker reads a file the submission wrote, and no checker imports the
  submission. tests/runner.py copies the submission alone into a fresh temporary
  directory, launches it as a new session leader under a five-name environment
  allowlist, captures its output, and kills the whole process group in a finally block.

anchors_note: >-
  baseline_metric and target_metric are ABSENT for family F12 under
  gap-oer-per-family-anchors-unmeasured. The reward schema is bound in full and no
  anchor number is invented. The magnitude term is normalised between two
  substrate-local calibration points the verifier recomputes from frozen bytes,
  carried under gap-oer08-magnitude-normaliser-is-substrate-local.

checkers:
  - id: frozen_token_budget_is_the_graded_budget
    statement: "The token budget the harness graded against, read back from its own feed ledger, is the budget this bundle froze, and the bound-point flag it recorded is that budget's exhaustion."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_frozen_token_budget_is_the_graded_budget
    zero_reason: frozen-token-budget-not-the-graded-budget
    required: true
    weight: 1
    live_state_read: "/logs/harness/feed.json budget and tokens_fed, and /logs/harness/eval.json bound_point_reached, all written by tests/runner.py in the verifier's process from the corpus it actually fed, against the frozen figure in tests/budget_spec.json"
    compiled_test: "tests/test_output.py::test_frozen_token_budget_is_the_graded_budget"
    drift_keys: [budget]
    frozen_side_carrier: tests/budget_spec.json
    carrier_derivation: "generated by solution/recompute.py from solution/grounding.yaml substrate.budget_tokens; never transcribed from instruction.md, which states no figure and names environment/corpus_spec.json as the carrier a solver reads it from"
    why_this_row_is_not_the_next_two: "token_budget_respected_as_fed and bound_evaluation_point_reached are both RELATIVE: each compares what was fed against whatever budget the feed ledger reports. A pool whose declared budget had drifted would satisfy both, consistently, against a number nobody froze. This row is the only one that grades the number itself, so the value the environment establishes is load-bearing rather than decorative."
    adequacy: "accepting half fired by the reference plan, whose feed ledger carries the frozen budget and reaches its exhaustion. Rejecting half is carried on a planted telemetry fixture, recorded as a SUBSTITUTION: tests/runner.py writes the budget field from the corpus it fed and the submission never touches it, so no submission can reach this checker, the isolation boundary holds, and the rejecting half plants a budget this bundle never froze directly on the handle."

  - id: bound_evaluation_point_reached
    statement: "The harness fed at least the frozen token budget and produced an evaluation record at the bound point, so a loss was established rather than abandoned."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_bound_evaluation_point_reached
    zero_reason: early-stop-before-bound-evaluation
    required: true
    weight: 1
    live_state_read: "/logs/harness/feed.json tokens_fed and batch_count, and /logs/harness/eval.json bound_point_reached and the bound record's batch_index, all written by tests/runner.py in the verifier's process"
    compiled_test: "tests/test_output.py::test_bound_evaluation_point_reached"
    drift_keys: []
    adequacy: "both halves fired by real fixtures: the reference plan accepts, the early-stop plan rejects"

  - id: token_budget_respected_as_fed
    statement: "The tokens the harness fed, summed from its own per-batch ledger and denominated in the frozen unit, do not exceed the frozen token budget."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_token_budget_respected_as_fed
    zero_reason: token-budget-overspent
    required: true
    weight: 1
    live_state_read: "/logs/harness/feed.json batches[].tokens, tokens_fed, budget, budget_unit and declared_budget_unit, written by tests/runner.py as it fed"
    compiled_test: "tests/test_output.py::test_token_budget_respected_as_fed"
    drift_keys: [budget_unit]
    adequacy: "both halves fired by real fixtures: the reference plan accepts, an overspending plan rejects, and a pool whose declared budget unit has drifted to documents rejects"

  - id: evaluation_split_untrained
    statement: "No document the harness fed carries the bytes of an evaluation-split document."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_evaluation_split_untrained
    zero_reason: evaluation-split-leaked
    required: true
    weight: 1
    live_state_read: "/logs/harness/feed.json documents_touched, the content digest of every document the harness actually fed, against /logs/harness/eval.json heldout_digests, which the verifier derived from its own frozen split"
    compiled_test: "tests/test_output.py::test_evaluation_split_untrained"
    drift_keys: [documents_touched]
    adequacy: "both halves fired by real fixtures: the reference plan on the clean pool accepts, and the same plan on the pool after the silent shard refresh rejects"

  - id: pool_state_matches_graded_pool
    statement: "The filter the pool declares is the filter that actually held, and the pool digest the harness fed from is the pool digest the verdict is about."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_pool_state_matches_graded_pool
    zero_reason: pool-state-diverged-from-graded-verdict
    required: true
    weight: 1
    live_state_read: "/logs/harness/feed.json filter_declared and filter_effective, which tests/runner.py derived by testing the declared filter against the pool it indexed rather than by applying it, plus pool_digest against graded_pool_digest"
    compiled_test: "tests/test_output.py::test_pool_state_matches_graded_pool"
    drift_keys: [filter_declared, filter_effective]
    adequacy: "both halves fired by real fixtures: the clean pool accepts, and a pool declaring heldout-shard-drop while still carrying held-out-seeded documents rejects"

  - id: graded_weights_are_harness_owned
    statement: "The count table every graded record was evaluated against is the one the harness accumulated from its own feed ledger, not a checkpoint the submission selected."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_weights_are_harness_owned
    zero_reason: weights-not-harness-owned
    required: true
    weight: 1
    live_state_read: "/logs/harness/model.json counts, tokens, batch_index, counts_digest, derived_from_feed_digest and provenance, recomputed against /logs/harness/feed.json batches and against every /logs/harness/eval.json record's counts_digest"
    compiled_test: "tests/test_output.py::test_graded_weights_are_harness_owned"
    drift_keys: []
    adequacy: "accepting half fired by the reference plan. Rejecting half is carried on a planted telemetry fixture, recorded as a SUBSTITUTION: no submission can reach this checker, because the submission never touches the weights, so the isolation boundary holds and the rejecting half plants a substituted count table directly on the handle."

  - id: graded_loss_recomputed_unsmoothed
    statement: "The graded validation loss on every record is this process's own unsmoothed recomputation from the harness-owned weights, and the graded readout declares no smoothing."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_loss_recomputed_unsmoothed
    zero_reason: readout-smoothed
    required: true
    weight: 1
    live_state_read: "/logs/harness/eval.json declared_smoothing, declared_ema_beta, applied_smoothing and every record's loss, recomputed against /logs/harness/model.json counts and tokens"
    compiled_test: "tests/test_output.py::test_graded_loss_recomputed_unsmoothed"
    drift_keys: [applied_smoothing]
    adequacy: "both halves fired by real fixtures: the reference plan on the frozen readout contract accepts, and the same plan after the graded readout declares an EMA rejects"

  - id: feed_precedes_every_graded_evaluation
    statement: "The feed ledger is a monotone batch sequence and no evaluation is recorded at a batch index the feed never reached."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_feed_precedes_every_graded_evaluation
    zero_reason: evaluation-precedes-its-feed
    required: true
    weight: 1
    live_state_read: "/logs/harness/feed.json batches[].index in sequence, against every /logs/harness/eval.json record's batch_index"
    compiled_test: "tests/test_output.py::test_feed_precedes_every_graded_evaluation"
    drift_keys: []
    adequacy: "accepting half fired by the reference plan. Rejecting half is carried on a planted telemetry fixture, recorded as a SUBSTITUTION: the verifier's own executor emits the ledger, so a submission cannot fabricate an evaluation record and the isolation boundary holds."

  - id: loss_sustained_across_verifier_folds
    statement: "On every confirmation fold the verifier schedules, the run's loss is no worse than the constant-weight optimum's loss on that same fold, so a whole-split gain bought by trading one fold against the other is not counted as a gain."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_loss_sustained_across_verifier_folds
    zero_reason: loss-not-sustained-across-folds
    required: true
    weight: 1
    live_state_read: "/logs/harness/eval.json records for fold_a and fold_b against calibration.default_simplex_optimum's per-fold losses, both recomputed by tests/runner.py from the frozen split"
    compiled_test: "tests/test_output.py::test_loss_sustained_across_verifier_folds"
    drift_keys: []
    adequacy: "both halves fired by real fixtures: the reference plan accepts, and a fold-trading plan whose whole-split loss improves while fold_a degrades rejects"

  - id: mixture_beats_default_simplex_optimum
    statement: "The recomputed validation loss is strictly below the optimum reachable by the constant-weight-per-source template the environment hands the agent."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_mixture_beats_default_simplex_optimum
    zero_reason: mixture-no-better-than-default-simplex-optimum
    required: false
    weight: 1
    live_state_read: "/logs/harness/eval.json bound record loss against calibration.default_simplex_optimum.full, the loss of a concrete constant-mode plan tests/runner.py constructed and fed through its own executor"
    compiled_test: "tests/test_output.py::test_mixture_beats_default_simplex_optimum"
    drift_keys: []
    adequacy: "both halves fired by real fixtures: the reference plan accepts, and the verifier's own optimal constant-weight plan rejects with reward exactly 0.0"
