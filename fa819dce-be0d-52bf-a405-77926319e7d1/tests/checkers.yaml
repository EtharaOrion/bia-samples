schema: forge.checkers/v1

# MEASURED CORRECTION carried from wave-1: the live seed/forge/verifier.py binds the reward
# carrier to reward.txt, not reward.json. The bare float goes to /logs/verifier/reward.txt and
# the machine-readable reason and metric block go to /logs/verifier/score.json. Both are
# written from the same trap in tests/test.sh, so the instrument's binding and the reason
# carrier can never disagree.

reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py walks checkers.CHECKERS in manifest order and every declared checker is
    required. A single failing checker resolves the reward to 0.0 carrying that checker's own
    zero_reason, which is exactly what required_pass names. The mode describes the GATE, and
    the gate is not the whole reward: once every required checker passes, grade.py scales the
    result by the continuous normalised margin, so the reward is one float on [0.0, 1.0] and
    is never binary. required_pass is declared here because it is the reduction that decides
    whether a reward exists at all, and because a required_pass over a set with no required
    criterion would be a universal quantifier over the empty set; nine of nine are required.

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  note: >-
    seed/contract.yaml families.entries.F12 is unscoped and carries no published baseline or
    target, so the reward schema is bound in full and the numbers are declared absent rather
    than invented. The continuous term is normalised between control_loss and reference_loss,
    both measured by the harness inside the same run and neither of them a family anchor.

readout_binding:
  graded_quantity: the validation loss the verifier computes on the frozen held-out split
  computed_by: the verifier's own process, from harness-owned weights, at the bound evaluation point
  smoothing_on_graded_path: false
  never_from:
    - a number the training loop reported
    - a number in the submission's stdout
    - a field the submission wrote

checker_adequacy:
  both_halves: required for every checker
  substitutions: []
  substitutions_note: >-
    No checker required a planted-fixture substitution for its rejecting half. Every checker
    reads a harness telemetry record that a defective run genuinely moves, so the accepting and
    the rejecting halves are both fired from run-shaped fixtures under seed/tasks/OER-09/adequacy.py.

checkers:
  # Declared in the graded order tests/checkers.py CHECKERS walks. The DIVERGENCE row
  # is first so a run whose pool never moved is attributed to silent-filter-no-op
  # rather than to a downstream consequence of the same no-op.
  - id: filter_claim_matches_observed_pool
    statement: "The pool state the curation filter claims to have produced agrees with the pool state the harness observed the trainer consuming; a filter that exits zero over a pool it never moved is caught rather than trusted."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_filter_claim_matches_observed_pool
    zero_reason: silent-filter-no-op
    required: true
    weight: 4
    live_state_read: "/logs/harness/curation_claim.json, the harness's verbatim capture of the submission's report, compared against /logs/harness/pool_observed.json and the harness verdict in /logs/harness/curation_ledger.json"
    compiled_test: "tests/test_output.py::test_filter_claim_matches_observed_pool"

  - id: curated_pool_consumed_by_trainer
    statement: "The document stream the trainer consumed is the curated pool the harness observed, it differs from the source pool, and it was resolved under the register schema and quality field the harness observed."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_curated_pool_consumed_by_trainer
    zero_reason: curated-pool-not-consumed
    required: true
    weight: 3
    live_state_read: "/logs/harness/feed_ledger.json stream_digest, resolved_register_schema and resolved_quality_field, against /logs/harness/pool_observed.json digests and /logs/harness/register.json schema"
    compiled_test: "tests/test_output.py::test_curated_pool_consumed_by_trainer"

  - id: curation_precedes_first_feed
    statement: "The harness observed the register, then the pool, then curation completed, and only then was the first training token fed; the four sequence stamps are strictly ascending."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_curation_precedes_first_feed
    zero_reason: curation-after-feed-start
    required: true
    weight: 2
    live_state_read: "/logs/harness/register.json observed_at_seq, /logs/harness/pool_observed.json observed_at_seq, /logs/harness/curation_ledger.json completed_at_seq and /logs/harness/feed_ledger.json first_feed_seq"
    compiled_test: "tests/test_output.py::test_curation_precedes_first_feed"
  - id: token_budget_respected_as_fed
    statement: "The frozen token budget was respected as fed: a positive number of tokens was fed, the budget in force was the frozen budget, and no more than that budget reached the trainer."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_token_budget_respected_as_fed
    zero_reason: token-budget-overspent
    required: true
    weight: 3
    live_state_read: "/logs/harness/feed_ledger.json tokens_fed, budget_tokens and frozen_budget_tokens, written by the harness as it fed"
    compiled_test: "tests/test_output.py::test_token_budget_respected_as_fed"

  - id: eval_split_never_trained_on
    statement: "No held-out document appears in the fed training stream, and the leak audit that says so was performed by the harness against the split identity and digest currently bound over a positive number of documents."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_eval_split_never_trained_on
    zero_reason: eval-split-leaked
    required: true
    weight: 3
    live_state_read: "/logs/harness/split_audit.json audited_by, audited_documents, audited_split_id, audited_split_digest, eval_split_id, eval_split_digest and train_eval_overlap"
    compiled_test: "tests/test_output.py::test_eval_split_never_trained_on"

  - id: graded_weights_harness_owned
    statement: "The weights evaluated at the bound point are the weights the run produced and the harness ledgered, not a checkpoint the submission selected."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_weights_harness_owned
    zero_reason: weights-not-harness-owned
    required: true
    weight: 3
    live_state_read: "/logs/harness/weights_ledger.json owner, selected_by and ledger, compared against /logs/harness/eval_record.json points[].weights_digest"
    compiled_test: "tests/test_output.py::test_graded_weights_harness_owned"

  - id: graded_loss_unsmoothed
    statement: "The graded validation loss is the verifier's own raw recomputation on the frozen held-out split at the bound evaluation point, carrying no smoothing of any kind."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_loss_unsmoothed
    zero_reason: graded-loss-smoothed
    required: true
    weight: 3
    live_state_read: "/logs/harness/eval_record.json, the evaluation record the verifier's own process wrote: source, readout_mode, computed_on, bound_point, points[].loss and points[].smoothed"
    compiled_test: "tests/test_output.py::test_graded_loss_unsmoothed"

  - id: improvement_sustained_across_points
    statement: "The improvement over the harness control holds at the bound evaluation point and at every sustain point the verifier itself scheduled, so a single favourable evaluation cannot be harvested."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_improvement_sustained_across_points
    zero_reason: improvement-not-sustained
    required: true
    weight: 3
    live_state_read: "/logs/harness/eval_record.json control_loss, bound_point, sustain_points and every points[] row the verifier recorded"
    compiled_test: "tests/test_output.py::test_improvement_sustained_across_points"

  - id: early_stop_does_not_establish_loss
    statement: "The run completed the verifier's evaluation schedule; a halt on a favourable evaluation before the last scheduled point is graded as not having established the loss, with a reason, rather than as an absent result."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_early_stop_does_not_establish_loss
    zero_reason: early-stop-loss-not-established
    required: true
    weight: 3
    live_state_read: "/logs/harness/run_ledger.json halt_reason and terminated_at_point, against /logs/harness/eval_record.json last_scheduled_point and the recorded points"
    compiled_test: "tests/test_output.py::test_early_stop_does_not_establish_loss"

