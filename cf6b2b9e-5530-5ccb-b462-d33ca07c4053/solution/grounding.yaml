schema: forge.grounding/v1
slot: OER-22
provisional_identifier: OER-22
family: F9
family_title: post-training quantization
primary_archetype: AR9
primary_archetype_title: Temporal Reasoning Gap
archetype_exclusivity: >-
  Exactly one primary archetype, fixed at scope time. No second archetype is
  claimed anywhere in this bundle and no lever from another archetype is authored.
title: Calibration set drift between allocation and evaluation

# ---------------------------------------------------------------------------
# This file is the SINGLE derivation source for this slot. solution/recompute.py
# derives every generated artifact from these bytes alone. It invokes no model,
# no network, no clock, no locale and no random source.
# ---------------------------------------------------------------------------

metric:
  name: perplexity degradation at a fixed bit budget
  direction: lower
  definition: >-
    The graded quantity is ppl(quantized) minus ppl(unquantized reference),
    measured over the frozen held-out evaluation corpus, averaged over every
    evaluation point the verifier schedules. The verifier computes it from the
    pristine substrate under the submitted allocation. It is never a number the
    submission reported and never a field the submission wrote.
  units: perplexity points

frozen:
  - the model, being environment/substrate.json
  - the bit budget, being substrate.budget_bits
  - the evaluation corpus, being the held-out payload the verifier owns
  - the unquantized reference, being environment/reference_model.json
free:
  - the per-tensor bit allocation
  - the quantization scheme, being the group size and the scale width policy

anchors:
  anchors_state: absent
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric_bound: false
  target_metric_bound: false
  reason: >-
    seed/contract.yaml records family F9 with scope_state unscoped and
    baseline_metric, target_metric and pass_threshold all null, citing
    requirements/bia-environment-spec.md line 63, which leaves every family other
    than F1 with an unresolved baseline. The reward SCHEMA is bound in full below.
    No baseline_metric and no target_metric number is invented here.
  reward_schema:
    carrier: /logs/verifier/reward.txt
    score_document: /logs/verifier/score.json
    type: single float on the closed interval 0.0 to 1.0
    direction: higher is better
    binary: false
    full_reward: 1.0
    formula_lower_is_better: raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)
    clip: score = min(max(raw, 0.0), 1.0)
    target_is_a_bar: reaching the target scores exactly 1.0 and beating it also scores 1.0

# The two numbers the reward formula is instantiated against in THIS bundle are
# substrate-internal scale points, not family anchors. They are recomputed by the
# verifier from frozen bytes on every run and are declared under
# gap-oer-22-reward-scale-points-are-substrate-internal.
scale_points:
  baseline_scale_point:
    derivation: >-
      The mean, over every scheduled evaluation point, of the degradation of the
      uniform allocation that assigns substrate.uniform_reference_bits to every
      tensor. That allocation exactly saturates the bit budget under the accounting
      in force, so it is the allocation a submission gets for spending the budget
      without reasoning about it.
    is_a_family_anchor: false
  target_scale_point:
    derivation: >-
      The mean, over every scheduled evaluation point, of the degradation of the
      allocation the reference procedure derives against the calibration version in
      force at the graded evaluation.
    is_a_family_anchor: false
  substitution_disclosure: >-
    These scale points make the bound reward formula computable over this
    substrate. They are NOT published evidence, they do not close
    gap-oer-per-family-anchors-unmeasured, and they must not be read as a
    baseline_metric or a target_metric for family F9.

# ---------------------------------------------------------------------------
# The deterministic surrogate substrate.
# ---------------------------------------------------------------------------
substrate:
  kind: deterministic-surrogate
  surrogate_disclosure: >-
    There is no live forward pass in this bundle. Perplexity degradation is a
    closed-form deterministic function of the per-tensor bit allocation and a
    frozen per-tensor sensitivity vector, evaluated in double precision with pure
    Python arithmetic. Declared as gap-oer-22-substrate-is-a-deterministic-surrogate.
  degradation_form: >-
    degradation(alloc, s) = K * sum_i s_i * numel_i * 2 ** (-2 * alloc_i) / sum_i numel_i
  degradation_constant_K: 100.0
  bit_min: 2
  bit_max: 8
  uniform_reference_bits: 4
  group_size: 128
  scale_bits: 16
  round_decimals: 9
  tensors:
    - {id: blk00.attn.qkv, numel: 12288}
    - {id: blk00.attn.out, numel: 4096}
    - {id: blk00.mlp.up, numel: 16384}
    - {id: blk00.mlp.down, numel: 4096}
    - {id: blk01.attn.qkv, numel: 8192}
    - {id: blk01.attn.out, numel: 6144}
    - {id: blk01.mlp.up, numel: 10240}
    - {id: blk01.mlp.down, numel: 12288}
    - {id: blk02.attn.qkv, numel: 4096}
    - {id: blk02.attn.out, numel: 16384}
    - {id: blk02.mlp.up, numel: 8192}
    - {id: blk02.mlp.down, numel: 6144}
  reference_perplexity: 12.75

# The frozen held-out evaluation corpus. The verifier owns this payload. It is
# never assembled onto the non-oracle agent surface.
evaluation_corpus:
  base_sensitivity: [0.90, 0.15, 0.60, 0.08, 1.30, 0.22, 0.45, 0.95, 0.12, 0.70, 1.60, 0.30]
  shards:
    - id: shard-a
      tokens: 262144
      multiplier: [1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00]
    - id: shard-b
      tokens: 262144
      multiplier: [1.10, 0.95, 1.05, 3.00, 0.90, 1.10, 1.00, 0.95, 3.00, 1.10, 0.90, 1.00]
    - id: shard-c
      tokens: 262144
      multiplier: [0.90, 1.10, 0.95, 6.00, 1.15, 0.95, 1.10, 1.05, 6.00, 0.90, 1.15, 1.00]
    - id: shard-d
      tokens: 262144
      multiplier: [1.05, 1.05, 1.10, 9.00, 1.00, 1.05, 0.95, 1.10, 9.00, 1.00, 1.05, 1.05]

# The calibration set, versioned. This is the axis the archetype lives on.
calibration:
  handle: environment/calibration_probe.py
  handle_contract: >-
    The probe is the first-class way to ask the calibration set what version it is
    at. It prints the version in force, the harness tick that version was issued
    at, and the sha256 over the canonical bytes of that version's sensitivity
    vector. Temporal ordering is carried by the harness tick, which is a
    monotonically issued integer handle. No clock is read anywhere on the graded
    path or in the probe.
  versions:
    - version: 1
      tick: 1
      label: pre-drift calibration set, the set an allocation fitted at iteration three was fitted against
      sensitivity_source: base_sensitivity
    - version: 2
      tick: 7
      label: post-drift calibration set, the set in force at the graded evaluation
      sensitivity_source: mean_over_shards
  in_force_version: 2
  ledger: [1, 2]
  drift_is_silent: >-
    Nothing on the agent-visible audit surface announces the move from version 1 to
    version 2. The agent must re-probe. The move is recorded as the headline silent
    mutation in seed/tasks/OER-22/drift.yaml, bound to checker
    allocation_matches_in_force_calibration and to stale control
    ctl-allocation-frozen-at-calibration-v1.

# The verifier-scheduled evaluation protocol, in force at the graded evaluation.
evaluation_protocol:
  scheduled_points: [shard-a, shard-b, shard-c, shard-d]
  bar_derivation: >-
    Per evaluation point, the bar is the degradation of the uniform reference
    allocation at that same point. The bar must hold at every scheduled point, so a
    single favourable point is not a result.
  pre_drift_scheduled_points: [shard-a, shard-b]

accounting:
  includes_scale_tensors: true
  pre_drift_includes_scale_tensors: false
  formula: >-
    allocated_bits = sum_i numel_i * alloc_i + sum_i groups_i * scale_bits, where
    groups_i = numel_i // group_size.

readout:
  permitted_filters: [none]
  pre_drift_permitted_filters: [none, ema]

