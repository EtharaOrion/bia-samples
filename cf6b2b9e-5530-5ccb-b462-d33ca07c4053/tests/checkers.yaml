schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

# MEASURED CORRECTION, wave-1 lanes OER-01 through OER-04: the live
# seed/forge/verifier.py binds the reward carrier to reward.txt, not reward.json. The
# reward contract path is therefore /logs/verifier/reward.txt carrying the bare float,
# with the machine-readable reason and metric block in the companion score document.
# tests/test.sh writes both from the same EXIT trap, so the instrument's binding and
# the reason carrier can never disagree.
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    Every declared checker is required, and tests/grade.py runs them in the order
    listed below, stopping at the first refusal. That is exactly what required_pass
    reduces to: a universal quantifier over the required set, refusing the moment one
    member refuses, and the set is non-empty so the quantifier is never vacuous. The
    reward carrier is that gate composed with the bound reward formula: a failed
    required checker emits the 0.0 required_pass returns, carrying the failing
    checker's zero_reason, and a fully passing set emits the clipped continuous score
    rather than a bare 1.0, so the carrier is never binary.

# Checker adequacy, per invariant 17: both halves of every checker are exercised
# against the LIVE checkers by seed/tasks/OER-22/adequacy.py and by
# tests/test_output.py. Every checker's rejecting half is fired by a real submission
# payload, so NO substitution was needed for any checker in this slot and none is
# recorded. The accepting half for all eight is the reference fixture, whose reference
# module bytes are sha256-bound into tests/fixtures.json.
adequacy:
  substitutions: none
  accepting_half: tests/fixtures.json case reference-accepted
  reference_bytes_bound: tests/fixtures.json reference_module_sha256 over solution/reference.py
  surrogate_scale_sensitivity_probe: >-
    surrogate_scale_witness_matches_live_substrate fires its rejecting half three ways,
    because the constant it grades is a round number a run could plausibly guess without
    ever reading the environment. ctl-surrogate-scale-witness-near-miss is the near miss:
    every other field is byte-identical to the accepted submission and only the constant
    is displaced by near_miss_constant_delta, which moves the probe value at the fourth
    decimal place. ctl-surrogate-scale-constant-guessed-unit takes the constant as unity,
    which is what the bare degradation form gives a run that never opened the substrate.
    ctl-surrogate-scale-witness-absent omits the field entirely. All three are refused,
    and tests/test_output.py::test_surrogate_scale_probe_is_sensitive_to_the_constant
    asserts the three digests are pairwise distinct from the accepted one, so the checker
    is proven sensitive to the constant rather than merely present.

# NO CLOCK IS READ by any checker. Temporal ordering in this slot is carried entirely
# by harness-owned calibration-version handles and their issued integer ticks.
temporal_ordering_carrier: harness calibration version and issued_at_tick, both integer handles
clock_read_anywhere: false

checkers:
  - id: allocation_well_formed_over_every_tensor
    statement: "The submission carries exactly one admissible integer bit width for every tensor in the frozen substrate, with no default filling an absent entry."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_allocation_well_formed_over_every_tensor
    zero_reason: allocation-malformed
    required: true
    weight: 1
    live_state_read: "the verifier's pristine environment/substrate.json tensor register, read in tests/grade.py build_telemetry, against the inert allocation mapping runner.py carried back"
    compiled_test: "tests/test_output.py::test_allocation_well_formed_over_every_tensor"

  - id: frozen_corpus_and_reference_unmodified
    statement: "No modification of the evaluation corpus or of the unquantized reference is present: every frozen artifact digests identically in the verifier's pristine copy and on the run surface, and the held-out evaluation payload has no run copy at all."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_frozen_corpus_and_reference_unmodified
    zero_reason: frozen-artifact-modified
    required: true
    weight: 1
    live_state_read: "sha256 over the verifier's pristine environment/ artifacts against sha256 over the same paths on the run workspace, both taken in tests/grade.py build_telemetry"
    compiled_test: "tests/test_output.py::test_frozen_corpus_and_reference_unmodified"

  - id: bit_budget_respected_as_allocated
    statement: "The fixed bit budget was respected as actually allocated: harness accounting over the quantized tensors, including the per-group scale tensors under the accounting in force, does not exceed the frozen budget."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_bit_budget_respected_as_allocated
    zero_reason: bit-budget-overspent
    required: true
    weight: 1
    live_state_read: "tests/grade.py _allocated_bits summed over the quantized tensor state the verifier itself produced, against budget_bits in the verifier-owned tests/scale_points.json"
    compiled_test: "tests/test_output.py::test_bit_budget_respected_as_allocated"

  - id: calibration_probe_ledger_ordered
    statement: "The calibration versions the run observed form a strictly ascending subsequence of the harness calibration ledger and terminate at the version in force at the graded evaluation, so no observation is carried forward as if it were timeless."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_calibration_probe_ledger_ordered
    zero_reason: calibration-version-sequence-disordered
    required: true
    weight: 1
    live_state_read: "the harness ledger and calibration_version_in_force in the verifier's pristine environment/calibration_state.json, against the observed_calibration_ledger the submission recorded through environment/calibration_probe.py"
    compiled_test: "tests/test_output.py::test_calibration_probe_ledger_ordered"

  - id: allocation_matches_in_force_calibration
    statement: "The calibration version the allocation was derived against is the version in force at the graded evaluation, proven on the bytes: the submitted fit witness equals the verifier's digest of the in-force sensitivity vector."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_allocation_matches_in_force_calibration
    zero_reason: allocation-derived-against-stale-calibration
    required: true
    weight: 1
    live_state_read: "calibration_version_in_force and the per-version sensitivity digests the verifier computed from its pristine environment/calibration_stats.json, against the submitted derived_against_calibration_version and calibration_fit_witness"
    compiled_test: "tests/test_output.py::test_allocation_matches_in_force_calibration"

  - id: surrogate_scale_witness_matches_live_substrate
    statement: "The surrogate scale the submission fitted under is the one live substrate state declares: the submitted surrogate_scale_witness equals the verifier's digest over the probe it replayed from its own pristine environment/substrate.json degradation constant against the in-force calibration sensitivity vector."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_surrogate_scale_witness_matches_live_substrate
    zero_reason: surrogate-scale-constant-not-established
    required: true
    weight: 1
    live_state_read: "degradation_constant_K and uniform_reference_bits in the verifier's pristine environment/substrate.json, and the in-force sensitivity vector in the verifier's pristine environment/calibration_stats.json, replayed through tests/grade.py _degradation and _surrogate_scale_witness in build_telemetry, against the submitted surrogate_scale_witness"
    compiled_test: "tests/test_output.py::test_surrogate_scale_witness_matches_live_substrate"
    discovery_value: "degradation_constant_K, established only in built environment state and absent from every agent-visible byte; the digest is reproducible only by a run that read it back from that state"

  - id: graded_degradation_is_verifier_recomputed
    statement: "The graded perplexity degradation is the verifier's own unsmoothed recomputation over the frozen evaluation corpus from harness-owned quantized state, and the declared readout filter is inside the registry in force, so a smoothed or blended readout is refused rather than accepted."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_degradation_is_verifier_recomputed
    zero_reason: readout-smoothed
    required: true
    weight: 1
    live_state_read: "the graded_source provenance tag tests/grade.py stamps onto the number it computed itself, plus permitted_readout_filters from the verifier-owned tests/scale_points.json against the submitted readout.filter"
    compiled_test: "tests/test_output.py::test_graded_degradation_is_verifier_recomputed"

  - id: early_stop_does_not_establish_metric
    statement: "A run that halted at a favourable evaluation point without completing the verifier-scheduled protocol is graded as not having established the metric, scoring zero with a reason rather than reading as an absent result."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_early_stop_does_not_establish_metric
    zero_reason: early-stop-metric-not-established
    required: true
    weight: 1
    live_state_read: "the scheduled_points list the verifier owns in tests/scale_points.json against the submitted protocol.points_completed and protocol.halted_early"
    compiled_test: "tests/test_output.py::test_early_stop_does_not_establish_metric"

  - id: degradation_sustained_across_scheduled_points
    statement: "The reading is sustained: the verifier's recomputed degradation holds at or below the bar at EVERY evaluation point the verifier schedules, so a single favourable point is not a result."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_degradation_sustained_across_scheduled_points
    zero_reason: degradation-not-sustained
    required: true
    weight: 1
    live_state_read: "the per-point degradations tests/grade.py computed from the held-out tests/eval_corpus.json under the submitted allocation, against the per_point_bar the verifier owns in tests/scale_points.json"
    compiled_test: "tests/test_output.py::test_degradation_sustained_across_scheduled_points"
