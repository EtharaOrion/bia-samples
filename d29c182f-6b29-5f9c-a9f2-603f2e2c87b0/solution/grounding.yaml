schema: forge.grounding/v1
slot: OER-27
provisional_identifier: OER-27
note: >-
  This file is the single private derivation source for the slot. `solution/recompute.py`
  derives every generated artifact from these bytes alone: the frozen corpus, the frozen index
  specification, `tests/bound.json`, `tests/test_output.py`, `tests/rubrics.jsonl`,
  `solution/rubrics.json`, `solution/solve.sh`, `solution/TRUTH.md` and the rejecting fixtures.
  Nothing here is a model output, a network fetch, a clock reading, a locale-dependent
  rendering or a draw from a random source. Running `recompute.py` twice over frozen bytes
  produces byte-identical output, and `recompute.py --check` reports drift without writing.

identity:
  family: F4
  family_title: lossless compression
  primary_archetype: near-duplicate-adjudication
  primary_archetype_title: Near-Duplicate Adjudication
  archetype_count: 1
  archetype_rule: >-
    Exactly one primary archetype. Near-duplicate adjudication is the whole pressure of this
    slot and no second archetype is claimed, borrowed or composed in.
  title: Near-duplicate adjudication of a compression corpus at an index-calibrated threshold
  tags: [optimization, bounded-continuous]
  target_tier: T3
  tier_exemption_granted: none

family_binding:
  registered_frozen: the corpus
  registered_free: the compressor
  what_this_slot_does: >-
    F4 is lossless compression and its frozen axis is the corpus. This slot sits on the
    redundancy-adjudication stage that precedes compression: before a corpus can be folded,
    the near-duplicate relation over its records has to be adjudicated, and the adjudication
    has to be defensible rather than asserted. The corpus stays frozen exactly as the family
    register requires, and what the solver produces is the adjudication over it.

discovery_block:
  statement: >-
    Two values are established in the BUILT index and in nothing else. Neither appears in
    instruction.md, in task.toml, in environment/corpus.jsonl, in environment/index_spec.json
    or in any other agent-visible byte. Both come into existence only when the index is built
    over the frozen corpus, and both are read back through the harness handle in
    tests/checkers.py.
  values:
    - id: adjudication_threshold
      what: >-
        The integer similarity level, on the quantum grid the index specification fixes, at
        which the built index calibrates the near-duplicate boundary. It is the maximum
        between-class variance split of the candidate similarity histogram the index's own
        band structure produced, so it exists only after an index exists.
      established_by: environment/nd_index.py otsu_threshold, over the built index's candidate histogram
      read_back_through: Harness.calibration()["adjudication_threshold"]
      graded_by: [adjudication_threshold_established, no_unsupported_pair, collision_witness_verified]
    - id: collision_witness_pair
      what: >-
        The unique record pair that the built index collides and the adjudication rejects,
        with the highest similarity among all such pairs. It is the boundary evidence: the
        closest thing the index proposed that the adjudication had to refuse.
      established_by: the built index's band collisions, adjudicated at the calibrated threshold
      read_back_through: Harness.collisions() together with Harness.calibration()
      graded_by: [collision_witness_verified]
  statement_closure: >-
    instruction.md fixes what adjudication means, by defining normalisation, shingling and the
    quantised exact Jaccard similarity in full, and fixes what a collision is, by defining the
    band structure of the index. It names no threshold and no witness pair. The graded outcome
    therefore cannot fall out of the statement.

metric:
  name: near-duplicate recall against the verifier's own adjudication, under a hard precision gate
  direction: higher
  gate_semantics: >-
    Precision is a HARD CONSTRAINT, never a soft penalty. A submission that asserts a pair the
    verifier's own adjudication does not support scores exactly 0.0 with the machine-readable
    reason `adjudication-unsupported`, whatever its recall. Padding the answer is therefore
    strictly worse than leaving it short, which is what makes the reward a measure of
    adjudication rather than of coverage.
  frozen_axes:
    - the corpus, environment/corpus.jsonl
    - the index specification, environment/index_spec.json
    - the index construction, environment/nd_index.py
    - the similarity definition, exact quantised Jaccard over shingle sets
  free_axes:
    - the adjudication the solver submits over the corpus
  computed_by: >-
    the verifier, from an index it rebuilds itself in an isolated subprocess over the bundle's
    frozen corpus, never from an index or a number the submission supplied

clock_ownership:
  owner: harness
  statement: >-
    THE HARNESS OWNS THE CLOCK. Nothing on the graded path is a timing quantity, and no
    checker calls time, datetime, perf_counter or monotonic, directly or transitively.
    tests/runner.py launches environment/nd_index.py over the bundle's frozen corpus in an
    isolated subprocess and every checker reads the resulting index telemetry through the
    tests/checkers.py Harness handle.
  absolute_clock_ban: >-
    recompute.py reads no clock either. Every generated artifact is derived by arithmetic
    from these bytes.

substrate:
  kind: deterministic arithmetic index over a frozen synthetic corpus
  module: environment/nd_index.py
  declared_gap: gap-oer-27-corpus-is-synthetic-not-enwik
  why_right_choice: >-
    A synthetic corpus makes the adjudication checkable: the verifier can rebuild the index
    and recompute every similarity exactly, so a verdict is recomputable by an outside reader
    on any host without shipping a benchmark corpus. It is never allowed to pass as a
    measurement on enwik8 or enwik9.

corpus:
  schema: oer27.corpus/v1
  record_count: 512
  seed: 20260831
  generator: >-
    A fixed 64-bit linear congruential recurrence x <- (6364136223846793005 * x +
    1442695040888963407) mod 2**64, seeded from the constant above. This is arithmetic, not a
    random source: the sequence is fully determined by the seed and no module named `random`
    is imported.
  vocabulary:
    word_count: 1400
    onsets: [b, d, f, g, k, l, m, n, p, r, s, t, v, z, br, dr, fl, gr, kl, pr, sl, st, tr, vr]
    nuclei: [a, e, i, o, u, ae, ai, ea, ei, ia, io, oa, ou, ue]
    codas: ['', n, r, s, l, m, k, t, nd, rt, st, ng, ll, sh]
  document_length: {base: 38, modulus: 27}
  slice_width: 46
  function_words: [the, of, and, to, in, a, is, that, for, on, with, as, by, at, from, this]
  function_word_rate: {numerator: 3, denominator: 11}
  families:
    pair_families: 96
    triple_families: 40
    quad_families: 16
    singletons: 136
    note: >-
      A family is one root document and its variants. Every family member is the root with a
      per-member token substitution rate applied, so intra-family pair similarity spreads
      across a continuum rather than into two separated humps. There is deliberately NO empty
      corridor in the similarity spectrum: the adjudication boundary sits in a dense region,
      so a threshold guessed even slightly wrong changes the adjudicated pair set rather than
      leaving it untouched.
  edit_rate: {numerator_base: 15, numerator_modulus: 150, denominator: 1000}
  casing_noise_rate: {numerator: 2, denominator: 7}
  punctuation_marks: ['.', ',', ';', ':', ' -- ', ' ']

index_spec:
  schema: oer27.index_spec/v1
  shingle_order: 3
  similarity_quantum: 1024
  signature_length: 96
  bands: 16
  rows_per_band: 6
  permutation_seed_source: the first 16 hex digits of the sha256 of environment/corpus.jsonl
  why_these_bands: >-
    Sixteen bands of six rows put the band structure's detection curve deliberately
    across the calibrated boundary rather than safely below it. The index therefore both
    misses genuine near-duplicates, so a solver that adjudicates only the index's candidate
    pairs loses recall, and proposes pairs the adjudication refuses, so a boundary witness
    exists at all. Both properties are load-bearing and both are measured by recompute.py
    rather than asserted here.

adjudication:
  definition: >-
    A record pair (a, b) with a < b in record identifier order is a near-duplicate pair
    exactly when the exact quantised Jaccard similarity of the two records' shingle sets is
    greater than or equal to the adjudication threshold the built index calibrated. The
    similarity is EXACT: it is computed from the shingle sets, never from a minhash estimate.
  universe: >-
    Every unordered pair of distinct records in the corpus. The index's candidate pairs are a
    filter over which pairs are worth looking at and are NOT the universe of adjudication.
  collision_definition: >-
    Two distinct records collide when the built index assigns them the same band key in at
    least one band.
  witness_definition: >-
    The collision witness is the unique colliding pair whose similarity is strictly below the
    adjudication threshold and is maximal among all such pairs.

shards:
  count: 4
  rule: >-
    The verifier partitions the corpus into four contiguous shards of ninety-six records by
    record position, and assigns each adjudicated pair to the shard of its first member. The
    recall has to hold inside every shard, so an adjudication carried by one region of the
    corpus collapses instead of being reported.
  sustain_numerator: 2
  sustain_denominator: 5

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  family_baseline_metric: null
  family_target_metric: null
  statement: >-
    F4 anchors are unmeasured. seed/contract.yaml records F4 with scope_state `unscoped` and
    no baseline, target, pass threshold or instance count. The reward SCHEMA is bound in full
    below and the family anchors are declared absent. No family baseline_metric or
    target_metric number is invented here.
  instance_local_anchors:
    what_they_are: >-
      Two numbers measured on this slot's own frozen substrate by recompute.py. They normalise
      the reward for THIS instance, they are NOT the family anchors, they are NOT a substitute
      for them, and they do NOT close gap-oer-per-family-anchors-unmeasured.
    declared_gap: gap-oer-27-instance-local-anchors-not-family-anchors
    baseline_strategy: >-
      Adjudicate the index's candidate pairs only, at the calibrated threshold. This is the
      strategy that treats the index's own proposals as the universe of adjudication. It is
      the honest shallow answer: it holds precision, it names the threshold correctly, and it
      loses exactly the near-duplicates the band structure failed to propose.
    target_strategy: >-
      Adjudicate every unordered pair of distinct records in the corpus at the calibrated
      threshold. Recall 1.0.

reward:
  carrier_path: /logs/verifier/reward.txt
  carrier_form: one bare float
  score_document_path: /logs/verifier/score.json
  interval: [0.0, 1.0]
  direction: higher is better
  never_binary: true
  full_reward_exactly: 1.0
  formula: raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  bar_not_point: reaching the target scores exactly 1.0 and beating it also scores 1.0
  gate: >-
    Every required checker must pass before the continuous term is computed. The first failing
    required checker sets the reward to 0.0 and writes its own machine-readable reason.

rejecting_fixtures:
  note: >-
    Every fixture below is the reference submission with ONE field changed and no other byte
    moved. Each is frozen under solution/fixtures/rejecting/ and each is exercised by a
    compiled test in tests/test_output.py.
  fixtures:
    - id: threshold_minus_one_step
      moves: adjudication_threshold, down by exactly one representable step of the quantum grid
      expected_reason: threshold-not-established
    - id: threshold_plus_one_step
      moves: adjudication_threshold, up by exactly one representable step of the quantum grid
      expected_reason: threshold-not-established
    - id: threshold_guessed_round
      moves: adjudication_threshold, to a round fraction of the quantum a guesser would reach for
      expected_reason: threshold-not-established
    - id: witness_left_member_swapped
      moves: collision_witness, first member only, to another record the index also collides
      expected_reason: witness-not-colliding
    - id: witness_right_member_swapped
      moves: collision_witness, second member only, to another record the index also collides
      expected_reason: witness-not-colliding
    - id: witness_not_a_collision
      moves: collision_witness, to a pair the index never places in a common band
      expected_reason: witness-not-colliding
    - id: witness_runner_up_collision
      moves: collision_witness, to the refused collision that comes second under the bound ordering
      expected_reason: witness-not-colliding
    - id: every_pair_returned
      moves: near_duplicate_pairs, to the complete pair universe
      expected_reason: adjudication-degenerate
    - id: no_pair_returned
      moves: near_duplicate_pairs, to the empty list
      expected_reason: adjudication-degenerate
    - id: collision_census_inflated
      moves: index_collision_count, up by one
      expected_reason: collision-census-diverges
    - id: candidate_pairs_only
      moves: near_duplicate_pairs, to the index candidate pairs the adjudication accepts
      expected_reason: graded at the instance baseline, reward 0.0

gaps:
  - id: gap-oer-per-family-anchors-unmeasured
    state: inherited from seed/contract.yaml
    effect: F4 baseline_metric and target_metric are absent, not estimated.
  - id: gap-oer-27-instance-local-anchors-not-family-anchors
    state: declared by this lane
    effect: >-
      The two normalisation numbers are measured on this slot's frozen substrate and are not
      family anchors. They do not close gap-oer-per-family-anchors-unmeasured.
  - id: gap-oer-27-corpus-is-synthetic-not-enwik
    state: declared by this lane
    effect: >-
      The corpus is generated by arithmetic and is not enwik8, enwik9 or any other published
      compression corpus. Nothing measured here licenses a claim about compression ratio on a
      published corpus.
  - id: gap-oer-27-uuid-underivable-before-freeze
    state: declared by this lane
    effect: >-
      The bundle's uuid is derived from its own frozen bytes by the orchestrator after this
      lane finishes, so no uuid is written anywhere in this bundle.

solver_egress_divergence:
  bound_here: open
  batch_field_reads: setup-only
  gap_id: gap-oer-solver-egress-ruled-stricter
  what_this_lane_binds: >-
    task.toml binds solver_egress = "setup-only" at the agent surface and verifier egress =
    "denied". The solving sandbox is given open internet egress in practice so the agent can
    fetch its own packages; nothing it installs reaches the graded path, because the graded
    path uses the standard library only. seed/contract.yaml batch.optimization_bindings
    remains unamended by this lane and the divergence is recorded here rather than left silent.
  deny_list_is_not_containment: >-
    The deny-list is not a containment proof. Mirrors, caches and paraphrased write-ups all
    carry a recipe past any deny-list, which is exactly why the deterministic checker and not
    the network policy is the load-bearing control here.

