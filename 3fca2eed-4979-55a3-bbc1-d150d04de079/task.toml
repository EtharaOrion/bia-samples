# OER-12, family F13, parse and tokenize pipeline.
# Provisional identifier is the slot id. No uuid, no content hash, no signature.
#
# schema_version is a TOP-LEVEL scalar and is written above the first table header.
# TOML scopes every key to the most recent header, so an assignment written after a
# header silently becomes that table's key while the file still reads correct.
schema_version = "1.4"

# artifacts is a TOP-LEVEL list for the same reason. Written after [metadata] it
# would become metadata.artifacts, the real list would be empty, Harbor would accept
# it silently, and nothing would be snapshotted before teardown.
artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/app/pipeline.json",
  "/app/parse_ledger.json",
  "/app/feed.txt",
]

[task]
name = "oer-12-ambiguous-partial-parse-states"
version = "1.0.0"
description = "Reduce the validation loss of the trained model by building the parse and tokenize pipeline over the raw corpus, resolving every ambiguous partial parse by a policy the pipeline declares rather than by an accident of implementation."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "parse-pipeline"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
batch = "OER-2026-08-20"
slot = "OER-12"
provisional_identifier = "OER-12"
family = "F13"
family_title = "parse and tokenize pipeline"
title = "Ambiguous partial-parse states that neither fail nor validate"
primary_archetype = "AR7"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."
metric = "validation loss of the trained model"
metric_direction = "lower"
frozen = "the token budget, the model, the optimizer, and the evaluation split"
free = "the parse and tokenize pipeline built over the raw corpus"

# Reward schema. Bound fully even though the anchors are absent.
reward_kind = "single float"
reward_interval = "closed, 0.0 to 1.0"
reward_direction = "higher is better"
reward_binary = false
reward_full = 1.0
reward_formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
reward_target_is_a_bar = "reaching the target scores exactly 1.0 and beating it also scores 1.0"

# Anchors. This family's anchors are UNMEASURED. The schema is bound; the numbers
# are absent and are not invented.
anchors_state = "absent"
anchors_runtime_effect = "With the anchors absent, a live grading run resolves the reward to 0.0 carrying the reason anchors-absent-metric-unanchored. That is an honest absence, not a failed submission, and it is recorded here so nobody reads it as one."

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard by the standing batch-level Perception-axis exemption"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are explicitly distinct and are never
# aliases. max_timeout_hours bounds the refinement loop ACROSS attempts;
# budget_hours bounds ONE attempt, being six hours over fifty attempts, 0.12
# hours or 7.2 minutes.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
budget_margin_note = "carried by name, never recomputed here"
compute_envelope_accelerators = 1

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 131072
gpus = 1
gpu_types = ["H100"]
workdir = "/app"
build_timeout_sec = 3600
# Provisioning egress is public and unrestricted, so no host allowlist is
# expressible here: allowed_hosts is only meaningful under
# network_mode = "allowlist". Denying egress would leave the task unable to
# install.
network_mode = "public"

[agent]
# Solver egress asymmetry. The SOLVING AGENT gets open internet egress inside the
# sandbox so it can fetch its own packages, datasets and models. This is a bound byte,
# never an accident, and the divergence from the stricter batch reading is recorded in
# solution/grounding.yaml under solver_egress_divergence.
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_deny_is_not_containment = "A deny-list is not a containment proof. Mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any deny-list, which is exactly why the deterministic checker and not the network policy is the load-bearing control."
timeout_sec = 432
timeout_sec_note = "0.12 hours, the per-attempt completion bound"
network_mode = "none"

[verifier]
# The VERIFIER keeps the bound network policy. The two surfaces differ by design.
egress = "denied"
network_mode = "none"
timeout_sec = 1800
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
image_definition_path = "tests/"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"

[solution]
entry_point = "solution/solve.sh"
private = true
