schema_version = "1.4"

# schema_version is a TOP-LEVEL scalar and is written above the first table header on purpose.
# TOML scopes every key to the most recent header, so an assignment below [task] would silently
# become task.schema_version and leave the top-level scalar absent while the file still reads
# correct to a human.

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-24-configuration-memory-across-iterations"
version = "1.0.0"
description = "Raise tokens per second under a hard p99 latency objective across a bounded refinement session whose running summary is lossy, so a configuration an earlier iteration already ruled out must be reconstructed rather than assumed remembered."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "serving-throughput", "memory-degradation"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-24"
provisional_identifier = "OER-24"
title = "Configuration memory across iterations under a bound service level objective"
family = "F11"
family_title = "inference serving throughput"
primary_archetype = "AR10"
primary_archetype_title = "Memory Degradation"
archetype_count = 1
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard by the standing batch-level Perception-axis exemption"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.metric]
name = "tokens per second subject to a p99 latency service level objective"
direction = "higher"
slo_kind = "hard constraint"
slo_note = "Exceeding the p99 latency objective scores exactly 0.0 with the machine-readable reason p99-slo-exceeded, no matter how high the throughput. The objective is never a soft penalty."
frozen = ["the model", "the hardware envelope", "the request trace", "the p99 latency service level objective"]
free = ["the serving configuration: batching, scheduling and admission policy"]
computed_by = "the verifier, from harness-owned completion telemetry over the frozen request trace"

[metadata.anchors]
state = "absent"
authority = "This family is unscoped and records no baseline, target, pass threshold or instance count. The reward schema below is bound in full and neither number is invented here."

[metadata.reward]
carrier_path = "/logs/verifier/reward.txt"
carrier_form = "one bare float"
score_document_path = "/logs/verifier/score.json"
interval = [0.0, 1.0]
direction = "higher"
never_binary = true
full_reward_exactly = 1.0
formula = "raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
bar_not_point = "Reaching the target scores exactly 1.0 and beating it also scores 1.0."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are explicitly distinct and are never
# aliases. max_timeout_hours bounds the refinement loop ACROSS attempts;
# budget_hours bounds ONE attempt, being six hours over fifty attempts, 0.12
# hours or 7.2 minutes.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.clock]
owner = "harness"
note = "THE HARNESS OWNS THE CLOCK. environment/serving_sim.py advances a virtual integer-millisecond counter derived arithmetically from the frozen envelope and emits timing telemetry records. Every checker reads those records and never calls a clock. The agent's own timing is ungraded."

[metadata.substrate]
kind = "deterministic discrete-event simulator"
note = "A simulator is the right choice here because it makes grading reproducible. It never passes as a live measurement, and reference_hours therefore covers simulator-time cost only."

[metadata.workspace]
durable_recovery_area = "notes/"
durable_recovery_area_writable = true
lossy_context = "context/summary.json"
harness_record = "logs/iterations.jsonl"
note = "notes/ is a durable, agent-writable directory the refinement loop never compacts. It is a separate writable path and it does not weaken the read-only property of the agent-visible lower layer."

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
pin_kind = "digest"
pin_note = "Pinned by @sha256 and never by a floating tag. Harbor accepts any string and does not itself require a digest, so the digest requirement is this contract's."

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[verifier]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
egress = "denied"
network_mode = "none"
egress_note = "The verifier keeps the bound network policy. A verifier that can reach the network is a verifier whose verdict can be fetched."

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_note = "The solving agent gets open internet egress inside the sandbox so it can fetch its own packages, datasets and models; the verifier surface is denied. The asymmetry is deliberate and bound here rather than accidental. The divergence from the stricter batch reading is recorded in solution/grounding.yaml under solver_egress_divergence."
deny_list_is_not_containment = "The deny-list is not a containment proof. Mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any deny-list, which is why the deterministic checker and not the network policy is the load-bearing control."
network_mode = "none"
