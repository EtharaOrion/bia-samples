# Harbor delivery manifest for slot OER-01, staged under its provisional
# identifier. No canonical_content_hash, no uuid5 and no signature appears in this
# bundle; wave 2 does identity for every slot at once.
#
# schema_version MUST sit above the first table header. TOML scopes every key to
# the most recent header, so an assignment written after [task] silently becomes
# task.schema_version and leaves the top-level scalar absent while the file still
# reads correct to a human.
schema_version = "1.4"

multi_step_reward_strategy = "last"

artifacts = [
  "/workspace/submission/recipe.json",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/score.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
]

[task]
name = "bia/optimizer-recipe-displacement"
version = "1.0.0"
description = """
Reach the target validation loss in fewer optimizer steps than the bound baseline
without replaying a recipe already in the published record corpus. The target is not
a stored number: it is the shipped default recipe's OWN validation loss at the end of
the budget ceiling, re-measured from scratch on every grading run. What is graded is
how few micro-batches a recipe needs to reach it, which is a different question from
which recipe ends lowest -- and on this substrate the two questions have different
answers.
"""
authors = ["Bia"]
keywords = ["optimization", "language-model", "optimizer", "record-displacement"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
family = "F1"
slot = "OER-01"
provisional_identifier = "OER-01"
primary_archetype = "record-displacement"
title = "Displace the published record for tokens-to-target"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

# Difficulty is measured by an external signed pilot over frozen task bytes
# against a frozen solver registry. It is never asserted by an authoring lane, so
# this field is empty by construction rather than left to be filled in later.
difficulty = ""
target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_reason = "This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

metric = "micro-batches consumed before the target validation loss is first reached"
metric_direction = "lower is better"

reward_kind = "float"
reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
reward_range = [0.0, 1.0]
reward_full = 1.0
reward_formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
reward_path = "/logs/verifier/reward.txt"
reward_document_path = "/logs/verifier/reward.json"

# The graded path is THREE from-scratch runs of the ceiling, each with 24 grid
# evaluations folded in. The number below is MEASURED: see solution/grounding.md.
graded_path_seconds_measured = 360
graded_path_seconds_budget = 900

[metadata.anchors]
state = "absent-by-design"
authority = "No literal for the target or for either endpoint appears anywhere in this bundle. All three are MEASURED on every grading run. The TARGET is the shipped environment/default_recipe.json's own evaluation loss at the end of the ceiling. The CONTROL endpoint is where that same run first reaches that loss, taken by the same first-crossing rule applied to every arm rather than assumed to be the ceiling. The REFERENCE endpoint is where tests/private/reference_recipe.json first reaches it. If either anchor fails to produce a finite curve the run refuses with anchor-diverged, and if the reference does not get there sooner than the control it refuses with calibration-span-nonpositive. Neither path substitutes a stored value."
normalisation_operated = "raw = (control_micro - agent_micro) / (control_micro - reference_micro)"
computed_on = "the frozen held-out split, from harness-owned weights, on the frozen evaluation grid"
never_from = [
  "a number the training loop reported",
  "a number in the submission's stdout",
  "a field the submission wrote",
  "the measured field of a published record",
]

[metadata.frozen]
axes = ["architecture", "initialisation", "token_stream", "budget_ceiling", "evaluation_grid", "grad_accum"]
budget_ceiling_micro_batches = 3072
tokens_per_micro_batch = 8192
budget_ceiling_tokens = 25165824
evaluation_grid_micro_steps = 128
evaluation_grid_tokens = 524288
substrate = "environment/frozen/task_spec.json"
grad_accum_note = "Frozen at 1, and the schema admits nothing else. This is a measurement rather than a preference: the accumulation axis is monotone at this ceiling and every ramp loses to constant 1. See solution/grounding.md."

[metadata.free]
axes = ["per_role_learning_rates", "adamw_moments_epsilon_weight_decay", "gradient_clip", "schedule_shape_and_its_fractions"]

[metadata.record_displacement]
corpus = "environment/published_records.json"
records = 3
gate = "record-replayed"
identity = "the graded fields only -- grad_clip, grad_accum, every key of optimizer and every key of schedule -- compared at 6 significant digits. notes and schema are not part of a recipe's identity."
note = "The corpus holds the strongest final loss known for this ceiling and the most robust of the published recipes. Both would score 90 percent of the reward and both are excluded, so a submission cannot restate the best published recipe and collect. The gate REFUSES; it never scales the float and never contributes a partial credit. The verifier asserts at image build that its own reference recipe is not in the corpus, because a bar excluded from the submission space is a bar nothing could legally reach."

[metadata.hygiene]
refusal_reasons = [
  "submission-absent",
  "recipe-unreadable",
  "recipe-not-an-object",
  "recipe-block-not-an-object",
  "recipe-schema-unrecognised",
  "recipe-key-unknown",
  "recipe-key-missing",
  "recipe-value-not-a-number",
  "recipe-value-out-of-bounds",
  "recipe-grad-accum-not-allowed",
  "recipe-schedule-shape-unknown",
  "record-replayed",
  "accelerator-absent",
  "verifier-substrate-unavailable",
  "verifier-anchor-recipe-invalid",
  "anchor-run-failed",
  "anchor-diverged",
  "calibration-span-nonpositive",
  "target-not-reached",
  "agent-run-failed",
  "grading-chain-failed",
  "grading-timed-out",
  "grading-killed",
]

[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_role = "per-attempt completion bound"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 32768
gpus = 1
gpu_types = ["H100"]
workdir = "/app"
build_timeout_sec = 3600
network_mode = "public"

[agent]
submission_path = "/workspace/submission/recipe.json"
entry_point = "solution/solve.sh"
network_mode = "none"
note = "The corpus and every dependency are staged at image build, so the solving agent needs no run-time egress. /workspace is the only path shared with the verifier."

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
reward_kind = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
never_imports_submission = true
note = "The submission is a JSON declaration of hyperparameters. The verifier parses it, bounds-checks it, checks it against the published-record corpus and trains with it. No code from the agent surface is imported or executed here, and no number the submission reports about itself is read."

[solution]
oracle = "solution/reference.py"
entry = "solution/solve.sh"
grounding = "solution/grounding.md"
note = "The oracle installs a recipe derived by a search over this exact harness during authoring. It is NOT the verifier's private reference recipe -- the two use different decay families and different peaks -- and it is not in the published-record corpus, so it clears the displacement gate like any submission."
