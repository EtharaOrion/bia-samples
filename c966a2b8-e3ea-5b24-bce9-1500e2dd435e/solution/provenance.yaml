schema_version: "1.0"

# Private provenance record. It carries the exact recipe the orchestrator needs
# to recompute this bundle's identity independently.
#
# This file is inside the hash domain, so it deliberately does NOT record the
# resulting canonical_content_hash or the resulting uuid. Recording either would
# change the bytes that produce them. The uuid is the directory name and the
# hash is recomputable from the recipe below.

identity:
  namespace: "FORGE_TASK_NAMESPACE"
  namespace_uuid: "c53e8f3b-526f-52c0-a04e-89e2269b237d"
  derivation: "uuid5(FORGE_TASK_NAMESPACE, canonical_content_hash)"
  directory_name_equals_uuid: true

canonical_content_hash_recipe:
  version: "bia-s10-v1"
  steps:
    - "1. Walk the bundle directory recursively."
    - "2. Exclude the directory trajectories/ entirely, at any depth, because rollout evidence must never change frozen bundle identity."
    - "3. Exclude every directory named __pycache__ and every file ending in .pyc, because they are build residue rather than authored bytes."
    - "4. Exclude nothing else. Every other file, including this one, including binary fixtures, is inside the domain."
    - "5. For each included file compute its path relative to the bundle root as a POSIX path with forward slashes and no leading dot."
    - "6. For each included file compute the SHA-256 of its exact bytes, lowercase hex."
    - "7. Sort the (relpath, digest) pairs by the UTF-8 bytes of relpath, ascending."
    - "8. Build the manifest text by emitting, for each pair in order, the digest, two spaces, the relpath, then a single newline character. The manifest text is the concatenation of those lines and ends with a newline."
    - "9. canonical_content_hash = SHA-256 of the UTF-8 encoding of the manifest text, lowercase hex."
    - "10. uuid = uuid.uuid5(uuid.UUID('c53e8f3b-526f-52c0-a04e-89e2269b237d'), canonical_content_hash), where the second argument is the 64 character lowercase hex string."
  no_canary_normalization: "This bundle designates no token slot for canary normalization, so the normalization domain is the identity function and every byte outside trajectories/ and build residue is hashed as it stands."
  reference_implementation: |
    import hashlib, os, uuid
    NS = uuid.UUID("c53e8f3b-526f-52c0-a04e-89e2269b237d")
    def canonical(root):
        pairs = []
        for dirpath, dirnames, filenames in os.walk(root):
            dirnames[:] = [d for d in dirnames if d not in ("trajectories", "__pycache__")]
            for name in filenames:
                if name.endswith(".pyc"):
                    continue
                full = os.path.join(dirpath, name)
                rel = os.path.relpath(full, root).replace(os.sep, "/")
                pairs.append((rel, hashlib.sha256(open(full, "rb").read()).hexdigest()))
        pairs.sort(key=lambda p: p[0].encode("utf-8"))
        manifest = "".join(f"{d}  {r}\n" for r, d in pairs)
        h = hashlib.sha256(manifest.encode("utf-8")).hexdigest()
        return h, str(uuid.uuid5(NS, h))

generated_artifacts:
  source_of_truth: "solution/grounding.yaml"
  generator: "solution/recompute.py"
  regenerated_every_run:
    - "solution/TRUTH.md"
    - "solution/rubrics.json"
    - "tests/test_output.py"
  drift_check: "python3 solution/recompute.py --check exits nonzero and names every artifact whose committed bytes differ from the regenerated bytes."

frozen_fixture:
  path: "environment/fixtures/smoke_corpus.bin"
  bytes: 262144
  sha256: "227de9e70a09e3832b069769a3c3dae66339453ba30e055253a6e7ea6a357100"
  source_corpus: "enwik8"
  source_url: "http://mattmahoney.net/dc/enwik8.zip"
  source_zip_sha256: "547994d9980ebed1288380d652999f38a14fe291a6247c157c3d33d4932534bc"
  source_raw_sha256: "2b49720ec4d78c3c9fabaee6e4179a5e997302b3a70029f30f2d582218c024a8"
  slice: "bytes 10000000 through 10262143 of the extracted enwik8"
  reason: "Real corpus bytes, so the BIA_SMOKE code path exercises the identical loader on real text rather than on a synthetic stand-in, without shipping 100 MB."
  license: "enwik8 is a byte prefix of a 2006 English Wikipedia XML dump, CC-BY-SA 3.0"

graded_corpus:
  path_in_image: "/opt/bia/data/enwik8"
  fetched_at: "docker build time, which is setup and not scored work"
  verification: "Both the archive digest and the extracted digest are checked with sha256sum -c in the Dockerfile, so a substituted corpus fails the build rather than the grade."

base_image:
  reference: "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
  pinned_by: "digest, never by tag"

reference_measurement:
  smoke_path: "BIA_SMOKE=1 bash solution/solve.sh"
  smoke_status: "RUN, CPU only, no CUDA allocation. Score 0.0417 with reason scored, all seven checkers passing, all 18 control halves passing, and a live probe witness of 240 forbidden-phase normalization events in the un-ablated arm against zero in both ablated arms."
  full_path: "bash solution/solve.sh with no BIA_SMOKE, on one H100"
  full_status: "MEASURED. The shipped bytes graded at 0.4683473899549122 with reason scored, on one NVIDIA H100 80GB HBM3 shared with other work, in 95 seconds of wall clock against a warm anchor cache, with checkers_failed empty and all 18 control halves passing."
  full_measured_detail: "target_metric 1.7892686973015468 and baseline_metric 2.0133245289325714, measured by the harness on that device and served from the anchor cache keyed over the substrate manifest, the frozen config digest, the corpus digest and the device name. agent_metric 1.9083885649840038, with the independent recompute from the saved checkpoint agreeing at 1.9083885649840038. Per-arm wallclock 32.8 for anchor_target, 29.4 for anchor_baseline and 90.7 for the agent arm."
  full_measurement_is_a_draw: "The substrate is metastable, so one graded number is a draw. Four further runs of the shipped configuration measured 1.896, 1.902, 1.908 and 1.962, which places the reference between 0.23 and 0.52 of the measured gap. The same rule at the 1.5e-3 peak rate it was tuned through was graded three times at 0.4975, 0.6747 and 0.9093 and measured 1.810, 1.813, 1.827, 1.855, 1.862, 1.902 and 1.928 over seven runs. Every draw of either point landed strictly inside the open unit interval, and the shipped point is the lower one because the higher one came within 0.02 nats of the upper clamp."
  observed_harness_fault: "Two graded invocations during this measurement campaign died before grade.py could emit, and tests/test.sh correctly wrote the fallback score 0.0 with reason verifier_produced_no_score, which is a machine-readable harness fault and not a score. The traceback names the cause exactly: torch.save raised because the parent directory /workspace/artifacts had ceased to exist partway through the agent arm. The measurement host was shared with three other bundles being repaired concurrently, each of which clears /workspace before its own graded run, so the workdir was deleted underneath a running arm. That is a property of the shared measurement host and not of this bundle, since a Harbor container does not share /workspace. It does show that grade.py has no retry around run_arm, so a workdir or an accelerator that goes away at the wrong instant costs the whole attempt. Recorded as an observed operational fault rather than fixed here, because fixing it means changing harness-owned control flow that the substrate manifest pins."
  previous_reference_result: "The reference that shipped before this one scored 0.0 with reason scored at agent_metric 2.5867104927698770, which is 0.573 nats worse than the baseline it was meant to improve on. That zero was a finding against the reference and not against the task, and it was answered by strengthening the reference rather than by lowering the target."

disposition: "HOLD:PILOT_REQUIRED"
