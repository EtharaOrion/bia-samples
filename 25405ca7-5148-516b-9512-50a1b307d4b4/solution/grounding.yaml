solver_egress_divergence:
  bound_in_this_bundle: open
  bound_in_batch_contract: setup-only
  gap_id: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the
    solving model full internet access and says it should download its own
    packages, datasets and models.
  reading_b: >-
    line 122 of the same file, in the FAQ added in the same revision, answers
    that internet is needed only for setup.
  ruling_in_force: >-
    requirements/bia-environment-spec.md line 247 rules that until the client
    resolves it the stricter reading governs. seed/contract.yaml
    batch.optimization_bindings.solver_egress therefore reads setup-only.
  what_this_lane_binds: >-
    This slot binds solver_egress = open at the agent surface, per the wave-1
    lane brief, while the family delivery.network_policy block binds
    agent_environment egress allowed with the upstream deny-list. The
    batch-level field is NOT amended by this lane. The divergence is recorded
    here rather than resolved here.
  deny_list_is_not_a_containment_proof: >-
    The deny-list names github.com, raw.githubusercontent.com and
    objects.githubusercontent.com. It is not a containment proof. Mirrors,
    caches, paraphrased write-ups and model weights all carry a recipe past any
    deny-list. That is exactly why the deterministic checker, and not the
    network policy, is the load-bearing control in this slot.
  verifier_surface: denied, always, with no exception and no allowlist.

