<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="bia. Three links shut, one left open.">
<title>bia</title>
<desc>The Binding: a single armored hand closing the last link of a chain across a rock face, three links already shut and inscribed data, batch, architecture, and the fourth link left open where the optimizer sits.</desc>
