# Declared graded surface for the tokens-to-target slot.
#
# Every checker below reduces to exactly one of the six closed kinds, names the
# reachable carrier in this bundle's own tests tree that implements it, names the
# selector inside that carrier, and names the machine-readable reason code that
# carrier emits when the checker scores zero. A checker reducing to none, or to
# two, is invalid.
#
# Every checker traces to a live-state read the verifier performs for itself:
# checkpoint bytes the provided loader wrote, the loader's own token ledger, and
# the validation split that never enters the agent environment. No checker reads
# a planted file, an environment secret, a random source or a clock.
#
# Every checker is a hard gate. A single failure emits a score of exactly 0.0.

schema: forge.checkers/v1
kinds: ["VALUE", "EFFECT", "ABSENCE", "INVARIANT", "ORDERING", "DIVERGENCE"]
reward_path: /logs/verifier/reward.txt

aggregation:
  mode: all_pass

checkers:
  - id: anchors_measured_on_the_frozen_bundle
    statement: "No path through the grader reaches a nonzero reward while the anchor set is unmeasured, so the set of scoring routes open to a placeholder anchor is empty."
    reduction: ABSENCE
    reached_by: tests/reward.py
    selector: require_measured
    zero_reason: anchors-unmeasured
    basis: measured
    count_predicate: ""
    live_state_read: "the measured flag and the provenance string the verifier reads off tests/anchors.json at grade time"
    weight: 1.0
    required: true

  - id: submission_present_at_the_bound_path
    statement: "The deliverable the verifier grades is present at the submission path the delivery contract binds, so an absent submission is an attributed zero rather than a crash."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: SUBMISSION
    zero_reason: submission-missing
    basis: measured
    count_predicate: ""
    live_state_read: "the bound submission path on the verifier filesystem, tested for a readable regular file before any run is launched"
    weight: 1.0
    required: true

  - id: graded_seed_set_drawn_after_submission
    statement: "The graded seed set equals the value the bound bundle hash and the SHA-256 of the submitted bytes jointly determine, so no seed was knowable while the submission was being authored."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: draw_seeds
    zero_reason: bundle-hash-unbound
    basis: measured
    count_predicate: ""
    live_state_read: "the bundle hash the runtime binds and the SHA-256 the verifier recomputes over the submitted script bytes on its own filesystem"
    weight: 1.0
    required: true

  - id: graded_run_executed_by_the_verifier
    statement: "Invoking the submitted script from the verifier's own process changed live state, producing one verifier-owned checkpoint directory per drawn seed."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: run_one_seed
    zero_reason: run-timeout
    basis: measured
    count_predicate: ""
    live_state_read: "the contents of the checkpoint directory the verifier created and handed to the child process, read after the child returned"
    weight: 1.0
    required: true

  - id: checkpoints_written_at_verifier_owned_token_milestones
    statement: "Every checkpoint admitted to grading sits on the token grid the verifier owns, so the evaluation cadence is not a submission choice."
    reduction: VALUE
    reached_by: tests/evaluate.py
    selector: checkpoint_tokens
    zero_reason: no-evaluable-checkpoints
    basis: measured
    count_predicate: ""
    live_state_read: "the token count parsed off every checkpoint filename in the verifier-owned run directory, bounded against the verifier's predeclared token grid"
    weight: 1.0
    required: true

  - id: training_tokens_counted_at_the_loader
    statement: "The token count a checkpoint names and the token count the provided loader recorded serving agree exactly, so a checkpoint claiming work the loader never did is dropped."
    reduction: DIVERGENCE
    reached_by: tests/evaluate.py
    selector: ledger_corroborates
    zero_reason: no-evaluable-checkpoints
    basis: measured
    count_predicate: ""
    live_state_read: "the token count in each checkpoint filename beside the token count the loader wrote into token_ledger.json in the same run directory"
    weight: 1.0
    required: true

  - id: checkpoint_loads_into_the_verifier_frozen_model
    statement: "Every graded checkpoint loaded into the verifier's own frozen architecture under strict shape checking, for every milestone of every seed."
    reduction: INVARIANT
    reached_by: tests/evaluate.py
    selector: evaluate_checkpoint
    zero_reason: architecture-mismatch
    basis: measured
    count_predicate: ""
    live_state_read: "the state dict the verifier loads off each checkpoint file, loaded into the model tests/frozen_arch.py builds with strict key and shape matching"
    weight: 1.0
    required: true

  - id: crossing_measured_on_the_verifier_token_grid
    statement: "The evaluation grid held identically across every drawn seed, so a token point present on one seed and absent on another never enters the crossing search."
    reduction: INVARIANT
    reached_by: tests/crossing.py
    selector: common_grid
    zero_reason: no-common-evaluation-grid
    basis: measured
    count_predicate: ""
    live_state_read: "the token keys of the per-seed loss series the verifier measured, intersected across the whole seed set"
    weight: 1.0
    required: true

  - id: target_cleared_with_seed_significance
    statement: "The seed mean at the reported crossing clears the bound target loss by at least the bound margin after the seed-count correction, so a single lucky seed cannot decide the outcome."
    reduction: VALUE
    reached_by: tests/crossing.py
    selector: clears_bar
    zero_reason: target-never-cleared
    basis: measured
    count_predicate: "count(seeds_measured) > 0 and count(seeds_measured) >= min_seeds"
    live_state_read: "the seed-mean validation loss the verifier computed at each grid point, bounded against the target loss and margin tests/anchors.json binds"
    weight: 1.0
    required: true

  - id: rubric_verdicts_present_when_a_rubric_surface_is_declared
    statement: "No graded reward is emitted while this bundle declares a natural-language rubric surface and no judge verdict exists for it, so the set of routes that score the automated dimensions alone is empty."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: rubric_surface_declared
    zero_reason: rubric-verdicts-absent
    basis: measured
    count_predicate: ""
    live_state_read: "the bytes of tests/rubrics.jsonl beside the presence and shape of the rubric verdict artifact at the bound verdict path"
    weight: 1.0
    required: true

  - id: every_exit_path_writes_an_attributed_reward
    statement: "The set of exit paths out of the grader that leave the reward artifact unwritten, or write it without a machine-readable reason, is empty."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: emit
    zero_reason: grader-internal-error
    basis: measured
    count_predicate: ""
    live_state_read: "the reward artifact on the verifier filesystem after the grader returns, including the artifact the module-level handler writes on an unhandled exception"
    weight: 1.0
    required: true
