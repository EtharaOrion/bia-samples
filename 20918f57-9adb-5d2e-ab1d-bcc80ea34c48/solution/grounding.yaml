# ---------------------------------------------------------------------------
# Statement ambiguity: exactly one graded outcome. FORGE.md Phase 1 item 10a.
# Authored by reading instruction.md in full and the live verifier, never the prose.
# ---------------------------------------------------------------------------

statement_ambiguity:
  graded_scalar: "reward, the float tests/grade.py::score computes as min(max((tokens_per_second - instance_baseline_tps) / (instance_target_tps - instance_baseline_tps), 0.0), 1.0)"
  readings:
    - id: reading_a_stated_plainly_throughput
      source: "instruction.md, section 'What is graded, stated plainly', the bold statement at lines 9 to 10 with numbered points 1 and 2 at lines 14 to 23"
      reduces_to: >-
        Maximise tokens per second as the verifier recomputes it from its own completion
        telemetry after re-running the frozen request trace under the submitted
        configuration, while the verifier-recomputed p99 latency stays at or under
        p99_latency_slo_ms, that objective being a hard constraint and not a penalty term.
    - id: reading_b_scoring_section_formula
      source: "instruction.md, section 'Scoring', which opens at line 110 with 'Stated once more, independently of the section above, so there is exactly one reading', and gives the formula at lines 118 to 119"
      reduces_to: >-
        Maximise min(max((agent_metric - baseline_metric) / (target_metric - baseline_metric),
        0.0), 1.0) with agent_metric being tokens per second, the p99 objective standing as a
        hard constraint on it rather than a term traded against it.
  identical: true
  proof_method: >-
    tests/grade.py::score is the only producer of the float. It builds the metric block via
    _metric_block, whose 'tokens_per_second' entry is checkers.tokens_per_second(harness) at
    line 114 and whose 'p99_latency_ms' entry is checkers.p99_latency_ms(harness) at line 115.
    It then runs every checker first and returns reward 0.0 with the failing checker's reason
    if any fails (lines 142 to 150), so the p99 objective enters only as a gate. Only past the
    gate does it compute, at lines 151 to 161,
    raw = (metric['tokens_per_second'] - bound.instance_baseline_tps) / (bound.instance_target_tps
    - bound.instance_baseline_tps), clipped into [0, 1]. That is literally reading B's formula
    with agent_metric = tokens_per_second, so the two readings are the same quantity by
    substitution; the anchors are instance-local bounds and carry nothing the submission
    supplies. reported_tokens_per_second appears in the submission and is read by no branch of
    score.

