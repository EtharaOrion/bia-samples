schema: forge.grounding/v1
slot: OER-24
provisional_identifier: OER-24
note: >-
  This file is the single private derivation source for the slot. `solution/recompute.py`
  derives every generated artifact from these bytes alone: the frozen request trace, the
  frozen hardware envelope, the golden trajectory, the checker fixtures, `solve.sh`,
  `TRUTH.md`, `rubrics.json`, `tests/bound.json` and `tests/test_output.py`. Nothing here is
  a model output, a network fetch, a clock reading, a locale-dependent rendering or a draw
  from a random source. Running `recompute.py` twice over frozen bytes produces byte-identical
  output, and `recompute.py --check` reports drift without writing.

identity:
  family: F11
  family_title: inference serving throughput
  primary_archetype: AR10
  primary_archetype_title: Memory Degradation
  archetype_count: 1
  archetype_rule: >-
    Exactly one primary archetype. AR10 is the whole pressure of this slot and no second
    archetype is claimed, borrowed or composed in.
  title: Configuration memory across iterations under a bound service level objective
  tags: [optimization, bounded-continuous]
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  frontier_defeat_floor: 0.50
  separation_margin: 0.05

perception_axis_exemption:
  kind: standing batch-level exemption
  statement: >-
    This task family is text and code only, so the Perception axis carries no category. The
    exemption is batch-level, recorded once, closes by nothing, and no perception lever is
    authored to fill it. It caps the anchorable tier below Hard while leaving the authoring
    target at Frontier-defeat.

metric:
  name: tokens per second subject to a p99 latency service level objective
  direction: higher
  slo_semantics: >-
    The p99 latency service level objective is a HARD CONSTRAINT, never a soft penalty.
    A configuration whose p99 latency exceeds the objective scores exactly 0.0 with the
    machine-readable reason `p99-slo-exceeded`, no matter how high its throughput is.
  frozen_axes:
    - the model, represented by the arithmetic cost model in environment/envelope.json
    - the hardware envelope, one H100, single accelerator, no multi-GPU scaling
    - the request trace, environment/trace.json
    - the p99 latency service level objective, envelope.p99_latency_slo_ms
  free_axes:
    - the serving configuration: batching, scheduling and admission policy
  free_keys: [max_batch_size, max_admit_per_step, scheduler, admission_queue_limit]

clock_ownership:
  owner: harness
  statement: >-
    THE HARNESS OWNS THE CLOCK. environment/serving_sim.py instruments the serving loop and
    emits timing telemetry records carrying a virtual integer-millisecond timestamp derived
    arithmetically from the frozen envelope. Every checker reads those harness-owned records
    and never calls a clock itself.
  why: >-
    The metric is a timing metric and the spec forbids a checker from reading a clock. Both
    hold at once because ownership resolves them: the clock is read once, by the harness,
    into a record; the checkers are pure functions of that record. That is also what makes
    the grading reproducible, because the record replays.
  absolute_clock_ban: >-
    recompute.py reads no clock either. The golden telemetry is a recorded fixture derived by
    arithmetic from the frozen trace and the frozen envelope, never a live measurement.

substrate:
  kind: deterministic discrete-event simulator
  module: environment/serving_sim.py
  declared_gap: gap-oer-24-substrate-is-a-simulator-not-a-live-server
  why_right_choice: >-
    A simulator makes grading reproducible: the same trace, envelope and configuration produce
    byte-identical telemetry on any host, so a checker's verdict is recomputable by an outside
    reader. It is never allowed to pass as a live measurement, and reference_hours therefore
    covers simulator-time cost only.

trace:
  schema: oer24.trace/v1
  request_count: 160
  generator: >-
    A fixed integer linear congruential recurrence x <- (1103515245 * x + 12345) mod 2**31,
    seeded from the constant below. This is arithmetic, not a random source: the sequence is
    fully determined by the seed recorded here and no module named `random` is imported.
  seed: 20260824
  inter_arrival_ms: {base: 55, modulus: 60}
  prompt_tokens: {base: 8, modulus: 17}
  output_tokens: {base: 12, modulus: 25}

envelope:
  schema: oer24.envelope/v1
  accelerator: one H100, single accelerator, no multi-GPU scaling
  accelerators: 1
  step_overhead_ms: 8
  decode_ms_per_request: 3
  prefill_ms_per_token: 3
  max_batch_size_ceiling: 64
  max_admit_per_step_ceiling: 16
  p99_latency_slo_ms: 8800
  measurement_window_count: 5
  sustain_numerator: 2
  sustain_denominator: 5
  p99_rank_rule: nearest-rank, index = ceil(0.99 * n) - 1 over the sorted latency list
  default_config:
    max_batch_size: 4
    max_admit_per_step: 2
    scheduler: fcfs
    admission_queue_limit: 12

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  family_baseline_metric: null
  family_target_metric: null
  statement: >-
    F11 anchors are unmeasured. seed/contract.yaml records F11 with scope_state `unscoped`
    and no baseline, target, pass threshold or instance count. The reward SCHEMA is bound in
    full below and the family anchors are declared absent. No family baseline_metric or
    target_metric number is invented here.
  instance_local_anchors:
    what_they_are: >-
      Two numbers measured on this slot's own frozen substrate by recompute.py. They normalise
      the reward for THIS instance and they are NOT the family anchors, are NOT a substitute
      for them, and do NOT close gap-oer-per-family-anchors-unmeasured.
    declared_gap: gap-oer-24-instance-local-anchors-not-family-anchors
    baseline_configuration:
      max_batch_size: 4
      max_admit_per_step: 2
      scheduler: fcfs
      admission_queue_limit: null
      derivation: >-
        The batching and scheduling the envelope ships as its default, with admission left
        open so every request in the frozen trace is served. Admission is opened because a
        dropping configuration is not a measurement of throughput at all.
    target_configuration:
      max_batch_size: 32
      max_admit_per_step: 1
      scheduler: fcfs
      admission_queue_limit: null
      derivation: >-
        The highest-throughput configuration in the frozen free space whose p99 latency over
        every request in the frozen trace holds inside the objective, found by recompute.py
        sweeping the whole closed free space by exhaustive arithmetic enumeration.

reward:
  carrier_path: /logs/verifier/reward.txt
  carrier_form: one bare float
  score_document_path: /logs/verifier/score.json
  interval: [0.0, 1.0]
  direction: higher is better
  never_binary: true
  full_reward_exactly: 1.0
  formula: raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  bar_not_point: reaching the target scores exactly 1.0 and beating it also scores 1.0
  gate: >-
    Every required checker must pass before the continuous term is computed. The first failing
    required checker sets the reward to 0.0 and writes its own machine-readable reason.

refinement_loop:
  retain: 5
  compaction_generation_after: 5
  statement: >-
    The bound refinement loop hands each iteration a summary of every prior configuration and
    its reward. Once more than `retain` iterations have run the summary retains only the last
    `retain` entries and says nothing about the ones it dropped. The drop is silent: the
    summary's static note is byte-identical before and after.
  durable_recovery_area: notes/ledger.jsonl
  durable_area_is_agent_writable: true
  durable_area_is_separate_from_lower_layer: true

exploration_schedule:
  note: >-
    The reference trajectory's twelve iterations, in order. Iterations 1 through 5 establish
    facts about the configuration space that the compacted summary later drops, including two
    configurations proved to violate the objective. The reference agent detects the loss by
    comparing the summary against its own durable ledger and reconstructs from the ledger.
  iterations:
    - {iteration: 1,  max_batch_size: 4,  max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 2,  max_batch_size: 64, max_admit_per_step: 8,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 3,  max_batch_size: 8,  max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 4,  max_batch_size: 64, max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 5,  max_batch_size: 12, max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 6,  max_batch_size: 16, max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 7,  max_batch_size: 20, max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 8,  max_batch_size: 24, max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 9,  max_batch_size: 32, max_admit_per_step: 2,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 10, max_batch_size: 32, max_admit_per_step: 1,  scheduler: sjf,  admission_queue_limit: null}
    - {iteration: 11, max_batch_size: 24, max_admit_per_step: 1,  scheduler: fcfs, admission_queue_limit: null}
    - {iteration: 12, max_batch_size: 32, max_admit_per_step: 1,  scheduler: fcfs, admission_queue_limit: null}

solver_egress_divergence:
  bound_here: open
  batch_field_reads: setup-only
  gap_id: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving model
    full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says internet is needed
    only for setup, and requirements/bia-environment-spec.md line 247 rules that the stricter
    reading governs until the client resolves it.
  what_this_lane_binds: >-
    task.toml binds solver_egress = "open" at the agent surface and verifier egress = "denied".
    seed/contract.yaml batch.optimization_bindings.solver_egress still reads `setup-only` and
    this lane does NOT amend that batch-level field. The divergence is recorded here rather
    than left silent.
  deny_list_is_not_containment: >-
    The deny-list on github.com, raw.githubusercontent.com and objects.githubusercontent.com
    is not a containment proof. Mirrors, caches, paraphrased write-ups and model weights all
    carry a recipe past any deny-list, which is exactly why the deterministic checker and not
    the network policy is the load-bearing control here.

readout_manipulation_obligation:
  adaptation: >-
    Adapted from the upstream nanogpt statement of the obligation to a throughput-and-latency
    metric. Both readouts are attackable and both are recomputed by the verifier.
  throughput: >-
    Computed BY THE VERIFIER from harness-owned completion telemetry over the frozen request
    trace. The verifier re-runs the frozen trace under the submitted configuration on the
    harness-owned simulator and computes tokens per second from its own completion records.
    It is never a number the submission reported.
  p99_latency: >-
    Computed BY THE VERIFIER over the SAME telemetry, over EVERY request in the frozen trace.
    A configuration that drops, defers or refuses requests to flatter its p99 has not met the
    objective; `every_request_accounted` requires one and only one completion record per
    request in the frozen trace and no rejection record at all, and it carries its own
    machine-readable reason `requests-unaccounted`.
  no_smoothing: >-
    No smoothing on the graded path. The graded throughput is the raw quotient over the whole
    measured span. `unsmoothed_graded_readout` is a VALUE checker whose zero reason is
    `readout-smoothed`.
  early_stop: >-
    A run that halts on a favourable window is graded as not having established the throughput,
    with the machine-readable reason `early-stop-window-harvest`, not as an absent result.
    `no_early_stop_harvest` is an EFFECT checker.
  sustained: >-
    The reading must hold across every verifier-scheduled measurement window.
    `measurement_windows_sustained` is an INVARIANT checker whose zero reason is
    `reading-not-sustained`.

checker_fixture_substitution:
  - checker: measurement_windows_sustained
    substitution: planted telemetry fixture
    why: >-
      recompute.py enumerates the entire closed free space by exhaustive arithmetic. The lowest
      per-window throughput ratio reached by ANY configuration that also holds inside the p99
      objective is 0.539 of the graded reading, and the sustain floor is 2/5 = 0.400. No
      submission can therefore breach the sustain floor while still reaching this checker, so
      the rejecting half is carried on a planted telemetry fixture rather than on a
      configuration, and the substitution is recorded here, in tests/checkers.yaml and in
      seed/tasks/OER-24/feasibility.yaml.
  - checker: arrival_cadence_ordered
    substitution: planted telemetry fixtures
    why: >-
      trace.inter_arrival_ms is a property of the frozen request trace and the free
      configuration surface is batching, scheduling and admission, none of which moves an
      arrival cadence. No submission can therefore reach this checker's rejecting half by
      choosing a configuration. What can move the cadence is a harness replay whose arrival
      stamps disagree with the frozen trace, which is what a shifted or compressed arrival
      stream looks like on the way to a shorter measured span and a flattering quotient, and
      which trace_and_envelope_unmodified cannot see because it digests bytes on disk rather
      than the recorded telemetry. The rejecting half is carried on four planted telemetry
      fixtures, each the simulator's own output over a trace regenerated with the base or the
      modulus moved by exactly one, so the rejection is proven to turn on the VALUE rather
      than on the shape of an arrival stream. The substitution is recorded here and in
      tests/checkers.yaml.

