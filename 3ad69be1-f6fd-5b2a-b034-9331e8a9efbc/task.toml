schema_version = "1.4"

# schema_version is a TOP-LEVEL scalar and is written above the first table header on purpose.
# TOML scopes every key to the most recent header, so an assignment below [task] would silently
# become task.schema_version and leave the top-level scalar absent while the file still reads
# correct to a human.

artifacts = [
  "/app/plan.sql",
  "/app/submission.json",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-29-admitted-set-query-under-a-quarantine-closure"
version = "1.0.0"
description = "Beat a frozen recursive baseline plan on a provenance warehouse, where the required result set is defined by excluding one quarantined lineage row and the whole transitive closure that depends on it, so a plan folded from a closure that stopped at the first hop is fast and wrong."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "query-optimization", "exclusion-closure"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-29"
provisional_identifier = "OER-29"
title = "Admitted-set query plan under a quarantine closure"
family = "F6"
family_title = "query optimization"
primary_archetype = "exclusion-closure"
primary_archetype_title = "Exclusion Closure"
archetype_count = 1
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

target_tier = "T2"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard by the standing batch-level Perception-axis exemption"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at T2."

[metadata.metric]
name = "query plan speedup over the frozen baseline plan, gated on result-set equality"
direction = "higher"
gate_kind = "hard gate"
gate_note = "A plan whose result set differs from the required result set by one row, one column or one ordering position scores exactly 0.0 with the machine-readable reason result-set-divergence, no matter how cheap it is. The gate is never a soft penalty."
frozen = ["the warehouse schema", "the warehouse contents", "the integrity rule", "the closure relation", "the required result set and its projection and ordering"]
free = ["the query plan, meaning the single read-only statement that produces the required result set"]
computed_by = "the verifier, from its own step counts over the frozen warehouse"

[metadata.cost_model]
kind = "database engine virtual-machine step count"
read_by = "environment/planrun.py, through the engine progress callback"
not_a_clock = "The cost is a step count and never a wall-clock time. It is not presented as one, under the declared gap gap-oer-29-cost-is-a-step-count-not-a-wall-clock-time."
portability = "The step count is portable only while the engine build is fixed, so both Dockerfiles pin the same base image by digest and tests/grade.py refuses with engine-cost-model-drift if the frozen baseline plan does not cost what it cost when the bound constants were derived."

[metadata.discovery]
count = 2
values = ["excluded row identifier", "closure cardinality"]
established_by = "the first stage of environment/Dockerfile, which composes the warehouse from a frozen spec and perturbs exactly one declared checksum; which row it lands on is decided by the graph that build itself produced"
read_back_through = "environment/probe.py run on the agent surface, and the tests/checkers.py Harness handle on the verifier surface, over the same frozen bytes"
absent_from = "instruction.md, task.toml, and every authored file under environment/"
statement_closure = "instruction.md fixes the exclusion rule and the closure operation in full and names no node and no cardinality, so the graded outcome cannot fall out of the statement."
graded_dependence = "quarantine_row_identified turns on the excluded row identifier; closure_cardinality_attested and closure_layers_witnessed turn on the closure cardinality. Each carries a frozen rejecting fixture."

[metadata.anchors]
state = "absent"
authority = "This family is unscoped and records no baseline, target, pass threshold or instance count. The reward schema below is bound in full and neither number is invented here."

[metadata.reward]
carrier_path = "/logs/verifier/reward.txt"
carrier_form = "one bare float"
score_document_path = "/logs/verifier/score.json"
interval = [0.0, 1.0]
direction = "higher"
never_binary = true
full_reward_exactly = 1.0
formula = "raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
bar_not_point = "Reaching the target scores exactly 1.0 and beating it also scores 1.0."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are explicitly distinct and are never
# aliases. max_timeout_hours bounds the refinement loop ACROSS attempts;
# budget_hours bounds ONE attempt, being six hours over fifty attempts, 0.12
# hours or 7.2 minutes.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "CPU only. The substrate is an embedded relational engine over a frozen database file and needs no accelerator."
budget_margin = 10.0
compute_envelope_accelerators = 0

[metadata.clock]
owner = "harness"
note = "THE HARNESS OWNS THE CLOCK, and on this slot it does not need to read one. The graded cost is a step count the engine reports through environment/planrun.py. Every checker reads that recorded count and never calls time, datetime, perf_counter or monotonic."

[metadata.substrate]
kind = "deterministic embedded relational engine over a frozen database file"
note = "The engine is pinned by the base image digest on both surfaces. The same plan over the same frozen bytes produces the same step count on any host running that image, which is what makes the verdict recomputable by an outside reader."

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
build_context = "the bundle root, for both Dockerfiles"
pin_kind = "digest"
pin_note = "Pinned by @sha256 and never by a floating tag. Harbor accepts any string and does not itself require a digest, so the digest requirement is this contract's. On this slot the pin is load-bearing twice over, because the graded cost is the pinned engine's own step count."

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 0
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[verifier]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
egress = "denied"
network_mode = "none"
egress_note = "The verifier keeps the bound network policy. A verifier that can reach the network is a verifier whose verdict can be fetched. Its one dependency is baked at build time, so nothing resolves at graded time."

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_note = "The solving agent gets open internet egress inside the sandbox so it can fetch its own packages; the verifier surface is denied. The asymmetry is deliberate and bound here rather than accidental."
deny_list_is_not_containment = "The deny-list is not a containment proof. Nothing on the network carries this warehouse's quarantine, because the warehouse is built at image build time from a spec that is discarded with the build stage, which is why the deterministic checker and not the network policy is the load-bearing control."
network_mode = "none"
