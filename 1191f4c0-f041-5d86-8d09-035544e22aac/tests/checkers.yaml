schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

# WHO OWNS THE CLOCK, stated here because this slot's metric is timing and the contract
# forbids a checker from reading a clock. Both hold at once, by ownership. tests/harness_sim.py
# owns a virtual integer tick clock, advances it inside the serving loop, and writes the result
# into timing telemetry records. Every checker below reads those harness-owned records through
# a real harness handle and never calls a clock itself. That is what keeps each checker pure,
# deterministic and replayable over the recorded trace, and it is also what makes the grading
# reproducible: the same submission grades identically on any host, at any load, at any hour.
# A checker that timed the run would make the verdict a function of host contention.
clock_ownership:
  owner: tests/harness_sim.py, the harness
  checkers_read: harness-owned timing telemetry records only
  checkers_call_no_clock: true
  enforced_by: harness_owns_the_clock
  replayable_over: the frozen recorded request trace

# THE DESIGN OBLIGATION, adapted to throughput and latency. Both readouts are attackable and
# both are recomputed rather than believed.
readout_discipline:
  throughput: >-
    Computed BY THE VERIFIER from harness-owned completion telemetry over the frozen request
    trace, never from a number the submission reported. The reported figure is carried into the
    handle only so throughput_from_harness_telemetry can refuse it.
  p99_latency: >-
    Computed BY THE VERIFIER over the SAME telemetry, over EVERY request in the frozen trace. A
    configuration that drops, defers or refuses requests to flatter its tail has not met the
    objective; trace_fully_accounted and no_request_shed each carry their own reason.
  no_smoothing_on_the_graded_path: >-
    A submission may smooth its own reported latency for its own use. The graded p99 is the raw
    order statistic recomputed unsmoothed. p99_recomputed_unsmoothed refuses a smoothed readout.
  early_stop_is_not_a_result: >-
    A run that halts on a favourable window is graded as NOT having established the throughput,
    with a machine-readable reason, rather than as an absent result.
  sustained: >-
    The reading must hold across every verifier-scheduled measurement window, cut from the
    harness-owned tick clock so the submission cannot choose where they fall.
  slo_is_hard: >-
    The p99 objective is a hard constraint. A configuration that exceeds it scores zero with a
    machine-readable reason however high its throughput.

purity:
  statement: >-
    Every checker is a pure function of one Handle. tests/checkers.py imports only json, math,
    hashlib, pathlib, dataclasses and typing, which is the AST allowlist for checker code. No
    planted file read, no environment-secret read, no random source, no clock read, no network,
    and no import of the submission anywhere on the grading path.
  submission_isolation: >-
    tests/runner.py copies the submission alone into a fresh temporary directory beside a
    verifier-owned copy of the harness, launches it as a new session leader under a small
    environment allowlist, and kills the whole process group in a finally block. tests/grade.py
    imports tests/checkers.py, tests/harness_sim.py and tests/runner.py, and never the submission.

aggregation:
  mode: required_pass
  rationale: >-
    required_pass names exactly what tests/grade.py does with the checker set: it is a gate
    chain. Every checker below is required, and if any one fails the reward is 0.0 carrying that
    checker's machine-readable reason. It does not name the magnitude of a passing reward, which
    grade.py then computes as the clipped continuous ratio
    (agent_metric - baseline_metric) / (target_metric - baseline_metric) over the calibration
    endpoints it measures itself. The mode gates; the metric grades. The reward is therefore
    never binary: it takes any value in the closed interval [0.0, 1.0].

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  note: >-
    Family F11 carries scope_state unscoped in seed/contract.yaml. The reward SCHEMA is bound in
    full here and the published anchors are declared absent rather than invented. The two
    calibration endpoints grade.py uses are measured from frozen bytes at grade time and appear
    as a literal nowhere in this bundle.

checker_adequacy_substitutions:
  - checker: trace_fully_accounted
    reason: >-
      No configuration in the free lattice can produce a request with no terminal telemetry
      record, because the harness's own accounting is total: every request ends completed,
      dropped or unfinished. The isolation boundary holds, so the rejecting half is carried on a
      planted fixture in tests/fixtures/planted.json rather than on a submission.
  - checker: sustained_across_windows
    reason: >-
      Every configuration in the free lattice whose per-window token rate falls below the bound
      sustain floor also exceeds the p99 objective, so slo_hard_constraint refuses it first. The
      rejecting half is carried on a planted fixture rather than on a submission.
  - checker: harness_owns_the_clock
    reason: >-
      A submission cannot reach the verifier's own graded-path bytes, which is the point of the
      isolation boundary. The rejecting half is carried on a planted fixture whose graded path
      source contains a clock call.

checkers:
  - id: environment_frozen
    statement: "The frozen request trace, hardware envelope and agent-visible harness are byte-identical to the substrate the verifier holds."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_environment_frozen
    zero_reason: frozen-substrate-modified
    required: true
    weight: 1
    live_state_read: "sha256 over the agent-visible environment/ surface as it stands at grade time, compared against tests/fixtures/substrate.json bound_digests held on the verifier side."
    compiled_test: "tests/test_output.py::test_environment_frozen"

  - id: attempt_ledger_recomputed
    statement: "Every configuration in the recorded attempt ledger reproduces, telemetry field for telemetry field, under the verifier's own re-simulation over the frozen trace."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_attempt_ledger_recomputed
    zero_reason: telemetry-ledger-divergent
    required: true
    weight: 1
    live_state_read: "the harness-owned attempt ledger from the session document, against tests/harness_sim.py simulate() telemetry recomputed in the verifier's own process."
    compiled_test: "tests/test_output.py::test_attempt_ledger_recomputed"

  - id: trace_fully_accounted
    statement: "Every request id in the frozen trace carries exactly one terminal telemetry record in the graded reading."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_trace_fully_accounted
    zero_reason: trace-request-unaccounted
    required: true
    weight: 1
    live_state_read: "the per-request record ids and the accounted count on the verifier-recomputed telemetry for the selected attempt."
    compiled_test: "tests/test_output.py::test_trace_fully_accounted"

  - id: no_request_shed
    statement: "The graded configuration drops no request; load is not shed to flatter the tail."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_no_request_shed
    zero_reason: requests-shed-to-flatter-p99
    required: true
    weight: 1
    live_state_read: "the shed count on the verifier-recomputed telemetry for the selected attempt."
    compiled_test: "tests/test_output.py::test_no_request_shed"

  - id: early_stop_not_a_result
    statement: "The graded reading served the whole frozen trace; a run halted on a favourable window did not establish the throughput."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_early_stop_not_a_result
    zero_reason: early-stop-window-harvest
    required: true
    weight: 1
    live_state_read: "the trace_exhausted flag, the unfinished count and the completed count on the verifier-recomputed telemetry for the selected attempt."
    compiled_test: "tests/test_output.py::test_early_stop_not_a_result"

  - id: slo_hard_constraint
    statement: "The verifier-recomputed p99 per-output-token latency is at or below the frozen objective."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_slo_hard_constraint
    zero_reason: p99-slo-exceeded
    required: true
    weight: 1
    live_state_read: "the p99 order statistic the verifier computed over harness-owned per-request timing telemetry, against environment/objective.json as held on the verifier side."
    compiled_test: "tests/test_output.py::test_slo_hard_constraint"

  - id: p99_recomputed_unsmoothed
    statement: "The graded tail is the raw order statistic over harness telemetry, and the submission's reported tail agrees with it unsmoothed."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_p99_recomputed_unsmoothed
    zero_reason: latency-readout-smoothed
    required: true
    weight: 1
    live_state_read: "the reported latency block of the session document, against the verifier's own unsmoothed percentile over harness-owned per-request telemetry."
    compiled_test: "tests/test_output.py::test_p99_recomputed_unsmoothed"

  - id: throughput_from_harness_telemetry
    statement: "The graded throughput comes from harness-owned completion telemetry, and the submission's reported throughput agrees with it exactly."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_throughput_from_harness_telemetry
    zero_reason: throughput-readout-asserted
    required: true
    weight: 1
    live_state_read: "the reported throughput numerator and denominator of the session document, against the verifier-recomputed completion telemetry for the selected attempt."
    compiled_test: "tests/test_output.py::test_throughput_from_harness_telemetry"

  - id: sustained_across_windows
    statement: "The throughput reading holds in every verifier-scheduled measurement window, each carrying at least one completion and at least the bound fraction of the whole-span token rate."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_sustained_across_windows
    zero_reason: throughput-not-sustained
    required: true
    weight: 1
    live_state_read: "the per-window telemetry the harness cut from its own tick clock across the served span, on the verifier-recomputed telemetry for the selected attempt."
    compiled_test: "tests/test_output.py::test_sustained_across_windows"

  - id: reallocation_after_flattening
    statement: "No configuration axis is swept for more than the bound number of consecutive attempts that improve the carried best by nothing; a flattened direction is reallocated."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_reallocation_after_flattening
    zero_reason: greedy-sweep-not-reallocated
    required: true
    weight: 1
    live_state_read: "the ordered axes_moved sequence of the harness-owned attempt ledger, against the verifier's own running best over recomputed telemetry."
    compiled_test: "tests/test_output.py::test_reallocation_after_flattening"

  - id: carried_best_preserved
    statement: "The carried best recorded at every attempt equals the verifier's own running best, and the answer returned is that best rather than the last attempt."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_carried_best_preserved
    zero_reason: carried-best-collapsed
    required: true
    weight: 1
    live_state_read: "the carried_best_index carried by every row of the harness-owned attempt ledger and the session's selected_attempt, against the verifier's own running best over recomputed telemetry."
    compiled_test: "tests/test_output.py::test_carried_best_preserved"

  - id: harness_owns_the_clock
    statement: "No file on the graded checker path reads a clock; the timing on the graded path is harness-owned telemetry."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_harness_owns_the_clock
    zero_reason: checker-read-a-clock
    required: true
    weight: 1
    live_state_read: "the concatenated bytes of tests/checkers.py, tests/grade.py and tests/harness_sim.py as they stand in the verifier's own process at grade time."
    compiled_test: "tests/test_output.py::test_harness_owns_the_clock"
