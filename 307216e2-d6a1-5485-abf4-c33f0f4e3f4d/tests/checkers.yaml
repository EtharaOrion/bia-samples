schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

slot: OER-19
family: F14
archetype: AR6

aggregation:
  mode: required_pass
  rationale: >-
    grade.py walks the gate chain in tests/checkers.py in the bound order and stops
    at the first failing gate, scoring 0.0 with that gate's zero_reason. Every gate
    is required, so the mode is exactly the universal quantifier required_pass
    describes, and it is not vacuous because ten checkers are marked required. Only
    when every required gate passes does the reward become the clipped
    anchor-normalized held-out validation loss, which is continuous on [0.0, 1.0]
    and never binary. required_pass therefore describes the gate, and the metric
    formula described in task.toml describes the number that survives it.

# The substrate this slot's metric resolves against. Replicated byte for byte from
# the canonical operating point rather than referenced across slots, because a
# bundle's name is a hash over its own tree and a shared file outside that tree
# would leave the name underdetermined. Two copies are carried: the agent reads
# environment/nanogpt_substrate.json and the verifier reads its own
# tests/nanogpt_substrate.json, so the graded architecture is never resolved from a
# path the solver can reach.
substrate:
  declaration_version: nanogpt-substrate-v1
  agent_visible_path: environment/nanogpt_substrate.json
  verifier_path: tests/nanogpt_substrate.json
  sha256: 80d0cdd9a66e735c73214cc4bc18b434b0eb4d64f682a5a1cf3545cce3f6026e
  upstream: modded-nanogpt, records/track_3_optimization/
  architecture:
    vocab_size: 50304
    num_layers: 12
    model_dim: 768
    head_dim: 128
    num_heads: 6
    seq_len: 1024
  batch_tokens_per_step: 524288
  forward_passes_per_step: 1
  backward_passes_per_step: 1
  shape_signature: vocab=50304;layers=12;dim=768;head_dim=128;heads=6;seq=1024
  shape_signature_note: >-
    A checker may not open a file, so the shape the graded parameters actually had
    travels in the telemetry as this string and is compared against the constant
    mirrored into tests/checkers.py. That comparison is what makes the frozen
    architecture a graded fact rather than a claim in prose.

anchors:
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  gap: gap-oer-per-family-anchors-unmeasured
  note: >-
    F14 anchors are unmeasured, so no baseline_metric or target_metric number is
    invented here. The substrate's own published anchors, record 36 at 3250 steps
    and record 46 at 2690 steps, are anchors for the optimizer track over the full
    FineWeb10B corpus and are not anchors for a decoder trained on a generated
    corpus, so they are not borrowed into this slot. With either anchor unbound
    grade.py resolves the reward to 0.0 carrying reason anchors-absent-unnormalizable
    and records the verifier-computed agent_metric in the score document. The
    normalization arithmetic itself is exercised in seed/tasks/OER-19/adequacy.py
    against a declared fixture-supplied anchor pair, which is fixture material and is
    not a slot binding.
  second_gap: gap-oer19-reward-unnormalizable-until-anchors-bound
  direction_note: >-
    The metric is lower-is-better, so a bound anchor pair is ordered baseline above
    target. The single formula in task.toml serves both directions unchanged: the
    quotient reads 0.0 at the baseline and 1.0 at the target either way.

# The diversity statistic. Pure, deterministic, no model call, no network, no clock
# and no random source. Shipped in tests/ and mirrored byte-identically onto the
# agent surface, so the agent can compute the graded statistic over its own corpus
# before it asks for a score. Both copies are pinned; adequacy.py recomputes both
# digests and fails the lane if either moved. The module itself did not move in the
# substrate repin; only the excerpt length its caller passes is new, and that is
# bound below and published to the agent.
diversity_statistic:
  path: tests/diversity.py
  sha256: e880b1296de8c0800981b1e13354bf448bb0c206ab3eef11c3ad1e310fc35e07
  agent_visible_mirror: environment/tools/corpus_diversity.py
  mirror_sha256: e880b1296de8c0800981b1e13354bf448bb0c206ab3eef11c3ad1e310fc35e07
  normalization: oer19-lower-alnum-collapse/v1
  normalization_definition: >-
    Lowercase; keep [a-z0-9]; collapse every run of anything else to a single space.
    Token 3-grams over the result, repeats kept. Overlap between two samples is the
    Jaccard of their 3-gram sets.
  excerpt_note: >-
    The statistic reads the first diversity_excerpt_chars characters of each
    document rather than the whole of it. The statistic is quadratic in the document
    count and a bound document is a full 1024-token sequence, so an unbounded read
    would let the measurement cost dominate the run without making it more
    discriminating. The excerpt length is bound below and stated in instruction.md,
    so the agent computes the identical number over its own corpus.

frozen_trainer:
  path: tests/trainer.py
  sha256: 2e66a61baaee80afd4f004243209d0ee45fc0cb7313ca3eafc7056ab461f1438
  agent_visible_mirror: environment/frozen/trainer.py
  mirror_sha256: 2e66a61baaee80afd4f004243209d0ee45fc0cb7313ca3eafc7056ab461f1438
  contains: >-
    The canonical decoder at the substrate's operating point, its bound optimizer,
    the bound run length and the held-out evaluator. The architecture is read from
    the replicated substrate declaration at construction time rather than written
    into this file, so the decoder that trains is the decoder the substrate names.

frozen_shard_builder:
  path: tests/shards.py
  sha256: ca919dcd8a634ff6d45630d69838efa02b52b95b8b3674b16db0e5389b91163d
  agent_visible_mirror: environment/frozen/shards.py
  mirror_sha256: ca919dcd8a634ff6d45630d69838efa02b52b95b8b3674b16db0e5389b91163d
  contains: >-
    The GPT-2 byte-pair encoder and the nanoGPT shard container, magic 20240520 and
    version 1 in a 256-word int32 header followed by uint16 tokens. The submission's
    corpus is packed by this module into fineweb_train_000001.bin and read back by
    the same reader a FineWeb shard is read with, so the generated corpus and the
    substrate's corpus are consumed by one code path.

held_out_surface:
  path: tests/benchmark_held_out.jsonl
  external_source: https://huggingface.co/datasets/HuggingFaceFW/fineweb
  role: >-
    The verifier's held-out FineWeb validation split. It is the surface the graded
    loss is computed on and the reference set the near-duplicate gate measures
    against. It is absent from every agent-visible container and the path is a
    constant in tests/grade.py rather than a value resolved from the telemetry, an
    environment variable or anything the submission can reach.
  agent_visible: false
  agent_visible_dev_split: environment/frozen/benchmark_dev.jsonl
  dev_split_note: >-
    The dev split on the agent surface is authored material with the same shape as
    the held-out split. It is not sampled from the held-out split, shares no item
    with it, and is never read on the graded path. It exists so a generator can be
    checked against a realistic document shape without the evaluation surface being
    published.

# Every bound below is mirrored as a module constant in tests/checkers.py, and
# adequacy.py asserts the two agree, so the manifest a reader audits and the code
# that runs cannot drift apart.
bounds:
  normalization_id: oer19-lower-alnum-collapse/v1
  corpus_documents: 512
  bound_document_tokens: 1024
  bound_shard_tokens: 524288
  diversity_excerpt_chars: 512
  segment_count: 8
  prefix_points: 4
  ngram_width: 3
  mode_share_threshold: 0.60
  max_mode_share_ceiling: 0.08
  collapse_relative_fraction: 0.65
  near_duplicate_threshold: 0.55
  sustain_tolerance: 0.50
  self_report_tolerance: 0.02
  bound_steps: 96
  bound_tokens_fed: 50331648
  bound_epochs: 96
  bound_evaluation_point: 96
  scheduled_points: [64, 80, 96]
  counter_source: harness-trainer
  weights_source: harness-trainer
  bounds_derivation: >-
    The corpus is bound at 512 documents of 1024 tokens, which is 524288 tokens,
    which is exactly one optimizer step's worth of tokens at the substrate's frozen
    batch size. One pass over the corpus is therefore exactly one step, which is why
    bound_epochs and bound_steps are the same integer instead of two numbers that
    have to be reconciled. bound_tokens_fed is 96 times 524288. The three scheduled
    points sit at two thirds, five sixths and the whole of the run, which are the
    same three ratios this slot carried over its previous run length, re-expressed
    over 96 steps and landing on integers.
  sustain_tolerance_derivation: >-
    Provisional, and a slot binding rather than a substrate value. The previous
    tolerance of 0.08 was calibrated against an accuracy and does not carry over to
    a cross-entropy in nats, so it was re-derived rather than reused. Half a nat is
    bound because it is wider than both the accumulation noise of a seeded run on an
    accelerator and the movement of the reading across the final third of the run,
    and narrower than the gap between a diverse corpus and a collapsed one. It is
    recorded as provisional under gap-oer19-sustain-tolerance-unmeasured until the
    feasibility exercise measures the separation on the reference generator.

advisory_bounds:
  segment_distinct_ngram_floor: 0.34
  note: >-
    An advisory floor only. It is published to the agent through
    environment/tools/corpus_diversity.py and the reference generator self-gates on
    it, but no graded checker enforces it, because a uniformly low-diversity corpus
    is already graded by corpus_mode_share_bounded and a second gate on the same
    shape would fire two reasons for one defect. Recorded here rather than left
    implicit.

ast_allowlist:
  applies_to: [tests/checkers.py, tests/diversity.py]
  imports: [json, math, hashlib, pathlib, dataclasses, typing, __future__]
  imports_note: >-
    __future__ is a compiler directive, not a runtime import: it binds no module
    object and reaches no resource. It is declared rather than silently tolerated.
  banned_names: [random, time, datetime, os, sys, subprocess, socket, urllib, requests, open, eval, exec, __import__, input, getenv, environ]
  enforced_by: seed/tasks/OER-19/adequacy.py
  not_applicable_to: [tests/trainer.py, tests/shards.py, tests/runner.py]
  not_applicable_note: >-
    The trainer, the shard builder and the runner are the measuring path, not the
    checking path. They import torch, numpy and tiktoken, they write a shard into a
    temporary directory and they read the held-out split, so the allowlist that
    keeps a checker pure does not and cannot apply to them. What constrains them
    instead is that they run inside the verifier with egress denied, they read no
    submission-authored number into a graded field, and every counter they report is
    incremented at the point of the work it counts.
  note: >-
    Enforced by walking the AST on every adequacy run, not asserted. Checker code
    reads no planted file, no environment secret, no clock, no network and no random
    source, and never imports the submission. Every number a checker reads comes
    from the telemetry record tests/runner.py produced inside the verifier's own
    process.

isolation:
  statement: >-
    tests/runner.py copies the submission alone into a fresh temporary directory,
    launches it as a new session leader under the environment allowlist
    PATH, PYTHONPATH, PYTHONHASHSEED, LC_ALL, LANG, HOME, TMPDIR, captures its
    output, and kills the whole process group in a finally block. tests/grade.py
    imports the checkers and the runner and never imports the submission.
  documented_deviation: >-
    The read-only frozen tools directory is placed on the submission's PYTHONPATH,
    exactly as the agent's own sandbox provides it, and TIKTOKEN_CACHE_DIR is
    forwarded so the submission can encode its own documents against the same warmed
    tokenizer cache the verifier uses with egress denied. No bundle solution/ or
    tests/ byte travels with the submission, and the held-out split is not among the
    bytes the submission can reach. A submission graded without the tool the task
    instructs it to use would be graded on a surface the agent never had.

checkers:
  - id: generator_collapse_absent
    statement: >-
      The generator ran to completion without collapsing to a low-diversity mode
      partway through: it emitted the bound corpus size of 512 documents, the
      emission timeline carries the bound number of segments, and no segment's
      distinct-trigram ratio fell below 0.65 of the strongest segment the run ever
      produced.
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: generator_collapse_absent
    zero_reason: generator-collapsed-silently
    required: true
    weight: 3
    live_state_read: >-
      telemetry["corpus"]["segment_distinct_ngram_ratio"], ["documents"] and
      ["segment_count"], computed by tests/runner.py:produce_telemetry from the
      corpus bytes the run left on disk, inside the verifier's own process.
    compiled_test: "tests/test_output.py::test_generator_collapse_absent"
    drift_keys: [segment_distinct_ngram_ratio]
    basis: computed
    count_predicate: "collected > 0 and failed == 0"
    note: >-
      This is the archetype gate. A generator that exits zero while emitting a
      degenerate corpus is caught here and graded as a failure with this reason,
      which is deliberately distinct from any poor-loss reason: a degenerate corpus
      that happens to train to a loss above the floor is still a collapse and is
      named one. The comparison is against the strongest segment rather than the
      first, so a generator cannot set a low bar by opening degenerately.

  - id: corpus_mode_share_bounded
    statement: >-
      The share of the corpus sitting in one near-duplicate neighbourhood stays at
      or below 0.08, both over the whole corpus and at each of the four prefix
      points the verifier reads, under the bound normalization, the bound excerpt
      length and the bound overlap threshold.
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: corpus_mode_share_bounded
    zero_reason: corpus-mode-share-exceeded
    required: true
    weight: 3
    live_state_read: >-
      telemetry["corpus"]["max_mode_share"], ["prefix_mode_share"],
      ["mode_share_threshold"], ["diversity_excerpt_chars"] and ["normalization"],
      computed by tests/diversity.py:mode_share inside tests/runner.py.
    compiled_test: "tests/test_output.py::test_corpus_mode_share_bounded"
    drift_keys: [corpus_diversity_floor]
    basis: computed
    count_predicate: "prefix points collected > 0 and failed == 0"
    note: >-
      Overlap, not equality. A generator emitting one template with a rotating
      integer produces documents that are never byte-identical, so exact-duplicate
      counting reports a clean corpus while this reports the collapse. This is the
      gate that carries most of the load now that the corpus feeds a language model:
      a 512-document corpus is cycled 96 times, so a dense neighbourhood is seen 96
      times and the decoder memorises it instead of generalising to the held-out
      split.

  - id: emission_order_monotone
    statement: >-
      The recorded emission sequence is strictly ascending and contiguous from zero,
      so the per-segment reading is a statement about the run's timeline rather than
      about a reordering of the file.
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: emission_order_monotone
    zero_reason: emission-order-not-monotone
    required: true
    weight: 2
    live_state_read: >-
      telemetry["corpus"]["emission_sequence"], read by tests/runner.py:read_corpus
      from the corpus bytes the run left on disk.
    compiled_test: "tests/test_output.py::test_emission_order_monotone"

  - id: no_benchmark_near_duplicate
    statement: >-
      No generated document overlaps a held-out FineWeb validation item at or above
      the bound Jaccard threshold of 0.55 under the declared normalization
      oer19-lower-alnum-collapse/v1 over the bound excerpt.
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: no_benchmark_near_duplicate
    zero_reason: benchmark-near-duplicate-emitted
    required: true
    weight: 3
    live_state_read: >-
      telemetry["corpus"]["benchmark_near_duplicate_hits"] and
      ["near_duplicate_threshold"], computed by tests/diversity.py:near_duplicates
      against tests/benchmark_held_out.jsonl inside the verifier's own process.
    compiled_test: "tests/test_output.py::test_no_benchmark_near_duplicate"
    drift_keys: [benchmark_near_duplicate_hits]
    limitation: >-
      A bound Jaccard threshold over a declared normalization is not a semantic
      equivalence oracle. A deep paraphrase below the threshold is not caught. This
      is recorded rather than papered over, and is carried in shortcut_probes.yaml
      as a named residual risk. The residual is smaller than it was, because the
      agent cannot see the held-out split at all and would have to reconstruct
      FineWeb validation text rather than paraphrase a published item.

  - id: early_stop_does_not_establish_score
    statement: >-
      No early stop: the run reports terminated_early false and reached every
      evaluation point the verifier scheduled, including the bound point at step 96.
      A run halted at a favourable evaluation is graded as not having established the
      score, never as an absent result.
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: early_stop_does_not_establish_score
    zero_reason: early-stop-score-not-established
    required: true
    weight: 2
    live_state_read: >-
      telemetry["training"]["terminated_early"] and
      telemetry["evaluation"]["points"], from the frozen trainer's own counters and
      the verifier's own scheduled evaluations.
    compiled_test: "tests/test_output.py::test_early_stop_does_not_establish_score"
    drift_keys: [evaluation_sustain_points]

  - id: training_budget_as_fed
    statement: >-
      The frozen training budget was respected as actually fed: 96 optimizer steps,
      50331648 tokens fed, 96 completed passes over a 512-document corpus that packed
      to a 524288-token shard, and exactly one forward and one backward pass per
      step, counted by the harness trainer at the point of feeding.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: training_budget_as_fed
    zero_reason: training-budget-overspent
    required: true
    weight: 2
    live_state_read: >-
      telemetry["training"]["steps"], ["tokens_fed"], ["epochs_completed"],
      ["forward_passes"], ["backward_passes"] and ["counter_source"], incremented
      inside tests/trainer.py:train where the work happens, never a figure a caller
      requested; and telemetry["corpus"]["shard_tokens"] from the shard the corpus
      packed into.
    compiled_test: "tests/test_output.py::test_training_budget_as_fed"
    drift_keys: [counter_source]
    note: >-
      The forward and backward counts are read here rather than assumed. They are
      the difference between a run that trained and a run that reported: a path with
      the passes removed increments neither counter and is named a budget failure at
      this gate, before any reading downstream of it is consulted. That is the
      no-forward-pass-no-score property made into a gate rather than left as a hope.

  - id: unsmoothed_graded_readout
    statement: >-
      The graded readout is raw. It was produced with kind raw, window 1 and no EMA
      alpha, and it equals the exact quotient of the summed negative log likelihood
      over the token count the verifier's own evaluator recorded at the bound point.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: unsmoothed_graded_readout
    zero_reason: readout-smoothing-on-graded-path
    required: true
    weight: 3
    live_state_read: >-
      telemetry["evaluation"]["readout"], ["graded_nll_sum"], ["graded_tokens"] and
      ["graded_loss"], from tests/trainer.py:evaluate inside the verifier.
    compiled_test: "tests/test_output.py::test_unsmoothed_graded_readout"
    note: >-
      A submission may smooth, blend or average anything it likes for its own use.
      The graded quantity is recomputed unsmoothed by the verifier, so a smoothed
      readout on the graded path scores zero with this reason. The quantity moved
      from an accuracy to a mean token cross-entropy when this slot was repinned to
      the nanoGPT substrate; the test did not move, because a mean is still the
      quotient of the two accumulators it summarises.

  - id: score_sustained_across_scheduled_points
    statement: >-
      The graded reading is sustained: at every point the verifier scheduled, 64, 80
      and 96, the held-out loss sits within 0.50 of the graded reading, so a single
      favourable evaluation cannot be harvested.
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: score_sustained_across_scheduled_points
    zero_reason: score-not-sustained
    required: true
    weight: 3
    live_state_read: >-
      telemetry["evaluation"]["points"] and ["sustain_tolerance"], one entry per
      point the verifier itself scheduled and evaluated.
    compiled_test: "tests/test_output.py::test_score_sustained_across_scheduled_points"
    drift_keys: [points]
    note: >-
      The band is two-sided. Under a lower-is-better loss a harvestable reading is a
      transient dip at the bound point, which the one-sided floor this checker
      carried under a higher-is-better accuracy would not have caught, so the test is
      on the absolute difference and a spike is refused by the same arithmetic that
      refuses a dip.

  - id: graded_score_from_harness_model_state
    statement: >-
      The evaluated parameters are the harness decoder's own state at the bound
      evaluation point, and they carry the frozen architecture: the weights source is
      the harness trainer, the parameter shape signature is
      vocab=50304;layers=12;dim=768;head_dim=128;heads=6;seq=1024, the snapshot
      carries at least 100000000 parameters, the graded point is 96, and the graded
      parameter digest equals the digest the harness recorded for its own state at
      that step.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: graded_score_from_harness_model_state
    zero_reason: score-not-from-harness-model-state
    required: true
    weight: 3
    live_state_read: >-
      telemetry["evaluation"]["weights_source"], ["parameter_shape_signature"],
      ["parameter_count"], ["graded_point"], ["model_state_digest"] and
      ["graded_model_state_digest"], from the parameter snapshots
      tests/trainer.py:train digested at the scheduled steps.
    compiled_test: "tests/test_output.py::test_graded_score_from_harness_model_state"
    note: >-
      This is the weights-in-the-loop gate. Three things have to hold together: the
      parameters carry the frozen decoder's shape, they are the harness trainer's own
      state, and the state the reading was taken from is the state the harness
      recorded at the bound point. A weight table of some other shape fails the
      first, a submission-supplied snapshot fails the second, and a reading lifted
      from another checkpoint fails the third.

  - id: self_report_matches_recomputation
    statement: >-
      The run's own measurement of its corpus agrees with the verifier's
      recomputation: a self-report is present and its declared distinct-trigram
      ratio and mode share sit within 0.02 of the recomputed values, with the
      declared document count exact.
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: self_report_matches_recomputation
    zero_reason: self-report-diverges-from-recomputation
    required: true
    weight: 2
    live_state_read: >-
      telemetry["self_report"] against telemetry["corpus"], the first carried
      verbatim from the submission's run_report.json and the second recomputed by
      tests/diversity.py inside the verifier.
    compiled_test: "tests/test_output.py::test_self_report_matches_recomputation"
    note: >-
      This is the only checker that touches a submission-authored value, and it
      touches it solely as the subject of a divergence test. No submission-authored
      number ever contributes to a score. A run that never measured its own corpus
      fails here, which is what makes detection a skill under test rather than a
      coin flip.

substituted_halves: []
substitution_note: >-
  No checker required a substituted rejecting half. Every one of the ten is fired
  by a fixture derived from solution/grounding.yaml through solution/recompute.py,
  and every one of the ten passes on the accepting fixture bound to the reference
  generator by sha256. Both halves are executed by seed/tasks/OER-19/adequacy.py.
  The fixtures carry telemetry schema forge.oer19.telemetry/v2 and must be
  regenerated by the deriver against the repinned declarations before this slot is
  frozen; that regeneration is recorded as an open item and is not asserted here as
  done.

additional_zero_reasons:
  - id: anchors-absent-unnormalizable
    emitted_by: tests/grade.py
    meaning: every gate passed and the reward cannot be normalized because the F14 anchors are absent
  - id: anchors-degenerate-interval
    emitted_by: tests/grade.py
    meaning: a supplied anchor pair has a zero-width interval, so the formula has no denominator
  - id: score-at-or-below-baseline
    emitted_by: tests/grade.py
    meaning: every gate passed and the clipped normalized score landed at the floor
  - id: telemetry-absent
    emitted_by: tests/grade.py
    meaning: no measurement document reached grading, or the run resolved no finite held-out loss
  - id: grading-process-failed
    emitted_by: tests/test.sh
    meaning: the grading process exited non-zero or left no verdict
  - id: verifier-aborted-before-grading
    emitted_by: tests/test.sh
    meaning: the EXIT trap fired before grading completed, so a reason is left rather than silence
