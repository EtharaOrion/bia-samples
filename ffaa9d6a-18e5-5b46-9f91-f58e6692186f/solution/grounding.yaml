schema: forge.grounding/v1

# PRIVATE. This file is the single derivation source for slot OER-14. `recompute.py` reads
# this file and nothing else, and derives from it: the frozen corpus, the harness control
# table, the golden trajectory, the checker fixture plan, solve.sh, TRUTH.md, rubrics.json
# and tests/test_output.py. It invokes no model, no network, no clock, no locale and no
# random source, so running it twice over frozen bytes produces byte-identical output.

identity:
  slot: OER-14
  provisional_identifier: OER-14
  provisional_identifier_note: >-
    The slot id IS the provisional identifier. No canonical_content_hash is computed here,
    no uuid5 is derived, no uuid-named directory is created, no canary token is planted, no
    provenance carrier is written and no signature file exists. Wave 2 does identity for
    every slot at once, because adding solution/policy.yaml to an already-committed bundle
    moves its hash too.
  family: F10
  family_title: tokenizer and vocabulary construction
  title: Long-horizon vocabulary search under a fixed compute budget
  primary_archetype: AR1
  primary_archetype_name: Long-Horizon State Collapse
  archetype_exclusivity: >-
    Exactly one primary archetype, fixed at scope time. No buffet within the slot. Other
    archetypes may be visible in the surface and are decorative; none is claimed.

bindings:
  # Transcribed from seed/contract.yaml batch.optimization_bindings. Never recomputed here.
  tags: [optimization, bounded-continuous]
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator ACROSS attempts
  budget_hours: 0.12
  budget_hours_minutes: 7.2
  budget_hours_role: per-attempt completion bound, ONE attempt
  budget_hours_provisional: true
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  never_aliases: >-
    max_timeout and budget_hours are never aliases. 6.0 h bounds the session across
    attempts; 0.12 h bounds one attempt. Binding 6 into the per-attempt field would bind a
    three-hundred-hour session that every well-formedness check would still pass.
  max_attempts: 50
  final_selection: best
  compute_envelope: one H100, single accelerator, no multi-GPU scaling
  compute_envelope_accelerators: 1
  budget_margin: 10 percent
  budget_margin_note: carried by name, never recomputed
  image_digest: "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier_note: >-
    This task family is text and code only, so the Perception axis carries no category. The
    exemption is batch-level, recorded once, closes by nothing, and no perception lever is
    authored to fill it. It caps the anchorable tier below Hard while leaving the authoring
    target at Frontier-defeat.

reward_schema:
  carrier: /logs/verifier/reward.txt
  carrier_form: one bare float, no JSON wrapper
  score_document: /logs/verifier/score.json
  interval: [0.0, 1.0]
  direction: higher is better
  binary: false
  full_reward: 1.0
  metric: bits per byte at fixed compute
  metric_direction: lower
  formula: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
  clip: "score = min(max(raw, 0.0), 1.0)"
  bar_not_gradient: reaching the target scores exactly 1.0 and beating it also scores 1.0

anchors:
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  pass_threshold: null
  gap: gap-oer-per-family-anchors-unmeasured
  absent_reason: >-
    seed/contract.yaml families.entries.F10 carries scope_state unscoped and
    requirements/bia-environment-spec.md line 63 leaves this family's baseline, target and
    instance count unresolved. No value may be invented for them here, so the schema is
    bound in full and the two numbers are declared absent.
  resolution_mechanism: run_local_harness_controls
  resolution_mechanism_detail: >-
    The reward formula's two anchors are RESOLVED AT GRADE TIME by control runs the verifier
    performs itself, never by a number written into this bundle. baseline_metric is the best
    bits per byte reachable by a SINGLE-DIRECTION sweep, measured by the harness by spending
    the entire slot budget on each construction family in turn and taking the best. It is the
    exact score a greedy sweep of one direction reaches, so a greedy sweep scores 0.0 by
    construction. target_metric is the bits per byte of the harness's own reference
    reallocated construction, measured the same way at the same frozen compute budget. Both
    are measurements the verifier's process makes; neither is an authored constant, and this
    lane writes neither number into task.toml.

solver_egress_divergence:
  bound_in_this_bundle: open
  bound_where: task.toml [agent] solver_egress
  batch_level_field: setup-only
  batch_level_field_location: seed/contract.yaml batch.optimization_bindings.solver_egress
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving
    model full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says internet is
    needed only for setup, and requirements/bia-environment-spec.md line 247 rules that the
    stricter reading governs until the client resolves it.
  what_this_lane_does: >-
    Binds `open` at the agent surface, as the lane brief requires, and records the divergence
    here rather than amending the batch-level field. The batch-level field still reads
    setup-only and is NOT amended by this lane. The divergence is never silent.
  verifier_surface: egress denied, bound in task.toml [verifier] egress
  deny_list: [github.com, raw.githubusercontent.com, objects.githubusercontent.com]
  deny_list_is_not_containment: >-
    The deny-list is not a containment proof. Mirrors, caches, paraphrased write-ups and
    released model weights all carry a recipe past any deny-list. That is exactly why the
    deterministic checker chain and not the network policy is the load-bearing control here.

substrate:
  module: environment/substrate.py
  frozen:
    - the model, a back-off bigram over token ids with frozen smoothing constants
    - the optimizer, which is the frozen count-accumulation training procedure
    - the evaluation corpus, environment/corpus/eval.txt
    - the compute budget, 6000 training units, metered by a harness-owned counter
    - the slot budget, 1200 family slots, so allocation is genuinely zero-sum
  free:
    - the vocabulary construction, which byte-strings become tokens
    - the size allocation across the four frozen construction families
    - any extra tokens named directly by the submission
  directions: [merge_depth, span_units, numeric_units, punct_units]
  flattened_direction: merge_depth
  flattening_mechanism: >-
    A byte pair is an admissible merge only at or above MERGE_MIN_FREQUENCY, which is 50, so
    the frozen training corpus carries a FINITE number of admissible merges. Measured on the
    frozen corpus, that number is 413. Past it an extra merge slot buys exactly nothing and
    the marginal gain is exactly 0.0. Nothing announces it. Because the slot budget is
    zero-sum, a slot spent past the knee is a slot no other family gets.

corpus:
  # Deterministic and combinatorial. No PRNG of any kind is used to build it: every choice
  # is a fixed index arithmetic over a fixed table, so the bytes are a pure function of these
  # parameters. The leading banner line is part of the corpus bytes and is counted.
  banner: "# GENERATED SECTION. DO NOT HAND-EDIT. source: solution/grounding.yaml"
  stride: 7919
  offset: 13
  # Every entry is quoted because YAML 1.1 reads bare `on`, `off`, `no`, `yes` and `in`
  # as booleans, and a table entry silently turning into `False` would move the corpus bytes.
  word_prefixes: ["al", "bi", "cor", "del", "en", "fro", "ga", "har", "in", "jo", "ker", "led", "mat", "neu", "off", "par", "quo", "rea", "sec", "ten"]
  word_suffixes: ["pha", "nder", "pus", "ta", "gine", "zen", "ther", "bor", "dex", "iner", "nel", "ger", "rix", "ron", "set", "ser", "rum", "der", "tor", "sor"]
  word_limit: 400
  ident_limit: 24
  fields: [id, seq, code, rank, slot, mass, span, unit]
  operators: ["==", "!=", "<=", ">=", "->", "::", "+=", "*=", "//", "&&", "||", "**"]
  tags: [ok, hold, drop, keep, warn, info]
  code_count: 240
  code_stride: 3607
  code_offset: 911
  code_multiplier: 7919
  train_start: 0
  train_lines: 1800
  eval_start: 50000
  eval_lines: 500

controls:
  # The control table the verifier runs at grade time to RESOLVE the two anchors. The
  # allocations are authored; the two numbers they produce are measured, never authored.
  single_direction_sweep:
    merge_depth: {merge_depth: 1200}
    span_units: {span_units: 1200}
    numeric_units: {numeric_units: 1200}
    punct_units: {punct_units: 1200}
  reference_allocation: {merge_depth: 448, span_units: 500, numeric_units: 124, punct_units: 0}

golden_trajectory:
  # The reference session. Nine attempts sweep the one direction that pays until it stops
  # paying, two attempts reallocate off it, one attempt probes a direction that turns out not
  # to pay. Under final_selection `best` the graded submission is the best carried attempt.
  flatten_epsilon_bits: 0.005
  flatten_run_required: 2
  graded_attempt: 11
  attempts:
    - {index: 1,  direction: merge_depth,   allocation: {merge_depth: 64},  reallocated_from: null}
    - {index: 2,  direction: merge_depth,   allocation: {merge_depth: 128}, reallocated_from: null}
    - {index: 3,  direction: merge_depth,   allocation: {merge_depth: 192}, reallocated_from: null}
    - {index: 4,  direction: merge_depth,   allocation: {merge_depth: 256}, reallocated_from: null}
    - {index: 5,  direction: merge_depth,   allocation: {merge_depth: 320}, reallocated_from: null}
    - {index: 6,  direction: merge_depth,   allocation: {merge_depth: 384}, reallocated_from: null}
    - {index: 7,  direction: merge_depth,   allocation: {merge_depth: 448}, reallocated_from: null}
    - {index: 8,  direction: merge_depth,   allocation: {merge_depth: 512}, reallocated_from: null}
    - {index: 9,  direction: merge_depth,   allocation: {merge_depth: 800}, reallocated_from: null}
    - {index: 10, direction: span_units,    allocation: {merge_depth: 448, span_units: 500}, reallocated_from: merge_depth}
    - {index: 11, direction: numeric_units, allocation: {merge_depth: 448, span_units: 500, numeric_units: 124}, reallocated_from: merge_depth}
    - {index: 12, direction: punct_units,   allocation: {merge_depth: 448, span_units: 500, numeric_units: 124, punct_units: 128}, reallocated_from: merge_depth}

drift_state:
  # Mirrors seed/tasks/OER-14/drift.yaml. The harness records the CURRENT admin-plane state
  # into its telemetry, and each silent mutation's bound checker reads the exact key it moved.
  initial:
    graded_denominator_key: submission_reported_bytes
    graded_readout_filter: ema-0.9
    compute_meter_source: training-loop-assertion
    paying_direction: merge_depth
    evaluation_points_scheduled: 1
  final:
    graded_denominator_key: frozen_eval_byte_count
    graded_readout_filter: none
    compute_meter_source: harness-counter
    paying_direction: numeric_units
    evaluation_points_scheduled: 3

checkers:
  # id -> the planted defect that fires it and the reason it must emit. recompute.py turns
  # this into solution/fixtures/plan.json and into one compiled test per checker.
  - id: graded_bpb_recomputed_unsmoothed
    reduction: VALUE
    zero_reason: readout-smoothing-on-graded-path
    firable_by_submission: false
    substitution: >-
      No submission can put a filter on the graded readout, because the harness owns the
      readout and computes it from its own model state. The rejecting half is carried on a
      planted telemetry fixture and the substitution is recorded in tests/checkers.yaml.
    defect: {kind: set_point_field, field: filter, value: "ema-0.9"}
  - id: denominator_is_frozen_eval_byte_count
    reduction: VALUE
    zero_reason: denominator-not-frozen-eval-bytes
    firable_by_submission: true
    defect: {kind: set_point_field, field: denominator_bytes, value: 4096}
  - id: compute_spend_within_frozen_budget
    reduction: VALUE
    zero_reason: compute-budget-overspent
    firable_by_submission: true
    defect: {kind: set_meter_field, field: spent_units, value: 999999}
  - id: evaluated_state_is_harness_owned
    reduction: VALUE
    zero_reason: state-not-harness-owned
    firable_by_submission: false
    substitution: >-
      A submission never runs inside the grading process, so it cannot substitute the state
      that is evaluated. The rejecting half is carried on a planted telemetry fixture.
    defect: {kind: set_point_field, field: state_source, value: submission-selected-checkpoint}
  - id: early_stop_does_not_establish_reading
    reduction: EFFECT
    zero_reason: early-stop-not-established
    firable_by_submission: true
    defect: {kind: unreach_point, point: 3}
  - id: reading_sustained_across_scheduled_points
    reduction: INVARIANT
    zero_reason: reading-not-sustained
    firable_by_submission: false
    substitution: >-
      A dip wide enough to break the band cannot be produced on demand by a spec, because the
      readings are the harness's own and move smoothly in the flat tail of the training curve.
      The rejecting half is carried on a planted telemetry fixture that widens one point.
    defect: {kind: scale_point_bits, point: 1, factor: 4.0}
  - id: no_submission_reported_number_on_graded_path
    reduction: ABSENCE
    zero_reason: submission-reported-metric-on-graded-path
    firable_by_submission: false
    substitution: >-
      grade.py consumes a fixed key list that never includes a submission field, so no
      submission can add itself to it. The rejecting half is carried on a planted fixture
      that adds a submission-owned key to the consumed list.
    defect: {kind: add_consumed_key, value: "submission.reported_bpb"}
  - id: reallocation_follows_flattening
    reduction: ORDERING
    zero_reason: flattened-direction-not-reallocated
    firable_by_submission: true
    defect: {kind: truncate_attempts, keep: 9}
  - id: carried_direction_frontier_never_collapses
    reduction: INVARIANT
    zero_reason: carried-state-collapsed
    firable_by_submission: true
    defect: {kind: drop_frontier_key, attempt: 11, key: merge_depth}
  - id: graded_band_exceeds_single_direction_sweep
    reduction: DIVERGENCE
    zero_reason: single-direction-sweep-not-exceeded
    firable_by_submission: true
    defect: {kind: set_graded_allocation, allocation: {merge_depth: 1200}}
  - id: corpus_phase_matches_frozen_offset
    reduction: VALUE
    zero_reason: frozen-corpus-phase-not-established
    firable_by_submission: false
    discovery_value: offset
    discovery_value_note: >-
      `corpus.offset` is established ONLY in the built environment: it is the phase of the
      fixed index arithmetic every corpus line is picked by, so it is readable off
      environment/corpus/eval.txt and appears in no agent-visible byte. The probe isolates it
      exactly: the first record line of the evaluation corpus stands at index eval_start,
      which is congruent to 0 modulo len(fields), so its opening field name sits at table
      position `offset % len(fields)` and the stride term cancels identically. A solver that
      never read the corpus cannot produce that position, and the checker's outcome moves the
      moment the phase moves.
    substitution: >-
      No submission can move the phase of the frozen corpus, because the corpus is frozen and
      the harness reads it back off disk inside the verifier process. The rejecting half is
      carried on a fixture that perturbs the frozen construction phase this checker derives
      its expectation from, so the accepting half is the grounding-derived phase and the
      rejecting half is a wrong one.
    defect: {kind: perturb_corpus_param, param: offset, delta: 1}
  - id: corpus_period_matches_frozen_stride
    reduction: VALUE
    zero_reason: frozen-corpus-period-not-established
    firable_by_submission: false
    discovery_value: stride
    discovery_value_note: >-
      `corpus.stride` is established ONLY in the built environment: it is the step of the same
      fixed index arithmetic, so it is readable off environment/corpus/eval.txt and appears in
      no agent-visible byte. The probe isolates it exactly: consecutive field names inside one
      record line advance by `stride % len(fields)` and the offset term cancels identically,
      so the observed step is a function of the stride alone. A solver that never read the
      corpus cannot produce that step, and the checker's outcome moves the moment it moves.
    substitution: >-
      No submission can move the period of the frozen corpus, for the same reason. The
      rejecting half is carried on a fixture that perturbs the frozen construction stride this
      checker derives its expectation from, so the accepting half is the grounding-derived
      stride and the rejecting half is a wrong one.
    defect: {kind: perturb_corpus_param, param: stride, delta: 1}

negative_controls:
  - {id: neg-no-op, statement: "the submission changes nothing and returns the default byte-level construction", spec: {allocations: {}}, expect_reason: single-direction-sweep-not-exceeded}
  - {id: neg-greedy-sweep, statement: "the whole attempt budget is spent sweeping one direction past its knee", spec: {allocations: {merge_depth: 1200}}, expect_reason: single-direction-sweep-not-exceeded}
  - {id: neg-denominator-swap, statement: "the submission divides by a byte count of its own choosing", spec: {allocations: {merge_depth: 448, span_units: 500, numeric_units: 124}, denominator_override: 4096}, expect_reason: denominator-not-frozen-eval-bytes}
  - {id: neg-compute-overspend, statement: "the submission asks for more training compute than the frozen budget", spec: {allocations: {merge_depth: 448, span_units: 500, numeric_units: 124}, train_units_requested: 60000}, expect_reason: compute-budget-overspent}
  - {id: neg-smoothed-readout, statement: "the submission asks for an EMA-blended graded readout", spec: {allocations: {merge_depth: 448, span_units: 500, numeric_units: 124}, graded_readout_filter: "ema-0.9"}, expect_reason: readout-smoothing-on-graded-path}
  - {id: neg-early-stop, statement: "the run halts at the first favourable evaluation point", spec: {allocations: {merge_depth: 448, span_units: 500, numeric_units: 124}, stop_after_point: 1}, expect_reason: early-stop-not-established}
  - {id: neg-reported-metric, statement: "the submission reports its own bits per byte and expects it to be read", spec: {allocations: {merge_depth: 448, span_units: 500, numeric_units: 124}, reported_bpb: 0.01}, expect_reason: submission-reported-metric-on-graded-path}
  - {id: neg-stale-answer, statement: "a verdict carried forward from before the silent mutation, computed on the pre-flattening surface", trajectory_defect: {kind: truncate_attempts, keep: 9}, expect_reason: flattened-direction-not-reallocated}
  - {id: neg-no-reallocation, statement: "flattening is observed and no allocation moves off the flattened direction", trajectory_defect: {kind: strip_reallocations}, expect_reason: flattened-direction-not-reallocated}
  - {id: neg-carried-collapse, statement: "the carried per-direction frontier is truncated between attempts", trajectory_defect: {kind: drop_frontier_key, attempt: 11, key: merge_depth}, expect_reason: carried-state-collapsed}
  - {id: neg-unsustained, statement: "the reading exists at one scheduled point and nowhere else", telemetry_defect: {kind: scale_point_bits, point: 1, factor: 4.0}, expect_reason: reading-not-sustained}
  - {id: neg-selected-checkpoint, statement: "the evaluated state is a checkpoint the submission chose", telemetry_defect: {kind: set_point_field, field: state_source, value: submission-selected-checkpoint}, expect_reason: state-not-harness-owned}

statement_ambiguity:
  claim: exactly one graded outcome
  reading_one:
    source: instruction.md section "What is graded"
    reduces_to: >-
      the maximum, over the verifier-scheduled evaluation points, of the harness's own bits
      to code environment/corpus/eval.txt divided by the byte length of that same file, at a
      compute spend the harness counter measured at or below the frozen budget.
  reading_two:
    source: instruction.md section "The frozen axes" read together with environment/substrate.py measure()
    reduces_to: >-
      the maximum, over the verifier-scheduled evaluation points, of the harness's own bits
      to code environment/corpus/eval.txt divided by the byte length of that same file, at a
      compute spend the harness counter measured at or below the frozen budget.
  identical: true
  how_checked: >-
    adequacy.py drives both readings as two independent computations over the same reference
    telemetry and asserts the two floats are bit-identical, so the instruction admits one
    reading of what is optimized rather than two that happen to agree in the reference case.

rubrics:
  # tests/rubrics.jsonl is hand-authored and judged against the TRAJECTORY. This block is the
  # source for solution/rubrics.json, which grades the SOLUTION against its reference answer.
  # The two files are different files with different jobs and neither substitutes for the other.
  solution_criteria:
    - {id: sol-allocation-matches-reference, criterion: "the submitted allocation reallocates off merge_depth into span_units and numeric_units, as the reference does"}
    - {id: sol-slot-budget-respected, criterion: "the submitted allocation spends no more than the frozen slot budget"}
    - {id: sol-no-request-fields, criterion: "the submitted spec carries no denominator override, no readout filter, no early stop and no reported metric"}
    - {id: sol-compute-request-within-budget, criterion: "the submitted spec requests no more training units than the frozen budget"}
    - {id: sol-reaches-target-band, criterion: "the harness reading for the submitted allocation reaches the target the reference control measured"}

truth:
  headline: The graded quantity is a fraction whose numerator and denominator the harness owns.
  points:
    - The metric is bits per byte at FIXED COMPUTE. A vocabulary that lowers bits per byte by spending more compute has not won, and the harness counter is what decides that, not the training loop's own claim.
    - The denominator is the byte length of environment/corpus/eval.txt and nothing else. A construction that normalizes, strips or drops evaluation bytes and divides by what survives has changed what it measures over, which scores zero with reason denominator-not-frozen-eval-bytes.
    - The graded reading is the WORST reading across three verifier-scheduled evaluation points, so a favourable fluctuation at one point is not a level.
    - merge_depth stops paying at 413 admissible merges and nothing announces it. The slot budget is zero-sum, so every slot spent past that point is a slot span_units and numeric_units do not get.
    - The reward band is anchored on the harness's own single-direction sweep, so a greedy sweep of one direction scores exactly 0.0 no matter how many of the fifty attempts it consumes.

