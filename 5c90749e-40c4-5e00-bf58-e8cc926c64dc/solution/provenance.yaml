hash_recipe:
  name: bia.s01/canonical/v1
  implemented_by: solution/recompute.py --hash
  steps:
    - Walk the bundle root and collect every regular file as a relative POSIX path.
    - Exclude every path under trajectories/, exclude solution/provenance.sig, and exclude every .pyc file and every __pycache__ directory.
    - Sort the remaining relative paths bytewise ascending.
    - Seed a sha256 with the literal ASCII bytes "bia.s01/canonical/v1" followed by one newline.
    - For each path in order, read its bytes, apply the binding normalization below, then feed the four byte big endian length of the path, the utf-8 path bytes, the eight byte big endian length of the data, and the data.
    - canonical_content_hash is the lowercase hexadecimal sha256 digest of that stream.
    - uuid is uuid5 of the namespace above over the canonical_content_hash string.
  binding_normalization: >-
    For solution/provenance.yaml only, everything from the first occurrence of a
    newline followed by the literal line "binding:" through end of file is
    replaced by the exact bytes "binding: PENDING_BINDING_BLOCK" followed by one
    newline. The binding block is written after the hash exists, so it sits
    outside the hash preimage and the binding relation is acyclic. Every other
    byte of this carrier and every byte of every other file stays inside the
    domain.
  excluded_from_hash:
    - trajectories/
    - solution/provenance.sig
    - the binding block of solution/provenance.yaml

