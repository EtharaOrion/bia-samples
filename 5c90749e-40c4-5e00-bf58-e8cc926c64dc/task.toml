schema_version = "1.4"

artifacts = [
  "/telemetry/run_record.jsonl",
  "/workspace/submission/optimizer.py",
  "/workspace/submission/logs",
  "/logs/verifier/score.json",
  "/logs/verifier/outcomes.json",
]

[task]
name = "bia/s01-optimizer-search-frozen-init"
version = "1.0.0"
description = "Reach a frozen target validation loss in fewer optimizer steps, with the dataset, batch, architecture and weight initialization all frozen and only the update rule and its schedule free."
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "language-model", "frozen-initialization"]
tags = ["optimization", "bounded-continuous"]

[metadata]
category = "optimization"
slot = "S01"
slot_name = "optimizer-search-frozen-init"
family = "F1"

# ---------------------------------------------------------------------------
# The seven optimization bindings. Every one of them is bound by role.
# ---------------------------------------------------------------------------
# 1. max_timeout: bounds ONE SESSION, which is fifty attempts and one
#    submission. This is the role the 6 in requirements/bia-environment-spec.md
#    plays. It is not the per-attempt budget.
max_timeout = 6.0
max_timeout_hours = 6.0
max_timeout_sec = 21600.0

# 2. budget_hours: the PER-ATTEMPT completion bound, 7.2 minutes, which is the
#    six hour session divided by the fifty attempt cap
#    (requirements/bia-environment-spec.md:122-135). Writing 6 here would encode
#    a three hundred hour session.
budget_hours = 0.12
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"

# 3. attempt cap, at or below the client ceiling of one hundred
max_attempts = 50

# 4. which attempt of the session is submitted
final_selection = "best"

# 5. solver egress during scored work
solver_egress = "setup-only"

# 6. compute envelope
compute_envelope = "one H100"

# 7. reward contract, a single float on the closed unit interval
reward_range = [0.0, 1.0]
reward_full = 1.0
reward_clip = "min(max(raw, 0.0), 1.0)"

[metadata.reward]
type = "float"
range = [0.0, 1.0]
full_reward = 1.0
direction = "higher_is_better"
expression = "min(max((baseline_steps - graded_step) / (baseline_steps - target_steps), 0.0), 1.0)"
metric = "graded_step, the earliest sustained multi-seed crossing of the frozen target validation loss"
contract_path = "/logs/verifier/score.json"
zero_attribution = "every zero written by tests/grade.py carries a machine-readable reason string"
aggregation = "single turn, no multi-step aggregation"

[metadata.operating_point]
# The scaled operating point. F1 at the upstream operating point costs 84 minutes
# per graded run, which is 11.7 times the per-attempt budget, so a scaled point is
# mandatory (requirements/bia-environment-spec.md:122).
scale = "full"
parameters = 10921728
vocab_size = 256
sequence_length = 256
sequences_per_forward = 256
tokens_per_step = 65536
total_steps = 700
seeds_per_graded_attempt = 2
forward_backward_per_step = 1
cost_status = "measured on the reference machine, 195 seconds against a 432 second bound"
resize_note = "vocab was 512 and total_steps was 1400. At 512 the order-two context table is 262144 rows and no update rule reached the target inside any step count that fits the attempt budget, which was measured rather than argued. See solution/TRUTH.md section Measurement."

[metadata.cohort]
pinned = ["gpt5.6-sol", "anthropic/claude-opus-5", "muse-spark-1.2"]
valid_to = "2026-11-17"
source = "requirements/bia-environment-spec.md:281"

[metadata.difficulty]
# Difficulty is measured, never claimed. No tier is asserted here.
tier = "unassigned"
disposition = "HOLD:PILOT_REQUIRED"
pass_probability = "unmeasured"
reference_score = 0.4838709677419355
reference_score_status = "measured on the reference machine, one H100, seeds 0 and 1, graded_step 280 against baseline_steps 310 and target_steps 248"

[agent]
timeout_sec = 21600.0
network_mode = "none"
allowed_hosts = []

[verifier]
timeout_sec = 3600.0
entrypoint = "tests/test.sh"
reward_path = "/logs/verifier/score.json"
env = { }

[environment]
# Pinned by digest, never by a floating tag. Built FROM
# pytorch/pytorch:2.13.0-cuda13.0-cudnn9-runtime (linux/amd64). The bundle ships
# no layer on top of it, so environment/Dockerfile and this digest converge.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 40960
# Setup-only egress. The [agent] block above narrows to no network for the scored
# run; this is the provisioning baseline, a precedence pair and not a
# contradiction.
network_mode = "setup-only"
env = { BIA_TELEMETRY_DIR = "/telemetry", BIA_WORKSPACE = "/workspace" }

[metadata.rollout_population]
# No rollouts have been recorded against these frozen bytes. Silence here would
# be indistinguishable from selective inclusion, so the empty population is
# stated rather than omitted.
population_predicate = "config.json carries both agent.name and agent.model_name, and its task.path resolves to this bundle uuid"
attempts_made = 0
attempts_shipped = 0
attempts_excluded = 0
attempts_scored = 0
attempts_faulted = 0
attempts_unrun = 0
scored_attempts_all_shipped = true
shipped = []
excluded = []
