schema: forge.grounding/v1
slot: OER-19
provisional_identifier: OER-19
family: F14
family_name: synthetic data generation
archetype: AR6
archetype_name: Silent Execution Failures
title: Silent generator collapse to a low-diversity mode

# This file is the single derivation source for slot OER-19. `solution/recompute.py`
# derives every generated artifact from these bytes and from nothing else: the
# benchmark splits, the reference generator, the checker fixtures, solve.sh,
# TRUTH.md, rubrics.json, the golden trajectory and tests/test_output.py. It
# invokes no model, no network, no clock, no locale and no random source, and two
# runs over frozen bytes produce byte-identical output. `recompute.py --check`
# reports drift without writing.

metric:
  name: held-out benchmark score
  definition: >-
    Accuracy of the frozen model on the frozen held-out benchmark, evaluated by the
    verifier from harness-owned model state at the bound evaluation point.
  direction: higher-is-better
  reward_formula: "raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)"
  clip: "score = min(max(raw, 0.0), 1.0)"

anchors:
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  gap: gap-oer-per-family-anchors-unmeasured
  statement: >-
    F14 anchors are unmeasured. This slot binds the reward schema in full and
    declares the two anchor values absent rather than inventing them. No
    baseline_metric or target_metric number appears anywhere in this bundle.
  consequence: >-
    With the anchors absent the normalization has no denominator, so grade.py
    resolves the reward to 0.0 carrying reason anchors-absent-unnormalizable and
    records the verifier-computed agent_metric in the score document for the batch
    to normalize once anchors land. The arithmetic itself is exercised in
    adequacy.py against a fixture-supplied anchor pair that is declared as fixture
    material and is not a slot binding.
  second_gap: gap-oer19-reward-unnormalizable-until-anchors-bound

frozen_axes:
  - the model, a multinomial logistic regression over a binary bag-of-tokens
  - the optimizer, plain SGD at the bound learning rate, one sample per update
  - the training budget, 480 corpus samples fed for 3 epochs, 1440 optimizer updates
  - the held-out benchmark, its items, its labels and its evaluation points
free_axes:
  - the synthetic data generator the agent writes, and nothing else

bounds:
  corpus_samples: 480
  labels: [music, timer, translate, weather]
  segment_count: 8
  prefix_points: 4
  ngram_width: 3
  normalization_id: oer19-lower-alnum-collapse/v1
  mode_share_threshold: 0.60
  max_mode_share_ceiling: 0.08
  segment_distinct_ngram_floor: 0.34
  collapse_relative_fraction: 0.65
  near_duplicate_threshold: 0.55
  sustain_tolerance: 0.08
  bound_updates: 1440
  bound_samples_fed: 1440
  bound_epochs: 3
  bound_evaluation_point: 1440
  scheduled_points: [960, 1200, 1440]
  self_report_tolerance: 0.02
  bounds_derivation: >-
    Every bound above was read off a measurement over the reference corpus and the
    negative controls in this same file, recorded in feasibility.yaml under
    bounds_measurement. None was chosen to make a target reachable; each sits
    between the reference reading and the nearest negative control reading, and the
    separation is recorded so an outside reader can recompute it.

solver_egress_divergence:
  bound_in_task_toml: open
  batch_contract_field: seed/contract.yaml batch.optimization_bindings.solver_egress reads "setup-only"
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the
    solving agent full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says internet
    is needed only for setup, and requirements/bia-environment-spec.md line 247 was
    read strictly to yield "setup-only" at the batch level.
  bound_here: >-
    This slot binds solver_egress = open at the agent surface, matching the family
    delivery.network_policy block that grants agent_environment egress with the
    upstream deny-list, and leaves the batch-level field unamended. The divergence
    is recorded, never silent; this lane does not amend a batch singleton.
  deny_list_is_not_containment: >-
    The deny-list on github.com, raw.githubusercontent.com and
    objects.githubusercontent.com is not a containment proof. Mirrors, package
    caches, paraphrased write-ups and published model weights all carry a recipe
    past any deny-list. That is precisely why the deterministic checkers, and not
    the network policy, are the load-bearing control on this slot.
  verifier_surface: denied

perception_axis_exemption: >-
  This task family is text and code only, so the Perception axis carries no
  category. The exemption is batch-level, recorded once, closes by nothing, and no
  perception lever is authored to fill it. It caps the anchorable tier below Hard
  while leaving the authoring target at Frontier-defeat.

tier:
  target: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: capped below Hard by the standing batch-level Perception-axis exemption
  frontier_defeat_floor: 0.50
  separation_margin: 0.05

