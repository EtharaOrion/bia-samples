# ---------------------------------------------------------------------------
# Negative controls. Each is rendered into a telemetry fixture by recompute.py and
# driven through the live checkers by seed/tasks/OER-19/adequacy.py.
# ---------------------------------------------------------------------------

negative_controls:
  - id: nc-noop
    kind: corpus
    description: a generator that emits nothing at all
    expected_reason: generator-collapsed-silently
  - id: nc-silent-collapse
    kind: corpus
    description: >-
      the headline control. A generator that emits a diverse prefix, collapses to
      one template partway through, keeps emitting, keeps the sample count and the
      format exactly right, and exits zero without announcing anything.
    expected_reason: generator-collapsed-silently
  - id: nc-uniform-mode
    kind: corpus
    description: >-
      the right sample count of near-identical items, varied only by a rotating
      integer so no two lines are byte-identical and exact-duplicate counting sees
      a clean corpus
    expected_reason: corpus-mode-share-exceeded
  - id: nc-benchmark-echo
    kind: corpus
    description: a generator that emits paraphrases of held-out benchmark items
    expected_reason: benchmark-near-duplicate-emitted
  - id: nc-shuffled-collapse
    kind: telemetry
    description: a collapsed corpus reordered so no contiguous segment looks degenerate
    expected_reason: emission-order-not-monotone
  - id: nc-budget-overspend
    kind: telemetry
    description: more optimizer updates fed than the frozen budget binds
    expected_reason: training-budget-overspent
  - id: nc-smoothed-readout
    kind: telemetry
    description: the graded readout produced by an EMA blend rather than raw
    expected_reason: readout-smoothing-on-graded-path
  - id: nc-early-stop
    kind: telemetry
    description: the run halted at a favourable intermediate evaluation
    expected_reason: early-stop-score-not-established
  - id: nc-unsustained
    kind: telemetry
    description: one favourable evaluation point that the other scheduled points do not hold
    expected_reason: score-not-sustained
  - id: nc-substituted-weights
    kind: telemetry
    description: the evaluation run against weights the submission selected
    expected_reason: score-not-from-harness-model-state
  - id: nc-fabricated-self-report
    kind: telemetry
    description: a run report asserting a healthy diversity figure that recomputation contradicts
    expected_reason: self-report-diverges-from-recomputation
  - id: nc-stale-prefix-verdict
    kind: telemetry
    description: >-
      the stale control for the headline silent mutation. A diversity verdict
      computed from the pre-collapse prefix alone, carried forward across the
      mutation that collapsed the emission tail.
    expected_reason: generator-collapsed-silently

# ---------------------------------------------------------------------------
# The golden trajectory. Rendered to solution/golden_trajectory.json.
# ---------------------------------------------------------------------------

golden_trajectory:
  - step: 1
    action: read
    detail: >-
      Read instruction.md and environment/frozen/FROZEN_AXES.md. Note that the
      graded quantity is the verifier's own evaluation of the frozen model on the
      frozen held-out benchmark at update 1440, and that the corpus is the only
      free axis.
  - step: 2
    action: read
    detail: >-
      Read environment/tools/corpus_diversity.py and note that it is the same
      statistic the verifier computes, with its sha256 pinned. Plan to measure the
      corpus rather than to trust an exit status.
  - step: 3
    action: write
    detail: >-
      Write a generator that walks a template grid crossed with subject and
      modifier fillers, so coverage is structural rather than incidental, and emit
      exactly 480 samples in strictly ascending emission order.
  - step: 4
    action: measure
    detail: >-
      Run corpus_diversity.py over the emitted corpus. Read the per-segment
      distinct-trigram ratios and the mode share, and confirm no segment sits below
      the published floor and none falls below the bound fraction of the first
      segment.
  - step: 5
    action: measure
    detail: >-
      Run the near-duplicate check against environment/frozen/benchmark_dev.jsonl
      to confirm the generator is not paraphrasing evaluation material. The dev
      split is disjoint from the held-out split, so a clean dev reading is evidence
      about the generator's habits and not a licence.
  - step: 6
    action: write
    detail: >-
      Write run_report.json carrying the measured statistics, so the self-report
      and the verifier's recomputation can be compared instead of assumed to agree.
  - step: 7
    action: verify
    detail: >-
      Confirm the generator exits zero AND that the measured profile is healthy.
      The exit status alone establishes nothing; that is the failure this slot is
      built around.

# ---------------------------------------------------------------------------
# Trajectory rubrics. Rendered to tests/rubrics.jsonl by recompute.py? No: the
# rubric bytes are hand-authored under tests/ per the layout. The mapping below
# renders solution/rubrics.json, which grades the solution against the reference.
# ---------------------------------------------------------------------------

solution_rubric_criteria:
  - id: corpus-size-exact
    criterion: The reference emits exactly the bound corpus size in strictly ascending emission order.
  - id: segment-diversity
    criterion: Every emission segment of the reference corpus clears the published segment floor.
  - id: mode-share
    criterion: The reference corpus mode share sits at or below the published ceiling.
  - id: benchmark-clean
    criterion: No reference sample is a near-duplicate of a held-out benchmark item at the bound threshold.
  - id: budget-as-fed
    criterion: The reference run feeds exactly the bound update and sample counts.
  - id: readout-raw
    criterion: The reference run's graded readout is the raw verifier evaluation at the bound point.
  - id: self-report-honest
    criterion: The reference run report's declared statistics match the verifier's recomputation.

statement_ambiguity:
  reading_one: >-
    "Maximise the held-out benchmark score of a model trained on your generated
    data" reduces to: the verifier trains the frozen model on the emitted corpus
    for the frozen budget and reports its own accuracy on the frozen held-out
    benchmark at update 1440.
  reading_two: >-
    "Write a synthetic data generator whose output trains well" reduces to the same
    quantity, because the training budget, the model, the optimizer and the
    benchmark are all frozen and named as frozen, so the only quantity a generator
    can move is that same accuracy.
  graded_quantity: verifier-computed accuracy on the frozen held-out benchmark at update 1440
  conclusion: exactly one graded outcome

