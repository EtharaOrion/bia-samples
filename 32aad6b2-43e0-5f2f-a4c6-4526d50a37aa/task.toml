schema_version = "1.4"

# schema_version is a top-level scalar and is written above the first table header
# on purpose. TOML scopes every key to the most recent header, so an assignment
# below [task] would silently become task.schema_version and leave the top-level
# scalar absent while the file still read correctly to a human.

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-19-silent-generator-collapse"
version = "1.0.0"
description = "Raise the held-out benchmark score of a model trained on a synthetic corpus the agent generates, where a generator that has silently collapsed to a low-diversity mode still runs to completion and reports success."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "silent-failure"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-19"
provisional_identifier = "OER-19"
title = "Silent generator collapse to a low-diversity mode"
family = "F14"
family_title = "synthetic data generation"
archetype = "AR6"
archetype_name = "Silent Execution Failures"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard by the standing batch-level Perception-axis exemption"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.metric]
name = "held-out benchmark score"
description = "accuracy of the frozen model on the frozen held-out benchmark, evaluated by the verifier from harness-owned model state at the bound evaluation point"
direction = "higher-is-better"
reward_interval = [0.0, 1.0]
reward_is_binary = false
full_reward = 1.0
formula = "raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
target_is_a_bar = "reaching the target scores exactly 1.0 and beating it also scores 1.0"

[metadata.anchors]
state = "absent"
note = "This family's anchors are unmeasured. The reward schema is bound in full above; baseline_metric and target_metric are declared absent and are not invented here."

[metadata.frozen]
axes = [
  "the model, a multinomial logistic regression over a binary bag of tokens",
  "the optimizer, plain SGD at the bound learning rate, one sample per update",
  "the training budget, 480 corpus samples fed for 3 epochs, 1440 optimizer updates",
  "the held-out benchmark, its items, its labels and its evaluation points",
]
free_axes = ["the synthetic data generator the agent writes"]

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours bounds the refinement loop ACROSS attempts. budget_hours
# bounds ONE attempt, being six hours over fifty attempts, 0.12 hours or 7.2
# minutes. They are never aliases of each other.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.12
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 50
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_divergence_recorded_in = "solution/grounding.yaml:solver_egress_divergence"
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"

[solution]
entry_point = "solution/solve.sh"
policy = "solution/policy.yaml"
derivation_source = "solution/grounding.yaml"
deriver = "solution/recompute.py"
