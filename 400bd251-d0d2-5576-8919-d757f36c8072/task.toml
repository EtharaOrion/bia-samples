schema_version = "1.4"

# schema_version is a TOP-LEVEL scalar and is written above the first table header on purpose.
# TOML scopes every key to the most recent header, so an assignment below [task] would silently
# become task.schema_version and leave the top-level scalar absent while the file still reads
# correct to a human.
#
# The artifacts list is also the bundle's own declaration of the TWO-PHASE CARRIER. Every
# directory named here is a path the agent phase writes and the verifier phase reads, so the
# workspace that spans both containers is derivable from these bytes rather than assumed.

multi_step_reward_strategy = "last"

artifacts = [
  "/workspace/submission/plan.json",
  "/logs/agent/phase_a.jsonl",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-28-fused-kernel-across-a-two-phase-splice"
version = "1.0.0"
description = """
Choose an execution plan for a frozen streaming operator -- which attention backend
evaluates the same softmax-weighted average, in how many chunks the same cross-entropy
is summed, and in what precision the rotary, the qk normalisation and the logit softcap
are carried -- hand that plan across the splice the harness establishes rather than the
statement names, and have the verifier resume from it and count the charge itself. The
verifier reads nothing the agent phase measured: it re-establishes numerical equivalence
against the frozen reference kernel on its own weights, and only then times the plan
against both anchors.
"""
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "kernel-optimization", "two-phase-splice"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-28"
provisional_identifier = "OER-28"
title = "Kernel substitution handed across a harness-established splice"
family = "F5"
family_title = "kernel optimization"
primary_archetype = "two-phase-splice"
primary_archetype_title = "Two-Phase Splice"
archetype_count = 1
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

target_tier = "T3"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard by the standing batch-level Perception-axis exemption"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at T3."

# The graded path is an equivalence check on three plans followed by 7 interleaved
# timing rounds. The number below is MEASURED: see solution/grounding.md.
graded_path_seconds_measured = 150
graded_path_seconds_budget = 900

[metadata.metric]
name = "speedup over the frozen reference kernel on the verifier-owned resume segment, gated on numerical equivalence"
direction = "higher"
quantity = "milliseconds per forward-and-backward step of the frozen computation"
gate_kind = "hard gate"
gate_note = "The operator is floating point, so correctness is agreement within a declared tolerance and not byte equality. A plan whose loss differs from the frozen reference kernel by more than 0.002 nats absolute, or whose global gradient norm differs by more than 0.02 relative, on frozen weights over fixed batches, scores exactly 0.0 with the machine-readable reason numerical-output-diverged, however few microseconds its kernel charged. The gate is never a soft penalty and never scales the float. Both tolerances were set from authoring measurements of the spread among plans that ARE equivalent; see solution/grounding.md."
frozen = ["the operator semantics", "the parameters and the seed that built them", "the batch shape and the input stream", "the frozen reference kernel and therefore the correctness bar", "the warmup, round and step counts of the timing protocol"]
free = ["the execution plan at /workspace/submission/plan.json"]
computed_by = "the verifier, from its own CUDA-event timings over its own resume run, on the plan the agent phase handed over"

[metadata.anchors]
state = "absent-by-design"
authority = "No literal for either endpoint appears anywhere in this bundle. Both are MEASURED on every grading run: the control by re-timing the shipped environment/default_plan.json, the reference by timing tests/private/reference_plan.json, which is staged only into the verifier image. If either produces no usable latency the run refuses with timing-failed, and if the reference is not faster than the control it refuses with calibration-span-nonpositive. Neither path substitutes a stored value."
normalisation_operated = "raw = (control_ms - agent_ms) / (control_ms - reference_ms)"
reward_clip = "score = min(max(raw, 0.0), 1.0)"
never_from = [
  "a latency the submission reported",
  "a number in the submission's stdout",
  "anything written to /logs/agent/phase_a.jsonl by the agent phase",
]

[metadata.timing]
estimator = "median over rounds of the mean CUDA-event-timed step latency within a round"
warmup_steps = 24
steps_per_round = 24
rounds = 9
interleaved = true
note = "The three plans are timed round-robin within each round rather than one after another. Within a round a machine that is busy is busy for all three, and the reward is a ratio of DIFFERENCES of latencies, so a slowdown that multiplies all three equally cancels out of it exactly. The minimum over rounds discards the rounds in which the machine was busiest. This matters because the grading host is shared."

[metadata.phases]
count = 2
agent_phase_entry = "solution/solve.sh"
agent_phase_journal = "/logs/agent/phase_a.jsonl"
verifier_phase_entry = "tests/test.sh"
graded_deliverable = "/workspace/submission/plan.json"
splice_note = "The agent phase benchmarks and decides; the verifier phase re-establishes equivalence and re-times from scratch. Nothing the agent phase measured crosses the splice as evidence -- only the plan itself crosses, and the verifier re-derives every number it uses. The journal at /logs/agent/phase_a.jsonl is carried for a human reader and is never read by the grading chain."

[metadata.reward]
kind = "single float"
interval = "[0.0, 1.0]"
direction = "higher is better"
binary = false
full_reward = 1.0
carrier = "/logs/verifier/reward.txt"
reason_carrier = "/logs/verifier/score.json"
zero_carries_reason = true

[metadata.hygiene]
note = """
Schema validation is a GATE and the equivalence check is a second, independent GATE.
Neither scales the float and neither contributes a partial credit. A plan that is well
formed but not equivalent is refused exactly as hard as one that is malformed.
"""
refusal_reasons = [
  "submission-absent",
  "plan-unreadable",
  "plan-not-an-object",
  "plan-key-unknown",
  "plan-key-missing",
  "plan-schema-unrecognised",
  "plan-option-unknown",
  "numerical-output-diverged",
  "accelerator-absent",
  "verifier-substrate-unavailable",
  "verifier-anchor-plan-invalid",
  "anchor-plan-failed",
  "agent-plan-failed",
  "timing-failed",
  "calibration-span-nonpositive",
  "grading-chain-failed",
  "grading-timed-out",
  "grading-killed",
]

[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_role = "per-attempt completion bound"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 32768
gpus = 1
gpu_types = ["H100"]
workdir = "/app"
build_timeout_sec = 3600
network_mode = "public"

[agent]
submission_path = "/workspace/submission/plan.json"
entry_point = "solution/solve.sh"
network_mode = "none"
note = "Every dependency is staged at image build, so the solving agent needs no run-time egress. /workspace is the only path shared with the verifier."

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"
reward_kind = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
never_imports_submission = true
note = "The submission is a JSON declaration of five enumerated choices. The verifier parses it, checks it against the declared option sets, re-establishes its numerical equivalence to the frozen reference kernel on its own weights, and only then times it. No code from the agent surface is imported or executed here."

[solution]
oracle = "solution/reference.py"
entry = "solution/solve.sh"
grounding = "solution/grounding.md"
note = "The oracle installs a plan derived by a sweep over this exact harness during authoring. It is NOT the verifier's private reference plan: the two differ, so the reference arm of the gate is never the reference plan being graded against itself."
