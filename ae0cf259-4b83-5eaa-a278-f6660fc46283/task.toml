# Harbor delivery manifest for slot OER-02.
#
# schema_version is a TOP-LEVEL scalar and stays above the first table header.
# TOML scopes every key to the most recent header, so an assignment written after
# a header silently becomes that table's key while the file still reads correct.
schema_version = "1.4"

# artifacts is a TOP-LEVEL list for the same scoping reason. Written under a table
# header it becomes that table's key, the real list stays empty, and Harbor
# accepts that silently while snapshotting nothing.
artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/app/refine.py",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
  "/logs/verifier/score.json",
]

[task]
name = "bia-track3-sustained-refinement"
version = "1.0.0"
description = "Drive the optimizer step count to a locked validation-loss target down across a fifty-attempt refinement session, where every iteration receives a summary of every prior approach and its reward and the graded quantity is a consolidated crossing that no single attempt can reach alone."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "sustained-refinement"]

# Harbor reads [metadata] as dict[str, Any], so it is the carrier that survives
# validation. seed/harbor_lint.py reads [metadata].tags for the client tags, and
# the batch's optimization bindings live at [metadata.optimization] in every slot.
[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
family = "F1"
family_title = "nanogpt optimizer speedrun"
slot = "OER-02"
provisional_identifier = "OER-02"
archetype = "sustained-refinement"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

metric = "optimizer steps to reach target validation loss"
metric_direction = "lower"

reward_schema = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
reward_range = [0.0, 1.0]
reward_full = 1.0
reward_full_rule = "reaching the target scores exactly 1.0 and beating it also scores 1.0; the target is a bar, not a point on a gradient"
reward_formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric); score = min(max(raw, 0.0), 1.0)"
reward_path = "/logs/verifier/reward.txt"
reward_document_path = "/logs/verifier/reward.json"
score_document_path = "/logs/verifier/score.json"
reward_higher_is_better = true
reward_binary = false

network_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
network_deny_reason = "The published record lineage is the primary contamination carrier for this task family. A deny-list is not a containment proof."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are DISTINCT fields with DISTINCT roles and
# neither is ever an alias of the other:
#   max_timeout_hours -> refinement-loop terminator ACROSS attempts, six hours.
#                        The session ends when this trips or when max_attempts
#                        trips, whichever binds first.
#   budget_hours      -> per-attempt completion bound, six hours over fifty
#                        attempts, which is 0.12 hours or 7.2 minutes.
# Writing the 6 into budget_hours would encode a 300-hour session that every
# well-formedness check passes as valid, because both are positive floats and no
# check compares them.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 18.0
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
max_attempts_ceiling = 100
final_selection = "best"
final_selection_k = 50
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

# The refinement loop, bound rather than described.
[metadata.refinement]
loop = "the harness lets the agent solve and submit, grades the submission, summarizes the trajectory, and starts the next iteration with that summary"
running_context = "every prior approach and its reward"
terminator = "metadata.optimization.max_timeout_hours or metadata.optimization.max_attempts, whichever trips first"
per_attempt_bound = "metadata.optimization.budget_hours"
summary_owner = "verifier"
summary_freshness = "recomputed from the recorded attempt ledger at every iteration boundary"

[metadata.resources]
gpu = "1x H100, single accelerator, no multi-GPU scaling. The batch is fixed at environment/shape.json batch_tokens_per_step and is served by the verifier's own loader, so device count moves wall clock and never step count."

[environment]
# Pinned by @sha256:, never a floating tag. Harbor accepts any string and does
# not itself require a digest, so the digest requirement is this contract's.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[verifier]
# Isolated because grading re-executes the WHOLE fifty-attempt session itself:
# the verifier hands each iteration its own summary, launches the submitted
# planner, trains the frozen substrate with the returned recipe, and evaluates
# the weights its own loop produced on a split the agent environment never sees.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
egress = "denied"
network_mode = "none"
val_shard_mount = "verifier_only"
eval_schedule_owner = "verifier"

[agent]
# The solving agent gets OPEN internet egress inside the sandbox so it can fetch
# its own packages, datasets and models. The verifier keeps egress denied. The
# asymmetry is deliberate and is bound here rather than left to accident.
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
network_mode = "none"
