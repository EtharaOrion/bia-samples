# Harbor delivery manifest for slot OER-22.
#
# schema_version is a TOP-LEVEL scalar and is written above the first table header on
# purpose. TOML scopes every key to the most recent header, so an assignment written
# after [task] would silently become task.schema_version and leave the top-level scalar
# absent while the file still read correct to a human.
schema_version = "1.4"

multi_step_reward_strategy = "last"

artifacts = [
  "/workspace/submission/selection.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/reward.json",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-22-calibration-set-drift"
version = "3.0.0"
description = """
Choose which snapshots of a frozen training run to keep, and how to combine them, under a
fixed retention budget. The architecture, the initialisation, the token stream, the
optimizer and the number of forward and backward passes are frozen: the submission does
not train anything and cannot move a single gradient step. What it chooses is which 6 of
the 16 snapshots that run passes through are retained, and with what weights they are
averaged. The graded figure is the verifier's own validation cross-entropy of the
averaged model, measured in the verifier's process on a held-out FineWeb slice absent
from the agent image. Reward is the fraction of the gap closed between two anchors that
are BOTH re-measured on every grading run, from the snapshots of the single frozen
training run the verifier performs there.
"""
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "checkpoint-selection", "temporal-reasoning"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-22"
provisional_identifier = "OER-22"
title = "Calibration split drift between selection and evaluation"
family = "F9"
family_title = "checkpoint retention and weight averaging"
primary_archetype = "AR9"
primary_archetype_title = "Temporal Reasoning Gap"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."
maturity = "draft"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

frozen = "the architecture, the initialisation seed, the token stream, the optimizer recipe, the compute budget, the snapshot schedule, the retention budget and the evaluation window"
free = "which snapshots are kept, and the convex weights they are averaged with"
metric_direction = "lower"

# WHY THE ARCHETYPE STILL HOLDS AFTER THE RE-BASE.
#
# The temporal gap is between the split a selection is CALIBRATED on and the split it is
# EVALUATED on. The agent ranks snapshots and windows on environment/data/devset_slice.bin,
# cut from a FineWeb TRAINING shard; the verifier evaluates the averaged model on a slice
# of the FineWeb VALIDATION shard it alone holds. The two rankings agree on the SHAPE of a
# good answer and disagree on the ordering of near-neighbours, and nothing announces the
# disagreement. A selection tuned until it is the single best-scoring one on the devset has
# been tuned partly to the devset's noise, and that part does not survive the move.
rebase = "OER-2026-09-08"
rebase_kind = "task-mechanics-replaced"
rebase_reason = """
The prior revision graded a per-tensor bit allocation over a quantized checkpoint. Two
defects made it unshippable rather than merely hard. Its graded path did not terminate
inside the 25-minute grading budget when re-measured on the reference arm, and its
mechanics duplicated the surface of two sibling slots in the same corpus, which measures
one capability three times and calls it three tasks. The archetype, the identity and the
metric direction are carried forward; the mechanics are replaced by a retention and
weight-averaging selection over a frozen training run, whose graded path is a single
training run plus three evaluations.
"""

[metadata.metric]
name = "held-out validation cross-entropy of the averaged model"
direction = "lower"
definition = """
Mean token-level cross-entropy in nats of the model obtained by averaging the retained
snapshots under the submitted weights, over the verifier's held-out FineWeb validation
slice. A real forward pass of real parameters, computed by the verifier in its own
process from the snapshots its own frozen training run produced. Never a number the
submission reported or wrote.
"""
producer = "tests/grade.py with tests/harness.py, verifier-owned"
undefined_without_forward_pass = true

[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.5
budget_hours_role = "per-attempt completion bound"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
compute_envelope_accelerators = 1

# The graded path is ONE from-scratch training run of 6144 micro-batches plus three
# evaluations of averaged states. It is deliberately sized to fit well inside one grading
# pass, and the number below is measured rather than declared: see solution/grounding.md.
graded_path_seconds_measured = 150
graded_path_seconds_budget = 600

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 32768
gpus = 1
gpu_types = ["H100"]
workdir = "/app"
build_timeout_sec = 3600
network_mode = "public"

[agent]
submission_path = "/workspace/submission/selection.json"
network_mode = "none"
note = """
The corpus and every dependency are staged at image build, so the solving agent needs no
run-time egress. /workspace is the only path shared with the verifier.
"""

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
reward_path = "/logs/verifier/reward.txt"
reason_path = "/logs/verifier/reward.json"
score_document_path = "/logs/verifier/score.json"
reward_kind = "single float on the closed interval 0.0 to 1.0, higher is better, never binary"
never_imports_submission = true
note = """
The submission is a JSON declaration of which snapshots to keep and how to weight them.
The verifier parses it, bounds-checks it against the retention budget and averages with
it. No code from the agent surface is imported or executed, and no number the submission
reports about itself is read.
"""

[verifier.reward]
schema = "single float, closed interval [0.0, 1.0], higher is better, never binary"
full_reward = 1.0
floor = 0.0
formula = "raw = (default_loss - agent_loss) / (default_loss - reference_loss)"
clip = "reward = min(max(raw, 0.0), 1.0)"
target_is_a_bar = "reaching the reference scores exactly 1.0 and beating it also scores 1.0"
zero_carries_reason = true

[verifier.anchors]
baseline_metric_declared = "absent-by-design"
target_metric_declared = "absent-by-design"
note = """
No literal for either endpoint appears anywhere in this bundle, and that is the point
rather than an omission. Both are MEASURED on every grading run, from the snapshots of the
single frozen training run the verifier performs inside the grading process: the low anchor
by evaluating the shipped environment/default_selection.json, which keeps the final
snapshot alone, and the high anchor by evaluating tests/private/reference_selection.json,
which is staged only into the verifier image. Both anchors and the submission are scored
against the SAME snapshots, which is what makes one training run enough and what makes the
three numbers comparable. If either anchor fails to produce a finite loss the run refuses
at 0.0 with reason anchor-diverged, and if the two coincide it refuses with
calibration-span-nonpositive. Neither path substitutes a stored value.
"""

[verifier.hygiene]
note = """
Schema and bounds validation is a GATE, not a grade. selection_schema.py answers one
question -- is this a well-formed selection inside the declared retention budget with
non-negative weights summing to one -- and a failure REFUSES the run at 0.0 with a
machine-readable reason. It never scales the float and never contributes partial credit.
"""
refusal_reasons = [
  "submission-absent",
  "selection-unreadable",
  "selection-not-an-object",
  "selection-schema-unrecognised",
  "selection-key-unknown",
  "selection-key-missing",
  "selection-keep-not-a-list",
  "selection-weights-not-a-list",
  "selection-weights-length-mismatch",
  "selection-storage-budget-exceeded",
  "selection-id-not-an-integer",
  "selection-id-unknown",
  "selection-id-repeated",
  "selection-weight-not-a-number",
  "selection-weight-not-finite",
  "selection-weight-negative",
  "selection-weights-not-normalised",
  "verifier-anchor-selection-invalid",
  "accelerator-absent",
  "verifier-substrate-unavailable",
  "frozen-run-failed",
  "anchor-evaluation-failed",
  "anchor-diverged",
  "calibration-span-nonpositive",
  "agent-selection-failed",
  "agent-selection-diverged",
  "grading-chain-failed",
  "grading-timed-out",
  "grading-killed",
]

[solution]
oracle = "solution/reference.py"
entry = "solution/solve.sh"
grounding = "solution/grounding.md"
note = """
The oracle installs a selection that was derived by a search over this exact harness and
this exact frozen run during authoring, on the AGENT-VISIBLE devset alone. It is NOT the
verifier's private reference selection: the bar was derived from the held-out split and
over a wider weight family, and the two differ in both their window and their weighting,
so the reference arm of the gate is never the bar being graded against itself.
"""
