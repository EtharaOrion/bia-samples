# OER-11 -- Harbor delivery unit manifest.
#
# schema_version is a TOP-LEVEL scalar and must stay above the first table header.
# TOML scopes every key to the most recent header, so an assignment written after
# [task] silently becomes task.schema_version while still reading correct to a human.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-11-corpus-snapshot-moves"
version = "1.0.0"
description = "Build the parse and tokenize pipeline that lowers the validation loss of the trained model, where the corpus snapshot the pipeline is built against moves during the session and the move is silent."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "temporal-reasoning"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-11"
provisional_identifier = "OER-11"
identity_note = "Staged under the slot id. No canonical content hash, no uuid5, no uuid directory name, no provenance carrier and no signature are authored by this lane; wave 2 does identity for every slot at once."
title = "Parser built against a corpus snapshot that moves during the session"
family = "F13"
family_title = "parse and tokenize pipeline"
archetype = "AR9"
archetype_title = "Temporal Reasoning Gap"
archetype_count = 1
archetype_note = "Exactly one archetype is claimed. No second archetype is composed into this slot."
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_reason = "This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."
difficulty_claim = "none. This bundle makes no difficulty claim anywhere."

[metadata.objective]
metric = "validation loss of the trained model on the frozen held-out evaluation split"
direction = "lower"
direction_note = "LOWER is better. The reward formula below is the lower-is-better form."
frozen = [
  "the token budget, as fed and as measured by the harness",
  "the model",
  "the optimizer",
  "the evaluation split",
]
free = [
  "the parse and tokenize pipeline the agent builds over the raw corpus",
]
graded_quantity = "The validation loss the VERIFIER computes on the frozen held-out split, from harness-owned weights, at the bound evaluation step, unsmoothed, sustained across every verifier-scheduled subsequent evaluation point. It is never a number the submission reported, printed or wrote."

[metadata.objective.temporal]
statement = "The corpus snapshot the parse pipeline is built against MOVES during the session, and the move is silent."
handle = "environment/corpus_api.py"
handle_functions = ["snapshot_version", "snapshot_ledger", "resolve_corpus", "assert_snapshot"]
handle_note = "The agent is given a first-class way to ask the corpus what version it is at, so temporal reasoning is a skill under test rather than a trap with no handle. Nothing announces the move; asking is the agent's job."
graded_against = "the corpus AS OF the graded evaluation, never as of whenever the agent last looked"
ordering_basis = "harness-owned snapshot version handles in /logs/harness/snapshot_ledger.json"
ordering_note = "No checker on the graded path reads a wall clock, a locale or a timezone. Temporal ordering is carried entirely by the harness-owned snapshot version sequence."

[metadata.reward]
carrier = "/logs/verifier/reward.txt"
carrier_content = "one bare float"
score_document = "/logs/verifier/score.json"
score_document_content = "the machine-readable reason and the metric block"
carrier_note = "The live verifier binds the reward carrier to reward.txt, not reward.json. Both files are written from the same trap so the instrument's binding and the reason carrier can never disagree."
interval = [0.0, 1.0]
higher_is_better = true
binary = false
full_reward = 1.0
formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
target_is_a_bar = "Reaching the target scores exactly 1.0 and beating it also scores 1.0."
every_zero_carries_a_reason = true

[metadata.reward.anchors]
state = "absent"
authority = "This family is unscoped and carries no published anchor; authoring a family against an unmeasured baseline is forbidden, so the numbers are declared absent."
schema_bound = "The reward SCHEMA is fully bound above: carrier, interval, direction, formula, clip and full-reward point. Only the two numbers are absent."
resolution = "Both numbers are read at grade time from the harness-owned anchor record at /logs/harness/anchor_record.json, which this lane does not author. An absent or null anchor resolves to reward 0.0 with reason anchors-unresolved, never to a vacuous pass."
not_invented = "No baseline_metric or target_metric number is authored anywhere in this bundle."

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are NEVER aliases. max_timeout_hours bounds
# the session ACROSS attempts; budget_hours bounds ONE attempt, being six hours
# over fifty attempts, 0.12 hours or 7.2 minutes.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
final_selection_note = "best of k, k = 50"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest"
image_pin_note = "Pinned by @sha256 and never by a floating tag. Harbor accepts any string and does not itself require a digest, so this requirement is the contract's and this lane enforces it."

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_note = "The solving agent gets open internet egress inside the sandbox so it can fetch its own packages, datasets and models. The deny-list is not a containment proof."
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
egress_note = "The verifier keeps the bound network policy. The asymmetry against [agent].solver_egress is deliberate and is a bound byte, never an accident. The divergence is recorded in solution/grounding.yaml under solver_egress_divergence."
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
