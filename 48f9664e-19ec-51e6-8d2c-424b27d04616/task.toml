# Harbor delivery manifest, slot OER-05, family F15.
#
# schema_version is a TOP-LEVEL scalar and is written above the first table
# header on purpose. TOML scopes every key to the most recent header, so an
# assignment placed after [task] silently becomes task.schema_version while the
# file still reads correct to a human.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-05-novelty-gated-update-rule"
version = "1.0.0"
description = """
Reduce the multi-seed mean number of optimizer steps needed to reach the target
validation loss, with an update rule for the two-dimensional block matrices that
clears a behavioural comparison against the pinned behavioural corpus. The
grading tree and the held-out evaluation split are red lines.
"""
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "novelty-gated"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-05"
# Provisional identity. This slot is staged under its slot id. No
# canonical_content_hash, no uuid5, no uuid directory name, no canary token, no
# provenance carrier and no signature file is written by this lane. Wave 2 does
# identity for every slot at once.
provisional_identifier = "OER-05"
family = "F15"
family_title = "agentic optimizer search under a novelty constraint"
title = "Novelty-gated update rule under a behavioural corpus comparison"
primary_archetype = "grader-integrity"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."

frozen = "dataset, batch size, architecture, one forward-backward pass per step"
free = "optimization algorithm, schedules, initialization"
metric = "optimizer steps to reach the target validation loss, scored on a multi-seed mean clearing a significance margin"
metric_direction = "lower"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_reason = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."
perception_exemption_level = "batch"
perception_lever_authored = false

maturity = "draft"
disposition = "HOLD:PILOT_REQUIRED"

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours ROLE: refinement-loop terminator ACROSS attempts.
# budget_hours      ROLE: per-attempt completion bound, one attempt, being six
#                         hours over fifty attempts, 0.12 hours or 7.2 minutes.
# The two are explicitly distinct and are never aliases.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.12
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 50
final_selection = "best"
final_selection_k = 50
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.reward]
carrier = "/logs/verifier/reward.txt"
carrier_payload = "one bare float"
score_document = "/logs/verifier/score.json"
kind = "single float, closed interval, higher is better, never binary"
minimum = 0.0
maximum = 1.0
full_reward = 1.0
formula_lower_is_better = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
target_is_a_bar = "reaching the target scores exactly 1.0 and beating it also scores 1.0"
separation_margin_behaviour = "continuous ramp; the confidence term is clipped into [0, 1] and multiplied into the magnitude term, so the margin degrades the score continuously and never flips it binary"
multi_seed_minimum = 3
multi_seed_reduction = "mean over per-seed clipped raw, with the half-spread subtracted to form the separation"

[metadata.anchors]
# ABSENT. F15 anchors are unmeasured. The SCHEMA above is fully bound; the
# numbers are not invented here.
state = "absent"
consequence_on_the_graded_path = "tests/grade.py refuses to score a run whose anchor pair is absent and writes reward 0.0 with the machine-readable reason anchor-pair-absent. It never substitutes a number."

[metadata.build]
build_context = "environment/"
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"

[environment]
# Pinned by digest, never by a floating tag. A tag can be re-pointed and would
# silently change what graded. Harbor accepts any string here and does not
# itself require a digest; the digest requirement is this contract's and this
# manifest is where the lane enforces it.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[verifier]
# The verifier surface. It never trains an agent-authored rule inside the
# grading process and it never reaches the network.
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
egress = "denied"
network_mode = "none"
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"

[agent]
entry_point = "solution/solve.sh"
# Solver egress is OPEN inside the sandbox so the agent can fetch its own
# packages, datasets and models. The verifier surface above stays denied. The
# asymmetry is deliberate and is a bound byte here rather than an accident.
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
deny_list_is_not_containment = "A deny-list is not a containment proof. Mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any deny-list, which is why the deterministic checker and not the network policy is the load-bearing control."
network_mode = "none"
