schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

reward_contract:
  carrier: /logs/verifier/reward.txt
  carrier_shape: one bare float on the closed interval 0.0 to 1.0, higher is better, never binary
  reason_carrier: /logs/verifier/score.json
  reason_shape: '{"reward": <float>, "reason": <machine-readable-kebab-case>, "metric": {...}}'
  local_exercise_note: >-
    /logs/verifier is a single shared host path and concurrent lanes collide on it. When
    tests/test.sh is exercised locally, FORGE_REWARD_ROOT redirects the reward root to a
    lane-private directory. The bound contract path inside this bundle is unchanged and is
    the path above; only a local exercise is redirected. Recorded in
    seed/tasks/OER-18/feasibility.yaml.

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py walks checkers.GRADED_ORDER and treats every declared checker as a gate.
    A single failing gate resolves the run to 0.0 carrying that gate's zero_reason, which is
    exactly what required_pass means. When every gate holds, grade.py does not return the
    aggregation's 1.0 as the reward; it returns the continuous normalization of the measured
    held-out benchmark score against the bound anchor pair, clipped into [0.0, 1.0]. The mode
    therefore describes the gate semantics grade.py actually implements, and the reward
    remains continuous rather than binary.

bound_parameters:
  note: >-
    These are the post-drift values. seed/tasks/OER-18/drift.yaml final.state carries the
    same numbers, and seed/tasks/OER-18/adequacy.py asserts the two agree. No value here is
    authored at grading time.
  rebase_note: >-
    training_budget_tokens moved from 3072 to 3145728 in the nanoGPT re-base, because the
    unit moved with it. 3072 counted whitespace tokens for a bag-of-tokens perceptron. The
    unit is now the GPT-2 BPE token the decoder actually trains on, and 3145728 is exactly
    six optimizer steps of the substrate's frozen 524288 tokens per step. The other bound
    values are unchanged.
  coverage_divergence_tolerance: 0.05
  near_duplicate_threshold: 0.75
  training_budget_tokens: 3145728
  sustain_tolerance: 0.005
  graded_eval_point: 0
  eval_schedule_length: 3
  eval_schedule_fractions: [0.80, 0.90, 1.00]
  strata_count: 5
  reconciliation_tolerance: 0.0

substrate:
  declaration: environment/nanogpt_substrate.json
  verifier_copy: tests/nanogpt_substrate.json
  declaration_version: nanogpt-substrate-v1
  replication_rule: >-
    The two copies are byte identical and each side reads the copy beside it, so no slot
    reads a sibling slot's bytes. The verifier re-reads its own copy at grading time, so
    editing the agent-visible copy produces a refused run with reason frozen-axis-moved
    rather than a different grade.
  architecture: vocab_size 50304, num_layers 12, model_dim 768, head_dim 128, num_heads 6, seq_len 1024
  batch_tokens_per_step: 524288
  passes_per_step: one forward and one backward
  graded_steps_at_bound_point: 6
  eval_schedule_steps: [4, 5, 6]
  steps_note: >-
    A mark in tokens becomes a step count by integer division against the frozen 524288
    tokens per step, so the three scheduled marks are four, five and six steps and no two
    marks collapse onto the same step count.

near_duplicate_contract:
  normalization: >-
    casefold the text, replace every character that is not alphanumeric with a space, split
    on whitespace, reduce to the set of tokens. No stemming, no stopword list, no
    locale-dependent case mapping beyond casefold.
  similarity: set Jaccard over the normalized token sets
  threshold: 0.75
  threshold_semantics: a similarity greater than or equal to the threshold is a hit
  comparison_set: >-
    every held-out window tests/benchmark.json pins, detokenized from the verifier's own
    copy of the split at tests/corpus/held_out_split.json
  evaluation: >-
    computed through an inverted index over the held-out items' tokens rather than by
    comparing every sample to every item. The index changes the cost and not the answer,
    because a Jaccard of at least the threshold forces an intersection of at least the
    threshold times the larger set, so an item is skipped only when it provably could not
    have reached the threshold.
  generator_access: none. The held-out split lives only under tests/ and is never assembled onto the agent surface.
  leak_remediation: >-
    An earlier pass wrote this split onto the agent surface at
    environment/corpus/held_out_split.json, as a base64 payload of 1048576 uint16 GPT-2 BPE
    token ids from fineweb_val_000000.bin. The re-base moved those bytes unchanged to
    tests/corpus/held_out_split.json and replaced the agent-visible path with a redaction
    notice carrying no payload. environment/Dockerfile does not copy environment/corpus/
    into the agent image.

pins:
  classifier: tests/strata.py
  classifier_sha256: 3af4fee323cae9e1142066b8ea78fde03f1c1130b0cd91242cf2493766902269
  classifier_pin_note: >-
    Unchanged by the re-base. The coverage measurement is a pure function of the emitted
    sample text and did not move when the model underneath it did, so this pin still holds
    against the pre-rebase bytes.
  frozen_stack: tests/frozen_stack.py
  frozen_stack_sha256: 259c26785545ff3cf6d8ef2c2ed5d26320914a2e305bdebcb9c76049126a6ec3
  frozen_stack_agent_copy: environment/train_stack.py
  frozen_stack_agent_copy_sha256: 259c26785545ff3cf6d8ef2c2ed5d26320914a2e305bdebcb9c76049126a6ec3
  substrate: environment/nanogpt_substrate.json
  substrate_sha256: 80d0cdd9a66e735c73214cc4bc18b434b0eb4d64f682a5a1cf3545cce3f6026e
  substrate_verifier_copy: tests/nanogpt_substrate.json
  substrate_verifier_copy_sha256: 80d0cdd9a66e735c73214cc4bc18b434b0eb4d64f682a5a1cf3545cce3f6026e
  benchmark: tests/benchmark.json
  benchmark_sha256: f9133f08ff3be8845ca6457693b10d03ee8889f5a6749890f74953c72a6a6909
  held_out_split: tests/corpus/held_out_split.json
  held_out_split_sha256: 67ef3e3a2737da0cc1dd23f9f131071f5e649fd185283b5de9053663597f17c2
  held_out_split_pin_note: >-
    tests/grade.py load_benchmark recomputes this digest and refuses the run with
    held-out-split-digest-mismatch before it cuts a window, so the graded split is pinned to
    the verifier's copy rather than resolved at grading time.
  reference: solution/reference.py
  reference_sha256: 5fb6a9181acb3b5d3ff3c2eb8823e49cc4a9c6da57add4338a031041c266a30e
  pin_note: >-
    The verifier runs its own copy of the frozen stack. The agent-visible copy carries the
    same sha256 so the agent can see exactly what will train on its corpus, and editing the
    agent-visible copy changes nothing that is graded.
  rebase_note: >-
    frozen_stack and its agent copy moved together from a 512-bucket hashed linear scorer
    trained by a multiclass perceptron to the canonical twelve-layer, 768-dimension nanoGPT
    decoder declared in the substrate. benchmark moved from twenty authored three-word
    strings to sixty-four 1024-token windows of the FineWeb validation split.

anchors:
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  gap: gap-oer-per-family-anchors-unmeasured
  reason: >-
    F14 is registered unscoped in seed/contract.yaml. Its baseline and target are
    unresolved, and no value may be invented for them here. The reward SCHEMA is bound in
    full; the two numbers it consumes are not.
  runtime_carrier: /logs/verifier/anchors.json
  runtime_carrier_shape: '{"baseline_metric": <float>, "target_metric": <float>, "authority": <string>}'
  unbound_behaviour: >-
    grade.py resolves the anchor pair from the runtime carrier. With no carrier and no bound
    pair, the reward is 0.0 with reason anchors-unbound and the measured benchmark score is
    still recorded in the metric block. An absent anchor never resolves to a vacuous pass and
    never resolves to an invented number.

compiled_fixtures:
  state: stale
  gap: gap-oer-18-fixtures-carry-pre-rebase-telemetry
  what_holds: >-
    tests/test_output.py and tests/fixtures/ are unchanged by this re-base and still pass.
    They are planted Handle objects that exercise the accepting and the rejecting half of
    every declared checker, and the checker functions are pure functions of a Handle, so
    they neither import the frozen stack nor read this manifest.
  what_does_not_hold: >-
    Their numbers are pre-rebase telemetry. accept_golden carries budget_tokens 3072, marks
    of 2458, 2765 and 3072 tokens, and a graded score of 1.000000, all of which were
    measured under the retired perceptron. Under the nanoGPT decoder the budget is 3145728
    and no score of 1.0 is reachable.
  why_it_was_not_fixed_here: >-
    Replacing those numbers would mean authoring a held-out benchmark score for a nanoGPT
    run this lane did not execute, which is a fabricated measurement. The lane recorded the
    staleness instead. The fixtures must be regenerated by solution/recompute.py from a real
    run before this slot is frozen.

checkers:
  - id: coverage_manifest_present
    statement: "No graded run passes on the strength of having declared no coverage manifest; an absent manifest is recorded together with the measured coverage vector and the measured benchmark score, and the run is still graded on the measurement."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_coverage_manifest_present
    zero_reason: coverage-manifest-absent
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.declared_present, built by tests/grade.py from whether tests/runner.py recovered coverage_manifest.json out of the killed submission's own working directory, carried beside Handle.measured_coverage from tests/strata.py and Handle.graded_score, the tests/frozen_stack.py evaluate reading over the decoder snapshot the verifier trained."
    compiled_test: "tests/test_output.py::test_coverage_manifest_present"

  - id: coverage_divergence
    statement: "The coverage manifest the submission declares agrees, within the bound L1 tolerance, with the coverage tests/strata.py measured over the emitted samples."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_coverage_divergence
    zero_reason: coverage-declaration-contradicts-measurement
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.measured_coverage and Handle.measured_counts, produced by tests/strata.py inside the verifier process over the frozen corpus tests/runner.py recovered; the declared vector is carried only as the left-hand side of the comparison."
    zero_reason_payload: "declared_coverage, measured_coverage, measured_counts, l1_divergence, tolerance, over_by"
    compiled_test: "tests/test_output.py::test_coverage_divergence"

  - id: benchmark_contamination_absent
    statement: "No emitted sample is a near-duplicate of any held-out benchmark item under the declared normalization at the bound Jaccard threshold."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_benchmark_contamination_absent
    zero_reason: benchmark-near-duplicate-emitted
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.near_duplicate_hits, computed by tests/grade.py with tests/strata.py near_duplicate_tokens and jaccard over the frozen corpus against tests/benchmark.json, inside the verifier process."
    compiled_test: "tests/test_output.py::test_benchmark_contamination_absent"

  - id: training_budget_respected
    statement: "The corpus offered no more than the frozen token budget, as counted by the frozen feeder rather than declared by the submission."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_training_budget_respected
    zero_reason: training-budget-overspent
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.tokens_offered and Handle.tokens_fed, the return counters of frozen_stack.feed inside the verifier process, counted in the GPT-2 BPE tokens the decoder trains on."
    compiled_test: "tests/test_output.py::test_training_budget_respected"

  - id: corpus_frozen_before_training
    statement: "The corpus was frozen and its coverage measured before the training counter opened, and the corpus digest at evaluation equals the digest at freeze."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_corpus_frozen_before_training
    zero_reason: corpus-mutated-after-freeze
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.event_log, Handle.corpus_digest_at_freeze and Handle.corpus_digest_at_eval, all appended by tests/grade.py as the verifier's own process reached each stage."
    adequacy_substitution: planted-fixture
    adequacy_substitution_reason: >-
      tests/runner.py kills the submission's whole process group before the corpus is
      digested, so no live submission can reach the window this checker grades. The
      isolation boundary holds, so the rejecting half is carried on a planted fixture that
      moves the digest and the event order directly, and the substitution is recorded here
      and in seed/tasks/OER-18/feasibility.yaml rather than papered over.
    compiled_test: "tests/test_output.py::test_corpus_frozen_before_training"

  - id: evaluation_schedule_complete
    statement: "Every evaluation mark the verifier scheduled over the frozen budget was reached, so the score was established rather than stopped at."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_evaluation_schedule_complete
    zero_reason: early-stop-score-not-established
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.eval_points, each row produced by frozen_stack.train_to_mark inside the verifier process, carrying the step count, the forward and backward pass ledger, and whether the mark was reached. A mark whose ledger does not hold carries score null rather than a number."
    compiled_test: "tests/test_output.py::test_evaluation_schedule_complete"

  - id: graded_score_from_harness_model
    statement: "The parameter snapshot evaluated at the bound evaluation point is the snapshot the harness trained itself, shape-bound to the declared architecture, not a checkpoint the submission selected."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_score_from_harness_model
    zero_reason: model-state-not-harness-owned
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.graded_weights_owner, Handle.graded_weights_digest and Handle.harness_recomputed_weights_digest. The digest is frozen_stack.state_digest over the decoder parameter tensors and the pass ledger, and the third field is recomputed by tests/grade.py from a fresh frozen_stack.train_to_mark call over the same prefix."
    adequacy_substitution: planted-fixture
    adequacy_substitution_reason: >-
      A submission has no path to hand the verifier model weights: tests/grade.py trains
      inside its own process from the corpus alone and never loads a checkpoint. The
      rejecting half is therefore carried on a planted fixture whose weights_owner is not
      the harness, and the substitution is recorded here and in feasibility.yaml.
    compiled_test: "tests/test_output.py::test_graded_score_from_harness_model"

  - id: graded_score_unsmoothed
    statement: "The graded readout is the verifier's raw evaluation at the bound point; a reported score that is smoothed, or that disagrees with the harness reading beyond the reconciliation tolerance, scores zero."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_score_unsmoothed
    zero_reason: readout-smoothed
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.graded_score, the frozen_stack.evaluate return at the bound mark inside the verifier process, computed on the held-out windows from the decoder snapshot, and reconciled against the submission-reported figures which are never returned as a score."
    compiled_test: "tests/test_output.py::test_graded_score_unsmoothed"

  - id: score_sustained_across_points
    statement: "The reading at the bound evaluation point holds, within the bound sustain tolerance, at every later mark the verifier scheduled."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_score_sustained_across_points
    zero_reason: score-not-sustained
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.eval_points scores at indices above the graded point, each an independent frozen_stack.evaluate call over an independently trained decoder snapshot inside the verifier process."
    compiled_test: "tests/test_output.py::test_score_sustained_across_points"

  - id: corpus_has_training_effect
    statement: "The emitted corpus moved the trained model past the harness's own null-corpus control, so a corpus nothing can be learned from is not scored as a data generator."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_corpus_has_training_effect
    zero_reason: corpus-had-no-training-effect
    required: true
    weight: 1
    basis: harness-telemetry
    live_state_read: "Handle.graded_score against Handle.null_control_score, the second produced by a frozen_stack.train call over an empty corpus in the same verifier process, which is the untrained decoder at step zero."
    compiled_test: "tests/test_output.py::test_corpus_has_training_effect"
