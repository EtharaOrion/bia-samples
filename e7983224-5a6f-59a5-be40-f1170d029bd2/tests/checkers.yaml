schema: forge.checkers/v1

# The graded checker manifest for slot OER-14. Every row below is implemented in
# tests/checkers.py, reached through tests/grade.py from the one entry point tests/test.sh,
# and compiled into both halves in tests/test_output.py.
#
# Every checker is PURE and DETERMINISTIC and reads live state through real harness handles
# only. The handles are named per row under `live_state_read`. No checker reads a planted
# file, an environment secret, a clock, a random source or a socket, and no checker imports
# the submission. tests/checkers.py imports `math`, `dataclasses` and `typing` and nothing
# else. Every number a checker compares came from a telemetry record the verifier's own
# process produced by running environment/substrate.py over environment/corpus/eval.txt.

reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

# MEASURED CORRECTION, wave 1: the live seed/forge/verifier.py binds the reward carrier to
# reward.txt, not reward.json. The carrier holds the bare float; the machine-readable reason
# and the metric block travel in the companion score document. tests/grade.py writes both
# from the same call, so the instrument's binding and the reason carrier never disagree.
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

aggregation:
  mode: required_pass
  rationale: >-
    Every row below is a required gate and tests/grade.py runs them in the order declared
    here, so required_pass is a literal description of what that file does: one refusal
    resolves the reward to 0.0 carrying that row's zero_reason, and the universal quantifier
    is never over an empty set because ten rows are marked required. When every required gate
    passes, grade.py does NOT return a bare 1.0; it returns the bound continuous formula
    raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric), clipped into
    the closed interval, against anchors the harness measured in that same process. The
    reward is therefore one float on [0.0, 1.0] and never binary. Ordering is load-bearing
    for attribution only: a run that halted early and therefore also has no sustained level
    is attributed to the halt, because the halt is what caused the rest.

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  note: >-
    baseline_metric and target_metric are not written into this bundle. They are RESOLVED BY
    MEASUREMENT at grade time from tests/controls.json: baseline_metric is the best reading a
    single-direction sweep of the whole slot budget reaches, so a greedy sweep scores exactly
    0.0 by construction, and target_metric is the harness's own reallocated reference at the
    same frozen compute budget.

# Where a checker cannot be fired by any submission because an isolation boundary holds, the
# rejecting half is carried on a planted fixture and the SUBSTITUTION IS RECORDED here rather
# than papered over. The planted defect for each is declared in solution/grounding.yaml and
# generated into solution/fixtures/plan.json.
checkers:
  - id: graded_bpb_recomputed_unsmoothed
    statement: >-
      The graded reading is the harness's raw evaluation at each verifier-scheduled point:
      no filter sits on the graded path and none was requested.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: graded_bpb_recomputed_unsmoothed
    zero_reason: readout-smoothing-on-graded-path
    required: true
    weight: 1
    live_state_read: >-
      the `filter` field of each row of the telemetry environment/substrate.py measure()
      returned inside the verifier process, and the recorded spec_requests.graded_readout_filter
    compiled_test: "tests/test_output.py::test_graded_bpb_recomputed_unsmoothed"
    rejecting_half: planted-telemetry-fixture
    rejecting_half_substitution: >-
      No submission can put a filter on the graded readout, because the harness owns the
      readout and computes it from its own model state, so the accepting half is driven by a
      real submission and the rejecting half by a planted telemetry fixture that sets the
      point filter. The requested-filter branch IS reachable by a submission and is exercised
      by the negative control neg-smoothed-readout.

  - id: denominator_is_frozen_eval_byte_count
    statement: >-
      Every reading divides by the frozen byte count of environment/corpus/eval.txt and by
      nothing else, so a vocabulary cannot lower bits per byte by changing what it measures
      over.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: denominator_is_frozen_eval_byte_count
    zero_reason: denominator-not-frozen-eval-bytes
    required: true
    weight: 1
    live_state_read: >-
      substrate.frozen_eval_byte_count() read from the frozen corpus in this process, against
      the `denominator_bytes` and `denominator_key` of every telemetry point and the recorded
      spec_requests.denominator_override
    compiled_test: "tests/test_output.py::test_denominator_is_frozen_eval_byte_count"
    rejecting_half: submission-reachable

  - id: compute_spend_within_frozen_budget
    statement: >-
      The compute the run actually spent, as the harness-owned counter measured it, is within
      the frozen budget, and no larger spend was requested.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: compute_spend_within_frozen_budget
    zero_reason: compute-budget-overspent
    required: true
    weight: 1
    live_state_read: >-
      the substrate.Meter the harness constructed: its `source`, `budget_units`,
      `spent_units` and `requested_units` fields, never an assertion the training loop made
      about itself
    compiled_test: "tests/test_output.py::test_compute_spend_within_frozen_budget"
    rejecting_half: submission-reachable

  - id: evaluated_state_is_harness_owned
    statement: >-
      The state evaluated at each scheduled point is the state the harness owns at that
      point, fingerprinted by the harness, not a checkpoint the submission selected.
    reduction: VALUE
    reached_by: tests/grade.py
    selector: evaluated_state_is_harness_owned
    zero_reason: state-not-harness-owned
    required: true
    weight: 1
    live_state_read: >-
      the `state_source` and `state_digest` fields of each telemetry point, where the digest
      is substrate.Model.state_digest computed inside the verifier process
    compiled_test: "tests/test_output.py::test_evaluated_state_is_harness_owned"
    rejecting_half: planted-telemetry-fixture
    rejecting_half_substitution: >-
      A submission never runs inside the grading process, so it cannot substitute the state
      that is evaluated; tests/runner.py copies it alone into a fresh temporary directory and
      tests/grade.py never imports it. The rejecting half is therefore carried on a planted
      telemetry fixture that sets the point state_source.

  - id: early_stop_does_not_establish_reading
    statement: >-
      A run that halts at a favourable evaluation, before the verifier-scheduled points have
      been reached, is graded as NOT having established the metric, with a reason, rather
      than as an absent result.
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: early_stop_does_not_establish_reading
    zero_reason: early-stop-not-established
    required: true
    weight: 1
    live_state_read: >-
      the `reached` flag of every row of the verifier-scheduled evaluation points the harness
      itself enumerated from substrate.EVALUATION_POINT_FRACTIONS, and the recorded
      spec_requests.stop_after_point
    compiled_test: "tests/test_output.py::test_early_stop_does_not_establish_reading"
    rejecting_half: submission-reachable

  - id: reading_sustained_across_scheduled_points
    statement: >-
      One level holds across the evaluation points the verifier itself scheduled, so a
      favourable fluctuation at a single point is not harvested as a result.
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: reading_sustained_across_scheduled_points
    zero_reason: reading-not-sustained
    required: true
    weight: 1
    live_state_read: >-
      the `nll_bits_total` of every reached telemetry point divided by that point's
      denominator, against substrate.BAND_TOLERANCE_BPB
    compiled_test: "tests/test_output.py::test_reading_sustained_across_scheduled_points"
    rejecting_half: planted-telemetry-fixture
    rejecting_half_substitution: >-
      A dip wide enough to break the band cannot be produced on demand by a submission,
      because the readings are the harness's own and move smoothly in the flat tail of the
      training curve. The rejecting half is carried on a planted telemetry fixture that
      widens one point.

  - id: no_submission_reported_number_on_graded_path
    statement: >-
      No number the submission reported is offered to, or consumed by, the graded path: the
      consumed key list names harness-owned surfaces only, and a reported metric is refused
      with a reason rather than silently discarded.
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: no_submission_reported_number_on_graded_path
    zero_reason: submission-reported-metric-on-graded-path
    required: true
    weight: 1
    live_state_read: >-
      harness.CONSUMED_KEYS, which is a module constant with no append path, against
      harness.FORBIDDEN_CONSUMED, which mirrors substrate.VocabSpec.reported_fields(), and the
      recorded spec_requests.reported_bpb
    compiled_test: "tests/test_output.py::test_no_submission_reported_number_on_graded_path"
    rejecting_half: planted-telemetry-fixture
    rejecting_half_substitution: >-
      tests/grade.py consumes a fixed key list that never includes a submission field and no
      code path appends to it, so no submission can add itself to that list; the rejecting
      half for the consumed-key branch is carried on a planted fixture. The offered-metric
      branch IS reachable by a submission and is exercised by neg-reported-metric.

  - id: graded_band_exceeds_single_direction_sweep
    statement: >-
      The graded reading beats the best single-direction sweep of the whole slot budget by
      the bound separation margin, so a greedy sweep of one direction cannot reach the band.
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: graded_band_exceeds_single_direction_sweep
    zero_reason: single-direction-sweep-not-exceeded
    required: true
    weight: 1
    live_state_read: >-
      the harness's own control runs over tests/controls.json single_direction_sweep, each
      measured in this process at the same frozen compute budget, against the graded reading
    compiled_test: "tests/test_output.py::test_graded_band_exceeds_single_direction_sweep"
    rejecting_half: submission-reachable

  - id: reallocation_follows_flattening
    statement: >-
      The session drove a direction until its marginal gain ran out and only then moved
      allocation off it, so the reallocation is ordered AFTER the flattening it responds to.
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: reallocation_follows_flattening
    zero_reason: flattened-direction-not-reallocated
    required: true
    weight: 1
    live_state_read: >-
      the harness re-measurement of every allocation the attempt record carries, in recorded
      order, against tests/controls.json flatten_epsilon_bits and flatten_run_required
    compiled_test: "tests/test_output.py::test_reallocation_follows_flattening"
    rejecting_half: submission-reachable

  - id: carried_direction_frontier_never_collapses
    statement: >-
      The per-direction frontier the session carried never lost ground between attempts, so
      the graded outcome depends on what the session held across the horizon.
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: carried_direction_frontier_never_collapses
    zero_reason: carried-state-collapsed
    required: true
    weight: 1
    live_state_read: >-
      the carried_frontier of every attempt row in recorded order, alongside the harness
      re-measurement of that attempt's allocation, so a fabricated frontier does not survive
    compiled_test: "tests/test_output.py::test_carried_direction_frontier_never_collapses"
    rejecting_half: submission-reachable
