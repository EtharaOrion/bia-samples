# Harbor delivery manifest for slot OER-14.
#
# `schema_version` is a TOP-LEVEL scalar and is written above the first table header on
# purpose: TOML scopes every key to the most recent header, so an assignment written after
# `[task]` would silently become `task.schema_version` while still reading correct to a human.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/workspace/submission.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "oer-14-long-horizon-vocabulary-search"
version = "1.0.0"
description = "Lower bits per byte at a fixed compute budget by searching the vocabulary construction across the whole slot budget, where the payoff of a direction is only visible after enough of the budget has been spent on it."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "long-horizon"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-14"
provisional_identifier = "OER-14"
title = "Long-horizon vocabulary search under a fixed compute budget"
family = "F10"
family_title = "tokenizer and vocabulary construction"
primary_archetype = "AR1"
primary_archetype_name = "Long-Horizon State Collapse"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time, no buffet"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_exemption = "standing batch-level Perception-axis exemption"
anchorable_tier_note = "This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.metric]
name = "bits per byte at fixed compute"
direction = "lower"
unit = "bits per byte of the frozen evaluation corpus"
computed_by = "the verifier, over environment/corpus/eval.txt, from harness-owned model state"
frozen_axes = [
  "the compute budget",
  "the model",
  "the optimizer",
  "the evaluation corpus",
]
free_axes = [
  "the vocabulary construction",
  "the size allocation across the frozen construction families",
]

[metadata.reward]
carrier = "/logs/verifier/reward.txt"
carrier_form = "one bare float, no JSON wrapper"
score_document = "/logs/verifier/score.json"
interval = [0.0, 1.0]
direction = "higher is better"
binary = false
full_reward = 1.0
formula = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
bar_not_gradient = "reaching the target scores exactly 1.0 and beating it also scores 1.0"

[metadata.anchors]
# No number is invented here. This family's anchors are unmeasured, so the schema is bound
# in full and the two values are declared ABSENT rather than estimated.
baseline_metric_present = false
target_metric_present = false
absent_reason = "this family is unscoped, so no published baseline or target exists for it"
resolution_mechanism = "run_local_harness_controls"
resolution_detail = "both anchors are MEASURED by the verifier at grade time from tests/controls.json: the baseline position is the best bits per byte any single-direction sweep of the whole slot budget reaches, and the target position is the harness reference reallocation at the same frozen compute budget"

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are NEVER aliases. The first bounds the session ACROSS
# attempts; the second bounds ONE attempt. Binding 6 into the per-attempt field would bind a
# three-hundred-hour session that every well-formedness check would still pass.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator ACROSS attempts"
budget_hours = 0.12
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound, ONE attempt"
budget_hours_state = "provisional"
max_attempts = 50
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest, never a floating tag"
substrate = "environment/substrate.py"
corpus = "environment/corpus"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
workdir = "/workspace"
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
deny_list_is_not_containment = "mirrors, caches, paraphrased write-ups and released model weights all carry a recipe past any deny-list, which is why the deterministic checker chain and not the network policy is the load-bearing control"
submission_path = "/workspace/submission.json"
network_mode = "none"

[verifier]
egress = "denied"
network_mode = "none"
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
entry_point = "tests/test.sh"
manifest = "tests/checkers.yaml"
imports_submission = false
