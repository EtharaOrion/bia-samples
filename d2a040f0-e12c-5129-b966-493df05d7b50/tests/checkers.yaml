schema: forge.checkers/v1
reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]
reward_path: /logs/verifier/reward.txt
score_document_path: /logs/verifier/score.json

clock_ownership: >-
  THE HARNESS OWNS THE CLOCK, and on this slot it owns the traversal too. A checker is forbidden
  from reading a clock and is also forbidden from walking the producer chain inside the grading
  interpreter, because a verifier that performs its own I/O over state a submission may have
  touched is a verifier whose reading can be moved. tests/runner.py launches
  environment/fence_probe.py against the fence state the VERIFIER IMAGE was built with, as a new
  session leader under a six-key environment allowlist, and kills the whole process group in a
  finally block. Every checker below is a pure function of the record stream that probe emitted
  and the bound constants. No checker calls time, datetime, perf_counter, monotonic or any other
  clock, directly or transitively.

purity: >-
  Every checker is a pure function of the harness handle and the bound constants. Imports in
  tests/checkers.py are confined to json, hashlib, pathlib, dataclasses and typing. No planted
  answer file is read, no environment secret is read, no random source is consulted, no socket is
  opened, and the grading process never imports the submission: the submission is one JSON
  document read as data.

discovery_values: >-
  Two values decide this task and NEITHER is a bound constant. The fence-crossing count and the
  admitted-kind set are established in built image state by environment/build_fence.py and are
  recomputed here, on every graded run, from the harness record stream: crossing_count() is the
  length of the traversal the probe reported, and admitted_kind_set() is the fold over the
  registry declarations that keeps the ones whose status reads admitted AND whose seal recomputes.
  tests/bound.json carries a salted commitment over each value and never the value, so a checker
  that compared against a literal would have nothing to compare against, and no agent-visible byte
  of this bundle contains either value.

readout_manipulation: >-
  The graded quantity is verdict agreement, direction: higher is better, and it is computed by
  the verifier from its own fold over its own traversal. Neither the count nor the set nor any
  verdict is ever read from a number the submission asserted. Four submission-authored fields are
  read, and each only so that a substitution is detectable rather than ignorable:
  crossings_observed, admitted_kinds, the admitted and refused counts, and the refusals block.

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py walks the eight checkers below in the declared order and returns 0.0 with the
    first failing checker's machine-readable reason. Only when every required checker passes does
    it compute the continuous term, the clamped normalised verdict agreement. That is exactly
    required_pass over the required set, composed with a bounded-continuous score inside the
    passing region, so the reward is never binary and every zero is attributed.
  reward_formula: raw = (agreement - baseline_agreement) / (1.0 - baseline_agreement)
  clip: score = min(max(raw, 0.0), 1.0)
  direction: higher is better
  never_binary: true
  never_binary_evidence: >-
    The frozen fixture reasons_flattened passes all eight gates and grades at exactly 0.0, and
    the frozen fixture reasons_precedence_inverted passes all eight gates and grades strictly
    between 0.0 and 1.0. Both observed rewards are recorded in solution/TRUTH.md.

anchors:
  anchors_state: absent
  gap_id: gap-oer-per-family-anchors-unmeasured
  family_baseline_metric: null
  family_target_metric: null
  note: >-
    F3 anchors are unmeasured, so the reward SCHEMA is bound in full and no family baseline or
    target number is invented. The single number tests/bound.json carries for normalisation is
    instance-local, measured by solution/recompute.py on this slot's own built state, and is
    declared under gap-oer-26-instance-local-anchors-not-family-anchors as NOT a family anchor.

fixture_substitutions:
  - checker: fence_state_unmodified
    substitution: none
    why: >-
      Both halves are reachable on real state. The accepting half is the built state; the
      rejecting half is any build whose generator or seed moved, which changes the state digest.
  - checker: verdict_records_match_traversal
    substitution: none, but the isolating fixture is named
    fixture: solution/fixtures/rejecting/verdict_kinds_relabelled.json
    why: >-
      A verdict stream taken from the wrong traversal usually moves the seq column as well, and
      the ORDERING checker is then reached first. verdict_kinds_relabelled moves ONLY the echoed
      record identity, so it reaches this checker and proves the DIVERGENCE reduction refuses on
      its own terms rather than riding on the ordering reduction. The fixture that reorders whole
      segments is kept as well and is recorded as rejecting with the ORDERING reason it actually
      produced, not the reason it was authored expecting.

checkers:
  - id: fence_state_unmodified
    statement: "The fence state the verifier image was built with digests to the bound value, carries at least one registry declaration, and presents at least one crossing."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_fence_state_unmodified
    zero_reason: fence-state-modified
    required: true
    weight: 1
    basis: computed
    live_state_read: "the state digest, the registry declarations and the crossing rows the harness probe emitted over the built fence state."
    compiled_test: "tests/test_output.py::test_fence_state_unmodified_accepts_the_oracle"

  - id: crossing_count_accounted
    statement: "Every crossing the producer chain presented is accounted for and only those: the reported count equals the traversal length, the verdict list is exactly that long, admitted plus refused equals it, and the four refusal counts sum to refused."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_crossing_count_accounted
    zero_reason: crossing-count-unaccounted
    required: true
    weight: 1
    basis: computed
    grades_discovery_value: the fence-crossing count
    live_state_read: "the length of the traversal the harness probe reported, against submission.json's crossings_observed, verdicts, admitted, refused and refusals."
    compiled_test: "tests/test_output.py::test_crossing_count_accounted_accepts_the_oracle"
    rejecting_half: "solution/fixtures/rejecting/crossing_count_minus_one.json and crossing_count_plus_one.json, each moving the count by exactly one and no other byte, and verdicts_from_disk_order.json, which reports the number of records on disk instead of the number the chain presented."

  - id: admitted_kind_set_exact
    statement: "The submitted admitted-kind set is exactly the set the built registry establishes: the declarations whose status reads admitted and whose seal recomputes over its own declared bytes."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_admitted_kind_set_exact
    zero_reason: admitted-set-wrong
    required: true
    weight: 1
    basis: computed
    grades_discovery_value: the admitted-kind set
    live_state_read: "the registry declarations the harness probe emitted, folded by the stated seal rule, against submission.json's admitted_kinds."
    compiled_test: "tests/test_output.py::test_admitted_kind_set_exact_accepts_the_oracle"
    rejecting_half: "solution/fixtures/rejecting/admitted_set_minus_one_kind.json and admitted_set_plus_one_kind.json, each moving the set by exactly one kind and no other byte, and admitted_set_status_only.json, the set a reading of the status column alone produces."

  - id: verdict_sequence_ordered
    statement: "There is exactly one verdict per crossing, in the order the chain presented them, each naming the crossing's own seq, carrying a decision of admit or refuse, and carrying an empty reason on an admission and one of the four bound refusal reasons on a refusal."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_verdict_sequence_ordered
    zero_reason: verdict-sequence-disordered
    required: true
    weight: 1
    basis: computed
    live_state_read: "the seq of each crossing the harness probe reported, in probe order, against submission.json's verdict list."
    compiled_test: "tests/test_output.py::test_verdict_sequence_ordered_accepts_the_oracle"
    rejecting_half: "solution/fixtures/rejecting/verdicts_from_wrong_chain_order.json, the chain's segments taken in sorted identifier order instead of link order."

  - id: verdict_records_match_traversal
    statement: "Each verdict is about the record the traversal actually reached at that position, proven by the kind it echoes."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_verdict_records_match_traversal
    zero_reason: verdict-record-divergence
    required: true
    weight: 1
    basis: computed
    live_state_read: "the kind field of each crossing record the harness probe reported, against the kind each submitted verdict echoes."
    compiled_test: "tests/test_output.py::test_verdict_records_match_traversal_accepts_the_oracle"
    rejecting_half: "solution/fixtures/rejecting/verdict_kinds_relabelled.json, see fixture_substitutions."

  - id: no_unadmitted_kind_admitted
    statement: "No crossing of a kind this fence does not admit was admitted."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_no_unadmitted_kind_admitted
    zero_reason: fence-breached
    required: true
    weight: 1
    basis: computed
    grades_discovery_value: the admitted-kind set
    live_state_read: "the admitted-kind set derived from the probe's registry rows, against every admission the submission declared."
    compiled_test: "tests/test_output.py::test_no_unadmitted_kind_admitted_accepts_the_oracle"
    rejecting_half: "solution/fixtures/rejecting/admit_everything.json."

  - id: quota_ledger_respected
    statement: "Admitting spends quota, and no kind is admitted more times than the registry publishes quota for it."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_quota_ledger_respected
    zero_reason: quota-ledger-exceeded
    required: true
    weight: 1
    basis: computed
    live_state_read: "the quota each registry declaration publishes, against the running per-kind admission count folded over the submission's verdicts in traversal order."
    compiled_test: "tests/test_output.py::test_quota_ledger_respected_accepts_the_oracle"
    rejecting_half: "solution/fixtures/rejecting/quota_ignored.json, the oracle's answer with every quota-exhausted refusal turned into an admission."

  - id: admission_not_blanket
    statement: "The fence admits, and what it admits is admissible: the submitted admissions are a non-empty subset of the admissions the fence semantics produce."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_admission_not_blanket
    zero_reason: blanket-refusal
    required: true
    weight: 1
    basis: computed
    live_state_read: "the admissions the verifier's own fold over its own traversal produces, against the admissions the submission declared."
    compiled_test: "tests/test_output.py::test_admission_not_blanket_accepts_the_oracle"
    rejecting_half: "solution/fixtures/rejecting/refuse_everything.json."
