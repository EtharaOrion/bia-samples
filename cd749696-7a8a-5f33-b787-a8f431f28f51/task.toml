# OER-07 :: F15 :: AR10 memory degradation
# Cross-iteration recovery after context compaction.
#
# schema_version is written here, above the first table header, on purpose. TOML
# scopes every key to the most recent header, so an assignment placed below
# [task] becomes task.schema_version and the top-level scalar goes silently
# absent while the file still reads correct to a human.
schema_version = "1.4"

artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer-07-cross-iteration-recovery"
version = "1.0.0"
description = "Reduce the multi-seed mean optimizer step count across a bounded refinement session whose running summary is silently compacted partway through, so what earlier attempts established must be reconstructed rather than assumed carried."
authors = ["Bia"]
keywords = ["optimization", "bounded-continuous", "memory-degradation"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-07"
provisional_identifier = "OER-07"
provisional_identifier_note = "The slot id is the provisional identifier. No canonical content hash is computed here, no uuid5 is derived, and no uuid-named directory is created. Wave 2 does identity for every slot at once, because adding solution/policy.yaml to an already-committed bundle moves its hash too."
family = "F15"
title = "Cross-iteration recovery after context compaction"
entry_point_tests = "tests/test.sh"
entry_point_solution = "solution/solve.sh"

target_tier = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
anchorable_tier_exemption = "This task family is text and code only, so the Perception axis carries no category. The exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."

[metadata.archetype]
primary = "AR10"
primary_name = "memory-degradation"
buffet = "none. Exactly one primary archetype is claimed and no secondary archetype is layered on top of it."
what_it_means_here = "The agent's own running context is lossy across iterations of the bound refinement loop. Each iteration is handed a summary of every prior approach and its reward. At a bound point that summary is compacted, and what earlier attempts established is no longer carried in it. An agent that reads the summary as complete re-walks ground it already covered or contradicts a constraint it already discovered."
pressure_versus_verdict = "Amnesia is the pressure, not the verdict. The environment carries a durable, agent-writable recovery area so reconstruction is possible; recovery is the skill under test."

[metadata.metric]
name = "optimizer steps to reach the target validation loss"
unit = "optimizer steps, integer"
direction = "lower"
statistic = "multi-seed mean"
margin_shape = "continuous. The margin enters the reward as a linear ramp on the separation between the agent arm and the verifier's own reference arm, so the reward degrades continuously through the margin and is never binary at it."
scored_only_when = "the multi-seed mean is taken over at least the bound seed count and every seed carries a verifier-recomputed sustained crossing."

[metadata.metric.frozen]
dataset = "frozen"
batch_size = "frozen"
architecture = "frozen"
passes_per_step = "one forward-backward pass per optimizer step, frozen"

[metadata.metric.free]
optimization_algorithm = "free"
schedules = "free"
initialization = "free"

[metadata.anchors]
statement = "This family carries no measured baseline_metric and no measured target_metric. The reward schema below is bound in full and the two numbers that schema divides by are declared absent rather than invented."
runtime_resolution = "The graded run resolves its anchors from the harness-written record at /logs/verifier/anchors.json. When that record is unresolved the reward is 0.0 with reason anchors-unresolved. No anchor number is authored into these bytes."

[metadata.reward]
carrier = "/logs/verifier/reward.txt"
carrier_note = "The live verifier binds the reward carrier to reward.txt, a bare float, not reward.json. Both files are written from the same trap so the instrument's binding and the reason carrier can never disagree."
score_document = "/logs/verifier/score.json"
interval = [0.0, 1.0]
higher_is_better = true
binary = false
full_reward = 1.0
formula_lower_is_better = "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
clip = "score = min(max(raw, 0.0), 1.0)"
target_is_a_bar = "Reaching the target scores exactly 1.0 and beating it also scores 1.0."
separation_factor = "margin_factor = clip(separation / separation_margin, 0.0, 1.0), where separation = clip(raw_agent) - clip(raw_reference_arm)"
composition = "reward = min(max(clip(raw_agent) * margin_factor, 0.0), 1.0)"
every_zero_carries_a_reason = true

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are never aliases. The first bounds the
# session across attempts; the second bounds one attempt, being six hours over
# fifty attempts, 0.12 hours or 7.2 minutes.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.3
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 20
final_selection = "best"
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope_accelerators = 1

[metadata.loop]
kind = "bounded refinement loop"
iterations_bound_by = "metadata.optimization.max_attempts and metadata.optimization.max_timeout_hours, whichever binds first"
summary_handed_each_iteration = "/logs/verifier/loop/summaries/iter-<n>.json"
compaction_at_iteration = 4
compaction_is_silent = true
compaction_announcement = "none. Nothing announces the compaction."
durable_recovery_area = "/workspace/ledger/"
durable_recovery_area_writable = true
durable_recovery_area_note = "This is a separate writable path. It is not part of the agent-visible lower layer and it does not weaken the read-only proof over that layer."

[metadata.build]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "tests/Dockerfile"
image_pin = "digest"
image_pin_reason = "Harbor accepts any string and does not itself require a digest, so the digest requirement is this contract's and this lane enforces it. A floating tag can be re-pointed and would silently change what graded."

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"

[verifier]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
image_definition_path = "tests/"
egress = "denied"
network_mode = "none"
accelerator = "1 H100"
accelerator_reason = "The verifier recomputes the crossing itself by evaluating harness-owned weights on the frozen held-out split, so it needs the same accelerator class the run used. It never trains."

[agent]
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
solver_egress_note = "The solving agent gets open internet egress inside the sandbox so it can fetch its own packages, datasets and models. The verifier keeps egress denied. The asymmetry is deliberate and bound here rather than accidental."
deny_list_is_not_containment = "Mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any deny-list. The deterministic checker, not the network policy, is the load-bearing control."
network_mode = "none"
