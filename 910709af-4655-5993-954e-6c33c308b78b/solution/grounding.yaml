schema: forge.grounding/v1
slot: OER-13
provisional_identifier: OER-13
family: F13
family_title: parser construction
title: Chained precision across parse, tokenize and train

# THE SINGLE PRIVATE DERIVATION SOURCE FOR THIS SLOT.
#
# solution/recompute.py derives, from this file alone: the golden trajectory, the
# checker fixtures, solution/solve.sh, solution/TRUTH.md, solution/rubrics.json
# and tests/test_output.py. recompute.py invokes no model, no network, no clock,
# no locale and no random source, so every number it emits is a number recorded
# here. The numbers recorded here were OBSERVED by running the live harness over
# frozen bytes; they are transcribed, never estimated.

identity:
  note: >-
    No canonical_content_hash, no uuid5, no uuid directory name, no canary token,
    no provenance carrier and no signature is derived in wave 1. The slot is
    staged under its provisional identifier, which is its slot id. Identity is
    derived for every slot at once in wave 2, because adding solution/policy.yaml
    to an already-committed bundle moves its hash.

objective:
  metric: nanoGPT validation loss on the verifier-owned held-out FineWeb split
  unit: mean cross entropy in nats per token
  direction: lower
  frozen: the architecture, the step budget, the optimizer, the one forward-backward pass per step, the token space, the evaluation split
  free: the parse stage, the tokenize stage, and how they compose
  primary_archetype: sustained-refinement
  archetype_exclusivity: >-
    Exactly one primary archetype, fixed at scope time. No buffet within the slot.
  archetype_meaning: >-
    An error at any stage is absorbed by the next, so a stage-local improvement
    that degrades the composition is a net loss the agent cannot see from any
    single stage's metric. Per-stage readouts are individually honest and jointly
    insufficient; only the end-to-end composition tells the truth.

substrate:
  declaration: environment/nanogpt_substrate.json
  replicated_from: .seed/nanogpt_substrate.json, byte for byte
  replication_rationale: >-
    FORGE.md rule 10 forbids a slot from depending on a sibling slot's bundle
    bytes, and a bundle's name is a hash over its own tree, so a shared file
    outside the tree would leave the name underdetermined. The verifier re-reads
    its own copy at grading time.
  architecture: vocab_size 50304, num_layers 12, model_dim 768, head_dim 128, num_heads 6, seq_len 1024
  run: 524288 tokens per step, one forward and one backward pass per step, one optimizer step per step
  what_the_rebase_did: >-
    This was a REPLACEMENT of the training and evaluation path, not a repin of a
    declaration. The slot as delivered had no model at all on its graded path: the
    train stage accumulated unigram and bigram counts over the submission's own
    vocabulary and the graded scalar was an interpolated bigram likelihood per
    byte of an authored text file that sat inside environment/. There was no
    forward pass and no backward pass anywhere in the bundle to repin. The re-base
    wrote a real 12-layer, 768-dim decoder and its training loop, moved the graded
    scalar onto the verifier's own forward pass over held-out FineWeb validation
    shards, and removed the authored split from the agent surface. Calling that a
    repin would misdescribe it.
  corpus_scale_gap:
    id: gap-oer-13-corpus-below-substrate-scale
    what: >-
      This slot's delivered corpus is a few tens of kilobytes of authored raw web
      text. One step of the frozen substrate covers 524288 tokens, so the corpus
      is cycled many times within a single step and the substrate's 3.28 target is
      not reachable here. The step budget is therefore set by the corpus scale and
      not by the record set's 3250 steps.
    why_not_closed_here: >-
      Closing it means staging a raw corpus at FineWeb scale into the agent image,
      which is a corpus-authoring change and outside a re-base lane's remit. It is
      recorded rather than papered over with a larger step count that the corpus
      could not feed.

anchors:
  anchors_state: absent
  anchors_gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  reason: >-
    F13 carries no published baseline or target. No number is invented here. The
    reward schema is bound in full, and the two slots of the bound
    lower-is-better formula are filled in-run by verifier measurement of two
    harness-owned compositions: the pristine delivered composition supplies the
    baseline slot and the reference composition supplies the target slot. When
    the family anchors are measured, the published pair replaces the in-run pair
    and this block closes.
  formula: "raw = (baseline_metric - agent_metric) / (baseline_metric - target_metric)"
  clip: "score = min(max(raw, 0.0), 1.0)"

bound_grants:
  max_timeout_hours: 6.0
  max_timeout_role: refinement-loop terminator across attempts; it bounds the whole session
  budget_hours: 0.12
  budget_hours_role: per-attempt completion bound, 7.2 minutes; it bounds one attempt
  budget_hours_state: provisional
  budget_hours_gap: gap-oer-budget-field-name-collides-with-its-role
  max_attempts: 50
  final_selection: best
  budget_envelope: one H100, single accelerator, no multi-GPU scaling
  budget_margin: 10 percent
  compute_envelope_accelerators: 1
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  aliasing: >-
    max_timeout_hours and budget_hours are never aliases of one another. The first
    bounds the session across attempts; the second bounds one attempt.

image:
  reference: "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
  pin: digest
  declared_in: [environment/Dockerfile, tests/Dockerfile, task.toml]
  never: a floating tag

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: capped below Hard by the standing batch-level Perception-axis exemption
  perception_exemption: >-
    This task family is text and code only, so the Perception axis carries no
    category; the exemption is batch-level, recorded once, closes by nothing, and
    no perception lever is authored to fill it. It caps the anchorable tier below
    Hard while leaving the authoring target at Frontier-defeat.

solver_egress_divergence:
  bound_in_task_toml:
    agent_solver_egress: open
    verifier_egress: denied
    solver_egress_deny: [github.com, raw.githubusercontent.com, objects.githubusercontent.com]
  batch_field: "seed/contract.yaml batch.optimization_bindings.solver_egress reads setup-only"
  gap_id: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the
    solving agent full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says
    internet is needed only for setup, and
    requirements/bia-environment-spec.md line 247 takes the stricter reading,
    which is what the batch field records.
  divergence: >-
    This slot binds `open` at the agent surface, which is reading A, while the
    batch-level field still reads `setup-only`, which is reading B. The
    divergence is recorded rather than silently resolved, and this lane does NOT
    amend the batch-level field: seed/contract.yaml is a batch singleton and no
    lane writes it. The same contract's family delivery.network_policy block
    binds agent_environment egress allowed with the upstream deny-list, which is
    the reading this slot follows.
  deny_list_is_not_containment: >-
    The deny-list is not a containment proof. Mirrors, caches, paraphrased
    write-ups and model weights all carry a recipe past any deny-list. That is
    exactly why the deterministic checker, and not the network policy, is the
    load-bearing control in this slot: the corpus, the frozen model and the
    held-out split are authored bytes with no published lineage, and the graded
    quantity is recomputed in-run by the verifier from bytes it owns.

graded_quantity:
  what: nanoGPT validation loss on the verifier-owned held-out FineWeb split
  unit: mean cross entropy in nats per token
  computed_by: tests/checkers.py::recomputed_loss, inside the verifier process
  produced_by: >-
    tests/frozen/nanogpt.py::validation_loss, the verifier's own forward pass,
    bound onto the checker handle by tests/harness.py before any checker runs. It
    sits outside tests/checkers.py only because the forward pass needs torch and
    the checker import surface excludes it on purpose. The process, the code and
    the split are the verifier's throughout.
  weights: the parameter snapshot the harness-owned frozen train stage wrote at the bound evaluation point
  split: >-
    the verifier's own held-out FineWeb validation shards, under the root pinned
    in tests/bound.json. They are absent from environment/ by construction and the
    agent container resolves no path to them.
  never: >-
    never a number the submission reported, printed or wrote, and never a number
    an in-container harness printed; no smoothing, averaging or EMA is applied
    anywhere on the graded path
  design_obligation: >-
    Grade the quantity, never the readout. The verifier runs the forward pass
    itself, unsmoothed, over harness-owned parameters at a bound evaluation point;
    the improvement must be sustained across folds the verifier schedules and does
    not announce; an early stop establishes no loss and scores zero with a reason
    rather than being recorded as absent. This is a design obligation and never a
    difficulty argument.
  simulator_test:
    weights_in_the_loop: >-
      PASSES. The graded artifact is a real parameter snapshot of the frozen
      architecture and check_graded_parameters_bind_frozen_architecture compares
      every tensor shape against the map the substrate declaration implies, so a
      count table, a weight table of another shape or a scalar cannot be scored as
      this model.
    verifier_recomputes: >-
      PASSES. The graded scalar is the verifier's own forward pass on a split that
      is absent from environment/ and pinned to the verifier's copy on the admin
      plane. Nothing the in-container harness prints reaches the grade, and
      check_holdout_split_is_verifier_owned refuses a run whose split did not
      resolve under the pinned root.
    no_forward_pass_no_score: >-
      PASSES. Delete GPT.forward and the metric is undefined rather than
      different: it is the only producer of a loss in the bundle, and the retired
      count table that used to keep emitting one is gone. The compiled surface
      guards the property directly in test_no_forward_pass_means_no_score and
      test_no_surrogate_model_survives_on_the_graded_path.

reference:
  path: solution/reference.py
  sha256: acb6e5727fb147e380996e5c30774192102df83f6408086e8226fea3b0ac2e6e
  materialized_files:
    "pipeline/parse.py": f9655e33bb14dfa01a927399338db570b9dfef9856b220985bcd2b76e313bef6
    "pipeline/tokenize.py": cb2292065e0c9becb6f09fe35488bbc08d4f6abdd8613bd85dd2ada916c0cb4d
    "pipeline/compose.json": 30d9a9384e1b03ab3e58f245e65c5a75a9f4bcd65b6410d79be0ec500c790c46
  idea: >-
    A composition, not two independent stage improvements. The parse stage LOWERS
    its own retention readout on purpose, dropping the navigation bar, the
    advertisement line and the copyright footer that held-out FineWeb prose does
    not contain, and deduplicating repeated lines. The tokenize stage then spends
    the frozen token budget on the cleaned stream, dropping fragments that
    survived parsing without becoming prose, deduplicating at the token level and
    packing what is left with the end-of-text delimiter the evaluated corpus uses.
    Either half alone moves the graded loss less than the pair does.
  what_the_rebase_changed: >-
    The parse half is unchanged and is unchanged for a reason: it was already an
    argument about which text belongs in a training stream, which is exactly what
    the new graded path measures. The tokenize half was rewritten. It used to
    design a vocabulary, because the retired path graded a bigram over whatever
    vocabulary the submission handed it; under the nanoGPT substrate the token
    space is frozen at vocab_size 50304 under the GPT-2 byte pair encoder, so
    vocabulary design is no longer a free axis.

observed:
  state: unmeasured
  gap: gap-oer-13-rebase-observations-unmeasured
  note: >-
    The numbers this block used to carry were transcribed from real runs of the
    RETIRED path: an interpolated bigram scored per byte on an authored split that
    no longer exists in this bundle. They were measurements of a different model
    on a different split, so the re-base retired them rather than carrying them
    across, and nothing replaced them. Republishing them beside a transformer run
    would have been a fabricated pilot result. No number is invented here.
  what_was_exercised: >-
    The re-based graded path was exercised end to end on a shrunk substrate under
    a lane-private workspace: the delivered chain ran, the frozen stage trained a
    real decoder, the verifier's forward pass produced the graded scalar, the
    architecture shape binding held, the split resolved only under the pinned
    verifier-owned root, the leakage comparison ran in the frozen token space, and
    the reward document was written with an attributed reason. That exercise
    established that the path RESOLVES. It established no anchor, because the
    architecture and the step budget it ran under were not the bound ones.
  what_is_still_unmeasured:
    - the delivered baseline composition's validation loss at the bound operating point
    - the reference composition's validation loss at the bound operating point
    - the per-fold pair for either composition
    - the separation between them, and therefore the reward the reference earns
  how_it_closes: >-
    One run of tests/test.sh at the bound operating point on the reference machine,
    with the held-out shards mounted, transcribed back into this block. Until then
    the floor anchor is established solely by the in-run measurement and
    check_floor_anchor_matches_bound_reference fails closed on a degenerate span.

golden_trajectory:
  - step: 1
    action: read the surface
    detail: >-
      Read instruction.md, environment/nanogpt_substrate.json,
      environment/pipeline/protocol.json and the three free files. Note that
      protocol.json records step_budget.value_at_delivery and says in its own
      authority note that this number is not itself the graded bound and is not
      announced when it moves. Note also that environment/eval/held_out.txt is a
      notice and not data: there is no local evaluation that is the grade.
    readout: none
  - step: 2
    action: measure the delivered composition end to end
    detail: >-
      Run the delivered chain unchanged and let the harness train the frozen
      decoder over its shards. The end-of-chain validation loss is the only number
      any later comparison is worth making against, and it is not a number you can
      compute in the container.
    readout: "unmeasured at the bound operating point, under gap-oer-13-rebase-observations-unmeasured"
  - step: 3
    action: reject the stage-local move
    detail: >-
      chars_retained_ratio can be pushed to 1.0 by keeping every character.
      Compose that change through to the end: it floods the training stream with
      the navigation bar, the advertisement line and the copyright footer, the
      decoder spends its budget learning them, and the held-out loss gets worse.
      The stage readout improved and the graded quantity degraded.
    readout: "stage-local optimum rejected on the composed measurement, not on the stage readout"
  - step: 4
    action: change parse to drop boilerplate and deduplicate
    detail: >-
      Drop the three boilerplate prefixes, unwrap headings, unescape entities,
      collapse runs of spaces and drop repeated lines. Retention falls well below
      the delivered baseline's, which is the stage readout getting worse on
      purpose.
    readout: "chars_retained_ratio falls; the composed loss is what decides whether that paid"
  - step: 5
    action: change tokenize to spend the frozen budget on the cleaned stream
    detail: >-
      The token space is frozen at vocab_size 50304 under the GPT-2 byte pair
      encoder, so there is no vocabulary to design. What is free is what reaches
      those ids and in what order: drop fragments that survived parsing without
      becoming prose, deduplicate at the token level, and pack what is left with
      the end-of-text delimiter the evaluated corpus uses.
    readout: "bytes_per_token and the shard token count; neither is the graded quantity"
  - step: 6
    action: compose and measure end to end
    detail: >-
      Run the pair through the chain to the bound evaluation point, with the
      harness feeding exactly the bound step budget from the admin plane and
      training the real decoder on the result.
    readout: "unmeasured at the bound operating point, under gap-oer-13-rebase-observations-unmeasured"
  - step: 7
    action: check the improvement is sustained
    detail: >-
      Confirm the gain holds on every fold of the verifier's frozen partition, not
      only overall, because the verifier schedules its sustain points itself and
      does not announce the order.
    readout: "unmeasured at the bound operating point, under gap-oer-13-rebase-observations-unmeasured"
  - step: 8
    action: submit
    detail: >-
      The full gate chain passes and the reward is the clipped continuous term.
    readout: "reason graded-on-recomputed-validation-loss; the reward value is unmeasured"

checkers:
  - id: frozen_axes_unmodified
    reduction: VALUE
    zero_reason: frozen-axis-modified
    selector: check_frozen_axes_unmodified
    fires_when: >-
      a frozen artifact in the submission tree does not digest to the delivered
      artifact, or is absent from the submission
    fixture: mutate-frozen-train-stage
    substitution: none
  - id: stage_chain_order_observed
    reduction: ORDERING
    zero_reason: stage-chain-order-violated
    selector: check_stage_chain_order_observed
    fires_when: >-
      the harness's own phase log does not read open, parse, tokenize, train, or a
      phase consumed an artifact no earlier phase produced with that digest
    fixture: reorder-the-composition-plan
    substitution: none
  - id: stage_claim_matches_next_stage_consumption
    reduction: DIVERGENCE
    zero_reason: stage-claim-contradicted-by-chain
    selector: check_stage_claim_matches_next_stage_consumption
    fires_when: >-
      the parse report's claimed field disagrees with what the harness digested
      immediately before launching tokenize, under the field set the bound stage
      output contract compares
    fixture: parse-claims-a-clean-output-and-ships-a-dirty-one
    substitution: none
  - id: token_budget_respected_as_fed
    reduction: EFFECT
    zero_reason: token-budget-not-respected-as-fed
    selector: check_token_budget_respected_as_fed
    fires_when: >-
      the composition plan overrides consume_tokens away from the bound budget, or
      the fed, available or consumed counts disagree with it
    fixture: overspend-the-token-budget
    substitution: none
  - id: eval_split_not_trained_on
    reduction: ABSENCE
    zero_reason: evaluation-split-leaked-into-training
    selector: check_eval_split_not_trained_on
    fires_when: >-
      a held-out shingle appears in the consumed training stream decoded back
      through the submitted vocabulary
    fixture: fold-the-held-out-split-into-the-parse-output
    substitution: none
  - id: full_chain_completed_no_early_stop
    reduction: ABSENCE
    zero_reason: early-stop-loss-not-established
    selector: check_full_chain_completed_no_early_stop
    fires_when: >-
      the chain halted before the bound evaluation point, or never reached it, or
      skipped a stage
    fixture: halt-at-an-intermediate-checkpoint
    substitution: none
  - id: evaluation_point_is_bound_not_selected
    reduction: VALUE
    zero_reason: evaluation-point-submission-selected
    selector: check_evaluation_point_is_bound_not_selected
    fires_when: >-
      the composition plan selects a checkpoint, or the graded weights are not the
      bound checkpoint's
    fixture: select-a-lucky-checkpoint
    substitution: none
  - id: holdout_split_is_verifier_owned
    reduction: ABSENCE
    zero_reason: holdout-split-not-verifier-owned
    selector: check_holdout_split_is_verifier_owned
    fires_when: >-
      the graded split did not resolve under the root pinned on the verifier's
      admin plane, or a validation shard is present on the agent surface
    fixture: unpinned-holdout-root
    substitution: none
  - id: graded_parameters_bind_frozen_architecture
    reduction: VALUE
    zero_reason: frozen-architecture-not-instantiated
    selector: check_graded_parameters_bind_frozen_architecture
    fires_when: >-
      the graded artifact is not a parameter set of the declared decoder: a tensor
      the declaration implies is missing, a tensor it does not imply is present,
      or a shape does not bind to the declared values
    fixture: wrong-architecture-shape-map
    substitution: rejecting half on a planted fixture, because the snapshot is
      harness-written into a verifier-owned directory the submission never sees
  - id: graded_loss_from_harness_weights
    reduction: VALUE
    zero_reason: graded-loss-not-from-harness-weights
    selector: check_graded_loss_from_harness_weights
    fires_when: >-
      the weight file at the bound point is absent, digests differently from what
      the harness recorded, or carries a writer other than the harness
    fixture: substitute-the-graded-weight-file
    substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        No submission can move this checker: the weights are written by the
        harness-owned frozen train stage into a verifier-owned directory the
        submission never sees. The isolation boundary holds, so the rejecting half
        is carried on a planted fixture and the substitution is recorded in
        tests/checkers.yaml and in seed/tasks/OER-13/feasibility.yaml.
  - id: no_smoothing_on_graded_path
    reduction: VALUE
    zero_reason: readout-smoothing-on-graded-path
    selector: check_no_smoothing_on_graded_path
    fires_when: >-
      a reported validation loss differs from the verifier's raw recomputation by
      more than the bound tolerance, or the bound readout policy is not raw-only
    fixture: report-an-ema-blended-loss
    substitution: none
  - id: floor_anchor_matches_bound_reference
    reduction: VALUE
    zero_reason: floor-anchor-not-the-bound-reference
    selector: check_floor_anchor_matches_bound_reference
    fires_when: >-
      the reference composition the harness measures in-run does not reproduce the
      bound reference loss within the bound tolerance, the harness recorded no
      in-run reference measurement, or the budget in force is not the budget that
      anchor was established at
    fixture: feed-the-anchor-a-reference-loss-the-environment-does-not-establish
    substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        The floor anchor is measured by the harness over a reference composition
        materialized from solution/reference.py into a verifier-owned workspace,
        so no submission has a handle on it and no submission can move it. The
        rejecting half is therefore carried on a planted fixture in
        tests/test_output.py, which drives the live selector over a reference loss
        the environment does not establish and requires the bound zero reason. The
        accepting half is carried on the same fixture pair at the established
        value AND on the live reference run, whose in-run floor reproduces
        reference_loss_per_byte exactly.
  - id: loss_sustained_across_bound_evals
    reduction: INVARIANT
    zero_reason: improvement-not-sustained
    selector: check_loss_sustained_across_bound_evals
    fires_when: >-
      the loss does not improve on the in-run measured baseline overall, or fails
      to improve at one of the folds the verifier's schedule selects
    fixture: lose-one-scheduled-fold
    substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        A submission that beats the baseline overall while losing a specific
        scheduled fold is not reachable by editing the two free stages within the
        bound budget, so the rejecting half is carried on a planted fixture whose
        per-fold pair fails at one scheduled point, and the substitution is
        recorded in tests/checkers.yaml and in
        seed/tasks/OER-13/feasibility.yaml.
  - id: session_state_carried_forward
    reduction: INVARIANT
    zero_reason: session-state-broken
    selector: check_session_state_carried_forward
    fires_when: >-
      the ledger was not written by the harness, is empty, indexes attempts
      non-monotonically, omits a field the bound ledger contract requires, or
      records its newest attempt under a superseded contract
    fixture: carry-a-ledger-v1-attempt-across-the-contract-move
    substitution:
      half: rejecting
      carried_on: planted fixture
      why: >-
        The ledger is harness-written and the submission has no handle on it, so
        no submission can fire this checker. The rejecting half is carried on a
        planted fixture whose newest attempt was recorded under the pre-mutation
        ledger contract, which is exactly the stale control for the
        session-ledger-v2 silent mutation, and the substitution is recorded in
        tests/checkers.yaml and in seed/tasks/OER-13/feasibility.yaml.
  - id: end_to_end_gain_not_stage_local
    reduction: EFFECT
    zero_reason: stage-local-optimum-degrades-composition
    selector: check_end_to_end_gain_not_stage_local
    fires_when: >-
      the composed loss does not improve on the in-run measured baseline
      composition, or the in-run anchor pair is degenerate
    fixture: maximise-the-parse-retention-readout
    substitution: none

negative_controls:
  - id: neg-no-op
    what: the delivered composition submitted unchanged
    expected_reason: stage-local-optimum-degrades-composition
  - id: neg-stage-local-optimum
    what: >-
      a parse stage that raises chars_retained_ratio above the delivered
      baseline's, by keeping every source line and emitting a blank line after
      each, which is the stage's own readout getting strictly better while the
      held-out loss of the trained decoder rises
    expected_reason: stage-local-optimum-degrades-composition
  - id: neg-budget-overspend
    what: a composition plan that overrides consume_steps to the pre-mutation 80
    expected_reason: token-budget-not-respected-as-fed
  - id: neg-split-leak
    what: a parse stage that folds held-out FineWeb prose into its output, detected in the frozen token space
    expected_reason: evaluation-split-leaked-into-training
  - id: neg-smoothed-readout
    what: a composition plan carrying an EMA-blended reported_validation_loss
    expected_reason: readout-smoothing-on-graded-path
  - id: neg-early-stop
    what: a composition plan that halts the chain at snapshot c2
    expected_reason: early-stop-loss-not-established
  - id: neg-selected-checkpoint
    what: a composition plan that selects a checkpoint
    expected_reason: evaluation-point-submission-selected
  - id: neg-frozen-axis-edit
    what: an edited copy of the frozen train stage in the submission tree
    expected_reason: frozen-axis-modified
  - id: neg-chain-order
    what: a composition plan that runs tokenize before parse
    expected_reason: stage-chain-order-violated
  - id: neg-stage-claim-divergence
    what: a parse stage whose report claims a record count the chain contradicts
    expected_reason: stage-claim-contradicted-by-chain
  - id: neg-stale-composition-verdict
    what: >-
      a parse report satisfying the pre-mutation parsed-record-v1 field set only,
      which is the stale control ctl-composition-verdict-under-v1
    expected_reason: stage-claim-contradicted-by-chain
  - id: neg-unsustained
    what: a per-fold pair that improves overall and loses one scheduled fold
    expected_reason: improvement-not-sustained
  - id: neg-stale-ledger-verdict
    what: a ledger whose newest attempt was recorded under the pre-mutation ledger-v1
    expected_reason: session-state-broken
  - id: neg-surrogate-architecture
    what: >-
      a graded artifact that is a well-formed tensor set of a different
      architecture, or a count table, presented at the bound evaluation point
    expected_reason: frozen-architecture-not-instantiated
  - id: neg-unpinned-holdout
    what: a run whose graded split did not resolve under the pinned verifier-owned root
    expected_reason: holdout-split-not-verifier-owned
  - id: neg-substituted-weights
    what: a parameter snapshot at the bound point whose digest is not what the harness recorded
    expected_reason: graded-loss-not-from-harness-weights
  - id: neg-unestablished-floor-anchor
    what: >-
      an in-run floor measurement the live environment did not establish under
      the budget in force, which is the anchor the reward span rests on and a
      value no agent-visible byte carries
    expected_reason: floor-anchor-not-the-bound-reference

statement_ambiguity:
  claim: exactly one graded outcome
  reading_one:
    source: instruction.md, the section "What is graded, stated plainly"
    reduces_to: >-
      the mean cross entropy in nats per token of the verifier's held-out FineWeb
      validation split, under a forward pass of the parameter snapshot the
      harness-owned frozen train stage wrote at the final snapshot, lower better
  reading_two:
    source: environment/pipeline/protocol.json, the "evaluation" block
    reduces_to: >-
      the mean cross entropy in nats per token over the fold, computed by the
      verifier from the parameter snapshot the harness-owned frozen train stage
      wrote at the bound evaluation point, lower better
  same_quantity_because: >-
    Both readings name the same architecture, the same normalization, the same
    evaluation point, the same parameter provenance and the same direction. Over
    the whole split they are the same expression, and tests/frozen/nanogpt.py
    implements it once in validation_loss, which both the graded path and the
    in-run anchor measurement call through the same bound evaluator. There is no
    second quantity anywhere in the bundle that a reader could take to be the
    objective, and there is no longer a second model either.
  no_second_outcome: >-
    Every rule the grader enforces resolves to a zero with a machine-readable
    reason or to the single continuous term. There is no partial-credit path, no
    alternative objective and no binary outcome.

