reward_contract:
  reward_path: /logs/verifier/reward.txt
  reward_carrier: bare float
  score_document_path: /logs/verifier/score.json
  score_document_shape: '{"reward": <float>, "reason": <kebab>, "metric": {...}, "checkers": [...]}'
  measured_correction_reward_carrier: >-
    The live seed/forge/verifier.py binds the reward carrier to reward.txt, not
    reward.json. The bare float goes to /logs/verifier/reward.txt and the
    machine-readable reason and metric block go to the companion
    /logs/verifier/score.json. Both are written from the same trap-guarded path,
    so the instrument's binding and the reason carrier never disagree.
  measured_correction_shared_root: >-
    /logs/verifier/ is a single shared host path and concurrent lanes collide on
    it. Local exercise of tests/test.sh redirects the reward root with
    OER13_REWARD_ROOT to a lane-private directory. The bound contract path inside
    the bundle stays /logs/verifier/reward.txt; only the local exercise is
    redirected, and feasibility.yaml records that the exercise ran redirected.

generated_artifacts:
  banner: "GENERATED SECTION. DO NOT HAND-EDIT."
  source_named_in_every_banner: solution/grounding.yaml
  files:
    - solution/solve.sh
    - solution/TRUTH.md
    - solution/rubrics.json
    - solution/fixtures.json
    - tests/test_output.py
    - trajectories/golden.jsonl
  purity: >-
    solution/recompute.py imports json, hashlib and pathlib only. It invokes no
    model, no network, no clock, no locale and no random source, and running it
    twice over frozen bytes produces byte-identical output.
  standing_defect:
    id: gap-oer-13-generator-still-on-the-retired-path
    what: >-
      solution/recompute.py was NOT rewritten by this re-base lane. It still
      derives its outputs from the retired path's shape: it reads observed keys
      that this file no longer carries, such as baseline_loss_per_byte and the
      per-fold pairs, and it embeds a verbatim template of the previous
      tests/test_output.py including the retired floor-anchor constant. Running it
      as it stands would fail on the missing keys, and if it were repaired
      naively it would overwrite the re-based tests/test_output.py with the
      surrogate one.
    why_it_is_recorded_rather_than_fixed: >-
      Rewriting an 849-line generator is an authoring change rather than a
      re-base, and a generator repaired against numbers this family has not
      measured would manufacture exactly the fabricated anchors the re-base
      removed. The generated artifacts staged by this lane, tests/test_output.py
      above all, are hand-authored and consistent with this file; the generator
      must be brought back onto them before the slot is frozen.
    blocks_freeze: true

