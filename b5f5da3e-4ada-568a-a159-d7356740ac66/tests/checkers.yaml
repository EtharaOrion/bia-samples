schema: forge.checkers/v1

reduction_kinds: [VALUE, EFFECT, ABSENCE, INVARIANT, ORDERING, DIVERGENCE]

# `reward_path` is the path seed/forge/verifier.py binds as the runtime-mounted
# reward carrier: one float, nothing else. The shaped document the lane spec
# describes is a second carrier at `reward_document_path`, and the score document is
# a third. All three are written by tests/test.sh, the float last. The split is
# recorded rather than resolved by preference, under gap-oer-04-reward-path-carrier-split.
reward_path: /logs/verifier/reward.txt
reward_document_path: /logs/verifier/reward.json
score_document_path: /logs/verifier/score.json
telemetry_path: /logs/verifier/verifier_telemetry.json

aggregation:
  mode: required_pass
  rationale: >-
    tests/grade.py evaluates the eight required checkers as gates, in the bound order
    checkers.GATES fixes. The first gate below 1.0 sets the reward to exactly 0.0 and
    publishes that gate's zero_reason, so required_pass names the gate semantics
    exactly. It does not name the passing value. When every required gate passes,
    grade.py emits a continuous float: the anchor-normalised improvement at the
    graded step multiplied by the significance factor from the one non-required
    checker. That factor is clip(sep / 0.05, 0, 1), which is continuous in sep and
    does not step at the margin, so the passing value is never binary and reaches
    exactly 1.0 only when the target is met and the separation clears the margin.
    The one non-required checker is deliberately outside the gate set: making it a
    gate would collapse the unproven band into a binary rejection, which is the
    exact failure this slot exists to keep visible.

# The AR7 seam, stated where a machine reads it. Three outcomes, never two.
outcome_states:
  - id: significance-established
    meaning: the target was reached on the re-executed seeds and sep >= 0.05
    classification: pass
  - id: significance-unestablished-at-ceiling
    meaning: >-
      the run COMPLETED, the target was reached on the re-executed seeds, the seed
      budget was the binding limit at the bound ceiling of 20, and the measured
      separation did not clear the bound margin of 0.05
    classification: unproven, distinct from failed
    never_conflate_with: [screen-target-not-reached, crossing-not-sustained, early-stop-not-a-crossing, verifier-timeout-exceeded]
    why: >-
      A submission in this band is not one that failed to optimize. Its true mean
      sits close enough to the target that the bound seed budget cannot separate it
      at the required confidence. That is a shortfall in the verifier's power, not a
      property of the agent's work, so recording it as a failure would attribute the
      verifier's budget to the solver. The contract already draws this distinction in
      the opposite direction for verifier timeouts, calling a timed-out run failed
      and not unproven; this mirrors that discipline.
  - id: significance-not-applicable
    meaning: no sustained crossing exists, so significance was never at issue
    classification: failed, owned by the required gates and their own reasons

checkers:
  - id: target_reached_on_reexecuted_seeds
    statement: "Every seed the verifier re-executed drove the verifier's own held-out evaluation below 3.28 at some scheduled point."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_target_reached_on_reexecuted_seeds
    zero_reason: screen-target-not-reached
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json seeds[*].raw_val_loss, the per-grid-point cross-entropy tests/held_out_eval.py computed in the verifier's own process on the frozen validation shard."
    compiled_test: "tests/test_output.py::test_target_reached_on_reexecuted_seeds"
    classification_on_zero: "failed, not unproven"
    rejecting_half: live
  - id: graded_readout_is_unsmoothed
    statement: "The graded readout is the verifier's raw evaluation at the graded step, with no EMA, average or filter anywhere on its path."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_readout_is_unsmoothed
    zero_reason: graded-readout-smoothed
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json bound.readout_smoothing_admitted and seeds[*].readout_source / graded_readout_key, all written by tests/runner.py from the evaluator it called, never from a field the submission wrote."
    compiled_test: "tests/test_output.py::test_graded_readout_is_unsmoothed"
    classification_on_zero: "failed, not unproven"
    rejecting_half: planted-fixture
    rejecting_half_substitution: >-
      No submission can set readout_source, because tests/runner.py writes it as a
      literal from its own process and never copies a submission field into it. The
      isolation boundary holds, so the rejecting half is carried on a planted
      telemetry fixture rather than on a submission, and the substitution is recorded
      here and in seed/tasks/OER-04/feasibility.yaml rather than papered over.
  - id: crossing_is_sustained
    statement: "The target holds at the graded step and at the next two evaluation points the verifier itself scheduled, so a noise dip cannot be harvested."
    reduction: INVARIANT
    reached_by: tests/grade.py
    selector: check_crossing_is_sustained
    zero_reason: crossing-not-sustained
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json seeds[*].evaluation_points and seeds[*].raw_val_loss against bound.sustain_points_required, the schedule tests/runner.py fixed before anything was measured."
    compiled_test: "tests/test_output.py::test_crossing_is_sustained"
    classification_on_zero: "failed, not unproven"
    rejecting_half: live
  - id: early_stop_is_not_a_crossing
    statement: "No graded crossing is credited to a run that halted at a favourable evaluation before its sustain window closed."
    reduction: ABSENCE
    reached_by: tests/grade.py
    selector: check_early_stop_is_not_a_crossing
    zero_reason: early-stop-not-a-crossing
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json seeds[*].run_completed and seeds[*].final_step, both derived from the subprocess return code and the ingest ledger tests/runner.py built."
    compiled_test: "tests/test_output.py::test_early_stop_is_not_a_crossing"
    classification_on_zero: "failed, not unproven"
    rejecting_half: live
  - id: evaluation_grid_is_verifier_scheduled
    statement: "The evaluation points are the verifier's own ascending grid at the bound period, neither chosen, thinned nor reordered by the submission."
    reduction: ORDERING
    reached_by: tests/grade.py
    selector: check_evaluation_grid_is_verifier_scheduled
    zero_reason: evaluation-grid-not-verifier-scheduled
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json seeds[*].grid_source and the gap sequence of seeds[*].evaluation_points against bound.evaluation_period_steps, the grid tests/runner.py::evaluation_grid built from the claim alone."
    compiled_test: "tests/test_output.py::test_evaluation_grid_is_verifier_scheduled"
    classification_on_zero: "failed, not unproven"
    rejecting_half: planted-fixture
    rejecting_half_substitution: >-
      tests/runner.py::evaluate_ledger walks the harness grid and can emit no other
      order, so no submission can fire this checker. The isolation boundary holds and
      the rejecting half is carried on a planted telemetry fixture, recorded here and
      in seed/tasks/OER-04/feasibility.yaml.
  - id: graded_weights_are_harness_owned
    statement: "The weights evaluated at the graded step are the state the harness scheduled and digested at ingest, not a checkpoint the submission selected."
    reduction: VALUE
    reached_by: tests/grade.py
    selector: check_graded_weights_are_harness_owned
    zero_reason: graded-weights-not-harness-owned
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json seeds[*].checkpoint_ledger, the sha256 tests/runner.py::ingest_ledger took over the bytes it found at each harness-scheduled step, cross-read against seeds[*].evaluated_weights."
    compiled_test: "tests/test_output.py::test_graded_weights_are_harness_owned"
    classification_on_zero: "failed, not unproven"
    rejecting_half: live
  - id: frozen_axes_survive_reexecution
    statement: "Re-execution ran under the axes the harness locked: dataset, batch size, architecture, and one forward-backward pass per step."
    reduction: EFFECT
    reached_by: tests/grade.py
    selector: check_frozen_axes_survive_reexecution
    zero_reason: frozen-axis-moved
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json frozen_axes, read back from the run manifest the re-executed process wrote under the harness-named path, against frozen_axes_locked which tests/runner.py holds as a literal."
    compiled_test: "tests/test_output.py::test_frozen_axes_survive_reexecution"
    classification_on_zero: "failed, not unproven"
    rejecting_half: live
  - id: claim_reconciles_with_reexecution
    statement: "The claimed step count is not better than what re-execution produced, so the claim can lower an outcome and can never raise one."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_claim_reconciles_with_reexecution
    zero_reason: claim-exceeds-reexecution
    required: true
    weight: 1
    live_state_read: "verifier_telemetry.json submission.claimed_step, copied in as a claim, against the graded step tests/checkers.py::graded_step derives from the verifier's own per-seed measurements."
    compiled_test: "tests/test_output.py::test_claim_reconciles_with_reexecution"
    classification_on_zero: "failed, not unproven"
    rejecting_half: live
  - id: significance_separation_cleared
    statement: "Over the multi-seed measurement at the bound seed ceiling, sep = mean(s_i) - spread / (2 * sqrt(n)) clears the bound separation margin of 0.05."
    reduction: DIVERGENCE
    reached_by: tests/grade.py
    selector: check_significance_separation_cleared
    zero_reason: significance-unestablished-at-ceiling
    required: false
    weight: 1
    live_state_read: "verifier_telemetry.json seeds[*], reduced through tests/checkers.py::per_seed_scores and ::separation against bound.separation_margin, bound.graded_seed_floor and bound.seed_ceiling, every one of which tests/runner.py wrote."
    compiled_test: "tests/test_output.py::test_significance_separation_cleared"
    classification_on_zero: "unproven, not failed"
    continuous: true
    continuity_rule: >-
      The value is clip(sep / 0.05, 0, 1). It is continuous in sep across the whole
      domain and reaches exactly 0.0 only at sep <= 0, so a submission at sep = 0.049
      keeps 98 percent of what a submission at sep = 0.050 keeps. The reward degrades
      rather than flipping, because a flip would put a submission just inside the
      margin in the same recorded condition as one with no separation at all, and
      those two submissions are not in the same condition.
    required_false_rationale: >-
      Marking this required would route it through the gate chain, where any value
      below 1.0 is a binary rejection. That would erase the unproven state by
      rendering it as a failure, which is precisely the collapse this slot forbids.
