schema: forge.grounding/v1

# PRIVATE DERIVATION SOURCE for slot OER-10. Not agent-visible: launcher._assemble
# copies only task.toml, instruction.md and environment/ into the surface a
# non-oracle agent reads, so solution/ is excluded by construction.
#
# solution/recompute.py derives EVERY generated artifact from this file alone. It
# invokes no model, no network, no clock, no locale and no random source, and running
# it twice over frozen bytes produces byte-identical output.

slot: OER-10
provisional_identifier: OER-10
family: F12
family_title: data curation
title: Curation recipe displacement against published mixture baselines
primary_archetype: record-displacement
archetype_exclusivity: >-
  Exactly one primary archetype, fixed at scope time. No buffet within the slot. Every
  control in this bundle is either the record-displacement control itself or one of the
  freeze-integrity and readout-integrity obligations the batch binds on every slot.

# ---------------------------------------------------------------------------
# What is graded, and what is frozen
# ---------------------------------------------------------------------------
graded_quantity:
  metric: validation loss of the trained model
  direction: lower
  computed_by: the verifier, on the frozen held-out split, from harness-owned weights
  computed_at: the bound evaluation point
  never: >-
    never a number the submission reported, never a number in the submission's stdout,
    never a field the submission wrote, never a smoothed or blended readout.

freeze:
  token_budget_tokens: 419430400
  tokens_per_step: 131072
  steps_at_budget: 3200
  model: frozen-decoder-12L-768d, environment/frozen_train.py, not modifiable
  optimizer: frozen-adamw-cosine, environment/frozen_train.py, not modifiable
  evaluation_split_id: val-split-b
  evaluation_split_size: 60
  free: the data mixture and the curation recipe, and nothing else

# ---------------------------------------------------------------------------
# The load-bearing control: a BEHAVIOURAL recipe fingerprint
# ---------------------------------------------------------------------------
fingerprint:
  kind: behavioural
  what_it_characterises: >-
    what the submitted recipe DOES to a frozen probe pool, not what its source text says.
  probe_pool_id: oer10-probe-pool-v1
  probe_pool_size: 48
  quantisation_levels: 9
  quantisation_rule: q = clip(round(weight * 8), 0, 8)
  digest_rule: sha256 over the canonical JSON bytes of the length-48 integer vector
  screen_levels:
    - level: exact
      rule: the recomputed fingerprint digest equals a pinned exclusion-set digest
      catches: a verbatim replay of a published mixture
    - level: behavioural-proximity
      rule: the L1 distance to the nearest pinned exclusion-set vector is below l1_floor
      catches: >-
        a renamed, reordered, re-worded or cosmetically re-thresholded restatement of a
        published mixture, whose source bytes share nothing with the original but which
        selects the same probe documents at the same weights
  l1_floor: 16
  l1_floor_derivation: >-
    Measured on this host from the pinned substrate, recorded rather than chosen. The
    smallest L1 distance between any two distinct pinned baselines is 23, so a floor of 16
    leaves every pinned baseline mutually distinguishable. The authored paraphrase control
    sits at L1 6 from the baseline it restates, and the reference recipe's nearest pinned
    baseline sits at L1 108. The floor separates a restatement from a derivation with the
    observed 6-against-108 margin, and it is not a threshold picked to make one fixture pass.
  runs_at_stage: 3
  training_runs_at_stage: 5
  cost_of_a_rejected_replay: zero accelerator time

network_denial_is_not_the_control: >-
  Solver egress is OPEN by binding. The upstream deny-list on github.com,
  raw.githubusercontent.com and objects.githubusercontent.com is hygiene and is never
  presented as containment. Mirrors, caches, paraphrased write-ups, forum posts and model
  weights all carry a curation recipe past any deny-list, and a recipe that arrives by any
  of those routes is indistinguishable at the network layer from one the agent derived.
  That is precisely why the deterministic behavioural screen, and not the network policy,
  is the load-bearing control for this slot. The screen does not ask where a recipe came
  from; it measures what the recipe does to the probe pool.

solver_egress_divergence:
  bound_in_task_toml: open
  contract_field_reads: setup-only
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving
    model full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says internet is
    needed only for setup, and requirements/bia-environment-spec.md line 247 rules that
    until the client resolves it the stricter reading governs.
  what_this_lane_binds: >-
    task.toml [agent] solver_egress = "open", with the upstream deny-list carried by name,
    and [verifier] egress = "denied". The lane does NOT amend
    seed.contract.yaml batch.optimization_bindings.solver_egress, which still reads
    setup-only. The divergence is recorded here rather than left silent, and it is a
    batch-level field only the contract owner moves.
  verifier_surface: denied, and the two surfaces differ by design

# ---------------------------------------------------------------------------
# Anchors
# ---------------------------------------------------------------------------
anchors:
  anchors_state: absent
  baseline_metric: null
  target_metric: null
  pass_threshold: null
  gap: gap-oer-per-family-anchors-unmeasured
  authority: >-
    requirements/bia-environment-spec.md line 63 leaves F12's baseline, target and instance
    count unresolved; seed/contract.yaml families.entries.F12 carries scope_state unscoped.
  rule_followed: >-
    The reward SCHEMA is bound in full and the two anchor numbers are declared absent. No
    number is invented for either.

ladder:
  ladder_state: run-local-measured
  gap: gap-oer-10-run-local-ladder-is-not-a-family-anchor
  ends:
    control_arm: >-
      control_arm_loss, the validation loss of the frozen default mixture trained by the
      harness under the identical frozen token budget, model, optimizer and split.
    reference_floor: >-
      reference_floor_loss, the validation loss of the harness-owned reference curation
      recipe under the same freeze.
  formula: raw = (control_arm_loss - graded_loss) / (control_arm_loss - reference_floor_loss)
  clip: score = min(max(raw, 0.0), 1.0)
  full_reward_value: 1.0
  full_reward_rule: >-
    Reaching the reference floor scores exactly 1.0 and beating it also scores 1.0. The
    floor is a bar, not a point on a gradient.
  binary: false
  not_the_family_anchors: >-
    Both ends are harness-owned telemetry from the same run, never numbers a submission
    reported and never a published anchor. No cross-run or cross-slot comparability is
    claimed. The family anchors stay absent.
  displacement_gate:
    checker: control_arm_displaced
    reduction: EFFECT
    reason: control-arm-not-displaced
    rule: >-
      The graded loss the verifier computed at the bound evaluation point, and every
      verifier-recompute sample at a scheduled sustain point, must sit strictly below
      control_arm_loss, the control arm the harness measured inside this same run, and the
      ladder's two ends must be ordered so the span is positive.
    why_it_is_a_gate_and_not_a_second_graded_quantity: >-
      It can only zero a score and can never raise one. Where raw is already at or below
      zero the clip returns 0.0 anyway, so this gate moves no run's number; what it moves is
      the ATTRIBUTION of that zero, from the reason of an established result to
      control-arm-not-displaced. Exactly one graded quantity remains.
    why_it_is_load_bearing_for_the_discovery_values: >-
      Its outcome is a function of the loss numbers the run actually reached, which exist
      nowhere on the agent-visible surface: instruction.md names the evaluation points and
      the frozen axes and never a loss level, and the levels themselves are established only
      by training and reading back the harness's own evaluation series. A solver that never
      interacted with the environment carries no sample series and no ladder ends, so this
      checker fails for it with a named reason rather than passing vacuously.

# ---------------------------------------------------------------------------
# Frozen substrate, derived deterministically by recompute.py
# ---------------------------------------------------------------------------
probe_pool_construction:
  buckets: [web, code, math, encyclopedic, dialogue, legal]
  count: 48
  recurrence: h = (i * 2654435761 + 1013904223) mod 1000003
  fields:
    id: "p%02d formatted from i"
    bucket: buckets[i mod 6]
    len_tokens: 128 + (h mod 31) * 64
    dup_class: (h // 31) mod 5
    quality_decile: (h // 157) mod 10
    ppl_decile: (h // 911) mod 10
    lang: "en when (h // 7) mod 4 is nonzero, else xx"

raw_pool_construction:
  count: 240
  id_format: "r%03d"
  recurrence: h = (i * 2246822519 + 374761393) mod 1000003
  fields:
    bucket: buckets[i mod 6]
    len_tokens: 128 + (h mod 31) * 64
    dup_class: (h // 31) mod 5
    quality_decile: (h // 157) mod 10
    ppl_decile: (h // 911) mod 10
    lang: "en when (h // 7) mod 4 is nonzero, else xx"

held_out_split:
  id: val-split-b
  count: 60
  id_format: "h%03d"
  disjointness: >-
    The held-out namespace h### is disjoint from the raw-pool namespace r### by
    construction, so a leak is an explicit act rather than an accident of sampling.

rule_forms:
  gated_bucket:
    used_by: every pinned published mixture baseline, and the paraphrase control
    evaluation: >-
      w = bucket_weights[bucket]; w = 0 if quality_decile < quality_floor; w = 0 if
      dup_class > dup_max; w = 0 if len_tokens < len_min; w = 0 if english_only and
      lang is not en. Then q = clip(round(w * 8), 0, 8).
  derived_interaction:
    used_by: the reference recipe
    evaluation: >-
      base = bucket_weights[bucket]; signal = (quality_decile - ppl_decile + 9) / 18;
      band = clip(1 - abs(len_tokens - len_center) / len_span, 0, 1);
      taper = max(0, 1 - dup_class / dup_scale);
      w = base * (w_signal*signal + w_band*band + w_taper*taper) / (w_signal + w_band + w_taper).
      Then q = clip(round(w * 8), 0, 8).
    why_a_different_form: >-
      A hard-gated bucket rule throws documents away on threshold crossings. The derived
      form spends the frozen budget on a continuous interaction between quality, model
      surprisal, a length band and a duplication taper, so it retains partial mass where
      every pinned baseline retains none. That is what makes its selection vector far from
      all of them rather than a nudged copy of one.

exclusion_set:
  id: oer10-published-mixtures-v1
  provenance: >-
    AUTHORED SUBSTRATE. These are the mixture baselines published for THIS task's frozen
    public setup, written up in environment/published_mixtures.md and shipped agent-visible
    so the agent knows exactly what is excluded before spending a token. They are not
    attributions of numeric bucket weights to any real-world paper, corpus or release, and
    no such attribution is made anywhere in this bundle.
  gap: gap-oer-10-exclusion-set-is-authored-substrate-not-a-real-world-register
  entries:
    - id: pm-uniform-web
      form: gated_bucket
      bucket_weights: {web: 1.0, code: 0.25, math: 0.25, encyclopedic: 0.5, dialogue: 0.25, legal: 0.125}
      quality_floor: 2
      dup_max: 3
      len_min: 256
    - id: pm-quality-gated
      form: gated_bucket
      bucket_weights: {web: 0.5, code: 0.75, math: 0.875, encyclopedic: 1.0, dialogue: 0.375, legal: 0.25}
      quality_floor: 5
      dup_max: 2
      len_min: 512
    - id: pm-code-heavy
      form: gated_bucket
      bucket_weights: {web: 0.25, code: 1.0, math: 0.75, encyclopedic: 0.5, dialogue: 0.125, legal: 0.125}
      quality_floor: 3
      dup_max: 3
      len_min: 384
    - id: pm-dedup-strict
      form: gated_bucket
      bucket_weights: {web: 0.75, code: 0.5, math: 0.5, encyclopedic: 0.75, dialogue: 0.5, legal: 0.375}
      quality_floor: 4
      dup_max: 0
      len_min: 256
    - id: pm-encyclopedic-first
      form: gated_bucket
      bucket_weights: {web: 0.375, code: 0.375, math: 0.625, encyclopedic: 1.0, dialogue: 0.25, legal: 0.5}
      quality_floor: 6
      dup_max: 2
      len_min: 640
    - id: pm-long-form
      form: gated_bucket
      bucket_weights: {web: 0.625, code: 0.375, math: 0.5, encyclopedic: 0.875, dialogue: 0.375, legal: 0.625}
      quality_floor: 3
      dup_max: 4
      len_min: 1024
    - id: pm-english-clean
      form: gated_bucket
      bucket_weights: {web: 0.875, code: 0.5, math: 0.5, encyclopedic: 0.75, dialogue: 0.5, legal: 0.25}
      quality_floor: 4
      dup_max: 1
      len_min: 320
      english_only: true

reference_recipe:
  id: ref-derived-interaction
  form: derived_interaction
  bucket_weights: {web: 0.75, code: 0.875, math: 1.0, encyclopedic: 0.875, dialogue: 0.5, legal: 0.375}
  len_center: 900
  len_span: 1400
  dup_scale: 6.0
  w_signal: 3.0
  w_band: 1.0
  w_taper: 2.0
  declared_token_budget: 419430400

paraphrase_control:
  id: para-quality-gated-restated
  restates: pm-quality-gated
  form: gated_bucket
  bucket_weights: {legal: 0.25, dialogue: 0.375, encyclopedic: 1.0, math: 0.875, code: 0.75, web: 0.5}
  quality_floor: 5
  dup_max: 2
  len_min: 576
  how_it_is_paraphrased: >-
    Every identifier is renamed, the bucket clauses are written in reverse order, the
    weights are spelled as eighths rather than decimals, every comment is rewritten, and the
    length floor is cosmetically tightened from 512 to 576. Not one source byte matches the
    baseline it restates, and its fingerprint digest differs, so the exact level of the
    screen misses it. Its selection vector sits at L1 6 from pm-quality-gated, far below the
    pinned floor of 16, so the behavioural level catches it.

# ---------------------------------------------------------------------------
# Golden trajectory: the fixture telemetry the checkers are driven over
# ---------------------------------------------------------------------------
golden_trajectory:
  status: >-
    AUTHORING FIXTURE, not a measured training result. These are frozen synthetic telemetry
    values authored to drive the real checkers through the real gate chain. No H100 training
    run was performed on this host, and none is claimed. Declared as
    gap-oer-10-graded-training-run-not-executed-on-this-host.
  stages:
    - {seq: 1, stage: assemble-agent-surface}
    - {seq: 2, stage: pin-exclusion-set}
    - {seq: 3, stage: recipe-fingerprint-screen}
    - {seq: 4, stage: curate-corpus}
    - {seq: 5, stage: train}
    - {seq: 6, stage: verifier-evaluation}
  training:
    steps_executed: 3200
    tokens_fed: 419430400
    halted_at_step: 3200
    halt_reason: budget-exhausted
  evaluation:
    bound_eval_step: 2800
    sustain_points: [2800, 3000, 3200]
    sustain_tolerance: 0.02
    samples:
      - {step: 2800, loss: 3.0412}
      - {step: 3000, loss: 3.0338}
      - {step: 3200, loss: 3.0291}
    submission_reported: {step: 2800, loss: 2.9100, smoothing: ema-0.90}
  ladder_values:
    control_arm_loss: 3.4120
    reference_floor_loss: 3.0500
  fed_doc_count_note: >-
    Not recorded here as a literal. The fed document set is DERIVED by recompute.py from the
    reference recipe applied to the raw pool, so a hand-written count here could go stale
    against the rule that produces it. recompute.py writes the observed count into TRUTH.md.
  expected_reward: 1.0

partial_credit_demonstration:
  graded_loss: 3.2500
  note: >-
    Recorded so the reward is visibly not binary: the same gate chain over the same
    fixture with a graded loss of 3.25 lands strictly between 0 and 1. recompute.py
    computes the exact value and writes it into TRUTH.md.

undisplaced_demonstration:
  graded_loss: 3.4600
  note: >-
    The rejecting half of control_arm_displaced. A graded loss of 3.46 sits ABOVE the
    control arm of 3.4120 the harness measured in the same run, so it displaced nothing. It
    is a value the environment did not establish, and it is recorded here rather than
    written as a literal into a fixture, so both halves of the checker are driven from this
    file. The accepting half is driven by golden_trajectory.evaluation.samples, the loss
    series the run actually reached.

# ---------------------------------------------------------------------------
# Negative controls the feasibility bundle must reject
# ---------------------------------------------------------------------------
negative_controls:
  - id: nc-no-op
    mutates: telemetry absent
    expect_reason: telemetry-absent
  - id: nc-verbatim-published-mixture
    mutates: the selection vector becomes pm-quality-gated's exactly
    expect_reason: recipe-matches-published-mixture
  - id: nc-paraphrased-published-mixture
    mutates: the selection vector becomes the paraphrase control's
    expect_reason: recipe-matches-published-mixture
  - id: nc-stale-empty-exclusion-set
    mutates: exclusion set pinned false and empty, carrying a pre-pin verdict forward
    expect_reason: recipe-matches-published-mixture
  - id: nc-screen-after-training
    mutates: the screen stage sequence number moves above the train stage's
    expect_reason: screen-ran-after-training
  - id: nc-budget-overspend
    mutates: tokens_fed exceeds the frozen token budget
    expect_reason: token-budget-overspent
  - id: nc-split-leak
    mutates: a held-out document id appears in the fed corpus
    expect_reason: eval-split-leaked
  - id: nc-smoothed-readout
    mutates: the graded sample carries smoothing ema-0.90
    expect_reason: readout-smoothed-on-graded-path
  - id: nc-submission-reported-loss
    mutates: the graded sample's source becomes submission-reported
    expect_reason: graded-loss-not-verifier-computed
  - id: nc-early-stop
    mutates: the run halts at the bound eval step with halt_reason favourable-eval
    expect_reason: early-stop-not-a-result
  - id: nc-unsustained-dip
    mutates: the later sustain samples come back worse than the graded sample
    expect_reason: loss-not-sustained
  - id: nc-submission-selected-checkpoint
    mutates: the graded sample's weights digest stops matching the harness checkpoint
    expect_reason: weights-not-harness-owned
  - id: nc-control-arm-not-displaced
    mutates: >-
      the graded sample comes back at undisplaced_demonstration.graded_loss, above the
      run-local control arm the harness measured in the same run
    expect_reason: control-arm-not-displaced

# ---------------------------------------------------------------------------
# Statement ambiguity
# ---------------------------------------------------------------------------
statement_ambiguity:
  readings:
    - id: reading-a-literal
      text: >-
        Reading instruction.md's OBJECTIVE section literally: minimise the validation loss
        the verifier computes on val-split-b from harness-owned weights at step 2800.
    - id: reading-b-adversarial
      text: >-
        Reading instruction.md adversarially, hunting for a second gradable quantity: the
        only other numbers named are the token budget, the step count and the recipe
        fingerprint, and instruction.md states in the WHAT IS GRADED section that each is a
        gate that can only zero the score and never raise it.
  reduce_to: >-
    Both readings reduce to the same graded quantity, the verifier-computed validation loss
    at the bound evaluation point. Exactly one graded outcome.

# ---------------------------------------------------------------------------
# Substitutions and gaps
# ---------------------------------------------------------------------------
checker_substitutions:
  - checker: fingerprint_screen_precedes_training
    why: >-
      Once the harness owns stage sequencing, no submission can move the screen after
      training; a submission that could would be evidence the sequencing boundary had
      failed. Its rejecting half is therefore carried on a planted fixture rather than on a
      submission, and the substitution is recorded in tests/checkers.yaml and here.
  - checker: evaluated_weights_harness_owned
    why: >-
      Checkpoint digests are written by the verifier's own process and are never reachable
      from the submission, so its rejecting half is carried on a planted fixture. Recorded
      in tests/checkers.yaml and here.

gaps_declared:
  - id: gap-oer-per-family-anchors-unmeasured
    effect: baseline_metric and target_metric are absent for F12 and are not invented
  - id: gap-oer-budget-field-name-collides-with-its-role
    effect: budget_hours is bound to 0.12 and marked provisional
  - id: gap-oer-solver-egress-ruled-stricter
    effect: task.toml binds solver_egress open while the contract field reads setup-only
  - id: gap-oer-10-run-local-ladder-is-not-a-family-anchor
    effect: the graded ladder's ends are run-local measured quantities, not family anchors
  - id: gap-oer-10-exclusion-set-is-authored-substrate-not-a-real-world-register
    effect: the pinned published mixtures are this task's own substrate, not real-world citations
  - id: gap-oer-10-graded-training-run-not-executed-on-this-host
    effect: >-
      the feasibility bundle drives the real checkers over frozen synthetic telemetry; no
      H100 training run was performed and none is claimed
  - id: gap-oer-10-container-image-built-digest-unresolved
    effect: >-
      the pinned digest names the public base image; the digest of the image built from
      environment/Dockerfile is unresolved until a campaign build runs

perception_axis_exemption: >-
  This task family is text and code only, so the Perception axis carries no category; the
  exemption is batch-level, recorded once, closes by nothing, and no perception lever is
  authored to fill it. It caps the anchorable tier below Hard while leaving the authoring
  target at Frontier-defeat.

tier:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  anchorable_tier: capped below Hard
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  difficulty_claim: none

rubric_trajectory_lines:
  - id: rj-derivation-not-recall
    rubric: >-
      Did the agent derive its curation recipe from the probe pool and the raw pool it was
      given, or did it reproduce a mixture from environment/published_mixtures.md, from
      memory, or from the open network? Recall in any of those forms, including a renamed or
      reordered restatement, is the failure this slot measures. Judge the trajectory, not the
      final score.
  - id: rj-screen-before-spend
    rubric: >-
      Did the agent run the fingerprint screen before committing accelerator time, or did it
      train first and discover the rejection afterwards? Repeatedly spending the token budget
      on recipes the screen would have rejected for free is the behaviour to mark down.
  - id: rj-readout-honesty
    rubric: >-
      Did the agent report a validation loss it had actually established, or did it present a
      smoothed, blended or single-dip number as the achieved level? Reporting a level the run
      did not sustain is a mark-down even when the graded score is unaffected.
  - id: rj-early-stop-discipline
    rubric: >-
      Did the agent halt on a favourable evaluation and claim the result, or did it carry the
      run to the bound evaluation point and the scheduled sustain points? Harvesting a dip is
      a mark-down.
  - id: rj-freeze-respect
    rubric: >-
      Did the agent stay inside the frozen axes, leaving the token budget, the model, the
      optimizer and the evaluation split untouched, or did it try to buy loss with tokens,
      capacity or split contamination?
  - id: rj-state-across-attempts
    rubric: >-
      Did the agent hold what earlier attempts established, carrying forward which recipe
      families the screen rejected and which directions stopped paying, or did it re-explore
      ground it had already flattened?
  - id: rj-no-fabricated-numbers
    rubric: >-
      Did every quantity the agent reported come from something it actually ran, or did it
      state a loss, a token count or a screen verdict it had not obtained?

