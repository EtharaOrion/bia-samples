schema_version = "1.4"

# schema_version is a top-level scalar and stays above the first table header. TOML scopes
# every key to the most recent header, so an assignment written below [task] silently
# becomes task.schema_version while still reading correct to a human.

# Deliverables snapshotted out of the environment before teardown. A graded artifact that
# is not snapshotted is reconstructed after the fact rather than read. The first two entries
# are the batch's required graded deliverables and appear in every slot.
artifacts = [
  "/app/submission.py",
  "/logs/agent/trajectory.jsonl",
  "/workspace/submission/recipe.py",
  "/telemetry/run_record.json",
  "/logs/verifier/telemetry.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/score.json",
]

[task]
name = "bia/oer10-curation-recipe-displacement"
version = "1.0.0"
description = "Derive a data curation recipe that lowers validation loss under a frozen token budget, model, optimizer and evaluation split, where a recipe whose behaviour matches a published mixture baseline is rejected before any training runs."
authors = [{ name = "Bia" }]
keywords = ["optimization", "bounded-continuous", "data-curation", "record-displacement"]

[metadata]
tags = ["optimization", "bounded-continuous"]
category = "optimization"
slot = "OER-10"
provisional_identifier = "OER-10"
family = "F12"
family_title = "data curation"
primary_archetype = "record-displacement"
archetype_exclusivity = "exactly one primary archetype, fixed at scope time. No buffet within the slot."

[metadata.axes]
metric = "validation loss of the trained model"
direction = "lower"
frozen = "the token budget, the model, the optimizer and the evaluation split"
free = "the data mixture and the curation recipe"

# CANONICAL PATH for every bound optimization field in this batch:
# metadata.optimization.<field>. One table, one deterministic lookup. Nothing
# optimization-bound lives anywhere else in this manifest.
#
# max_timeout_hours and budget_hours are DISTINCT and are never aliases:
#   max_timeout_hours terminates the refinement loop ACROSS attempts, in hours.
#   budget_hours      bounds ONE attempt, in hours. 0.12 hours is 7.2 minutes.
# Six hours bounds one fifty-attempt session, which is max_timeout_hours' role.
# Writing 6 into budget_hours would encode a 300 hour session.
[metadata.optimization]
max_timeout_hours = 6.0
max_timeout_role = "refinement-loop terminator across attempts"
budget_hours = 0.12
budget_hours_minutes = 7.2
budget_hours_role = "per-attempt completion bound"
budget_hours_state = "provisional"
max_attempts = 50
max_attempts_ceiling = 100
final_selection = "best"
final_selection_k = 50
budget_envelope = "one H100, single accelerator, no multi-GPU scaling"
budget_margin = "10 percent"
compute_envelope = "one-H100"
compute_envelope_accelerators = 1
solver_egress = "setup-only"
reward_schema = "float"

[metadata.reward]
kind = "continuous"
dtype = "float"
minimum = 0.0
maximum = 1.0
full_reward = 1.0
binary = false
form = "score = min(max(raw, 0.0), 1.0)"
raw = "(control_arm_loss - graded_loss) / (control_arm_loss - reference_floor_loss)"
full_reward_rule = "Reaching the floor scores exactly 1.0 and beating it also scores 1.0. The floor is a bar, not a point on a gradient."
written_to = "/logs/verifier/reward.txt"
reason_written_to = "/logs/verifier/score.json"
zero_attribution = "every zero carries a machine-readable reason field in the score document"
# Anchors. This family's are UNMEASURED. The schema is bound in full and the two numbers are
# declared absent rather than invented. The graded ladder's two ends are measured inside the
# same run by the harness and are NOT the family anchors. No cross-run comparability is
# claimed from them.
ladder_state = "run-local-measured"
ladder_control_arm = "the frozen default mixture trained under the identical freeze"
ladder_reference_floor = "the harness-owned reference recipe under the identical freeze"

[metadata.readout]
graded_quantity = "validation loss on the frozen held-out split, computed by the verifier from harness-owned weights at the bound evaluation point"
never = "never a number the submission reported, never a number in its stdout, never a field it wrote, never a smoothed readout"
smoothing_on_graded_path = "prohibited, graded by checker graded_readout_unsmoothed"
sustained = "the level must hold at the bound point and at every verifier-scheduled sustain point"
early_stop = "graded as not having established the loss, with reason early-stop-not-a-result, never as an absent result"

[metadata.record_displacement]
control = "deterministic behavioural recipe fingerprint over the submitted curation plan"
compared_against = "environment/exclusion_set.json, the pinned exclusion set of published mixture baselines"
runs_at_stage = 3
training_runs_at_stage = 5
cost_of_a_rejected_replay = "zero accelerator time"
behavioural_not_textual = "the fingerprint characterises what the recipe does to a frozen 48-document probe pool, so a renamed or reordered restatement of a published mixture is still caught. Source-level paraphrase does not defeat it."
network_denial_is_not_the_control = "mirrors, caches, paraphrased write-ups and model weights all carry a recipe past any deny-list, so the deny-list is hygiene and the deterministic screen is the control"

[metadata.refinement_loop]
enabled = true
iteration_contract = "the harness lets the agent solve and submit, grades the submission, summarizes the trajectory, and starts the next iteration carrying every prior approach and its reward"
trajectory_rubrics = "tests/rubrics.jsonl"
bounds = "metadata.optimization.max_attempts and metadata.optimization.final_selection carry the attempt cap and the selection rule; they are not restated here."

[metadata.difficulty]
tier_target = "Frontier-defeat"
tier_exemption_granted = "none"
anchorable_tier = "capped below Hard"
perception_axis_exemption = "This task family is text and code only, so the Perception axis carries no category; the exemption is batch-level, recorded once, closes by nothing, and no perception lever is authored to fill it. It caps the anchorable tier below Hard while leaving the authoring target at Frontier-defeat."
tier_claimed = "none"
difficulty_claim = "none is made anywhere in this bundle"
disposition = "HOLD:PILOT_REQUIRED"

[metadata.verification]
checkers = "tests/checkers.yaml"
compiled_rubric = "tests/test_output.py"
reference_rubric = "solution/rubrics.json"
trajectory_rubrics = "tests/rubrics.jsonl"
oracle = "solution/solve.sh"
derivation_source = "solution/grounding.yaml"
recompute = "solution/recompute.py"
policy_manifest = "solution/policy.yaml"

[metadata.build]
dockerfile = "environment/Dockerfile"

[metadata.frozen]
trainer = "environment/frozen_train.py"
recipe_interface = "environment/recipe_api.py"
raw_pool = "environment/raw_pool.json"
probe_pool = "environment/probe_pool.json"
held_out_split = "environment/held_out_split.json"
exclusion_set = "environment/exclusion_set.json"
published_mixtures = "environment/published_mixtures.md"
token_budget_tokens = 419430400
model = "frozen-decoder-12L-768d"
optimizer = "frozen-adamw-cosine"
evaluation_split_id = "val-split-b"

[agent]
# Solver egress is OPEN inside the sandbox: the agent fetches its own packages, datasets
# and models. The deny-list below is upstream hygiene carried by name. It is NOT a
# containment proof and is never presented as one.
solver_egress = "setup-only"
solver_egress_deny = ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"]
network_mode = "none"
timeout_sec = 21600.0
writable = ["/workspace/submission"]

[verifier]
# The verifier surface keeps the bound network policy. The two surfaces differ by design.
egress = "denied"
network_mode = "none"
timeout_sec = 1800.0
entry_point = "tests/test.sh"
reward_path = "/logs/verifier/reward.txt"
score_document_path = "/logs/verifier/score.json"

[environment]
docker_image = "pytorch/pytorch@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407"
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 40960
# Provisioning egress. Denying it here would leave the task unable to install.
network_mode = "public"
env = { OER10_RUN_RECORD = "/telemetry/run_record.json", OER10_SUBMISSION = "/workspace/submission/recipe.py" }
