  authored_here_as_design_bounds: [synthetic_tokens_per_step, fineweb_tokens_per_step, sustain_tolerance, evaluation_relative_tolerance]
  authored_here_note: >-
    Those four are DESIGN bounds and not measurements, and are named as such so nobody reads
