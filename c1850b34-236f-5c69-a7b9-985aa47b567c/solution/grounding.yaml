# One planted defect per fixture, so exactly one checker fires and the reason it emits is
# unambiguous. A fixture carrying two defects would attribute a zero to whichever gate
# happened to run first, which is how a checker stops being evidence about itself.
fixtures:
  - id: neg-budget-overspend
    fires: training_budget_respected
    reason: training-budget-overspent
    patch: {training.steps_fed: 4000}
  - id: neg-smoothed-readout
    fires: graded_score_unsmoothed
    reason: graded-readout-smoothed
    patch: {graded.smoothing: "ema-0.9"}
  - id: neg-unsustained-spike
    fires: score_sustained_across_eval_points
    reason: score-not-sustained
    patch: {raw_scores: [0.0250, 0.0370, 0.0376]}
  - id: neg-early-stop
    fires: early_stop_not_a_score
    reason: early-stop-without-sustained-score
    patch: {training.completed: false, training.halted_at_step: 2438}
  - id: neg-foreign-checkpoint
    fires: evaluated_weights_harness_owned
    reason: evaluated-weights-not-harness-owned
    patch: {graded.weights_sha256: "@foreign"}
  - id: neg-grading-tree-mutated
    fires: grading_tree_immutable
    reason: grading-tree-mutated
    patch: {grading_tree.digest_after: "@mutated"}
  - id: neg-benchmark-read-during-generation
    fires: benchmark_unread_on_generation_path
    reason: benchmark-read-before-generation
    patch: {events.swap: [generation-finished, benchmark-loaded]}
  - id: neg-submission-reported-score
    fires: graded_score_from_harness_state
    reason: graded-score-taken-from-submission-report
    patch: {graded.source: "submission-report"}
  - id: neg-verbatim-benchmark-emitter
    fires: heldout_contamination_absent
    reason: heldout-item-reproduced
    patch:
      samples.append:
        text: "The Antikythera mechanism is a geared bronze device recovered from a Roman-era shipwreck near Crete. Its surviving fragments carry inscriptions describing lunar and eclipse cycles, and the tooth counts of its gears encode the Metonic period."
  - id: neg-paraphrased-near-duplicate-emitter
    fires: heldout_contamination_absent
    reason: heldout-item-reproduced
    patch:
      samples.append:
        text: "Antikythera mechanism: a bronze geared device recovered near Crete from a Roman-era shipwreck. Surviving fragments carry inscriptions describing eclipse and lunar cycles, while gears tooth counts encode the Metonic period."

# Each stale control is the fixture whose verdict flips when a pre-mutation bound value is
# carried forward past a silent mutation. `stale` is the pre-mutation binding under which
# the fixture reads clean; `live` is the post-mutation binding under which it reads dirty.
stale_controls:
  - id: ctl-contamination-verdict-under-loose-threshold
    mutation: tighten-near-duplicate-threshold
    checker: heldout_contamination_absent
    sample:
      text: "The Antikythera mechanism is a geared bronze device recovered near Crete. Its fragments carry inscriptions describing lunar cycles, and its gears encode a calendar period that ancient astronomers tracked."
    stale: {near_duplicate_threshold: 0.6, normalization_profile: content-token-set-v2-stopword-drop}
    live: {near_duplicate_threshold: 0.45, normalization_profile: content-token-set-v2-stopword-drop}
    similarity_against: b01
    measured_similarity_v2: 0.5517
  - id: ctl-contamination-verdict-under-v1-normalization
    mutation: extend-normalization-to-drop-stopwords
    checker: heldout_contamination_absent
    sample:
      text: "Antikythera mechanism, bronze geared device, Roman-era shipwreck, Crete, surviving fragments, inscriptions, describing, lunar, eclipse, cycles, tooth, counts, gears, encode, Metonic, period, recovered, device."
    stale: {near_duplicate_threshold: 0.6, normalization_profile: content-token-set-v1}
    live: {near_duplicate_threshold: 0.6, normalization_profile: content-token-set-v2-stopword-drop}
    similarity_against: b01
    measured_similarity_v1: 0.5882
    measured_similarity_v2: 0.7407
    isolation_note: >-
      The threshold is held at its pre-mutation 0.6 on both sides, because this control
      isolates the normalization mutation, which is applied before the threshold is
      tightened. The sample keeps every rare content token of the held-out document and
      drops its function words, so under content-token-set-v1 the extra distinct carrier
      words in the held-out document dilute the union and the pair reads clean at 0.5882,
      while under the stopword drop the two content sets converge and the pair reads dirty
      at 0.7407. That is precisely the reconstruction the stopword drop closes.
  - id: ctl-sustain-verdict-under-two-points
    mutation: tighten-sustain-window
    checker: score_sustained_across_eval_points
    raw_scores: [0.0250, 0.0370, 0.0376]
    stale: {sustain_points_required: 2}
    live: {sustain_points_required: 3}
  - id: ctl-budget-verdict-under-4000-steps
    mutation: reduce-frozen-train-steps
    checker: training_budget_respected
    steps_fed: 4000
    tokens_fed: 2097152000
    stale: {frozen_train_steps: 4000, max_tokens_fed: 2097152000}
    live: {frozen_train_steps: 3250, max_tokens_fed: 1703936000}
    coupling_note: >-
      max_tokens_fed moves with frozen_train_steps on both sides because the ceiling is the
      product of the step budget and the frozen 524288 tokens per step, so a control that
      moved one and not the other would test an arithmetic inconsistency rather than the
      mutation it names.

trajectory:
  - step: 1
    action: read instruction.md, environment/GENERATOR_CONTRACT.md and environment/nanogpt_substrate.json
    observation: the graded quantity is the verifier's own held-out measurement of a real snapshot of the frozen 12-layer 768-dim decoder; the architecture, the budget, the mix and the optimizer are all frozen and the held-out split is absent from the surface and screened against
  - step: 2
    action: work out what the free axis actually buys, given the generator owns 131072 of the 524288 tokens in every step
    observation: one quarter of a real pretraining corpus, so what pays is text that transfers to held-out web prose rather than anything tuned to a remembered item
  - step: 3
    action: choose a subject space and a frame space belonging to the generator rather than to any remembered document set
    observation: sixteen subjects crossed with four frames, 64 documents, well inside the 2000-document cap
  - step: 4
    action: emit one ordinary expository document per cell, with varied paragraph structure across the frames
    observation: no held-out document is needed, seen or approximated, and the screen has nothing to catch
  - step: 5
    action: run a short pass with environment/trainer.py against a split built by hand, then submit
    observation: the local pass is telemetry; the harness trains the frozen 3250-step budget and the verifier measures the held-out score itself

rubrics_solution:
  - id: covers-the-declared-space
    criterion: The reference emits at least one document for every cell of the subject and frame space it declares.
    reference_answer: 16 subjects crossed with 4 frames, 64 documents emitted, inside the 2000-document cap.
  - id: content-is-its-own
    criterion: The reference's subjects and prose come from a space it declares, not from any held-out document.
    reference_answer: Sixteen authored subject tuples and four authored frames, composed by a pure function of those tables. Measured on this host by running the real screen over the real 512-document held-out split, the peak similarity is 0.0596 against fineweb-val-353, well below the bound threshold of 0.45.
  - id: no-benchmark-read
    criterion: The reference opens no file other than the output path it was given.
    reference_answer: One open() call, on args.out.
  - id: reports-without-claiming
    criterion: A self-reported number, if printed, is marked as ungraded and does not match the measurement, so nothing downstream can be tempted to carry it.
    reference_answer: Prints REPORTED_SCORE=0.037500, which is a declared placeholder on the exp(-val_loss) scale and not a measurement; the verifier's own measurement is what is graded and the divergence between the two is recorded.
  - id: document-format-respected
    criterion: Every emitted line is a JSON object carrying a non-empty text field inside the bound character ceiling, so nothing is dropped as unusable.
    reference_answer: 64 lines, each a single-key object, each document well under the 65536-character ceiling.

truth:
  what_is_graded: >-
    The held-out FineWeb benchmark score of the canonical nanoGPT decoder the harness trained
    on shards mixing the submitted documents with FineWeb10B, which is exp(-val_loss) over a
    held-out FineWeb validation split, measured by the verifier in its own process by
    reloading the parameter snapshot the harness held at the bound evaluation point and
    running the held-out forward pass again, sustained across the last three
    verifier-scheduled points.
  what_is_not_graded: >-
    Anything the submission printed, wrote, or claimed. The reported number is parsed only
    so the divergence against the measurement can be recorded.
  why_the_screen_is_load_bearing: >-
    The held-out split is the reward, so reproducing it is the highest-value attack.
    Isolation removes the read, but recall and reconstruction do not need a read, so the
    screen operates on emitted documents and catches the effect whatever its provenance.
  known_limits:
    - The anchor pair is unmeasured, so a live graded run resolves to 0.0 with the reason anchors-unmeasured until it is measured.
    - No graded run has been executed on this host, so every reference quantity that needs one is absent rather than measured, and the fixture readings are declared values on the exp(-val_loss) scale rather than observations. What was measured is the contamination screen, which needs no accelerator.
    - The single-accelerator wall clock of the frozen 3250-step budget under this mix is unmeasured, so the verifier timeout is a declared bound and not a measured one, under gap-oer-17-verifier-wall-clock-unmeasured.
    - A generator trained on a distinct-but-adjacent public corpus is not contamination of this held-out split and is not screened out.
    - Whether an agent recalled the held-out documents from pretraining is not measurable from frozen bytes; only what it emitted is, and that is screened.
    - The held-out split and the FineWeb10B train shards are drawn from the same upstream corpus, so a generator that reproduces generic FineWeb style is rewarded and only near-duplicate documents are refused; the screen bounds reproduction, not resemblance.

gaps_opened_by_this_rebase:
  - id: gap-oer-17-verifier-wall-clock-unmeasured
    statement: >-
      The graded run is 3250 steps at 524288 tokens per step on one H100, and no wall clock
      for it under this mix has been taken on the reference machine. task.toml binds
      [verifier] timeout_sec = 21600.0, which is the session bound rather than a measured
      completion time. The number is declared and labelled as declared; it is not an estimate
      dressed as an observation.
    closes_by: running the frozen budget once on the reference machine and recording the wall clock.
  - id: gap-oer-17-reference-unmeasured
    statement: >-
      solution/reference.py has never been run through the graded path, so its held-out
      benchmark score and its divergence from the verifier's measurement are absent. What HAS
      been measured on this host is its contamination screen, which reads clean at a peak
      similarity of 0.0596 against the real 512-document split, and its output format, which
      parses to 64 usable documents through tests/runner.py. Neither says anything about what
      this corpus does to a real decoder, and that is the part still open.
    closes_by: one graded run of the reference on the reference machine.

