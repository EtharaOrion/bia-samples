    near the record-set target of 3.28 reads about 0.0376, and it is not the 0.05 the same key
    held on the pre-rebase conversion-accuracy scale. evaluation_relative_tolerance is the
    agreement tolerance between the in-loop reading and the verifier's recomputation from the
