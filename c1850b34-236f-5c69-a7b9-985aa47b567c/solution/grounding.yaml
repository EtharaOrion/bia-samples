schema: forge.grounding/v1
# The single private derivation source for this slot. solution/recompute.py derives the
# golden trajectory, the checker fixtures, solve.sh, TRUTH.md, rubrics.json and
# tests/test_output.py from this file and from nothing else. No model, no network, no
# clock, no locale and no random source is reachable from that derivation, and running
# it twice over frozen bytes produces byte-identical output. `recompute.py --check`
# regenerates in memory and exits non-zero on any drift.

slot: OER-17
provisional_identifier: OER-17
family: F14
family_title: synthetic data generation
archetype: grader-integrity
title: Generator graded on a real held-out benchmark it must not touch
metric: held-out FineWeb benchmark score of the canonical nanoGPT decoder trained on shards mixing the agent's generated documents with FineWeb10B
metric_definition: exp(-val_loss), where val_loss is the mean per-token cross entropy the harness-owned parameter snapshot assigns to the held-out FineWeb validation documents; the interval is (0.0, 1.0] and higher is better
direction: higher
frozen: the architecture, the training budget, the corpus mix, the optimizer, the held-out benchmark
free: the synthetic data generator the agent writes

substrate:
  declaration_version: nanogpt-substrate-v1
  agent_visible_replica: environment/nanogpt_substrate.json
  verifier_copy: tests/nanogpt_substrate.json
  replicated_from: .seed/nanogpt_substrate.json, byte for byte, sha256 80d0cdd9a66e735c73214cc4bc18b434b0eb4d64f682a5a1cf3545cce3f6026e
  authority: >-
    requirements/bia-environment-spec.md, under "The nanoGPT framework is mandatory", admits
    a family only when its metric resolves against a nanoGPT run. This slot's metric does:
    the graded scalar is a held-out evaluation of a real parameter snapshot of the canonical
    12-layer 768-dim decoder, trained on shards the submitted generator half owns.
  replication_rather_than_reference: >-
    FORGE.md rule 10 forbids a slot from reading, writing or depending on a sibling slot's
    bundle bytes, and a bundle's name is a hash over its own tree, so a shared file outside
    the tree would leave the name underdetermined. Both copies therefore live inside this
    bundle.
  what_the_rebase_replaced: >-
    The pre-rebase bundle trained a per-conversion log-factor scalar on unit-conversion
    prompt and answer pairs and scored the fraction of held-out conversions answered within
    a relative tolerance. That surrogate was not a model at all: it had no forward pass, no
    parameter tensor and no architecture, so it failed the first and third parts of the
    simulator test. Repinning a declaration would not have fixed it, so the training path and
    the evaluation path were both replaced. This is recorded as a replacement rather than as
    a repin.

screening_block_staleness_note: >-
  The frozen `screening` block at the foot of this file is left byte for byte as it was. It
  is a generated carrier over the PRE-REBASE delivery closure: its sanitization_closure
  member list records the sizes and digests of files this overlay replaces, and its
  near-duplicate result scored a solution/reference.py that no longer exists. Rewriting
  those digests to match the new bytes would be recording a screening determination over
  bytes nothing screened, which is a fabricated result and worse than a visible staleness.
  The block is therefore stale and marked stale here, and re-screening the rebased closure
  is the orchestrator's step and not this lane's.

identity_note: >-
  No canonical_content_hash, no uuid5, no final uuid directory name, no canary token, no
  provenance carrier and no signature file is produced by this lane. The provisional
  identifier is the slot id. Wave 2 does identity for every slot at once, because adding
  solution/policy.yaml to an already-committed bundle moves its hash too.

solver_egress_divergence:
  bound_here: open
  bound_in_contract: setup-only
  contract_path: seed/contract.yaml batch.optimization_bindings.solver_egress
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving
    agent full internet access.
  reading_b: >-
    the same document line 122 says internet is needed only for setup, and
    requirements/bia-environment-spec.md line 247 takes the stricter reading, which is
    what the contract field records.
  resolution_here: >-
    task.toml binds [agent] solver_egress = "open" with the upstream deny-list, and
    [verifier] egress = "denied". The family delivery.network_policy block in the same
    contract binds agent_environment egress allowed with that deny-list, so the open
    reading is the one this bundle is built against. This lane does NOT amend the
    batch-level field; the divergence is recorded here and stays visible.
  deny_list_is_not_containment: >-
    ["github.com", "raw.githubusercontent.com", "objects.githubusercontent.com"] is a
    deny-list, not a containment proof. Mirrors, caches, paraphrased write-ups and model
    weights all carry a recipe past any deny-list, which is exactly why the deterministic
    near-duplicate screen in tests/checkers.py is the load-bearing control and the network
    policy is not.

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  authority: seed/contract.yaml families.entries.F14 carries scope null and scope_state unscoped
  never_invented: >-
    No baseline_metric or target_metric number is authored anywhere in this bundle. The
    reward schema is fully bound and the pair is declared absent.
  substrate_anchors_are_not_family_anchors: >-
    nanogpt_substrate.json carries the upstream record anchors, record 36 at 3250 steps and
    3.2787 val loss over ten seeds and record 46 at 2690 steps and 3.2783 over eight. Those
    are the optimizer track's step-count anchors over the unmixed corpus. This family's
    baseline_metric and target_metric are a held-out benchmark score under a MIXED corpus and
    remain unmeasured. Reading one as the other would be an invented anchor wearing a
    citation, which is why the distinction is written down here.
  fixture_anchors:
    used_by: seed/tasks/OER-17/adequacy.py only
    baseline_metric: 0.020
    target_metric: 0.040
    role: >-
      These two numbers exist so the reward FUNCTION and the gate chain can be exercised
      end to end to a full 1.0 on the reference. They are declared inside the fixture, are
      never read from tests/checkers.yaml, and are not this family's anchors. They sit on
      the exp(-val_loss) scale the rebase moved the metric onto, so the fixture exercises
      the arithmetic the live formula would do rather than arithmetic on a stale scale. The
      substitution is recorded in tests/checkers.yaml and in feasibility.yaml.

