schema: forge.grounding/v1
slot: OER-23
provisional_identifier: OER-23
family: F11
family_title: inference serving throughput
archetype: AR1
archetype_title: Long-Horizon State Collapse
title: Sustained throughput tuning under a p99 latency service level objective

# This file is the SINGLE derivation source for slot OER-23. solution/recompute.py
# derives, from this file and the frozen simulator alone: the frozen substrate under
# environment/, the verifier-owned substrate fixture, the golden trajectory, the checker
# fixtures, solution/solve.sh, solution/TRUTH.md, solution/rubrics.json and
# tests/test_output.py. Nothing generated is hand-edited.
#
# recompute.py invokes no model, no network, NO CLOCK, no locale and no random source.
# The clock ban is absolute even though this task's metric is timing: the golden
# telemetry is a RECORDED FIXTURE produced by a deterministic tick-clock simulator over
# a frozen trace, never a live measurement. A live measurement would make the golden
# artifact host-dependent and the recompute non-idempotent, which is the one property
# the whole derivation rests on.

banner: "GENERATED SECTION. DO NOT HAND-EDIT."
banner_source: solution/grounding.yaml

metric:
  name: tokens per second
  direction: higher
  statement: >-
    Sustained output tokens per second over the frozen request trace, subject to a hard
    p99 per-output-token latency service level objective. The objective is a constraint,
    not a penalty term: a configuration that exceeds it scores zero however fast it is.
  reward_formula: raw = (agent_metric - baseline_metric) / (target_metric - baseline_metric)
  clip: score = min(max(raw, 0.0), 1.0)
  full_reward: 1.0
  binary: false

anchors:
  anchors_state: absent
  gap: gap-oer-per-family-anchors-unmeasured
  baseline_metric: null
  target_metric: null
  statement: >-
    Family F11 is registered in seed/contract.yaml families.entries.F11 with
    scope_state unscoped and scope null. No published baseline or target throughput
    exists for this family, so this slot binds the reward SCHEMA in full and declares the
    published anchors ABSENT rather than inventing two numbers to fill the formula.
  endpoints_used_for_local_grading:
    kind: computed calibration endpoints, not published anchors
    baseline_endpoint: >-
      the tokens per second of the shipped default serving configuration, measured by the
      verifier's own simulator over the frozen trace at grade time
    target_endpoint: >-
      the highest tokens per second among the objective-feasible configurations of the
      frozen lattice, measured by the verifier's own simulator by exhaustive enumeration
      at grade time
    no_number_is_authored: >-
      Neither endpoint appears as a literal anywhere in this bundle. Both are recomputed
      from frozen bytes on every grading run, so no author-chosen figure can drift into
      the reward denominator.

clock_ownership:
  owner: the harness
  statement: >-
    The metric of this slot is timing and the contract forbids a checker from reading a
    clock. Both hold at once because ownership is split. The harness owns a virtual
    integer tick clock, advances it inside the serving loop, and writes the result into
    timing telemetry records. Every checker reads those harness-owned records through a
    real harness handle and never calls a clock itself.
  consequence: >-
    Every checker is pure, deterministic and replayable over the recorded trace, so the
    same submission grades identically on any host under any load. A checker that timed
    the run itself would make the verdict a function of host contention.
  enforced_by: harness_owns_the_clock

substrate:
  kind: deterministic discrete-event simulator
  gap: gap-oer23-substrate-is-a-simulator
  declared: true
  statement: >-
    The serving substrate is a deterministic discrete-event simulator, not a live
    inference server. This is the right choice here because it makes grading reproducible
    and lets a checker read timing without a clock. It is never allowed to pass as a live
    measurement, and reference_hours therefore covers simulated serving only.

trace:
  generator: fixed integer linear recurrence, not a random source
  recurrence: "x <- (1103515245 * x + 12345) mod 2^31"
  seed: 20260825
  count: 200
  mean_gap_ticks: 12
  gap_expression: "1 + (draw mod (2 * mean_gap_ticks - 1))"
  prompt_expression: "96 + (draw mod 416)"
  output_expression: "12 + (draw mod 52)"
  # The same recurrence and the same three expressions as closed integers. recompute.py
  # reads them from here instead of carrying constants of its own, and the verifier-owned
  # seed_derivation block of tests/fixtures/substrate.json is derived from exactly these.
  multiplier: 1103515245
  increment: 12345
  modulus: 2147483648
  prompt_base: 96
  prompt_span: 416
  output_base: 12
  output_span: 52
  seed_is_a_discovery_value: >-
    The seed appears on no agent-visible byte and its consequence does: the whole frozen
    request stream, two hundred arrival ticks, prompt lengths and output lengths. The
    graded checker trace_is_seed_derived re-derives that stream from the seed held on the
    verifier side and refuses a built environment whose trace does not reproduce it, so a
    seed that moves moves the graded outcome. The checker never asserts the integer
    itself, which would only re-read a constant; it asserts what the integer produced.

hardware:
  step_base_ticks: 8
  step_slot_ticks: 3
  step_slot_div: 4
  prefill_tokens_per_tick: 24
  chunk_tokens: 48
  chunk_penalty_ticks: 2
  accelerators: 1
  tick_seconds_num: 1
  tick_seconds_den: 1000
  envelope: one H100, single accelerator, no multi-GPU scaling

objective:
  p99_tpot_centiticks: 1800
  statement: >-
    The graded tail is the 99th percentile, over every request in the frozen trace, of the
    per-output-token decode latency measured in hundredths of a tick. It is a raw order
    statistic recomputed by the verifier and never a number a submission reported.

windows:
  count: 4
  sustain_floor_num: 1
  sustain_floor_den: 2
  statement: >-
    The verifier cuts the served span into four equal tick-width measurement windows from
    the harness-owned tick clock. Every window must carry at least one completion and at
    least half the whole-span token rate for the reading to count as sustained.

flattening:
  window: 3
  statement: >-
    After three consecutive attempts that move one configuration axis and improve nothing,
    the session owes a reallocation onto a different axis. Nothing announces that the axis
    stopped paying; the ledger is where it becomes readable.

reference_schedule:
  # The golden trajectory. Five stages, each a bounded sweep of one axis that stops after
  # two consecutive non-improving attempts, then one deliberate reallocation that reopens
  # the batch axis under the alternative prefill mode. The reallocation is the whole point:
  # coordinate descent alone flattens at the four-way batch point and never finds that
  # chunked prefill pays only jointly with a wider batch.
  - stage: batch-axis-sweep
    config: {max_batch_size: 1, scheduler: fcfs, chunked_prefill: false, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}
  - stage: batch-axis-sweep
    config: {max_batch_size: 2, scheduler: fcfs, chunked_prefill: false, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}
  - stage: batch-axis-sweep
    config: {max_batch_size: 4, scheduler: fcfs, chunked_prefill: false, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}
  - stage: batch-axis-sweep
    config: {max_batch_size: 8, scheduler: fcfs, chunked_prefill: false, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}
  - stage: batch-axis-sweep
    config: {max_batch_size: 12, scheduler: fcfs, chunked_prefill: false, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}
  - stage: scheduler-axis
    config: {max_batch_size: 4, scheduler: sjf, chunked_prefill: false, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}
  - stage: prefill-axis
    config: {max_batch_size: 4, scheduler: fcfs, chunked_prefill: true, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}
  - stage: admission-axis
    config: {max_batch_size: 4, scheduler: fcfs, chunked_prefill: false, admission_policy: defer_when_full, max_queue_depth: 16, stop_after_requests: null}
  - stage: admission-axis
    config: {max_batch_size: 4, scheduler: fcfs, chunked_prefill: false, admission_policy: drop_when_full, max_queue_depth: 16, stop_after_requests: null}
  - stage: admission-axis
    config: {max_batch_size: 4, scheduler: fcfs, chunked_prefill: false, admission_policy: defer_when_full, max_queue_depth: 64, stop_after_requests: null}
  - stage: reallocation-joint-batch-and-prefill
    config: {max_batch_size: 8, scheduler: fcfs, chunked_prefill: true, admission_policy: defer_when_full, max_queue_depth: 16, stop_after_requests: null}
  - stage: reallocation-joint-batch-and-prefill
    config: {max_batch_size: 12, scheduler: fcfs, chunked_prefill: true, admission_policy: defer_when_full, max_queue_depth: 16, stop_after_requests: null}
  - stage: reallocation-joint-batch-and-prefill
    config: {max_batch_size: 16, scheduler: fcfs, chunked_prefill: true, admission_policy: defer_when_full, max_queue_depth: 16, stop_after_requests: null}
  - stage: confirmation
    config: {max_batch_size: 8, scheduler: sjf, chunked_prefill: true, admission_policy: defer_when_full, max_queue_depth: 16, stop_after_requests: null}
  - stage: confirmation
    config: {max_batch_size: 8, scheduler: fcfs, chunked_prefill: true, admission_policy: defer_when_full, max_queue_depth: 64, stop_after_requests: null}
  - stage: confirmation
    config: {max_batch_size: 8, scheduler: fcfs, chunked_prefill: true, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}

control_schedules:
  greedy_single_axis_sweep:
    statement: The whole budget spent on one axis. Refused by the ordering checker.
    axis: max_batch_size
  early_stop:
    stop_after_requests: 60
  drop_to_flatter_p99:
    admission_policy: drop_when_full
    max_queue_depth: 16
  exceed_slo_for_throughput:
    max_batch_size: 32
  reseeded_trace:
    statement: >-
      The same recurrence, the same count and the same three expressions, advanced from a
      different starting state. Every arrival tick, every prompt length and every output
      length moves with it, so the environment it builds is a different environment.
      trace_is_seed_derived carries this as its rejecting half.
    seed: 20260826
  pre_tightening_slo_stale:
    statement: >-
      The verdict computed under the pre-tightening objective of 1900 centiticks, carried
      forward after the announced tightening to 1800.
    stale_objective_p99_tpot_centiticks: 1900
    config: {max_batch_size: 8, scheduler: fcfs, chunked_prefill: false, admission_policy: accept_all, max_queue_depth: 16, stop_after_requests: null}

solver_egress_divergence:
  bound_in_task_toml: open
  batch_field_reading: setup-only
  gap: gap-oer-solver-egress-ruled-stricter
  reading_a: >-
    requirements/open-ended-research-optimisation-problems.md line 58 grants the solving
    agent full internet access.
  reading_b: >-
    requirements/open-ended-research-optimisation-problems.md line 122 says internet is
    needed only for setup; requirements/bia-environment-spec.md line 247 takes the
    stricter reading, and seed/contract.yaml batch.optimization_bindings.solver_egress
    therefore currently reads setup-only.
  bound_here: >-
    This lane binds solver_egress = open at the agent surface, per the lane spec, and
    keeps the verifier surface at egress denied. The two surfaces differ by design.
  batch_field_not_amended: >-
    This lane does not amend seed/contract.yaml. The divergence is recorded here rather
    than resolved silently.
  deny_list_is_not_a_containment_proof: >-
    Mirrors, caches, paraphrased write-ups and released artifacts all carry a recipe past
    any deny-list. The deterministic checker chain, not the network policy, is the
    load-bearing control.

tiering:
  target_tier: Frontier-defeat
  tier_exemption_granted: none
  frontier_defeat_floor: 0.50
  separation_margin: 0.05
  perception_axis_exemption: >-
